<style>
:root{--ink:#10131C;--panel:#191E2C;--panel2:#141928;--line:#2A3145;--bone:#E9E5DA;
 --muted:#7F89A0;--sodium:#F4A63A;--flag:#E45B4E;--turf:#46B583;--vote:#8B9FE8;
 --cond:'Barlow Condensed',Impact,sans-serif;--body:'Barlow',system-ui,sans-serif;
 --mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--bone);font-family:var(--body);
 -webkit-font-smoothing:antialiased;padding-bottom:176px}
#app{max-width:760px;margin:0 auto}
.mast{padding:26px 16px 16px;border-bottom:1px solid var(--line)}

.topbar{display:flex;justify-content:space-between;align-items:center;padding:11px 16px 9px}

.tb-rk{color:var(--sodium);margin-left:6px}
.tabs{display:flex;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}

.tab[aria-selected="true"]{color:var(--bone);border-bottom-color:var(--sodium)}

 outline-offset:2px}

.stoprec{font-family:var(--mono);font-size:12px;color:#B4BCCB;flex:0 0 62px;text-align:right}
.ygrade{font-family:var(--cond);font-size:17px;font-weight:700;color:var(--sodium);
 flex:0 0 26px;text-align:center}
.news{padding:11px 16px;border-bottom:1px solid rgba(42,49,69,.55);
 border-left:3px solid var(--line)}
.news.flag{border-left-color:var(--flag)}
.news.gold{border-left-color:var(--sodium);background:rgba(244,166,58,.06)}
.news.muted{border-left-color:var(--line)}
.nh{font-family:var(--cond);font-size:19px;font-weight:600;line-height:1.15}
.nb{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.depth{display:flex;border-bottom:1px solid var(--line)}
.depth.out{background:rgba(228,91,78,.06)}
.dpos{font-family:var(--mono);font-size:10px;color:var(--sodium);width:46px;flex:0 0 46px;
 padding:12px 0 0 16px;letter-spacing:.06em}
.dbody{flex:1;min-width:0}
.prow2.bk{border-bottom:none;padding-top:4px;opacity:.78}
.prow2.bk .pname.sm{font-size:15px;font-weight:500}
.prate.sm{font-size:11.5px;color:var(--muted)}
.startag{font-family:var(--mono);font-size:8px;color:var(--turf);border:1px solid var(--turf);
 padding:1px 3px;margin-left:5px;vertical-align:middle}
.promo{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
 background:none;border:1px solid var(--line);color:var(--muted);padding:5px 7px;cursor:pointer;
 flex:0 0 auto;margin-right:8px}
.promo:hover{border-color:var(--sodium);color:var(--sodium)}
.prow2{display:flex;align-items:center;gap:10px;padding:9px 16px;
 border-bottom:1px solid rgba(42,49,69,.55)}
.prow2.out{background:rgba(228,91,78,.09)}
.ppos{font-family:var(--mono);font-size:10px;color:var(--sodium);width:38px;flex:0 0 38px;
 letter-spacing:.06em}
.prow2 .pmain{flex:1;min-width:0}
.rbar{width:52px;height:4px;background:var(--line);flex:0 0 52px;display:block}
.rbar i{display:block;height:100%;background:var(--sodium)}
.prow2.out .rbar i{background:var(--flag)}
.prate{font-family:var(--mono);font-size:13px;width:24px;text-align:right;flex:0 0 24px}
.outtag{color:var(--flag)}
.iwho{flex:1;min-width:0}
.pp{font-family:var(--mono);font-size:10px;color:var(--sodium);margin-left:5px}
.attn{display:flex;align-items:center;gap:10px;margin:0 16px 8px;padding:12px 14px;
 border:1px solid var(--vote);background:rgba(139,159,232,.09)}
.attnmain{flex:1;min-width:0}
.attnbtn{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
 background:none;border:1px solid var(--vote);color:var(--vote);padding:8px 10px;cursor:pointer;
 flex:0 0 auto}
.attnbtn:hover{background:rgba(139,159,232,.18)}
.attnbtn.flag{border-color:var(--flag);color:var(--flag)}
.attnbtn.flag:hover{background:rgba(228,91,78,.15)}
.staffbar{margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.staffbar.plain{margin:0;padding:10px 16px 12px;border-top:1px solid var(--line)}
.stline{display:flex;align-items:baseline;gap:8px;padding:3px 0}
.stlab{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--sodium);
 flex:0 0 20px}
.stn{font-family:var(--cond);font-size:15px;font-weight:600;flex:0 0 auto}
.sts{font-family:var(--mono);font-size:9.5px;color:var(--muted);flex:1;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stq{font-family:var(--mono);font-size:11px;color:var(--muted);flex:0 0 auto}
.stq.up{color:var(--turf)}.stq.dn{color:var(--flag)}
.coachbar{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;
 border-top:1px solid var(--line)}
.coachbar.plain{border-top:1px solid var(--line);margin-top:12px;padding-top:11px}
.cleft{flex:1;min-width:0}
.cname{font-family:var(--cond);font-size:18px;font-weight:600}
.cmeta{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:1px;
 letter-spacing:.05em;text-transform:uppercase}
.seat{font-family:var(--mono);font-size:9px;letter-spacing:.12em;padding:3px 6px;
 border:1px solid;flex:0 0 auto}
.seat.hot{color:var(--flag);border-color:var(--flag)}
.seat.warm{color:var(--sodium);border-color:var(--sodium)}
.seat.cool{color:var(--muted);border-color:var(--line)}
.bnews{font-size:12.5px;color:var(--bone);margin-top:10px;padding-top:10px;
 border-top:1px solid rgba(139,159,232,.3);line-height:1.45}
.bnews.flag b{color:var(--sodium)}
.bnews.small{font-size:11.5px;color:var(--muted);border-top:none;padding-top:0;margin-top:5px}
.tpick:hover{background:rgba(244,166,58,.07)}
.backbtn{background:none;border:none;color:var(--sodium);font-family:var(--mono);
 font-size:11px;letter-spacing:.08em;padding:14px 16px 4px;cursor:pointer}
.youtag{font-family:var(--mono);font-size:8.5px;color:var(--sodium);border:1px solid var(--sodium);
 padding:1px 4px;vertical-align:middle;margin-left:5px}
.yrank{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:7px;font-weight:400}
.progline{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:12px;
 padding-top:11px;border-top:1px solid var(--line)}
.progline b{font-size:13px}
.progline .up{color:var(--turf)}.progline .dn{color:var(--flag)}
.stats>div{min-width:0}

/* ---------- desktop ---------- */
@media(min-width:1024px){
  body{padding-bottom:0}
  body.offseason{padding-bottom:120px}
  body.offseason .cols{grid-template-columns:minmax(0,1fr)}
  body.offseason #view{max-width:820px;margin:0 auto}
  #app{max-width:1340px}
  .cols{display:grid;grid-template-columns:390px minmax(0,1fr);align-items:start}
  #side{border-right:1px solid var(--line);
    position:sticky;top:92px;max-height:calc(100vh - 92px);overflow-y:auto;
    display:flex;flex-direction:column;
    scrollbar-width:thin;padding-bottom:14px}
  #side::-webkit-scrollbar{width:7px}
  #side::-webkit-scrollbar-thumb{background:var(--line)}
  .actionbar.hideWide{display:none}
  .sidebtn{padding:12px 16px 14px;position:sticky;bottom:0;
    background:linear-gradient(180deg,transparent,var(--ink) 26%);margin-top:6px}
  .sidebtn .advance{font-size:17px;padding:13px}
  .sidebtn .skip{margin-top:8px}
  #view{min-height:calc(100vh - 96px)}
  .mast{padding:44px 32px 26px}
  .mast h1{font-size:60px}
  .mast p{font-size:15px;max-width:640px}
  .topbar{padding:14px 24px 11px}
  .tb-team{font-size:25px}
  .tabs{padding-left:8px}
  .tab{flex:0 0 auto;font-size:15px;padding:12px 20px}
  .dateline{padding:20px 24px 10px}
  .dateline h2{font-size:29px}
  .grouphead{padding:20px 24px 8px}
  .news,.prow,.frow,.srow,.prow2,.injrow,.trow,.yrow,.game .gbody,.rnd,.note,.legend,
  .key,.sortbar,.subtabs,.seedrow,.chead,.crow,.digest{padding-left:24px;padding-right:24px}
  .cbar,.prow{border-left-width:3px}
  .idcard,.hero,.nextcard,.title-card,.banner,.cand,.opt{margin-left:16px;margin-right:16px}
  #side .idcard,#side .hero,#side .nextcard{margin-left:14px;margin-right:14px}
  #side .grouphead,#side .injrow{padding-left:18px;padding-right:18px}
  /* two-up game and standings grids */
  .gamegrid{display:grid;grid-template-columns:1fr 1fr;gap:0 1px;background:var(--line)}
  .gamegrid .game{background:var(--panel2)}
  .standgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
  .pickgrid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));padding:6px 24px 16px}
  .cand,.opt{cursor:pointer}
  .cand:hover,.opt:hover,.tpick:hover{background:rgba(244,166,58,.07)}
  .hint{display:block}
}
@media(max-width:1023px){ .hint{display:none} }
.hint{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.1em;
 text-transform:uppercase;padding:10px 24px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div id="app"></div>
