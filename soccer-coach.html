    const pick=answers[j], def=impactDefault(A.dp);
    if(pick===undefined||pick===def||!A.dp.opts.some(o=>o[0]===def))return;      // left to him: nothing to compare
    const cf=play(j,def);                    // the same dice, his call
    let rp=0,rd=0; for(let m=0;m<runs;m++){ rp+=score(play(j,pick,m)); rd+=score(play(j,def,m)) }
    const lab=o=>(A.dp.opts.find(x=>x[0]===o)||[o,o])[1].split(" · ")[0].split(":")[0];
    out.push({k:A.dp.k, h:A.dp.h, pick:lab(pick), def:lab(def), pk:pick, dk:def, cf:cf, worth:Math.round((rp-rd)/runs*1000)/1000});
  });
  return out;
}
/* the post-game line: the call that mattered most, in words */
/* How clear a call's verdict is, in points: graded calls (football) against the best option, the rest
   against the assistant's call. Only a clear one (beyond 7) earns the headline: a 68-67 edge read "A GOOD
   CALL, AND IT WON YOU THIS GAME" and 4-point gaps were headlined beside "close either way" (Muse, Grokbot) */
function callClarity(c){ const w=Math.round(c.worth*1000)/10;   // in tenths of a point: 0.07*100 is 7.000000000000001, which headlined a 7-point call
  if(c.q!==undefined){ if(c.sp<=3)return 0; if(c.q<-3)return c.q; return Math.max(0,w) } return w }
function impactHTML(P){
  // one verdict per call: a read is judged in the reads below, right or wrong; judged here too, against the assistant,
  // the two could disagree on one call ("a little worse" above a tick: round 39), so here it's situation calls only
  const RK={}; P.forEach(q=>(q.reads||[]).forEach(r=>{ RK[r.k]=1 }));
  const C=[].concat(...P.map(p=>(p.impact||[]).map(c=>Object.assign({res:p},c)))).filter(c=>!(c.k&&RK[c.k]));
  if(!C.length)return "";
  // the clearest call leads, the wrong ones first when as clear (a field goal praised above two crossed punts: Grokbot)
  const c=C.reduce((a,x)=>Math.abs(callClarity(x))>Math.abs(callClarity(a))||(Math.abs(callClarity(x))===Math.abs(callClarity(a))&&callClarity(x)<callClarity(a))?x:a,C[0]), p=c.res;
  const out=(m,t)=>m>t?"win":m<t?(LEAGUE.draws?"defeat":"loss"):"draw";
  const res=out(p.mine,p.theirs), alt=out(c.cf.mine,c.cf.theirs);
  const altLine=`a ${c.cf.mine}-${c.cf.theirs} ${alt}`;
  // the same scale as the graded call: within 3 points the same, 4 to 7 a little, beyond 7 clearly
  const avgOf=w=>w>0.07?"wins clearly more often than his":w>0.03?"wins a little more often than his"
    :w>=-0.03?"made little difference either way":w>=-0.07?"wins a little less often than his":"loses clearly more often than his";
  const word=x=>{ const k=callClarity(x); return k>7?"clearly better than his":k>3?"a little better than his":k<-7?"clearly worse":k<-3?"a little worse":"close either way" };
  const pickWord=x=>/assistant/i.test(x.pick)?"you left it to your assistant":`you chose "${esc(x.pick)}"`;
  const k=callClarity(c), rank={win:2,draw:1,loss:0,defeat:0}, better=rank[res]>rank[alt], worse=rank[res]<rank[alt];
  // a read is listed once, in the reads below with its right-or-wrong; listed here too under its own headline, the
  // same call read as a second call and its answer as one never offered (Grokbot, round 38: "graded on a call I never saw")
  const rest=C.filter(x=>x!==c).map(x=>`${esc(x.h)} (${pickWord(x)}): ${word(x)}`);
  const restHTML=rest.length?`<div class="impbody imprest">Your other ${rest.length===1?"call":rest.length+" calls"} tonight: ${rest.join("; ")}.</div>`:"";
  // a read graded wrong is never headlined as a good call: "A STRONG CALL" sat above a cross for the same game plan
  // (Grokbot, pro basketball); the two judge different things (against the assistant; against the truth), so then
  // the card says the plain line instead
  const crossed=P.some(q=>(q.reads||[]).some(r=>r.pick===c.pk&&r.right===false&&!r.unclear));
  if(Math.abs(k)<=7||(k>0&&crossed)){   // no headline: one plain line, sized to the gap
    const lead=Math.abs(k)<=3?`${esc(c.h)}: ${pickWord(c)}, and over many replays it was close either way &mdash; not graded, right or wrong.`   // the same footing as "a little better" (Muse)
      :`${esc(c.h)}: ${pickWord(c)}. Over many replays it was ${k>0?"a little better than":"a little worse than"} ${c.q!==undefined&&k<0?"the best option":"the assistant's"} &mdash; worth knowing, not worth a headline.`;
    return `<div class="impact quiet"><div class="impbody">${lead}</div>${restHTML}</div>`; }
  const good=k>0;
  const verdict=good?"A strong call":"The wrong call";
  // nothing more when one replay gave the same result: "though tonight's dice gave the same result either way" read as
  // "your win didn't count", and on a one-point loss as if no call mattered (Instinct, Grokbot)
  const tonight=good?(better?(res==="draw"?"and it saved you a point.":"and it won you this game."):worse?"and unlucky tonight: keep making it.":"")
                    :(better?"though it worked tonight: the other way wins more often.":worse?"and it cost you this one.":"");
  return `<div class="impact"><div class="imphead">${verdict}${tonight?", "+tonight:"."}</div>
    <div class="impbody">${esc(c.h)}: ${pickWord(c)}. Over many replays from that moment, your call ${avgOf(c.worth).replace(/ than his$/," than the assistant's (\""+esc(c.def)+"\")")}${c.q!==undefined&&c.q<-7&&c.worth>-0.07?` (and well behind the best option)`:""}.</div>${restHTML}</div>`;
    // the one same-luck replay's score is gone from the card: a 117-85 win "became a 103-116 loss" beside "a little less
    // often", and players stopped trusting the replays (Grokbot). Whether tonight turned on it stays in the headline.
}
/* the season's ledger: what your calls were worth, in wins, against leaving them to the assistant */
function ledgerLine(){
  const L=S.callLedger&&S.callLedger[SEA.year]; if(!L||!L.n)return "";
  const w=L.worth, a=Math.abs(w), say=a<0.25?"about even":`about ${w>0?"+":"−"}${a<1?(Math.round(a*10)/10):(Math.round(a*2)/2)} win${a>=0.75&&a<1.25?"":"s"}`;
  // says what it counts: every call that differed from the assistant's, graded or not (the big number
  // beside it counts only graded ones, and the two read as a contradiction: Grokbot)
  return `Every call you made differently from the assistant this season (${L.n}): ${say} against leaving ${L.n===1?"it":"them"} to him, over many replays.`;
}
/* the season's calls, in the offseason review: the tally, and the call that helped most and the
   one that cost most, in words (Instinct: a season-end summary of your decisions) */
function seasonCallsHTML(){
  const yr=SEA.year, me=S.myTeam, P=[];
  Object.keys(S.played||{}).forEach(k=>{ if(k.split(":")[0]!==String(yr))return;
    (S.played[k]||[]).forEach(p=>{ if(p.team!==me)return; (p.impact||[]).forEach(c=>{ if(typeof c.worth==="number")P.push({c:c,p:p}) }) }) });
  const t=tallyHTML();
  // only calls the card graded: a "close either way" call named "your costliest" contradicted its own card (Grokbot)
  for(let i=P.length-1;i>=0;i--){ const c=P[i].c; if(c.q!==undefined&&!(c.sp>3))P.splice(i,1) }
  P.sort((a,b)=>b.c.worth-a.c.worth);
  const one=(x,lab)=>`<div class="cand"><div class="candtop"><div><div class="fname">${lab}</div>
    <div class="fnote">${esc(x.c.h)}, against ${esc(x.p.other)} (${x.p.mine}&ndash;${x.p.theirs})</div></div></div>
    <div class="cdesc">${/assistant/i.test(x.c.pick)?"You left it to your assistant.":`You: ${esc(x.c.pick)}.`}${!x.c.def?"":/assistant/i.test(x.c.def)?" Your assistant would have left things as they were.":` Your assistant would have gone with ${esc(x.c.def)}.`}
    ${(w=>w>=1?` Why: from that moment, your choice won about ${w} more games in 100 than his${x.p.mine>x.p.theirs?"":", though the game went the other way"}.`:w<=-1?` Why: from that moment, your choice won about ${-w} fewer games in 100 than his${x.p.mine>x.p.theirs?", though you won anyway":""}.`:"")(Math.round(x.c.worth*100))}</div></div>`;
  const best=P.length&&P[0].c.worth>=0.03?P[0]:null, worst=P.length&&P[P.length-1].c.worth<=-0.03?P[P.length-1]:null;
  if(!t&&!best&&!worst)return "";
  return t+(best||worst?`<div class="grouphead">The season's big calls</div>`+(best?one(best,"Your best call"):"")+(worst&&worst!==best?one(worst,"Your costliest call"):""):"");
}
/* ============ the season card ============ */

const CARD_W = 1080, CARD_H = 1080;

function cardFit(text, max, size){
  const est = String(text).length * size * 0.52;
  return est > max ? Math.floor(size * max / est) : size;
}

/* The same season as a line of text, for anywhere an image won't go. */
function seasonCardText(h, team){
  const c={conf:h.group.name, confRec:h.group.rec, bestWin:h.bestWin, coach:h.coach.name};
  const bits=[`${team} ${h.rec} (${c.confRec} ${c.conf})`];
  if(h.champion===team)bits.push(LEAGUE.text.champions.toUpperCase());
  else if(h.honours.group)bits.push(`${c.conf} champions`);
  else if(h.pos)bits.push(h.result);
  else if(h.rank)bits.push(`finished No. ${h.rank}`);
  if(LEAGUE.cardLine){ const x=LEAGUE.cardLine(h,team); if(x)bits.push(x) }   // a league's own honour (soccer: the FA Cup)
  if(c.bestWin)bits.push(`beat ${c.bestWin.rank?"No. "+c.bestWin.rank+" ":""}${c.bestWin.opp} ${c.bestWin.score}`);
  return `${c.coach}, ${h.year}. ${bits.join(" \u2014 ")}. ${LEAGUE.text.site}`;
}

/* Rasterise the SVG to a PNG blob so it can be shared or saved as a real image. */
function cardBlob(svg){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
    img.onload=()=>{
      try{
        const cv=document.createElement("canvas");
        cv.width=CARD_W; cv.height=CARD_H;
        const cx=cv.getContext("2d");
        cx.fillStyle="#10131C"; cx.fillRect(0,0,CARD_W,CARD_H);
        cx.drawImage(img,0,0,CARD_W,CARD_H);
        cv.toBlob(b=>b?resolve(b):reject(new Error("no blob")),"image/png");
      }catch(e){reject(e)}
    };
    img.onerror=()=>reject(new Error("svg load failed"));
    img.src=url;
  });
}

async function shareCard(h, team){
  const svg=seasonCardSVG(h,team);
  const txt=seasonCardText(h,team);
  const name=`${team.replace(/[^A-Za-z]/g,"")}-${h.year}.png`;
  try{
    const blob=await cardBlob(svg);
    const file=new File([blob],name,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],text:txt});
      return "shared";
    }
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    return "saved";
  }catch(e){
    try{ await navigator.clipboard.writeText(txt); return "copied" }
    catch(_){ return "failed" }
  }
}

/* ============ things to play for: objectives and achievements ============ */
/* Every season the board sets three objectives beyond the main target: beat
   your rival, a home record, finish above a named side, and in soccer a cup
   run. They are worked out from the season as it started (the schedule and
   the preseason ratings), so a reload or a hot seat gets the same ones.
   Each met is worth reputation, which is what job offers and job security
   run on. Achievements are a career's trophy cabinet: unlocked once, kept. */

/* ---- objectives ---- */
function preElo(t){ return (SEA.preseason&&SEA.preseason[t])||SEA.elo[t]||1500 }
function myLeagueGames(my){ return SEA.sched.filter(g=>!g.cup&&(g.home===my||g.away===my)) }
function seasonObjectives(my){
  if(!SEA||!my)return [];
  if(S.obj&&S.obj.year===SEA.year&&S.obj.team===my){
    // a save from before a schedule change: the home count follows the schedule as it is now
    S.obj.list.forEach(o=>{ if(o.k!=="home")return; const n=myLeagueGames(my).filter(g=>g.home===my&&!g.neutral).length;
      if(n&&o.of!==n){ o.of=n; o.n=Math.min(o.n,n); o.l=`Win ${o.n} of your ${n} home games` } });
    return S.obj.list;
  }
  const out=[], games=myLeagueGames(my);
  // a rival on the schedule
  const rg=games.find(g=>LEAGUE.rivals.name(my,g.home===my?g.away:g.home));
  // three or more meetings: the season series, not one win (Grokbot: "Beat Montreal" done after 1 of 4)
  if(rg){ const o=rg.home===my?rg.away:rg.home, n=games.filter(g=>g.home===o||g.away===o).length, need=Math.floor(n/2)+1;
    out.push(n>=3?{k:"rival",opp:o,n:n,need:need,l:`Win the season series against ${o} (${need} of ${n})`}:{k:"rival",opp:o,l:`Beat ${o}`}) }
  // a cup run, where there is a cup
  if(LEAGUE.cup&&SEA.cup&&LEAGUE.cup.objective)out.push(LEAGUE.cup.objective(my));   // soccer: the quarter-finals; the third round; the first round proper
  // finish above the side rated just above you in your group
  const grp=NAMES.filter(t=>CONF[t]===CONF[my]&&t!==my&&preElo(t)>preElo(my)).sort((a,b)=>preElo(a)-preElo(b));
  if(grp.length)out.push({k:"above",opp:grp[0],l:`Finish above ${grp[0]}`});
  else out.push({k:"top",l:`Finish top of the ${LEAGUE.conf.names[CONF[my]]||"group"}`});   // rated best in it: win it
  // a home record a little better than you'd expect
  const H=games.filter(g=>g.home===my&&!g.neutral);
  if(H.length>=3){ const hfa=LEAGUE.tuning.hfa||0;
    const p=H.reduce((s,g)=>s+1/(1+Math.pow(10,-(preElo(my)+hfa-preElo(g.away))/400)),0)/H.length;
    // what you'd expect to win (a draw isn't a win: about a quarter of soccer games are drawn)
    const pw=LEAGUE.draws?p*0.74:p;
    const t=Math.max(1,Math.min(H.length,Math.round(H.length*Math.min(0.88,pw))));
    out.push({k:"home",n:t,of:H.length,l:`Win ${t} of your ${H.length} home games`}) }
  // a run of wins, when there's room for a third
  const n=games.length;
  // six over 82-84 games: five was met in 24 of 24 hockey seasons (an average side gets six about half the time)
  const sk=n<=13?3:n<=40?4:n<=60?5:6;
  out.push({k:"streak",n:sk,l:`Win ${sk} games in a row`});
  const list=out.slice(0,3);
  S.obj={year:SEA.year,team:my,list:list};
  return list;
}
/* how each objective stands: met, failed, or how it's going */
function objStatus(o,my){
  const played=[].concat(...SEA.weeks.slice(0,LEAGUE.weeks).map(w=>w.games)).filter(g=>!g.cup&&(g.home===my||g.away===my));
  const done=SEA.phase!=="week";
  if(o.k==="rival"){ const m=played.filter(g=>g.home===o.opp||g.away===o.opp);
    if(o.need){ const w=m.filter(g=>g.winner===my).length, l=m.length-w;
      if(w>=o.need)return {s:"met",t:`Won ${w} of ${m.length}`};
      if(l>o.n-o.need)return {s:"miss",t:`Lost ${l} of ${o.n}`};
      return {s:"on",t:`${w} of ${o.need} won, ${o.n-m.length} to play`} }
    if(m.some(g=>g.winner===my))return {s:"met",t:"Done"};
    const left=myLeagueGames(my).filter(g=>(g.home===o.opp||g.away===o.opp)&&g.week>=SEA.step).length;
    return left&&!done?{s:"on",t:`${left} meeting${left===1?"":"s"} to come`}:{s:"miss",t:"Missed"} }
  if(o.k==="cup"){ const C=SEA.cup; if(!C)return {s:"on",t:""};
    if(C.draws[o.round]&&C.draws[o.round].some(p=>p.indexOf(my)>=0))return {s:"met",t:"Done"};
    if(C.out[my]!==undefined&&C.out[my]<o.round)return {s:"miss",t:"Knocked out"};
    return {s:"on",t:"Still in it"} }
  if(o.k==="above"){ const pos=t=>LEAGUE.position?LEAGUE.position(t):standRank(t);
    const a=pos(my), b=pos(o.opp);
    if(done)return a<b?{s:"met",t:"Done"}:{s:"miss",t:"Missed"};
    // level on record (0-0 in week one sorts one of you first): say level, not behind (Grokbot)
    const rw=t=>SEA.rec&&SEA.rec[t]?SEA.rec[t][0]-SEA.rec[t][1]:0, lvl=rw(my)===rw(o.opp)&&!LEAGUE.position;
    return {s:"on",t:lvl?"Level with them now":a<b?"Ahead of them now":"Behind them now"} }
  if(o.k==="top"){ const pos=LEAGUE.position?LEAGUE.position(my):standRank(my);
    if(done)return pos===1?{s:"met",t:"Done"}:{s:"miss",t:"Missed"};
    return {s:"on",t:pos===1?"Top now":"Not top now"} }
  if(o.k==="streak"){ let best=0,cur=0; played.slice().sort((a,b)=>(a.week||0)-(b.week||0)).forEach(g=>{ if(g.winner===my){cur++;best=Math.max(best,cur)} else cur=0 });
    // played is in week order already: SEA.weeks
    if(best>=o.n)return {s:"met",t:`${best} in a row`};
    return done?{s:"miss",t:`Best run ${best}`}:{s:"on",t:`Best so far ${best}`} }
  if(o.k==="home"){ const w=played.filter(g=>g.home===my&&!g.neutral&&g.winner===my).length;
    const left=myLeagueGames(my).filter(g=>g.home===my&&!g.neutral&&g.week>=SEA.step).length;
    if(w>=o.n)return {s:"met",t:`${w} won`};
    if(w+left<o.n||done)return {s:"miss",t:`${w} won, ${o.n} needed`};
    return {s:"on",t:`${w} won, ${left} to play`} }
  return {s:"on",t:""};
}
/* where a team stands in its group, for leagues without a table: by win share, then rating */
function standRank(t){
  // the order the Standings screen shows (conference record first): win share overall
  // marked a team "top" that the table had second (Grokbot)
  try{ const st=SEA.standings(null), L=st&&st[CONF[t]]; if(L&&L.length){ const i=L.findIndex(r=>r.team===t); if(i>=0)return i+1 } }catch(e){}

/* Everything here is a flourish on top of the game: nothing in it changes a
   result, and every part of it fails quietly where it isn't available (no
   audio, no vibration, reduced motion, the test harness).
   Sound is made on the spot with Web Audio (no files): a crowd's roar when
   you score, a groan when they do, the sport's whistle, horn or buzzer at the
   start and the end, a short fanfare for a win. S.sound turns it off. */

let AC=null;

function audio(){
  if(!soundOn())return null;
  try{ if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(!C)return null; AC=new C() }
    if(AC.state==="suspended"&&AC.resume)AC.resume(); return AC }catch(e){ return null }
}
function noiseBuf(ac,secs){
  const n=Math.floor(ac.sampleRate*secs), b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1; return b;

/* a shaped burst of filtered noise: a crowd */
function crowd(ac,{f=900,q=0.7,peak=0.22,up=0.12,down=1.4,type="bandpass"}){
  const t=ac.currentTime, s=ac.createBufferSource(), fl=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=noiseBuf(ac,up+down+0.1); fl.type=type; fl.frequency.value=f; fl.Q.value=q;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+up); g.gain.exponentialRampToValueAtTime(0.0001,t+up+down);
  s.connect(fl); fl.connect(g); g.connect(ac.destination); s.start(t); s.stop(t+up+down+0.1);
}
function tone(ac,{f=440,type="sine",at=0,dur=0.2,peak=0.12,glide=null,vib=0}){
  const t=ac.currentTime+at, o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(glide)o.frequency.exponentialRampToValueAtTime(glide,t+dur);
  if(vib){ const l=ac.createOscillator(), lg=ac.createGain(); l.frequency.value=vib; lg.gain.value=f*0.04; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t+dur) }
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
}

/* ---- confetti: a title, a promotion ---- */
function confetti(colors){
  if(prefersReduced())return;
  try{
    const c=document.createElement("canvas"); if(!c||!c.getContext)return;
    const W=window.innerWidth, H=window.innerHeight, x=c.getContext("2d"); if(!x)return;
    c.width=W; c.height=H; c.className="confetti"; document.body.appendChild(c);
    const P=Array.from({length:170},()=>({x:Math.random()*W, y:-20-Math.random()*H*0.5, vx:(Math.random()-0.5)*2.4, vy:2+Math.random()*3.2,
      r:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3, w:6+Math.random()*6, h:3+Math.random()*4, c:colors[Math.floor(Math.random()*colors.length)]}));
    const t0=Date.now();
    const step=()=>{ const t=Date.now()-t0; x.clearRect(0,0,W,H);
      P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.03; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r);
        x.globalAlpha=Math.max(0,1-Math.max(0,t-2600)/900); x.fillStyle=p.c; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore() });
      if(t<3500)requestAnimationFrame(step); else c.remove() };
    requestAnimationFrame(step);
  }catch(e){}
}

/* ---- music: made on the spot, like the sound (no files) ----
   A loop of four chords with a bass line and a plucked figure over it,
   quiet under everything else. Calm between games; during a live game it
   picks up: a beat, a busier figure, and a lift when you're ahead late.
   Each sport has its own key and pace. S.music turns it on (off to begin
   with); it never changes a result. */
const MUSIC={
  football:{root:50, bpm:104, prog:[0,7,9,5]},   // D: I V vi IV
  basketball:{root:53, bpm:112, prog:[0,9,5,7]}, // F: I vi IV V
  hockey:{root:52, bpm:100, prog:[0,5,7,5]},     // E: I IV V IV
  soccer:{root:55, bpm:96, prog:[0,9,5,7]}       // G: I vi IV V
};
let musicT=null, musicBar=0, musicNext=0, musicGain=null;
function musicOn(){ return !!(S&&S.music) }
const mtof=m=>440*Math.pow(2,(m-69)/12);
function musicSpec(){ return MUSIC[(typeof SPORT!=="undefined"&&SPORT.id)||"football"]||MUSIC.football }
function mNote(ac,dest,{m,type="triangle",at,dur,peak,attack=0.01}){
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(mtof(m),at);
  g.gain.setValueAtTime(0.0001,at); g.gain.exponentialRampToValueAtTime(peak,at+attack); g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
  o.connect(g); g.connect(dest); o.start(at); o.stop(at+dur+0.05);
}
function mHit(ac,dest,{at,f,dur,peak,type="highpass"}){
  const s=ac.createBufferSource(), fl=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=noiseBuf(ac,dur+0.05); fl.type=type; fl.frequency.value=f;
  g.gain.setValueAtTime(peak,at); g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
  s.connect(fl); fl.connect(g); g.connect(dest); s.start(at); s.stop(at+dur+0.05);
}
function mKick(ac,dest,at,peak){
  const o=ac.createOscillator(), g=ac.createGain();
  o.frequency.setValueAtTime(140,at); o.frequency.exponentialRampToValueAtTime(45,at+0.14);
  g.gain.setValueAtTime(peak,at); g.gain.exponentialRampToValueAtTime(0.0001,at+0.22);
  o.connect(g); g.connect(dest); o.start(at); o.stop(at+0.25);
}
/* one bar, scheduled ahead of time */
function musicBarAt(ac,t0){
  const M=musicSpec(), inGame=!!(typeof live!=="undefined"&&live&&!live.done);
  const beat=60/(M.bpm*(inGame?1.08:1)), bar=beat*4, deg=M.prog[musicBar%4], root=M.root+deg;
  const minor=deg===9||deg===4, third=root+(minor?3:4), fifth=root+7;
  let lead=0; if(inGame){ const me=live.g.home===S.myTeam; lead=me?live.eng.h-live.eng.a:live.eng.a-live.eng.h }
  const D=musicGain;
  // the pad: the chord, held
  [root,third,fifth].forEach(m=>mNote(ac,D,{m:m+12,type:"triangle",at:t0,dur:bar*0.98,peak:0.05,attack:0.25}));
  // the bass: root on one and three (and the fifth on four in a game)
  mNote(ac,D,{m:root-12,type:"sine",at:t0,dur:beat*1.6,peak:0.16});
  mNote(ac,D,{m:root-12,type:"sine",at:t0+beat*2,dur:beat*1.4,peak:0.13});
  if(inGame)mNote(ac,D,{m:fifth-12,type:"sine",at:t0+beat*3.5,dur:beat*0.5,peak:0.1});
  // the figure: eighth notes through the chord, a different shape each bar
  const shapes=[[0,1,2,1,0,2,1,2],[2,1,0,1,2,1,0,1],[0,2,1,2,0,2,1,0],[1,2,0,2,1,0,2,1]];
  const tones=[root+24,third+24,fifth+24], sh=shapes[musicBar%4];
  const n=inGame?8:4;
  for(let i=0;i<n;i++){ const k=inGame?i:i*2;
    mNote(ac,D,{m:tones[sh[k]]+(inGame&&lead>0&&musicBar%8>=4?12:0),type:"square",at:t0+k*beat/2,dur:beat*0.35,peak:inGame?0.022:0.018}) }
  // the beat, in a game: kick on one and three, a snap on two and four, ticks between
  if(inGame){
    mKick(ac,D,t0,0.22); mKick(ac,D,t0+beat*2,0.2);
    mHit(ac,D,{at:t0+beat,f:1800,dur:0.12,peak:0.07,type:"bandpass"}); mHit(ac,D,{at:t0+beat*3,f:1800,dur:0.12,peak:0.07,type:"bandpass"});
    for(let i=0;i<8;i++)mHit(ac,D,{at:t0+i*beat/2,f:7000,dur:0.03,peak:0.025});
  }
  musicBar++;
  return bar;
}
function musicTick(){
  const ac=audio(); if(!ac||!musicOn()){ musicStop(); return }
  if(!musicGain){ musicGain=ac.createGain(); musicGain.gain.value=0.55; const lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=3200;
    musicGain.connect(lp); lp.connect(ac.destination) }
  if(musicNext<ac.currentTime)musicNext=ac.currentTime+0.1;
  while(musicNext<ac.currentTime+1.2){ try{ musicNext+=musicBarAt(ac,musicNext) }catch(e){ musicStop(); return } }
}
function musicStart(){
  if(!musicOn()||musicT)return;
  try{ const ac=audio(); if(!ac)return; musicNext=ac.currentTime+0.1; musicTick(); musicT=setInterval(musicTick,400) }catch(e){}
}
function musicStop(){
  if(musicT){clearInterval(musicT); musicT=null}
  try{ if(musicGain){ const g=musicGain; musicGain=null; g.gain.setTargetAtTime(0.0001,AC.currentTime,0.15); setTimeout(()=>{try{g.disconnect()}catch(e){}},800) } }catch(e){}
}
/* a browser starts sound only after a tap: music that was on last time waits for the first one */
try{ if(typeof document!=="undefined"&&document.addEventListener)
  document.addEventListener("pointerdown",()=>{ if(musicOn()&&soundOn()&&!musicT)musicStart() },{passive:true}) }catch(e){}

  return `<div class="grouphead">${esc(LEAGUE.conf.names[d])}</div>`+T.map((t,i)=>{const z=zoneOf(d,i+1), G=SEA.gfga(t);
    return `<div class="frow ${t===my?'mine':''} zone-${z}"><span class="sd">${i+1}</span>
      <span class="dot" style="background:${teamColor(t)}"></span>
      <div class="fmain"><div class="fname">${TL(t)}</div><div class="fnote">${z?ZONE_NOTE[z]:"&nbsp;"}</div></div>
      <span class="fcfp">${SEA.pts(t)} pts &middot; ${recStr(t)} &middot; ${G[0]-G[1]>=0?"+":""}${G[0]-G[1]}</span></div>`}).join("");
}
function eplRankingView(){
  const d=eplTab||CONF[S.myTeam];
  const tabs=`<div class="subtabs"><button class="subtab" data-et="CUP" aria-pressed="${d==="CUP"}">FA Cup</button>${DIV_ORDER.map(k=>`<button class="subtab" data-et="${k}" aria-pressed="${d===k}">${esc(LEAGUE.conf.names[k].replace("National League ","NL "))}</button>`).join("")}</div>`;
  if(d==="CUP")return `<div class="dateline"><h2>The FA Cup</h2><span>${SEA.year}</span></div>`+tabs+cupView();
  return `<div class="dateline"><h2>The table</h2><span>${SEA.year}</span></div>`+tabs+
    eplTable(d)+`<div class="note">Points, then goal difference, then goals scored.</div>`;
}
/* the FA Cup: where you stand and the road so far, the bracket from the
   quarter-finals (drawn round by round, so later slots wait for the draw),
   the latest round in full, earlier rounds your tie and the shocks */
function cupView(){
  const C=SEA.cup, my=S.myTeam; if(!C)return "";
  const tier=t=>DIVS[CONF[t]].tier, R=CUP_ROUNDS;
  const fate=cupFate(SEA,my);
  const enter=tier(my)<=2?"the third round":tier(my)<=4?"the first round":tier(my)===5?"the fourth qualifying round":"the third qualifying round";
  const inNext=C.draws[C.next]&&C.draws[C.next].some(p=>p.indexOf(my)>=0);
  let h=`<div class="note">${fate?`<b>${esc(fate==="Winners"?"FA Cup winners.":fate+".")}</b>`
    :inNext&&!C.played[C.next]?`<b>Still in it:</b> ${esc(R[C.next].name)} next.`
    :`You enter in ${enter}.`} Ties are midweek; level after ninety minutes, extra time and penalties. Semi-finals and the final at Wembley.</div>`;
  if(C.winner)h+=`<div class="note"><b>${esc(C.winner)}</b> win the FA Cup${C.finalist?", beating "+esc(C.finalist)+" in the final":""}.</div>`;
  const tieOf=(i,p)=>C.played[i]?C.played[i].find(x=>x.home===p[0]&&x.away===p[1]):null;
  // your road
  const road=[]; R.forEach((r,i)=>{ const p=C.draws[i]&&C.draws[i].find(p=>p.indexOf(my)>=0); if(!p)return;
    const g=tieOf(i,p), opp=p[0]===my?p[1]:p[0];
    road.push(`<div class="frow mine"><span class="sd">${esc(r.short)}</span><div class="fmain"><div class="fname">${p[0]===my?"vs":r.neutral?"v":"at"} ${TL(opp)}</div>
      <div class="fnote">${esc(LEAGUE.conf.names[CONF[opp]])}</div></div>
      <span class="fcfp">${g?(g.winner===my?"W ":"L ")+(p[0]===my?g.hp+"-"+g.ap:g.ap+"-"+g.hp)+(g.pens?" p":""):"to play"}</span></div>`) });
  if(road.length)h+=`<div class="grouphead">Your road</div>`+road.join("");
  // the bracket: quarter-finals on
  const qf=R.findIndex(r=>r.k==="qf");
  if(C.draws[qf]){
    const col=(i,n)=>{ const D=C.draws[i]||[], out=[];
      for(let k=0;k<n;k++){ const p=D[k]; const g=p?tieOf(i,p):null;
        out.push(g?bgame(g):p?bgame(null,{t:p[0]},{t:p[1]}):bgame(null)) }
      return `<div class="bcol"><div class="bhead">${esc(R[i].name.replace(/^./,c=>c.toUpperCase()))}</div><div class="bgames">${out.join("")}</div></div>` };
    h+=`<div class="grouphead">The last eight</div><div class="bracket">${col(qf,4)}${col(qf+1,2)}${col(qf+2,1)}</div>
      <div class="note">An open draw every round: the semi-final pairings aren't known until the quarter-finals are played.</div>`;
  }
  const row=(g,pair)=>{ const hm=g?g.home:pair[0], aw=g?g.away:pair[1], mine=hm===my||aw===my;
    const sc=g?`${g.hp}&ndash;${g.ap}${g.pens?" p":""}`:"v";
    const shock=g&&tier(g.winner)-tier(g.loser)>=2;
    return `<div class="frow ${mine?'mine':''}"><div class="fmain"><div class="fname">
      <span class="${g&&g.winner===hm?'cupw':''}">${TL(hm)}</span> <span class="cupsc">${sc}</span> <span class="${g&&g.winner===aw?'cupw':''}">${TL(aw)}</span></div>
      <div class="fnote">${esc(LEAGUE.conf.names[CONF[hm]])} v ${esc(LEAGUE.conf.names[CONF[aw]])}${shock?" &middot; <b>giant-killing</b>":""}</div></div></div>` };
  for(let i=Math.min(qf-1,R.length-1);i>=0;i--){
    const drawn=C.draws[i]; if(!drawn)continue;
    const played=C.played[i];
    const latest=i===C.next;
    let list=drawn.map(p=>row(tieOf(i,p),p));
    if(!latest){ list=drawn.map(p=>{ const g=tieOf(i,p);
        return (p.indexOf(my)>=0||(g&&tier(g.winner)-tier(g.loser)>=2))?row(g,p):"" }).filter(Boolean);
      if(!list.length)continue }
    h+=`<div class="grouphead">${esc(R[i].name.replace(/^./,c=>c.toUpperCase()))}${latest&&!played?" &middot; the draw":latest?"":" &middot; your tie and the shocks"}</div>`+list.join("");
  }
  return h;
}
function eplBracket(){
  SEA._seed(); const d=eplTab&&DIVS[eplTab]&&DIVS[eplTab].po?eplTab:(DIVS[CONF[S.myTeam]].po?CONF[S.myTeam]:"CH");
  const P=SEA.po[d], R=P.rounds, S2=P.seeds, six=S2.length===6, sd=t=>SEA.seeds[t];
  const box=(g,a,b)=>g?bgame(g):bgame(null,a?{t:a,s:sd(a)}:null,b?{t:b,s:sd(b)}:null);
  const col=(t,items)=>`<div class="bcol"><div class="bhead">${t}</div><div class="bgames">${items.join("")}</div></div>`;
  let h=`<div class="subtabs">${DIV_ORDER.filter(k=>DIVS[k].po).map(k=>`<button class="subtab" data-et="${k}" aria-pressed="${d===k}">${esc(LEAGUE.conf.names[k].replace("National League ","NL "))}</button>`).join("")}</div>`;
  h+=`<div class="grouphead">${esc(LEAGUE.conf.names[d])} play-offs</div>`;
  if(P.winner)h+=`<div class="note"><b>${esc(P.winner)}</b> win the play-off final and go up.</div>`;
  const cols=[];
  if(six)cols.push(col("Eliminators",[box(R.po1[0],S2[2],S2[5]),box(R.po1[1],S2[3],S2[4])]));
  cols.push(col("Semi-finals",R.po2.length?R.po2.map(g=>bgame(g)):six?[box(null,S2[0],null),box(null,S2[1],null)]:[box(null,S2[0],S2[3]),box(null,S2[1],S2[2])]));
  cols.push(col("Final",[R.po3[0]?bgame(R.po3[0]):bgame(null)]));
  h+=`<div class="bracket">${cols.join("")}</div>`;
  h+=`<div class="note">Going up: ${esc(P.up.join(", ")||"to be decided")}.${P.down.length?" Going down: "+esc(P.down.join(", "))+".":""}</div>`;
  return h;
}
/* a bracket game box (the basketball one's shape) */
function bgame(g,top,bot){
  const slot=(t,s,pts,win)=>`<div class="bslot ${win?'bwin':''} ${t&&t===S.myTeam?'bmine':''}" style="--tc:${t?teamInk(t):'transparent'}">
    <span class="bseed">${s||""}</span><span class="bteam">${t?esc(t):'<span class="btbd">to be decided</span>'}</span><span class="bpts">${pts===undefined||pts===null?"":pts}</span></div>`;
  if(g)return `<div class="bgame">${slot(g.home,g.hseed,g.hp+(g.pens&&g.pens==="home"?"p":""),g.winner===g.home)}${slot(g.away,g.aseed,g.ap+(g.pens&&g.pens==="away"?"p":""),g.winner===g.away)}</div>`;
  return `<div class="bgame">${slot(top&&top.t,top&&top.s)}${slot(bot&&bot.t,bot&&bot.s)}</div>`;
}
function eplStakes(x){
  const {my,opp,wk,left}=x, out=[], d=CONF[my], T=SEA.table(d), pos=T.indexOf(my)+1, P=t=>SEA.pts(t);
  if(wk<10)return out;
  const R=DIVS[d];
  if(d==="PL"){
    if(pos<=2)out.push({p:90,tag:"TITLE RACE",l:`${pos===1?"Top of the table":"Second, "+(P(T[0])-P(my))+" behind "+esc(T[0])} with ${left} to play.`});
    else if(pos<=7)out.push({p:84,tag:"EUROPE",l:`${pos<=5?"In the Champions League places":"Chasing the top five"}: ${P(T[4])-P(my)>0?(P(T[4])-P(my))+" points off fifth":"fifth or better"}.`});
    const gap=P(my)-P(T[17]);
    if(pos>=15)out.push({p:92,tag:pos>=18?"IN THE DROP ZONE":"RELEGATION SCRAP",l:pos>=18?`${P(T[16])-P(my)} points from safety with ${left} to play.`:`${gap} point${gap===1?"":"s"} above the drop.`});
  } else {
    const pe=R.po[1], six=R.po[1]-R.po[0]===5;
    const ord=n=>n+(n%10===1&&n%100!==11?"st":n%10===2&&n%100!==12?"nd":n%10===3&&n%100!==13?"rd":"th");   // the places by number (Grokbot)
    if(pos<=R.up)out.push({p:90,tag:"PROMOTION",l:`${ord(pos)}: in the automatic places (top ${R.up}) with ${left} to play.`});
    else if(pos<=pe)out.push({p:86,tag:"PLAY-OFFS",l:`${ord(pos)}: in the play-off places (${ord(R.po[0])} to ${ord(pe)}). ${six&&pos<R.po[0]+2?"Straight to the semi-finals if it stays that way.":six?"An eliminator first.":"A semi-final if it stays that way."}`});
    else if(pos<=pe+4)out.push({p:80,tag:"PLAY-OFF RACE",l:`${P(T[pe-1])-P(my)} points off the play-offs.`});
    if(R.down&&pos>=24-R.down-2)out.push({p:92,tag:pos>24-R.down?"IN THE DROP ZONE":"RELEGATION SCRAP",l:pos>24-R.down?`${P(T[23-R.down])-P(my)} points from safety.`:`${P(my)-P(T[24-R.down])} points above the drop.`});
  }
  if(CONF[opp]===d&&Math.abs(T.indexOf(opp)+1-pos)<=2)out.push({p:82,tag:"SIX-POINTER",l:`${esc(opp)} are right beside you in the table. Three points for you, none for them.`});
  return out;
}

/* ============ offseason screens: pro football ============ */
/* The offseason screen (job offers, staff, contracts, free agency, the
   draft, philosophy) and the banner that closes a season. */

/* next year's payroll before free agency: everyone under contract, plus the
   expiring players you've chosen to re-sign at their asking price */
function nflPlannedPay(){
  const R=U.roster[S.myTeam], P=S.off.picks;
  let pay=R.reduce((s,p,i)=>{if(!p)return s;
    if(P.asks&&P.asks[i])return s+(P.resign[i]?P.asks[i].sal:0);
    return s+p.k.sal},0);
  if(P.trade)pay+=P.trade.sal-P.trade.giveSal;          // an agreed trade counts now
  return pay;
}
/* Trade block: put one player under contract on it and see what teams offer. */
function nflHumans(){return (S.coaches||[]).map((c,i)=>i===(S.turn||0)?S.myTeam:c.myTeam)}
function nflTradeHTML(P){
  const R=U.roster[S.myTeam];
  let h=`<div class="grouphead">Swap deals</div>`;
  if(P.trade){
    const T=P.trade;
    return h+`<div class="cand on"><div class="candtop"><div><div class="fname">${esc(T.giveName)} for ${esc(T.n)} <span class="dpos">${esc(T.p)}</span></div>
      <div class="fnote">With ${esc(T.team)} &middot; he's rated ${T.r}, age ${T.age}, ${money(T.sal)} a year for ${T.yrs} more year${T.yrs===1?"":"s"}</div></div>
      <span class="cgrade">agreed</span></div>
      <div class="cdesc">Goes through when the offseason runs.</div>
      <button class="skip small" data-tcancel="1">Call it off</button></div>`;
  }
  if(P.block!==null&&P.block!==undefined&&R[P.block]){
    const g=R[P.block], offers=nflTradeOffers(U,S.myTeam,P.block,nflHumans());
    h+=`<div class="note">${esc(g.n)} (${esc(g.p)}, rated ${g.r}, age ${g.age}, ${money(g.k.sal)}) is on the block.
      <button class="skip small" data-tunblock="1">Take him off</button></div>`;
    h+=offers.length?offers.map((o,k)=>`<div class="drow">
        <div class="fmain"><div class="fname">${esc(o.team)} offer ${esc(o.n)} <span class="dpos">${esc(o.p)}</span></div>
        <div class="fnote">Rated ${o.r}, ceiling ${o.pot}, age ${o.age} &middot; ${money(o.sal)} a year for ${o.yrs} more year${o.yrs===1?"":"s"}</div></div>
        <button class="skip small" data-taccept="${k}">Accept</button></div>`).join("")
      :`<div class="note">Nobody is offering anything you need for him.</div>`;
    return h;
  }
  const can=R.map((p,i)=>({p:p,i:i})).filter(x=>x.p&&x.p.k.yrs>=2);
  h+=`<div class="note">Offer one player in a straight swap and see what clubs come back with: a player at one of your weakest spots, worth about the same.</div>`;
  h+=can.map(x=>`<div class="drow"><div class="fmain"><div class="fname">${esc(x.p.n)} <span class="dpos">${esc(x.p.p)}</span></div>
      <div class="fnote">${x.i<POS.length?"Starter":"Backup"} &middot; rated ${x.p.r} &middot; age ${x.p.age} &middot; ${money(x.p.k.sal)} a year</div></div>
      <button class="skip small" data-tblock="${x.i}">Shop him</button></div>`).join("");
  return h;
}
/* Your draft board: players you want, in order. At each of your picks you
   take the highest one still there; if none are left, your style picks. */
function nflBoardHTML(P){
  const C=nflDraftClass(U,S.myTeam), byId={}; C.list.forEach(p=>byId[p.pid]=p);
  const board=(P.board||[]).filter(id=>byId[id]);
  const val=p=>p.sr+(p.spot-p.sr)*0.45;
  const row=(p,i,on)=>`<div class="drow">
      <span class="dpick">${on?(i+1)+".":""}</span>
      <div class="fmain"><div class="fname">${esc(p.n)} <span class="dpos">${esc(p.p)}</span></div>
        <div class="fnote">${esc(p.from)} &middot; age ${p.age} &middot; scouts say ~${p.sr}, ceiling ~${p.spot}</div></div>
      <button class="skip small" ${on?`data-bdrm="${p.pid}"`:`data-bdadd="${p.pid}"`}>${on?"Remove":"Add"}</button></div>`;
  let h=`<div class="grouphead">Your draft board</div>`;
  h+=board.length?board.map((id,i)=>row(byId[id],i,true)).join("")
     :`<div class="note">Empty: your draft style will choose. Add players below and you'll take the highest one still there at each of your picks.</div>`;
  // worked-out players stay listed wherever their sharper read puts them (Instinct: one vanished from the 30)
  const wkd=(S.off.picks.workouts||[]), ranked=C.list.filter(p=>board.indexOf(p.pid)<0).sort((a,b)=>val(b)-val(a));
  const pool=ranked.slice(0,30).concat(ranked.slice(30).filter(p=>wkd.indexOf(p.pid)>=0));
  h+=`<div class="grouphead">The class &mdash; best 30 by your scouts</div>`+pool.map(p=>row(p,0,false)).join("");
  return h;
}
/* Free agents you want, in order. They get your first look when free agency
   opens, at the asking price plus about 10%, if they fit; then your style
   fills whatever is left. */
function nflTargetsHTML(P,room){
  const pre=nflFreeAgentPreview(U,S.myTeam), byKey={}; pre.forEach(x=>byKey[x.key]=x);
  // where he'd fit on your side, from your own players (the tag read a field nobody set, so every one was
  // "depth: better than your backup", even beside a 60-rated starter: Grokbot)
  const R=U.roster[S.myTeam]||[];
  const place=x=>{ const i=POS.findIndex(P=>P.p===x.p); if(i<0)return "";
    const st=R[i], bk=R[BK(i)];
    return !st||x.r>st.r?"would start":!bk||x.r>bk.r?"depth: better than your backup":"no better than yours" };
  const mine=(P.targets||[]).filter(k=>byKey[k]);
  let left=room-0.5;                                // leave a little room for the academy
  const seenPos={};
  const row=(x,on,i)=>{ let fit="";
      // the signing checks the cap after the draft, so the class is already paid for: there is no squeezing it
      // (Instinct: a "squeezing" target then had no room). This room is right on average, within about 5M either
      // way (measured, Nov 2026: the class and the fill-ins vary), so near the line it says so.
      // with the gap in money, so "won't fit" says why (Grokbot)
      if(on){left-=x.ask; const gap=`about £${Math.abs(left).toFixed(1)}M`;
        fit=left>=2?"fits":left>=-3?`close: ${left>=0?gap+" spare":gap+" short"}`:`won't fit as things stand: ${gap} short`;
        if(seenPos[x.p])fit="you already want a "+x.p+": the second signs only if there is still room at "+x.p+" after the first"; seenPos[x.p]=1}
      return `<div class="drow">
      <span class="dpick">${on?(i+1)+".":""}</span>
      <div class="fmain"><div class="fname">${esc(x.n)} <span class="dpos">${esc(x.p)}</span> <span class="ptag">${place(x)}</span></div>
        <div class="fnote">${esc(x.team)} &middot; age ${x.age} &middot; rated ${x.r} &middot; about ${money(x.ask)} a year${on?" &middot; "+fit:""}</div></div>
      <button class="skip small" ${on?`data-fatrm="${esc(x.key)}"`:`data-fatadd="${esc(x.key)}"`}>${on?"Remove":"Add"}</button></div>`};
  let h=`<div class="grouphead">Free transfers you want</div>`;
  h+=mine.length?mine.map((k,i)=>row(byKey[k],true,i)).join("")
    :`<div class="note">None yet: your assistant's style will decide. Players you add get your first look, in your order, if the wages fit.</div>`;
  // the ones your wages can pay first, then the best of the rest (a League One club was offered 82-rated
  // Man City and Arsenal players at about £21M a year against a £16M wage budget: Grokbot)
  const rest=pre.filter(x=>mine.indexOf(x.key)<0), fits=x=>x.ask<=Math.max(0,room)*1.05+0.2, can=rest.filter(fits).slice(0,20), dear=rest.filter(x=>!fits(x)).slice(0,5);
  h+=`<div class="grouphead">Out of contract this summer &mdash; within your wage room (${money(Math.max(0,room))})</div>`+
    (can.length?can.map(x=>row(x,false)).join(""):`<div class="note">Nobody worth chasing fits your wages this year.</div>`);
  if(dear.length)h+=`<div class="grouphead">The best of the rest: beyond your wages unless you free some</div>`+dear.map(x=>row(x,false)).join("");
  return h;
}
/* The transfer window: your kitty, bids for your players, your bids (in

    :`<div class="note">Nobody bigger is bidding for anyone of yours this summer.</div>`;
  let left=kitty, wl=LEAGUE.budgetOf(U,my)-pay+sales.reduce((a,o)=>{const p=U.roster[my].find(q=>q&&tKey(my,q)===o.key);return a+(p?p.k.sal:0)},0);
  const brow=(x,on,i)=>{ let fit="";

    return `<div class="drow"><span class="dpick">${on?(i+1)+".":""}</span>
      <div class="fmain"><div class="fname">${esc(x.n)} <span class="dpos">${esc(x.p)}</span> <span class="ptag">${x.starter?"would start":"depth: better than your backup"}</span></div>
      <div class="fnote">${esc(x.team)} (${esc(LEAGUE.groupShort?LEAGUE.groupShort(CONF[x.team]):LEAGUE.conf.names[CONF[x.team]])}) &middot; age ${x.age}${x.age>=33?" (may retire)":""} &middot; rated ${x.r}${x.pot>x.r+2?", ceiling "+x.pot:""} &middot; ${money(x.fee)} + ${money(x.wage)} a year${on?" &middot; <b>"+esc(fit)+"</b>":!x.willing?" &middot; "+esc(x.why):""}</div></div>
      ${on?`<button class="skip small" data-bidrm="${esc(x.key)}">Remove</button>`:x.willing?`<button class="skip small" data-bidadd="${esc(x.key)}">Bid</button>`:`<span class="nogo">won't come</span>`}</div>` };
  h+=`<div class="grouphead">Your bids</div>`;
  h+=bids.length?bids.map((k,i)=>brow(byKey[k],true,i)).join("")+`<div class="note">They go in this order when the window opens, while the money lasts.</div>`
    :`<div class="note">None yet. Bid below: the asking fee, in the order you add them.</div>`;
  h+=`<div class="grouphead">The market &mdash; who'd improve you</div>`;
  POS.forEach((P2,i)=>{
    const R=U.roster[my], st=R[i];
    const list=mkt.filter(x=>x.i===i&&bids.indexOf(x.key)<0);
    const can=x=>x.fee<=kitty?1:0;   // what the kitty can pay for first, best first; then the best beyond it
    const will=list.filter(x=>x.willing).sort((a,b)=>(can(b)-can(a))||(b.r-a.r)).slice(0,3), no=list.filter(x=>!x.willing).length;
    h+=`<div class="divhead">${esc(P2.p)} &middot; your starter ${st?esc(st.n)+", "+st.r:"none"}</div>`;
    h+=will.length?will.map(x=>brow(x,false)).join(""):`<div class="note">Nobody who'd come is better than what you have.</div>`;
    if(no)h+=`<div class="note">${no} better player${no===1?"":"s"} at ${esc(P2.p)} won't come: bigger clubs, or higher divisions.</div>`;
  });
  return h;
}

  const sum=a=>(a||[]).reduce((t,x)=>t+(x.sal||0),0), why=X.payBefore!=null&&X.payroll!=null?(()=>{ const re=sum(X.resigned), si=sum(X.signed), gone=(X.released||[]).concat(X.retired||[]), nl=gone.length;
    // the full sum when the summer kept the old wages (Nov 2026 on): new deals net of the old ones, signings, the
    // wages that left, and the rest named (Grokbot: "show the amount that left"); a summer from before says what changed
    const full=gone.every(x=>x.sal!==undefined)&&(X.resigned||[]).every(x=>x.was!==undefined);
    if(full){ const was=(X.resigned||[]).reduce((t,x)=>t+(x.was||0),0), out=sum(gone), net=re-was, r1=x=>Math.round(x*10)/10;
      const rest=r1(X.payroll-(X.payBefore+net+si-out)), sg=x=>(x>=0?"+":"&minus;")+money2(Math.abs(x));
      const parts=[(X.resigned||[]).length?(Math.abs(net)<0.05?`${nOf(X.resigned.length,"new deal")} at the same wage (${money2(re)} a year)`:`${sg(net)} on ${nOf(X.resigned.length,"new deal")} (${money2(re)} a year, was ${money2(was)})`):"",
        si?`+${money2(si)} on ${nOf(X.signed.length,"signing")}`:"", nl?`&minus;${money2(out)} for ${nOf(nl,"player")} gone`:"",
        Math.abs(rest)>=0.1?`${sg(rest)} for academy graduates and fill-ins`:""].filter(Boolean);
      return ` Last season's was ${money2(X.payBefore)}${parts.length?`: ${parts.join(", ")}`:""}.` }
    const parts=[re?`${nOf(X.resigned.length,"new deal")} for your own players (${money2(re)} a year now, replacing their old ones)`:"",si?`${nOf(X.signed.length,"signing")} (${money2(si)})`:"",nl?`${nOf(nl,"player")} gone`:""].filter(Boolean);
    return ` Last season's was ${money2(X.payBefore)}${parts.length?`; since then, ${parts.join(", ")}`:""}.` })():"";
  if(X.payroll!=null)rec+=`<div class="bnews small"><b>Payroll after the summer:</b> ${money2(X.payroll)} of ${money2(LEAGUE.budgetOf?LEAGUE.budgetOf(U,my):NFL_CAP)}${LEAGUE.budgetOf?" (the wage budget)":" (the cap)"}.${why}</div>`;
  if((X.grew||[]).length){ const G=X.grew.slice().sort((a,b)=>(b.to-b.from)-(a.to-a.from));

  if(X.kittyLeft)rec+=`<div class="bnews small">${money(X.kittyLeft)} left in the kitty: half of it carries over.</div>`;
  if((X.signed||[]).length)rec+=`<div class="bnews"><b>Free transfers:</b> ${list(X.signed,p=>esc(p.n)+" ("+esc(p.p)+", "+p.r+") "+money(p.sal)+" a year")}.</div>`;
  if(X.trade)rec+=X.trade.done?`<div class="bnews"><b>Trade:</b> ${esc(X.trade.gave)} (${esc(X.trade.gp)}) to ${esc(X.trade.with)} for ${esc(X.trade.got)} (${esc(X.trade.qp)}).</div>`

let slotsMoved=false;
async function moveForeignSaves(){
  if(slotsMoved)return; slotsMoved=true;
  for(let n=1;n<=NSLOTS;n++){
    try{
      const r=await store.get(LEGACY_KEY+"-slot"+n); if(!r)continue;
      const lg=saveLeague(JSON.parse(lzwUnpack(r.value)));
      if(!lg||lg==="cfb"||!SAVE_KEYS[lg])continue;
      let dest=null;

        if(!(await store.get(SAVE_KEYS[lg]+"-slot"+m))){dest=m;break}
      }

      const ok=await store.set(SAVE_KEYS[lg]+"-slot"+dest,r.value);

function repairPlayed(d){

  Object.keys(d.played).forEach(k=>{ const seen=new Set(), yr=k.split(":")[0];
    d.played[k]=d.played[k].filter(p=>{ const id=p.team+"|"+p.other+"|"+!!p.cup+"|"+p.mine+"-"+p.theirs;
      if(!seen.has(id)){seen.add(id); return true}

  if(LEAGUE.skipIdle&&LEAGUE.dates&&SEA.phase==="week"&&!isHotSeat()&&!SEA.nextGame(S.myTeam)){

    if(nx&&LEAGUE.dates[nx.week])return `Play ${LEAGUE.dates[nx.week]}`;
  }
  return SEA.buttonLabel();
}
function simPostOn(ph){
  let g=0, was=ph;
  while(SEA.phase!=="week"&&SEA.phase!=="done"&&g++<300){
    was=SEA.phase;
    SEA.userTeam=S.myTeam; SEA.advance(); SEA.forcedList=[]; SEA.forced=null; S.steps++;
    if((LEAGUE.post.stopAfter||["selection"]).indexOf(was)>=0){ view="scores"; break }     // a moment to see, not sim past: Selection Sunday, the field
    // (and shown: the click stopped there with the team page still up, so it looked like nothing happened: Grokbot)
    if(SEA.phase!=="done"&&SEA.postMatchup(S.myTeam))break;
  }
  LEAGUE.ui.afterAdvance(was);                  // the views follow the last round played (Selection Sunday's field)
  flash={type:"post"}; reveal=null; save(); render();
}
function doAdvance(){
  scoreWk=null;                                   // Scores follows the new week
  skipIdleDays();
  if(SEA.phase==="done"){ openOffseason(); return; }
  const before=SEA.step;
  const ph=SEA.phase;
  S.plans=S.plans||{}; S.plans[before]=plan;
  if(live&&live.done)live=null;               // last game is over; don't block the next
  ensureCoaches();
  SEA.userTeam=S.myTeam;
  SEA.featured=(S.featured===undefined?null:S.featured); SEA.deploy=S.deploy||null;
  SEA.plan=plan;
  // your first game this step not yet played (a cup week has two; a reload
  // between them picks up at the second)
  const doneN=(S.played&&S.played[callKey(before)]||[]).filter(p=>p.team===S.myTeam&&(!LEAGUE.splitCup||!!p.cup===!!SEA.half)).length;
  const mineNow=(SEA.phase==="week"&&SEA.gamesFor)?SEA.gamesFor(S.myTeam,before):null;
  if(mineNow&&doneN&&doneN>=mineNow.length&&!isHotSeat()){ resolveWeek(before); return }
  const ug=(SEA.phase==="week")?(mineNow?mineNow[doneN]||null:SEA.nextGame(S.myTeam))
          :(SEA.phase!=="done"?SEA.postMatchup(S.myTeam):null);
  if(spectating()){ simPostOn(ph); return }
  const wantLive = ug && SEA.roster && !prefersReduced() && (S.watchMode||"all")!=="never" && !simOnce;
  // meeting a coach who comes later this turn: they play it, with both of you calling
  const laterRival = isHotSeat() && ug && coachIndexOf(opponentOf(ug)) > (S.turn||0);
  if(wantLive && !live && laterRival){ handoffNotes[opponentOf(ug)]={vs:S.myTeam, coach:S.career.name}; }
  else if(wantLive && !live){
    startLive(ug, before, SEA.half?1:(mineNow?doneN:0));
    return;                                    // the game is played in the viewer
  }
  // no live game to play (a bye, or watching turned off): still hand over
  if(isHotSeat() && (S.turn||0) < coachCount()-1){
    S.plans[before]=plan;
    stashCoach(); live=null; plan="balanced";
    loadCoach((S.turn||0)+1);
    handoff=true; save(); render(); return;
  }
  SEA.userTeam=S.myTeam;
  const wasCup=!!SEA.half;
  SEA.advance();
  SEA.forcedList=[]; SEA.forced=null;
  S.steps++;
  skipCupNight();
  if(isHotSeat())plan="balanced";
  if(isHotSeat()){ stashCoach(); loadCoach(0) }
  LEAGUE.ui.afterAdvance(ph);
  flash={type:SEA.phase==="week"||before<LEAGUE.weeks?"week":"post",step:before,cup:wasCup};
  const g=heroGame();
  const rk=SEA.poll.rankMap();
  if(g&&!prefersReduced()&&(S.watchMode||"all")==="never"){
    reveal="half";
    if(revealTimer)clearTimeout(revealTimer);
    // the reveal re-renders only the screen it was for: fired on draft night it rebuilt the page between the two taps
    // of a pick and the pick was lost (found by the browser test, round 32)
    revealTimer=setTimeout(()=>{ if(reveal!=="half")return; reveal="final"; if(S.off||live)return; render() },1500);
  }else reveal=null;
  save(); render();
}

function openOffseason(){
  if(SEA.phase!=="done")return;
  const rng=new RNG((S.seasonSeed^(U.year*7919))>>>0);
  if(S.off&&S.off.year===SEA.year)return;      // already booked this coach
  const my=S.myTeam, C=S.career;
  const exp=S.expNow||expectations();
  let A;
  if(isHotSeat()){
    // once per offseason for the whole league; each coach reads their part
    if(!S.carousel||S.carousel.year!==SEA.year){
      recordCoaches(U,SEA.rec,SEA.champion,SEA.confChampions(),SEA.year,SEA.drw);
      const users={};
      S.coaches.forEach((c,i)=>{
        const cur=i===(S.turn||0);
        const t=cur?S.myTeam:c.myTeam, H=(cur?S.history:c.history)||[];
        const e=(cur?S.expNow:c.expNow)||LEAGUE.goals.expectations(U.program[t]);
        users[t]=missedTwiceFor(t,H,e);
      });
      S.carousel={year:SEA.year,act:offseasonCoaching(U,rng,SEA.rec,SEA.elo,users),users:users};
    }
    const X=S.carousel.act;
    A=Object.assign({},X,{userOpen:!!X.userOpenBy[my],candidates:X.candidatesBy[my]||null,
      staffOpen:X.staffOpenBy[my]||{oc:false,dc:false}});
  }else{
    recordCoaches(U,SEA.rec,SEA.champion,SEA.confChampions(),SEA.year,SEA.drw);
    const users={[my]:missedTwice(my,exp)};
    A=offseasonCoaching(U,rng,SEA.rec,SEA.elo,users); A.users=users;   // kept: a reload replays this (replayCarousel)
  }
  const titles=SEA.honours(my);
  C.rep=C.rep*0.94;                       // reputations fade, good and bad
  C.rep+=repDelta(SEA.rec[my][0],SEA.rec[my][1],exp.w,U.program[my],titles);
  // the board's objectives: each one met is worth reputation
  const om=objectivesMet(my); C.rep+=OBJ_REP*om;
  C.objLog=(C.objLog||[]).concat([{year:SEA.year,team:my,met:om,of:seasonObjectives(my).length}]);
  C.rep=Math.max(-48,Math.min(80,C.rep));
  C.w+=SEA.rec[my][0]; C.l+=SEA.rec[my][1];
  if(LEAGUE.draws)C.d=(C.d||0)+((SEA.drw&&SEA.drw[my])||0);
  if(titles.natl)C.titles++; if(titles.conf)C.confs++;
  const st=C.stops[C.stops.length-1];
  st.w+=SEA.rec[my][0]; st.l+=SEA.rec[my][1]; if(LEAGUE.draws)st.d=(st.d||0)+((SEA.drw&&SEA.drw[my])||0);
  if(titles.natl)st.titles++;
  st.to=SEA.year;
  const staffCands={};
  if(A.staffOpen&&A.staffOpen.oc)staffCands.oc=coordCandidates(rng,U.program[my],"oc",C.rep);
  if(A.staffOpen&&A.staffOpen.dc)staffCands.dc=coordCandidates(rng,U.program[my],"dc",C.rep);
  // an assistant you fired during the season doesn't come back: his job is open (Muse: he returned the next season)
  // no two candidates with one name (two "Scott Blackmon"s, one unproven, one among the best: Instinct).
  // Renamed without dice, so nothing else changes.
  ["oc","dc"].forEach(side=>{ const L=staffCands[side]; if(!L)return; const seen=new Set();
    L.forEach((c,i)=>{ let k=0; while(seen.has(c.n)&&k<COACH_FIRST.length){ c.n=COACH_FIRST[(i*7+k++)%COACH_FIRST.length]+" "+c.n.split(" ").slice(1).join(" ") } seen.add(c.n) }) });
  ["oc","dc"].forEach(side=>{ if(SEA.midFired&&SEA.midFired[side]&&!staffCands[side]){
    staffCands[side]=coordCandidates(rng,U.program[my],side,C.rep); A.staffOpen=Object.assign({},A.staffOpen||{},{[side]:true}) } });
  // a league can run its own market (soccer: relative to your club, not fixed bands)
  const jobs=A.userOpen?(LEAGUE.jobMarket?LEAGUE.jobMarket(U,rng,C.rep,A.openJobs,my,!!A.fired):jobMarket(U,rng,C.rep,A.openJobs,my)):[];
  const poach=A.userOpen?[]:(LEAGUE.poachOffers?LEAGUE.poachOffers(U,rng,C.rep,A.openJobs,my):poachOffers(U,rng,C.rep,A.openJobs,my));
  const LO=LEAGUE.offseason.open(U,my,SEA.rec[my][0]);   // the league's own choices
  S.off={year:SEA.year,act:A,jobs:jobs,poach:poach,move:null,pool:LO.pool,staff:staffCands,
    picks:Object.assign({phil:(U.phil||"balanced"),oc:null,dc:null},LO.picks),
    rngA:[rng.a,rng.sp]};
  flash=null; save(); render();
}

function commitOffseason(){
  const P=S.off.picks, A=S.off.act, C=S.career;
  if(A.userOpen&&S.off.move===null)return;
  if(LEAGUE.ui.offseasonBlock()!==null)return;
  // rngA was meant to carry the stream on, but the state it read was hidden (undefined), so every
  // offseason has run on seed 0 from here: kept, or every future offseason would change (Nov 2026)
  const rng=new RNG(0); rng.sp=S.off.rngA[1];
  const oldTeam=S.myTeam;
  let dest=S.off.move;
  if(dest==="retire"){S.retired=true;save();render();return}
  if(dest&&dest!==oldTeam){
    // the program you leave hires someone else; you take the new job
    U.coach[oldTeam]=newCoach(rng,U.program[oldTeam]); U.coach[oldTeam].since=SEA.year+1;
    C.fired+=(A.userOpen?1:0);
    C.stops.push({team:dest,from:SEA.year+1,w:0,l:0,titles:0});
    S.myTeam=dest; U.userTeam=dest; U.phil="balanced";
    U.coach[dest]=Object.assign({},U.coach[oldTeam]||{},
      {id:0,n:C.name,q:0,t:0,hired:true,you:true,since:SEA.year+1});
  }
  ["oc","dc"].forEach(side=>{
    const cands=S.off.staff&&S.off.staff[side];
    if(cands){
      const pick=cands[P[side]!==null&&P[side]!==undefined?P[side]:0];
      if(side==="oc")U.oc[S.myTeam]=pick; else U.dc[S.myTeam]=pick;
    }
  });
  distinctStaff(U,S.myTeam);
  S.pending=S.pending||{};
  S.pending[S.myTeam]=Object.assign(LEAGUE.offseason.choices(P),{phil:P.phil,
                       featured:(S.featured===undefined?null:S.featured), deploy:S.deploy||null});
  if(isHotSeat() && (S.turn||0) < coachCount()-1){
    writeSeasonHistory(oldTeam);                // this coach's year, in their book
    stashCoach(); loadCoach((S.turn||0)+1);
    S.off=null; handoff=true; openOffseason(); save(); render(); return;
  }
  const users=S.pending; S.pending=null;
  // featuring lasts a season: remember who it was, so the roster can say it reset
  // (from the club you coached this season: after a move, S.myTeam is the new
  // one, and its player in that slot is someone else; Muse saw the new club's
  // man named. Featuring doesn't follow you: the summer's development is for
  // the player you featured, and he isn't yours any more.)
  { const fp=(S.featured!==null&&S.featured!==undefined&&SEA.roster&&SEA.roster[oldTeam])?SEA.roster[oldTeam][S.featured]:null;
    S.featuredLast=fp?{n:fp.n,year:SEA.year,team:oldTeam}:null;
    if(oldTeam!==S.myTeam){ S.featured=null; users[S.myTeam]&&(users[S.myTeam].featured=null) } }
  endSeason(rng,Object.assign({userTeam:S.myTeam,users:users,coach:null},
    LEAGUE.offseason.choices(P),{phil:P.phil,
    featured:(S.featured!==undefined?S.featured:null), deploy:S.deploy||null}), A, oldTeam);
  S.featured=null;
}

/* One coach's year, written into their own book. In a hot seat every coach
   calls this for themselves before the world moves on. */
/* team: the team this coach just coached, which is not S.myTeam if they have
   already taken another job this offseason */
function writeSeasonHistory(team){
  S.history=S.history||[];
  S.history.push(seasonEntry(team||S.myTeam));
  h2hBank(team||S.myTeam);
}
/* Head to head, every opponent (Ian: the rivalry record before a game, for any team you've played): your games,
   whichever team you coached, banked when a season is written; the season under way is counted live. Starts
   from Nov 2026: earlier seasons kept no game-by-game results except the rivalries' series. */
function h2hGames(team){
  const out=[];
  (SEA.weeks||[]).forEach(W=>(W.games||[]).forEach(g=>{ if((g.home===team||g.away===team)&&g.winner!==undefined)out.push(g) }));
  if(typeof SEA.postGamesFor==="function")SEA.postGamesFor(team).forEach(x=>{ const g=x[0]||x; if(g&&out.indexOf(g)<0)out.push(g) });
  return out;
}
function h2hAdd(H,team,g){
  const opp=g.home===team?g.away:g.home, r=H[opp]=H[opp]||{w:0,l:0,d:0};
  const ms=g.home===team?g.hp:g.ap, os=g.home===team?g.ap:g.hp;
  if(g.winner===team)r.w++; else if(g.winner&&g.winner!=="draw"&&!g.draw)r.l++; else r.d++;
  r.y=SEA.year; r.s=`${ms}-${os}`; r.won=g.winner===team?1:g.winner&&!g.draw&&g.winner!=="draw"?0:0.5;
}
function h2hBank(team){
  if(S.h2hY===SEA.year)return; S.h2hY=SEA.year;
  const H=S.h2h=S.h2h||{}; h2hGames(team).forEach(g=>h2hAdd(H,team,g));
}
/* your record against opp, banked plus this season so far */
function h2hWith(opp){
  const B=(S.h2h||{})[opp], r=B?Object.assign({},B):{w:0,l:0,d:0};
  if(S.h2hY!==SEA.year){ const H={}; h2hGames(S.myTeam).forEach(g=>{ if(g.home===opp||g.away===opp)h2hAdd(H,S.myTeam,g) });
    const c=H[opp]; if(c){ r.w+=c.w; r.l+=c.l; r.d+=c.d; r.y=c.y; r.s=c.s; r.won=c.won } }
  return r.w+r.l+r.d?r:null;
}

/* seasonTeam: the team coached this season. If the coach has just changed
   jobs, S.myTeam is already the new one; the season belongs to the old. */
function endSeason(rng,choices,act,seasonTeam){
  if(SEA.phase!=="done"||!rng||!act)return;
  const my=seasonTeam||S.myTeam, rk=SEA.poll.rankMap();
  const result=SEA.seasonResult(my);
  const teamRows={};
  NAMES.forEach(t=>{teamRows[t]=[SEA.rec[t][0],SEA.rec[t][1],rk[t]]; if(LEAGUE.draws)teamRows[t].push((SEA.drw&&SEA.drw[t])||0);
    else if(SEA.otl)teamRows[t].push(null,SEA.otl[t]||0)});   // [w,l,rank,draws]
  const {confChamps,post,pnote,cfpOf}=SEA.postRecord();
  LEAGUE.rivals.record(U,SEA);
  SEA.bankCareers(U);
  if(S.calls){ const keep={}, pre=SEA.year+":";
    Object.keys(S.calls).forEach(k=>{if(k.indexOf(pre)===0)keep[k]=S.calls[k]});
    S.calls=keep;
    if(S.callAuto){ const ka={}; Object.keys(S.callAuto).forEach(k=>{if(k.indexOf(pre)===0)ka[k]=S.callAuto[k]}); S.callAuto=ka } }
  if(U.coach[S.myTeam])U.coach[S.myTeam].q=Math.round(Math.max(-40,Math.min(60,S.career.rep*0.62)));
  // the entry is written before the offseason runs: promotion, relegation
  // and realignment move teams, and the season belongs to the group it was played in
  const entry=seasonEntry(my);
  const B=LEAGUE.offseason.run(U,rng,SEA.healthy(),SEA.elo,SEA.rec,choices);
  const off=Object.assign({},act,B);
  const exp=S.expNow||expectations();
  const miles=milestones(SEA.rec[my][0],SEA.rec[my][1],result,rk[my],my);
  S.history.push(Object.assign(entry,{
    miles:miles, exp:exp.t, program:Math.round(U.program[my]),
    teams:teamRows, top10:SEA.poll.order().slice(0,10),
    groupChamps:confChamps, seeds:cfpOf, post:post, pnote:pnote,
    awards:{mvp:(SEA.mvpRace(3)||[]).map(x=>({n:x.n,p:x.p,t:x.t,r:x.r,c:x.c,line:x.line})),
      team:SEA.awardTeam(my)},
    coaching:{fired:off.fired.indexOf(my)>=0, firedList:off.fired, nFired:off.fired.length,
      hires:(off.hires||[]).slice(0,60), poached:(off.poached||[]).slice(0,12),
      coordMoves:(off.coordMoves||[]).slice(0,6),
      coachNow:(U.coach&&U.coach[my])?{n:U.coach[my].n,q:U.coach[my].q,t:U.coach[my].t}:null},
    league:LEAGUE.historyExtras(SEA,off,my)}));
  // hot seat: the other coaches' entries for this season were written at the
  // hand-over, before the league had finished its year. Complete them now.
  (S.coaches||[]).forEach((c,i)=>{
    if(i===(S.turn||0)||!c.history)return;
    const e=c.history.find(x=>x.year===SEA.year&&!x.teams); if(!e)return;
    const t=e.team, before=c.history.filter(x=>x!==e);
    Object.assign(e,{program:Math.round(U.program[t]),
      exp:(c.expNow||LEAGUE.goals.expectations(U.program[t])).t,
      miles:milestones(SEA.rec[t][0],SEA.rec[t][1],e.result,rk[t],t,before),
      teams:teamRows, top10:SEA.poll.order().slice(0,10),
      groupChamps:confChamps, seeds:cfpOf, post:post, pnote:pnote,
      awards:{mvp:(SEA.mvpRace(3)||[]).map(x=>({n:x.n,p:x.p,t:x.t,r:x.r,c:x.c,line:x.line})),
        team:SEA.awardTeam(t)},
      coaching:{fired:off.fired.indexOf(t)>=0, firedList:off.fired, nFired:off.fired.length,
        hires:(off.hires||[]).slice(0,60), poached:(off.poached||[]).slice(0,12),
        coordMoves:(off.coordMoves||[]).slice(0,6),
        coachNow:(U.coach&&U.coach[t])?{n:U.coach[t].n,q:U.coach[t].q,t:U.coach[t].t}:null},
      league:LEAGUE.historyExtras(SEA,off,t)});
  });
  distinctLeague(U);
  U.schedV=2;                                            // (schedOrder)
  delete S.schedLock;                                    // a new season draws its own, the same way every time
  // a promotion or a firing belongs to its season: kept by step, last season's were replayed into this one on every
  // reload (a coordinator fired in week 4 last year was fired again, and a whole season went to "Interim staff": Muse)
  S.uStart=snap(U); S.off=null; S.plans={}; S.played={}; S.carousel=null; S.promos={}; S.fires={}; S.choiceYear=U.year;
  S.seasonSeed=(S.seasonSeed*1103515245+12345)>>>0;
  S.steps=0; rebuild(); S.expNow=expectations();
  if(isHotSeat()){
    // a new season: every coach's expectations for the team they now coach,
    // no plans carried over from last year, and coach 1 goes first
    stashCoach();
    S.coaches.forEach(c=>{c.expNow=LEAGUE.goals.expectations(U.program[c.myTeam]); c.plans={}; c.promos={}; c.fires={}});
    loadCoach(0);
  }
  flash={type:"offseason"}; view="team"; save(); render();
}

/* ============ rendering ============ */
function rkTag(r){return r&&r<=RANK_TOP?`<span class="rk" title="${LEAGUE.position?"Table position":"Ranked No. "+r}">${LEAGUE.position?"":"#"}${r}</span>`:""}   // "#8", so it reads as a ranking, not part of a code

function gameLine(g,mine){
  const hw=g.winner===g.home;
  const best=Math.min(g.hrank||999,g.arank||999);
  const ups=g.hrank&&g.arank?(hw?g.hrank>g.arank:g.arank>g.hrank):false;
  const cls="game"+(best<=RANK_TOP?" marquee":"")+(ups&&best<=RANK_TOP?" upset":"")+(mine?" mine":"");
  const side=(t,s,r,w,seed,rec)=>`<div class="side ${w?'w':''}">${
    seed?`<span class="sdchip">${seed}</span>`:rkTag(r)}
    <span class="nm">${TL(t)}</span>${rec?`<span class="grec">${rec}</span>`:""}
    <span class="sc">${s}</span></div>`;
  const chips=[];
  if(g.title)chips.push(`<span class="chip ttl">${esc(g.title)}</span>`);
  if(g.site)chips.push(`<span class="chip ttl">${esc(g.site)}</span>`);
  if(ups&&best<=RANK_TOP)chips.push(`<span class="chip up">Upset</span>`);
  if(g.neutral&&!g.site&&!g.title)chips.push(`<span class="chip">Neutral</span>`);
  if(LEAGUE.draws){ if(g.draw)chips.push(`<span class="chip">Draw</span>`); else if(g.margin<=1)chips.push(`<span class="chip">One goal</span>`) }
  else if(g.margin<=3)chips.push(`<span class="chip">One score</span>`);
  const rv=LEAGUE.rivals.name(g.home,g.away);
  if(rv)chips.push(`<span class="chip riv">${esc(rv)}</span>`);
  return `<article class="${cls}"><div class="edge" style="${mine?`background:${teamInk(g.winner)}`:""}"></div><div class="gbody">
    ${LEAGUE.homeFirst?side(g.home,g.hp,g.hrank,hw&&!g.draw,g.hseed,g.hrec)+side(g.away,g.ap,g.arank,!hw&&!g.draw,g.aseed,g.arec)
      :side(g.away,g.ap,g.arank,!hw,g.aseed,g.arec)+side(g.home,g.hp,g.hrank,hw,g.hseed,g.hrec)}
    ${chips.length?`<div class="meta">${chips.join("")}</div>`:""}</div></article>`;
}

/* ---- watching a game ---- */
let watch=null;   // {g, script, i, timer}

function watchSeed(g){
  return (g.hp*7919 + g.ap*104729 + (g.week||0)*131 + (g.home.length*17) + g.away.length)>>>0;
}

function speedMult(){
  const k=S.watchSpeed||"normal";
  const f=SPEEDS.find(s=>s[0]===k);
  return f?f[1]:1;
}
function watchGap(){
  const n=Math.max(1,watch.script.length);
  return Math.max(120,Math.min(2600,Math.round(7200/n/speedMult())));
}
/* playback speeds for watching a game (live or a replay) */
const SPEEDS=[["slow",0.34,"Slow"],["normal",0.52,"Normal"],["fast",1.0,"Fast"],["rapid",2.1,"Very fast"]];

function tickWatch(){
  if(!watch)return;
  if(watch.timer){clearTimeout(watch.timer);watch.timer=null}
  render();
  if(!watch.paused && watch.i<watch.script.length){
    watch.timer=setTimeout(()=>{watch.i++;tickWatch()},watch.i<0?650:watchGap());
  }
}
function stepWatch(){
  if(!watch)return;
  if(watch.i<watch.script.length){watch.i++;}
  tickWatch();
}
function togglePause(){
  if(!watch)return;
  watch.paused=!watch.paused;
  S.watchStep=watch.paused; save();
  tickWatch();
}
function stopWatch(finish){
  if(watch&&watch.timer)clearTimeout(watch.timer);
  if(finish&&watch){watch.i=watch.script.length;watch.timer=null;render();return}
  watch=null; render();
}

function prefersReduced(){
  try{return window.matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}
}

function liveRec(team){
  const w=SEA.rec[team][0], l=SEA.rec[team][1];
  if(reveal!=="half")return [w,l];
  const g=heroGame();
  if(!g||(g.home!==team&&g.away!==team))return [w,l];
  if(g.draw)return [w,l];                                  // a draw: neither column
  return g.winner===team?[w-1,l]:[w,l-1];
}

function liveConf(team){
  const w=SEA.confrec[team][0], l=SEA.confrec[team][1], o=(SEA.confotl&&SEA.confotl[team])||0;   // [wins, losses (overtime ones included), overtime losses]
  if(reveal!=="half")return [w,l,o];
  const g=heroGame();
  if(!g||!g.conf||(g.home!==team&&g.away!==team))return [w,l,o];
  if(g.draw)return [w,l,o];
  return g.winner===team?[w-1,l,o]:[w,l-1,g.ot&&LEAGUE.tracksOT?o-1:o];
}

/* the game the result card shows: on a cup night the cup tie, otherwise
   the league game (Rewatch must replay the same one) */
function heroWeekGame(W,my){
  return (flash&&flash.cup?W.games.find(x=>x.cup&&(x.home===my||x.away===my)):null)
    ||W.games.find(x=>!x.cup&&(x.home===my||x.away===my))||W.games.find(x=>x.home===my||x.away===my)||null;
}
function heroGame(){
  const my=S.myTeam;
  if(flash&&flash.type==="week"){
    const W=SEA.weeks[flash.step];
    if(W)return heroWeekGame(W,my);
  }else if(flash&&flash.type==="post"){
    return lastPostGame(my);
  }
  return null;
}
/* your latest postseason game: pools run latest round first, and a series
   puts several of yours in one round (the first found was game 1, which made
   every result card in a series show game 1) */
function lastPostGame(my){
  for(const p of SEA.postPools()){ const m=p.filter(x=>x.home===my||x.away===my); if(m.length)return m[m.length-1] }
  return null;
}

function heroResult(){
  const my=S.myTeam;
  let g=null,label="",cupG=null;
  if(flash&&flash.type==="week"){
    const W=SEA.weeks[flash.step];
    if(W){g=heroWeekGame(W,my);label=W.label;
      cupG=W.games.find(x=>x.cup&&x!==g&&(x.home===my||x.away===my))||null;
      // leagues that number steps by calendar day name your game by your count
      if(g&&LEAGUE.myGameLabel)label=LEAGUE.myGameLabel(SEA.weeks.slice(0,flash.step+1)
        .filter(w=>w.games.some(x=>!x.cup&&(x.home===my||x.away===my))).length);
      if(g&&g.cup){label=g.title; cupG=null}}
  }else if(flash&&flash.type==="post"){
    g=lastPostGame(my);
  }
  if(!g)return "";
  const won=g.winner===my;
  const opp=g.home===my?g.away:g.home;
  const half=(reveal==="half"&&g.hh!==undefined);
  const ms=half?(g.home===my?g.hh:g.ah):(g.home===my?g.hp:g.ap);
  const os=half?(g.home===my?g.ah:g.hh):(g.home===my?g.ap:g.hp);
  const cur=SEA.poll.rankMap(), pv=SEA.prevRank;
  let move="";
  if(pv&&pv[my]){
    const d=pv[my]-cur[my];
    const T=RANK_TOP;
    if(cur[my]<=T&&pv[my]>T)move=`<div class="hmove up">${LEAGUE.text.entered}${cur[my]}</div>`;
    else if(cur[my]>T&&pv[my]<=T)move=`<div class="hmove dn">${LEAGUE.text.dropped||"Dropped out of the poll"}</div>`;
    else if(cur[my]<=T&&d>0)move=`<div class="hmove up">&#9650; Up ${d} to #${cur[my]} in ${esc(LEAGUE.text.ranking||"the rankings")}</div>`;
    else if(cur[my]<=T&&d<0)move=`<div class="hmove dn">&#9660; Down ${-d} to #${cur[my]} in ${esc(LEAGUE.text.ranking||"the rankings")}</div>`;   // what dropped (Grokbot: "Down 3 to 86")
    else if(cur[my]<=T)move=`<div class="hmove flat">Holding at #${cur[my]} in ${esc(LEAGUE.text.ranking||"the rankings")}</div>`;
  }
  if(LEAGUE.position&&LEAGUE.positionLine)move=`<div class="hmove flat">${LEAGUE.positionLine(my)}</div>`;
  // a playoff game says where the series stands, and a defeat that ends the season says so (Muse: Winnipeg's
  // Game 6 elimination looked exactly like a November game)
  if(flash&&flash.type==="post"&&!g.draw&&!half){
    const X=SEA.series&&g.series&&(SEA.series[g.series]||[]).find(x=>x.games&&x.games.indexOf(g)>=0);
    if(X){ const a=X.w[my]||0, b=X.w[opp]||0;
      move=X.winner===my?(SEA.champion===my?`<div class="hmove up">Champions: won the series ${a}&ndash;${b}</div>`:`<div class="hmove up">Series won ${a}&ndash;${b}: through to the next round</div>`)
        :X.winner?`<div class="hmove dn">Season over: ${SEA.champion&&SEA.champion===opp?"beaten in the final":"out of the playoffs"}, ${a}&ndash;${b} in the series</div>`   // a Finals defeat isn't "out of the playoffs" (Grokbot)
        :`<div class="hmove flat">Series ${a}&ndash;${b}${a>b?": you lead":a<b?": they lead":": level"}</div>` }
    // a one-game knockout (football's playoffs and bowls) has no next game to look for: a defeat ends it there and then,
    // and says where (Grokbot, Instinct: the Wild Card loss read "Down 2 to #13" until the playoffs were simmed)
    else if(!won&&g.winner&&(typeof SEA._nextFor==="function"?!SEA._nextFor(my):true))move=`<div class="hmove dn">Season over${g.title?`: beaten in the ${esc(String(g.title).replace(/^(the )/i,""))}`:""}</div>`;
    else if(won&&SEA.champion===my)move=`<div class="hmove up">Champions</div>` }
  const cupRes=LEAGUE.cup&&LEAGUE.cup.result?LEAGUE.cup.result(Object.assign({week:flash&&flash.step},g),my):null;   // a league's own line (the NBA Cup's group games, league games too)
  if(cupRes)move=g.cup?cupRes:(move||"")+cupRes;
  else if(g.cup&&LEAGUE.cup){ const nx=LEAGUE.cup.rounds[g.round+1];
    // a level tie says how it was settled: a 0-0 "into the second round" read as a mystery (Ian)
    const how=g.pens?(won?"Won on penalties: ":"Lost on penalties: "):g.ot?(won?"Won in extra time: ":"Lost in extra time: "):"";
    move=`<div class="hmove ${won?'up':'dn'}">${how}${won?(nx?(how?"into the ":"Into the ")+esc(nx.name):(how?LEAGUE.cup.name+" winners":LEAGUE.cup.name.toUpperCase()+" WINNERS")):(how?"out of the "+LEAGUE.cup.name:"Out of the "+LEAGUE.cup.name)}</div><button class="rewatch seedraw" data-cupview="1">${LEAGUE.cup.groups?"See the Cup":"See the draw"}</button>` }
  if(half)return `<div class="hero half">
    <div class="hlabel"><span class="live"></span>HALFTIME${label?" &middot; "+esc(label):""}</div>
    <div class="hscore">${ms}<span>&ndash;</span>${os}</div>
    <div class="hopp">${haWord(g,my)} ${esc(opp)}</div>
    <div class="hfoot">Second half under way&hellip;</div></div>`;
  return `<div class="hero ${won?'win':g.draw?'draw':'loss'}" style="--tc:${teamInk(my)}">
    <div class="hlabel">FINAL${g.pens?" (PENALTIES)":g.so?" (SHOOTOUT)":g.ot&&!LEAGUE.draws?" (OT)":g.ot?" (EXTRA TIME)":""} &middot; ${won?"WIN":g.draw?"DRAW":"LOSS"}${label?" &middot; "+esc(label):""}</div>
    <div class="hscore">${ms}<span>&ndash;</span>${os}</div>
    <div class="hopp">${haWord(g,my)} ${esc(opp)}</div>${move}${cupG?cupLineHTML(cupG,my):""}${(()=>{ const st=flash&&flash.step; if(st===undefined||st===null||!S.played)return "";
      return impactHTML((S.played[callKey(st)]||[]).filter(p=>p.team===S.myTeam&&(!LEAGUE.splitCup||!!p.cup===!!(flash&&flash.cup)))) })()}${readsHTML(flash&&flash.step)}${guideNote("result","Each call you made is graded here: a read against what they really did, a situation call against what your assistant would have done, replayed many times from that moment. Calls too close to separate aren't graded either way.")}
    ${SEA.roster?`<button class="rewatch" data-rewatch="1">Rewatch</button>`:""}</div>`;
}

    <div><div class="fname">${esc(lab)}</div>
    <div class="fnote">${Y&&Y.n?pct(Y.right,Y.n)+"% this season &middot; ":"None yet this season &middot; "}${T.right} of ${T.n} in your career (${pct(T.right,T.n)}%) &middot; graded reads only</div>
