<style>
:root{--ink:#10131C;--panel:#191E2C;--panel2:#141928;--line:#2A3145;--bone:#E9E5DA;
 --muted:#7F89A0;--sodium:#F4A63A;--flag:#E45B4E;--turf:#46B583;--vote:#8B9FE8;
 --cond:'Barlow Condensed',Impact,sans-serif;--body:'Barlow',system-ui,sans-serif;
 --mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--bone);font-family:var(--body);
 -webkit-font-smoothing:antialiased;padding-bottom:200px}
#app{max-width:760px;margin:0 auto}
.mast{padding:26px 16px 16px;border-bottom:1px solid var(--line)}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;
 color:var(--sodium)}
.mast h1{font-family:var(--cond);font-weight:700;font-size:40px;line-height:.92;
 margin-top:8px;text-transform:uppercase}
.mast p{color:var(--muted);font-size:13px;margin-top:10px;line-height:1.5}
.stick{position:sticky;top:0;z-index:20;background:rgba(16,19,28,.97);
 backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 16px 9px}
.tb-left{min-width:0;flex:1 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tb-yr{font-family:var(--mono);font-size:11px;color:var(--sodium);letter-spacing:.14em}
.tb-team{font-family:var(--cond);font-size:21px;font-weight:700;text-transform:uppercase;
 margin-left:9px;letter-spacing:.01em}
.tb-right{font-family:var(--mono);font-size:13px;color:var(--muted);flex:none;white-space:nowrap}
.tb-rk{color:var(--sodium);margin-left:6px}
.tabs{display:flex;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;background:none;border:none;border-bottom:2px solid transparent;
 color:var(--muted);font-family:var(--cond);font-weight:600;font-size:13.5px;
 letter-spacing:.045em;text-transform:uppercase;padding:11px 9px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--bone);border-bottom-color:var(--sodium)}
/* five tabs on a phone: "RANKINGS" pushed "DYNASTY" off the edge (Grokbot, hockey) */
@media (max-width:420px){.tab{padding:11px 6px;letter-spacing:.02em;font-size:13px}}
.tab:focus-visible,.pick:focus-visible,.advance:focus-visible{outline:2px solid var(--sodium);
 outline-offset:2px}
.actionbar{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:14px 16px 16px;
 background:linear-gradient(180deg,transparent,var(--ink) 14px)}
.actionbar .skip{background:var(--ink)}   /* opaque: text scrolling under the bar never shows through the buttons (Instinct, 390px) */
.advance{display:block;width:100%;max-width:728px;margin:0 auto;background:var(--sodium);
 color:#10131C;border:none;font-family:var(--cond);font-weight:700;font-size:19px;
 letter-spacing:.08em;text-transform:uppercase;padding:15px;cursor:pointer;border-radius:2px}
.advance:active{transform:translateY(1px)}
.skip{display:block;width:100%;max-width:728px;margin:0 auto 7px;background:none;
 border:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:10.5px;
 letter-spacing:.08em;text-transform:uppercase;padding:9px;cursor:pointer;border-radius:2px}
.skip:hover{border-color:var(--sodium);color:var(--sodium)}
.digest{margin:12px 0 4px}
.drow{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12.5px}
.dwk{font-family:var(--mono);font-size:10px;color:var(--muted);flex:0 0 58px}
.dres{font-family:var(--mono);font-size:12px;flex:0 0 66px}
.dres.w{color:var(--turf)}.dres.l{color:var(--flag)}.dres.bye{color:var(--muted)}
.dopp{font-family:var(--cond);font-size:15px;flex:1;white-space:nowrap;overflow:hidden;
 text-overflow:ellipsis}
.advance.gold{background:var(--bone)}
.dateline{display:flex;justify-content:space-between;align-items:baseline;padding:16px 16px 8px}
.dateline h2{font-family:var(--cond);font-size:25px;font-weight:700;text-transform:uppercase}
.dateline span{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.1em}
.wknav{display:flex;align-items:center;gap:10px;padding:14px 12px 8px}
.wkmid{flex:1;min-width:0;text-align:center}
.wkmid h2{font-family:var(--cond);font-size:25px;font-weight:700;text-transform:uppercase;line-height:1}
.wkmid span{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.1em}
.wkbtn{flex:none;width:40px;height:36px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--bone);font-size:17px;cursor:pointer}
.wkbtn:disabled{opacity:.3;cursor:default}
.game.fixture .sc{min-width:0}
.grouphead{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
 color:var(--muted);padding:18px 16px 7px;border-top:1px solid var(--line);margin-top:8px}
.note{color:var(--muted);font-size:12.5px;padding:18px 16px;line-height:1.5}
.hero{margin:16px;padding:20px;border:1px solid var(--line);text-align:center;
 animation:pop .32s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.hero.half{border-color:var(--vote);
 background:linear-gradient(180deg,rgba(139,159,232,.12),transparent)}
.hero.half .hlabel{color:var(--vote)}
.planbox{margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.planlab{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--muted);
 text-transform:uppercase}
.plans{display:flex;gap:5px;margin-top:7px}
.planbtn{flex:1;font-family:var(--cond);font-size:13px;font-weight:600;padding:8px 3px;

.planbtn[aria-pressed="true"]{border-color:var(--sodium);color:var(--sodium);

.planbtn:focus-visible{outline:2px solid var(--sodium);outline-offset:2px}
.pland{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.4}
.hero.win{border-color:var(--turf);background:linear-gradient(180deg,rgba(70,181,131,.13),transparent)}
.hero.loss{border-color:var(--flag);background:linear-gradient(180deg,rgba(228,91,78,.11),transparent)}
.hlabel{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;
 color:var(--muted)}
.hero.win .hlabel{color:var(--turf)}.hero.loss .hlabel{color:var(--flag)}
.hscore{font-family:var(--cond);font-size:52px;font-weight:700;line-height:1;margin:6px 0 2px}
.hscore span{color:var(--muted);margin:0 8px;font-weight:500}
.hopp{font-family:var(--cond);font-size:19px;font-weight:500;color:var(--muted);
 text-transform:uppercase;letter-spacing:.04em}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--vote);
 margin-right:7px;vertical-align:middle;animation:blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.hfoot{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
 color:var(--vote);margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.lgbtns{padding:4px 16px 10px;display:flex;flex-direction:column;gap:7px}
.lgbtns .advance{margin:0}
.lgmsg{font-family:var(--mono);font-size:10.5px;color:var(--sodium);padding:0 16px 10px;
 letter-spacing:.08em}
.setrow{display:flex;gap:6px;padding:0 16px 10px;flex-wrap:wrap}
.setbtn{flex:1;min-width:110px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
 text-transform:uppercase;padding:9px 6px;border:1px solid var(--line);background:none;
 color:var(--muted);cursor:pointer}
.setbtn[aria-pressed="true"]{border-color:var(--sodium);color:var(--sodium);
.lineset{padding:2px 0 8px}.lineset .setrow{padding:6px 0}
 background:rgba(244,166,58,.1)}
.pick.taken{opacity:.32;pointer-events:none}
.handwrap{max-width:520px;margin:0 auto;padding:64px 24px 120px;text-align:center}
.handlabel{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
 color:var(--vote)}
.handname{font-family:var(--cond);font-size:26px;font-weight:600;color:var(--muted);margin-top:18px}
.handteam{font-family:var(--cond);font-size:52px;font-weight:700;text-transform:uppercase;
 line-height:1.05;margin-top:2px}
.handrec{font-family:var(--mono);font-size:13px;color:var(--bone);margin-top:10px;letter-spacing:.06em}

.ldwrap{padding:0 16px}
.ldcat{margin-bottom:16px}
.ldlabel{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;

.ldrow{display:flex;align-items:baseline;gap:9px;padding:6px 0;

.ldrow.first .ldname{color:var(--bone);font-weight:600}
.ldn{font-family:var(--mono);font-size:10px;color:var(--muted);flex:0 0 12px}
.ldname{flex:1;font-family:var(--cond);font-size:16px;color:#B4BCCB;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldyr{font-family:var(--mono);font-size:10px;color:var(--muted);flex:0 0 auto}
.ldv{font-family:var(--mono);font-size:13px;color:var(--bone);flex:0 0 auto;min-width:52px;
 text-align:right}
.drow,.arow{display:flex;align-items:center;gap:11px;padding:11px 16px;
 border-bottom:1px solid rgba(42,49,69,.55)}
.dpick{font-family:var(--mono);font-size:12px;color:var(--sodium);flex:0 0 42px;
 letter-spacing:.04em}
.dovr{font-family:var(--mono);font-size:11px;color:var(--muted);flex:0 0 auto}
.dpos{font-family:var(--mono);font-size:9px;color:var(--muted);margin-left:6px;
 letter-spacing:.1em}

.ares{font-family:var(--mono);font-size:12px;color:var(--muted);flex:0 0 auto}
.ares.gold{color:var(--sodium)}.ares.up{color:var(--turf)}
.ycard{flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--muted);

.cardbtn{display:block;width:calc(100% - 32px);margin:14px 16px 0;padding:14px;
 background:var(--sodium);color:var(--ink);border:none;border-radius:2px;

 text-transform:uppercase;cursor:pointer}
.staffhead{padding-top:16px}
.staffroom{padding:0 16px 2px}
.say{display:flex;gap:10px;align-items:flex-start;padding:9px 0;

.say:last-child{border-bottom:none}
.say.tight{margin:0 16px 8px;padding:10px 12px;border:1px solid var(--line);
 border-top:none;background:rgba(255,255,255,.015)}
.facewrap{flex:0 0 auto;width:38px;height:32px;display:block}
.facewrap.bears{width:54px}
.face{width:100%;height:100%;display:block}
.saybody{flex:1;min-width:0;padding-top:1px}
.sayname{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;
 text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.saytext{display:block;font-size:13.5px;line-height:1.42;color:var(--bone)}
.callbox{margin:14px 16px 0;padding:16px;border:1px solid var(--sodium);
 background:rgba(244,166,58,.09)}
.callbox .wlabel{color:var(--sodium)}
.callscore{font-family:var(--mono);font-size:12px;color:var(--bone);text-align:center;
 margin-top:8px;letter-spacing:.05em}
.calltitle{font-family:var(--cond);font-size:29px;font-weight:700;text-transform:uppercase;

.callopts{display:flex;flex-direction:column;gap:8px;padding:20px 16px}
.tocall{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:10px 18px;border-radius:20px;border:1px solid var(--sodium);background:var(--ink,#11141c);color:var(--sodium);box-shadow:0 4px 16px rgba(0,0,0,.5)}
@media(max-width:480px){.calltitle{font-size:23px}}
.callbtn{margin:0}
.wspeed{display:flex;gap:5px;max-width:728px;margin:0 auto 7px}
.spbtn{flex:1;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
 padding:7px 3px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.spbtn[aria-pressed="true"]{border-color:var(--sodium);color:var(--sodium);
 background:rgba(244,166,58,.1)}
.wctl{display:flex;gap:7px;max-width:728px;margin:0 auto}
.wbtn{flex:1;font-family:var(--cond);font-size:15px;font-weight:600;letter-spacing:.05em;
 text-transform:uppercase;padding:13px 6px;border:1px solid var(--line);background:var(--panel2);
 color:var(--bone);cursor:pointer;border-radius:2px}
.wbtn:hover{border-color:var(--sodium);color:var(--sodium)}
.wbtn.hot{border-color:var(--sodium);color:var(--sodium);background:rgba(244,166,58,.12)}
.whint{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
 color:var(--muted);text-align:center;padding-top:8px}
@media(max-width:1023px){.whint{display:block}}
.watchwrap{max-width:640px;margin:0 auto;padding-bottom:96px}
.wtop{margin:16px;padding:18px 16px;border:1px solid var(--vote);
 background:linear-gradient(180deg,rgba(139,159,232,.13),transparent)}

.wtop.loss{border-color:var(--flag);background:linear-gradient(180deg,rgba(228,91,78,.12),transparent)}
.wlabel{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
 color:var(--vote);text-align:center}
.wtop.win .wlabel{color:var(--turf)}.wtop.loss .wlabel{color:var(--flag)}
.wscore{display:flex;gap:14px;margin-top:14px}
.wside{flex:1;text-align:center;padding:10px 4px;border:1px solid var(--line)}
.wside.lead{border-color:var(--sodium)}
.wt{display:block;font-family:var(--cond);font-size:17px;font-weight:600;color:var(--muted);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wside.lead .wt{color:var(--bone)}
.wn{display:block;font-family:var(--cond);font-size:44px;font-weight:700;line-height:1}
.field{display:block;width:calc(100% - 32px);margin:0 16px;height:auto}
.fpos{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;
 padding:8px 16px 2px;letter-spacing:.05em}
.dtag{font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--muted);
 border:1px solid var(--line);padding:1px 4px;margin-left:6px;white-space:nowrap}
.dtag.sc{color:var(--sodium);border-color:var(--sodium)}
.plays{padding-bottom:10px}
.play{display:flex;align-items:flex-start;gap:10px;padding:9px 16px;
 border-bottom:1px solid rgba(42,49,69,.55);animation:pop .3s ease-out}
.play.mine{background:rgba(244,166,58,.09)}
.pq{font-family:var(--mono);font-size:9.5px;color:var(--muted);flex:0 0 58px;padding-top:2px}
.ptxt{flex:1;font-size:13px;line-height:1.4}
.ptxt b{font-family:var(--cond);font-size:15px;font-weight:600}
.pscore{font-family:var(--mono);font-size:12px;color:#B4BCCB;flex:0 0 46px;text-align:right}

 font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
 padding:7px 11px;cursor:pointer}
.rewatch:hover{border-color:var(--sodium);color:var(--sodium)}

.byerow .steam{color:var(--muted);font-style:italic}
.srow.up .steam{color:var(--muted)}

.srow.up .spos{color:var(--sodium)}
.srow.post{background:rgba(244,166,58,.07)}
.vs{font-family:var(--mono);font-size:10px;color:var(--muted);margin:0 4px}

.rivmark.sod{color:var(--sodium)}
.dgone,.dmaybe,.dthere{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;margin-left:6px;white-space:nowrap}.dgone{color:var(--flag)}.dmaybe{color:var(--muted)}.dthere{color:var(--turf)}
.byelbl{font-size:11px;color:var(--muted);white-space:nowrap}
.idcard{margin:16px;padding:16px;border:1px solid var(--line);background:var(--panel2)}
.idcard{padding-left:14px}
.iname{font-family:var(--cond);font-size:30px;font-weight:700;text-transform:uppercase;line-height:1}
.imeta{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.08em}
.stats{display:flex;gap:8px;margin-top:14px}
.stats>div{flex:1;text-align:center;border:1px solid var(--line);padding:9px 4px}
.stats b{display:block;font-family:var(--cond);font-size:clamp(18px,5.6vw,25px);font-weight:700;white-space:nowrap}

/* ---------- desktop ---------- */
@media(min-width:1024px){
  body{padding-bottom:0}
  body.offseason{padding-bottom:120px}
  body.offseason .cols{grid-template-columns:minmax(0,1fr)}
  body.offseason #view{max-width:820px;margin:0 auto}
  #app{max-width:1340px}
  .cols{display:grid;grid-template-columns:390px minmax(0,1fr);align-items:start}
  #side{border-right:1px solid var(--line);
    position:sticky;top:92px;max-height:calc(100vh - 92px);overflow-y:auto;
    display:flex;flex-direction:column;
    scrollbar-width:thin;padding-bottom:14px}
  #side::-webkit-scrollbar{width:7px}
  #side::-webkit-scrollbar-thumb{background:var(--line)}
  .actionbar.hideWide{display:none}
  .sidebtn{padding:12px 16px 14px;position:sticky;bottom:0;
    background:linear-gradient(180deg,transparent,var(--ink) 26%);margin-top:6px}
  .sidebtn .advance{font-size:17px;padding:13px}
  .sidebtn .skip{margin-top:8px}
  #view{min-height:calc(100vh - 96px)}
  .mast{padding:44px 32px 26px}
  .mast h1{font-size:60px}
  .mast p{font-size:15px;max-width:640px}
  .topbar{padding:14px 24px 11px}
  .tb-team{font-size:25px}
  .tabs{padding-left:8px}
  .tab{flex:0 0 auto;font-size:15px;padding:12px 20px}
  .dateline{padding:20px 24px 10px}
  .dateline h2{font-size:29px}
  .grouphead{padding:20px 24px 8px}
  .news,.prow,.frow,.srow,.prow2,.injrow,.trow,.yrow,.game .gbody,.rnd,.note,.legend,
  .key,.sortbar,.subtabs,.seedrow,.chead,.crow,.digest{padding-left:24px;padding-right:24px}
  .cbar,.prow{border-left-width:3px}
  .idcard,.hero,.nextcard,.title-card,.banner,.cand,.opt{margin-left:16px;margin-right:16px}
  #side .idcard,#side .hero,#side .nextcard{margin-left:14px;margin-right:14px}
  #side .grouphead,#side .injrow{padding-left:18px;padding-right:18px}
  /* two-up game and standings grids */
  .gamegrid{display:grid;grid-template-columns:1fr 1fr;gap:0 1px;background:var(--line)}
  .gamegrid .game{background:var(--panel2)}
  .standgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
  .pickgrid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));padding:6px 24px 16px}
  .cand,.opt{cursor:pointer}
  .cand:hover,.opt:hover,.tpick:hover{background:rgba(244,166,58,.07)}
  .hint{display:block}
}
@media(max-width:1023px){ .hint{display:none} }
.hint{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.1em;
 text-transform:uppercase;padding:10px 24px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.clinch{display:inline-block;min-width:1.2em;margin-right:6px;padding:0 3px;border-radius:3px;
  font:700 10px/1.5 var(--mono);text-align:center;vertical-align:1px}

.clinch.cx{background:var(--turf);color:var(--ink)}
.clinch.ce{color:var(--muted);border:1px solid var(--line)}
/* a drawn bracket (college basketball): columns side by side, scrolling sideways,
   each game centred between the two that feed it */
.bracket{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;-webkit-overflow-scrolling:touch}
.bcol{flex:0 0 172px;display:flex;flex-direction:column}
.bhead{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:2px 0 6px}

.bslot+.bslot{border-top:1px solid var(--line)}

/* records never wrap (hockey's W-L-OTL runs long) */

.sall{min-width:5.2em;text-align:right}
/* an overtime loss: a point, so not quite a loss */

.frow.zone-ucl,.srow.zone-ucl{box-shadow:inset 3px 0 0 #2F6FB5}.frow.zone-up,.srow.zone-up{box-shadow:inset 3px 0 0 var(--turf)}
.frow.zone-po,.srow.zone-po{box-shadow:inset 3px 0 0 var(--sodium)}.frow.zone-down,.srow.zone-down{box-shadow:inset 3px 0 0 var(--flag)}
.sx{font-family:var(--mono);font-size:12px;color:#B4BCCB;width:34px;flex:0 0 34px;text-align:right;white-space:nowrap}
.sxo{display:none}@media (min-width:600px){.sxo{display:inline-block}}   /* the scoring columns: wide screens, where team names still fit */

.zkey{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:-1px}
/* the momentum bar (soccer) */

 background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--fc) 55%,transparent),transparent 68%);animation:gflash 1.4s ease-out forwards}

@keyframes gflash{0%{opacity:0;transform:scale(.86)}12%{opacity:1;transform:scale(1.04)}24%{transform:scale(1)}72%{opacity:1}100%{opacity:0}}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

/* Where saves live. Inside Claude's artifact viewer that is window.storage;
   anywhere else (the published site, a file opened locally) it is the
   browser's localStorage. The shared league table needs window.storage and
   is simply unavailable elsewhere. Every call resolves; failures resolve to
   null rather than throwing. */
const store=(function(){
  const claude=()=>{try{return (window.storage&&typeof window.storage.get==="function")?window.storage:null}catch(e){return null}};
  const local=()=>{try{const L=window.localStorage||localStorage, t="__fc_probe";
    L.setItem(t,"1"); L.removeItem(t); return L}catch(e){return null}};
  return {
    kind(){ return claude()?"claude":local()?"browser":"none" },
    async get(k,shared){
      const W=claude(); if(W){try{return await W.get(k,shared)}catch(e){return null}}
      const L=!shared&&local(); if(!L)return null;
      const v=L.getItem(k); return v===null?null:{key:k,value:v};
    },
    async set(k,v,shared){
      const W=claude(); if(W){try{return await W.set(k,v,shared)}catch(e){return null}}
      const L=!shared&&local(); if(!L)return null;
      try{L.setItem(k,v); return {key:k,value:v}}catch(e){return null}      // full, or blocked
    },
    async delete(k,shared){
      const W=claude(); if(W){try{return await W.delete(k,shared)}catch(e){return null}}
      const L=!shared&&local(); if(!L)return null;
      L.removeItem(k); return {key:k,deleted:true};
    },
    async list(prefix,shared){
      const W=claude(); if(W){try{return await W.list(prefix,shared)}catch(e){return null}}
      const L=!shared&&local(); if(!L)return null;
      const keys=[]; for(let i=0;i<L.length;i++){const k=L.key(i); if(!prefix||k.indexOf(prefix)===0)keys.push(k)}
      return {keys:keys,prefix:prefix};
    }
  };
})();

/* Saves are compressed with LZW: the JSON is turned into UTF-8 bytes, the
   byte string is LZW-coded (codes 0-255 bytes, 256 end of data, dictionary
   from 257, up to 15 bits), and the bits are packed 15 to a UTF-16 character
   (offset past the control range, never a surrogate), a string any store
   accepts. Old saves, plain JSON, still load. */
const SAVE_TAG="LZW1:";
/* codes are looked up by number (previous code * 256 + next byte) and written
   whole, 15 bits to a character; same output as the plain bit-by-bit version */
function lzwPack(str){
  const bytes=unescape(encodeURIComponent(str));
  const END=256, dict=new Map(); let next=257, bits=9, w=-1, acc=0, nacc=0; const out=[];
  // append a whole code at once; flush 15 bits at a time (acc never exceeds 30 bits)
  const emit=code=>{ acc=(acc<<bits)|code; nacc+=bits;
    while(nacc>=15){ nacc-=15; out.push(String.fromCharCode(((acc>>>nacc)&0x7fff)+32)); acc&=(1<<nacc)-1 } };
  for(let i=0;i<bytes.length;i++){
    const c=bytes.charCodeAt(i);
    if(w<0){w=c;continue}
    const key=w*256+c, hit=dict.get(key);
    if(hit!==undefined){w=hit;continue}
    emit(w);
    if(next<32767){dict.set(key,next++); if(next>(1<<bits)&&bits<15)bits++}
    w=c;
  }
  if(w>=0)emit(w);
  emit(END);
  if(nacc>0)out.push(String.fromCharCode(((acc<<(15-nacc))&0x7fff)+32));
  return SAVE_TAG+out.join("");
}
function lzwUnpack(s){
  if(s.indexOf(SAVE_TAG)!==0)return s;                 // an old, uncompressed save
  s=s.slice(SAVE_TAG.length);
  const END=256, dict=[]; let next=257, bits=9, pos=0, cur=0, ncur=0; const out=[];
  const read=()=>{let v=0;for(let b=0;b<bits;b++){ if(ncur===0){ if(pos>=s.length)return -1; cur=s.charCodeAt(pos++)-32; ncur=15 }
      v=(v<<1)|((cur>>(--ncur))&1)} return v};
  let prev=null;
  while(true){
    const c=read(); if(c<0||c===END)break;
    let e;
    if(c<256) e=String.fromCharCode(c);
    else if(dict[c]!==undefined) e=dict[c];
    else if(c===next&&prev!==null) e=prev+prev[0];
    else throw new Error("save data is damaged");
    out.push(e);
    if(prev!==null&&next<32767){dict[next++]=prev+e[0]; if(next>=(1<<bits)&&bits<15)bits++}
    prev=e;
  }
  return decodeURIComponent(escape(out.join("")));
}

/* a string to a 32-bit number (FNV-1a): names to stable seeds */
function strHash(x){ let h=2166136261; x=String(x); for(let i=0;i<x.length;i++)h=Math.imul(h^x.charCodeAt(i),16777619)>>>0; return h }
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* The order games are tried on a schedule day: those whose teams have most left first, jittered.
   It drew the jitter inside Array.sort's comparator, so the draws, and every one after, hung on
   how many comparisons the sort made, which isn't fixed for a comparator that changes its mind:
   on the same save one build in about four came out different (measured in pro basketball: a
   reload replayed the season on another schedule, 36-46 became 49-33; Grokbot's 54-28 to 53-29).
   Seasons begun from Nov 2026 (schedV 2) draw each game's jitter once and sort on that; a season
   already under way keeps the old draw, which is what it has been getting nearly every time. */
/* "1 goal", "2 goals": a count and its word ("1 GOALS, 1 ASSISTS": Grokbot) */
function nOf(n,w,ws){ return n+" "+(+String(n).replace(/,/g,"")===1?w:(ws||w+"s")) }
let SCHED_V=1;
function schedOrder(pool,left,rng){

  const key=pool.map((g,i)=>({g:g,i:i,k:left[g.home]+left[g.away]+rng.gauss(0,0.8)}));

  // closure, which hid it (a schedule lock needs it: rebuild)
  constructor(seed){ this.a=seed|0; this.sp=null;
    this.f=()=>{ let a=this.a|0; a=a+0x6D2B79F5|0; this.a=a; let t=Math.imul(a^a>>>15,1|a);
      t=t+Math.imul(t^t>>>7,61|t)^t; return((t^t>>>14)>>>0)/4294967296 } }
  r(){return this.f()}
  int(n){return Math.floor(this.f()*n)}
  range(a,b){return a+this.f()*(b-a)}
  pick(a){return a[this.int(a.length)]}
  gauss(m,s){
    if(this.sp!==null){const v=this.sp;this.sp=null;return m+s*v}
    let u=0,v=0;while(u===0)u=this.f();while(v===0)v=this.f();
    const R=Math.sqrt(-2*Math.log(u));this.sp=R*Math.sin(2*Math.PI*v);
    return m+s*R*Math.cos(2*Math.PI*v)}
  shuffle(a){for(let i=a.length-1;i>0;i--){const j=this.int(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
}

/* ============ home fields ============ */
/* Not every stadium is the same place. A handful are genuinely miserable to
   visit; most are ordinary; some are half empty in November. */

function homeField(u,t){
  if(LEAGUE.homeField)return LEAGUE.homeField(u,t);
  const prog=(u&&u.program&&u.program[t])!==undefined?u.program[t]:1500;
  const base=39+Math.max(0,Math.min(1,(prog-1150)/900))*30;
  return Math.round(base+(LEAGUE.venues[t]||8));
}

/* a venue against the rest of its league: the pros' home edges differ by a
   few Elo, college's by tens, so where it ranks is what reads true */
function venueLabel(v,all){
  if(all&&all.length>4){ const lo=Math.min(...all), hi=Math.max(...all);
    if(hi-lo<1)return "a normal road game";
    const above=all.filter(x=>x>v).length/all.length;
    if(above<0.1)return "one of the toughest places to play in the "+(LEAGUE.classes&&LEAGUE.classes.length?"country":"league");
    if(above<0.3)return "a tough place to play";
    if(above<0.8)return "a normal road game";
    return "an easier trip than most" }
  if(v>=88)return "one of the hardest places to play in the country";
  if(v>=76)return "a genuinely hostile road trip";
  if(v>=64)return "a real home-field edge";
  if(v>=52)return "a normal road game";
  return "not a difficult place to visit";
}

/* ============ team identity ============ */
function _hx(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function _lum(c){const [r,g,b]=c.map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*r+.7152*g+.0722*b}
function _mix(c,t,p){return c.map((v,i)=>Math.round(v+(t[i]-v)*p))}
const _READ={};
function teamColor(t){                    // raw brand color
  return LEAGUE.colors[t]||"#F4A63A";
}
function teamInk(t){                      // brand color, lightened until legible on dark
  if(_READ[t])return _READ[t];
  let c=_hx(LEAGUE.colors[t]||"#F4A63A"), p=0;
  while(_lum(c)<0.30&&p<0.85){p+=0.08;c=_mix(_hx(LEAGUE.colors[t]||"#F4A63A"),[255,255,255],p)}
  const out="#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");
  _READ[t]=out; return out;
}

/* ============ constants ============ */
const K=32;                  // Elo update factor

function divisionOf(u,t){
  const c=(u&&u.conf&&u.conf[t])||CONF[t];
  const D=LEAGUE.conf.divisions[c]; if(!D)return null;
  for(const k in D)if(D[k].indexOf(t)>=0)return k;
  // a newcomer joins whichever side is thinner
  const sizes=Object.keys(D).map(k=>[k,D[k].length]).sort((a,b)=>a[1]-b[1]);
  D[sizes[0][0]].push(t);
  return sizes[0][0];
}
function hasDivisions(c){return !!LEAGUE.conf.divisions[c]}
function divisionNames(c){return LEAGUE.conf.divisions[c]?Object.keys(LEAGUE.conf.divisions[c]).sort():[]}
const NAMES=LEAGUE.teams.map(t=>t[0]);
let CONF=Object.fromEntries(LEAGUE.teams.map(t=>[t[0],t[2]]));
function syncConf(u){
  if(u&&u.conf)NAMES.forEach(t=>{if(u.conf[t])CONF[t]=u.conf[t]});
  else if(u){u.conf={};NAMES.forEach(t=>u.conf[t]=CONF[t])}
}

/* ============ Elo ============ */
/* Games are played by the sport layer's drive engine (playGame). */
function eloUpdate(eW,eL,mAbs,winHome,neutral){
  const hfa=neutral?0:LEAGUE.tuning.hfa;
  const diff=winHome?(eW+hfa-eL):(eW-eL-hfa);
  const exp=1/(1+Math.pow(10,-diff/400));
  const mov=Math.log(mAbs+1)*(2.2/(0.001*diff+2.2));
  return K*mov*(1-exp);
}

/* ============ talent ============ */
const REST_HZ=0.5, INJ_HAZARD=0.085,QB_SHARE=0.18,DEV_SD=4.2,AR_SD=5,AR_DECAY=0.8,
      COLLAPSE_P=0.018,BREAKOUT_P=0.018;
const BODY=["OL","WR1","RB1","EDGE","CB1","LB","TE","S"];
function iscale(r){return 0.70+0.45*Math.max(0,Math.min(1,(r-1150)/900))}
/* The per-step rates below (drift, injuries, sudden swings) were set for a
   season of a dozen or so steps. A league with many more (the NBA plays 90
   game dates) sets tuning.talentSteps: rates are scaled so a whole season
   varies as much as one of that many steps, and injuries last as many games.
   Unset, nothing changes. */
function talentScale(){const T=LEAGUE.tuning&&LEAGUE.tuning.talentSteps; return T?T/LEAGUE.weeks:1}

class Talent{
  constructor(rng,base,roster){
    this.rng=rng;this.base=Object.assign({},base);
    this.roster=roster||null;
    this.slope={};this.ar={};this.inj={};this.log={};
    const K=talentScale();
    NAMES.forEach(t=>{this.slope[t]=rng.gauss(0,DEV_SD)*K;this.ar[t]=0;
      this.inj[t]=[];this.log[t]=[]});
  }
  eff(t,w){
    let s=0; this.inj[t].forEach(e=>{if(e.w>0)s+=e.m});
    return this.base[t]+this.slope[t]*w+this.ar[t]+s;
  }
  active(t){return this.inj[t].filter(e=>e.w>0)}
  advance(w){
    const r=this.rng, K=talentScale();
    NAMES.forEach(t=>{
      this.inj[t].forEach(e=>e.w--);
      this.inj[t].filter(e=>e.w<=0).forEach(e=>
        this.log[t].push({wk:w,kind:"back",what:e.k,mag:0}));
      this.inj[t]=this.inj[t].filter(e=>e.w>0);
      const sc=iscale(this.base[t]);
      // starters rested in a decided game: the minutes they sat can't hurt them (REST_HZ; the same dice, so a rest
      // only ever removes an injury, never adds one elsewhere)
      const rest=(typeof SEA!=="undefined"&&SEA&&SEA.talent===this&&SEA.restAt&&SEA.restAt[t]===w-1)?REST_HZ:1;
      if(r.r()<INJ_HAZARD*K*rest*(typeof deployHazard==="function"?deployHazard(t):1)){   // hockey: riding your top players gets more of them hurt
        if(this.roster){
          // pick a starter, weighted toward the positions that take hits
          const idx=pickInjuredPos(r);
          const pl=this.roster[t][idx];
          if(!this.inj[t].some(e=>e.idx===idx)){
            const sev=r.r();
            const wk=Math.max(1,Math.round((sev<0.12?14:r.pick([1,2,2,3,4,5,6]))/K));
            const m=injuryCost(this.roster[t],idx)*r.range(1.05,2.1);
            this.inj[t].push({m:m,w:wk,k:pl.p,idx:idx,who:pl.n,rating:pl.r});
            this.log[t].push({wk:w,kind:"injury",what:pl.p,who:pl.n,
                              mag:Math.round(m),weeks:wk});
          }
        }else{
          let m,wk,k;
          if(r.r()<QB_SHARE){m=-r.range(85,190)*sc;wk=r.pick([2,3,4,5,6,14]);k="QB1"}
          else{m=-r.range(20,75)*sc;wk=r.pick([1,2,2,3,4,6]);k=r.pick(BODY)}
          this.inj[t].push({m:m,w:wk,k:k});
          this.log[t].push({wk:w,kind:"injury",what:k,mag:Math.round(m),weeks:wk});
        }
      }
      if(r.r()<COLLAPSE_P*K){const d=-r.range(40,110)*sc;this.base[t]+=d;
        this.log[t].push({wk:w,kind:"collapse",what:"locker room",mag:Math.round(d)})}
      else if(r.r()<BREAKOUT_P*K){const d=r.range(35,95)*sc;this.base[t]+=d;
        this.log[t].push({wk:w,kind:"breakout",what:"scheme unlock",mag:Math.round(d)})}
      this.ar[t]=this.ar[t]*AR_DECAY+r.gauss(0,AR_SD);
    });
  }
}

/* Roll a season's results into every coach's career. */
function recordCoaches(u,rec,champion,confChamps,year,drw){
  u.coachLog=u.coachLog||{};
  NAMES.forEach(t=>{
    const c=u.coach[t]; if(!c)return;
    if(c.w===undefined){c.w=0;c.l=0;c.titles=0;c.confs=0;c.fired=0;c.stops=[]}
    if(!c.stops.length||c.stops[c.stops.length-1].team!==t)
      c.stops.push({team:t,from:year,to:year,w:0,l:0,titles:0});
    const st=c.stops[c.stops.length-1];
    c.w+=rec[t][0]; c.l+=rec[t][1];
    st.w+=rec[t][0]; st.l+=rec[t][1]; st.to=year;
    if(drw){ c.d=(c.d||0)+(drw[t]||0); st.d=(st.d||0)+(drw[t]||0) }   // soccer's draws
    if(champion===t){c.titles++; st.titles++}
    if(confChamps&&Object.values(confChamps).indexOf(t)>=0)c.confs++;
  });
}

function coachCandidates(rng,prestige){
  const tier=Math.max(0,Math.min(1,(prestige-1150)/900));
  const pool=rng.shuffle(ARCHETYPES.slice()).slice(0,3);
  return pool.map(A=>{
    const q=Math.round(Math.max(-58,Math.min(68,
      rng.gauss(-24+tier*52+A.bump, A.sd))));
    // scouting is imperfect: you see a noisy read, not the number
    const seen=q+rng.gauss(0,13);
    return {n:rng.pick(FIRST)+" "+rng.pick(LAST), q:q, arch:A.k, al:A.l, d:A.d,
            rec:A.rec||0, grade:coachGrade(seen)};
  });

const PHILOSOPHY={

/* ============ your coaching career ============ */
/* You are the head coach, not the athletic director. You get hired, you get
   fired, and your record follows you to the next job. */
function repGrade(r){
  if(r>=46)return "a national name";
  if(r>=26)return "a hot commodity";
  if(r>=8)return "well regarded";
  if(r>=-10)return "unproven";
  if(r>=-28)return "a hard sell";
  return "radioactive";
}

/* Which jobs would take you, given what you've done. */
function jobMarket(u,rng,rep,openings,current){
  const ceiling=1300+Math.max(0,rep+40)*10;      // reputation opens bigger doors
  const floor=Math.max(1120,ceiling-620);
  const opts=openings.filter(t=>t!==current)
    .filter(t=>u.program[t]<=ceiling&&u.program[t]>=floor)
    .sort((a,b)=>u.program[b]-u.program[a]);
  const picked=[];
  if(opts.length)picked.push(opts[0]);
  if(opts.length>2)picked.push(opts[Math.floor(opts.length/2)]);
  if(opts.length>1)picked.push(opts[opts.length-1]);
  // nobody in range: the weakest opening will still talk to you (a firing is never a forced retirement)
  if(!picked.length){ const last=openings.filter(t=>t!==current).sort((a,b)=>u.program[a]-u.program[b])[0]; if(last)picked.push(last) }
  return [...new Set(picked)].slice(0,3);
}

/* Bigger programs come calling when you overperform at a small one. */
function poachOffers(u,rng,rep,openings,current){
  if(rep<18)return [];
  const mine=u.program[current];
  return openings.filter(t=>t!==current&&u.program[t]>mine+150
    &&u.program[t]<=1240+Math.max(0,rep+30)*12)
    .sort((a,b)=>u.program[b]-u.program[a]).slice(0,2);
}

function repDelta(wins,losses,expWins,program,titles){
  const wp=wins/Math.max(1,wins+losses);
  let d=(wins-expWins)*1.7;
  if(titles.natl)d+=22;
  else if(titles.playoff)d+=8;
  else if(titles.conf)d+=6;
  if(wp<0.34&&wins<expWins)d-=6;   // only if you also missed the mark
  // winning at a small program counts for more
  d*= program<1500?1.25 : program>1850?0.82 : 1.0;
  return d;
}

/* ============ program continuity ============ */
const COACH_ONFIELD=0.55,  // how much coach quality shows up on the field
      COACH_BUILD=0.34,    // how much it compounds into the program each year
      ROOKIE_DIP=-22;
const ROSTER_NOISE=48;
const CARRY=0.45,CHURN_SD=95,RECRUIT=0.16,PROG_NOISE=22,
      // program strength's range: a league may set its own (basketball's is wider)
      P_FLOOR=(LEAGUE.tuning&&LEAGUE.tuning.pFloor)||1120,P_CEIL=(LEAGUE.tuning&&LEAGUE.tuning.pCeil)||2010,HOT_SEAT=0.42,COACH_SD=62,COACH_DIP=-18,PERCEPT_N=34;

function newUniverse(seed){
  const rng=new RNG(seed);
  const u={seed:seed,year:2026,program:{},perceived:{},trueBase:{},
           tenure:{},bad:{},history:[],rng:seed};
  u.coach={}; u.roster={}; u.oc={}; u.dc={}; u.conf={};
  u.nextRealign=2026+4+rng.int(4);
  LEAGUE.teams.forEach(t=>u.conf[t[0]]=t[2]);
  LEAGUE.teams.forEach(([n,e])=>{
    u.program[n]=e; u.perceived[n]=e;
    u.roster[n]=LEAGUE.offseason.newRoster(rng,e);
    u.oc[n]=newCoordinator(rng,e,"oc"); u.dc[n]=newCoordinator(rng,e,"dc");
    u.trueBase[n]=rosterElo(u.roster[n])+rng.gauss(0,26);
    u.tenure[n]=1+rng.int(6); u.bad[n]=0;
    const c=newCoach(rng,e); c.t=u.tenure[n]; c.hired=false;
    u.coach[n]=c;
  });
  u._rngState=seed*7919+13;
  NAMES.forEach(t=>distinctStaff(u,t));
  return u;
}

function seatHeat(u,rec,elo,t){
  // expectation is the program's own baseline; heat is falling short of it repeatedly
  const w=rec[t][0], l=rec[t][1], wp=w/Math.max(1,w+l);
  const shortfall=(u.program[t]-elo[t])/((typeof LEAGUE!=="undefined"&&LEAGUE.seatSpread)||45);   // hockey's strengths sit closer together: the same shortfall is a bigger miss
  let heat=u.bad[t]*1.4 + Math.max(0,shortfall) + (wp<HOT_SEAT?1.2:0);
  if(u.coach[t]&&u.coach[t].t<=1)heat-=1.6;         // rookies get a grace year
  if(u.coach[t]&&u.coach[t].q>=30)heat-=0.6;
  return heat;
}

/* Offseason runs in two acts so the player can decide in between.
   Act 1: the coaching carousel. Act 2: rosters, recruiting, development. */
/* The coaching carousel, once per offseason for the whole league.
   users: {team: fired} for every team a person coaches, fired meaning they
   have missed expectations two years running (decided from their grades,
   see openOffseason). A person's job is theirs to lose that way, never the
   carousel's. Each person's part comes back in the ...By maps; the plain
   userOpen/staffOpen/candidates are the first user's, for one-coach games. */
/* no two people on one staff share a first name (a head coach Curt with an
   assistant Curt reads like a bug): a repeat is swapped for another name,
   picked by hash so the game's random draws don't move */
function distinctStaff(u,t){
  const c=u.coach&&u.coach[t], first=x=>x&&x.n?x.n.split(" ")[0]:null;
  const taken=new Set(); if(c&&first(c))taken.add(first(c));
  ["oc","dc"].forEach(sd=>{ const x=u[sd]&&u[sd][t]; if(!x||!x.n)return;
    let f=first(x);
    if(taken.has(f)){ let h=strHash(x.n+"|"+t+"|"+sd);
      for(let k=0;k<FIRST.length&&taken.has(f);k++)f=FIRST[(h+k)%FIRST.length];
      x.n=f+x.n.slice(x.n.indexOf(" ")) }
    taken.add(f) });
}
/* no two players on one roster share a name (two Cooper Nwosus read as one
   player, a senior two years running): a repeat gets another first name, by
   hash so no random draw moves */
function distinctRoster(u,t,seen){
  const R=u.roster&&u.roster[t]; if(!R)return;
  seen=seen||new Set();
  R.forEach((p,i)=>{ if(!p||!p.n)return;
    if(seen.has(p.n)){ const sp=p.n.indexOf(" "), last=sp>0?p.n.slice(sp):""; let h=strHash(p.n+"|"+t+"|"+i), n=p.n;
      const F=typeof PNAMES_F!=="undefined"?PNAMES_F:FIRST;
      for(let k=0;k<F.length&&seen.has(n);k++)n=F[(h+k)%F.length]+last;
      p.n=n }
    seen.add(p.n) });
}
/* across the league: no two players anywhere share a name (in team order, so
   the same save always settles the same way) */
/* the player you featured last season: a pro develops this much faster (college: 3.8, in developRoster) */
const FEAT_DEV_PRO=2.5;
function featDev(ch,i){ return ch&&ch.featured!==null&&ch.featured!==undefined&&ch.featured===i?FEAT_DEV_PRO:0 }
/* a surname for commentary: with a first initial when someone else in this game
   shares it (Instinct: "my goalie saving my own player's shot") */
function surnameIn(n,g){
  if(!n)return ""; const last=n.split(" ").slice(-1)[0], R=typeof SEA!=="undefined"&&SEA&&SEA.roster;
  if(!R||!g)return last;
  let c=0; [g.home,g.away].forEach(t=>(R[t]||[]).forEach(p=>{ if(p&&p.n&&p.n.split(" ").slice(-1)[0]===last)c++ }));
  const dup=c>1;
  return dup?n[0]+". "+last:last;
}
function distinctLeague(u){
  if(!u.roster)return;
  // college: thousands of players for about 3,000 possible names, so names stay
  // distinct within a roster only (a league-wide rule would run out of names)
  if(LEAGUE.classes&&LEAGUE.classes.length){ NAMES.forEach(t=>distinctRoster(u,t)); return }
  const all=[], count=new Map();
  NAMES.forEach(t=>(u.roster[t]||[]).forEach((p,i)=>{ if(!p||!p.n)return; all.push({p,t,i}); count.set(p.n,(count.get(p.n)||0)+1) }));
  const taken=new Set(count.keys()), F=typeof PNAMES_F!=="undefined"?PNAMES_F:FIRST;
  // a name held twice: one keeps it (see the sort);
  // the other gets a first name nobody in the league has with his surname
  const byName=new Map(); all.forEach(x=>{ if(count.get(x.p.n)>1){ if(!byName.has(x.p.n))byName.set(x.p.n,[]); byName.get(x.p.n).push(x) } });
  byName.forEach(list=>{
    // a player on a team someone coaches keeps his name (the recaps name him), then the longest-serving
    const mine=new Set(typeof S!=="undefined"&&S?[S.myTeam].concat((S.coaches||[]).map(c=>c.myTeam)):[]);
    list.sort((a,b)=>((mine.has(b.t)?1:0)-(mine.has(a.t)?1:0))||((b.p.yrsHere||0)-(a.p.yrsHere||0))||((b.p.age||0)-(a.p.age||0)));

function offseasonCoaching(u,rng,rec,elo,users){
  users=users||{};
  const isUser=t=>Object.prototype.hasOwnProperty.call(users,t);
  const userTeam=Object.keys(users)[0];
  const fired=[],hires=[],poached=[];
  if(!u.coach){u.coach={};NAMES.forEach(t=>{u.coach[t]=newCoach(rng,u.program[t]);u.coach[t].hired=false})}

  NAMES.forEach(t=>{
    const wp=rec[t][0]/Math.max(1,rec[t][0]+rec[t][1]);
    u.bad[t]= wp<HOT_SEAT ? u.bad[t]+1 : 0;
    if(u.coach[t]&&u.coach[t].you){
      if(isUser(t)&&users[t]){fired.push(t);u.bad[t]=0}
      return;
    }
    const heat=seatHeat(u,rec,elo,t);
    const change=(heat>=4.6)||(wp<0.25&&u.coach[t].t>=2);
    if(change&&rng.r()<0.82){fired.push(t);u.bad[t]=0}
  });

  const openings=fired.slice().sort((a,b)=>u.program[b]-u.program[a]);
  openings.forEach(job=>{
    if(isUser(job))return;                        // a person's job: they're told, then it's filled
    if(rng.r()>0.42)return;
    const cands=NAMES.filter(t=>fired.indexOf(t)<0 && !u.coach[t].you && u.coach[t].q>=22
      && u.program[t] < u.program[job]-140 && u.coach[t].t>=2
      && rec[t][0]>=rec[t][1]);
    if(!cands.length)return;
    cands.sort((a,b)=>u.coach[b].q-u.coach[a].q);
    const from=cands[0], c=u.coach[from];
    poached.push({to:job,from:from,name:c.n,q:c.q});
    u.coach[job]=Object.assign({},c,{t:0,hired:true,since:u.year+1});   // his record travels with him
    u.coach[from]=newCoach(rng,u.program[from]); u.coach[from].since=u.year+1;
    hires.push({team:from,name:u.coach[from].n,q:u.coach[from].q,reason:"replacing "+c.n});
    fired.splice(fired.indexOf(job),1);
    if(fired.indexOf(from)<0)fired.push(from);
  });

  // a hot coordinator can be the man a program hires
  const coordMoves=[];
  fired.slice().forEach(job=>{
    if(isUser(job))return;
    if(rng.r()>0.30)return;
    const pool=NAMES.filter(t=>fired.indexOf(t)<0 && u.oc[t] && u.oc[t].q>=26
      && u.program[t] < u.program[job]+90);
    if(!pool.length)return;
    const from=rng.pick(pool);
    const side=(u.dc[from]&&u.dc[from].q>u.oc[from].q)?"dc":"oc";
    const co=side==="oc"?u.oc[from]:u.dc[from];
    if(!co||co.q<26)return;
    coordMoves.push({name:co.n,from:from,to:job,side:side});
    u.coach[job]={id:COACH_ID++,n:co.n,q:Math.round(co.q*0.85),t:0,hired:true,since:u.year+1,
                  w:0,l:0,titles:0,confs:0,fired:0,stops:[]};
    const fresh=newCoordinator(rng,u.program[from],side);
    if(side==="oc")u.oc[from]=fresh; else u.dc[from]=fresh;
    fired.splice(fired.indexOf(job),1);
  });

  const userOpenBy={}, candidatesBy={}, staffOpenBy={};
  Object.keys(users).forEach(t=>{userOpenBy[t]=fired.indexOf(t)>=0; staffOpenBy[t]={oc:false,dc:false}});
  // your coordinator took a head job: you hire his replacement, as when one leaves any other way
  // (Grokbot: "takes the head job at Kansas City" and a stranger was simply in his chair)
  coordMoves.forEach(m=>{ if(isUser(m.from))staffOpenBy[m.from][m.side]=true });
  const openJobs=fired.slice();
  Object.keys(users).forEach(t=>{candidatesBy[t]=userOpenBy[t]?coachCandidates(rng,u.program[t]):null});

  fired.forEach(t=>{
    if(isUser(t))return;                          // a person's job, not an AI hire
    if(u.coach[t].hired&&u.coach[t].t===0)return;
    const old=u.coach[t].n;
    u.coach[t]=newCoach(rng,u.program[t]); u.coach[t].since=u.year+1;   // his first season (coachYear)
    hires.push({team:t,name:u.coach[t].n,q:u.coach[t].q,reason:"replacing "+old});
  });

  // ordinary staff churn everywhere else
  NAMES.forEach(t=>{
    ["oc","dc"].forEach(side=>{
      const st=side==="oc"?u.oc:u.dc;
      if(!st[t]){st[t]=newCoordinator(rng,u.program[t],side);return}
      st[t].t=(st[t].t||0)+1;
      const leaves = st[t].q>=34 ? rng.r()<0.20 : (st[t].q<=-26 ? rng.r()<0.30 : rng.r()<0.09);
      if(leaves){
        if(isUser(t)){staffOpenBy[t][side]=true;}
        else st[t]=newCoordinator(rng,u.program[t],side);
      }
    });
  });

  NAMES.forEach(t=>distinctStaff(u,t));
  return {fired:fired,hires:hires,poached:poached,openJobs:openJobs,coordMoves:coordMoves,
          userOpenBy:userOpenBy,staffOpenBy:staffOpenBy,candidatesBy:candidatesBy,
          userOpen:!!userOpenBy[userTeam],candidates:candidatesBy[userTeam]||null,
          staffOpen:staffOpenBy[userTeam]||{oc:false,dc:false}};
}

/* ============ assistants: hockey ============ */
/* Two lead assistants per program, one for each end of the floor. They shift
   the team on the court and shape how their players develop, and the good
   ones get hired away. (The core calls them coordinators.) */
const OFF_SHARE=0.50, DEF_SHARE=0.50;      // both ends count the same
const STAFF_ELO=0.62;                      // Elo per point of assistant quality
const OC_STYLE=["Possession play","Gegenpressing","Direct and quick","Wing play and crosses","Build from the back"];
const DC_STYLE=["High press","Low block","Zonal marking","Man-marking","Offside trap"];
function newCoordinator(rng,prestige,side,repBonus){
  const tier=Math.max(0,Math.min(1,(prestige-1150)/900));
  const q=rng.gauss(-20+tier*44+(repBonus||0), 24);
  return {n:rng.pick(FIRST)+" "+rng.pick(LAST),
          q:Math.round(Math.max(-52,Math.min(62,q))), t:0,
          s:rng.pick(side==="oc"?OC_STYLE:DC_STYLE)};
}
function staffElo(u,t){
  if(!u.oc||!u.dc||!u.oc[t]||!u.dc[t])return 0;
  return (u.oc[t].q*OFF_SHARE + u.dc[t].q*DEF_SHARE)*STAFF_ELO;
}
function coordGrade(q){
  if(q>=40)return "one of the best in the "+(LEAGUE.classes&&LEAGUE.classes.length?"country":"league");
  if(q>=20)return "highly regarded";
  if(q>=2)return "solid";
  if(q>=-20)return "unproven";
  return "in over his head";
}
function coordCandidates(rng,prestige,side,rep){
  return [0,1,2].map(()=>{
    const c=newCoordinator(rng,prestige,side,(rep||0)*0.22);
    c.grade=coordGrade(c.q+rng.gauss(0,11));
    return c;
  });
}
/* ============ power ranking: pro football ============ */
/* No poll. Teams are ranked the way people actually rank them in the pros:
   record first, then how good they look. The core asks any ranking for
   order(), rankMap() and update(results, elo). */
class PowerRank{
  constructor(pre){
    this.elo=Object.assign({},pre); this.w={}; this.l={};
    NAMES.forEach(t=>{this.w[t]=0;this.l[t]=0});
  }
  pct(t){const g=this.w[t]+this.l[t]; return g?this.w[t]/g:0.5}
  order(){
    return NAMES.slice().sort((a,b)=>{
      const ga=this.w[a]+this.l[a], gb=this.w[b]+this.l[b];
      // early on, how good a team is outweighs a 1-0 start
      const k=Math.min(1,Math.max(ga,gb)/6);
      const sa=k*this.pct(a)*400+this.elo[a], sb=k*this.pct(b)*400+this.elo[b];
      return sb-sa;
    });
  }
  rankMap(){const o=this.order(),m={};o.forEach((t,i)=>m[t]=i+1);return m}
  update(res,elo){
    res.forEach(r=>{this.w[r.winner]++; this.l[r.loser]++});
    NAMES.forEach(t=>{this.elo[t]=elo[t]});
    return this.rankMap();
  }
}
LEAGUE.Ranking=PowerRank;
/* ============ schedule: English football ============ */
/* A double round robin in each division: everyone plays everyone home and
   away (the circle method; the second half mirrors the first with home and
   away swapped; a new order each season; never more than two in a row at
   home or away). The 24-club divisions play all 46
   Saturdays from mid-August; the Premier League's 38 rounds start the second
   week (22 August) and skip seven weeks through the season (international
   breaks, cup weekends). */
function roundRobin(rng,teams){
  const T=rng.shuffle(teams.slice()); if(T.length%2)T.push(null);
  const n=T.length, rounds=[];
  for(let r=0;r<n-1;r++){ const rd=[];
    // Berger venues: the fixed club alternates; for the rest the top row is at
    // home on even rounds. Clubs move rows as the circle turns, so no club
    // plays more than two in a row at home or away. ((r+i)%2 kept a club's
    // venue fixed while it stayed in one row: 23 straight home games.)
    for(let i=0;i<n/2;i++){ const a=T[i], b=T[n-1-i];
      if(a&&b)rd.push(i===0 ? (r%2?[a,b]:[b,a]) : (r%2?[b,a]:[a,b])) }
    rounds.push(rd); T.splice(1,0,T.pop());
  }
  return rounds.concat(rounds.map(rd=>rd.map(([h,a])=>[a,h])));
}
const PL_OFF=[0,6,12,17,24,30,36,42];          // the Premier League's weeks off (8: 46 - 38)

  const out=[];

  // the 24-club divisions: all 46 Saturdays

  const plWeeks=[...Array(LEAGUE.weeks).keys()].filter(w=>PL_OFF.indexOf(w)<0);
  roundRobin(rng,div("PL")).forEach((rd,i)=>rd.forEach(([h,a])=>out.push({week:plWeeks[i],home:h,away:a,conf:true,neutral:false})));
  return out;
}
LEAGUE.buildSchedule=eplSchedule;
/* ============ offseason: pro football ============ */
/* Players have ages and contracts. Each offseason, in order:
     1. expiring contracts are re-signed or let go (you choose for your team)
     2. everyone ages: better until about 27, flat, then decline after 30
        (quarterbacks three years later, running backs two years sooner)
     3. some retire
     4. the draft, worst record first, playoff teams by how far they went
     5. free agency, under a hard salary cap
     6. empty spots are filled with replacement-level players
   Salaries are in millions and cover the twenty players the sim tracks. */
const NFL_CAP=320;                          // the richest club's budget (English football has no cap)

function budgetOf(u,t){

  // per tier: a floor, a ceiling, and how fast stature lifts it (millions a year)
  const B={PL:[90,320,1500,1.0],CH:[20,60,1300,0.1],L1:[5,18,1150,0.032],L2:[2,6,1050,0.0115],
           NL:[0.8,3,950,0.0063],NN:[0.5,1.6,820,0.0031],NS:[0.5,1.6,820,0.0031]}[d]||[1,5,1100,0.02];
  let b=Math.max(B[0],Math.min(B[1],B[0]+(s-B[2])*B[3]));

  return Math.round(b*100)/100;
}

const TAX_LINE=NFL_CAP;

// centred on this league's own average franchise (pro football's was 1690)

const AGE_SHIFT={};                           // every position ages alike
const POS_PAY={};                             // and is paid alike
const MAX_DEAL=25;                            // the top wages, about 25 a year

function nflAsk(r,pos,age){
  const x=Math.max(0,(r-55)/35);
  // scaled to this league's ratings: a typical starter (~64) about $15M, a
  // star (77+) the max, so payrolls sit near the cap and it binds
  // wages on one scale, the pyramid's: a star ~25 a year, a Championship regular
  // ~1, a League Two regular ~0.3, a tier-6 part-timer ~0.05

function payroll(roster){return roster.reduce((s,p)=>s+(p&&p.k?p.k.sal:0),0)}

/* Which expiring players a team keeps: the best first, while they fit. Worth

function nflResignPlan(R,cap){

  exp.sort((a,b)=>R[b].r-R[a].r).forEach(i=>{

    keep[i]=worth&&pay+ask<=cap-ROOKIE_ROOM;

      :i<POS.length&&p.r<62?`rated ${p.r}: below what the staff want in a starter`
      :i>=POS.length&&p.r<60?`rated ${p.r}: not enough to keep as a backup`
      :i>=POS.length&&ask>12?`asking ${money2(ask)}: too much for a backup`

function nflPlayer(rng,target,age,posIdx){

  const r=Math.round(Math.max(20,Math.min(97,rng.gauss(target+ageAdj,5))));   // the pyramid runs low
  const room=a<=23?rng.gauss(9,4):a<=25?rng.gauss(5,3):a<=27?rng.gauss(2,1.5):0;
  const pot=Math.round(Math.max(r,Math.min(99,r+room)));

function nflRoster(rng,programElo){

/* the draft: worst regular season first; playoff teams after, by the round
   they went out in; the champion picks last */
/* The draft order: the sixteen teams that missed the playoffs draw for the
   top two picks (weighted to the worst records; no team moves up more than
   ten places), the rest of them follow worst first, then the playoff teams,
   worst record first. */
const LOTTERY_ODDS=[185,135,115,95,85,75,65,60,50,35,30,25,20,15,5,5];      // per thousand
function nflDraftOrder(rec,elo,rng){
  const S2=(typeof SEA!=="undefined"&&SEA&&SEA.field)?SEA:null;
  const pts=t=>S2&&S2.pts?S2.pts(t):rec[t][0]*2;
  const worstFirst=(a,b)=>pts(a)-pts(b)||elo[a]-elo[b];
  const inPO=t=>S2&&S2.field.indexOf(t)>=0;
  const lot=NAMES.filter(t=>!inPO(t)).sort(worstFirst), po=NAMES.filter(inPO).sort(worstFirst);
  if(!rng||lot.length!==16)return lot.concat(po);
  const order=lot.slice();
  for(let k=0;k<2;k++){
    const w=LOTTERY_ODDS.slice(0,order.length).map((x,i)=>i>=k?x:0);
    let x=rng.r()*w.reduce((a,b)=>a+b,0), i=0; while(x>w[i]){x-=w[i];i++}
    const to=Math.max(k,i-10);                         // at most ten places up

    const posIdx=rng.int(POS.length);

    // draftees: well below NHL level at 18, with ceilings
    const r=Math.round(Math.max(42,Math.min(78,rng.gauss(52-11*Math.pow(q,0.7),3.5))));
    const pot=Math.round(Math.min(99,r+Math.max(3,rng.gauss(15-6*q,5))));
    out.push({n:playerName(rng),p:POS[posIdx].p,i:posIdx,c:age,age:age,r:r,pot:pot,
              hz:0,prod:0,st:0,from:rng.pick(LEAGUE.draftTeams)});
  }

}
/* The coming draft class, made when the offseason opens so a coach can see

function nflDraftClass(u,team){

    const list=nflProspects(rng,2*32); list.forEach((p,i)=>p.pid=i);
    // no two prospects in one class share a name (two "Tanner Mbeki"s: Grokbot); renamed by hash, so no draw moves
    { const seen=new Set(); list.forEach(p=>{ let n=p.n, k=0; while(seen.has(n)&&k<LAST.length){ n=n.split(" ")[0]+" "+LAST[(strHash(p.n+"|"+p.pid)+k)%LAST.length]; k++ } p.n=n; seen.add(n) }) }

const faKey=(team,p)=>team+"|"+p.n+"|"+p.p;

/* ---- trades ----

function nflTradeOffers(u,myTeam,idx,humans){
  const R=u.roster[myTeam], give=R[idx]; if(!give||give.k.yrs<2)return [];
  const gv=tradeValue(give), myPay=payroll(R);
  // my weakest starting spots, by how far below the league's typical starter they are
  const need=POS.map((P,i)=>({i:i,gap:R[i]?R[i].r:0})).sort((a,b)=>a.gap-b.gap).slice(0,4).map(x=>x.i);
  const offers=[];
  NAMES.forEach(t=>{
    if(t===myTeam||(humans&&humans.indexOf(t)>=0))return;
    const T=u.roster[t], theirPay=payroll(T);
    // do they want him? he has to beat their starter or their backup at his spot
    const gi=POS.findIndex(P=>P.p===give.p);
    if(!(T[gi]&&give.r>T[BK(gi)].r+1))return;
    let best=null;
    T.forEach((q,j)=>{
      if(!q||q.k.yrs<2||need.indexOf(j%POS.length)<0)return;
      if(j<POS.length&&(!T[BK(j)]||T[BK(j)].r<q.r-8))return;   // they won't gut a spot
      const qv=tradeValue(q); if(qv<gv*0.88||qv>gv*1.08)return;
      if(myPay-give.k.sal+q.k.sal>TAX_LINE||theirPay-q.k.sal+give.k.sal>TAX_LINE)return;
      const fit=Math.abs(qv-gv)-(R[j%POS.length]?(q.r-R[j%POS.length].r)*0.5:0);
      if(!best||fit<best.fit)best={fit:fit,q:q,j:j};
    });

      n:best.q.n,p:best.q.p,r:best.q.r,pot:best.q.pot,age:best.q.age,sal:best.q.k.sal,yrs:best.q.k.yrs,fit:best.fit});

/* carry out an agreed trade: find both players now (after aging), swap them */
function nflApplyTrade(u,myTeam,T,rep,leave,pool){
  const [tt]=T.get.split("|"), mine=u.roster[myTeam], theirs=u.roster[tt];
  const gi=mine.findIndex(p=>p&&tradeKey(myTeam,p)===T.give), qi=theirs?theirs.findIndex(p=>p&&tradeKey(tt,p)===T.get):-1;
  const [,gn,gp]=T.give.split("|"), [,qn,qp]=T.get.split("|");
  if(gi<0||qi<0){rep.trade[myTeam]={done:false,gave:gn,gp:gp,got:qn,qp:qp,with:tt,
      why:gi<0?gn+" retired before it could go through":qn+" retired before it could go through"};return}
  const give=mine[gi], get=theirs[qi];
  mine[gi]=null; theirs[qi]=null;
  // each lands where he fits; whoever drops off the end is released
  [[mine,get,myTeam],[theirs,give,tt]].forEach(([R,p,t])=>{
    p.yrsHere=0; p.joined=u.year+1; p.keep=true;
    const i=POS.findIndex(P=>P.p===p.p);
    if(!R[i]){R[i]=p} else if(!R[BK(i)]){ if(p.r>R[i].r){R[BK(i)]=R[i];R[i]=p}else R[BK(i)]=p }
    else { const out=nflPlace(R,p); if(out){rep.released[t].push({n:out.n,p:out.p,r:out.r,sal:(out.k&&out.k.sal)||0}); if(out.r>=58){out.from=t;pool.push(out)} else leave(t,out,"released")} }
  });
  rep.trade[myTeam]={done:true,gave:give.n,gp:give.p,got:get.n,qp:get.p,r:get.r,with:tt};
}
const rookieSal=o=>0.95;                     // entry-level deals, ~$950K

/* what a player adds at his spot: over the backup, or over the starter */
function nflGain(roster,p){
  const s=roster[p.i], b=roster[BK(p.i)], w=POS[p.i].w;
  const val=x=>x?x.r+(x.pot-x.r)*0.25:0;
  if(!s)return val(p)*w*3;
  if(val(p)>val(s))return (val(p)-val(s))*w*2+ (val(s)-val(b))*w;
  return Math.max(0,val(p)-val(b))*w;
}
/* put a player in: he starts or backs up by rating; whoever drops off is returned */
function nflPlace(roster,p){
  p.i=POS.findIndex(P=>P.p===p.p);
  const s=roster[p.i], b=roster[BK(p.i)];
  let out=null;
  // a backup signed or bought this window (keep) isn't pushed out by a later arrival who wasn't: the
  // newcomer goes instead (Brentford bought a midfielder, an academy graduate cut him, Cardiff had him)
  const bKeep=b&&b.keep&&!p.keep;
  if(!s){roster[p.i]=p}
  else if(p.r>s.r){ if(bKeep)return p; out=b;roster[BK(p.i)]=s;roster[p.i]=p}
  else { if(bKeep)return p; out=b;roster[BK(p.i)]=p}
  return out;
}

function nflRun(u,rng,healthy,elo,rec,choices){

    NAMES.forEach(t=>SEA.seasonResult(t));                 // freeze every club's season first

    Object.keys(u.chute).forEach(t=>{u.chute[t]=Math.round(u.chute[t]*0.6); if(u.chute[t]<25)delete u.chute[t]});
    const P=SEA.po, move={};
    P.PL.down.forEach(t=>{u.chute[t]=Math.round(budgetOf(u,t)*0.55)});      // the parachute, before the drop
    [["PL","CH"],["CH","L1"],["L1","L2"],["L2","NL"]].forEach(([hi,lo])=>{
      P[hi].down.forEach(t=>move[t]=lo); P[lo].up.forEach(t=>move[t]=hi) });
    P.NN.up.concat(P.NS.up).forEach(t=>move[t]="NL");
    P.NL.down.forEach(t=>move[t]=(LEAGUE.region[t]==="S"?"NS":"NN"));

  });

  return {risers:risers.slice(0,5),fallers:fallers.slice(0,5),
    draft:{picks:picks}, contracts:rep,
    cap:Object.fromEntries(NAMES.map(t=>[t,Math.round(payroll(u.roster[t])*10)/10]))};
}

LEAGUE.offseason={

    const band={PL:[1420,2176],CH:[1300,1700],L1:[1150,1560],L2:[1050,1400],NL:[950,1300],NN:[820,1180],NS:[820,1180]}[d];

   around your level, higher only as your reputation grows. Big clubs come

/* ============ the transfer market: English football ============ */
/* Players under contract cost a fee as well as wages. A fee is set by what

   up the pyramid, not down: one won't join a club in a lower division, and
   in the same division he wants a club of at least his own club's stature.
   Your transfer kitty is a share of what the club pays its squad and a little
   of what it earns, plus what you sell for, plus half of whatever you didn't
   spend last summer. Bigger

  const P=SEA.po;

  for(const [hi,lo] of [["CH","L1"],["L1","L2"],["L2","NL"]]){ if(P[hi].down.indexOf(t)>=0)return lo; if(P[lo].up.indexOf(t)>=0)return hi }

  if(P.NL.down.indexOf(t)>=0)return LEAGUE.region[t]==="S"?"NS":"NN";

   season, better than your starter (or, for a weak backup, than him) */
function tMarket(u,my,humans){
  const R=u.roster[my], out=[];

    NAMES.forEach(t=>{

      const T=u.roster[t]; if(!(T[i]&&p.r>=T[i].r+3))return;
      const wage=nflAsk(p.r,p.p,p.age); if(payroll(T)+wage>budgetOf(u,t))return;
      if(!best||(u.program[t]||0)>(u.program[best]||0))best=t;

    const j=R.findIndex(p=>p&&tKey(t,p)===o.key), [,n,pos]=o.key.split("|");

    const [st,n,pos]=key.split("|"), S2=u.roster[st]; const j=S2?S2.findIndex(p=>p&&tKey(st,p)===key):-1;

   counter blunts it; the wrong one costs a little. Sides change approach at

  const n=Math.abs(seed|0);

           ["pearl",`Look at them all crying. It's the loveliest thing.`],

  };
  const set=L[kind]; if(!set)return null;

}

/* The scoreboard (home side first), the run of play in five-minute spells with
   names, the evidence panel the calls are made from, the call screen with the
   staff's advice, and the replay view. */

/* ---- names ---- */
const SC_UNIT={GK:0,CB:1,FB:2,CM:3,W:4,ST:5};
function scPlayer(team,unit,u){
  const R=SEA.roster&&SEA.roster[team]; if(!R)return null;
  const i=SC_UNIT[unit]; const p=R[i]; const b=R[BK(i)];
  // the bench gets a game now and then (rotation, a knock)
  const pick=(b&&(u%10)<2)?b:p; return pick?pick.n:null;
}
const surname=n=>n?n.split(" ").slice(-1)[0]:"";
function scScorer(team,u){
  // who scores: strikers most, then wingers, midfield, defenders off set pieces
  const x=u%100, unit=x<38?"ST":x<64?"W":x<84?"CM":x<92?"CB":"FB";
  return {n:scPlayer(team,unit,u)||"a forward", unit:unit};
}
const FINISH={
  ST:["slots it under the keeper","finishes first time from close range","turns and fires into the bottom corner","heads in at the near post","rounds the keeper and rolls it in"],
  W:["cuts inside and curls it into the far corner","arrives at the back post to tap in","beats his man and drills it low past the keeper"],
  CM:["hits one from distance that flies in","arrives late in the box and side-foots it home","scores from the penalty spot"],
  CB:["heads home from a corner","bundles it in from a set piece"],
  FB:["overlaps and finds the far corner","steers in a deflected effort"]
};
const CUE={
  // third person, naming the other side: "we can't play out from the back" was said of Stoke when Stoke were the
  // ones pressing (Instinct): the cue's side can be yours
  press:["{t} press high again; {o} can't play out from the back","Turnover high up the pitch for {t}","{t} hunt in packs: the ball's won back in {o}'s half again"],
  block:["{t} have ten men behind the ball","Another spell of sideways passing in front of {t}'s block","{t} happy to let {o} have it and sit in two banks of four"],
  wing:["Another cross from the {s} for {t}","{t} doubling up out wide on the {s}","{t} get in behind on the {s} again"],
  direct:["Long ball forward from {t}'s keeper, flicked on","{t} going route one, straight to the big man","{t} skip midfield entirely: ball over the top"]
};
const MISS=["drags it wide from close range","heads over from a corner","hits the post","blazes over with only the keeper to beat","sees a shot blocked on the line"];
const SAVE=["saves well from","tips over a header from","gets down to keep out","spreads himself to deny"];
function pickOf(a,u){return a[u%a.length]}
/* one event as a line of commentary */
function scEventText(g,e){
  const surname=n=>surnameIn(n,g);   // an initial when both sides have the surname
  const tm=e.side==="home"?g.home:g.away, opp=e.side==="home"?g.away:g.home, u=e.u||0;
  if(e.k==="goal"){ const s=scScorer(tm,u); return {team:tm,tag:"GOAL",text:`${s.n} ${pickOf(FINISH[s.unit],u>>2)}`} }
  if(e.k==="save"){ const s=scScorer(tm,u), gk=scPlayer(opp,"GK",u)||"the keeper";
    return {team:tm,tag:"",text:`${surname(gk)} ${pickOf(SAVE,u>>3)} ${surname(s.n)}`} }
  if(e.k==="miss"){ const s=scScorer(tm,u); return {team:tm,tag:"",text:`${s.n} ${pickOf(MISS,u>>3)}`} }
  if(e.k==="yellow"){ const n=e.def?scPlayer(tm,"CB",u):scPlayer(tm,pickOf(["CM","FB","W","ST"],u),u);
    return {team:tm,tag:"YELLOW",text:`${n||"a defender"} booked${e.def?" (centre-back)":""}`} }
  if(e.k==="red"){ const n=scPlayer(tm,"CB",1); return {team:tm,tag:"RED",text:`${n||"The centre-back"} sees a second yellow. Down to ten.`} }
  if(e.k==="cue"){ const line=pickOf(CUE[e.cue],u).replace("{t}",tm).replace("{o}",opp).replace("{s}",u%2?"left":"right");
    return {team:tm,tag:"",text:line,cue:true} }
  return {team:tm,tag:"",text:""};
}
function segLabel(d){ return d.seg>=SEGS?(d.so?"Penalties":"Extra time"):segClock(d.seg) }
/* the replay script: one row per event, a quiet row for a quiet spell */
function driveScript(g,drives){
  const out=[];
  drives.forEach(d=>{
    if(d.seg>=SEGS){ const hw=d.pens?d.pens==="home":d.sh>d.sa, tm=hw?g.home:g.away;
      (d.ev||[]).forEach(e=>{const t=scEventText(g,e); out.push({seg:d.seg,clock:e.m+"'",team:t.team,outcome:t.tag,text:t.text,h:d.sh,a:d.sa})});
      out.push({seg:d.seg,clock:d.so?"PENS":"ET",team:tm,outcome:d.so?"PENALTIES":"",text:d.so?`win it on penalties`:`win it in extra time`,h:d.sh,a:d.sa});
      return }
    let sh=d.sh-d.h, sa=d.sa-d.a;
    const ev=(d.ev||[]).filter(e=>e.k!=="cue"||((e.u||0)%3===0));
    if(!ev.length){ out.push({seg:d.seg,clock:segClock(d.seg),team:"",outcome:"",text:"",h:sh,a:sa,quiet:true}); return }
    ev.forEach(e=>{ if(e.k==="goal"){ if(e.side==="home")sh++; else sa++ }
      const t=scEventText(g,e); out.push({seg:d.seg,clock:e.m+"'",team:t.team,outcome:t.tag,text:t.text,h:sh,a:sa,cue:t.cue}) });
  });
  return out;
}
/* a computer game: eighteen spells whose goals add up to the final score */
function gameScript(g,rosterHome,rosterAway,seed){
  const rng=new RNG(seed), out=[];
  const reg=g.ot?Math.min(g.hp,g.ap):null;
  const split=(tot)=>{const v=Array.from({length:SEGS},()=>0); for(let i=0;i<tot;i++)v[rng.int(SEGS)]++; return v};
  const hs=split(reg!==null?reg:g.hp), as=split(reg!==null?reg:g.ap); let sh=0,sa=0;
  for(let s=0;s<SEGS;s++){ sh+=hs[s]; sa+=as[s]; const ev=[];
    for(let i=0;i<hs[s];i++)ev.push({m:s*5+1+rng.int(5),side:"home",k:"goal",u:rng.int(100)});
    for(let i=0;i<as[s];i++)ev.push({m:s*5+1+rng.int(5),side:"away",k:"goal",u:rng.int(100)});
    if(rng.r()<0.25)ev.push({m:s*5+1+rng.int(5),side:rng.r()<0.5?"home":"away",k:rng.r()<0.5?"save":"miss",u:rng.int(100)});
    ev.sort((x,y)=>x.m-y.m);
    out.push({seg:s,h:hs[s],a:as[s],sh:sh,sa:sa,ev:ev}) }
  if(reg!==null)out.push({seg:SEGS,sh:g.hp,sa:g.ap,ot:1,so:!!g.so,pens:g.pens?(g.pens===g.home?"home":"away"):null,h:g.hp-reg,a:g.ap-reg,ev:[]});
  return driveScript(g,out);
}
function liveGapFor(L,mult){
  const d=L.drives[L.drives.length-1];
  const n=d&&d.ev?d.ev.filter(e=>e.k!=="cue"||((e.u||0)%3===0)).length:0;
  const base=n?1300+n*350:520;
  return Math.max(110,Math.round(base*0.52/mult));
}

function tellRows(T){
  const n=Math.max(1,T.n), per=x=>(x/n*9).toFixed(1);   // per forty-five minutes

    ["Turnovers forced in our half",per(T.to),"A high press wins it back near our goal.",T.to/n>=1.15?"hi":""],
    ["Crosses",per(T.cr),"Lots: they're overloading the flanks.",T.cr/n>=1.05?"hi":""],
    ["Long balls",per(T.lb),"Lots: they're going direct.",T.lb/n>=1.3?"hi":""]];
}
/* the scouting report: how they set up in their last few games, and how the

function evidenceHTML(g,my,d,kind){

/* what the evidence said, when it pointed the other way: a read the numbers

function readNote(e){
  if(e.k==="flank"&&e.unclear)return " The count was nearly level, a coin flip, so it isn't graded either way.";
  if(e.k==="read"&&e.evid&&e.evid!==e.truth&&APPROACH[e.evid])

      :` The numbers at the time pointed to ${APPROACH[e.evid].l}: a short stretch can mislead.`;
  if(e.k==="prep"&&e.split){ const by=typeof e.split==="string"?" "+e.split:"";   // "3-3": their last games, by system

  if(e.k==="read")return e.right?`Your read was right: they were ${APPROACH[e.truth].l}.`
    :`They were ${APPROACH[e.truth].l}: the answer was "${COUNTERS[APPROACH[e.truth].counter].l}".`;
  if(e.k==="prep")return e.right?`Your preparation was right: they came out ${APPROACH[e.truth].l}.`
    :`You set up for the wrong thing: they came out ${APPROACH[e.truth].l}.`;

    const played={}; games.forEach(g=>{played[g.winner]=1;played[g.loser]=1});
    NAMES.forEach(t=>{
      if(!played[t])return;                            // bye week
      const wp=this.rec[t][0]/Math.max(1,this.rec[t][0]+this.rec[t][1]);
      this.roster[t].forEach((pl,i)=>{
        if(!pl||!pl.st2||!pl.st2.g)return;
        const P=POS[i%POS.length];
        pl.st=pl.st2.g;
        // MVP voters want production on a winning team even more than Heisman voters
        pl.prod=statProd(P.p,pl.st2)*LEAGUE.awards.weights[P.p]*(0.55+wp*0.9);
      });
    });
  },
  mvpRace(n){
    if(!this.roster)return [];
    const all=[];
    NAMES.forEach(t=>this.roster[t].forEach((pl,i)=>{
      if(pl&&(pl.st||0)>=8)all.push({t:t,n:pl.n,p:pl.p,r:pl.r,c:pl.c,
        prod:pl.prod||0,line:statLine(pl.p,pl.st2),rec:this.rec[t][0]+"-"+this.rec[t][1]});
    }));
    for(let i=all.length-1;i>=0;i--)if(CONF[all[i].t]!=="PL")all.splice(i,1);   // the Premier League's award
    // measured against the position: production over the typical production

    // position (LEAGUE.awards.premium). By raw production a quarterback won
    // every year (passing yards dwarf everything); real voters pick one about
    // nine years in ten.

function dnRosterAfterPlan(t){ const R=U.roster[t]||[], P=S.off&&S.off.picks&&S.off.picks.resign;

/* a mock of the picks between now and your next, from your scouts' numbers: who's likely still there */
function dnMock(avail,ahead,key,teams,t){

  // reliable it is (a "scouts unsure" read is mostly noise: your top names are partly the luckiest reads), then
  // that team's error, which lets it reach for a hard-to-read prospect as real teams do (test/draft-labels.js: a

  // with its own roster's needs on the staff's scale.

  // an unsure read is already said as what he's likely to be (scoutRead), so it isn't pulled in a second time;
  // a worked-out one is a sharp read, not a foggy one
  const wks=(S.off&&S.off.picks&&S.off.picks.workouts)||[];
  const q=avail.map(p=>{ const wk=wks.indexOf(p.pid)>=0, sr=scoutNoise(U,t)*(wk?WK_SHARP:draftFogOf(U,p)), k=st2/(st2+sr*sr), pre=!wk&&draftUnsure(U,p), sh=x=>pre?x:m+(x-m)*k;

  // each team ahead misjudges prospects as its own scouts do (draftNight: its org's scouting, foggier on the hard
  // reads), on top of what you don't know: one spread for every team mocked the board's top names gone too often
  // (test/draft-labels.js at every pick, Nov 2026)
  const sdk=teams?teams.slice(0,ahead).map(tm=>{ const sc=(2.5-orgEdge(U,tm)*1.4)*DRAFT_K.fog*(DRAFT_K.mockOrg||0.7); return q.map(p=>Math.sqrt(p.pv+Math.pow(sc*p.fg,2))) }):null;

}

/* ============ the recruiting board (college games) ============ */
/* A class fills the spots seniors leave. Before the offseason you see, for
   each position with an open spot, a few named prospects, drawn exactly as
   the game draws a freshman newcomer for your program (with your focus and
   recruiting budget). You rank the ones you want. Each open spot goes to
   your highest-ranked prospect there, if he commits; the better he is next
   to what your program usually lands, the harder he is to get. Miss, and you
   get the newcomer you'd have had anyway.
   The default newcomer is always drawn first, from the season's own dice, so
   every other program's class is exactly what it was without a board; the
   commitment rolls use their own dice. (Muse: recruiting was the biggest
   offseason chore, with no board.) */
const RB_PER_POS=4;           // prospects shown at each open position
function rbOpenSpots(my){
  const R=U.roster[my], out={};
  R.forEach((p,i)=>{ if(p&&p.c>=3){ const k=i%POS.length; (out[k]=out[k]||[]).push(p.n) } });
  return out;                  // position index -> the seniors leaving there
}
function rbStars(r){ return r>=82?5:r>=74?4:r>=64?3:2 }
/* the chance he commits: RB_LAND0 for a newcomer of the usual level, falling
   RB_LANDK per standard deviation above it (tuned in test/recruiting.js) */
const RB_LAND0=0.70, RB_LANDK=0.30;
function rbChance(x){ const z=(x.r-x.M)/Math.max(1,x.SD); return Math.max(0.08,Math.min(0.95,RB_LAND0-RB_LANDK*z)) }

/* the prospects at each open position, drawn with the league's own newcomer
   function (drawNewcomer) in this program's context and your choices: the
   same pool your newcomer comes from. Each from its own seed, so the list
   holds through the offseason. M, SD: what a newcomer there averages,
   measured from the same function. */
function rbPool(my,P){
  const open=rbOpenSpots(my), out=[], C=LEAGUE.offseason.recruitCtx(U,my,P||{});
  Object.keys(open).forEach(k=>{ const i=+k;
    const smp=new RNG(strHash(my+"|"+SEA.year+"|mean|"+i)), xs=[];
    for(let q=0;q<60;q++)xs.push(drawNewcomer(smp,C,i).r);
    const M=xs.reduce((a,b)=>a+b,0)/xs.length, SD=Math.sqrt(xs.reduce((a,b)=>a+(b-M)*(b-M),0)/xs.length);
    for(let j=0;j<RB_PER_POS;j++){
      const x=drawNewcomer(new RNG(strHash(my+"|"+SEA.year+"|"+i+"|"+j)),C,i);
      out.push(Object.assign(x,{key:i+"|"+j, i:i, M:Math.round(M*10)/10, SD:Math.round(SD*10)/10, stars:x.star5?5:rbStars(x.r)})) } });
  return out;
}
/* at the commit: your board, as it stands with your final choices */
function rbChoices(my,P){
  const pool=rbPool(my,P), by={}; pool.forEach(x=>by[x.key]=x);
  return (P.rboard||[]).map(k=>by[k]).filter(Boolean);
}
/* in developRoster: the newcomer at position i, from your board if he commits */
function rbSign(board,t,year,i,np){
  if(!board||!board.length)return np;
  const p=POS[i%POS.length].p, x=board.find(y=>!y.used&&y.p===p); if(!x)return np;
  x.used=true;
  const roll=new RNG(strHash(t+"|"+year+"|commit|"+x.n)).r();
  if(roll<rbChance(x)){ x.got=true;
    // he takes the newcomer's place after the offseason's development (rbSettle):
    // swapping him in now would change how the season's dice fall for everyone after
    np._rb=x; np._r0=np.r; np._p0=np.pot; np._c0=np.c; return np }
  // he went elsewhere: a program bigger than yours, more often than not

/* at the end of developRoster: each signed prospect replaces the newcomer
   whose spot he took, developed by as much as that newcomer was */
function rbSettle(roster,arriving){
  roster.forEach((np,k)=>{ if(!np||!np._rb)return; const x=np._rb; x.was=np._r0;   // the newcomer he replaced, as drawn
    const r=Math.round(Math.max(30,Math.min(99,x.r+(np.r-np._r0)))), pot=Math.round(Math.max(r,Math.min(99,x.pot+(np.pot-np._p0))));
    const pl=Object.assign({},x,{i:np.i,p:np.p,r:r,pot:pot,board:true});
    ["key","M","SD","used","got","stars","to"].forEach(q=>delete pl[q]);
    Object.keys(np).forEach(q=>{ if(!(q in pl)&&q[0]!=="_")pl[q]=np[q] });   // anything the offseason gave the newcomer (minutes, flags)
    pl.n=x.n; pl.r=r; pl.pot=pot; pl.c=x.c+((np.c||0)-(np._c0||0)); roster[k]=pl;
    if(arriving){ const a=arriving.indexOf(np); if(a>=0)arriving[a]=pl } });   // the class's record counts him, not the man he replaced
  // a newcomer can declare early the offseason he arrives (college basketball):
  // a recruit standing in for one takes the spot of the newcomer who filled it after him
  (arriving||[]).filter(np=>np&&np._rb&&roster.indexOf(np)<0).forEach(np=>{ const x=np._rb;
    const later=arriving.filter(a=>a&&a!==np&&!a._rb&&!a.board&&a.i===np.i&&roster.indexOf(a)>=0).pop();
    if(!later){ x.got=false; x.to=null; return }

    const pl=Object.assign({},later,x,{i:later.i,p:later.p,board:true}); ["key","M","SD","used","got","stars","to","_rb","_r0","_p0","_c0","was"].forEach(q=>delete pl[q]);

  (arriving||[]).forEach(p=>{ if(p){ delete p._rb; delete p._r0; delete p._p0; delete p._c0 } });
}

  const out=[], score=x=>x.mine>x.theirs?1:x.mine===x.theirs?0.5:0;
