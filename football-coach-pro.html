    // asks only ever go to the side with the ball, so the score is theirs
    const mine=home?st.h:st.a, theirs=home?st.a:st.h;
    const side=home?"home":"away";
    const used=home?st.usedH:st.usedA;
    const calls=()=>home?st.callsH:st.callsA, called=()=>{if(home)st.callsH++;else st.callsA++};
    const late = i>=st.total-7;
    const offE=home?eloH:eloA, defE=home?eloA:eloH;

    // ---- resume from a decision ----
    if(st.stage){
      let choice=st.answer; st.answer=null;
      const P=st.pend, stage=st.stage;
      if(stage==="strategy"){
        st.stage=null;
        // calls are game management, not the weekly gameplan
        if(choice==="push"){ const m=(P.k==="chase"?"force":"chase"); if(home)st.aggrH=m; else st.aggrA=m }
        else if(choice==="sit"){
          if(home)st.aggrH="sit"; else st.aggrA="sit";
          st.endAfter=Math.min(st.total-1,i+3);
        } else { if(home)st.aggrH=st.baseH; else st.aggrA=st.baseA }
        // fall through and play the drive normally
      } else if(stage==="fourth"){
        let res;
        // the call comes at the stall with the drive's end already rolled: choosing what was rolled keeps it. A missed
        // kick asked about and kicked again got a second try the computer never gets (round 43: +5.5 points a game
        // for leaving every call to your assistant)
        const rolled=P.res.kind==="FG"||P.res.kind==="MISS"?"kick":P.res.kind==="DOWNS"?"go":"punt";
        if(choice===undefined||choice===null||choice==="normal")choice=rolled;
        if(choice===rolled&&P.res.kind!=="PUNT"){ res=Object.assign({},P.res); }
        else if(choice==="go"){
          const tg=P.res.togo||3;
          if(rng.r()<goOdds(tg,offE,defE)){
            // converted: the drive carries on from there
            const r2=rollDrive(rng,offE,defE,Math.min(90,P.res.stall+Math.max(2,tg)),"urgent");
            res=r2;
            res.converted=true;
            res.note = r2.pts>0 ? `converted on fourth and ${tg}, then scored`
                                : `converted on fourth and ${tg}, drive stalled later`;
          } else {
            res={pts:0,kind:"DOWNS",stall:P.res.stall,
                 converted:false,
                 note:`went for it on fourth and ${tg} and came up short`};
          }
        } else if(choice==="kick"){
          res = rng.r()<fgOdds(P.res.stall)
            ? {pts:3,kind:"FG",stall:P.res.stall,note:"kicked a "+fgDistance(P.res.stall)+"-yard field goal"}
            : {pts:0,kind:"MISS",stall:P.res.stall,note:"missed a "+fgDistance(P.res.stall)+"-yard field goal"};
        } else res={pts:0,kind:"PUNT",stall:P.res.stall,note:"punted it away"};
        return {drive:push(home,P.q,P.start,res,P.aggr),h:st.h,a:st.a};
      } else if(stage==="fbread"){
        st.stage=null; const D=st.D[side], dp=P.dp;
        const pick=choice==="keep"?st.ans[side]:FB_ANSWERS[choice]?choice:null;
        if(pick&&FB_ANSWERS[pick]){
          const e={side:side,h:dp.h,k:dp.k,pick:pick,truth:D.sch,right:FB_ANSWERS[pick].beats===D.sch};
          if(dp.k==="read")e.evid=dp.best; if(dp.k==="prep"){ const a=Object.values(dp.report).sort((x,y)=>y-x); if(a[0]===a[1])e.unclear=true; const ks=Object.keys(dp.report).sort((x,y)=>dp.report[y]-dp.report[x]); if(!e.unclear&&FB_ANSWERS[pick].beats===ks[0]){ e.followed=true; e.fav=ks[0] } }   // round 71: followed the report
          st.log.push(e); st.ans[side]=pick }
        else if(dp.k==="prep"&&dp.report){   // waiting is graded too: right when the report's favourite was wrong (round 42; the
          const ks=Object.keys(dp.report).sort((a,b)=>dp.report[b]-dp.report[a]);   // other four games had it from round 39)
          st.log.push({side:side,h:dp.h,k:"prep",pick:"wait",waited:true,fav:ks[0],truth:D.sch,right:ks[0]!==D.sch,unclear:dp.report[ks[0]]===dp.report[ks[1]]}) }
        // "leave it to your assistant": the plan stays as it is, as for the computer's offense (round 43)
        // fall through and play the drive
      } else if(stage==="rest"){
        st.stage=null;
        if(choice==="rest"){ st.rest=st.rest||{}; st.rest[side]=true; if(home)st.aggrH="sit"; else st.aggrA="sit" }
        st.log.push({side:side,k:"rest",pick:choice==="rest"?"rest":"keep",unclear:true});
        // fall through and play the drive
      } else if(stage==="onside"){
        // asked of the side that just scored, before the other side's possession
        st.stage=null;
        if(choice==="onside"){ const ok=rng.r()<ONSIDE_P;
          if(ok){ st.drives.push({home:home,q:q,start:null,pts:0,kind:"ONSIDE",h:st.h,a:st.a,n:st.i+1,aggr:"balanced",
              note:"never had it: the onside kick was recovered",converted:null,togo:null});
            st.prev="ONSIDE"; st.at=null; st.i++; return {drive:st.drives[st.drives.length-1],h:st.h,a:st.a} }
          st.prev="ONSIDEX"; st.at=null; st.onsideMiss=true }
        // fall through: their possession, from wherever the kick left it
      } else if(stage==="defend"){
        st.stage=null; st.dmode=(choice==="prevent"||choice==="pressure")?choice:null;
        // fall through and play their drive against it
      } else if(stage==="two"){
        let res;
        if(choice==="two"){
          res = rng.r()<0.47 ? {pts:8,kind:"TD",stall:100,note:"scored, and the two-point try was good"}
                             : {pts:6,kind:"TD",stall:100,note:"scored, but the two-point try failed"};
        } else {
          res = rng.r()<0.97 ? {pts:7,kind:"TD",stall:100}
                             : {pts:6,kind:"TD",stall:100,note:"scored, but missed the extra point"};
        }
        if(home)st.h-=6; else st.a-=6;            // put on the board at the question; push adds the whole score
        return {drive:push(home,P.q,P.start,res,P.aggr),h:st.h,a:st.a};
      }
    }

    // ---- before their possession: your onside kick, or your defense on a late drive ----
    // (asked of the side without the ball: the other one, a person facing the computer)
    const oth=home?"away":"home", othUser=home?humans.away:humans.home, othCalls=home?st.callsA:st.callsH;
    if(othUser&&!isUser&&!st.stage&&!st.lateAsked&&othCalls<MAX_CALLS){
      const oMine=home?st.a:st.h, oTheirs=home?st.h:st.a, d=oMine-oTheirs, left=st.total-i;   // left: possessions to go, this one included
      const oUsed=home?st.usedA:st.usedH;
      // you just scored and still trail, with too few possessions to win it the slow way
      if(!oUsed.onside&&(st.prev==="TD"||st.prev==="FG")&&d<0&&d>=-16&&left<=4){
        oUsed.onside=true; if(home)st.callsA++; else st.callsH++; st.lateAsked=true;
        st.stage="onside"; st.pend={q:q};
        return {ask:onsideCall(d,left),mine:oMine,theirs:oTheirs,q:q,side:oth} }
      // their late drive, you ahead by a score or level
      if(!oUsed.defend&&d>=0&&d<=8&&left<=3){
        oUsed.defend=true; if(home)st.callsA++; else st.callsH++; st.lateAsked=true;
        st.stage="defend"; st.pend={q:q};
        return {ask:defendCall(d,left),mine:oMine,theirs:oTheirs,q:q,side:oth} }
    }
    if(!st.stage)st.lateAsked=false;

    const start=st.startHold!==undefined?st.startHold:nextStart(rng,st.prev,st.at); st.startHold=undefined;

    // ---- their defense: the half-time change, and your reads (before your drive) ----
    if(!st.stage&&i>=st.total/2){ ["home","away"].forEach(sd=>{ const D=st.D[sd]; if(!D||D.half)return; D.half=true;
        const behind=(sd==="home"?st.a-st.h:st.h-st.a)<0;   // their side behind
        if(rng.r()<(behind?FB_READ.swBehind:FB_READ.sw)){ const ks=SCHEME_KEYS.filter(k=>k!==D.sch); D.sch=ks[rng.int(ks.length)] } }) }
    if(isUser&&!st.stage&&st.D[side]){ const D=st.D[side]; let dp=null;
      if(!D.asked.prep&&D.fav){ D.asked.prep=true; dp=fbPrepCall(fbReport(D.fav,(ctx.seed||0)+(side==="home"?2:1))) }
      else if(!D.asked.r1&&q>=2&&D.T.n>=2){ D.asked.r1=true; dp=fbReadCall(1,D.T,null,D.last,st.ans[side]) }
      else if(!D.asked.r2&&D.half&&D.T2.n>=2&&callMatters(q,mine-theirs)){ D.asked.r2=true; dp=fbReadCall(2,D.T,D.T2,D.last,st.ans[side]) }
      if(dp){ st.stage="fbread"; st.pend={q:q,dp:dp}; st.startHold=start; return {ask:dp,mine:mine,theirs:theirs,q:q,side:side} } }

    // ---- a decided game, your ball: rest the starters? (Muse: a 24-point fourth-quarter lead asked nothing) ----
    // ...and from the third quarter in a rout (Muse, round 39: a 61-17 win asked nothing after the second quarter)
    const RL=mine-theirs, restNow=(q>=4&&RL>=14&&RL<=24)||(q>=3&&RL>=21&&RL<=40);
    if(isUser&&!st.stage&&restNow&&!(home?st.usedH:st.usedA).rest){
      (home?st.usedH:st.usedA).rest=true; st.stage="rest"; st.pend={q:q}; st.startHold=start;
      return {ask:{k:"rest",h:`Up ${mine-theirs} in the ${q>=4?"fourth":"third"} quarter`,
        b:`Rest your starters? The backups run the clock out: a lead this size usually holds, though not always, and nobody gets hurt on the sideline. ${possLeft(st.total-i,true)}`,
        opts:[["rest","Rest the starters"],["keep","Keep them in until it's safe"],["normal","Leave it to your assistant"]]},mine:mine,theirs:theirs,q:q,side:side} }

    // ---- strategic call before the snap ----
    if(isUser&&calls()<MAX_CALLS&&!st.stage){

                 mine:mine,theirs:theirs};
      const dp=decisionPoint(ctx,true);
      if(dp){
        used[dp.k]=true; called();
        st.stage="strategy"; st.pend={q:q,start:start,k:dp.k};
        return {ask:dp,mine:mine,theirs:theirs,q:q,side:side};
      }
    }

    const aggr=isUser?(home?st.aggrH:st.aggrA)
                     :situational(home?st.aggrH:st.aggrA,i,st.total,mine,theirs);
    let dm=!isUser?st.dmode:readMod(side); if(!isUser)st.dmode=null;
    // their drive against your rested starters: the backups give up more (the price of resting them)
    if(!isUser&&st.rest&&st.rest[home?"away":"home"]){ const D0=typeof dm==="string"?DEF_MODE[dm]:dm, R0=FB_REST_DEF;
      dm={td:(D0?D0.td:0)+R0.td, fg:(D0?D0.fg:0)+R0.fg, to:(D0?D0.to:0)+R0.to} }   // your defense, this drive only; your offense's answer, until you change it
    const res=rollDrive(rng,offE,defE,start,aggr,dm);
    if(isUser)tellDrive(side);
    if(dm&&!isUser)res.note=(res.note?res.note+"; ":"")+(dm==="prevent"?"against your prevent defense":"against your pressure");
    if(st.onsideMiss){ st.onsideMiss=false; res.note=(res.note?res.note+"; ":"")+"after recovering the onside kick" }

    // ---- a call the situation creates ----
    if(isUser&&calls()<MAX_CALLS){
      // asked at every stall, a made kick too: asked only after a miss, a punt or a failed try, every call was a
      // second chance (round 43)
      if((res.kind==="PUNT"||res.kind==="DOWNS"||res.kind==="MISS"||res.kind==="FG")&&(used.fourth||0)<4&&callMatters(q,mine-theirs)&&inReach(q,mine-theirs,home?eloH-eloA:eloA-eloH)){

        if(dp)dp.rolled=res.kind==="FG"||res.kind==="MISS"?"kick":res.kind==="DOWNS"?"go":"punt";
        if(dp&&dp.opts.some(o=>o[0]===dp.rolled)){
          used.fourth=(used.fourth||0)+1; called();
          st.stage="fourth"; st.pend={q:q,start:start,res:res,aggr:aggr};
          return {ask:dp,mine:mine,theirs:theirs,q:q,side:side};
        }
      }
      if(res.kind==="TD"&&(used.two||0)<2){
        const dp=twoPointCall(mine,theirs,q,late);
        if(dp){
          used.two=(used.two||0)+1; called();
          st.stage="two"; st.pend={q:q,start:start,res:res,aggr:aggr};
          if(home)st.h+=6; else st.a+=6;          // the touchdown is on the board while you decide
          return {ask:dp,mine:mine+6,theirs:theirs,q:q,side:side};
        }
      }
    }
    { const effT=st.endAfter!==undefined?Math.min(st.total,st.endAfter+1):st.total;
      const r2=endgameDrive(rng,res,mine-theirs,effT-i,offE,defE);
      if(r2.kind==="TD"&&r2.pts===7&&twoChart(mine+6-theirs,q>=4||effT-i<=8)){
        const ok=rng.r()<0.47; r2.pts=ok?8:6; r2.note=(r2.note?r2.note+"; ":"")+(ok?"went for two and got it":"went for two and was stopped") }
      return {drive:push(home,q,start,r2,aggr),h:st.h,a:st.a}; }
  };
  st.reply=function(v){ st.answer=v; };
  return st;
}

/* how much game is left, in the engine's own clock: possessions. "About 6 minutes" was a guess on top of it
   (Grokbot: late calls without the exact time); the drives left are exact. left counts this one. */
function possLeft(left,mineNext){
  const you=mineNext?Math.ceil(left/2):Math.floor(left/2), them=left-you;
  return `Possessions left: ${you} for you, ${them} for them.`;
}
const ONSIDE_P=(LEAGUE.tuning&&LEAGUE.tuning.onside)||0.12;   // about one in eight recovered, under today's kickoff rules
function onsideCall(diff,left){
  // left: possessions to go, theirs next. Kick deep and they get theirs; recover it and theirs is gone.
  const need=-diff<=3?"a field goal":-diff<=8?"a touchdown":"two scores";
  return {k:"onside",h:`Down ${-diff} after your score`,
    b:`You need ${need}. Kick it deep and make a stop, or try the onside kick? About one in eight is recovered; a miss hands them a short field. ${possLeft(left,false)}`,
    opts:[["onside","Onside kick"],["normal","Kick it deep, as your assistant would"]],left:left,diff:diff};
}
function defendCall(diff,left){
  const what=diff===0?"Any score beats you.":diff<=3?"A field goal "+(diff===3?"ties it":"beats you")+".":"Only a touchdown beats you.";
  return {k:"defend",h:diff===0?"Tied, and they have the ball":`Up ${diff}, and they have the ball`,
    b:`${what} Prevent defense gives up yards and field goals to stop the big play; pressure takes the ball away more often and gives up more touchdowns. ${possLeft(left,false)}`,
    opts:[["prevent","Prevent: nothing deep"],["pressure","Bring pressure"],["normal","Play it straight, as your assistant would"]],left:left,diff:diff};
}

/* Is this a moment worth stopping the game for? */
const FB_LATE2=true;
function decisionPoint(state, isUser){
  if (!isUser) return null;
  const q=state.q, idx=state.idx, total=state.total, mine=state.mine,
        theirs=state.theirs, startYd=state.startYd, used=state.used;
  const late = idx >= Math.floor(total * 0.78);
  const veryLate = idx >= total - 7;
  const diff = mine - theirs;
  // roughly how long is left: drives come about evenly through the game (Grokbot: a late call showed the quarter, not the clock)
  // before the fourth it's the quarter's clock: "About 18 minutes left" at "end of the third" read as wrong (Grokbot;
  // it was 3 in the quarter plus the fourth)
  const left = Math.max(1, Math.round(60*(total-idx)/total)), inQ = Math.min(15, Math.max(1, left-(4-Math.min(4,q))*15)),
        clock = q>=4 ? " "+possLeft(total-idx,true) : ` About ${inQ} minute${inQ===1?"":"s"} left in the ${["first","second","third"][q-1]||"third"} quarter.`;

  // asked on your last possession, when what you need is known: a field
  // goal to win or tie, or nothing less than a touchdown
  const lastBall = idx >= total - 2;
  if (lastBall && diff < 0 && diff >= -8 && !used.chase) {
    return {
      k:"chase",
      h:`Down ${-diff}, last possession`,
      b:(-diff<=3 ? `A field goal ${-diff===3?"ties it":"wins it"}. Take what they give you, or go for the touchdown?`
                  : `Only a touchdown will do. Force it downfield, or work it and trust the clock?`)+clock,
      opts:[["push","Open it up"],["normal","Stay patient"]]
    };
  }
  // round 40: one-score finishes with the ball and no call (4 of 7 in pro football): level late is a real choice
  // (13.5 points a call in pro football, 12.5 in college)
  if (FB_LATE2 && veryLate && diff === 0 && !used.tied) {
    return { k:"tied", h:q>=4?"Tied late":"Tied in the third",
      b:`Go for the win, or play it safe and don't hand it to them?`+clock,
      opts:[["push","Go for the win: attack downfield"],["sit","Play it safe: run it, protect the ball"],["normal","Leave it to your assistant"]] };
  }
  // cut (round 40): "hurry-up now?" behind with two or three possessions left moved about 4 points, over half the calls under 3
  if (veryLate && diff > 0 && diff <= 10 && !used.protect) {   // up 12 to 14 the choice moved nothing (test/call-weight.js, Nov 2026)
    return {
      k:"protect",
      h: q>=4?`Up ${diff} late`:`Up ${diff} in the third`,   // it can come in the third (Grokbot: "up 4 late" in Q3)
      b:`Sit on it and shorten the game, or keep the throttle down.`+clock,
      opts:[["sit","Bleed the clock"],["keep","Keep attacking"]]
    };
  }
  // two scores either way at the break, but not three: up 24 at half, "manage it" was asked and
  // changed nothing (Grokbot; Instinct: "comfortable-lead busywork")
  // cut (round 33): asked only at two scores or more, where it never moved anything (0 to 1.3 points a call, 100%
  // either way in every measured case); the close games' half-time is the fourth downs' and the late calls' job
  if (false && q === 3 && idx === Math.floor(total/2) && Math.abs(diff) >= 14 && callMatters(q,diff) && !used.half) {
    return {
      k:"half",
      h: diff < 0 ? `Down ${-diff} at the break` : `Up ${diff} at the break`,
      b: diff < 0 ? `You need something different in the second half.`
                  : `You can put your foot down or start managing this.`,
      opts: diff < 0 ? [["push","Take more risks"],["normal","Stick with it"]]
                     : [["sit","Manage it"],["normal","Keep going"]]
    };
  }
  return null;
}

/* Which option each of them would take, and what they'd say about it. */
/* The Bears do not reason. They react. */
const BEAR_YELL={
  fourth:[`GO. GO. GO. GO.`,
          `SEND IT. Send it right now.`,
          `We are Gods. Gods do not hesitate.`,
          `The universe has already decided. We're just telling you.`,

          `History will remember us. Act accordingly.`],
  fourthKick:[`We did not come here to KICK.`,
          `Boo the kicker. Boo him off the field.`,
          `Three points is a participation trophy.`,
          `Gods do not accept three. Gods take seven.`,
          `Kicking is just punting with extra steps.`,
          `Somebody fetch us a throne and a first down.`],
  fourthPunt:[`Punting is for cowards and accountants.`,
          `If we punt we are walking home.`,
          `Give the ball AWAY? On purpose? To THEM?`,
          `We answer to no one. Least of all the punt team.`,

  two:   [`TWO! TWO! TWO! TWO!`,
          `One point? ONE? Be serious.`,

  chase: [`AAAAAAAA.`,
          `Throw it deep. Then throw it deeper.`,

          `The Gods are DISPLEASED. Fix it.`,
          `Everything. Right now. All of it.`,

  protect:[`MORE. We want MORE points.`,

          `LOUDER. Whatever we're doing, LOUDER.`,
          `Build us a statue at halftime. We'll wait.`,

  distracted:[`CHOCOLATE CAKE!`,
          `What did we do?`,

/* Pearl is a dog roughly one time in six. Unlike the Bears, her advice
   survives it — the dog bit wraps the read rather than replacing it, so you
   never lose the balanced opinion just because a squirrel went past. */
const PEARL_BEFORE=[`Woof! `,`SQUIRREL. `,`Ooh, ooh, ooh! `,
  `Was that the treat bag? ... Anyway. `,`Someone's at the door! ... No. False alarm. `];
const PEARL_AFTER=[` Woof!`,` (Tail going. Very hard.)`,` Can we go outside after?`,
  ` Also, is it dinner? It smells like dinner.`,` I'm going to spin in a circle about this.`,
  ` Ball. BALL. Sorry \u2014 the actual ball. Carry on.`];
function pearlSay(line, seed){
  const n=Math.abs(seed|0);
  if(n%6!==1)return line;
  return (n%12===1)
    ? PEARL_BEFORE[Math.floor(n/6)%PEARL_BEFORE.length]+line
    : line+PEARL_AFTER[Math.floor(n/6)%PEARL_AFTER.length];
}

function bearYell(kind, seed){
  const n=Math.abs(seed|0);
  // roughly one call in four, they lose the thread entirely
  if(n%4===2){
    const d=BEAR_YELL.distracted;
    return d[Math.floor(n/4)%d.length];
  }
  const pool=BEAR_YELL[kind]||BEAR_YELL.fourth;
  return pool[n%pool.length]||"We have a feeling about this one. A big feeling.";   // never a blank line
}

function staffTake(dp, ctx){
  const opts = dp.opts.map(o=>o[0]);
  const has = k=>opts.indexOf(k)>=0;
  const pct = k=>{
    const o=dp.opts.find(x=>x[0]===k); if(!o)return null;
    const m=o[1].match(/(\d+)%/); return m?+m[1]:null;
  };
  const diff = (ctx.mine||0)-(ctx.theirs||0);
  const seed = (ctx.mine||0)*7+(ctx.theirs||0)*3+(ctx.q||0)+((typeof live!=="undefined"&&live&&typeof liveSeed==="function")?(liveSeed(live.step)%9973):0);   // and the match: at 0-0 at the half every game said the same words (Muse, round 39)
  const R=[];

  if(dp.k==="fourth"){
    const go=pct("go")||0, kick=pct("kick");
    // Anacondish: the points are worth it only if the kick is actually makeable
    const mid = (kick!==null && kick>=52) ? "kick"
              : (go>=48 ? "go" : (has("punt")?"punt":"kick"));
    // L: a long kick is a risk too. She wants the safest available outcome.
    const safe = (kick!==null && kick>=58) ? "kick"
               : (has("punt") ? "punt" : (kick!==null ? "kick" : "go"));
    R.push({who:"bears", pick:"go",
      line:bearYell(kick!==null?"fourthKick":"fourthPunt", seed)});
    R.push({who:"pearl", pick:mid, line:pearlSay(mid==="kick" ? [`${kick}% for three points! I'll take three points.`,`Three points! ${kick}%! Kick it!`,`Points are points. ${kick}% says kick.`][seed%3]
      : mid==="go"  ? (diff<0&&((ctx.q||0)>=3||diff<=-8) ? `We're behind. We need points, not a punt. Let's go for it!`   // not at 0-7 in the first quarter (Grokbot)        // from the situation, not one canned line (it said "brilliant all day" on drive 1)
                     : (ctx.q||0)<=4 ? `It's early, and they've earned a shot. ${go}% to convert: let's go!`
                     : go>=60 ? `${go}% to convert? I'll take those odds every time!`
                     : `They've moved it well. Let them finish the drive!`)
      :               `Nothing lovely on offer here. Give it back and go get it again.`,seed)});
    R.push({who:"capy", pick:safe, line:
      safe==="punt" ? (kick!==null
          ? [`It seems to me ${kick}% is rather more of a wish than a plan. I'd punt.`,`${kick}% from there? I'd sooner pin them deep and let the defense earn it.`,`A miss hands them the ball at the spot. I'd punt, if it's all the same.`][seed%3]
          : `Too far to kick, and ${go}% to convert is more risk than I care for. Give it back and defend.`)   // with the number the staff room shows (it said "simply too far" beside 69-72%: Grokbot)
      : safe==="kick" ? [`I do believe ${kick}% is about as comfortable as we're likely to get.`,`${kick}% for points, and no turnover on downs to regret. I'll take the kick.`,`A kick at ${kick}%. Points on the board are points nobody can take back.`][seed%3]
      :                 `I'm not enthusiastic, but nothing safer appears to be on offer.`});
  }
  else if(dp.k==="two"){
    R.push({who:"bears", pick:"two", line:bearYell("two",seed)});
    R.push({who:"pearl", pick: (diff+7)===1||(diff+7)===-1 ? "two":"kick", line:pearlSay((diff+7)===1||(diff+7)===-1 ? `One point either way is agony! Let's just settle it.`
                                  : `The kick keeps it simple, and simple is lovely.`,seed)});
    R.push({who:"capy", pick:"kick", line:`A missed conversion would be, I fear, one more thing to worry about.`});
  }
  else if(dp.k==="chase"){
    R.push({who:"bears", pick:"push", line:bearYell("chase",seed)});
    R.push({who:"pearl", pick: diff<=-4 ? "push":"normal", line:pearlSay(diff<=-4
      ? `More than a field goal down \u2014 come on, let's go and get it!`
      : `It's one score! We've got time. No need to panic.`,seed)});
    R.push({who:"capy", pick:"normal", line:`One rather suspects each additional risk compounds against us. Stay measured.`});
  }
  else if(dp.k==="protect"){
    R.push({who:"bears", pick:"keep", line:bearYell("protect",seed)});
    R.push({who:"pearl", pick:"keep", line:pearlSay(diff>=13
      ? `We're playing so well! Let's just keep playing.`
      : [`Whatever we did to get here \u2014 more of that, please.`,`Don't change a thing. It's working!`,`We're winning! Keep doing the winning thing.`][seed%3],seed)});
    R.push({who:"capy", pick:"sit", line:`I would gently suggest fewer possessions. Fewer possessions, fewer catastrophes.`});
  }
  else if(dp.k==="tied"){
    R.push({who:"bears", pick:"push", line:`TIES ARE FOR NECKWEAR. THROW IT DEEP.`});
    R.push({who:"pearl", pick:["push","sit","push"][Math.abs(seed)%3], line:pearlSay([`We can win this! Let's go and take it!`,`Don't give it away! Hold onto the ball and they'll make the mistake.`,`One drive! That's all we need. Let's go!`][Math.abs(seed)%3],seed)});
    R.push({who:"capy", pick:"sit", line:`The interception, it seems to me, is the play that loses tied games.`});
  }
  else if(dp.k==="rest"){
    R.push({who:"bears", pick:"keep", line:`Rest? We'll rest in the off-season.`});
    R.push({who:"pearl", pick:"rest", line:pearlSay(`It's won! Get the starters off before somebody gets hurt.`,seed)});
    R.push({who:"capy", pick:"rest", line:`A lead like this usually holds, it seems to me. Usually.`});
  }
  else if(dp.k==="prep"){
    const top=dp.pearl;
    R.push({who:"bears", pick:"deep", line:bearYell("chase",seed)});
    R.push({who:"pearl", pick:SCHEMES[top]?SCHEMES[top].counter:"normal", line:pearlSay(`They were ${SCHEMES[top].l} in ${dp.report[top]} of their last ${dp.n}! Let's practise for that!`,seed)});
    R.push({who:"capy", pick:"normal", line:`I'd want to see a few of our drives first. Teams aren't always who the tape says.`});
  }
  else if(dp.k==="read"){
    // her eyes are the last drive; the numbers are the whole game (or since half-time). She says when they differ.
    const eyes=dp.pearl, off=eyes&&dp.best&&eyes!==dp.best;
    R.push({who:"bears", pick:"deep", line:bearYell("chase",seed)});
    R.push({who:"pearl", pick:SCHEMES[eyes]?SCHEMES[eyes].counter:"normal", line:pearlSay(off
      ? `That last drive looked like they were ${SCHEMES[eyes].l}! The numbers say ${SCHEMES[dp.best].l}, though, and one drive is one drive.`
      : `They're ${SCHEMES[eyes].l}, and the numbers agree! ${FB_ANSWERS[SCHEMES[eyes].counter].l}!`,seed)});
    R.push({who:"capy", pick:"run", line:`It seems to me running the ball rarely hurts. I haven't, I confess, looked at the numbers.`});
  }
  else if(dp.k==="onside"){
    const d=dp.diff||diff;
    R.push({who:"bears", pick:"onside", line:bearYell("chase",seed)});
    R.push({who:"pearl", pick:d<=-9?"onside":"normal", line:pearlSay(d<=-9
      ? `We need two scores and there isn't time for them to have the ball. Onside!`
      : `One more stop and we get it back! Kick it deep and trust the defense.`,seed)});
    R.push({who:"capy", pick:"normal", line:`One in eight, I believe. And a short field for them the other seven times. I'd kick it deep.`});
  }
  else if(dp.k==="defend"){
    const d=dp.diff;
    R.push({who:"bears", pick:"pressure", line:bearYell("protect",seed)});
    R.push({who:"pearl", pick:d>=4?"prevent":"pressure", line:pearlSay(d>=4
      ? `Only a touchdown beats us! Keep everything in front and let them kick.`
      : d===0?`Any score beats us, so a field goal's as bad as a touchdown. Go and get the ball!`:`A field goal ${d===3?"ties it":"beats us"}, so letting them kick doesn't help. Go after them!`,seed)});
    R.push({who:"capy", pick:"prevent", line:`It seems to me the big play is what loses these. I'd keep everyone deep, whatever the score.`});
  }
  else if(dp.k==="half"){
    const down = diff<0;
    R.push({who:"bears", pick: down?"push":"normal", line:bearYell("half",seed)});
    R.push({who:"pearl", pick:"normal", line:pearlSay(down
      ? `They're not playing badly! Let's just play a bit better.`
      : `This is going great. Exactly as we are, please.`,seed)});
    R.push({who:"capy", pick: down?"normal":"sit", line: down
      ? `If I may \u2014 panicking at this juncture tends to worsen the scoreline, not mend it.`
      : `We have, I think, got what we came for. I'd rather not risk anybody now.`});
  }
  return R;
}

/* A line for the moments outside a game. */
function staffAside(kind, data){
  const L={
    depth:[["bears",`Play the kid. Chaos is a ladder.`],
           ["pearl",`He's waited so patiently for this. Let him play!`],
           ["capy",`It seems to me changing the quarterback mid-season rarely goes as people imagine.`]],
    staff:[["bears",`SACK HIM. On the field. In front of everyone.`],
           ["pearl",`Everyone has bad seasons. Maybe he just needs a bit of help.`],
           ["capy",`I do believe I'd want to be very sure before we start pulling things apart.`]],
    win:  [["bears",`WE ARE UNSTOPPABLE. Say it back to us.`],
           ["pearl",`I'm SO proud of them. Every single one.`],
           ["capy",`Lovely. Though I am, I confess, already a little worried about next week.`]],
    loss: [["bears",`Rigged. Absolutely rigged. We're appealing.`],
           ["pearl",`It's alright! There's another one next week.`],
           ["capy",`I did rather have a feeling. I didn't want to say.`]],
    title:[["bears",`RINGS. RINGS FOR THE BEARS. We did most of it.`],
           ["pearl",`Look at them all crying. It's the loveliest thing.`],
           ["capy",`Champions. I have, I should say, prepared some remarks. They are quite long.`]]
  };
  const set=L[kind]; if(!set)return null;
  const i=Math.abs((data|0))%set.length;
  return {who:set[i][0], line:set[i][1]};
}

/* ============ watching a game ============ */
/* Reconstructs a full drive chart that adds up to the real final score, using
   the actual players on both rosters. Seeded from the game itself, so it never
   touches the season's RNG. */

/* Break a final score into plausible scoring plays. Safeties are only used when
   the number genuinely can't be reached any other way (2, 4 and 5 points). */
const BAD_REMAINDER=new Set([1,2,4,5]);

function scoreParts(P,rng){
  if(P===0)return [];
  if(P===2)return [2];
  if(P===4)return [2,2];
  if(P===5)return [2,3];
  const out=[]; let left=P, guard=0;
  while(left>0&&guard++<40){
    const opts=[];
    if(left>=7){opts.push(7,7,7,7,7,7)}                // touchdowns carry the load
    if(left>=6&&rng.r()<0.12){opts.push(6)}            // missed extra point
    if(left>=3){opts.push(3,3,3)}
    if(left>=8&&rng.r()<0.055){opts.push(8)}           // a two-point try by choice
    let ok=opts.filter(v=>{const r=left-v; return r===0||!BAD_REMAINDER.has(r)});
    if(!ok.length&&left>=8)ok=[8];                     // 8 is the only way out of 8
    if(!ok.length){                                    // forced into a safety
      if(left===1&&out.length){out[out.length-1]+=1;break}
      out.push(left>=2?2:left); left-=2; continue;
    }
    const v=ok[rng.int(ok.length)];
    out.push(v); left-=v;
  }
  return out;
}

const PUNT_LINES=["three and out","forced to punt","stalls out, punt",
  "goes backwards, punt","can't move it, punt"];

function scoreText(rng,off,def,pts){
  const nm=i=>off&&off[i]?off[i].n:"the offense";
  const dn=i=>def&&def[i]?def[i].n:"the defense";
  if(pts===3)return `${Math.round(rng.range(19,52))}-yd field goal`;
  if(pts===2)return rng.r()<0.5?`tackled in the end zone \u2014 safety`
    :`snap sails out of the end zone \u2014 safety`;
  if(pts===6&&rng.r()<0.5)return `${dn(8)} ${Math.round(rng.range(18,88))}-yd pick six`;
  const yds=Math.round(rng.range(2,64));
  const two=pts===8?", two-point conversion good":"";
  if(rng.r()<0.56)return `${nm(0)} ${yds}-yd TD pass to ${nm(rng.r()<0.62?2:3)}${two}`;
  if(rng.r()<0.82)return `${nm(1)} ${yds}-yd TD run${two}`;
  return `${nm(0)} ${Math.round(rng.range(1,14))}-yd TD run${two}`;
}

/* Every drive, scoring or not. start/end are yards from the offense's own goal. */
function gameScript(g,rosterHome,rosterAway,seed){
  const rng=new RNG((seed>>>0)||1);
  const hsc=scoreParts(g.hp,rng), asc=scoreParts(g.ap,rng);
  // both teams get the same number of possessions, so the game trades properly
  const target=Math.max(hsc.length,asc.length,Math.round(rng.range(10,13)));
  const items=[];
  hsc.forEach(p=>items.push({side:"home",pts:p}));
  asc.forEach(p=>items.push({side:"away",pts:p}));
  for(let i=hsc.length;i<target;i++)items.push({side:"home",pts:0});
  for(let i=asc.length;i<target;i++)items.push({side:"away",pts:0});

  // teams trade possession; scoring drives fall wherever they fall
  const hq=rng.shuffle(items.filter(d=>d.side==="home"));
  const aq=rng.shuffle(items.filter(d=>d.side==="away"));
  const seq=[]; let turn=rng.r()<0.5?"home":"away";
  while(hq.length||aq.length){
    const q=turn==="home"?hq:aq;
    if(q.length)seq.push(q.shift());
    else seq.push((turn==="home"?aq:hq).shift());
    turn = turn==="home"?"away":"home";
  }
  // lay them across four quarters with a clock that runs down
  const per=Math.ceil(seq.length/4);
  seq.forEach((d,i)=>{
    d.q=Math.min(4,Math.floor(i/per)+1);
    const within=i-(d.q-1)*per;
    d.sec=Math.max(8,Math.round(895-(within+1)*(880/(per+1))-rng.range(0,40)));
  });

  // "runs out the clock" only belongs on the last drive of a half
  const lastOfQ={};
  seq.forEach((d,i)=>{lastOfQ[d.q]=i});

  let H=0,A=0;
  return seq.map((d,idx)=>{
    const endsHalf = (idx===lastOfQ[2]) || (idx===lastOfQ[4]);
    const off=d.side==="home"?rosterHome:rosterAway;
    const def=d.side==="home"?rosterAway:rosterHome;
    const start=Math.round(Math.max(3,Math.min(78,rng.gauss(27,13))));
    let end,outcome,text;
    let possSide=d.side;
    if(d.pts>0){
      if(d.side==="home")H+=d.pts; else A+=d.pts;
      outcome = d.pts===2?"SAF" : d.pts===3?"FG" : "TD";
      if(d.pts===2){
        possSide = d.side==="home"?"away":"home";     // the trapped offense
        end = 0;                                      // its own goal line
      }else end = 100;
      text = scoreText(rng,off,def,d.pts);
    }else{
      const roll=rng.r();
      if(roll<0.52){outcome="PUNT"; end=Math.min(92,start+Math.round(rng.range(-2,34)));
        text=rng.pick(PUNT_LINES);}
      else if(roll<0.64){outcome="DOWNS"; end=Math.min(95,start+Math.round(rng.range(8,48)));
        text="turned over on downs";}
      else if(roll<0.75){outcome="MISS"; end=Math.min(88,start+Math.round(rng.range(20,55)));
        text=`${Math.round(rng.range(38,56))}-yd attempt is no good`;}
      else if(roll<0.87){outcome="INT"; end=Math.min(96,start+Math.round(rng.range(0,45)));
        text=`intercepted by ${def&&def[8]?def[8].n:"the defense"}`;}
      else if(roll<0.95){outcome="FUM"; end=Math.min(96,start+Math.round(rng.range(0,42)));
        text=`fumble, recovered by ${def&&def[7]?def[7].n:"the defense"}`;}
      else if(endsHalf){outcome=d.q===2?"HALF":"END";
        end=Math.min(90,start+Math.round(rng.range(0,38)));
        text=d.q===2?"runs out the half":"runs out the clock";}
      else {outcome="PUNT"; end=Math.min(92,start+Math.round(rng.range(-2,34)));
        text=rng.pick(PUNT_LINES);}
    }
    const mm=Math.floor(d.sec/60), ss=d.sec%60;
    return {
      n:idx+1, q:d.q, clock:mm+":"+(ss<10?"0":"")+ss, sec:d.sec,
      team:possSide==="home"?g.home:g.away, side:possSide,
      scoredBy:d.pts===2?(d.side==="home"?g.home:g.away):null,
      pts:d.pts, outcome:outcome, text:text, start:start, end:end,
      yards:Math.max(0,end-start),
      ball: possSide==="home" ? 100-end : end, // 0 = away end zone, 100 = home end zone
      h:H, a:A
    };
  });
}

/* ---- the field ---- */
/* End zones carry the full team name, sized to fit rather than chopped. */
function endzoneName(t){
  const s=String(t).replace(/[^A-Za-z& ]/g,"").trim().toUpperCase();
  const n=s.length;
  const size = n<=6?8.2 : n<=9?6.8 : n<=12?5.6 : n<=15?4.7 : 4.0;
  return {t:s,size:size};
}
function venueLabelSize(v){
  const n=String(v).length;
  return n<=8?16 : n<=12?13 : n<=16?10.5 : 8.6;
}

function fieldSVG(g,drive,homeColor,awayColor,venue){
  const x=v=>17+(v/100)*166;
  const ball=drive?Math.max(0,Math.min(100,drive.ball)):50;
  const marks=[];
  for(let y=10;y<=90;y+=10)marks.push(`<line x1="${x(y)}" y1="9" x2="${x(y)}" y2="95"
    stroke="rgba(233,229,218,.26)" stroke-width="0.7"/>`);
  for(let y=5;y<=95;y+=5)marks.push(`<line x1="${x(y)}" y1="49" x2="${x(y)}" y2="55"
    stroke="rgba(233,229,218,.30)" stroke-width="0.6"/>`);
  const nums=[];
  [10,20,30,40,60,70,80,90].forEach(y=>{
    nums.push(`<text x="${x(y)}" y="26" fill="rgba(233,229,218,.24)" font-size="6.5"

function isBigGame(g,team,seaRankMap,rivalName){
  if(!g)return false;
  if(rivalName)return true;
  if(g.title||g.site)return true;
  const opp=g.home===team?g.away:g.home;
  if((seaRankMap[opp]||999)<=25)return true;
  if(g.margin<=7)return true;
  return false;
}

    else if(c.pass){ if(t<throwT){ bx=qb[0]; by=0.5 } else { const s=Math.min(1,(t-throwT)/(tEnd-throwT-0.08)); const tg=carrierAt(Math.min(1,runS+0.05)); bx=hlLerp(qb[0],tg[0],s); by=hlLerp(0.5,tg[1],s); z=Math.sin(Math.min(1,s)*Math.PI)*0.05 } }
    else{ const p=carrierAt(runS); bx=p[0]; by=p[1] }
    const off=OFF.map((p,i)=>{ let yd=c.los+p[0], y=p[1];
      if(t>snap){ if(i===0)return c.qbRun?carrierAt(runS):qb; if(c.pass&&i===c.rcv){ const q=carrierAt(runS); return q }
        if(!c.pass&&i===1){ return c.qbRun?[c.los-6,0.5+0.1]:carrierAt(runS) }
        if(c.kind==="fum"&&i===1&&t>c.reveal-0.12){ return carrierAt(Math.min(1,(c.reveal-0.12-snap)/(tEnd-snap))) }
        if(i>=6){ yd+=runS*1.5 } else if(i>=2){ yd+=runS*Math.min(18,c.len*0.7); y=hlLerp(y,0.5,runS*0.2) } }
      return [yd,y] });
    const def=DEF.map((p,i)=>{ let yd=c.los+p[0], y=p[1]; if(t>snap){ const k=i<4?0.15:0.45*runS; yd=hlLerp(yd,bx,k*0.6); y=hlLerp(y,by,k) } return [yd,y] });
    // a contested ball: the corner on the receiver's hip the whole way (round 70: Ian, too many blown coverages)
    if(c.pass&&c.tight&&t>snap&&c.kind!=="int"){ const j=c.rcv===2?7:8, q=carrierAt(runS), lag=0.9+0.6*Math.sin(runS*5); def[j]=[q[0]-lag,q[1]+(c.rcv===2?0.035:-0.035)] }
    // a fumble: the carrier is hit, the ball comes loose, a defender falls on it
    if(c.kind==="fum"&&t>c.reveal-0.12){ const hit=carrierAt(Math.min(1,(c.reveal-0.12-snap)/(tEnd-snap))), u=Math.min(1,(t-c.reveal+0.12)/0.3), j=c.rcv===2?5:6;
      bx=hit[0]+hlEase(u)*4.5; by=hit[1]+hlEase(u)*(hit[1]<0.5?0.07:-0.07)+Math.sin(u*9)*0.012; z=Math.abs(Math.sin(u*Math.PI*3))*0.012*(1-u); def[j]=[hlLerp(def[j][0],bx,Math.min(1,u*1.4)),hlLerp(def[j][1],by,Math.min(1,u*1.4))] }
    // a pick: the nearest defensive back jumps the route and takes it the other way
    if(c.kind==="int"&&t>throwT){ const tg=carrierAt(Math.min(1,runS+0.05)), j=c.rcv===2?7:8, s=Math.min(1,(t-throwT)/(tEnd-throwT));
      def[j]=[hlLerp(def[j][0],tg[0]+0.8,hlEase(s)),hlLerp(def[j][1],tg[1],hlEase(s))]; if(t>tEnd){ const u=(t-tEnd)/(1-tEnd); def[j]=[tg[0]+0.8-u*12,tg[1]]; bx=def[j][0]; by=def[j][1]; z=0 } }
    const r=Math.max(4.5,W/100), ink=c.inks[c.home?0:1], dink=c.inks[c.home?1:0];
    const tag=i=>t>snap&&((c.pass&&i===c.rcv)||(!c.pass&&i===1)||(c.pass&&i===0&&t<throwT))?["QB","RB","WR","WR"][i]:"";
    def.forEach((p,i)=>{ const [px,py]=P(W,H,c,p[0],p[1]); hlDot(x,px,py,r,dink,"rgba(0,0,0,.6)","",c.defN?{num:c.defN[i]}:null) });
    off.forEach((p,i)=>{ const [px,py]=P(W,H,c,p[0],p[1]); hlDot(x,px,py,r,ink,"rgba(0,0,0,.6)",tag(i),c.offN?{num:c.offN[i]}:null) });
    const [qx,qy]=P(W,H,c,bx,by); hlBall(x,qx,qy,r*0.55,z*W,null,{kind:"oval",fill:"#8A5428",ring:"#2a1406"});
    const top=`${c.ot?"Overtime":"Q"+c.q} \u00b7 ${c.tm} ball`;   // round 67: no "12 yards out" before it's done
    const te=c.kind==="fum"?c.reveal:tEnd;

    hlCaption(x,W,H,top,end,c.kind==="int"||c.kind==="fum"?dink:ink);
  }
  const headClock=c=>c&&c.hd||null;
  return {replaces:".field", collapseIdle:true, aspect:0.46, clips, pitch, idle, frame, headClock, goalsLabel:"Late touchdowns"};
})();
/* ============ game screens: football ============ */
/* How a football game looks while you watch it: the scoreboard, the drive
   log and drive script, the call screen with the staff's advice, and the
   field view. The core runs the live game (start, tick, answer, finish);
   the sport supplies these, by these names:
     liveScoreboard, driveWord, driveScript, liveView, liveCallView,
     watchView, startWatch */

function startWatch(g){
  if(!g||!SEA.roster)return;
  const drives=(g.drives&&g.drives.length)?g.drives:null;
  watch={g:g, script:drives?driveScript(g,drives):gameScript(g,SEA.roster[g.home],SEA.roster[g.away],watchSeed(g)),
         i:-1, paused:(S.watchStep===true)};
  reveal=null;
  tickWatch();
}

/* Turn the real drives into readable lines, using the actual rosters. */
function driveScript(g,drives){
  const rng=new RNG(watchSeed(g));
  const RH=SEA.roster[g.home], RA=SEA.roster[g.away];
  const OUTTXT={PUNT:["three and out","forced to punt","stalls out, punt","goes backwards, punt"],
                DOWNS:["turned over on downs"],MISS:["the field goal is no good"],   // a field goal: "the kick" read as a missed extra point (Grokbot)
                INT:["threw an interception"],FUM:["fumble, recovered by the defense"]};
  return drives.map(d=>{
    const off=d.home?RH:RA, def=d.home?RA:RH;
    const nm=i=>off&&off[i]?off[i].n:"the offense";
    const dn=i=>def&&def[i]?def[i].n:"the defense";
    let text;
    if(d.kind==="TD"){
      const y=Math.round(rng.range(2,64));
      text = rng.r()<0.56 ? `${nm(0)} ${y}-yd TD pass to ${nm(rng.r()<0.62?2:3)}`
           : rng.r()<0.8  ? `${nm(1)} ${y}-yd TD run`
                          : `${nm(0)} ${Math.round(rng.range(1,12))}-yd TD run`;
    } else if(d.kind==="FG"){ const r=Math.round(rng.range(19,52)); text=`${d.stall?fgDistance(d.stall):r}-yd field goal`; }   // the kick's own length (it was made up: 72 on one screen, 63 on another)
    else if(d.kind==="INT"){ text=`intercepted by ${dn(8)}`; }
    else if(d.kind==="FUM"){ text=`fumble, recovered by ${dn(7)}`; }
    else if(d.kind==="MISS"){ const r=Math.round(rng.range(38,56)); text=`${d.stall?fgDistance(d.stall):r}-yd attempt is no good`; }
    else { text=rng.pick(OUTTXT[d.kind]||["punt"]); }
    const sec=Math.max(5,Math.round(890-((d.n-1)%6+1)*140-rng.range(0,50)));
    return {n:d.n,q:d.q,clock:Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0"),
      team:d.home?g.home:g.away, pts:d.pts, outcome:d.kind, text:text,
      start:d.start, end:d.pts>0?100:Math.min(95,d.start+20),
      yards:d.pts>0?100-d.start:Math.max(0,20),
      ball: d.home ? 100-(d.pts>0?100:d.start+18) : (d.pts>0?100:d.start+18),
      h:d.h, a:d.a};
  });
}

function driveWord(d){
  // read after the team's name, so each says what the team did ("Florida State the kick is no good",
  // "Denver overtime": Grokbot); an overtime drive is told by how it ended
  if(d.note&&d.note!=="overtime")return d.note;
  if(d.kind==="TD")return "touchdown";
  if(d.kind==="FG")return "field goal";
  if(d.kind==="INT")return "threw an interception";   // after the team's name ("TCU intercepted" read as TCU's catch: Grokbot)
  if(d.kind==="FUM")return "fumbled, recovered by the defense";
  if(d.kind==="MISS")return "missed the field goal";
  if(d.kind==="DOWNS")return "turned over on downs";
  return "forced to punt";
}

/* their defense, in numbers: the scouting report before kickoff; per drive of yours after (round 35) */
function fbEvidenceHTML(g,my,dp){
  const opp=g.home===my?g.away:g.home;
  if(dp.k==="prep"){ const R=dp.report, n=dp.n||6;
    return `<div class="evid"><div class="evh">${esc(opp)}: their last ${n} games on defense</div>
      ${SCHEME_KEYS.map(k=>`<div class="evr"><span class="evk">${esc(SCHEMES[k].l)}</span><span class="evv">${R[k]} of ${n}</span></div>`).join("")}
      <div class="evn">Most defenses have a way they like to play, but not every week. Get it right and the week's work shows; get it wrong and your offense plays into their hands until you change it.</div>${splitNote(R)}</div>` }
  if(dp.k!=="read"||!dp.tell)return "";
  const T=dp.tell, D=dp.tell2, n=Math.max(1,T.n), per=x=>(x/n).toFixed(1);
  const rows=[["Blitzes","bl"],["Safeties sitting deep","sh"],["Extra men in the box","bx"]];
  return `<div class="evid"><div class="evh">How ${esc(opp)} are defending you <span>${D?`per drive | last ${D.n} drives`:"per drive of yours"}</span></div>

}

/* ---- after the game: were your calls the better percentage play? ----
   Each call (fourth down, two-point try, the late and half-time calls) is
   replayed from the moment you made it, with every answer, over the same
   stretch of luck many times, every later call left to the usual choice.
   The verdict: whether your answer won as often as the best one. */
let VERDICT_RUNS=1200;          // replays per answer
const VERDICT_SLACK=0.03;        // within this of the best answer: a good call (it's close)
const VERDICT_BASE={chase:"normal",protect:"keep",half:"normal",two:"kick",onside:"normal",defend:"normal"};
// the tally is reads, as in every game; calls are priced in wins in the ledger line (round 37)
function verdictDefault(dp){ const o=dp.opts.map(x=>x[0]);
  if(dp.k==="fourth")return dp.rolled&&o.indexOf(dp.rolled)>=0?dp.rolled:o.indexOf("punt")>=0?"punt":"kick";   // what the computer would have done (round 43)
  return o.indexOf(VERDICT_BASE[dp.k])>=0?VERDICT_BASE[dp.k]:o[o.length-1] }
function callVerdicts(args,seed,answers,meHome){
  const KINDS={fourth:1,two:1,chase:1,protect:1,half:1,onside:1,defend:1};
  // the game as played: which asks were which
  const asks=[]; { const e=makeLiveGame(new RNG(seed),...args); let i=0,g=0;
    while(g++<2000){ const r=e.next(); if(r.done)break;
      if(r.ask){ asks.push({dp:r.ask,mine:r.mine,theirs:r.theirs}); e.reply(answers[i]!==undefined?answers[i]:verdictDefault(r.ask)); i++ } } }
  const out=[]; let judged=0;
  asks.forEach((A,j)=>{
    if(!KINDS[A.dp.k]||answers[j]===undefined)return;
    judged++;
    const opts=A.dp.opts.map(x=>x[0]), rate={};
    opts.forEach(o=>{ let w=0;
      for(let m=0;m<VERDICT_RUNS;m++){
        const rng=new RNG(seed), e=makeLiveGame(rng,...args); let i=0,g=0,r;
        while(g++<2000){ r=e.next(); if(r.done)break;
          if(r.ask){ let v;
            if(i<j)v=answers[i];
            else if(i===j){ rng.f=mulberry32((seed^Math.imul(m+1,0x9E3779B1))>>>0); rng.sp=null; v=o }
            else v=verdictDefault(r.ask);
            e.reply(v); i++ } }
        w+=resultVal(r,meHome) }
      rate[o]=w/VERDICT_RUNS });
    const pick=answers[j], best=opts.reduce((a,o)=>rate[o]>rate[a]?o:a,opts[0]);
    const lab=o=>(A.dp.opts.find(x=>x[0]===o)||[o,o])[1].split(" · ")[0];
    const spread=rate[best]-Math.min(...opts.map(o=>rate[o]));
    // within 3 points the replays can't separate the options: listed, not graded, so a coin flip is never a
    // tick (Grokbot: "6 of 7 right" with coin flips counted; it was 2 points)
    const pct=o=>Math.round(rate[o]*100), shown=pct(best)-Math.min(...opts.map(pct));   // round 71: the gap the card shows, not the rounded raw gap (15.5 vs 11.5 showed as 15 v 12 and was graded)

  }
  nextGame(team){
    const g=this.gamesFor(team,this.step)[0];
    return g||null;
  }
}

/* The MVP race, and one All-Pro team across the whole league. */
extendSeason({
  _award(w,games){
    if(!this.roster)return;
    const played={}; games.forEach(g=>{played[g.winner]=1;played[g.loser]=1});
    NAMES.forEach(t=>{
      if(!played[t])return;                            // bye week
      const wp=this.rec[t][0]/Math.max(1,this.rec[t][0]+this.rec[t][1]);
      this.roster[t].forEach((pl,i)=>{
        if(!pl||!pl.st2||!pl.st2.g)return;
        const P=POS[i%POS.length];
        pl.st=pl.st2.g;
        // MVP voters want production on a winning team even more than Heisman voters
        pl.prod=statProd(P.p,pl.st2)*LEAGUE.awards.weights[P.p]*(0.55+wp*0.9);
      });
    });
  },
  mvpRace(n){
    if(!this.roster)return [];
    const all=[];
    NAMES.forEach(t=>this.roster[t].forEach((pl,i)=>{
      if(pl&&(pl.st||0)>=8)all.push({t:t,n:pl.n,p:pl.p,r:pl.r,c:pl.c,
        prod:pl.prod||0,line:statLine(pl.p,pl.st2),rec:this.rec[t][0]+"-"+this.rec[t][1]});
    }));
    // measured against the position: production over the typical production
    // of that position's best eight, then the voters' premium for the
    // position (LEAGUE.awards.premium). By raw production a quarterback won
    // every year (passing yards dwarf everything); real voters pick one about
    // nine years in ten.
    const scale={}, P=LEAGUE.awards.premium||{};
    [...new Set(all.map(x=>x.p))].forEach(p=>{const top=all.filter(x=>x.p===p).map(x=>x.prod).sort((a,b)=>b-a).slice(0,8);
      scale[p]=top.length?top.reduce((a,b)=>a+b,0)/top.length:1});
    all.forEach(x=>x.score=x.prod/Math.max(1e-9,scale[x.p])*(P[x.p]||1));
    all.sort((a,b)=>b.score-a.score);
    return all.slice(0,n||10);
  },
  allConference(){
    if(!this.roster)return [];
    return POS.map((P,i)=>{
      const best=NAMES.map(t=>({t:t,pl:this.roster[t][i]}))
        .sort((a,b)=>(b.pl.prod||0)-(a.pl.prod||0))[0];
      return {pos:P.p,team:best.t,n:best.pl.n,r:best.pl.r,c:best.pl.c};
    });
  },
  allConfAll(){return {ALL:this.allConference()}},
  awardTeam(my){return {group:"ALL",list:this.allConference()}}
});
LEAGUE.awards.teamLabel=()=>"All-Pro";

/* One entry per coach per season. Version 2 is league-neutral: everything the
   core reads has a name that means the same thing in any league, and what
   only one league understands lives under entry.league, written and read by
   that league alone.

    champion,                          league champion that year
    honours:{title, group, seed},      won it all / won your group / playoff seed
    group:{key, name, rec},            conference or division, and record in it
    bestWin:{opp, rank, score}|null,
    coach:{name, titles, seasons},
    -- written at the end of the season, absent from a hot-seat coach's
       early entry (written before the world moves on):
    miles, exp, program,
    teams:{team:[w,l,rank]}, top10, groupChamps:{group:team},
    seeds:{team:seed}, post:{team:[w,l]}, pnote:{team:line},
    awards:{mvp:[{n,p,t,r,c,line}], team:{group, list:[{pos,team,n,r,c}]}},

  const bestWin=myGames.filter(g=>g.winner===my)
    .sort((x,y)=>(x.home===my?(x.arank||999):(x.hrank||999))-(y.home===my?(y.arank||999):(y.hrank||999)))[0];

  // reads), on top of what you don't know: one spread for every team mocked the board's top names gone too often

/* ============ the recruiting board (college games) ============ */
/* A class fills the spots seniors leave. Before the offseason you see, for
   each position with an open spot, a few named prospects, drawn exactly as
   the game draws a freshman newcomer for your program (with your focus and
   recruiting budget). You rank the ones you want. Each open spot goes to
   your highest-ranked prospect there, if he commits; the better he is next
   to what your program usually lands, the harder he is to get. Miss, and you
   get the newcomer you'd have had anyway.
   The default newcomer is always drawn first, from the season's own dice, so
   every other program's class is exactly what it was without a board; the
   commitment rolls use their own dice. (Muse: recruiting was the biggest
   offseason chore, with no board.) */
const RB_PER_POS=4;           // prospects shown at each open position
function rbOpenSpots(my){
  const R=U.roster[my], out={};
  R.forEach((p,i)=>{ if(p&&p.c>=3){ const k=i%POS.length; (out[k]=out[k]||[]).push(p.n) } });
  return out;                  // position index -> the seniors leaving there
}
function rbStars(r){ return r>=82?5:r>=74?4:r>=64?3:2 }
/* the chance he commits: RB_LAND0 for a newcomer of the usual level, falling
   RB_LANDK per standard deviation above it (tuned in test/recruiting.js) */
const RB_LAND0=0.70, RB_LANDK=0.30;

/* the prospects at each open position, drawn with the league's own newcomer
   function (drawNewcomer) in this program's context and your choices: the
   same pool your newcomer comes from. Each from its own seed, so the list
   holds through the offseason. M, SD: what a newcomer there averages,
   measured from the same function. */
function rbPool(my,P){
  const open=rbOpenSpots(my), out=[], C=LEAGUE.offseason.recruitCtx(U,my,P||{});
  Object.keys(open).forEach(k=>{ const i=+k;
    const smp=new RNG(strHash(my+"|"+SEA.year+"|mean|"+i)), xs=[];
    for(let q=0;q<60;q++)xs.push(drawNewcomer(smp,C,i).r);
    const M=xs.reduce((a,b)=>a+b,0)/xs.length, SD=Math.sqrt(xs.reduce((a,b)=>a+(b-M)*(b-M),0)/xs.length);
    for(let j=0;j<RB_PER_POS;j++){

      out.push(Object.assign(x,{key:i+"|"+j, i:i, M:Math.round(M*10)/10, SD:Math.round(SD*10)/10, stars:x.star5?5:rbStars(x.r)})) } });
  return out;
}
/* at the commit: your board, as it stands with your final choices */
function rbChoices(my,P){

  return (P.rboard||[]).map(k=>by[k]).filter(Boolean);
}
/* in developRoster: the newcomer at position i, from your board if he commits */
function rbSign(board,t,year,i,np){

  const p=POS[i%POS.length].p, x=board.find(y=>!y.used&&y.p===p); if(!x)return np;
  x.used=true;

    // he takes the newcomer's place after the offseason's development (rbSettle):

/* at the end of developRoster: each signed prospect replaces the newcomer
   whose spot he took, developed by as much as that newcomer was */

  roster.forEach((np,k)=>{ if(!np||!np._rb)return; const x=np._rb; x.was=np._r0;   // the newcomer he replaced, as drawn
    const r=Math.round(Math.max(30,Math.min(99,x.r+(np.r-np._r0)))), pot=Math.round(Math.max(r,Math.min(99,x.pot+(np.pot-np._p0))));

    Object.keys(np).forEach(q=>{ if(!(q in pl)&&q[0]!=="_")pl[q]=np[q] });   // anything the offseason gave the newcomer (minutes, flags)

    if(arriving){ const a=arriving.indexOf(np); if(a>=0)arriving[a]=pl } });   // the class's record counts him, not the man he replaced

  // a recruit standing in for one takes the spot of the newcomer who filled it after him

    const later=arriving.filter(a=>a&&a!==np&&!a._rb&&!a.board&&a.i===np.i&&roster.indexOf(a)>=0).pop();
    if(!later){ x.got=false; x.to=null; return }

/* ============ players you care about ============ */
/* Your best players as people: how they're playing lately (form), where their

   milestones come from the box scores; the mood is a reading of the same

   The season notes each player's games as it plays them (noteGame), on its

const FORM_N=5;                                // games in the form line
function careerOf(pl,key){ return ((pl.car&&pl.car[key])||0)+((pl.st2&&pl.st2[key])||0) }
function milestoneSpec(pos){
  const M=(LEAGUE.classes&&LEAGUE.classes.length&&SPORT.milestonesCollege)||SPORT.milestones;
  return M&&M[pos]||null }
function nextMilestone(pl,pos){
  const M=milestoneSpec(pos); if(!M)return null;

}
/* one game for one player: form, and a milestone crossed. Called before the
   line is added to his season. */
function noteGame(sea,pl,pos,line,team){
  const one=Object.assign({g:1},line), v=statProd(pos,one);
  (pl.fm=pl.fm||[]).push(Math.round(v*10)/10); if(pl.fm.length>FORM_N)pl.fm.shift();
  const M=milestoneSpec(pos); if(!M||!line[M[0]])return;
  const before=careerOf(pl,M[0]), after=before+line[M[0]], hit=M[2].filter(x=>before<x&&after>=x).pop();
  if(hit)(sea.miles=sea.miles||[]).push({step:sea.step,n:pl.n,pos:pos,team:team,at:hit,key:M[0],label:M[1],r:pl.r});
}
/* hot, cold or neither: his last few games against his season so far */
function formOf(pl,pos){
  const s=pl.st2; if(!s||!s.g||s.g<FORM_N||!pl.fm||pl.fm.length<3)return null;
  const avg=statProd(pos,s)/s.g; if(avg<=0.5)return null;
  const recent=pl.fm.slice(-3).reduce((a,b)=>a+b,0)/3;
  return recent>=avg*1.35?"hot":recent<=avg*0.6?"cold":null;
}
function lastYear(pl){
  if(LEAGUE.classes&&LEAGUE.classes.length)return pl.c>=LEAGUE.classes.length-1?"senior":null;
  return pl.k&&pl.k.yrs<=1?"contract":null;
}
/* how he seems, from what's true of him */
function moodOf(pl,i,team){
  const R=SEA.roster[team], P=POS[i%POS.length].p, backup=i>=POS.length;
  const st=backup?R[i-POS.length]:null, f=formOf(pl,P), ly=lastYear(pl), run=streakOf(team);
  if(backup&&st&&pl.r>=st.r-2)return {t:"wants to start",tone:"no"};
  if(f==="hot")return {t:"flying",tone:"ok"};

  if(f==="cold")return {t:"searching for form",tone:"no"};

}

    return formOf(p,P)||moodOf(p,i,team).t!=="settled"||lastYear(p)||(nm&&nm.left<=Math.max(3,nm.at*0.15)) };

/* ---- shirt numbers (round 67: Ian, "not easy to identify the players"; Football Manager numbers its dots) ----
   Each player's number is fixed by his name and team and kept unique on the roster: starters choose first, in roster

   in that range. Nothing is drawn from the game's dice and nothing is saved: the same roster numbers the same way. */
const SHIRT_RANGE={
  soccer:{GK:{l:[1,13,31]},CB:{l:[5,4,6,15,23]},FB:{l:[2,3,12,22,24]},CM:{l:[8,14,16,25,26]},W:{l:[7,11,17,19,21]},ST:{l:[9,10,18,20,27]}},

  hockey:{G:{l:[30,31,35,1,29,40,33]}}

function shirtNo(team,idx){
  const R=SEA&&SEA.roster&&SEA.roster[team]; if(!R||!R[idx])return null;
  const key=team+"|"+R.map(p=>p?p.n:"").join(","); let M=_SHIRT[team];
  if(!M||M.key!==key){ M=_SHIRT[team]={key:key,no:{}}; const used={}, sp=(typeof SPORT!=="undefined"&&SHIRT_RANGE[SPORT.id])||{};
    const order=R.map((p,i)=>i).filter(i=>R[i]).sort((a,b)=>(a<POS.length?0:1)-(b<POS.length?0:1)||a-b);
    order.forEach(i=>{ const pos=POS[i%POS.length].p, rg=sp[pos], h=strHash(team+"|"+R[i].n); let n=null;
      if(rg&&rg.l){ n=rg.l.find(v=>!used[v]); if(n===undefined)n=null }   // a list of numbers: the first free

        for(let k=0;k<100&&n==null;k++){ const v=lo+((h+k*7)%span); if(!used[v])n=v }
        if(n==null&&rg&&rg.length>=4){ const lo2=rg[2], sp2=rg[3]-rg[2]+1; for(let k=0;k<100&&n==null;k++){ const v=lo2+((h+k*7)%sp2); if(!used[v])n=v } }

/* Between plays only, never on a call (it can't become a calculator for the options). From the score, the time left

   this wrapper counts the stretches each engine hands back and sets the side's plan before the one it names. */
function setLivePlan(e,side,plan){
  if(!e||!plan)return;
  if(e.mode&&typeof e.mode==="object")e.mode[side]=plan;
  if("aggrH" in e){ e[side==="home"?"aggrH":"aggrA"]=plan; e[side==="home"?"baseH":"baseA"]=plan }
}
if(typeof makeLiveGame==="function"){ const _mlg=makeLiveGame;
  makeLiveGame=function(rng,eH,eA,pH,pA,humans,knock,ctx,pm){
    const e=_mlg(rng,eH,eA,pH,pA,humans,knock,ctx); if(!pm)return e;
    let n=0; const nx=e.next;
    e.next=function(){ for(let i=0;i<pm.length;i++)if(pm[i][0]===n)setLivePlan(e,pm[i][1],pm[i][2]);
      const r=nx.apply(e,arguments); if(r&&!r.done&&!r.ask&&r.drive)n++; return r };
    return e } }

function cardFit(text, max, size){

}

/* The same season as a line of text, for anywhere an image won't go. */
function seasonCardText(h, team){
  const c={conf:h.group.name, confRec:h.group.rec, bestWin:h.bestWin, coach:h.coach.name};
  const bits=[`${team} ${h.rec} (${c.confRec} ${c.conf})`];
  if(h.champion===team)bits.push(LEAGUE.text.champions.toUpperCase());
  else if(h.honours.group)bits.push(`${c.conf} champions`);
  else if(h.pos)bits.push(h.result);
  else if(h.rank)bits.push(`finished No. ${h.rank}`);
  if(LEAGUE.cardLine){ const x=LEAGUE.cardLine(h,team); if(x)bits.push(x) }   // a league's own honour (soccer: the FA Cup)
  if(c.bestWin)bits.push(`beat ${c.bestWin.rank?"No. "+c.bestWin.rank+" ":""}${c.bestWin.opp} ${c.bestWin.score}`);
  return `${c.coach}, ${h.year}. ${bits.join(" \u2014 ")}. ${LEAGUE.text.site}`;
}

/* Rasterise the SVG to a PNG blob so it can be shared or saved as a real image. */
function cardBlob(svg){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
    img.onload=()=>{
      try{
        const cv=document.createElement("canvas");
        cv.width=CARD_W; cv.height=CARD_H;
        const cx=cv.getContext("2d");
        cx.fillStyle="#10131C"; cx.fillRect(0,0,CARD_W,CARD_H);
        cx.drawImage(img,0,0,CARD_W,CARD_H);
        cv.toBlob(b=>b?resolve(b):reject(new Error("no blob")),"image/png");
      }catch(e){reject(e)}
    };
    img.onerror=()=>reject(new Error("svg load failed"));
    img.src=url;
  });
}

async function shareCard(h, team){
  const svg=seasonCardSVG(h,team);
  const txt=seasonCardText(h,team);
  const name=`${team.replace(/[^A-Za-z]/g,"")}-${h.year}.png`;
  try{
    const blob=await cardBlob(svg);
    const file=new File([blob],name,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],text:txt});
      return "shared";
    }
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    return "saved";
  }catch(e){
    try{ await navigator.clipboard.writeText(txt); return "copied" }
    catch(_){ return "failed" }
  }
}

/* ============ the season story (round 41) ============
   What a career remembers beyond its records (Muse: the Film Room, rivals, comebacks; Instinct: make the peak a peak).
   All of it is written from games already played and kept in the save, per coach (COACH_FIELDS):
     S.film      your biggest calls, career-long: the best and the costliest, by their worth against the assistant
     S.lifeCalls every call you made differently from the assistant, career-long: count, worth, bold or careful
     S.storyYr   this season's comeback and collapse (banked into the season's history entry, then cleared)
     S.rivals    each opposing head coach you've met: your record against him, at which clubs
   None of it moves a game. */

const STORY_ON=true;
const STORY_TH={football:10,basketball:12,hockey:2,soccer:2};          // a comeback worth remembering: down this many
const STORY_BOLD={push:1,go:1,attack:1,win:1,early:1,two:1,onside:1,pressure:1,swap:1,force:1};
const STORY_SAFE={sit:1,hold:1,point:1,punt:1,kick:1,prevent:1,late:1,rest:1};
const FILM_KEEP=30;                                                      // the best thirty and the costliest thirty (the room shows a varied few)

function storyScore(d){ return d.sh!==undefined?[d.sh,d.sa]:[d.h,d.a] }
function storyGameLabel(step){ try{ return LEAGUE.daily&&LEAGUE.dates&&LEAGUE.dates[step]?LEAGUE.dates[step]:typeof wkLabel==="function"?wkLabel(step):"" }catch(e){ return "" } }

/* after a played game: the film, the ledger of style, and the night's comeback or collapse */
function recordStory(played,g,step,meHome){
  if(!STORY_ON||!played||!S)return;
  const my=S.myTeam, opp=played.other, ha=typeof haWord==="function"?haWord(g,my):(meHome?"vs":"at"),
    wk=storyGameLabel(step), yr=SEA.year, po=SEA.phase!=="week"||!!g.title;
  // the film: graded situation calls only (a "close either way" call is no story; a read is judged right or wrong on
  // its card, and judging it again here against the assistant could disagree: round 39's one-verdict rule)
  const RK={}; (played.reads||[]).forEach(r=>{ RK[r.k]=1 });
  (played.impact||[]).forEach(c=>{ if(c.k&&RK[c.k])return;
    const k=typeof callClarity==="function"?callClarity(c):Math.round(c.worth*100);
    if(Math.abs(k)<4||!Number.isFinite(c.worth))return;
    (S.film=S.film||[]).push({y:yr,wk:wk,opp:opp,ha:ha,mine:played.mine,theirs:played.theirs,h:c.h,pick:c.pick,def:c.def,dd:c.dd,
      w:Math.round(k),po:po,title:g.title||null,team:my,k:c.k||null});   // the card's own measure (football's graded calls: against the best option)
  });
  // the season's "what if" (round 49): each call made your own way, with how the same night ends on your assistant's
  // call (the same dice). Kept per season, the three that diverged most; shown at the season's end.
  (played.impact||[]).forEach(c=>{ if(c.k&&RK[c.k])return; if(!c.cf||!Number.isFinite(c.worth))return;
    const k=typeof callClarity==="function"?callClarity(c):Math.round(c.worth*100);
    const W=(S.whatIf=S.whatIf||{})[yr]=(S.whatIf[yr]||[]);
    W.push({wk:wk,opp:opp,ha:ha,mine:played.mine,theirs:played.theirs,cm:c.cf.mine,ct:c.cf.theirs,h:c.h,pick:c.pick,def:c.def,dd:c.dd,w:Math.round(k),po:po});
    W.sort((a,b)=>whatIfRank(b)-whatIfRank(a)); W.length=Math.min(W.length,3) });
  if(S.film&&S.film.length>FILM_KEEP*2){ const F=S.film.slice().sort((a,b)=>b.w-a.w);
    S.film=F.slice(0,FILM_KEEP).concat(F.slice(-FILM_KEEP)).filter((x,i,a)=>a.indexOf(x)===i) }
  // the style: bold or careful, and what each has been worth
  (played.impact||[]).forEach(c=>{ if(!Number.isFinite(c.worth))return;
    const L=S.lifeCalls=S.lifeCalls||{n:0,w:0,bold:0,safe:0,boldW:0,safeW:0};
    L.n++; L.w=Math.round((L.w+c.worth)*1000)/1000;
    if(STORY_BOLD[c.pk]){ L.bold++; L.boldW=Math.round((L.boldW+c.worth)*1000)/1000 }
    else if(STORY_SAFE[c.pk]){ L.safe++; L.safeW=Math.round((L.safeW+c.worth)*1000)/1000 } });
  // the night's shape: how far behind you were, how far ahead
  let down=0, up=0; (played.drives||[]).forEach(d=>{ const s=storyScore(d); if(!s||s[0]===undefined)return;
    const m=meHome?s[0]-s[1]:s[1]-s[0]; if(-m>down)down=-m; if(m>up)up=m });
  const th=STORY_TH[(typeof SPORT!=="undefined"&&SPORT.id)||"football"]||10, won=played.mine>played.theirs, lost=played.mine<played.theirs;
  const Y=(S.storyYr=S.storyYr||{})[yr]=(S.storyYr[yr]||{});
  const one={wk:wk,opp:opp,ha:ha,mine:played.mine,theirs:played.theirs,po:po};
  if(down>=th&&(won||(LEAGUE.draws&&!lost&&down>=th))&&(!Y.cb||down>Y.cb.by))Y.cb=Object.assign({by:down,won:won},one);
  if(up>=th&&lost&&(!Y.cl||up>Y.cl.by))Y.cl=Object.assign({by:up},one);
  // the live chance at its lowest and highest (round 48, Muse: "You were at 7% in Blacksburg and won anyway" is a
  // sentence a player keeps; round 41 wanted it and had no live chance to quote)
  const ext=storyExtremes(played,meHome,opp);
  if(ext){ if(won&&ext.lo<=0.12&&(!Y.cbw||ext.lo<Y.cbw.lo))Y.cbw=Object.assign({lo:ext.lo},one);
    if(lost&&ext.hi>=0.88&&(!Y.clw||ext.hi>Y.clw.hi))Y.clw=Object.assign({hi:ext.hi},one) }
}
function storyExtremes(played,meHome,opp){
  if(typeof liveChance!=="function"||typeof LIVE_WP_ON==="undefined"||!LIVE_WP_ON||!played.drives||!played.drives.length)return null;
  let pre; try{ pre=LEAGUE.wdl?withPlan("balanced",()=>LEAGUE.wdl(S.myTeam,opp,meHome,false)):[winProb(S.myTeam,opp,meHome,false),0] }catch(e){ return null }
  const sig=LIVE_SIG[LEAGUE.id]||10; let lo=1, hi=0;
  played.drives.forEach((d,i)=>{ if(i===played.drives.length-1)return; const sc=liveScore(d); if(sc[0]===undefined)return;
    const m=meHome?sc[0]-sc[1]:sc[1]-sc[0], poss=d.q!==undefined?(d.home===meHome?-1:1):0, c=liveChance(m,liveTau(d),pre,sig,poss), v=c[0]+c[1]/2;
    if(v<lo)lo=v; if(v>hi)hi=v });
  return {lo:lo,hi:hi};
}

/* what your assistant would have done, in the same words everywhere (round 50: "Keep your setup" against "he would have left
   things as they were" read as one action, and "kept to his plan" never named the plan: Instinct, Muse). From the replay
   on the same dice when the engine says (dd); else his option, when it names an action; else nothing invented. */
function assistantSaid(c){
  if(c.dd)return c.cf?` On the same night your assistant ${esc(c.dd)}.`:` Your assistant ${esc(c.dd)}.`;
  const d=filmDef(c.def); if(d&&!/assistant/i.test(c.def||""))return ` Your assistant would have gone with ${esc(d)}.`;
  return "" }
/* the match card's own word for a call, so the season's showcases speak in it (round 50: one ledger) */
function verdictWord(k){ return k>7?"clearly better than your assistant's":k>3?"a little better than your assistant's":k<-7?"clearly worse than your assistant's":k<-3?"a little worse than your assistant's":"close either way" }
/* how far the road not taken diverged: a different result on the same night first, then by how much the score
   moved and how clear the call was over many replays */
function whatIfRank(x){ const r=(a,b)=>a>b?1:a<b?-1:0, flip=r(x.mine,x.theirs)!==r(x.cm,x.ct);
  return (flip?100:0)+Math.abs((x.mine-x.theirs)-(x.cm-x.ct))*(typeof SPORT!=="undefined"&&(SPORT.id==="hockey"||SPORT.id==="soccer")?6:1)+Math.abs(x.w)/2 }
const WHATIF_ON=true;
function whatIfHTML(){
  if(!WHATIF_ON||!S||!SEA||SEA.phase!=="done")return "";
  // a road that went somewhere: the result flips on his call, or the match itself graded the call (round 50: a close call
  // whose replay changed only the score, "3-2 instead of 5-2", deflated the idea: Muse)
  const res=(a,b)=>a>b?"win":a<b?(LEAGUE.draws?"defeat":"loss"):"draw";
  const all=(S.whatIf&&S.whatIf[SEA.year])||[], W=all.filter(x=>res(x.mine,x.theirs)!==res(x.cm,x.ct)||Math.abs(x.w)>3);
  const head=`<div class="grouphead">What if</div>`;
  // empty, it says why (Instinct looked on five screens and found nothing: the feature shouldn't need hunting)
  if(!W.length)return head+`<div class="note">${all.length?"None of your own calls this season changed a result on your assistant's road, and none stood out over many replays.":"No call of yours to replay this season: reads are judged right or wrong on their own cards, and calls you left to your assistant have no other road."} Each season keeps up to three.</div>`;
  const row=x=>{ const flip=res(x.mine,x.theirs)!==res(x.cm,x.ct), k=x.w;
    // the night first, then the replays, and the lens named: what one night did is not what the call is worth
    const night=`The same night replayed on his call: ${x.cm}&ndash;${x.ct}${flip?`, a ${res(x.cm,x.ct)} instead of your ${res(x.mine,x.theirs)}`:""}.`;
    const lens=Math.abs(k)<=3?` In the match this call was graded close either way: over many replays the two win about as often, so this night the dice decided it.`
      :` In the match it was graded ${verdictWord(k)}${flip&&((k>0)!==(res(x.mine,x.theirs)==="win"))?`, whatever this night did`:""}.`;
    return `<div class="film ${k>3?'up':k<-3?'dn':''}"><div class="filmh">${esc(x.h)}</div>
    <div class="filmm">${x.wk?esc(x.wk)+" &middot; ":""}${esc(x.ha)} ${esc(x.opp)} &middot; ${res(x.mine,x.theirs).toUpperCase()} ${x.mine}&ndash;${x.theirs}</div>
    <div class="filmb">You: ${esc(x.pick)}.${assistantSaid({dd:x.dd,def:x.def,cf:1})} ${night}${lens}</div></div>` };
  return head+`<div class="note">${W.length===1?"The call":`The ${W.length===2?"two":"three"} calls`} this season where your assistant's road went furthest from yours: each night replayed on the same dice with his call instead.</div>`+W.map(row).join("");
}
/* the season banked: its comeback and collapse go into its history entry, and the head-to-head with each coach */
function bankStory(entry){
  if(!STORY_ON)return;
  const yr=SEA.year;
  if(S.storyYr&&S.storyYr[yr]&&(S.storyYr[yr].cb||S.storyYr[yr].cl||S.storyYr[yr].cbw||S.storyYr[yr].clw))entry.story=JSON.parse(JSON.stringify(S.storyYr[yr]));
  if(S.storyYr){ Object.keys(S.storyYr).forEach(y=>{ if(+y<=yr)delete S.storyYr[y] }) }
  if(S.whatIf){ Object.keys(S.whatIf).forEach(y=>{ if(+y<yr)delete S.whatIf[y] }) }   // only this season's reel is shown
  // every game you coached this season, against whoever was coaching the other side when it ended
  const my=S.myTeam, seen=new Set(), G=[].concat(...SEA.weeks.map(w=>w.games||[]));
  if(typeof SEA.postPools==="function"){ try{ G.push(...[].concat(...SEA.postPools())) }catch(e){} }
  G.forEach(x=>{ if(!x||seen.has(x)||x.hp===undefined||(x.home!==my&&x.away!==my))return; seen.add(x);
    const opp=x.home===my?x.away:x.home, c=U.coach&&U.coach[opp]; if(!c||c.interim||!c.n)return;
    const R=(S.rivals=S.rivals||{})[c.n]=(S.rivals[c.n]||{w:0,l:0,d:0,teams:{},mine:{}});
    const ms=x.home===my?x.hp:x.ap, os=x.home===my?x.ap:x.hp;
    if(x.winner===my||(x.winner===undefined&&ms>os))R.w++; else if(x.winner===opp||ms<os)R.l++; else R.d++;
    R.teams[opp]=1; R.mine[my]=1; R.last=yr });
}

/* your rival: the coach you've met most (four meetings at least), the closer record breaking ties */
function rivalName(){
  const R=S.rivals||{}; let best=null, bk=-1;
  Object.keys(R).forEach(n=>{ const r=R[n], g=r.w+r.l+r.d; if(g<4)return;
    const k=g*10-Math.abs(r.w-r.l); if(k>bk){bk=k;best=n} });
  return best;
}
/* the line before a game against a coach you've met before (round 41: a rivalry follows both of you between jobs) */
function rivalLine(opp){
  if(!STORY_ON)return "";
  const c=U&&U.coach&&U.coach[opp]; if(!c||c.interim||!S.rivals||!S.rivals[c.n])return "";
  const r=S.rivals[c.n], g=r.w+r.l+r.d; if(g<2)return "";
  const elsewhere=Object.keys(r.teams).filter(t=>t!==opp), mineElse=Object.keys(r.mine||{}).filter(t=>t!==S.myTeam);
  const where=elsewhere.length?` (and with ${elsewhere.slice(0,2).map(esc).join(" and ")})`:"";
  const youWhere=mineElse.length?`, some of it at ${mineElse.slice(0,2).map(esc).join(" and ")}`:"";
  const tag=rivalName()===c.n?`<b class="rivtag">Your rival</b> `:"";
  return `<div class="series">${tag}${esc(c.n)}, their coach: <b>${r.w}-${LEAGUE.draws?r.d+"-":""}${r.l}${!LEAGUE.draws&&r.d?"-"+r.d:""}</b> against him${youWhere}${where}.</div>`;
}

/* on a call: the last time the Film Room kept one like it (round 47, Muse: "memory that changes the week": the room
   remembered your fourth-and-2, the staff never mentioned it the next time the same call came up). Same heading, this
   team; the most recent. Shown as evidence, beside the staff, before you choose. */
function filmMemoryHTML(dp){
  if(!STORY_ON||!FILMPRE_ON||!S.film||!dp||!dp.h)return "";
  const F=S.film.filter(x=>x.h===dp.h&&(x.team===undefined||x.team===S.myTeam)).reverse().sort((a,b)=>b.y-a.y)[0]; if(!F)return "";
  const res=`${F.mine>F.theirs?"W":F.mine<F.theirs?"L":"D"} ${F.mine}&ndash;${F.theirs}`, alt=filmDef(F.def)||"his call";
  return `<div class="filmmem"><b>The Film Room remembers:</b> ${F.y}${F.wk?" &middot; "+esc(F.wk):""}, ${esc(F.ha)} ${esc(F.opp)} (${res}), the same call. ${/assistant/i.test(F.pick)?"You left it to your assistant":"You went with "+esc(F.pick)}, and it was ${F.w>7?"clearly better than":F.w>0?"a little better than":F.w<-7?"clearly worse than":"a little worse than"} ${esc(alt)}. Tonight is its own game.</div>`;   // in words: no number on tonight's options (Ian)
}

/* the career's count of calls made your own way, and their worth (round 71: the Film Room's count fell across an offseason,

function careerCalls(keep){
  if(S.callCareer)return S.callCareer;
  const L=S.lifeCalls||{n:0,w:0}, CL=S.callLedger||{}, ys=Object.keys(CL), ln=ys.reduce((t,y)=>t+(CL[y].n||0),0),
    lw=Math.round(ys.reduce((t,y)=>t+(CL[y].worth||0),0)*1000)/1000, C=ln>=(L.n||0)?{n:ln,w:lw}:{n:L.n||0,w:L.w||0};

/* who you are, in one line, once there's enough to say it (Muse: "a gambler who won his gambles") */
function identityLine(){

  const C=careerCalls(false), n=C.n, w=C.w;

  const a=Math.abs(w), say=a<0.25?"about even":`about ${w>0?"+":"−"}${a<1?Math.round(a*10)/10:Math.round(a*2)/2} win${a>=0.75&&a<1.25?"":"s"}`;

/* the assistant's call, by name: "Play it straight, as your assistant would" was hidden for saying "assistant", so

function filmDef(d){ if(!d)return ""; const t=String(d).replace(/,?\s*(as|like|what) your assistant (would|does)[^.]*$/i,"").trim();

function filmRoomHTML(){

  const vary=(L,n)=>{ const c={}, out=[]; L.forEach(x=>{ const k=String(x.h).replace(/\d+/g,"#"); if(out.length<n&&(c[k]=(c[k]||0)+1)<=2)out.push(x) }); return out };

/* Soccer: the night it's settled (round 45). A title, automatic promotion or relegation is decided when nobody can

   Checked whenever the team page is drawn; kept per season with the step it happened at. Ties on points count
   against a clinch (goal difference could still go either way). */
const CLINCH_ON=true;
function clinchCheck(my){
  if(!CLINCH_ON||!LEAGUE.draws||typeof DIVS==="undefined"||typeof LEAGUE.points!=="function"||!SEA||(SEA.phase!=="week"&&SEA.step!==LEAGUE.weeks))return null;   // the last day too
  const d=CONF[my], R=DIVS[d]; if(!R)return null;
  const C=S.clinch&&S.clinch.year===SEA.year&&S.clinch.team===my?S.clinch:(S.clinch={year:SEA.year,team:my,k:{}});
  const div=NAMES.filter(t=>CONF[t]===d), P=t=>LEAGUE.points(t,SEA);
  const done=SEA.half?SEA.step:SEA.step-1;   // the step just played (a cup week's league half doesn't move the step on)
  const rem=t=>SEA.sched.filter(g=>!g.cup&&g.week>done&&g.week<LEAGUE.weeks&&(g.home===t||g.away===t)).length;
  const mine=P(my), myMax=mine+3*rem(my), others=div.filter(t=>t!==my), left=rem(my);
  const step=done;
  if(!C.k.title&&others.every(t=>P(t)+3*rem(t)<mine))C.k.title={step:step,left:left};
  if(R.up&&!C.k.title&&!C.k.up&&others.filter(t=>P(t)+3*rem(t)>=mine).length<R.up)C.k.up={step:step,left:left};
  if(R.down&&!C.k.down&&others.filter(t=>P(t)>myMax).length>=div.length-R.down)C.k.down={step:step,left:left};
  return C;
}
function clinchText(k,x,my){

  return k==="title"?{h:"Champions",l:`${esc(my)} are ${esc(name)} champions${spare}. Nobody can catch you now.${DIVS[CONF[my]].up?" Promotion with it.":""}`}
    :k==="up"?{h:"Promoted",l:`${esc(my)} are going up${spare}: a top-${DIVS[CONF[my]].up} finish in ${esc(typeof divThe==="function"?divThe(CONF[my]):name)} can't be taken off you.`}
    :{h:"Relegated",l:`It's done: ${esc(my)} can't climb out of the bottom ${DIVS[CONF[my]].down} now${spare}.`};
