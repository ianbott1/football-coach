/* Pearl is a dog roughly one time in six. Unlike the Bears, her advice
   survives it — the dog bit wraps the read rather than replacing it, so you
   never lose the balanced opinion just because a squirrel went past. */
const PEARL_BEFORE=[`Woof! `,`SQUIRREL. `,`Ooh, ooh, ooh! `,
  `Was that the treat bag? ... Anyway. `,`Someone's at the door! ... No. False alarm. `];
const PEARL_AFTER=[` Woof!`,` (Tail going. Very hard.)`,` Can we go outside after?`,
  ` Also, is it dinner? It smells like dinner.`,` I'm going to spin in a circle about this.`,
  ` Ball. BALL. Sorry \u2014 the actual ball. Carry on.`];
function pearlSay(line, seed){
  const n=Math.abs(seed|0);
  if(n%6!==1)return line;
  return (n%12===1)
    ? PEARL_BEFORE[Math.floor(n/6)%PEARL_BEFORE.length]+line
    : line+PEARL_AFTER[Math.floor(n/6)%PEARL_AFTER.length];
}

function bearYell(kind, seed){
  const n=Math.abs(seed|0);
  // roughly one call in four, they lose the thread entirely
  if(n%4===2){
    const d=BEAR_YELL.distracted;
    return d[Math.floor(n/4)%d.length];
  }
  const pool=BEAR_YELL[kind]||BEAR_YELL.fourth;
  return pool[n%pool.length]||"We have a feeling about this one. A big feeling.";   // never a blank line
}

function staffTake(dp, ctx){
  const opts = dp.opts.map(o=>o[0]);
  const has = k=>opts.indexOf(k)>=0;
  const pct = k=>{
    const o=dp.opts.find(x=>x[0]===k); if(!o)return null;
    const m=o[1].match(/(\d+)%/); return m?+m[1]:null;
  };
  const diff = (ctx.mine||0)-(ctx.theirs||0);
  const seed = (ctx.mine||0)*7+(ctx.theirs||0)*3+(ctx.q||0);
  const R=[];

  if(dp.k==="fourth"){
    const go=pct("go")||0, kick=pct("kick");
    // Anacondish: the points are worth it only if the kick is actually makeable
    const mid = (kick!==null && kick>=52) ? "kick"
              : (go>=48 ? "go" : (has("punt")?"punt":"kick"));
    // L: a long kick is a risk too. She wants the safest available outcome.
    const safe = (kick!==null && kick>=58) ? "kick"
               : (has("punt") ? "punt" : (kick!==null ? "kick" : "go"));
    R.push({who:"bears", pick:"go",
      line:bearYell(kick!==null?"fourthKick":"fourthPunt", seed)});
    R.push({who:"pearl", pick:mid, line:pearlSay(mid==="kick" ? `${kick}% for three points! I'll take three points.`
      : mid==="go"  ? (diff<0 ? `We're behind. We need points, not a punt. Let's go for it!`        // from the situation, not one canned line (it said "brilliant all day" on drive 1)
                     : (ctx.q||0)<=4 ? `It's early, and they've earned a shot. ${go}% to convert: let's go!`
                     : go>=60 ? `${go}% to convert? I'll take those odds every time!`
                     : `They've moved it well. Let them finish the drive!`)
      :               `Nothing lovely on offer here. Give it back and go get it again.`,seed)});
    R.push({who:"capy", pick:safe, line:
      safe==="punt" ? (kick!==null
          ? `It seems to me ${kick}% is rather more of a wish than a plan. I'd punt.`
          : `That is, I do believe, simply too far. Give it back and defend.`)
      : safe==="kick" ? `I do believe ${kick}% is about as comfortable as we're likely to get.`
      :                 `I'm not enthusiastic, but nothing safer appears to be on offer.`});
  }
  else if(dp.k==="two"){
    R.push({who:"bears", pick:"two", line:bearYell("two",seed)});
    R.push({who:"pearl", pick: (diff+7)===1||(diff+7)===-1 ? "two":"kick", line:pearlSay((diff+7)===1||(diff+7)===-1 ? `One point either way is agony! Let's just settle it.`
                                  : `The kick keeps it simple, and simple is lovely.`,seed)});
    R.push({who:"capy", pick:"kick", line:`A missed conversion would be, I fear, one more thing to worry about.`});
  }
  else if(dp.k==="chase"){
    R.push({who:"bears", pick:"push", line:bearYell("chase",seed)});
    R.push({who:"pearl", pick: diff<=-4 ? "push":"normal", line:pearlSay(diff<=-4
      ? `More than a field goal down \u2014 come on, let's go and get it!`
      : `It's one score! We've got time. No need to panic.`,seed)});
    R.push({who:"capy", pick:"normal", line:`One rather suspects each additional risk compounds against us. Stay measured.`});
  }
  else if(dp.k==="protect"){
    R.push({who:"bears", pick:"keep", line:bearYell("protect",seed)});
    R.push({who:"pearl", pick:"keep", line:pearlSay(diff>=13
      ? `We're playing so well! Let's just keep playing.`
      : `Whatever we did to get here \u2014 more of that, please.`,seed)});
    R.push({who:"capy", pick:"sit", line:`I would gently suggest fewer possessions. Fewer possessions, fewer catastrophes.`});
  }
  else if(dp.k==="half"){
    const down = diff<0;
    R.push({who:"bears", pick: down?"push":"normal", line:bearYell("half",seed)});
    R.push({who:"pearl", pick:"normal", line:pearlSay(down
      ? `They're not playing badly! Let's just play a bit better.`
      : `This is going great. Exactly as we are, please.`,seed)});
    R.push({who:"capy", pick: down?"normal":"sit", line: down
      ? `If I may \u2014 panicking at this juncture tends to worsen the scoreline, not mend it.`
      : `We have, I think, got what we came for. I'd rather not risk anybody now.`});
  }
  return R;
}

/* A line for the moments outside a game. */
function staffAside(kind, data){
  const L={
    depth:[["bears",`Play the kid. Chaos is a ladder.`],
           ["pearl",`He's waited so patiently for this. Let him play!`],
           ["capy",`It seems to me changing the quarterback mid-season rarely goes as people imagine.`]],
    staff:[["bears",`SACK HIM. On the field. In front of everyone.`],
           ["pearl",`Everyone has bad seasons. Maybe he just needs a bit of help.`],
           ["capy",`I do believe I'd want to be very sure before we start pulling things apart.`]],
    win:  [["bears",`WE ARE UNSTOPPABLE. Say it back to us.`],
           ["pearl",`I'm SO proud of them. Every single one.`],
           ["capy",`Lovely. Though I am, I confess, already a little worried about next week.`]],
    loss: [["bears",`Rigged. Absolutely rigged. We're appealing.`],
           ["pearl",`It's alright! There's another one next week.`],
           ["capy",`I did rather have a feeling. I didn't want to say.`]],
    title:[["bears",`RINGS. RINGS FOR THE BEARS. We did most of it.`],
           ["pearl",`Look at them all crying. It's the loveliest thing.`],
           ["capy",`Champions. I have, I should say, prepared some remarks. They are quite long.`]]
  };
  const set=L[kind]; if(!set)return null;
  const i=Math.abs((data|0))%set.length;
  return {who:set[i][0], line:set[i][1]};
}

/* ============ watching a game ============ */
/* Reconstructs a full drive chart that adds up to the real final score, using
   the actual players on both rosters. Seeded from the game itself, so it never
   touches the season's RNG. */

/* Break a final score into plausible scoring plays. Safeties are only used when
   the number genuinely can't be reached any other way (2, 4 and 5 points). */
const BAD_REMAINDER=new Set([1,2,4,5]);

function scoreParts(P,rng){
  if(P===0)return [];
  if(P===2)return [2];
  if(P===4)return [2,2];
  if(P===5)return [2,3];
  const out=[]; let left=P, guard=0;
  while(left>0&&guard++<40){
    const opts=[];
    if(left>=7){opts.push(7,7,7,7,7,7)}                // touchdowns carry the load
    if(left>=6&&rng.r()<0.12){opts.push(6)}            // missed extra point
    if(left>=3){opts.push(3,3,3)}
    if(left>=8&&rng.r()<0.055){opts.push(8)}           // a two-point try by choice
    let ok=opts.filter(v=>{const r=left-v; return r===0||!BAD_REMAINDER.has(r)});
    if(!ok.length&&left>=8)ok=[8];                     // 8 is the only way out of 8
    if(!ok.length){                                    // forced into a safety
      if(left===1&&out.length){out[out.length-1]+=1;break}
      out.push(left>=2?2:left); left-=2; continue;
    }
    const v=ok[rng.int(ok.length)];
    out.push(v); left-=v;
  }
  return out;
}

const PUNT_LINES=["three and out","forced to punt","stalls out, punt",
  "goes backwards, punt","can't move it, punt"];

function scoreText(rng,off,def,pts){
  const nm=i=>off&&off[i]?off[i].n:"the offense";
  const dn=i=>def&&def[i]?def[i].n:"the defense";
  if(pts===3)return `${Math.round(rng.range(19,52))}-yd field goal`;
  if(pts===2)return rng.r()<0.5?`tackled in the end zone \u2014 safety`
    :`snap sails out of the end zone \u2014 safety`;
  if(pts===6&&rng.r()<0.5)return `${dn(8)} ${Math.round(rng.range(18,88))}-yd pick six`;
  const yds=Math.round(rng.range(2,64));
  const two=pts===8?", two-point conversion good":"";
  if(rng.r()<0.56)return `${nm(0)} ${yds}-yd TD pass to ${nm(rng.r()<0.62?2:3)}${two}`;
  if(rng.r()<0.82)return `${nm(1)} ${yds}-yd TD run${two}`;
  return `${nm(0)} ${Math.round(rng.range(1,14))}-yd TD run${two}`;
}

/* Every drive, scoring or not. start/end are yards from the offense's own goal. */
function gameScript(g,rosterHome,rosterAway,seed){
  const rng=new RNG((seed>>>0)||1);
  const hsc=scoreParts(g.hp,rng), asc=scoreParts(g.ap,rng);
  // both teams get the same number of possessions, so the game trades properly
  const target=Math.max(hsc.length,asc.length,Math.round(rng.range(10,13)));
  const items=[];
  hsc.forEach(p=>items.push({side:"home",pts:p}));
  asc.forEach(p=>items.push({side:"away",pts:p}));
  for(let i=hsc.length;i<target;i++)items.push({side:"home",pts:0});
  for(let i=asc.length;i<target;i++)items.push({side:"away",pts:0});

  // teams trade possession; scoring drives fall wherever they fall
  const hq=rng.shuffle(items.filter(d=>d.side==="home"));
  const aq=rng.shuffle(items.filter(d=>d.side==="away"));
  const seq=[]; let turn=rng.r()<0.5?"home":"away";
  while(hq.length||aq.length){
    const q=turn==="home"?hq:aq;
    if(q.length)seq.push(q.shift());
    else seq.push((turn==="home"?aq:hq).shift());
    turn = turn==="home"?"away":"home";
  }
  // lay them across four quarters with a clock that runs down
  const per=Math.ceil(seq.length/4);
  seq.forEach((d,i)=>{
    d.q=Math.min(4,Math.floor(i/per)+1);
    const within=i-(d.q-1)*per;
    d.sec=Math.max(8,Math.round(895-(within+1)*(880/(per+1))-rng.range(0,40)));
  });

  // "runs out the clock" only belongs on the last drive of a half
  const lastOfQ={};
  seq.forEach((d,i)=>{lastOfQ[d.q]=i});

  let H=0,A=0;
  return seq.map((d,idx)=>{
    const endsHalf = (idx===lastOfQ[2]) || (idx===lastOfQ[4]);
    const off=d.side==="home"?rosterHome:rosterAway;
    const def=d.side==="home"?rosterAway:rosterHome;
    const start=Math.round(Math.max(3,Math.min(78,rng.gauss(27,13))));
    let end,outcome,text;
    let possSide=d.side;
    if(d.pts>0){
      if(d.side==="home")H+=d.pts; else A+=d.pts;
      outcome = d.pts===2?"SAF" : d.pts===3?"FG" : "TD";
      if(d.pts===2){
        possSide = d.side==="home"?"away":"home";     // the trapped offense
        end = 0;                                      // its own goal line
      }else end = 100;
      text = scoreText(rng,off,def,d.pts);
    }else{
      const roll=rng.r();
      if(roll<0.52){outcome="PUNT"; end=Math.min(92,start+Math.round(rng.range(-2,34)));
        text=rng.pick(PUNT_LINES);}
      else if(roll<0.64){outcome="DOWNS"; end=Math.min(95,start+Math.round(rng.range(8,48)));
        text="turned over on downs";}
      else if(roll<0.75){outcome="MISS"; end=Math.min(88,start+Math.round(rng.range(20,55)));
        text=`${Math.round(rng.range(38,56))}-yd attempt is no good`;}
      else if(roll<0.87){outcome="INT"; end=Math.min(96,start+Math.round(rng.range(0,45)));
        text=`intercepted by ${def&&def[8]?def[8].n:"the defense"}`;}
      else if(roll<0.95){outcome="FUM"; end=Math.min(96,start+Math.round(rng.range(0,42)));
        text=`fumble, recovered by ${def&&def[7]?def[7].n:"the defense"}`;}
      else if(endsHalf){outcome=d.q===2?"HALF":"END";
        end=Math.min(90,start+Math.round(rng.range(0,38)));
        text=d.q===2?"runs out the half":"runs out the clock";}
      else {outcome="PUNT"; end=Math.min(92,start+Math.round(rng.range(-2,34)));
        text=rng.pick(PUNT_LINES);}
    }
    const mm=Math.floor(d.sec/60), ss=d.sec%60;
    return {
      n:idx+1, q:d.q, clock:mm+":"+(ss<10?"0":"")+ss, sec:d.sec,
      team:possSide==="home"?g.home:g.away, side:possSide,
      scoredBy:d.pts===2?(d.side==="home"?g.home:g.away):null,
      pts:d.pts, outcome:outcome, text:text, start:start, end:end,
      yards:Math.max(0,end-start),
      ball: possSide==="home" ? 100-end : end, // 0 = away end zone, 100 = home end zone
      h:H, a:A
    };
  });
}

/* ---- the field ---- */
/* End zones carry the full team name, sized to fit rather than chopped. */
function endzoneName(t){
  const s=String(t).replace(/[^A-Za-z& ]/g,"").trim().toUpperCase();
  const n=s.length;
  const size = n<=6?8.2 : n<=9?6.8 : n<=12?5.6 : n<=15?4.7 : 4.0;
  return {t:s,size:size};
}
function venueLabelSize(v){
  const n=String(v).length;
  return n<=8?16 : n<=12?13 : n<=16?10.5 : 8.6;
}

function fieldSVG(g,drive,homeColor,awayColor,venue){
  const x=v=>17+(v/100)*166;
  const ball=drive?Math.max(0,Math.min(100,drive.ball)):50;
  const marks=[];
  for(let y=10;y<=90;y+=10)marks.push(`<line x1="${x(y)}" y1="9" x2="${x(y)}" y2="95"
    stroke="rgba(233,229,218,.26)" stroke-width="0.7"/>`);
  for(let y=5;y<=95;y+=5)marks.push(`<line x1="${x(y)}" y1="49" x2="${x(y)}" y2="55"
    stroke="rgba(233,229,218,.30)" stroke-width="0.6"/>`);
  const nums=[];
  [10,20,30,40,60,70,80,90].forEach(y=>{
    nums.push(`<text x="${x(y)}" y="26" fill="rgba(233,229,218,.24)" font-size="6.5"
      font-family="monospace" text-anchor="middle">${Math.min(y,100-y)}</text>`);
    nums.push(`<text x="${x(y)}" y="90" fill="rgba(233,229,218,.24)" font-size="6.5"
      font-family="monospace" text-anchor="middle">${Math.min(y,100-y)}</text>`);
  });
  return `<svg class="field" viewBox="0 0 200 104" xmlns="http://www.w3.org/2000/svg"
      role="img" aria-label="field position">
    <rect x="17" y="9" width="166" height="86" fill="rgba(70,181,131,.10)"/>
    <rect x="1" y="9" width="16" height="86" fill="${awayColor}" opacity="0.85"/>
    <rect x="183" y="9" width="16" height="86" fill="${homeColor}" opacity="0.85"/>
    ${(()=>{const A=endzoneName(g.away),H=endzoneName(g.home);return `
    <text x="9" y="52" fill="#F2EFE7" font-size="${A.size}" font-family="'Barlow Condensed',sans-serif"
      font-weight="700" letter-spacing="0.6" text-anchor="middle"
      transform="rotate(-90 9 52)">${A.t}</text>
    <text x="191" y="52" fill="#F2EFE7" font-size="${H.size}" font-family="'Barlow Condensed',sans-serif"
      font-weight="700" letter-spacing="0.6" text-anchor="middle"
      transform="rotate(90 191 52)">${H.t}</text>`})()}
    ${marks.join("")}${nums.join("")}
    <text x="100" y="60" fill="rgba(233,229,218,.26)" font-size="${venueLabelSize(venue)}"
      font-family="'Barlow Condensed',Impact,sans-serif" font-weight="700"
      text-anchor="middle" letter-spacing="1.5">${String(venue).toUpperCase()}</text>
    <rect x="17" y="9" width="166" height="86" fill="none"
      stroke="rgba(233,229,218,.38)" stroke-width="1"/>
    ${drive?`<line x1="${x(ball)}" y1="9" x2="${x(ball)}" y2="95"
        stroke="var(--sodium)" stroke-width="1.5" opacity=".9"/>
      <ellipse cx="${x(ball)}" cy="52" rx="5" ry="3.2" fill="var(--sodium)"/>`:""}
  </svg>`;
}

function isBigGame(g,team,seaRankMap,rivalName){
  if(!g)return false;
  if(rivalName)return true;
  if(g.title||g.site)return true;
  const opp=g.home===team?g.away:g.home;
  if((seaRankMap[opp]||999)<=25)return true;
  if(g.margin<=7)return true;
  return false;
}

/* Gameplan. Variance is the real lever: an underdog wants chaos, a favourite
   wants the game to be boring. Aggression buys variance at a small cost in
   expected margin; playing safe does the reverse. */
const INTERIM_Q=-18;     // replacement-level coordinator
const FEATURE_EDGE=16;   // Elo, roughly 0.75 of a point of spread

const PLANS={
  safe:      {sd:0.76, edge:0, l:"Play it safe",  d:"Let talent decide. Fewer turnovers, more field goals. Best when you're the better team."},
  balanced:  {sd:1.00, edge:0, l:"Balanced",      d:"Play your game."},
  aggressive:{sd:1.38, edge:0, l:"Take risks",    d:"Make it a game of chances. More touchdowns, more turnovers. Best when you're outgunned."}
};


/* ============ game screens: football ============ */
/* How a football game looks while you watch it: the scoreboard, the drive
   log and drive script, the call screen with the staff's advice, and the
   field view. The core runs the live game (start, tick, answer, finish);
   the sport supplies these, by these names:
     liveScoreboard, driveWord, driveScript, liveView, liveCallView,
     watchView, startWatch */

function startWatch(g){
  if(!g||!SEA.roster)return;
  const drives=(g.drives&&g.drives.length)?g.drives:null;
  watch={g:g, script:drives?driveScript(g,drives):gameScript(g,SEA.roster[g.home],SEA.roster[g.away],watchSeed(g)),
         i:-1, paused:(S.watchStep===true)};
  reveal=null;
  tickWatch();
}

/* Turn the real drives into readable lines, using the actual rosters. */
function driveScript(g,drives){
  const rng=new RNG(watchSeed(g));
  const RH=SEA.roster[g.home], RA=SEA.roster[g.away];
  const OUTTXT={PUNT:["three and out","forced to punt","stalls out, punt","goes backwards, punt"],
                DOWNS:["turned over on downs"],MISS:["the field goal is no good"],   // a field goal: "the kick" read as a missed extra point (Grokbot)
                INT:["intercepted"],FUM:["fumble, recovered by the defense"]};
  return drives.map(d=>{
    const off=d.home?RH:RA, def=d.home?RA:RH;
    const nm=i=>off&&off[i]?off[i].n:"the offense";
    const dn=i=>def&&def[i]?def[i].n:"the defense";
    let text;
    if(d.kind==="TD"){
      const y=Math.round(rng.range(2,64));
      text = rng.r()<0.56 ? `${nm(0)} ${y}-yd TD pass to ${nm(rng.r()<0.62?2:3)}`
           : rng.r()<0.8  ? `${nm(1)} ${y}-yd TD run`
                          : `${nm(0)} ${Math.round(rng.range(1,12))}-yd TD run`;
    } else if(d.kind==="FG"){ text=`${Math.round(rng.range(19,52))}-yd field goal`; }
    else if(d.kind==="INT"){ text=`intercepted by ${dn(8)}`; }
    else if(d.kind==="FUM"){ text=`fumble, recovered by ${dn(7)}`; }
    else if(d.kind==="MISS"){ text=`${Math.round(rng.range(38,56))}-yd attempt is no good`; }
    else { text=rng.pick(OUTTXT[d.kind]||["punt"]); }
    const sec=Math.max(5,Math.round(890-((d.n-1)%6+1)*140-rng.range(0,50)));
    return {n:d.n,q:d.q,clock:Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0"),
      team:d.home?g.home:g.away, pts:d.pts, outcome:d.kind, text:text,
      start:d.start, end:d.pts>0?100:Math.min(95,d.start+20),
      yards:d.pts>0?100-d.start:Math.max(0,20),
      ball: d.home ? 100-(d.pts>0?100:d.start+18) : (d.pts>0?100:d.start+18),
      h:d.h, a:d.a};
  });
}

        const px=this.confrec[x][0]/Math.max(1,this.confrec[x][0]+this.confrec[x][1]);

        return py-px||this.confrec[y][0]-this.confrec[x][0]||this.elo[y]-this.elo[x];
      }).map(t=>({team:t,cr:LEAGUE.standingsCol?String(LEAGUE.standingsCol.val(t,this)):this.confrec[t][0]+"-"+this.confrec[t][1],

  bankCareers(u){

    // they feed belong to the universe's roster, so read one and write the other
    if(!u.roster||!this.roster)return;

      const live=this.roster[t]||[], keep=u.roster[t]||[];

        if(!src||!src.st2||src.n!==pl.n)return;      // same man, same slot
        if(!pl.car){pl.car=blankStats(POS[i%POS.length].p); pl.car.yrs=0}

    const W=this.weeks[wk]; if(!W)return null;
    return W.games.find(g=>g.home===team||g.away===team)||null;
  }
  nextGame(team){
    const g=this.gamesFor(team,this.step)[0];
    return g||null;
  }
}

/* A league adds its postseason (and anything else it needs) to Season here.

function extendSeason(methods){

}
/* ============ postseason: pro football ============ */

  init(sea){

  const R=[[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
  let s="",x=n; R.forEach(([v,r])=>{while(x>=v){s+=r;x-=v}}); return s};

extendSeason({
  buttonLabel(){
    switch(this.phase){
      case "week":return `Play Week ${this.step+1}`;
      case "wildcard":return "Play Wild Card Weekend";
      case "divisional":return "Play the Divisional Round";
      case "conference":return "Play the Conference Championships";
      case "superbowl":return "Play the Super Bowl";
      default:return "Enter the offseason";
    }
  },
  /* tiebreaks: win %, then division record, then rating */
  _tb(x,y){
    const p=t=>this.rec[t][0]/Math.max(1,this.rec[t][0]+this.rec[t][1]);
    const d=t=>this.confrec[t][0]/Math.max(1,this.confrec[t][0]+this.confrec[t][1]);
    return p(y)-p(x)||d(y)-d(x)||this.elo[y]-this.elo[x];
  },
  sideOf(t){return Object.keys(LEAGUE.conf.sides).find(s=>LEAGUE.conf.sides[s].indexOf(CONF[t])>=0)},
  /* the field as it stands: works mid-season (projection) and at the end */
  seedsNow(){
    const out={};
    Object.keys(LEAGUE.conf.sides).forEach(sd=>{
      const divs=LEAGUE.conf.sides[sd];
      const winners=divs.map(d=>NAMES.filter(t=>CONF[t]===d).sort((a,b)=>this._tb(a,b))[0]);
      winners.sort((a,b)=>this._tb(a,b));
      const rest=NAMES.filter(t=>divs.indexOf(CONF[t])>=0&&winners.indexOf(t)<0).sort((a,b)=>this._tb(a,b));
      out[sd]=winners.concat(rest.slice(0,LEAGUE.playoff.perSide-4));

  },
  _seed(){
    if(this.field.length)return;
    const f=this.seedsNow();
    Object.keys(f).forEach(sd=>{this.side[sd]=f[sd];
      f[sd].forEach((t,i)=>{this.seeds[t]=i+1;this.field.push(t)});
      LEAGUE.conf.sides[sd].forEach(d=>{
        this.champs[d]=NAMES.filter(t=>CONF[t]===d).sort((a,b)=>this._tb(a,b))[0]});
    });
  },
  _br(h,a,neutral,round,label){
    const r=this._resolve(h,a,neutral,{title:label,round:round});
    // playoff games don't change a team's record (the season counts only regular-season games: countsInRecord)
    r.hseed=this.seeds[h]; r.aseed=this.seeds[a];
    r.hrec=this.rec[h][0]+"-"+this.rec[h][1]; r.arec=this.rec[a][0]+"-"+this.rec[a][1];

  /* the games a round will play, [home, away, neutral, label] */
  _pairs(round){

      else{

  _play(round){

  _wildcard(){this._play("wc")},
  _divisional(){this._play("div")},
  _confGame(){this._play("conf")},
  _superbowl(){this._play("sb")},
  roundOfPhase(p){return {wildcard:"wc",divisional:"div",conference:"conf",superbowl:"sb"}[p]},
  postMatchup(team){

    const p=this._pairs(r).find(([h,a])=>h===team||a===team);

  },
  postNext(team){
    const m=this.postMatchup(team); if(!m)return null;
    return {label:m.label,opp:m.home===team?m.away:m.home,neutral:m.neutral,home:m.home===team};
  },
  seasonResult(my){
    if(this.champion===my)return "SUPER BOWL CHAMPIONS";
    const lost=[["sb","Lost the Super Bowl"],["conf","Lost the conference championship"],
      ["div","Lost in the divisional round"],["wc","Lost in the wild card round"]]
      .find(([r])=>this.rounds[r].some(g=>g.loser===my));

  },
  postRecord(){

    [["wc","wild card round"],["div","divisional round"],["conf","conference championship"],["sb","Super Bowl"]]
      .forEach(([r,nm])=>this.rounds[r].forEach(g=>{bump(g.winner,true);bump(g.loser,false);
        pnote[g.loser]=r==="sb"?"Lost the Super Bowl":"Playoffs \u2014 lost in the "+nm}));

  postGamesFor(team){

  },
  honours(team){

  confChampions(){return this.champs},

       z  clinched the conference's only bye (the 1 seed)
       y  clinched the division

       e  eliminated

     tie against the team, so a mark can come a week later than the league
     would print it (real tiebreakers) but is never wrong. Once the regular
     season is over the marks are simply the seeds. */

    const out={}, W=LEAGUE.weeks;

      this._seed();

        out[t]=!s?"e":s===1?"z":s<=4?"y":"x"});
    }else{
      const rem={}; NAMES.forEach(t=>rem[t]=0);
      this.sched.forEach(g=>{if(g.week>=this.step){rem[g.home]++;rem[g.away]++}});

      Object.keys(sides).forEach(sd=>{
        const divs=sides[sd], teams=NAMES.filter(t=>divs.indexOf(CONF[t])>=0);
        const inDiv=d=>teams.filter(t=>CONF[t]===d);
        teams.forEach(T=>{
          const others=teams.filter(t=>t!==T), mates=others.filter(t=>CONF[t]===CONF[T]);
          const y=mates.every(t=>mx(t)<w(T));
          const z=y&&others.every(t=>mx(t)<w(T));
          // most non-division-winners that could finish level with or above T:
          // in each division the winner is one of those who can, so one fewer
          const B=divs.reduce((s,d)=>{const k=inDiv(d).filter(t=>t!==T&&mx(t)>=w(T)).length;return s+Math.max(0,k-1)},0);
          const x=y||B<wild;
          // guaranteed non-winners already past T's best possible finish
          const lost=mates.some(t=>w(t)>mx(T));
          const G=divs.reduce((s,d)=>{const c=inDiv(d).filter(t=>t!==T&&w(t)>mx(T)).length;return s+Math.max(0,c-1)},0);
          out[T]=z?"z":y?"y":x?"x":(lost&&G>=wild)?"e":"";
        });
      });
    }
    this._clinch=out; this._clinchAt=this.step;
    return out;
  }
});
/* ============ awards: pro football ============ */
/* The MVP race, and one All-Pro team across the whole league. */
extendSeason({
  _award(w,games){
    if(!this.roster)return;
    const played={}; games.forEach(g=>{played[g.winner]=1;played[g.loser]=1});
    NAMES.forEach(t=>{
      if(!played[t])return;                            // bye week
      const wp=this.rec[t][0]/Math.max(1,this.rec[t][0]+this.rec[t][1]);
      this.roster[t].forEach((pl,i)=>{
        if(!pl||!pl.st2||!pl.st2.g)return;
        const P=POS[i%POS.length];
        pl.st=pl.st2.g;
        // MVP voters want production on a winning team even more than Heisman voters
        pl.prod=statProd(P.p,pl.st2)*LEAGUE.awards.weights[P.p]*(0.55+wp*0.9);
      });
    });
  },
  mvpRace(n){
    if(!this.roster)return [];
    const all=[];
    NAMES.forEach(t=>this.roster[t].forEach((pl,i)=>{
      if(pl&&(pl.st||0)>=8)all.push({t:t,n:pl.n,p:pl.p,r:pl.r,c:pl.c,
        prod:pl.prod||0,line:statLine(pl.p,pl.st2),rec:this.rec[t][0]+"-"+this.rec[t][1]});
    }));
    // measured against the position: production over the typical production
    // of that position's best eight, then the voters' premium for the
    // position (LEAGUE.awards.premium). By raw production a quarterback won
    // every year (passing yards dwarf everything); real voters pick one about
    // nine years in ten.
    const scale={}, P=LEAGUE.awards.premium||{};
    [...new Set(all.map(x=>x.p))].forEach(p=>{const top=all.filter(x=>x.p===p).map(x=>x.prod).sort((a,b)=>b-a).slice(0,8);
      scale[p]=top.length?top.reduce((a,b)=>a+b,0)/top.length:1});
    all.forEach(x=>x.score=x.prod/Math.max(1e-9,scale[x.p])*(P[x.p]||1));
    all.sort((a,b)=>b.score-a.score);
    return all.slice(0,n||10);
  },
  allConference(){
    if(!this.roster)return [];
    return POS.map((P,i)=>{
      const best=NAMES.map(t=>({t:t,pl:this.roster[t][i]}))
        .sort((a,b)=>(b.pl.prod||0)-(a.pl.prod||0))[0];
      return {pos:P.p,team:best.t,n:best.pl.n,r:best.pl.r,c:best.pl.c};
    });
  },
  allConfAll(){return {ALL:this.allConference()}},
  awardTeam(my){return {group:"ALL",list:this.allConference()}}
});
LEAGUE.awards.teamLabel=()=>"All-Pro";
/* ============ the history book ============ */
/* One entry per coach per season. Version 2 is league-neutral: everything the
   core reads has a name that means the same thing in any league, and what
   only one league understands lives under entry.league, written and read by
   that league alone.

   {v:2, year, team, rec:"w-l", rank, result, grade, gradeLine,
    champion,                          league champion that year
    honours:{title, group, seed},      won it all / won your group / playoff seed
    group:{key, name, rec},            conference or division, and record in it
    bestWin:{opp, rank, score}|null,
    coach:{name, titles, seasons},
    -- written at the end of the season, absent from a hot-seat coach's
       early entry (written before the world moves on):
    miles, exp, program,
    teams:{team:[w,l,rank]}, top10, groupChamps:{group:team},
    seeds:{team:seed}, post:{team:[w,l]}, pnote:{team:line},
    awards:{mvp:[{n,p,t,r,c,line}], team:{group, list:[{pos,team,n,r,c}]}},
    coaching:{fired, firedList, nFired, hires, poached, coordMoves, coachNow},
    league:{id, ...}}                  e.g. cfb: bowls, draft, classes, early, realigned
*/
const HISTORY_V=2;

/* The part of an entry every coach gets, whenever it is written. */
function seasonEntry(my){
  const rk=SEA.poll.rankMap();
  const result=SEA.seasonResult(my);
  const exp=S.expNow||expectations();
  const gr=seasonGrade(SEA.rec[my][0],SEA.rec[my][1],result,exp);
  const myGames=[].concat(...SEA.weeks.map(w=>w.games)).filter(g=>g.home===my||g.away===my);
  const bestWin=myGames.filter(g=>g.winner===my)
    .sort((x,y)=>(x.home===my?(x.arank||999):(x.hrank||999))-(y.home===my?(y.arank||999):(y.hrank||999)))[0];
  const bwOpp=bestWin?(bestWin.home===my?bestWin.away:bestWin.home):null;
  // a league with a table has no rankings to quote: positions instead
  const POS=!!LEAGUE.position;
  const bwRank=bestWin&&!POS?(bestWin.home===my?bestWin.arank:bestWin.hrank):null;
  const hon=SEA.honours(my), seeds=SEA.postRecord().cfpOf;
  return Object.assign({v:HISTORY_V, year:SEA.year, team:my,
    rec:recStr(my), rank:POS?null:rk[my],
    result:result, grade:gr.g, gradeLine:gr.l, miss:!!gr.miss,
    champion:SEA.champion,
    honours:{title:SEA.champion===my, group:hon.conf, seed:seeds[my]||null},
    group:{key:CONF[my], name:LEAGUE.conf.names[CONF[my]]||"",
           rec:POS?recStr(my):SEA.confrec[my][0]+"-"+SEA.confrec[my][1]},
    bestWin: bwOpp?{opp:bwOpp,rank:bwRank||null,
      score:(bestWin.home===my?bestWin.hp+"-"+bestWin.ap:bestWin.ap+"-"+bestWin.hp)}:null,
    coach:{name:S.career.name, titles:S.career.titles, seasons:S.history.length+1}},
    POS?{pos:LEAGUE.position(my)}:{});
}

/* ---- old saves ---- */
/* Version 1 entries (no v) are migrated when a save is loaded. They didn't
   record the team for the end-of-season entry, so it comes from the coach's
   career stops. */
function teamInYear(career,year,fallback){
  const st=(career&&career.stops||[]).find(s=>s.from<=year&&(s.to===undefined||s.to>=year));
  return st?st.team:fallback;
}
function migrateEntry(h,career,fallback){
  if(!h||h.v>=2)return h;
  const c=h.card||{}, team=h.team||teamInYear(career,h.year,fallback);
  const keyOf=name=>Object.keys(LEAGUE.conf.names).find(k=>LEAGUE.conf.names[k]===name)||null;
  const out={v:2, year:h.year, team:team, rec:h.rec, rank:h.rank, result:h.result,
    grade:h.grade, gradeLine:h.gradeLine, champion:h.champion,
    miss:/Short of the mark|A bad year/.test(h.gradeLine||""),
    honours:{title:h.champion===team, group:!!h.confChamp, seed:(h.cfp&&h.cfp[team])||null},
    group:{key:(h.allconf&&h.allconf.conf)||keyOf(c.conf), name:c.conf||"", rec:c.confRec||""},
    bestWin:c.bestWin||null,
    coach:{name:c.coach, titles:c.titles, seasons:c.seasons}};
  if(h.miles)out.miles=h.miles;
  if(h.exp!==undefined)out.exp=h.exp;
  if(h.program!==undefined)out.program=h.program;
  if(h.teams){
    out.teams=h.teams; out.top10=h.top10||[];
    out.groupChamps=h.confChamps||{}; out.seeds=h.cfp||{};
    // the oldest saves have bowls but no postseason tally or notes
    let post=h.post, pnote=h.pnote;
    if(!post&&h.bowls){post={};Object.keys(h.bowls).forEach(t=>{post[t]=h.bowls[t][0]==="W"?[1,0]:[0,1]})}
    if(!pnote&&h.bowls){pnote={};Object.keys(h.bowls).forEach(t=>{
      pnote[t]=(h.bowls[t][0]==="W"?"Won the ":"Lost the ")+h.bowls[t][1]})}
    out.post=post||{}; out.pnote=pnote||{};
    out.awards={mvp:h.heis||[],
      team:h.allconf?{group:h.allconf.conf,list:h.allconf.list||[]}:null};
    out.coaching={fired:!!h.fired, firedList:h.firedList||[], nFired:h.nFired||0,
      hires:h.hires||[], poached:h.poached||[], coordMoves:h.coordMoves||[],
      coachNow:h.coachNow||null};
    out.league=LEAGUE.migrateHistory?LEAGUE.migrateHistory(h):{id:LEAGUE.id};
  }
  return out;
}
function migrateSave(d){
  if(!d)return d;
  if(d.history)d.history=d.history.map(h=>migrateEntry(h,d.career,d.myTeam));
  (d.coaches||[]).forEach(c=>{
    if(c.history)c.history=c.history.map(h=>migrateEntry(h,c.career,c.myTeam))});
  [d].concat(d.coaches||[]).forEach(c=>(c&&c.history||[]).forEach(backfillDraws));
  // in the offseason the career already holds the finished season, which isn't in the history yet
  const extra=!d.off?0:(d.seasonNow&&d.seasonNow.banked&&d.seasonNow.d!==undefined)?d.seasonNow.d:null;
  if(extra!==null)[d].concat(d.off?[]:(d.coaches||[])).forEach(c=>{ if(c&&c.career&&c.history)careerDraws(c.career,c.history,c.myTeam,c===d?extra:0) });
  return d;
}
/* soccer: a career and its coaching stops that began before draws were kept
   counted none (a stop read 54-0-48 against a true 54-36-48: Muse, three
   rounds). Recounted from the seasons themselves, which do keep them. */
function careerDraws(C,H,fallback,extra){
  if(!LEAGUE.draws||!C.stops)return;
  const rows=H.map(h=>{ const t=h.team||fallback, r=h.teams&&h.teams[t]; return r&&r[3]!==undefined?{y:h.year,t:t,d:r[3]}:null });
  if(rows.some(x=>!x))return;                          // a season without draws: leave the counts as they are
  C.stops.forEach((st,i)=>{ st.d=rows.filter(x=>x.t===st.team&&x.y>=st.from&&(st.to===undefined||x.y<=st.to)).reduce((a,x)=>a+x.d,0)+(i===C.stops.length-1?extra||0:0) });
  C.d=rows.reduce((a,x)=>a+x.d,0)+(extra||0);
}
/* soccer seasons saved before Nov 2026 kept wins and losses but not draws, so
   a club's all-time record counted only the newer seasons' draws (Muse). A
   season's games are fixed by the division, so the draws are what's left. */
function backfillDraws(h){
  const res=h&&h.league&&h.league.res;
  if(!LEAGUE.draws||!LEAGUE.seasonGames||!h||!h.teams||!res)return;
  Object.keys(h.teams).forEach(t=>{ const r=h.teams[t];
    if(r&&r.length===3&&res[t])r.push(Math.max(0,LEAGUE.seasonGames(res[t])-r[0]-r[1])) });
}
/* ============ the franchise record book: pro football ============ */
/* Everyone who leaves a franchise, by retirement, release or free agency,
   is written into its book. Greats are ranked by peak rating. */
function nflCareerLine(a){
  if(a.line)return a.line;
  const c=a.car; if(!c)return `${a.yrs} season${a.yrs===1?"":"s"}`;
  const P=a.p, n=x=>(x||0).toLocaleString();
  if(P==="QB")   return `${n(c.pyd)} yds, ${c.ptd||0} TD, ${c.int||0} INT`;
  if(P==="RB")   return `${n(c.ryd)} rush yds, ${c.rtd||0} TD`;
  if(P==="WR"||P==="WR2") return `${c.rec||0} catches, ${n(c.cyd)} yds, ${c.ctd||0} TD`;
  if(P==="EDGE"||P==="DT") return `${c.sck||0} sacks, ${c.tkl||0} tackles`;
  if(P==="LB")   return `${c.tkl||0} tackles, ${c.tfl||0} for loss`;
  if(P==="CB"||P==="S") return `${c.ints||0} INT, ${c.pd||0} passes defended`;
  if(P==="OT")   return `${c.ska||0} sacks allowed in ${a.yrs} season${a.yrs===1?"":"s"}`;
  return `${a.yrs} season${a.yrs===1?"":"s"}`;
}
const NFL_LEADERS=[
  {k:"pyd",label:"Passing yards",pos:["QB"],re:/([\d,]+) yds,/},
  {k:"ptd",label:"Passing TD",pos:["QB"],re:/([\d,]+) TD/},
  {k:"ryd",label:"Rushing yards",pos:["RB"],re:/([\d,]+) rush yds/},
  {k:"cyd",label:"Receiving yards",pos:["WR","WR2"],re:/catches, ([\d,]+) yds/},
  {k:"sck",label:"Sacks",pos:["EDGE","DT"],re:/([\d,]+) sacks/},
  {k:"ints",label:"Interceptions",pos:["CB","S"],re:/([\d,]+) INT/}
];
function nflLeaders(u,team){
  const list=(u.alumni&&u.alumni[team])||[], out=[];
  NFL_LEADERS.forEach(cat=>{
    const pool=list.filter(a=>cat.pos.indexOf(a.p)>=0&&a.line)
      .map(a=>{const m=a.line.match(cat.re);return {a:a,v:m?+m[1].replace(/,/g,""):0}})
      .filter(x=>x.v>0).sort((x,y)=>y.v-x.v);
    if(pool.length)out.push({label:cat.label,top:pool.slice(0,3)});
  });
  return out;
}
function nflBook(u,team){
  return ((u.alumni&&u.alumni[team])||[]).slice().sort((a,b)=>b.peak-a.peak);
}
LEAGUE.records={book:nflBook, leaders:nflLeaders, alumniLine:nflCareerLine};
/* ============ the recruiting board (college games) ============ */
/* A class fills the spots seniors leave. Before the offseason you see, for
   each position with an open spot, a few named prospects, drawn exactly as
   the game draws a freshman newcomer for your program (with your focus and
   recruiting budget). You rank the ones you want. Each open spot goes to
   your highest-ranked prospect there, if he commits; the better he is next
   to what your program usually lands, the harder he is to get. Miss, and you
   get the newcomer you'd have had anyway.
   The default newcomer is always drawn first, from the season's own dice, so
   every other program's class is exactly what it was without a board; the
   commitment rolls use their own dice. (Muse: recruiting was the biggest
   offseason chore, with no board.) */
const RB_PER_POS=4;           // prospects shown at each open position
function rbOpenSpots(my){
  const R=U.roster[my], out={};
  R.forEach((p,i)=>{ if(p&&p.c>=3){ const k=i%POS.length; (out[k]=out[k]||[]).push(p.n) } });
  return out;                  // position index -> the seniors leaving there
}
function rbStars(r){ return r>=82?5:r>=74?4:r>=64?3:2 }
/* the chance he commits: RB_LAND0 for a newcomer of the usual level, falling
   RB_LANDK per standard deviation above it (tuned in test/recruiting.js) */
const RB_LAND0=0.70, RB_LANDK=0.30;
function rbChance(x){ const z=(x.r-x.M)/Math.max(1,x.SD); return Math.max(0.08,Math.min(0.95,RB_LAND0-RB_LANDK*z)) }
function rbChanceWord(x){ const c=rbChance(x); return c>=0.7?"likely":c>=0.4?"a battle":"a long shot" }
/* the prospects at each open position, drawn with the league's own newcomer
   function (drawNewcomer) in this program's context and your choices: the
   same pool your newcomer comes from. Each from its own seed, so the list
   holds through the offseason. M, SD: what a newcomer there averages,
   measured from the same function. */
function rbPool(my,P){
  const open=rbOpenSpots(my), out=[], C=LEAGUE.offseason.recruitCtx(U,my,P||{});
  Object.keys(open).forEach(k=>{ const i=+k;
    const smp=new RNG(strHash(my+"|"+SEA.year+"|mean|"+i)), xs=[];
    for(let q=0;q<60;q++)xs.push(drawNewcomer(smp,C,i).r);
    const M=xs.reduce((a,b)=>a+b,0)/xs.length, SD=Math.sqrt(xs.reduce((a,b)=>a+(b-M)*(b-M),0)/xs.length);
    for(let j=0;j<RB_PER_POS;j++){
      const x=drawNewcomer(new RNG(strHash(my+"|"+SEA.year+"|"+i+"|"+j)),C,i);
      out.push(Object.assign(x,{key:i+"|"+j, i:i, M:Math.round(M*10)/10, SD:Math.round(SD*10)/10, stars:x.star5?5:rbStars(x.r)})) } });
  return out;
}
/* at the commit: your board, as it stands with your final choices */
function rbChoices(my,P){
  const pool=rbPool(my,P), by={}; pool.forEach(x=>by[x.key]=x);
  return (P.rboard||[]).map(k=>by[k]).filter(Boolean);
}
/* in developRoster: the newcomer at position i, from your board if he commits */
function rbSign(board,t,year,i,np){
  if(!board||!board.length)return np;
  const p=POS[i%POS.length].p, x=board.find(y=>!y.used&&y.p===p); if(!x)return np;
  x.used=true;
  const roll=new RNG(strHash(t+"|"+year+"|commit|"+x.n)).r();
  if(roll<rbChance(x)){ x.got=true;
    // he takes the newcomer's place after the offseason's development (rbSettle):
    // swapping him in now would change how the season's dice fall for everyone after
    np._rb=x; np._r0=np.r; np._p0=np.pot; np._c0=np.c; return np }
  // he went elsewhere: a program bigger than yours, more often than not
  const R2=new RNG(strHash(t+"|"+year+"|went|"+x.n)), bigger=NAMES.filter(o=>o!==t&&U.program[o]>U.program[t]);
  const from=bigger.length&&R2.r()<0.75?bigger:NAMES.filter(o=>o!==t); x.to=from[R2.int(from.length)];
  return np;
}
/* at the end of developRoster: each signed prospect replaces the newcomer
   whose spot he took, developed by as much as that newcomer was */
function rbSettle(roster,arriving){
  roster.forEach((np,k)=>{ if(!np||!np._rb)return; const x=np._rb; x.was=np._r0;   // the newcomer he replaced, as drawn
    const r=Math.round(Math.max(30,Math.min(99,x.r+(np.r-np._r0)))), pot=Math.round(Math.max(r,Math.min(99,x.pot+(np.pot-np._p0))));
    const pl=Object.assign({},x,{i:np.i,p:np.p,r:r,pot:pot,board:true});
    ["key","M","SD","used","got","stars","to"].forEach(q=>delete pl[q]);
    Object.keys(np).forEach(q=>{ if(!(q in pl)&&q[0]!=="_")pl[q]=np[q] });   // anything the offseason gave the newcomer (minutes, flags)
    pl.n=x.n; pl.r=r; pl.pot=pot; pl.c=x.c+((np.c||0)-(np._c0||0)); roster[k]=pl;
    if(arriving){ const a=arriving.indexOf(np); if(a>=0)arriving[a]=pl } });   // the class's record counts him, not the man he replaced
  // a newcomer can declare early the offseason he arrives (college basketball):
  // a recruit standing in for one takes the spot of the newcomer who filled it after him
  (arriving||[]).filter(np=>np&&np._rb&&roster.indexOf(np)<0).forEach(np=>{ const x=np._rb;
    const later=arriving.filter(a=>a&&a!==np&&!a._rb&&!a.board&&a.i===np.i&&roster.indexOf(a)>=0).pop();
    if(!later){ x.got=false; x.to=null; return }
    const k=roster.indexOf(later); x.was=later.r;
    const pl=Object.assign({},later,x,{i:later.i,p:later.p,board:true}); ["key","M","SD","used","got","stars","to","_rb","_r0","_p0","_c0","was"].forEach(q=>delete pl[q]);
    roster[k]=pl; arriving[arriving.indexOf(later)]=pl });
  roster.forEach(p=>{ if(p){ delete p._rb; delete p._r0; delete p._p0; delete p._c0 } });
  (arriving||[]).forEach(p=>{ if(p){ delete p._rb; delete p._r0; delete p._p0; delete p._c0 } });
}
function rbReport(board){ return (board||[]).filter(x=>x.used).map(x=>({n:x.n,p:x.p,r:x.r,stars:x.stars,got:!!x.got,to:x.to||null,was:x.was})) }

/* ============ players you care about ============ */
/* Your best players as people: how they're playing lately (form), where their
   careers are heading (the next milestone), whether this is their last year
   with you (a contract year, a senior season), and how they seem. Form and
   milestones come from the box scores; the mood is a reading of the same
   facts (playing time, form, contract, results), not a separate mechanic.
   The season notes each player's games as it plays them (noteGame), on its
   own roster copy, so a reload rebuilds the same story. */
const FORM_N=5;                                // games in the form line
function careerOf(pl,key){ return ((pl.car&&pl.car[key])||0)+((pl.st2&&pl.st2[key])||0) }
function milestoneSpec(pos){
  const M=(LEAGUE.classes&&LEAGUE.classes.length&&SPORT.milestonesCollege)||SPORT.milestones;
  return M&&M[pos]||null }
function nextMilestone(pl,pos){
  const M=milestoneSpec(pos); if(!M)return null;
  const v=careerOf(pl,M[0]), t=M[2].find(x=>x>v);
  return t?{label:M[1],at:t,v:v,left:t-v}:null;
}
/* one game for one player: form, and a milestone crossed. Called before the
   line is added to his season. */
function noteGame(sea,pl,pos,line,team){
  const one=Object.assign({g:1},line), v=statProd(pos,one);
  (pl.fm=pl.fm||[]).push(Math.round(v*10)/10); if(pl.fm.length>FORM_N)pl.fm.shift();
  const M=milestoneSpec(pos); if(!M||!line[M[0]])return;
  const before=careerOf(pl,M[0]), after=before+line[M[0]], hit=M[2].filter(x=>before<x&&after>=x).pop();
  if(hit)(sea.miles=sea.miles||[]).push({step:sea.step,n:pl.n,pos:pos,team:team,at:hit,key:M[0],label:M[1],r:pl.r});
}
/* hot, cold or neither: his last few games against his season so far */
function formOf(pl,pos){
  const s=pl.st2; if(!s||!s.g||s.g<FORM_N||!pl.fm||pl.fm.length<3)return null;
  const avg=statProd(pos,s)/s.g; if(avg<=0.5)return null;
  const recent=pl.fm.slice(-3).reduce((a,b)=>a+b,0)/3;
  return recent>=avg*1.35?"hot":recent<=avg*0.6?"cold":null;
}
function lastYear(pl){
  if(LEAGUE.classes&&LEAGUE.classes.length)return pl.c>=LEAGUE.classes.length-1?"senior":null;
  return pl.k&&pl.k.yrs<=1?"contract":null;
}
/* how he seems, from what's true of him */
function moodOf(pl,i,team){
  const R=SEA.roster[team], P=POS[i%POS.length].p, backup=i>=POS.length;
  const st=backup?R[i-POS.length]:null, f=formOf(pl,P), ly=lastYear(pl), run=streakOf(team);
  if(backup&&st&&pl.r>=st.r-2)return {t:"wants to start",tone:"no"};
  if(f==="hot")return {t:"flying",tone:"ok"};
  if(ly==="contract"&&run.n>=3&&!run.won)return {t:"weighing his future",tone:"no"};
  if(!backup&&run.n>=3&&!run.won)return {t:"frustrated",tone:"no"};
  if(f==="cold")return {t:"searching for form",tone:"no"};
  if(run.n>=3&&run.won)return {t:"enjoying it",tone:"ok"};
  return {t:"settled",tone:""};
}
/* the team page: your three best players, and anyone unhappy about his minutes */
function starsHTML(team){

  const idx=R.map((p,i)=>i).filter(i=>R[i]&&i<POS.length).sort((a,b)=>R[b].r-R[a].r).slice(0,3);
  R.forEach((p,i)=>{ if(p&&i>=POS.length&&!hurt[i]&&idx.length<5&&moodOf(p,i,team).t==="wants to start")idx.push(i) });
  if(!idx.length)return "";

  return `<div class="grouphead">Your players</div>`+idx.map(i=>{
    const p=R[i], P=POS[i%POS.length].p, f=formOf(p,P), ly=lastYear(p), m=moodOf(p,i,team), nm=nextMilestone(p,P);
    const line=statLine(P,p.st2);

/* ============ the staff's plan for the offseason ============ */
/* The offseason screen asks a lot at once. Every choice on it starts at what

function staffResignPlan(){

/* college: the staff's plan is the even split and a balanced class */

/* ---- how much the staff give away on a read ----
   Full: Pearl names what she sees and the answer. Hints: she points at what
   to look at and leaves the answer to you. Hints are the default from the

   hints after) now gets hints. */
function staffHints(){ return (S.advice||"hints")!=="full" }
function staffAdvice(dp,ctx){
  const R=staffTake(dp,ctx);
  if(!staffHints()||(dp.k!=="read"&&dp.k!=="prep"))return R;
  const H=SPORT.hints||{};

/* ---- what your calls did ----
   Each call you made, against what the assistant would have done (the
   option you'd get by leaving it to him). Two replays from the moment of the
   call: once with the same dice, the same game with his choice, for a result
   you can see ("a 20-24 loss instead"); and many times with fresh luck after
   it, for whether the call was worth it on average. The averages add up to a
   season's ledger: what your calls were worth in wins (Muse and Instinct:
   "nothing shows a good call mattering"). */
const IMPACT_RUNS=400;
function impactDefault(dp){ return typeof verdictDefault==="function"?verdictDefault(dp):dp.opts[dp.opts.length-1][0] }
function callImpact(args,seed,answers,meHome,runs){
  runs=runs||IMPACT_RUNS;
  const play=(j,v,reseed)=>{                 // replay with answers before j, v at j; later asks: yours where they match, else his
    const rng=new RNG(seed), e=makeLiveGame(rng,...args); let i=0,g=0,r;
    while(g++<3000){ r=e.next(); if(r.done)break;
      if(r.ask){ let a;
        if(i<j)a=answers[i];
        else if(i===j){ a=v; if(reseed!==undefined){ rng.f=mulberry32((seed^Math.imul(reseed+1,0x9E3779B1))>>>0); rng.sp=null } }
        else a=(asks[i]&&asks[i].dp.k===r.ask.k&&answers[i]!==undefined)?answers[i]:impactDefault(r.ask);
        e.reply(a); i++ } }
    return {mine:meHome?r.h:r.a, theirs:meHome?r.a:r.h};
  };
  const asks=[]; { const e=makeLiveGame(new RNG(seed),...args); let i=0,g=0;
    while(g++<3000){ const r=e.next(); if(r.done)break;
      if(r.ask){ asks.push({dp:r.ask}); e.reply(answers[i]!==undefined?answers[i]:impactDefault(r.ask)); i++ } } }
  const out=[], score=x=>x.mine>x.theirs?1:x.mine===x.theirs?0.5:0;
  asks.forEach((A,j)=>{
    const pick=answers[j], def=impactDefault(A.dp);
    if(pick===undefined||pick===def||!A.dp.opts.some(o=>o[0]===def))return;      // left to him: nothing to compare
    const cf=play(j,def);                    // the same dice, his call
    let rp=0,rd=0; for(let m=0;m<runs;m++){ rp+=score(play(j,pick,m)); rd+=score(play(j,def,m)) }
    const lab=o=>(A.dp.opts.find(x=>x[0]===o)||[o,o])[1].split(" · ")[0].split(":")[0];
    out.push({h:A.dp.h, pick:lab(pick), def:lab(def), cf:cf, worth:Math.round((rp-rd)/runs*1000)/1000});
  });
  return out;
}
/* the post-game line: the call that mattered most, in words */
function impactHTML(P){
  const C=[].concat(...P.map(p=>(p.impact||[]).map(c=>Object.assign({res:p},c))));
  if(!C.length)return "";
  const c=C.reduce((a,x)=>Math.abs(x.worth)>Math.abs(a.worth)?x:a,C[0]), p=c.res;
  const out=(m,t)=>m>t?"win":m<t?(LEAGUE.draws?"defeat":"loss"):"draw";
  const res=out(p.mine,p.theirs), alt=out(c.cf.mine,c.cf.theirs);
  const altLine=`a ${c.cf.mine}-${c.cf.theirs} ${alt}`;
  const avgOf=w=>w>=0.05?"wins clearly more often than his":w>=0.02?"wins a little more often than his"
    :w>-0.02?"made little difference either way":w>-0.05?"wins a little less often than his":"loses clearly more often than his";
  const avg=avgOf(c.worth);
  // every other call you made against his, weighed the same way: the ones left out (a slow-down, the
  // press) read as if they were never weighed (Instinct)
  const rest=C.filter(x=>x!==c).map(x=>`${esc(x.h)} ("${esc(x.pick)}"): ${avgOf(x.worth).replace(/ than his$/,"").replace(/^made little/,"little")}`);
  // one replay is one roll of the dice: the headline credits the call only when
  // the average over many replays agrees (measured: on its own, the same-luck
  // replay disagreed with the average about as often as not)
  const rank={win:2,draw:1,loss:0,defeat:0}, better=rank[res]>rank[alt], worse=rank[res]<rank[alt];
  // the headline says both things, tonight's dice and the average, and never lets them contradict
  // ("You won, but not because of the call" above a replay that lost without it: Grokbot)
  const small=Math.abs(c.worth)<0.02;
  const head=better?(c.worth>=0.02?(res==="draw"?`Your call saved a point.`:`Your call won this game.`)
        :small?`Your call won this one tonight; over many replays it makes little difference.`
        :`Your call won this one tonight, though over many replays it loses more often.`)
    :worse?(c.worth<=-0.02?`That call cost you this one.`
        :small?`The call went against you tonight; over many replays it makes little difference.`
        :`Unlucky: the call was sound.`)
    :c.cf.mine===p.mine&&c.cf.theirs===p.theirs?(small?`Same score either way tonight: on these dice the call changed nothing.`
        :`Same score either way tonight, but over many replays your call ${c.worth>0?"wins more often":"loses more often"}.`)
    :small?`Same ${res==="draw"?"draw":res==="win"?"win":"defeat"} either way tonight.`
    // the headline and the replays agree in one sentence ("Same defeat either way" above "wins clearly more often": Grokbot)
    :`Same ${res==="draw"?"draw":res==="win"?"win":"defeat"} either way tonight, but over many replays your call ${c.worth>0?"wins more often":"loses more often"}.`;
  return `<div class="impact"><div class="imphead">${head}</div>
    <div class="impbody">${esc(c.h)}: you chose "${esc(c.pick)}". The same game with the same luck and the assistant's call ("${esc(c.def)}") ends ${altLine}. Over many replays, your call ${avg}.${better&&c.worth<0.02||worse&&c.worth>-0.02?" One game is one roll of the dice.":""}</div>${rest.length?`<div class="impbody imprest">Your other ${rest.length===1?"call":rest.length+" calls"} against his, over many replays: ${rest.join("; ")}.</div>`:""}</div>`;
}
/* the season's ledger: what your calls were worth, in wins, against leaving them to the assistant */
function ledgerLine(){
  const L=S.callLedger&&S.callLedger[SEA.year]; if(!L||!L.n)return "";
  const w=L.worth, a=Math.abs(w), say=a<0.25?"about even":`about ${w>0?"+":"−"}${a<1?(Math.round(a*10)/10):(Math.round(a*2)/2)} win${a>=0.75&&a<1.25?"":"s"}`;
  // says what it counts: every call that differed from the assistant's, graded or not (the big number
  // beside it counts only graded ones, and the two read as a contradiction: Grokbot)
  return `Every call you made differently from the assistant this season (${L.n}): ${say} against leaving ${L.n===1?"it":"them"} to him, over many replays.`;
}

/* The same season as a line of text, for anywhere an image won't go. */
function seasonCardText(h, team){
  const c={conf:h.group.name, confRec:h.group.rec, bestWin:h.bestWin, coach:h.coach.name};
  const bits=[`${team} ${h.rec} (${c.confRec} ${c.conf})`];
  if(h.champion===team)bits.push(LEAGUE.text.champions.toUpperCase());
  else if(h.honours.group)bits.push(`${c.conf} champions`);
  else if(h.pos)bits.push(h.result);
  else if(h.rank)bits.push(`finished No. ${h.rank}`);
  if(LEAGUE.cardLine){ const x=LEAGUE.cardLine(h,team); if(x)bits.push(x) }   // a league's own honour (soccer: the FA Cup)
  if(c.bestWin)bits.push(`beat ${c.bestWin.rank?"No. "+c.bestWin.rank+" ":""}${c.bestWin.opp} ${c.bestWin.score}`);
  return `${c.coach}, ${h.year}. ${bits.join(" \u2014 ")}. ${LEAGUE.text.site}`;
}

/* Rasterise the SVG to a PNG blob so it can be shared or saved as a real image. */
function cardBlob(svg){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
    img.onload=()=>{
      try{
        const cv=document.createElement("canvas");
        cv.width=CARD_W; cv.height=CARD_H;
        const cx=cv.getContext("2d");
        cx.fillStyle="#10131C"; cx.fillRect(0,0,CARD_W,CARD_H);
        cx.drawImage(img,0,0,CARD_W,CARD_H);
        cv.toBlob(b=>b?resolve(b):reject(new Error("no blob")),"image/png");
      }catch(e){reject(e)}
    };
    img.onerror=()=>reject(new Error("svg load failed"));
    img.src=url;
  });
}

async function shareCard(h, team){
  const svg=seasonCardSVG(h,team);
  const txt=seasonCardText(h,team);
  const name=`${team.replace(/[^A-Za-z]/g,"")}-${h.year}.png`;
  try{
    const blob=await cardBlob(svg);
    const file=new File([blob],name,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],text:txt});
      return "shared";
    }
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    return "saved";
  }catch(e){
    try{ await navigator.clipboard.writeText(txt); return "copied" }
    catch(_){ return "failed" }
  }
}

/* ============ things to play for: objectives and achievements ============ */
/* Every season the board sets three objectives beyond the main target: beat
   your rival, a home record, finish above a named side, and in soccer a cup
   run. They are worked out from the season as it started (the schedule and
   the preseason ratings), so a reload or a hot seat gets the same ones.
   Each met is worth reputation, which is what job offers and job security
   run on. Achievements are a career's trophy cabinet: unlocked once, kept. */

/* ---- objectives ---- */
function preElo(t){ return (SEA.preseason&&SEA.preseason[t])||SEA.elo[t]||1500 }
function myLeagueGames(my){ return SEA.sched.filter(g=>!g.cup&&(g.home===my||g.away===my)) }
function seasonObjectives(my){
  if(!SEA||!my)return [];
  if(S.obj&&S.obj.year===SEA.year&&S.obj.team===my){
    // a save from before a schedule change: the home count follows the schedule as it is now
    S.obj.list.forEach(o=>{ if(o.k!=="home")return; const n=myLeagueGames(my).filter(g=>g.home===my&&!g.neutral).length;
      if(n&&o.of!==n){ o.of=n; o.n=Math.min(o.n,n); o.l=`Win ${o.n} of your ${n} home games` } });
    return S.obj.list;
  }
  const out=[], games=myLeagueGames(my);
  // a rival on the schedule
  const rg=games.find(g=>LEAGUE.rivals.name(my,g.home===my?g.away:g.home));
  if(rg){ const o=rg.home===my?rg.away:rg.home; out.push({k:"rival",opp:o,l:`Beat ${o}`}) }
  // a cup run, where there is a cup
  if(LEAGUE.cup&&SEA.cup){ const tier=DIVS[CONF[my]].tier, R=LEAGUE.cup.rounds;
    const want=tier<=2?7:tier<=4?4:2;    // the quarter-finals; the third round; the first round proper
    out.push({k:"cup",round:want,l:`Reach the FA Cup ${R[want].name}`}) }
  // finish above the side rated just above you in your group
  const grp=NAMES.filter(t=>CONF[t]===CONF[my]&&t!==my&&preElo(t)>preElo(my)).sort((a,b)=>preElo(a)-preElo(b));
  if(grp.length)out.push({k:"above",opp:grp[0],l:`Finish above ${grp[0]}`});
  else out.push({k:"top",l:`Finish top of the ${LEAGUE.conf.names[CONF[my]]||"group"}`});   // rated best in it: win it
  // a home record a little better than you'd expect
  const H=games.filter(g=>g.home===my&&!g.neutral);
  if(H.length>=3){ const hfa=LEAGUE.tuning.hfa||0;
    const p=H.reduce((s,g)=>s+1/(1+Math.pow(10,-(preElo(my)+hfa-preElo(g.away))/400)),0)/H.length;
    // what you'd expect to win (a draw isn't a win: about a quarter of soccer games are drawn)
    const pw=LEAGUE.draws?p*0.74:p;
    const t=Math.max(1,Math.min(H.length,Math.round(H.length*Math.min(0.88,pw))));
    out.push({k:"home",n:t,of:H.length,l:`Win ${t} of your ${H.length} home games`}) }
  // a run of wins, when there's room for a third
  const n=games.length;
  out.push({k:"streak",n:n<=13?3:n<=40?4:5,l:`Win ${n<=13?3:n<=40?4:5} games in a row`});
  const list=out.slice(0,3);
  S.obj={year:SEA.year,team:my,list:list};
  return list;
}
/* how each objective stands: met, failed, or how it's going */
function objStatus(o,my){
  const played=[].concat(...SEA.weeks.slice(0,LEAGUE.weeks).map(w=>w.games)).filter(g=>!g.cup&&(g.home===my||g.away===my));
  const done=SEA.phase!=="week";
  if(o.k==="rival"){ const m=played.filter(g=>g.home===o.opp||g.away===o.opp);
    if(m.some(g=>g.winner===my))return {s:"met",t:"Done"};
    const left=myLeagueGames(my).filter(g=>(g.home===o.opp||g.away===o.opp)&&g.week>=SEA.step).length;
    return left&&!done?{s:"on",t:`${left} meeting${left===1?"":"s"} to come`}:{s:"miss",t:"Missed"} }
  if(o.k==="cup"){ const C=SEA.cup; if(!C)return {s:"on",t:""};
    if(C.draws[o.round]&&C.draws[o.round].some(p=>p.indexOf(my)>=0))return {s:"met",t:"Done"};
    if(C.out[my]!==undefined&&C.out[my]<o.round)return {s:"miss",t:"Knocked out"};
    return {s:"on",t:"Still in it"} }
  if(o.k==="above"){ const pos=t=>LEAGUE.position?LEAGUE.position(t):standRank(t);
    const a=pos(my), b=pos(o.opp);
    if(done)return a<b?{s:"met",t:"Done"}:{s:"miss",t:"Missed"};
    return {s:"on",t:a<b?"Ahead of them now":"Behind them now"} }
  if(o.k==="top"){ const pos=LEAGUE.position?LEAGUE.position(my):standRank(my);
    if(done)return pos===1?{s:"met",t:"Done"}:{s:"miss",t:"Missed"};
    return {s:"on",t:pos===1?"Top now":"Not top now"} }
  if(o.k==="streak"){ let best=0,cur=0; played.slice().sort((a,b)=>(a.week||0)-(b.week||0)).forEach(g=>{ if(g.winner===my){cur++;best=Math.max(best,cur)} else cur=0 });
    // played is in week order already: SEA.weeks
    if(best>=o.n)return {s:"met",t:`${best} in a row`};
    return done?{s:"miss",t:`Best run ${best}`}:{s:"on",t:`Best so far ${best}`} }
  if(o.k==="home"){ const w=played.filter(g=>g.home===my&&!g.neutral&&g.winner===my).length;
    const left=myLeagueGames(my).filter(g=>g.home===my&&!g.neutral&&g.week>=SEA.step).length;
    if(w>=o.n)return {s:"met",t:`${w} won`};
    if(w+left<o.n||done)return {s:"miss",t:`${w} won, ${o.n} needed`};
    return {s:"on",t:`${w} won, ${left} to play`} }
  return {s:"on",t:""};
}
/* where a team stands in its group, for leagues without a table: by win share, then rating */
function standRank(t){
  // the order the Standings screen shows (conference record first): win share overall
  // marked a team "top" that the table had second (Grokbot)

  if(!soundOn())return null;

    if(AC.state==="suspended"&&AC.resume)AC.resume(); return AC }catch(e){ return null }

function noiseBuf(ac,secs){
  const n=Math.floor(ac.sampleRate*secs), b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);

/* a shaped burst of filtered noise: a crowd */
function crowd(ac,{f=900,q=0.7,peak=0.22,up=0.12,down=1.4,type="bandpass"}){
  const t=ac.currentTime, s=ac.createBufferSource(), fl=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=noiseBuf(ac,up+down+0.1); fl.type=type; fl.frequency.value=f; fl.Q.value=q;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+up); g.gain.exponentialRampToValueAtTime(0.0001,t+up+down);
  s.connect(fl); fl.connect(g); g.connect(ac.destination); s.start(t); s.stop(t+up+down+0.1);

function tone(ac,{f=440,type="sine",at=0,dur=0.2,peak=0.12,glide=null,vib=0}){

  o.type=type; o.frequency.setValueAtTime(f,t); if(glide)o.frequency.exponentialRampToValueAtTime(glide,t+dur);
  if(vib){ const l=ac.createOscillator(), lg=ac.createGain(); l.frequency.value=vib; lg.gain.value=f*0.04; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t+dur) }
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.02);

/* ---- confetti: a title, a promotion ---- */
function confetti(colors){
  if(prefersReduced())return;
  try{
    const c=document.createElement("canvas"); if(!c||!c.getContext)return;
    const W=window.innerWidth, H=window.innerHeight, x=c.getContext("2d"); if(!x)return;
    c.width=W; c.height=H; c.className="confetti"; document.body.appendChild(c);
    const P=Array.from({length:170},()=>({x:Math.random()*W, y:-20-Math.random()*H*0.5, vx:(Math.random()-0.5)*2.4, vy:2+Math.random()*3.2,
      r:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3, w:6+Math.random()*6, h:3+Math.random()*4, c:colors[Math.floor(Math.random()*colors.length)]}));
    const t0=Date.now();
    const step=()=>{ const t=Date.now()-t0; x.clearRect(0,0,W,H);
      P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.03; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r);
        x.globalAlpha=Math.max(0,1-Math.max(0,t-2600)/900); x.fillStyle=p.c; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore() });
      if(t<3500)requestAnimationFrame(step); else c.remove() };
    requestAnimationFrame(step);
  }catch(e){}
}

/* ---- music: made on the spot, like the sound (no files) ----
   A loop of four chords with a bass line and a plucked figure over it,
   quiet under everything else. Calm between games; during a live game it
   picks up: a beat, a busier figure, and a lift when you're ahead late.
   Each sport has its own key and pace. S.music turns it on (off to begin
   with); it never changes a result. */
const MUSIC={
  football:{root:50, bpm:104, prog:[0,7,9,5]},   // D: I V vi IV
  basketball:{root:53, bpm:112, prog:[0,9,5,7]}, // F: I vi IV V
  hockey:{root:52, bpm:100, prog:[0,5,7,5]},     // E: I IV V IV
  soccer:{root:55, bpm:96, prog:[0,9,5,7]}       // G: I vi IV V
};
let musicT=null, musicBar=0, musicNext=0, musicGain=null;
function musicOn(){ return !!(S&&S.music) }
const mtof=m=>440*Math.pow(2,(m-69)/12);
function musicSpec(){ return MUSIC[(typeof SPORT!=="undefined"&&SPORT.id)||"football"]||MUSIC.football }
function mNote(ac,dest,{m,type="triangle",at,dur,peak,attack=0.01}){
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(mtof(m),at);
  g.gain.setValueAtTime(0.0001,at); g.gain.exponentialRampToValueAtTime(peak,at+attack); g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
  o.connect(g); g.connect(dest); o.start(at); o.stop(at+dur+0.05);
}
function mHit(ac,dest,{at,f,dur,peak,type="highpass"}){
  const s=ac.createBufferSource(), fl=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=noiseBuf(ac,dur+0.05); fl.type=type; fl.frequency.value=f;
  g.gain.setValueAtTime(peak,at); g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
  s.connect(fl); fl.connect(g); g.connect(dest); s.start(at); s.stop(at+dur+0.05);
}
function mKick(ac,dest,at,peak){
  const o=ac.createOscillator(), g=ac.createGain();
  o.frequency.setValueAtTime(140,at); o.frequency.exponentialRampToValueAtTime(45,at+0.14);
  g.gain.setValueAtTime(peak,at); g.gain.exponentialRampToValueAtTime(0.0001,at+0.22);
  o.connect(g); g.connect(dest); o.start(at); o.stop(at+0.25);
}
/* one bar, scheduled ahead of time */
function musicBarAt(ac,t0){
  const M=musicSpec(), inGame=!!(typeof live!=="undefined"&&live&&!live.done);
  const beat=60/(M.bpm*(inGame?1.08:1)), bar=beat*4, deg=M.prog[musicBar%4], root=M.root+deg;
  const minor=deg===9||deg===4, third=root+(minor?3:4), fifth=root+7;
  let lead=0; if(inGame){ const me=live.g.home===S.myTeam; lead=me?live.eng.h-live.eng.a:live.eng.a-live.eng.h }
  const D=musicGain;
  // the pad: the chord, held
  [root,third,fifth].forEach(m=>mNote(ac,D,{m:m+12,type:"triangle",at:t0,dur:bar*0.98,peak:0.05,attack:0.25}));
  // the bass: root on one and three (and the fifth on four in a game)
  mNote(ac,D,{m:root-12,type:"sine",at:t0,dur:beat*1.6,peak:0.16});
  mNote(ac,D,{m:root-12,type:"sine",at:t0+beat*2,dur:beat*1.4,peak:0.13});
  if(inGame)mNote(ac,D,{m:fifth-12,type:"sine",at:t0+beat*3.5,dur:beat*0.5,peak:0.1});
  // the figure: eighth notes through the chord, a different shape each bar
  const shapes=[[0,1,2,1,0,2,1,2],[2,1,0,1,2,1,0,1],[0,2,1,2,0,2,1,0],[1,2,0,2,1,0,2,1]];
  const tones=[root+24,third+24,fifth+24], sh=shapes[musicBar%4];

  for(let i=0;i<n;i++){ const k=inGame?i:i*2;
    mNote(ac,D,{m:tones[sh[k]]+(inGame&&lead>0&&musicBar%8>=4?12:0),type:"square",at:t0+k*beat/2,dur:beat*0.35,peak:inGame?0.022:0.018}) }
  // the beat, in a game: kick on one and three, a snap on two and four, ticks between
  if(inGame){
    mKick(ac,D,t0,0.22); mKick(ac,D,t0+beat*2,0.2);
    mHit(ac,D,{at:t0+beat,f:1800,dur:0.12,peak:0.07,type:"bandpass"}); mHit(ac,D,{at:t0+beat*3,f:1800,dur:0.12,peak:0.07,type:"bandpass"});
    for(let i=0;i<8;i++)mHit(ac,D,{at:t0+i*beat/2,f:7000,dur:0.03,peak:0.025});
  }
  musicBar++;

}
function musicTick(){
  const ac=audio(); if(!ac||!musicOn()){ musicStop(); return }
  if(!musicGain){ musicGain=ac.createGain(); musicGain.gain.value=0.55; const lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=3200;
    musicGain.connect(lp); lp.connect(ac.destination) }
  if(musicNext<ac.currentTime)musicNext=ac.currentTime+0.1;
  while(musicNext<ac.currentTime+1.2){ try{ musicNext+=musicBarAt(ac,musicNext) }catch(e){ musicStop(); return } }
}
function musicStart(){
  if(!musicOn()||musicT)return;
  try{ const ac=audio(); if(!ac)return; musicNext=ac.currentTime+0.1; musicTick(); musicT=setInterval(musicTick,400) }catch(e){}
}
function musicStop(){
  if(musicT){clearInterval(musicT); musicT=null}
  try{ if(musicGain){ const g=musicGain; musicGain=null; g.gain.setTargetAtTime(0.0001,AC.currentTime,0.15); setTimeout(()=>{try{g.disconnect()}catch(e){}},800) } }catch(e){}
}
/* a browser starts sound only after a tap: music that was on last time waits for the first one */
try{ if(typeof document!=="undefined"&&document.addEventListener)
  document.addEventListener("pointerdown",()=>{ if(musicOn()&&soundOn()&&!musicT)musicStart() },{passive:true}) }catch(e){}

function nflStakes(x){
  const {my,opp,wk,left,w,l}=x, out=[];
  const ck=SEA.clinch()[my];
  if(ck==="z")out.push({p:95,tag:"BYE CLINCHED",l:`The 1 seed is yours. The road to the Super Bowl goes through ${esc(my)}.`});
  else if(ck==="y")out.push({p:94,tag:"DIVISION CLINCHED",l:`The ${esc(LEAGUE.conf.names[CONF[my]])} is yours. Now it's about seeding.`});
  else if(ck==="x")out.push({p:93,tag:"PLAYOFFS CLINCHED",l:`You're in. What's left is where you're seeded.`});
  else if(ck==="e")out.push({p:92,tag:"ELIMINATED",l:`Mathematically out. Play spoiler and look at next year.`});
  if(wk>=9&&!ck){
    const f=SEA.seedsNow(), sd=SEA.sideOf(my), i=f[sd].indexOf(my);
    const lead=NAMES.filter(t=>CONF[t]===CONF[my]).sort((a,b)=>SEA._tb(a,b));
    if(i>=0&&i<4)out.push({p:88,tag:"DIVISION",l:`You lead the ${esc(LEAGUE.conf.names[CONF[my]])} with ${left} to play.${i===0?" Right now you'd have the bye.":""}`});
    else if(i>=4)out.push({p:84,tag:"WILD CARD",l:`You hold the No. ${i+1} seed. Every game from here moves you.`});
    else{
      const rest=NAMES.filter(t=>SEA.sideOf(t)===sd&&f[sd].indexOf(t)<0).sort((a,b)=>SEA._tb(a,b));
      const k=rest.indexOf(my);
      if(k>=0&&k<3)out.push({p:86,tag:"BUBBLE",l:`${k===0?"First team out":"Number "+(k+1)+" out"} of the playoff picture. You need this one.`});
    }
    if(CONF[opp]===CONF[my]&&lead[0]!==my&&lead.slice(0,2).indexOf(opp)>=0)
      out.push({p:82,tag:"DIVISION GAME",l:`${esc(opp)} is ahead of you in the division. This one counts twice.`});
  }
  if(w===8&&left<=6)out.push({p:60,tag:"WINNING SEASON",l:`One more win guarantees a winning record.`});
  return out;
}

/* The offseason screen (job offers, staff, contracts, free agency, the

/* next year's payroll before free agency: everyone under contract, plus the
   expiring players you've chosen to re-sign at their asking price */
function nflPlannedPay(){
  const R=U.roster[S.myTeam], P=S.off.picks;
  let pay=R.reduce((s,p,i)=>{if(!p)return s;
    if(P.asks&&P.asks[i])return s+(P.resign[i]?P.asks[i].sal:0);
    return s+p.k.sal},0);
  if(P.trade)pay+=P.trade.sal-P.trade.giveSal;          // an agreed trade counts now
  return pay;
}
/* Trade block: put one player under contract on it and see what teams offer. */
function nflHumans(){return (S.coaches||[]).map((c,i)=>i===(S.turn||0)?S.myTeam:c.myTeam)}
function nflTradeHTML(P){
  const R=U.roster[S.myTeam];
  let h=`<div class="grouphead">Trade block</div>`;

      <div class="cdesc">Goes through when the offseason runs.</div>

    h+=offers.length?offers.map((o,k)=>`<div class="drow">

      :`<div class="note">Nobody is offering anything you need for him.</div>`;

  h+=`<div class="note">Put one player under contract on the block and see what teams offer: a player at one of your weakest spots, worth about the same.</div>`;
  h+=can.map(x=>`<div class="drow"><div class="fmain"><div class="fname">${esc(x.p.n)} <span class="dpos">${esc(x.p.p)}</span></div>

      <button class="skip small" data-tblock="${x.i}">Shop him</button></div>`).join("");
  return h;

/* Your draft board: players you want, in order. At each of your picks you
   take the highest one still there; if none are left, your style picks. */
function nflBoardHTML(P){
  const C=nflDraftClass(U,S.myTeam), byId={}; C.list.forEach(p=>byId[p.pid]=p);
  const board=(P.board||[]).filter(id=>byId[id]);
  const val=p=>p.sr+(p.spot-p.sr)*0.45;
  const row=(p,i,on)=>`<div class="drow">
      <span class="dpick">${on?(i+1)+".":""}</span>
      <div class="fmain"><div class="fname">${esc(p.n)} <span class="dpos">${esc(p.p)}</span></div>
        <div class="fnote">${esc(p.from)} &middot; age ${p.age} &middot; scouts say ~${p.sr}, ceiling ~${p.spot}</div></div>
      <button class="skip small" ${on?`data-bdrm="${p.pid}"`:`data-bdadd="${p.pid}"`}>${on?"Remove":"Add"}</button></div>`;
  let h=`<div class="grouphead">Your draft board</div>`;
  h+=board.length?board.map((id,i)=>row(byId[id],i,true)).join("")
     :`<div class="note">Empty: your draft style will choose. Add players below and you'll take the highest one still there at each of your picks.</div>`;
  const pool=C.list.filter(p=>board.indexOf(p.pid)<0).sort((a,b)=>val(b)-val(a)).slice(0,30);
  h+=`<div class="grouphead">The class &mdash; best 30 by your scouts</div>`+pool.map(p=>row(p,0,false)).join("");
  return h;
}
/* Free agents you want, in order. They get your first look when free agency
   opens, at the asking price plus about 10%, if they fit; then your style
   fills whatever is left. */
function nflTargetsHTML(P,room){
  const pre=nflFreeAgentPreview(U,S.myTeam), byKey={}; pre.forEach(x=>byKey[x.key]=x);
  const mine=(P.targets||[]).filter(k=>byKey[k]);
  let left=room-ROOKIE_ROOM;                        // leave room for the draft class
  const seenPos={};
  const row=(x,on,i)=>{ let fit="";
      // the signing checks the cap after the draft, so the class is already paid for: there is no squeezing it
      // (Instinct: a "squeezing" target then had no room). This room is right on average, within about 5M either
      // way (measured, Nov 2026: the class and the fill-ins vary), so near the line it says so.
      // with the gap in money, so "won't fit" says why (Grokbot: it read "won't fit" with $10.4M of room)
      if(on){left-=x.ask; const gap=`about $${Math.abs(left).toFixed(1)}M`, kept=`after ~$${ROOKIE_ROOM}M kept for the draft class`;
        fit=left>=2?"fits":left>=-3?`close: ${left>=0?gap+" spare":gap+" short"} ${kept}`:`won't fit as things stand: ${gap} short ${kept}`;
        if(seenPos[x.p])fit="you already want a "+x.p+": only one can be signed"; seenPos[x.p]=1}
      return `<div class="drow">
      <span class="dpick">${on?(i+1)+".":""}</span>
      <div class="fmain"><div class="fname">${esc(x.n)} <span class="dpos">${esc(x.p)}</span></div>
        <div class="fnote">${esc(x.team)} &middot; age ${x.age} &middot; rated ${x.r} &middot; about $${x.ask.toFixed(1)}M${on?" &middot; "+fit:""}</div></div>
      <button class="skip small" ${on?`data-fatrm="${esc(x.key)}"`:`data-fatadd="${esc(x.key)}"`}>${on?"Remove":"Add"}</button></div>`};
  let h=`<div class="grouphead">Free agents you want</div>`;
  if(mine.length)h+=`<div class="note">Prices are this summer's asks plus about 10%; a player who improves over the summer can ask more by the time free agency opens.</div>`;
  h+=mine.length?mine.map((k,i)=>row(byKey[k],true,i)).join("")
    :`<div class="note">None yet: your free-agency style will decide. Players you add get your first look, in your order, if you have the room.</div>`;
  const pool=pre.filter(x=>mine.indexOf(x.key)<0).slice(0,25);
  h+=`<div class="grouphead">Likely free agents &mdash; the best 25</div>`+
    (pool.length?pool.map(x=>row(x,false)).join(""):`<div class="note">Nobody worth chasing this year.</div>`);
  return h;
}

/* ============ state ============ */
/* Each game keeps its own save slots. All three games live on one website,
   so they share the browser's storage: the slots used to be shared too, and a
   game could list (and overwrite) another game's saves. College football
   keeps the original keys, so its saves are untouched. */
const SAVE_KEYS={cfb:"fbcoach-v2", nfl:"fbcoach-pro-v2", ncaab:"bbcoach-v1", nba:"bbcoach-pro-v1", nhl:"hkcoach-pro-v1", epl:"sccoach-v1"};
const LEGACY_KEY="fbcoach-v2";
const KEYBASE=SAVE_KEYS[LEAGUE.id]||LEGACY_KEY;
const NSLOTS=3;
let slot=1;
const KEYFOR=n=>KEYBASE+"-slot"+n;
let S={myTeam:null,uStart:null,seasonSeed:0,steps:0,history:[],seed:0,plans:{}};
let plan="balanced", reveal=null, revealTimer=null;
/* ---- hot seat ----
   Several people can share one save, each coaching their own program in the
   same world. Only one is "active" at a time: their state is swapped onto S so
   the rest of the game needs no changes at all. */
const COACH_FIELDS=["myTeam","career","plans","calls","promos","fires","featured","featuredLast","callLedger","deploy","chLog",
                    "history","expNow","readTally"];

function coachCount(){ return (S.coaches&&S.coaches.length)||1 }
function isHotSeat(){ return coachCount()>1 }
function activeCoach(){ return (S.coaches&&S.coaches[S.turn||0])||null }

function stashCoach(){
  if(!S.coaches)return;
  const c=S.coaches[S.turn||0]; if(!c)return;
  COACH_FIELDS.forEach(k=>{c[k]=S[k]});
}
function loadCoach(i){
  if(!S.coaches||!S.coaches[i])return;
  S.turn=i;
  COACH_FIELDS.forEach(k=>{S[k]=S.coaches[i][k]});
  if(!S.history)S.history=[];
}
/* Old single-coach saves become a one-man hot seat. */
function ensureCoaches(){
  if(S.coaches&&S.coaches.length)return;
  S.coaches=[{}]; S.turn=0;
  COACH_FIELDS.forEach(k=>{S.coaches[0][k]=S[k]});
}

let live=null;          // a game being played out right now
let handoffNotes={};    // hot seat: team -> the coach who deferred a game against it

let owlTaps=0;

/* ---- head to head ----
   When two coaches in a hot seat meet, the game is played once, on the later
   coach's turn, and each coach calls their own side. The earlier coach picks
   a plan and hands over without playing. */
function coachIndexOf(team){
  if(!S.coaches)return -1;
  if(team===S.myTeam)return S.turn||0;
  return S.coaches.findIndex((c,i)=>i!==(S.turn||0)&&c.myTeam===team);
}
function opponentOf(g){ return g?(g.home===S.myTeam?g.away:g.home):null }
/* Both coaches' plans and featured players, applied to one game. */
function h2hElo(g,step,oj){
  const keepU=SEA.userTeam, keepF=SEA.featured, oc=S.coaches[oj];
  SEA.userTeam=null; SEA.featured=null; const keepDep=SEA.deploy; SEA.deploy=null;
  const e0=SEA.matchupElo(g,"balanced");
  SEA.userTeam=S.myTeam; SEA.featured=(S.featured===undefined?null:S.featured); SEA.deploy=S.deploy||null;
  const e1=SEA.matchupElo(g,plan);
  SEA.userTeam=oc.myTeam; SEA.featured=(oc.featured===undefined?null:oc.featured); SEA.deploy=oc.deploy||null;
  const e2=SEA.matchupElo(g,(oc.plans&&oc.plans[step])||"balanced");
  SEA.userTeam=keepU; SEA.featured=keepF; SEA.deploy=keepDep;
  return {h:e1.h+e2.h-e0.h, a:e1.a+e2.a-e0.a};
}

/* Answers belong to a season as well as a week. Keyed by step alone, season
   three replays season one's decisions and silently answers everything. */
function callKey(step,year){ return (year||SEA.year)+":"+step; }

function liveSeed(step){
