<style>
:root{--ink:#10131C;--panel:#191E2C;--panel2:#141928;--line:#2A3145;--bone:#E9E5DA;

 --cond:'Barlow Condensed',Impact,sans-serif;--body:'Barlow',system-ui,sans-serif;
 --mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}

 -webkit-font-smoothing:antialiased;padding-bottom:176px}
#app{max-width:760px;margin:0 auto}

.tb-rk{color:var(--sodium);margin-left:6px}

/* What the core needs to know about the sport itself, as words: the two
   assistants every staff has (one for each side of the ball), and the kind
   of up-and-comer a program hires as head coach. A second sport defines
   its own SPORT. */

  id:"football",
  word:"Football",                     // the title screen's wordmark: Football / Coach
  /* what the owl perches on in the logo: the crossbar of a goalpost */

  /* a game worth a headline, or null: {v: how big, txt: "300 yards and 3 touchdowns"} */
  starLine(P,L){
    let v=0,txt="";

    else if((P==="WR"||P==="WR2")&&L.cyd>=140){v=L.cyd*1.6+L.ctd*45;
      txt=`${L.rec} catch${L.rec===1?"":"es"} for ${L.cyd} yards`}
    else if(P==="EDGE"&&L.sck>=2){v=L.sck*90;txt=`${L.sck} sack${L.sck===1?"":"s"}`}
    else if((P==="CB"||P==="S")&&L.ints>=2){v=L.ints*95;txt=`${L.ints} interception${L.ints===1?"":"s"}`}
    return v?{v:v,txt:txt}:null;
  },
  riser:{l:"Rising coordinator",
    d:"Hottest name on the market. Could be the next great one, could be a coordinator forever."}
};

/* position, share of team strength, backup dropoff */
/* hz = share of injuries that land on this spot */
const POS=[
  {p:"QB",  w:0.27, drop:21, hz:0.14},
  {p:"RB",  w:0.07, drop:10, hz:0.13},
  {p:"WR",  w:0.09, drop:11, hz:0.11},
  {p:"WR2", w:0.06, drop:9,  hz:0.09},
  {p:"OT",  w:0.12, drop:12, hz:0.13},
  {p:"EDGE",w:0.11, drop:13, hz:0.10},
  {p:"DT",  w:0.08, drop:10, hz:0.09},
  {p:"LB",  w:0.08, drop:10, hz:0.08},
  {p:"CB",  w:0.07, drop:11, hz:0.08},
  {p:"S",   w:0.05, drop:9,  hz:0.05},
];
function pickInjuredPos(rng){
  let x=rng.r(), acc=0;
  for(let i=0;i<POS.length;i++){acc+=POS[i].hz; if(x<acc)return i}
  return POS.length-1;
}

/* rating <-> Elo: teamRating 45 -> 1150, 82 -> 2050 */
const R_SLOPE=24.3, R_INT=56;
const ratingToElo=r=>R_INT+R_SLOPE*r;
const eloToRating=e=>(e-R_INT)/R_SLOPE;

function playerName(rng){return rng.pick(PNAMES_F)+" "+rng.pick(PNAMES_L)}

/* Twenty players: indices 0-9 start, 10-19 are the backup at the same spot. */
const BK=i=>i+POS.length;

function teamRating(roster){
  let s=0; POS.forEach((P,i)=>{s+=P.w*roster[i].r});
  return s;                                 // starters only
}
function rosterElo(roster){return ratingToElo(teamRating(roster))}

/* Elo cost of losing a starter: the actual drop-off to his backup. */
function injuryCost(roster,idx){
  const P=POS[idx];
  if(!roster||!roster[BK(idx)])return -P.w*P.drop*R_SLOPE;
  const gap=Math.max(3,roster[idx].r-roster[BK(idx)].r);
  return -P.w*gap*R_SLOPE;
}

/* ============ box scores ============ */
/* Stat lines are derived from rating, game flow and scoring, so the numbers a
   player puts up are consistent with how good he is and how the game went. */

const STAT_KEYS={
  QB  :["cmp","att","pyd","ptd","int"],
  RB  :["car","ryd","rtd"],
  WR  :["rec","cyd","ctd"],
  WR2 :["rec","cyd","ctd"],
  OT  :["pan","ska"],
  EDGE:["tkl","sck","tfl"],
  DT  :["tkl","sck","tfl"],
  LB  :["tkl","tfl","pd"],
  CB  :["tkl","pd","ints"],
  S   :["tkl","pd","ints"]
};

function blankStats(pos){
  const o={g:0};
  (STAT_KEYS[pos]||[]).forEach(k=>o[k]=0);
  return o;
}

/* One game's production for one starter. */
function gameStats(rng,pl,posIdx,forPts,oppPts,won){
  const pos=POS[posIdx].p;
  const q=(pl.r-58)/22;                 // roughly -1.3 (poor) .. +1.8 (elite)
  const s={};
  const R=(a,b)=>a+rng.r()*(b-a);
  const pass=forPts*0.60, run=forPts*0.40;

  if(pos==="QB"){
    s.att=Math.max(8,Math.round(R(24,38)+(won?-2:4)));
    const pct=Math.max(0.38,Math.min(0.78,0.545+q*0.055+rng.gauss(0,0.05)));
    s.cmp=Math.round(s.att*pct);
    s.pyd=Math.max(0,Math.round(s.cmp*(10.4+q*1.5+rng.gauss(0,1.4))));
    s.ptd=Math.max(0,Math.round(pass/7*R(0.55,1.0)+ (q>1?rng.r():0)));
    s.int=Math.max(0,Math.round(R(0,1.9)-q*0.55+(won?-0.2:0.35)));
  } else if(pos==="RB"){
    s.car=Math.max(4,Math.round(R(13,23)+(won?4:-3)));
    s.ryd=Math.max(-5,Math.round(s.car*(3.9+q*0.85+rng.gauss(0,0.9))));
    s.rtd=Math.max(0,Math.round(run/7*R(0.45,0.95)));
  } else if(pos==="WR"||pos==="WR2"){
    const share=pos==="WR"?R(0.26,0.38):R(0.15,0.24);
    s.rec=Math.max(0,Math.round(R(3,9)*(0.8+q*0.22)));
    s.cyd=Math.max(0,Math.round(s.rec*(12.8+q*2.4+rng.gauss(0,2))));
    s.ctd=Math.max(0,Math.round(pass/7*share*R(0.8,1.6)));
  } else if(pos==="OT"){
    s.pan=Math.max(0,Math.round(R(2,7)+q*2));
    s.ska=Math.max(0,Math.round(R(0,2.2)-q*0.6));
  } else if(pos==="EDGE"){
    s.tkl=Math.max(0,Math.round(R(2,5.5)+q*0.7));
    s.sck=(rng.r()<0.34+q*0.15?1:0)+(rng.r()<0.09+q*0.06?1:0);
    s.tfl=s.sck+(rng.r()<0.30+q*0.12?1:0);
  } else if(pos==="DT"){
    s.tkl=Math.max(0,Math.round(R(2,5)+q*0.6));
    s.sck=(rng.r()<0.20+q*0.09?1:0);
    s.tfl=s.sck+(rng.r()<0.24+q*0.10?1:0);
  } else if(pos==="LB"){
    s.tkl=Math.max(1,Math.round(R(5,11)+q*1.3));
    s.tfl=(rng.r()<0.42+q*0.15?1:0)+(rng.r()<0.10+q*0.05?1:0);
    s.pd=(rng.r()<0.28+q*0.09?1:0);
  } else {                                   // CB, S
    s.tkl=Math.max(0,Math.round(R(2,6)+q*0.6));
    s.pd=(rng.r()<0.42+q*0.14?1:0)+(rng.r()<0.14+q*0.07?1:0);
    s.ints=(rng.r()<0.155+q*0.055?1:0);
  }
  return s;
}

function addStats(dst,src){
  dst.g=(dst.g||0)+1;
  Object.keys(src).forEach(k=>dst[k]=(dst[k]||0)+src[k]);
}

/* Human-readable season line. */
function statLine(pos,s){
  if(!s||!s.g)return "";
  const n=x=>x.toLocaleString();
  if(pos==="QB")return `${n(s.pyd)} yds, ${s.ptd} TD, ${s.int} INT (${s.cmp}/${s.att})`;
  if(pos==="RB")return `${n(s.ryd)} yds, ${s.rtd} TD (${s.car} car)`;
  if(pos==="WR"||pos==="WR2")return `${s.rec} rec, ${n(s.cyd)} yds, ${s.ctd} TD`;
  if(pos==="OT")return `${s.pan} pancakes, ${s.ska} sacks allowed`;
  if(pos==="EDGE"||pos==="DT")return `${s.tkl} tkl, ${s.sck} sacks, ${s.tfl} TFL`;
  if(pos==="LB")return `${s.tkl} tkl, ${s.tfl} TFL, ${s.pd} PD`;
  return `${s.tkl} tkl, ${s.ints} INT, ${s.pd} PD`;
}

/* Award production, built from what a player actually did. */
function statProd(pos,s){
  if(!s||!s.g)return 0;
  if(pos==="QB")  return s.pyd*0.042 + s.ptd*4.4 - s.int*3.0;
  if(pos==="RB")  return s.ryd*0.062 + s.rtd*4.6;
  if(pos==="WR")  return s.cyd*0.060 + s.ctd*4.6 + s.rec*0.32;
  if(pos==="WR2") return s.cyd*0.046 + s.ctd*3.4;
  if(pos==="OT")  return s.pan*0.55 - s.ska*0.9;
  if(pos==="EDGE")return s.sck*5.2 + s.tfl*1.9 + s.tkl*0.30;
  if(pos==="DT")  return s.sck*4.6 + s.tfl*1.7 + s.tkl*0.28;
  if(pos==="LB")  return s.tkl*0.55 + s.tfl*2.1 + s.pd*1.1;
  return s.ints*7.2 + s.pd*1.7 + s.tkl*0.38;
}

/* ============ storage ============ */
/* Where saves live. Inside Claude's artifact viewer that is window.storage;
   anywhere else (the published site, a file opened locally) it is the
   browser's localStorage. The shared league table needs window.storage and
   is simply unavailable elsewhere. Every call resolves; failures resolve to
   null rather than throwing. */
const store=(function(){
  const claude=()=>{try{return (window.storage&&typeof window.storage.get==="function")?window.storage:null}catch(e){return null}};
  const local=()=>{try{const L=window.localStorage||localStorage, t="__fc_probe";
    L.setItem(t,"1"); L.removeItem(t); return L}catch(e){return null}};
  return {
    kind(){ return claude()?"claude":local()?"browser":"none" },
    async get(k,shared){
      const W=claude(); if(W){try{return await W.get(k,shared)}catch(e){return null}}
      const L=!shared&&local(); if(!L)return null;
      const v=L.getItem(k); return v===null?null:{key:k,value:v};
    },
    async set(k,v,shared){
      const W=claude(); if(W){try{return await W.set(k,v,shared)}catch(e){return null}}
      const L=!shared&&local(); if(!L)return null;
      try{L.setItem(k,v); return {key:k,value:v}}catch(e){return null}      // full, or blocked
    },
    async delete(k,shared){
      const W=claude(); if(W){try{return await W.delete(k,shared)}catch(e){return null}}
      const L=!shared&&local(); if(!L)return null;
      L.removeItem(k); return {key:k,deleted:true};
    },
    async list(prefix,shared){
      const W=claude(); if(W){try{return await W.list(prefix,shared)}catch(e){return null}}
      const L=!shared&&local(); if(!L)return null;
      const keys=[]; for(let i=0;i<L.length;i++){const k=L.key(i); if(!prefix||k.indexOf(prefix)===0)keys.push(k)}
      return {keys:keys,prefix:prefix};
    }
  };
})();

/* Saves are compressed with LZW: the JSON is turned into UTF-8 bytes, the
   byte string is LZW-coded (codes 0-255 bytes, 256 end of data, dictionary
   from 257, up to 15 bits), and the bits are packed 15 to a UTF-16 character
   (offset past the control range, never a surrogate), a string any store
   accepts. Old saves, plain JSON, still load. */
const SAVE_TAG="LZW1:";
/* codes are looked up by number (previous code * 256 + next byte) and written
   whole, 15 bits to a character; same output as the plain bit-by-bit version */
function lzwPack(str){
  const bytes=unescape(encodeURIComponent(str));
  const END=256, dict=new Map(); let next=257, bits=9, w=-1, acc=0, nacc=0; const out=[];
  // append a whole code at once; flush 15 bits at a time (acc never exceeds 30 bits)
  const emit=code=>{ acc=(acc<<bits)|code; nacc+=bits;
    while(nacc>=15){ nacc-=15; out.push(String.fromCharCode(((acc>>>nacc)&0x7fff)+32)); acc&=(1<<nacc)-1 } };
  for(let i=0;i<bytes.length;i++){
    const c=bytes.charCodeAt(i);
    if(w<0){w=c;continue}
    const key=w*256+c, hit=dict.get(key);
    if(hit!==undefined){w=hit;continue}
    emit(w);
    if(next<32767){dict.set(key,next++); if(next>(1<<bits)&&bits<15)bits++}
    w=c;
  }
  if(w>=0)emit(w);
  emit(END);
  if(nacc>0)out.push(String.fromCharCode(((acc<<(15-nacc))&0x7fff)+32));
  return SAVE_TAG+out.join("");
}
function lzwUnpack(s){
  if(s.indexOf(SAVE_TAG)!==0)return s;                 // an old, uncompressed save
  s=s.slice(SAVE_TAG.length);
  const END=256, dict=[]; let next=257, bits=9, pos=0, cur=0, ncur=0; const out=[];
  const read=()=>{let v=0;for(let b=0;b<bits;b++){ if(ncur===0){ if(pos>=s.length)return -1; cur=s.charCodeAt(pos++)-32; ncur=15 }
      v=(v<<1)|((cur>>(--ncur))&1)} return v};
  let prev=null;
  while(true){
    const c=read(); if(c<0||c===END)break;
    let e;
    if(c<256) e=String.fromCharCode(c);
    else if(dict[c]!==undefined) e=dict[c];
    else if(c===next&&prev!==null) e=prev+prev[0];
    else throw new Error("save data is damaged");
    out.push(e);
    if(prev!==null&&next<32767){dict[next++]=prev+e[0]; if(next>=(1<<bits)&&bits<15)bits++}
    prev=e;
  }
  return decodeURIComponent(escape(out.join("")));
}
/* ============ RNG ============ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
class RNG{
  constructor(seed){this.f=mulberry32(seed);this.sp=null}
  r(){return this.f()}
  int(n){return Math.floor(this.f()*n)}
  range(a,b){return a+this.f()*(b-a)}
  pick(a){return a[this.int(a.length)]}
  gauss(m,s){
    if(this.sp!==null){const v=this.sp;this.sp=null;return m+s*v}
    let u=0,v=0;while(u===0)u=this.f();while(v===0)v=this.f();
    const R=Math.sqrt(-2*Math.log(u));this.sp=R*Math.sin(2*Math.PI*v);
    return m+s*R*Math.cos(2*Math.PI*v)}
  shuffle(a){for(let i=a.length-1;i>0;i--){const j=this.int(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
}

/* ============ home fields ============ */
/* Not every stadium is the same place. A handful are genuinely miserable to
   visit; most are ordinary; some are half empty in November. */

function homeField(u,t){
  if(LEAGUE.homeField)return LEAGUE.homeField(u,t);
  const prog=(u&&u.program&&u.program[t])!==undefined?u.program[t]:1500;
  const base=39+Math.max(0,Math.min(1,(prog-1150)/900))*30;
  return Math.round(base+(LEAGUE.venues[t]||8));
}

function venueLabel(v){
  if(v>=88)return "one of the hardest places to play in the country";
  if(v>=76)return "a genuinely hostile road trip";
  if(v>=64)return "a real home-field edge";
  if(v>=52)return "a normal road game";
  return "not a difficult place to visit";
}

/* ============ team identity ============ */
function _hx(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function _lum(c){const [r,g,b]=c.map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*r+.7152*g+.0722*b}
function _mix(c,t,p){return c.map((v,i)=>Math.round(v+(t[i]-v)*p))}
const _READ={};
function teamColor(t){                    // raw brand color
  return LEAGUE.colors[t]||"#F4A63A";
}
function teamInk(t){                      // brand color, lightened until legible on dark
  if(_READ[t])return _READ[t];
  let c=_hx(LEAGUE.colors[t]||"#F4A63A"), p=0;
  while(_lum(c)<0.30&&p<0.85){p+=0.08;c=_mix(_hx(LEAGUE.colors[t]||"#F4A63A"),[255,255,255],p)}
  const out="#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");
  _READ[t]=out; return out;
}

/* ============ constants ============ */
const K=32;                  // Elo update factor

function divisionOf(u,t){
  const c=(u&&u.conf&&u.conf[t])||CONF[t];
  const D=LEAGUE.conf.divisions[c]; if(!D)return null;
  for(const k in D)if(D[k].indexOf(t)>=0)return k;
  // a newcomer joins whichever side is thinner
  const sizes=Object.keys(D).map(k=>[k,D[k].length]).sort((a,b)=>a[1]-b[1]);
  D[sizes[0][0]].push(t);
  return sizes[0][0];
}
function hasDivisions(c){return !!LEAGUE.conf.divisions[c]}
function divisionNames(c){return LEAGUE.conf.divisions[c]?Object.keys(LEAGUE.conf.divisions[c]).sort():[]}
const NAMES=LEAGUE.teams.map(t=>t[0]);
let CONF=Object.fromEntries(LEAGUE.teams.map(t=>[t[0],t[2]]));
function syncConf(u){
  if(u&&u.conf)NAMES.forEach(t=>{if(u.conf[t])CONF[t]=u.conf[t]});
  else if(u){u.conf={};NAMES.forEach(t=>u.conf[t]=CONF[t])}
}

/* ============ Elo ============ */
/* Games are played by the sport layer's drive engine (playGame). */
function eloUpdate(eW,eL,mAbs,winHome,neutral){
  const hfa=neutral?0:LEAGUE.tuning.hfa;
  const diff=winHome?(eW+hfa-eL):(eW-eL-hfa);
  const exp=1/(1+Math.pow(10,-diff/400));
  const mov=Math.log(mAbs+1)*(2.2/(0.001*diff+2.2));
  return K*mov*(1-exp);
}

/* ============ talent ============ */
const INJ_HAZARD=0.085,QB_SHARE=0.18,DEV_SD=4.2,AR_SD=5,AR_DECAY=0.8,
      COLLAPSE_P=0.018,BREAKOUT_P=0.018;
const BODY=["OL","WR1","RB1","EDGE","CB1","LB","TE","S"];
function iscale(r){return 0.70+0.45*Math.max(0,Math.min(1,(r-1150)/900))}

class Talent{
  constructor(rng,base,roster){
    this.rng=rng;this.base=Object.assign({},base);
    this.roster=roster||null;
    this.slope={};this.ar={};this.inj={};this.log={};
    NAMES.forEach(t=>{this.slope[t]=rng.gauss(0,DEV_SD);this.ar[t]=0;
      this.inj[t]=[];this.log[t]=[]});
  }
  eff(t,w){
    let s=0; this.inj[t].forEach(e=>{if(e.w>0)s+=e.m});
    return this.base[t]+this.slope[t]*w+this.ar[t]+s;
  }
  active(t){return this.inj[t].filter(e=>e.w>0)}
  advance(w){
    const r=this.rng;
    NAMES.forEach(t=>{
      this.inj[t].forEach(e=>e.w--);
      this.inj[t].filter(e=>e.w<=0).forEach(e=>
        this.log[t].push({wk:w,kind:"back",what:e.k,mag:0}));
      this.inj[t]=this.inj[t].filter(e=>e.w>0);
      const sc=iscale(this.base[t]);
      if(r.r()<INJ_HAZARD){
        if(this.roster){
          // pick a starter, weighted toward the positions that take hits
          const idx=pickInjuredPos(r);
          const pl=this.roster[t][idx];
          if(!this.inj[t].some(e=>e.idx===idx)){
            const sev=r.r();
            const wk=sev<0.12?14:r.pick([1,2,2,3,4,5,6]);
            const m=injuryCost(this.roster[t],idx)*r.range(1.05,2.1);
            this.inj[t].push({m:m,w:wk,k:pl.p,idx:idx,who:pl.n,rating:pl.r});
            this.log[t].push({wk:w,kind:"injury",what:pl.p,who:pl.n,
                              mag:Math.round(m),weeks:wk});
          }
        }else{
          let m,wk,k;
          if(r.r()<QB_SHARE){m=-r.range(85,190)*sc;wk=r.pick([2,3,4,5,6,14]);k="QB1"}
          else{m=-r.range(20,75)*sc;wk=r.pick([1,2,2,3,4,6]);k=r.pick(BODY)}
          this.inj[t].push({m:m,w:wk,k:k});
          this.log[t].push({wk:w,kind:"injury",what:k,mag:Math.round(m),weeks:wk});
        }
      }
      if(r.r()<COLLAPSE_P){const d=-r.range(40,110)*sc;this.base[t]+=d;
        this.log[t].push({wk:w,kind:"collapse",what:"locker room",mag:Math.round(d)})}
      else if(r.r()<BREAKOUT_P){const d=r.range(35,95)*sc;this.base[t]+=d;
        this.log[t].push({wk:w,kind:"breakout",what:"scheme unlock",mag:Math.round(d)})}
      this.ar[t]=this.ar[t]*AR_DECAY+r.gauss(0,AR_SD);
    });
  }
}

"Mahoney","Salazar","Tuiasosopo","Ferentz","Lindgren","Abara","Doucet","Yarborough",

let COACH_ID=1;
function newCoach(rng,prestige){
  // better programs attract better coaches
  const tier=Math.max(0,Math.min(1,(prestige-1150)/900));
  const q=rng.gauss(-24+tier*52, 26);
  return {id:COACH_ID++, n:rng.pick(FIRST)+" "+rng.pick(LAST),
          q:Math.round(Math.max(-58,Math.min(68,q))), t:0, hired:true,
          w:0,l:0,titles:0,confs:0,fired:0,stops:[]};
}

/* Roll a season's results into every coach's career. */
function recordCoaches(u,rec,champion,confChamps,year){
  u.coachLog=u.coachLog||{};
  NAMES.forEach(t=>{
    const c=u.coach[t]; if(!c)return;
    if(c.w===undefined){c.w=0;c.l=0;c.titles=0;c.confs=0;c.fired=0;c.stops=[]}
    if(!c.stops.length||c.stops[c.stops.length-1].team!==t)
      c.stops.push({team:t,from:year,to:year,w:0,l:0,titles:0});
    const st=c.stops[c.stops.length-1];
    c.w+=rec[t][0]; c.l+=rec[t][1];
    st.w+=rec[t][0]; st.l+=rec[t][1]; st.to=year;
    if(champion===t){c.titles++; st.titles++}
    if(confChamps&&Object.values(confChamps).indexOf(t)>=0)c.confs++;
  });
}

/* Snapshot of everyone currently employed, for browsing. */
function coachTable(u){
  const out=[];
  NAMES.forEach(t=>{
    const c=u.coach[t]; if(!c)return;
    out.push({team:t,n:c.n,q:c.q,t:c.t,you:!!c.you,
      w:c.w||0,l:c.l||0,titles:c.titles||0,confs:c.confs||0,
      stops:(c.stops||[]).slice()});
  });
  return out;
}

function coachGrade(q){
  if(q>=38)return "elite";
  if(q>=18)return "strong";
  if(q>=-5)return "solid";
  if(q>=-25)return "shaky";
  return "overmatched";
}

/* ============ decisions ============ */
const ARCHETYPES=[
 {k:"proven", l:"Proven winner",  bump:16, sd:16,
  d:"Has won at this level before. Expensive, and the expectations arrive with him."},
 {k:"riser",  l:SPORT.riser.l, bump:2, sd:36, d:SPORT.riser.d},
 {k:"builder",l:"Program builder", bump:-4, sd:19, rec:9,
  d:"Wins on the recruiting trail before he wins on Saturdays. Slow burn, high floor."},
 {k:"retread",l:"Veteran retread", bump:-7, sd:11,
  d:"Been fired twice. Knows exactly what he is, and so does everyone else."}
];

function coachCandidates(rng,prestige){
  const tier=Math.max(0,Math.min(1,(prestige-1150)/900));
  const pool=rng.shuffle(ARCHETYPES.slice()).slice(0,3);
  return pool.map(A=>{
    const q=Math.round(Math.max(-58,Math.min(68,
      rng.gauss(-24+tier*52+A.bump, A.sd))));
    // scouting is imperfect: you see a noisy read, not the number
    const seen=q+rng.gauss(0,13);
    return {n:rng.pick(FIRST)+" "+rng.pick(LAST), q:q, arch:A.k, al:A.l, d:A.d,
            rec:A.rec||0, grade:coachGrade(seen)};
  });
}

const PHILOSOPHY={
  win_now: {l:"Win now",  d:"Veterans get every rep. Better this year, thinner next.",
            elo:44, dev:-3.0},
  balanced:{l:"Balanced", d:"Play the best guy at every spot.", elo:0, dev:0},
  build:   {l:"Build",    d:"Young players play through mistakes. Costs you this year.",
            elo:-38, dev:3.2}
};

/* ============ your coaching career ============ */
/* You are the head coach, not the athletic director. You get hired, you get
   fired, and your record follows you to the next job. */
function repGrade(r){
  if(r>=46)return "a national name";
  if(r>=26)return "a hot commodity";
  if(r>=8)return "well regarded";
  if(r>=-10)return "unproven";
  if(r>=-28)return "a hard sell";
  return "radioactive";
}

/* Which jobs would take you, given what you've done. */
function jobMarket(u,rng,rep,openings,current){
  const ceiling=1300+Math.max(0,rep+40)*10;      // reputation opens bigger doors
  const floor=Math.max(1120,ceiling-620);
  const opts=openings.filter(t=>t!==current)
    .filter(t=>u.program[t]<=ceiling&&u.program[t]>=floor)
    .sort((a,b)=>u.program[b]-u.program[a]);
  const picked=[];
  if(opts.length)picked.push(opts[0]);
  if(opts.length>2)picked.push(opts[Math.floor(opts.length/2)]);
  if(opts.length>1)picked.push(opts[opts.length-1]);
  return [...new Set(picked)].slice(0,3);
}

/* Bigger programs come calling when you overperform at a small one. */
function poachOffers(u,rng,rep,openings,current){
  if(rep<18)return [];
  const mine=u.program[current];
  return openings.filter(t=>t!==current&&u.program[t]>mine+150
    &&u.program[t]<=1240+Math.max(0,rep+30)*12)
    .sort((a,b)=>u.program[b]-u.program[a]).slice(0,2);
}

function repDelta(wins,losses,expWins,program,titles){
  const wp=wins/Math.max(1,wins+losses);
  let d=(wins-expWins)*1.7;
  if(titles.natl)d+=22;
  else if(titles.playoff)d+=8;
  else if(titles.conf)d+=6;
  if(wp<0.34&&wins<expWins)d-=6;   // only if you also missed the mark
  // winning at a small program counts for more
  d*= program<1500?1.25 : program>1850?0.82 : 1.0;
  return d;
}

/* ============ program continuity ============ */
const COACH_ONFIELD=0.55,  // how much coach quality shows up on the field
      COACH_BUILD=0.34,    // how much it compounds into the program each year
      ROOKIE_DIP=-22;
const ROSTER_NOISE=48;
const CARRY=0.45,CHURN_SD=95,RECRUIT=0.16,PROG_NOISE=22,
      // program strength's range: a league may set its own (basketball's is wider)
      P_FLOOR=(LEAGUE.tuning&&LEAGUE.tuning.pFloor)||1120,P_CEIL=(LEAGUE.tuning&&LEAGUE.tuning.pCeil)||2010,HOT_SEAT=0.42,COACH_SD=62,COACH_DIP=-18,PERCEPT_N=34;

function newUniverse(seed){
  const rng=new RNG(seed);
  const u={seed:seed,year:2026,program:{},perceived:{},trueBase:{},
           tenure:{},bad:{},history:[],rng:seed};
  u.coach={}; u.roster={}; u.oc={}; u.dc={}; u.conf={};
  u.nextRealign=2026+4+rng.int(4);
  LEAGUE.teams.forEach(t=>u.conf[t[0]]=t[2]);
  LEAGUE.teams.forEach(([n,e])=>{
    u.program[n]=e; u.perceived[n]=e;
    u.roster[n]=LEAGUE.offseason.newRoster(rng,e);
    u.oc[n]=newCoordinator(rng,e,"oc"); u.dc[n]=newCoordinator(rng,e,"dc");
    u.trueBase[n]=rosterElo(u.roster[n])+rng.gauss(0,26);
    u.tenure[n]=1+rng.int(6); u.bad[n]=0;
    const c=newCoach(rng,e); c.t=u.tenure[n]; c.hired=false;
    u.coach[n]=c;
  });
  u._rngState=seed*7919+13;
  return u;
}

function seatHeat(u,rec,elo,t){
  // expectation is the program's own baseline; heat is falling short of it repeatedly
  const w=rec[t][0], l=rec[t][1], wp=w/Math.max(1,w+l);
    const shortfall=(u.program[t]-elo[t])/45;
  let heat=u.bad[t]*1.4 + Math.max(0,shortfall) + (wp<HOT_SEAT?1.2:0);
  if(u.coach[t]&&u.coach[t].t<=1)heat-=1.6;         // rookies get a grace year
  if(u.coach[t]&&u.coach[t].q>=30)heat-=0.6;
  return heat;
}

/* Offseason runs in two acts so the player can decide in between.
   Act 1: the coaching carousel. Act 2: rosters, recruiting, development. */
/* The coaching carousel, once per offseason for the whole league.
   users: {team: fired} for every team a person coaches, fired meaning they
   have missed expectations two years running (decided from their grades,
   see openOffseason). A person's job is theirs to lose that way, never the
   carousel's. Each person's part comes back in the ...By maps; the plain
   userOpen/staffOpen/candidates are the first user's, for one-coach games. */
function offseasonCoaching(u,rng,rec,elo,users){
  users=users||{};
  const isUser=t=>Object.prototype.hasOwnProperty.call(users,t);
  const userTeam=Object.keys(users)[0];
  const fired=[],hires=[],poached=[];
  if(!u.coach){u.coach={};NAMES.forEach(t=>{u.coach[t]=newCoach(rng,u.program[t]);u.coach[t].hired=false})}

  NAMES.forEach(t=>{
    const wp=rec[t][0]/Math.max(1,rec[t][0]+rec[t][1]);
    u.bad[t]= wp<HOT_SEAT ? u.bad[t]+1 : 0;
    if(u.coach[t]&&u.coach[t].you){
      if(isUser(t)&&users[t]){fired.push(t);u.bad[t]=0}
      return;
    }
    const heat=seatHeat(u,rec,elo,t);
    const change=(heat>=4.6)||(wp<0.25&&u.coach[t].t>=2);
    if(change&&rng.r()<0.82){fired.push(t);u.bad[t]=0}
  });

  const openings=fired.slice().sort((a,b)=>u.program[b]-u.program[a]);
  openings.forEach(job=>{
    if(isUser(job))return;                        // a person's job: they're told, then it's filled
    if(rng.r()>0.42)return;
    const cands=NAMES.filter(t=>fired.indexOf(t)<0 && !u.coach[t].you && u.coach[t].q>=22
      && u.program[t] < u.program[job]-140 && u.coach[t].t>=2
      && rec[t][0]>=rec[t][1]);
    if(!cands.length)return;
    cands.sort((a,b)=>u.coach[b].q-u.coach[a].q);
    const from=cands[0], c=u.coach[from];
    poached.push({to:job,from:from,name:c.n,q:c.q});
    u.coach[job]=Object.assign({},c,{t:0,hired:true});   // his record travels with him
    u.coach[from]=newCoach(rng,u.program[from]);
    hires.push({team:from,name:u.coach[from].n,q:u.coach[from].q,reason:"replacing "+c.n});
    fired.splice(fired.indexOf(job),1);
    if(fired.indexOf(from)<0)fired.push(from);
  });

  // a hot coordinator can be the man a program hires
  const coordMoves=[];
  fired.slice().forEach(job=>{
    if(isUser(job))return;
    if(rng.r()>0.30)return;
    const pool=NAMES.filter(t=>fired.indexOf(t)<0 && u.oc[t] && u.oc[t].q>=26
      && u.program[t] < u.program[job]+90);
    if(!pool.length)return;
    const from=rng.pick(pool);
    const side=(u.dc[from]&&u.dc[from].q>u.oc[from].q)?"dc":"oc";
    const co=side==="oc"?u.oc[from]:u.dc[from];
    if(!co||co.q<26)return;
    coordMoves.push({name:co.n,from:from,to:job,side:side});
    u.coach[job]={id:COACH_ID++,n:co.n,q:Math.round(co.q*0.85),t:0,hired:true,
                  w:0,l:0,titles:0,confs:0,fired:0,stops:[]};
    const fresh=newCoordinator(rng,u.program[from],side);
    if(side==="oc")u.oc[from]=fresh; else u.dc[from]=fresh;
    fired.splice(fired.indexOf(job),1);
  });

  const userOpenBy={}, candidatesBy={}, staffOpenBy={};
  Object.keys(users).forEach(t=>{userOpenBy[t]=fired.indexOf(t)>=0; staffOpenBy[t]={oc:false,dc:false}});
  const openJobs=fired.slice();
  Object.keys(users).forEach(t=>{candidatesBy[t]=userOpenBy[t]?coachCandidates(rng,u.program[t]):null});

  fired.forEach(t=>{
    if(isUser(t))return;                          // a person's job, not an AI hire
    if(u.coach[t].hired&&u.coach[t].t===0)return;
    const old=u.coach[t].n;
    u.coach[t]=newCoach(rng,u.program[t]);
    hires.push({team:t,name:u.coach[t].n,q:u.coach[t].q,reason:"replacing "+old});
  });

  // ordinary staff churn everywhere else
  NAMES.forEach(t=>{
    ["oc","dc"].forEach(side=>{
      const st=side==="oc"?u.oc:u.dc;
      if(!st[t]){st[t]=newCoordinator(rng,u.program[t],side);return}
      st[t].t=(st[t].t||0)+1;
      const leaves = st[t].q>=34 ? rng.r()<0.20 : (st[t].q<=-26 ? rng.r()<0.30 : rng.r()<0.09);
      if(leaves){
        if(isUser(t)){staffOpenBy[t][side]=true;}
        else st[t]=newCoordinator(rng,u.program[t],side);
      }
    });
  });

  return {fired:fired,hires:hires,poached:poached,openJobs:openJobs,coordMoves:coordMoves,
          userOpenBy:userOpenBy,staffOpenBy:staffOpenBy,candidatesBy:candidatesBy,
          userOpen:!!userOpenBy[userTeam],candidates:candidatesBy[userTeam]||null,
          staffOpen:staffOpenBy[userTeam]||{oc:false,dc:false}};
}

/* ============ coordinators ============ */
/* Two assistants per program. They shift the team on the field and shape how
   their side of the ball develops — and the good ones get poached. */
const OFF_SHARE=0.61, DEF_SHARE=0.39;      // matches the positional weights
const STAFF_ELO=0.62;                      // Elo per point of coordinator quality

const OC_STYLE=["Air raid","Pro-style","Spread option","Run-heavy","RPO"];
const DC_STYLE=["3-4 attacking","4-2-5 nickel","Bend-don't-break","Blitz-heavy","Cover 3"];

function newCoordinator(rng,prestige,side,repBonus){
  const tier=Math.max(0,Math.min(1,(prestige-1150)/900));
  const q=rng.gauss(-20+tier*44+(repBonus||0), 24);
  return {n:rng.pick(FIRST)+" "+rng.pick(LAST),
          q:Math.round(Math.max(-52,Math.min(62,q))), t:0,
          s:rng.pick(side==="oc"?OC_STYLE:DC_STYLE)};
}

function staffElo(u,t){
  if(!u.oc||!u.dc||!u.oc[t]||!u.dc[t])return 0;
  return (u.oc[t].q*OFF_SHARE + u.dc[t].q*DEF_SHARE)*STAFF_ELO;
}

function coordGrade(q){
  if(q>=40)return "one of the best in the country";
  if(q>=20)return "highly regarded";
  if(q>=2)return "solid";
  if(q>=-20)return "unproven";
  return "in over his head";
}

function coordCandidates(rng,prestige,side,rep){
  return [0,1,2].map(()=>{
    const c=newCoordinator(rng,prestige,side,(rep||0)*0.22);
    c.grade=coordGrade(c.q+rng.gauss(0,11));    // scouting is imperfect here too
    return c;
  });
}
/* ============ power ranking: pro football ============ */
/* No poll. Teams are ranked the way people actually rank them in the pros:
   record first, then how good they look. The core asks any ranking for
   order(), rankMap() and update(results, elo). */
class PowerRank{
  constructor(pre){
    this.elo=Object.assign({},pre); this.w={}; this.l={};
    NAMES.forEach(t=>{this.w[t]=0;this.l[t]=0});
  }
  pct(t){const g=this.w[t]+this.l[t]; return g?this.w[t]/g:0.5}
  order(){
    return NAMES.slice().sort((a,b)=>{
      const ga=this.w[a]+this.l[a], gb=this.w[b]+this.l[b];
      // early on, how good a team is outweighs a 1-0 start
      const k=Math.min(1,Math.max(ga,gb)/6);
      const sa=k*this.pct(a)*400+this.elo[a], sb=k*this.pct(b)*400+this.elo[b];
      return sb-sa;
    });
  }
  rankMap(){const o=this.order(),m={};o.forEach((t,i)=>m[t]=i+1);return m}
  update(res,elo){
    res.forEach(r=>{this.w[r.winner]++; this.l[r.loser]++});
    NAMES.forEach(t=>{this.elo[t]=elo[t]});
    return this.rankMap();
  }
}
LEAGUE.Ranking=PowerRank;
/* ============ schedule: pro football ============ */
/* The league's rotation formula. Every team plays 17 games:
     6  home and away against its three division rivals
     4  against one division in its own conference (3-year rotation)
     4  against one division in the other conference (4-year rotation)
     2  against the same-place teams of the other two own-conference divisions
     1  against a same-place team of an other-conference division (the 17th)
   "Same place" uses the ratings coming into the season as the finishing
   order. Weeks are assigned as an edge colouring, 18 weeks with one bye each,
   repaired with Kempe-chain swaps; byes are then pushed into weeks 5-14. */
function nflPairings(R,year){
  const side=LEAGUE.conf.sides, A=side.AFC, N=side.NFC;
  const members=d=>NAMES.filter(t=>CONF[t]===d).sort((x,y)=>R[y]-R[x]);   // by place
  const M={}; A.concat(N).forEach(d=>M[d]=members(d));
  const g=[];                                   // [away, home, divisionGame]
  const flip=year%2;
  // division: home and away
  A.concat(N).forEach(d=>{const m=M[d];
    for(let i=0;i<m.length;i++)for(let j=i+1;j<m.length;j++){g.push([m[i],m[j],true]);g.push([m[j],m[i],true])}});
  // four against a whole division: A[j] hosts B[j], B[j+1]; visits B[j+2], B[j+3]
  const fourVsFour=(da,db,swap)=>{const a=M[da],b=M[db];
    for(let j=0;j<4;j++)for(let k=0;k<4;k++){
      const off=(k-j+4)%4, aHome=(off<2)!==swap;
      g.push(aHome?[b[k],a[j],false]:[a[j],b[k],false]);
    }};
  const intra=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]][year%3];
  [A,N].forEach(S=>intra.forEach(([x,y])=>fourVsFour(S[x],S[y],!!flip)));
  const k4=year%4;
  for(let i=0;i<4;i++)fourVsFour(A[i],N[(i+k4)%4],!!((i+year)%2));
  // same place, own conference: the two divisions not in this year's
  // pairing. Those four cross pairs form a cycle; walking it gives every
  // division one home and one away.
  [A,N].forEach(S=>{
    const [[p0,p1],[q0,q1]]=intra;                 // cycle p0 - q0 - p1 - q1 - p0
    const cyc=[[p0,q0],[q0,p1],[p1,q1],[q1,p0]];
    for(let p=0;p<4;p++)cyc.forEach(([i,j])=>{
      const a=M[S[i]][p], b=M[S[j]][p], aHome=((p+year)%2)===0;
      g.push(aHome?[b,a,false]:[a,b,false]);
    });
  });
  // the 17th: same place against the other conference, one division over
  for(let i=0;i<4;i++){
    const nd=N[(i+k4+2)%4];
    for(let p=0;p<4;p++){
      const a=M[A[i]][p], b=M[nd][p];
      g.push(flip?[b,a,false]:[a,b,false]);           // AFC hosts in odd years
    }
  }
  return g;
}

function buildSchedule(rng,R,year){
  const W=LEAGUE.weeks, games=nflPairings(R,year);
  for(let attempt=0;attempt<40;attempt++){
    const at={}; NAMES.forEach(t=>at[t]=new Array(W).fill(-1));   // week -> game index
    const wk=new Array(games.length).fill(-1);
    const free=(t,w)=>at[t][w]<0;
    const put=(gi,w)=>{const [a,h]=games[gi];wk[gi]=w;at[a][w]=gi;at[h][w]=gi};
    const lift=gi=>{const [a,h]=games[gi],w=wk[gi];at[a][w]=-1;at[h][w]=-1;wk[gi]=-1};
    const other=(gi,t)=>games[gi][0]===t?games[gi][1]:games[gi][0];
    // Kempe chain: alternate weeks c1/c2 starting from t's c1 game; swap them
    const kempe=(t,c1,c2,avoid)=>{
      const path=[]; let x=t, c=c1, guard=0;
      while(at[x][c]>=0&&guard++<80){const gi=at[x][c]; path.push(gi); x=other(gi,x);
        if(x===avoid)return false; c=(c===c1)?c2:c1;}
      const tgt=path.map(gi=>wk[gi]===c1?c2:c1);
      path.forEach(lift); path.forEach((gi,i)=>put(gi,tgt[i])); return true;
    };
    const order=rng.shuffle(games.map((_,i)=>i));
    // division games prefer the back of the season, like the real thing
    let ok=true;
    for(const gi of order){
      const [a,h]=games[gi];
      const ws=rng.shuffle([...Array(W).keys()]);
      let w=ws.find(w=>free(a,w)&&free(h,w));
      if(w!==undefined){put(gi,w);continue}
      // a free week for each side, then swap a chain to line them up
      const fa=ws.filter(w=>free(a,w)), fh=ws.filter(w=>free(h,w));
      let placed=false;
      for(const c1 of fa){for(const c2 of fh){
        if(c1===c2)continue;
        if(kempe(h,c1,c2,a)&&free(a,c1)&&free(h,c1)){put(gi,c1);placed=true;break}
      } if(placed)break}
      if(!placed){ok=false;break}
    }
    if(!ok)continue;
    // every team now has exactly one empty week: its bye. Push byes into
    // weeks 5-14, at most six teams off in any week.
    const byeOf=t=>at[t].findIndex(x=>x<0);
    const cost=()=>{const cnt=new Array(W).fill(0); let c=0;
      NAMES.forEach(t=>{const b=byeOf(t); cnt[b]++; if(b<4||b>13)c+=10});
      cnt.forEach(n=>{if(n>6)c+=n-6; if(n%2)c+=1}); return c};
    let cur=cost();
    for(let it=0;it<4000&&cur>0;it++){
      const t=rng.pick(NAMES), b=byeOf(t), w=4+rng.int(10);
      if(w===b)continue;
      const snap=wk.slice();
      if(!kempe(t,w,b,null))continue;
      const nc=cost();
      if(nc<=cur){cur=nc;continue}
      NAMES.forEach(x=>at[x].fill(-1)); snap.forEach((w2,i)=>{wk[i]=-1;if(w2>=0)put(i,w2)});
    }
    if(cur>0)continue;                            // try a fresh assignment
    return games.map(([a,h,div],i)=>({week:wk[i],away:a,home:h,conf:div,neutral:false,real:false,site:null}));
  }
  throw new Error("schedule: no valid week assignment found");
}
LEAGUE.buildSchedule=buildSchedule;
/* ============ offseason: pro football ============ */
/* Players have ages and contracts. Each offseason, in order:
     1. expiring contracts are re-signed or let go (you choose for your team)
     2. everyone ages: better until about 27, flat, then decline after 30
        (quarterbacks three years later, running backs two years sooner)
     3. some retire
     4. the draft, worst record first, playoff teams by how far they went
     5. free agency, under a hard salary cap
     6. empty spots are filled with replacement-level players
   Salaries are in millions and cover the twenty players the sim tracks. */
const NFL_CAP=110;
/* How well run a franchise is, from its slow-moving strength: good
   organisations develop players better, scout better, and free agents take
   a little less to join them. Without it the draft and free agency flatten
   the league within a few years. */
const orgEdge=(u,t)=>Math.max(-1.5,Math.min(1.5,(u.program[t]-1690)/100));
const AGE_SHIFT={QB:3,RB:-2};
const POS_PAY={QB:1.75,EDGE:1.15,OT:1.0,WR:1.05,WR2:0.8,CB:0.95,DT:0.9,LB:0.7,S:0.7,RB:0.6};

function nflAsk(r,pos,age){
  const x=Math.max(0,(r-55)/35);
  let s=(0.8+34*Math.pow(x,2.4))*(POS_PAY[pos]||1);
  const a=age-(AGE_SHIFT[pos]||0);
  if(a>=31)s*=0.78; else if(a>=29)s*=0.9;
  return Math.round(Math.max(0.8,s)*10)/10;
}
function nflYears(age,pos){const a=age-(AGE_SHIFT[pos]||0); return a<=26?4:a<=29?3:a<=31?2:1}
function payroll(roster){return roster.reduce((s,p)=>s+(p&&p.k?p.k.sal:0),0)}
const ROOKIE_ROOM=8;                        // what re-signing leaves free for the draft class
/* Which expiring players a team keeps: the best first, while they fit. Worth
   keeping means a starter rated 66+, or a cheap useful backup, not past 32. */
function nflResignPlan(R){
  const exp=[], keep={}; let pay=0;
  R.forEach((p,i)=>{if(!p)return;
    if(p.k.yrs<=1)exp.push(i); else pay+=p.k.sal});
  exp.sort((a,b)=>R[b].r-R[a].r).forEach(i=>{
    const p=R[i], ask=nflAsk(p.r,p.p,p.age+1);
    const worth=(i<POS.length?p.r>=66:p.r>=64&&ask<=3)&&p.age<=32;
    keep[i]=worth&&pay+ask<=NFL_CAP-ROOKIE_ROOM;
    if(keep[i])pay+=ask;
  });
  return keep;
}

function nflPlayer(rng,target,age,posIdx){
  const P=POS[posIdx].p, a=age-(AGE_SHIFT[P]||0);
  // young players sit below the level they'll reach; veterans at or past it
  const ageAdj=a<=23?-5:a<=25?-2:a<=29?1:a<=31?0:-3;
  const r=Math.round(Math.max(40,Math.min(97,rng.gauss(target+ageAdj,5))));
  const room=a<=23?rng.gauss(9,4):a<=25?rng.gauss(5,3):a<=27?rng.gauss(2,1.5):0;
  const pot=Math.round(Math.max(r,Math.min(99,r+room)));
  return {n:playerName(rng),p:P,i:posIdx,c:age,age:age,r:r,pot:pot,hz:0,prod:0,st:0,
          k:{sal:nflAsk(r,P,age),yrs:1+rng.int(nflYears(age,P))}};
}

function nflRoster(rng,programElo){
  const target=eloToRating(programElo);
  const ageBag=[23,24,25,26,26,27,27,28,29,30,31,32];
  const r=POS.map((_,i)=>nflPlayer(rng,target,rng.pick(ageBag),i));
  POS.forEach((_,i)=>{
    const b=nflPlayer(rng,target-rng.range(5,13),rng.pick([22,23,24,25,28,31,33]),i);
    b.r=Math.min(b.r,r[i].r); b.k.sal=nflAsk(b.r,b.p,b.age);
    r.push(b);
  });
  // nobody starts over the cap
  const pay=payroll(r);
  if(pay>NFL_CAP*0.94){const f=NFL_CAP*0.94/pay; r.forEach(p=>p.k.sal=Math.round(p.k.sal*f*10)/10)}
  return r;
}

/* the draft: worst regular season first; playoff teams after, by the round
   they went out in; the champion picks last */
function nflDraftOrder(rec,elo){
  const S2=(typeof SEA!=="undefined"&&SEA&&SEA.rounds&&SEA.rounds.wc)?SEA:null;
  const pct=t=>rec[t][0]/Math.max(1,rec[t][0]+rec[t][1]);
  const out=(t)=>{
    if(!S2||!S2.seeds||!S2.seeds[t])return 0;
    if(S2.champion===t)return 5;
    if(S2.rounds.sb.some(g=>g.loser===t))return 4;
    if(S2.rounds.conf.some(g=>g.loser===t))return 3;
    if(S2.rounds.div.some(g=>g.loser===t))return 2;
    return 1;
  };
  return NAMES.slice().sort((a,b)=>out(a)-out(b)||pct(a)-pct(b)||elo[a]-elo[b]);
}

function nflProspects(rng,n){
  const out=[];
  for(let i=0;i<n;i++){
    const q=i/n;
    const posIdx=rng.int(POS.length);
    const age=21+rng.int(3);
    const r=Math.round(Math.max(45,Math.min(80,rng.gauss(64-13*Math.pow(q,0.7),3.5))));
    const pot=Math.round(Math.min(99,r+Math.max(2,rng.gauss(11-5*q,4))));
    out.push({n:playerName(rng),p:POS[posIdx].p,i:posIdx,c:age,age:age,r:r,pot:pot,
              hz:0,prod:0,st:0,from:rng.pick(LEAGUE.draftTeams)});
  }
  return out;
}
/* The coming draft class, made when the offseason opens so a coach can see
   it and build a board. Seeded by the year, so reopening the screen or
   reloading a save shows the same class. sr/spot are a scout's estimates:
   how far off depends on how well run the franchise is (as for the
   computer's own picks). */
function nflDraftClass(u,team){
  if(!u.draftClass||u.draftClass.year!==u.year){
    const rng=new RNG((((u.seed||0)*2654435761)^(u.year*7919)^0x5bd1e995)>>>0);
    const list=nflProspects(rng,7*32); list.forEach((p,i)=>p.pid=i);
    u.draftClass={year:u.year,list:list};
  }
  const C=u.draftClass;
  if(team&&C.scoutedFor!==team){
    const noise=Math.max(0.8,2.6-orgEdge(u,team)*1.2);
    let th=0; for(let i=0;i<team.length;i++)th=(th*31+team.charCodeAt(i))|0;
    const r2=new RNG((((u.seed||0)*40503)^(u.year*104729)^th)>>>0);
    C.list.forEach(p=>{p.sr=Math.round(p.r+r2.gauss(0,noise)); p.spot=Math.round(Math.max(p.sr,p.pot+r2.gauss(0,noise*1.6)))});
    C.scoutedFor=team;
  }
  return C;
}
/* Who will be a free agent: the players other teams' re-signing rules won't
   keep (their own choice, for a person coaching one). Ratings are this
   season's; players age before free agency opens. key identifies a player
   across the offseason. */
const faKey=(team,p)=>team+"|"+p.n+"|"+p.p;
function nflFreeAgentPreview(u,myTeam,users){
  const out=[];
  NAMES.forEach(t=>{
    if(t===myTeam)return;
    const R=u.roster[t], plan=(users&&users[t]&&users[t].resign)||nflResignPlan(R);
    R.forEach((p,i)=>{ if(!p||p.k.yrs>1||plan[i])return;
      if(p.r<58||p.age>=33)return;                  // likely to retire or go unsigned
      out.push({key:faKey(t,p),n:p.n,p:p.p,team:t,age:p.age+1,r:p.r,pot:p.pot,
                ask:Math.round(nflAsk(p.r,p.p,p.age+1)*1.1*10)/10});
    });
  });
  return out.sort((a,b)=>(b.r+(b.pot-b.r)*0.3-b.age*0.2)-(a.r+(a.pot-a.r)*0.3-a.age*0.2));
}
/* ---- trades ----
   A player's worth to a front office: rating, some of his ceiling while he
   is young, less once he is past 29, and less the more he is paid. */
function tradeValue(p){
  const young=Math.max(0,27-p.age)/5;
  return p.r+(p.pot-p.r)*0.4*young-Math.max(0,p.age-29)*1.5-p.k.sal*0.25;
}
const tradeKey=(t,p)=>t+"|"+p.n+"|"+p.p;
/* Offers for one of your players under contract past this season: up to
   three teams each offer a player (also under contract) at one of your
   weakest spots, worth about the same, who helps them at the position they
   get, and leaves both of you under the cap. Deterministic, so the screen
   shows the same offers until something changes. */
function nflTradeOffers(u,myTeam,idx,humans){
  const R=u.roster[myTeam], give=R[idx]; if(!give||give.k.yrs<2)return [];
  const gv=tradeValue(give), myPay=payroll(R);
  // my weakest starting spots, by how far below the league's typical starter they are
  const need=POS.map((P,i)=>({i:i,gap:R[i]?R[i].r:0})).sort((a,b)=>a.gap-b.gap).slice(0,4).map(x=>x.i);
  const offers=[];
  NAMES.forEach(t=>{
    if(t===myTeam||(humans&&humans.indexOf(t)>=0))return;
    const T=u.roster[t], theirPay=payroll(T);
    // do they want him? he has to beat their starter or their backup at his spot
    const gi=POS.findIndex(P=>P.p===give.p);
    if(!(T[gi]&&give.r>T[BK(gi)].r+1))return;
    let best=null;
    T.forEach((q,j)=>{
      if(!q||q.k.yrs<2||need.indexOf(j%POS.length)<0)return;
      if(j<POS.length&&(!T[BK(j)]||T[BK(j)].r<q.r-8))return;   // they won't gut a spot
      const qv=tradeValue(q); if(qv<gv*0.88||qv>gv*1.08)return;
      if(myPay-give.k.sal+q.k.sal>NFL_CAP||theirPay-q.k.sal+give.k.sal>NFL_CAP)return;
      const fit=Math.abs(qv-gv)-(R[j%POS.length]?(q.r-R[j%POS.length].r)*0.5:0);
      if(!best||fit<best.fit)best={fit:fit,q:q,j:j};
    });
    if(best)offers.push({team:t,give:tradeKey(myTeam,give),get:tradeKey(t,best.q),
      n:best.q.n,p:best.q.p,r:best.q.r,pot:best.q.pot,age:best.q.age,sal:best.q.k.sal,yrs:best.q.k.yrs,fit:best.fit});
  });
  return offers.sort((a,b)=>a.fit-b.fit).slice(0,3);
}
/* carry out an agreed trade: find both players now (after aging), swap them */
function nflApplyTrade(u,myTeam,T,rep,leave,pool){
  const [tt]=T.get.split("|"), mine=u.roster[myTeam], theirs=u.roster[tt];
  const gi=mine.findIndex(p=>p&&tradeKey(myTeam,p)===T.give), qi=theirs?theirs.findIndex(p=>p&&tradeKey(tt,p)===T.get):-1;
  const [,gn,gp]=T.give.split("|"), [,qn,qp]=T.get.split("|");
  if(gi<0||qi<0){rep.trade[myTeam]={done:false,gave:gn,gp:gp,got:qn,qp:qp,with:tt,
      why:gi<0?gn+" retired before it could go through":qn+" retired before it could go through"};return}
  const give=mine[gi], get=theirs[qi];
  mine[gi]=null; theirs[qi]=null;
  // each lands where he fits; whoever drops off the end is released
  [[mine,get,myTeam],[theirs,give,tt]].forEach(([R,p,t])=>{
    p.yrsHere=0; p.joined=u.year+1; p.keep=true;
    const i=POS.findIndex(P=>P.p===p.p);
    if(!R[i]){R[i]=p} else if(!R[BK(i)]){ if(p.r>R[i].r){R[BK(i)]=R[i];R[i]=p}else R[BK(i)]=p }
    else { const out=nflPlace(R,p); if(out){rep.released[t].push({n:out.n,p:out.p,r:out.r}); if(out.r>=58){out.from=t;pool.push(out)} else leave(t,out,"released")} }
  });
  rep.trade[myTeam]={done:true,gave:give.n,gp:give.p,got:get.n,qp:get.p,r:get.r,with:tt};
}
const rookieSal=o=>o<=32?Math.round((10-7*(o-1)/31)*10)/10:o<=64?1.6:1.0;

/* what a player adds at his spot: over the backup, or over the starter */
function nflGain(roster,p){
  const s=roster[p.i], b=roster[BK(p.i)], w=POS[p.i].w;
  const val=x=>x?x.r+(x.pot-x.r)*0.25:0;
  if(!s)return val(p)*w*3;
  if(val(p)>val(s))return (val(p)-val(s))*w*2+ (val(s)-val(b))*w;
  return Math.max(0,val(p)-val(b))*w;
}
/* put a player in: he starts or backs up by rating; whoever drops off is returned */
function nflPlace(roster,p){
  p.i=POS.findIndex(P=>P.p===p.p);
  const s=roster[p.i], b=roster[BK(p.i)];
  let out=null;
  if(!s){roster[p.i]=p}
  else if(p.r>s.r){out=b;roster[BK(p.i)]=s;roster[p.i]=p}
  else {out=b;roster[BK(p.i)]=p}
  return out;
}

function nflRun(u,rng,healthy,elo,rec,choices){
  const U_CH=choices.users||(choices.userTeam?{[choices.userTeam]:choices}:{});
  const chFor=t=>U_CH[t]||null, ut=choices.userTeam;
  if(ut&&choices.coach){const c=choices.coach;
    u.coach[ut]={n:c.n,q:c.q,t:0,hired:true,arch:c.arch,rec:c.rec||0}}
  const rep={resigned:{},released:{},retired:{},drafted:{},signed:{},filled:{}};
  NAMES.forEach(t=>{rep.resigned[t]=[];rep.released[t]=[];rep.retired[t]=[];
    rep.drafted[t]=[];rep.signed[t]=[];rep.filled[t]=[]});
  const pool=[];                                        // free agents
  const risers=[],fallers=[];
  u.alumni=u.alumni||{};
  const leave=(t,p,why)=>{
    u.alumni[t]=u.alumni[t]||[];
    u.alumni[t].push({n:p.n,p:p.p,from:p.joined||u.year-(p.yrsHere||1),to:u.year,
      peak:p.peak||p.r,yrs:p.yrsHere||1,draft:p.draft||null,
      line:LEAGUE.records.alumniLine({p:p.p,car:p.car,yrs:p.yrsHere||1}),why:why});
    if(u.alumni[t].length>40){u.alumni[t].sort((a,b)=>b.peak-a.peak);u.alumni[t].length=40}
  };

  NAMES.forEach(t=>{
    const before=u.program[t], c=u.coach[t], R=u.roster[t], ch=chFor(t);
    const plan=(ch&&ch.resign)?ch.resign:nflResignPlan(R);
    // the organisation moves slowly: results nudge it, they don't define it
    u.program[t]+=0.05*(elo[t]-u.program[t])+c.q*COACH_BUILD*0.4+rng.gauss(0,9);
    u.program[t]=Math.max(1480,Math.min(1920,u.program[t]));
    c.t++;
    // 1. contracts that end now
    for(let i=0;i<R.length;i++){
      const p=R[i]; if(!p)continue;
      p.yrsHere=(p.yrsHere||0)+1;
      if(p.k.yrs>1){p.k.yrs--;continue}
      const ask={sal:nflAsk(p.r,p.p,p.age+1),yrs:nflYears(p.age+1,p.p)};
      const keep=!!plan[i];
      if(keep){p.k=ask;rep.resigned[t].push({n:p.n,p:p.p,r:p.r,sal:ask.sal,yrs:ask.yrs})}
      else{R[i]=null;rep.released[t].push({n:p.n,p:p.p,r:p.r});
        if(p.r>=58&&p.age<=33){p.from=t;pool.push(p)} else leave(t,p,"released")}
    }
    // 2. aging
    let devMod=(ch&&ch.phil&&PHILOSOPHY[ch.phil])?PHILOSOPHY[ch.phil].dev*0.5:0;
    const ocq=(u.oc&&u.oc[t])?u.oc[t].q:0, dcq=(u.dc&&u.dc[t])?u.dc[t].q:0;
    R.forEach((p,i)=>{
      if(!p)return;
      p.age++; p.c=p.age;
      const a=p.age-(AGE_SHIFT[p.p]||0);
      const base=a<=22?3.4:a<=23?2.7:a<=24?1.9:a<=25?1.1:a<=26?0.4:a<=27?-0.2:a<=28?-0.8:a<=29?-1.5:a<=30?-2.3:a<=31?-3.3:a<=32?-4.3:-5.5;
      const side=(i%POS.length)<5?ocq*0.02:dcq*0.02;
      const org=a<=29?orgEdge(u,t)*0.75:0;
      const g=rng.gauss(base+c.q*0.02+devMod+side+org,2.0);
      p.r=Math.round(Math.max(35,Math.min(g>0?p.pot:99,p.r+g)));
      if(a>=27)p.pot=Math.max(p.r,Math.min(p.pot,p.r+1));
      p.peak=Math.max(p.peak||0,p.r);
    });
    // 3. retirement
    R.forEach((p,i)=>{
      if(!p)return;
      const a=p.age-(AGE_SHIFT[p.p]||0);
      const odds=a>=36?0.9:a>=35?0.6:a>=34?0.35:a>=33?0.18:a>=32?0.08:0;
      if(rng.r()<odds+(p.r<55&&a>=29?0.3:0)){R[i]=null;rep.retired[t].push({n:p.n,p:p.p,age:p.age,r:p.r});leave(t,p,"retired")}
    });
    // a starter's empty spot goes to his backup first
    POS.forEach((_,i)=>{if(!R[i]&&R[BK(i)]){R[i]=R[BK(i)];R[BK(i)]=null}});
    const d=u.program[t]-before;
    if(d>30)risers.push([t,Math.round(d)]); if(d<-30)fallers.push([t,Math.round(d)]);
  });

  // agreed trades go through now: after contracts and aging, before the draft
  rep.trade={};
  Object.keys(U_CH).forEach(t=>{const ch=U_CH[t]; if(ch&&ch.trade)nflApplyTrade(u,t,ch.trade,rep,leave,pool)});
  NAMES.forEach(t=>POS.forEach((_,i)=>{const R=u.roster[t]; if(!R[i]&&R[BK(i)]){R[i]=R[BK(i)];R[BK(i)]=null}}));

  // 4. the draft
  const order=nflDraftOrder(rec,elo);
  // the class shown on the offseason screen (a copy: the class itself isn't consumed)
  const prospects=nflDraftClass(u).list.map(p=>Object.assign({},p));
  delete u.draftClass;
  const picks=[];
  for(let rd=1;rd<=7;rd++)order.forEach((t,k)=>{
    const R=u.roster[t], ch=chFor(t), overall=(rd-1)*32+k+1;
    const style=(ch&&ch.draft)||"bpa";
    const score=p=>style==="need"?nflGain(R,p)*1.6+p.r*0.3
                  :style==="upside"?p.pot*1.2+p.r*0.2+nflGain(R,p)*0.3
                  :p.r+(p.pot-p.r)*0.45+nflGain(R,p)*0.5;
    const scout=2.5-orgEdge(u,t)*1.4;                  // how often a team misjudges a prospect
    let bi=0,bs=-1e9; prospects.forEach((p,i)=>{if(p.taken)return; const s=score(p)+rng.gauss(0,scout); if(s>bs){bs=s;bi=i}});
    // a coach's own board comes first: the highest player on it still there
    const board=(ch&&ch.board)||[];
    const mine=board.map(id=>prospects.findIndex(p=>p.pid===id&&!p.taken)).find(i=>i>=0);
    if(mine!==undefined)bi=mine;
    const p=prospects[bi]; p.taken=true;
    p.draft={round:rd,pick:k+1,overall:overall,team:t,year:u.year};
    p.k={sal:rookieSal(overall),yrs:4}; p.joined=u.year+1; p.drafted=true;
    const g=nflGain(R,p);
    const made=g>0.6||!R[p.i]||!R[BK(p.i)];
    if(made){const out=nflPlace(R,p); if(out){rep.released[t].push({n:out.n,p:out.p,r:out.r});
      if(out.r>=58){out.from=t;pool.push(out)} else leave(t,out,"released")}}
    rep.drafted[t].push({n:p.n,p:p.p,r:p.r,pot:p.pot,from:p.from,d:p.draft,made:made});
    picks.push({n:p.n,p:p.p,team:t,r:p.r,pot:p.pot,from:p.from,d:p.draft,made:made,pid:p.pid});
  });

  // a draft class can tip a team over: release the worst-value backups until it fits
  NAMES.forEach(t=>{
    const R=u.roster[t];
    while(payroll(R)>NFL_CAP){
      let wi=-1,wv=-1;
      R.forEach((p,i)=>{if(!p||i<POS.length)return; const v=p.k.sal/Math.max(1,p.r-45); if(v>wv){wv=v;wi=i}});
      if(wi<0){ // only starters left over: the most overpaid starter goes
        R.forEach((p,i)=>{if(!p)return; const v=p.k.sal/Math.max(1,p.r-45); if(v>wv){wv=v;wi=i}})}
      const out=R[wi]; R[wi]=null; rep.released[t].push({n:out.n,p:out.p,r:out.r,cap:true});
      if(out.r>=58){out.from=t;pool.push(out)} else leave(t,out,"released");
    }
  });

  // 5. free agency: teams with the most room shop first, a few rounds of it
  pool.forEach(p=>{p.ask=nflAsk(p.r,p.p,p.age); p.i=POS.findIndex(P=>P.p===p.p)});
  // a coach's own targets get the first look, in their order, at the asking
  // price plus a premium for the competing offers, if it fits under the cap
  rep.targets={};
  Object.keys(U_CH).forEach(t=>{
    const ch=U_CH[t]; if(!ch||!ch.targets||!ch.targets.length||!u.roster[t])return;
    const R=u.roster[t]; rep.targets[t]=[];
    ch.targets.forEach(key=>{
      const p=pool.find(x=>!x.signed&&faKey(x.from,x)===key);
      const [team,n,pos]=key.split("|");
      if(!p){rep.targets[t].push({n:n,p:pos,from:team,got:false,why:"wasn't on the market (retired or re-signed)"});return}
      const cost=Math.round(p.ask*1.1*10)/10;
      const bk=R[BK(p.i)];
      if(bk&&bk.keep){rep.targets[t].push({n:n,p:pos,from:team,got:false,why:`no room at ${pos}: it would cut ${bk.n}, whom you just signed`});return}
      if(payroll(R)+cost>NFL_CAP){rep.targets[t].push({n:n,p:pos,from:team,got:false,why:`wanted $${cost.toFixed(1)}M; you didn't have the room`});return}
      p.signed=true; p.k={sal:cost,yrs:nflYears(p.age,p.p)}; p.yrsHere=0; p.joined=u.year+1;
      p.keep=true;                                  // not to be cut again this offseason
      const out=nflPlace(R,p);
      rep.signed[t].push({n:p.n,p:p.p,r:p.r,age:p.age,sal:cost,yrs:p.k.yrs,from:p.from,target:true});
      rep.targets[t].push({n:n,p:pos,from:team,got:true,sal:cost});
      if(out){rep.released[t].push({n:out.n,p:out.p,r:out.r}); if(out.r>=58){out.from=t;out.ask=nflAsk(out.r,out.p,out.age);pool.push(out)} else leave(t,out,"released")}
    });
  });
  const styleOf=t=>{const ch=chFor(t); if(ch&&ch.fa)return ch.fa;
    const rk=NAMES.slice().sort((a,b)=>elo[b]-elo[a]).indexOf(t);
    // bad teams with room are the big spenders, as in the real league; only a
    // few rebuild through youth
    return rk<8?"contend":rk>=28?"young":"balanced"};
  const limit={contend:0.99,balanced:0.93,young:0.85}, maxAge={contend:34,balanced:31,young:27};
  for(let round=0;round<4;round++){
    const shoppers=NAMES.slice().sort((a,b)=>payroll(u.roster[a])-payroll(u.roster[b]));
    shoppers.forEach(t=>{
      const R=u.roster[t], st=styleOf(t), room=NFL_CAP*limit[st]-payroll(R);
      let best=null,bv=0;
      pool.forEach(p=>{if(p.signed||p.age>maxAge[st]||p.from===t)return;
        const bk=R[BK(p.i)]; if(bk&&bk.keep)return;    // would cut a target you just signed
        const cost=Math.round(p.ask*(1+Math.max(0,rng.gauss(0.05,0.08)))*(1-orgEdge(u,t)*0.06)*10)/10;
        if(cost>room)return;

        if(v>bv){bv=v;best=[p,cost]}});

      const [p,cost]=best; p.signed=true;
      p.k={sal:cost,yrs:nflYears(p.age,p.p)}; p.yrsHere=0; p.joined=u.year+1;
      const out=nflPlace(R,p);
      rep.signed[t].push({n:p.n,p:p.p,r:p.r,age:p.age,sal:cost,yrs:p.k.yrs,from:p.from});
      if(out){rep.released[t].push({n:out.n,p:out.p,r:out.r}); if(out.r>=58&&!out.signed){out.from=t;out.ask=nflAsk(out.r,out.p,out.age);pool.push(out)} else leave(t,out,"released")}
    });

  pool.filter(p=>!p.signed).forEach(p=>leave(p.from,p,"unsigned"));
  NAMES.forEach(t=>u.roster[t].forEach(p=>{if(p)delete p.keep}));

  // 6. fill the gaps, and put the best man at each spot
  NAMES.forEach(t=>{
    const R=u.roster[t];

      const p=nflPlayer(rng,53+rng.range(0,5),24+rng.int(8),i%POS.length);
      p.k={sal:0.9,yrs:1}; p.joined=u.year+1; R[i]=p;

    POS.forEach((_,i)=>{const s=R[i],b=R[BK(i)]; if(b.r>s.r+1){R[i]=b;R[BK(i)]=s}});
    R.forEach((p,i)=>{p.i=i%POS.length});

  return {risers:risers.slice(0,5),fallers:fallers.slice(0,5),
    draft:{picks:picks}, contracts:rep,
    cap:Object.fromEntries(NAMES.map(t=>[t,Math.round(payroll(u.roster[t])*10)/10]))};
}

LEAGUE.cap=NFL_CAP;
LEAGUE.offseason={
  newRoster:nflRoster,

  choices(P){return {resign:P.resign, fa:P.fa, draft:P.draft, board:P.board||[], targets:P.targets||[], trade:P.trade||null}},
  faStyles:{contend:{l:"Spend to contend",d:"Chase the best players available, whatever their age. Uses nearly every dollar."},
            balanced:{l:"Balanced",d:"Fill real holes with players in their prime. Leaves a little room."},
            young:{l:"Stay young",d:"Only players 27 and under, and keep cap space for later."}},
  draftStyles:{bpa:{l:"Best available",d:"Take the best player on the board, whatever the position."},

/* what a season is judged against, and how it is graded */
LEAGUE.goals={
  expectations(p){
    if(p>=1790)return {w:12,l:"A deep playoff run. Anything less is a disappointment.",t:"SUPER BOWL OR BUST"};
    if(p>=1720)return {w:10,l:"Win the division and a playoff game.",t:"CONTEND"};
    if(p>=1650)return {w:9,l:"Get into the playoffs. Nine wins should do it.",t:"PLAYOFFS"};
    if(p>=1580)return {w:7,l:"Be competitive in December and show the rebuild is working.",t:"PUSH FORWARD"};
    return {w:5,l:"Show progress. Five wins would be real movement here.",t:"BUILD SOMETHING"};
  },
  isTitle(result){return /SUPER BOWL CHAMPIONS/i.test(result)},
  firstTitle:"First Super Bowl of your tenure.",
  /* A 17-game season is noisy and 14 teams make the playoffs, so each win
     against expectation and each playoff round count for less than in
     college; tuned so grades spread like college's (about 6% A+, 40% of
     seasons missing) and swing less from year to year. */
  grade(wins,losses,result,exp){
    let s=(wins-exp.w)*0.6;
    if(/SUPER BOWL CHAMPIONS/i.test(result))s+=2.5;
    else if(/Lost the Super Bowl/.test(result))s+=1.5;
    else if(/conference championship/.test(result))s+=1.2;
    else if(/divisional round/.test(result))s+=0.9;
    else if(/wild card round|Made the playoffs/.test(result))s+=0.6;
    else if(/Missed the playoffs/.test(result))s-=(exp.w>=10?0.5:0);
    else if(/Losing season/.test(result))s-=(exp.w>=9?1.25:0.25);
    const g=s>=4?"A+":s>=2.6?"A":s>=1.6?"A-":s>=0.9?"B+":s>=0.2?"B":s>=-0.6?"B-":
            s>=-1.4?"C+":s>=-2.2?"C":s>=-3.2?"C-":s>=-4.4?"D":"F";
    const l=s>=2.6?"Far beyond what anyone expected.":s>=0.9?"Ahead of schedule.":
            s>=-0.6?"About what was expected.":s>=-2.2?"Short of the mark.":"A bad year, and everyone knows it.";
    return {g:g,l:l,miss:s<-0.6};                 // "Short of the mark" or worse
  }
};

/* home field: the base edge plus the stadium, nothing to do with prestige */
LEAGUE.homeField=(u,t)=>LEAGUE.tuning.hfa+(LEAGUE.venues[t]||0)*0.5;
/* ============ rivalries: pro football ============ */
/* No named trophy games; a division rival is the rivalry. Series are kept
   across seasons for every pair of division rivals. */
const nflDivRival=(a,b)=>a!==b&&CONF[a]&&CONF[a]===CONF[b];
/* no game is billed as a named rivalry; the series is still kept */
function nflRivalName(a,b){return null}
const NFL_RIVAL_OF={};
NAMES.forEach(t=>{NFL_RIVAL_OF[t]=NAMES.filter(o=>o!==t&&CONF[o]===CONF[t]).map(o=>({o:o,n:LEAGUE.conf.names[CONF[t]]}))});
function nflSeriesKey(a,b){return [a,b].sort().join("~")}

  all.forEach(g=>{

    if(s.streak&&s.streak.t===g.winner)s.streak.n++; else s.streak={t:g.winner,n:1};
    s.games.push({y:season.year,w:g.winner,l:g.loser,s:Math.max(g.hp,g.ap)+"-"+Math.min(g.hp,g.ap)});

function nflSeriesFor(u,a,b){

  const s=u.series[nflSeriesKey(a,b)]; if(!s)return null;
  return {name:s.n,w:s.w[a]||0,l:s.w[b]||0,

LEAGUE.rivals={name:nflRivalName, series:nflSeriesFor, record:nflRecordSeries, of:NFL_RIVAL_OF};
/* ============ live game engine ============ */
/* Games are played out drive by drive and the score emerges from them, so a
   decision made in the fourth quarter genuinely changes the ending. */

const DRIVES_PER_TEAM = (LEAGUE.tuning&&LEAGUE.tuning.drives)||12;   // the league sets its pace
/* How much a rating gap is worth on the field. College gaps are enormous; a
   pro league's are small but decide more, so a league can steepen it. */
const GAP_SCALE = (LEAGUE.tuning&&LEAGUE.tuning.gapScale)||1;
/* A league can have teams manage the game late: sit on a three-score lead in
   the fourth quarter, take risks when well behind. Applies only to a side
   nobody is calling; a coach makes that choice for himself. */
const GAME_STATE = !!(LEAGUE.tuning&&LEAGUE.tuning.gameState);
function situational(aggr,i,total,mine,theirs){
  if(!GAME_STATE||i<total*0.75)return aggr;
  const d=mine-theirs;
  return d>=17?"sit":d<=-9?"chase":aggr;
}
const MAX_CALLS = 3;          // how many decisions a single game will ask of you

/* Aggression presets, used both as a pre-game plan and as an in-game choice. */
/* A gameplan is a trade between talent and chance. gap scales how much the
   rating gap counts on the side's own drives: safe lets the better team's
   talent show, risk makes the game more of a coin flip. At even strength the
   three are worth the same; an underdog should take risks, a favourite
   should play it safe. td/fg/to only change how it looks (more field goals
   and fewer turnovers when safe; more touchdowns and turnovers when
   risky), set so they don't change who wins. See test/plans.js. */
const AGGR = {
  safe:      {td:-0.015, fg:+0.040, to:-0.015, gap:1.30},
  balanced:  {td: 0,     fg: 0,     to: 0,     gap:1.00},
  aggressive:{td:+0.015, fg:-0.045, to:+0.030, gap:0.55},
  // not a gameplan: the engine's own urgency, for overtime and for a fourth
  // down it has decided to go for (the old "aggressive" numbers)
  urgent:    {td:+0.082, fg:-0.060, to:+0.086, gap:1.00},
  // late-game management for sides nobody is calling (see situational):
  // sitting on a lead burns clock, chasing a deficit takes shots
  sit:       {td:-0.050, fg:+0.058, to:-0.070, gap:1.00},
  chase:     {td:+0.082, fg:-0.060, to:+0.086, gap:1.00},
  // your call to force it on a last possession: touchdown or bust. Right
  // when you need a touchdown; a mistake when a field goal would do.
  force:     {td:+0.080, fg:-0.120, to:+0.090, gap:1.00}
};

/* Chance of each outcome on one drive, given the gap between the two teams. */
function driveOdds(offElo, defElo, startYd, aggr){
  const A = AGGR[aggr] || AGGR.balanced;
  // risk makes a drive less about who is better; safe makes it more so
  const x = (offElo - defElo) * GAP_SCALE / 470 * (A.gap || 1);
  const field = (startYd - 27) / 100;              // better starting spot helps
  let td = 0.238 + x * 0.115 + field * 0.24 + A.td;
  let fg = 0.170 + x * 0.0227 + field * 0.10 + A.fg;
  let to = 0.135 - x * 0.0339 + A.to;
  td = Math.max(0.02, Math.min(0.62, td));
  fg = Math.max(0.03, Math.min(0.30, fg));
  to = Math.max(0.03, Math.min(0.30, to));
  return {td:td, fg:fg, to:to};
}

function rollDrive(rng, offElo, defElo, startYd, aggr){
  const o = driveOdds(offElo, defElo, startYd, aggr);
  const r = rng.r();
  if (r < o.td) return {pts:7, kind:"TD", stall:100};
  if (r < o.td + o.fg) return {pts:3, kind:"FG", stall:Math.min(92,startYd+Math.round(rng.range(12,40)))};
  if (r < o.td + o.fg + o.to) {
    return {pts:0, kind: rng.r()<0.55 ? "INT" : "FUM",
            stall:Math.min(96,startYd+Math.round(rng.range(0,42)))};
  }
  // the drive stalled: where it died, and how far short, decide the options
  const gain = Math.round(rng.gauss(22,17));
  const stall = Math.max(startYd-6, Math.min(96, startYd+gain));
  const u = rng.r();
  const togo = u<0.24?1 : u<0.42?2 : u<0.56?3 : u<0.68?4 : u<0.78?5 :
               u<0.86?7 : u<0.93?9 : Math.round(rng.range(11,17));
  const s = rng.r();
  let kind = s<0.70 ? "PUNT" : (s<0.86 ? "DOWNS" : "MISS");
  if (stall>=72 && kind==="PUNT") kind="MISS";       // you don't punt from there
  return {pts:0, kind:kind, stall:stall, togo:togo};
}

/* Field-goal success by distance (stall yard -> attempt length). */
function fgOdds(stall){
  const dist = (100-stall) + 17;
  if (dist<=25) return 0.96;
  if (dist<=32) return 0.90;
  if (dist<=40) return 0.80;
  if (dist<=47) return 0.66;
  if (dist<=54) return 0.48;
  return 0.30;
}
function fgDistance(stall){ return (100-stall)+17; }

/* Fourth-down conversion: distance is what matters, quality adjusts it. */
function goOdds(togo, offElo, defElo){
  const base = 0.68 / (1 + 0.165*(Math.max(1,togo)-1));
  const adj = (offElo-defElo) * GAP_SCALE / 3400;
  return Math.max(0.12, Math.min(0.82, base + adj));
}

/* Where a drive starts, given how the previous one ended. */
function nextStart(rng, prevKind){
  if (prevKind === "TD" || prevKind === "FG") return Math.round(rng.gauss(26, 6));
  if (prevKind === "PUNT") return Math.round(Math.max(4, Math.min(60, rng.gauss(24, 10))));
  if (prevKind === "INT" || prevKind === "FUM") return Math.round(Math.max(4, Math.min(75, rng.gauss(42, 16))));
  if (prevKind === "DOWNS") return Math.round(Math.max(10, Math.min(80, rng.gauss(48, 12))));
  if (prevKind === "MISS") return Math.round(Math.max(15, Math.min(60, rng.gauss(32, 8))));
  return Math.round(rng.gauss(26, 6));
}

/* Play a whole game out, drive by drive. If a decision hook is supplied it may
   pause; otherwise the game runs start to finish. */
function playGame(rng, eloH, eloA, planH, planA, opts){
  opts=opts||{};
  const st={
    h:0, a:0, drives:[], prev:"TD", idx:0,
    total:DRIVES_PER_TEAM*2,
    aggrH:planH||"balanced", aggrA:planA||"balanced",
    baseH:planH||"balanced", baseA:planA||"balanced",
    used:{}, rng:rng
  };
  for(let i=0;i<st.total;i++){
    if(st.endAfter!==undefined&&i>st.endAfter)break;   // clock ran out
    const home=i%2===0;
    const start=nextStart(rng,st.prev);
    const q=Math.min(4,Math.floor(i/(st.total/4))+1);
    let aggr=home?st.aggrH:st.aggrA;
    if(!(opts.decide&&(home?opts.userIsHome:!opts.userIsHome)))
      aggr=situational(aggr,i,st.total,home?st.h:st.a,home?st.a:st.h);
    let forced=null;
    if(opts.decide){
      const isUser = home ? opts.userIsHome : !opts.userIsHome;
      if(isUser){
        const ctx={q:q, idx:i, total:st.total, startYd:start, used:st.used, rng:rng,
                   mine: opts.userIsHome?st.h:st.a, theirs: opts.userIsHome?st.a:st.h};
        const dp=decisionPoint(ctx,true);
        if(dp){
          const choice=opts.decide(dp,ctx);
          st.used[dp.k]=true;
          if(dp.k==="fourth")forced=choice;
          else if(choice==="push")aggr=(dp.k==="chase"?"force":"chase");   // calls are game management,
          else if(choice==="sit"){                     // not the weekly gameplan
            aggr="sit";
            // running clock takes possessions off the board for both teams
            st.endAfter=Math.min(st.total-1, i+2);   // running clock really does end games
          }
          else aggr=home?st.baseH:st.baseA;
          if(home)st.aggrH=aggr; else st.aggrA=aggr;
        }
      }
    }
    let res;
    if(forced==="kick"){
      res = rng.r()< (0.62 + (start-55)*0.006) ? {pts:3,kind:"FG"} : {pts:0,kind:"MISS"};
    }else if(forced==="punt"){
      res = {pts:0,kind:"PUNT"};
    }else if(forced==="go"){
      const conv = rng.r() < 0.52;
      res = conv ? rollDrive(rng, home?eloH:eloA, home?eloA:eloH, Math.min(88,start+6), "urgent")
                 : {pts:0,kind:"DOWNS"};
      if(conv&&res.pts===0)res={pts:0,kind:res.kind};
    }else{
      res = rollDrive(rng, home?eloH:eloA, home?eloA:eloH, start, aggr);
    }
    if(home)st.h+=res.pts; else st.a+=res.pts;
    st.drives.push({home:home,q:q,start:start,pts:res.pts,kind:res.kind,
                    h:st.h,a:st.a,n:i+1,aggr:aggr});
    st.prev=res.kind;
  }
  // overtime rather than an arbitrary tiebreak
  let ot=0;
  while(st.h===st.a&&ot<24){
    ot++;
    const home=(ot%2===1);
    const r=rollDrive(rng,home?eloH:eloA,home?eloA:eloH,75,"urgent");
    if(home)st.h+=r.pts; else st.a+=r.pts;
    st.drives.push({home:home,q:5,start:75,pts:r.pts,kind:r.kind,
                    h:st.h,a:st.a,n:st.total+ot,aggr:"aggressive",note:"overtime",ot:true});
  }
  return st;
}

/* A game you step through one drive at a time. next() returns either a drive,
   a decision that needs an answer, or done. */

/* A decision offered when a drive dies in makeable territory. */
function fourthDownCall(stall, togo, offElo, defElo){
  const dist = fgDistance(stall);
  const yard = Math.max(1, 100 - stall);
  const gp = Math.round(goOdds(togo, offElo, defElo)*100);
  const fp = Math.round(fgOdds(stall)*100);
  const where = stall>=50 ? `their ${yard}` : `your own ${stall}`;
  if (stall >= 62) {
    return {k:"fourth", h:`Fourth and ${togo} at ${where}`,
      b:`A ${dist}-yard attempt from here, or keep the drive alive.`,
      opts:[["go",`Go for it \u00b7 ${gp}%`],
            ["kick",`Kick it \u00b7 ${dist} yds \u00b7 ${fp}%`],
            stall<78?["punt","Pin them deep"]:null].filter(Boolean)};
  }
  if (stall >= 44) {
    return {k:"fourth", h:`Fourth and ${togo} at ${where}`,
      b:`${dist} yards is a long way for the kicker. Go for it, or flip the field.`,
      opts:[["go",`Go for it \u00b7 ${gp}%`],["punt","Punt it away"]]};
  }
  return null;
}

/* After a touchdown, when the arithmetic makes two points interesting. */
function twoPointCall(mine, theirs, q, late){
  const d = (mine + 7) - theirs;
  if (q < 3) return null;
  if ([-5,-2,-1,1,2,4,5].indexOf(d) >= 0) {
    return {k:"two", h:`Kick it, or go for two`,
      b:`A conversion puts you at ${d + 1}; the kick leaves it at ${d}.`,
      opts:[["kick","Kick the extra point"],["two","Go for two"]]};
  }
  return null;
}

/* humans: which sides a person is calling, {home, away}. A bare boolean is
   the one-coach form: true means the user is the home side. Each side has
   its own calls, asked only on its own drives, and an ask says whose it is. */
function makeLiveGame(rng, eloH, eloA, planH, planA, humans){
  if(typeof humans!=="object"||humans===null)humans={home:!!humans, away:!humans};
  const st={h:0,a:0,drives:[],prev:"TD",i:0,total:DRIVES_PER_TEAM*2,
            aggrH:planH||"balanced",aggrA:planA||"balanced",
            baseH:planH||"balanced",baseA:planA||"balanced",
            usedH:{},usedA:{},callsH:0,callsA:0,humans:humans,
            rng:rng,endAfter:undefined,
            ask:null,stage:null,pend:null,answer:null};

  function push(home,q,start,res,aggr){
    if(home)st.h+=res.pts; else st.a+=res.pts;
    const drive={home:home,q:q,start:start,pts:res.pts,kind:res.kind,
                 h:st.h,a:st.a,n:st.i+1,aggr:aggr,note:res.note||null,
                 converted:(res.converted===undefined?null:res.converted),
                 togo:res.togo||null};
    st.drives.push(drive);
    st.prev=res.kind; st.i++; st.pend=null; st.stage=null;
    return drive;
  }

  st.next=function(){
    const regOver = st.i>=st.total||(st.endAfter!==undefined&&st.i>st.endAfter);
    if(regOver){
      if(st.h!==st.a||st.otGuard>24)
        return {done:true,h:st.h,a:st.a,drives:st.drives};
      // overtime, both teams from the opponent's 25
      st.otGuard=(st.otGuard||0)+1;
      const home=(st.otGuard%2===1);
      const r=rollDrive(rng,home?eloH:eloA,home?eloA:eloH,75,"urgent");
      if(home)st.h+=r.pts; else st.a+=r.pts;
      st.drives.push({home:home,q:5,start:75,pts:r.pts,kind:r.kind,
                      h:st.h,a:st.a,n:st.total+st.otGuard,aggr:"aggressive",
                      note:"overtime",ot:true,converted:null,togo:null});
      return {drive:st.drives[st.drives.length-1],h:st.h,a:st.a};
    }

    const i=st.i, home=i%2===0;
    const isUser = home ? humans.home : humans.away;
    const q=Math.min(4,Math.floor(i/(st.total/4))+1);
    // asks only ever go to the side with the ball, so the score is theirs
    const mine=home?st.h:st.a, theirs=home?st.a:st.h;
    const side=home?"home":"away";
    const used=home?st.usedH:st.usedA;
    const calls=()=>home?st.callsH:st.callsA, called=()=>{if(home)st.callsH++;else st.callsA++};
    const late = i>=st.total-7;
    const offE=home?eloH:eloA, defE=home?eloA:eloH;

    // ---- resume from a decision ----
    if(st.stage){
      const choice=st.answer; st.answer=null;
      const P=st.pend, stage=st.stage;
      if(stage==="strategy"){
        st.stage=null;
        // calls are game management, not the weekly gameplan
        if(choice==="push"){ const m=(P.k==="chase"?"force":"chase"); if(home)st.aggrH=m; else st.aggrA=m }
        else if(choice==="sit"){
          if(home)st.aggrH="sit"; else st.aggrA="sit";
          st.endAfter=Math.min(st.total-1,i+3);
        } else { if(home)st.aggrH=st.baseH; else st.aggrA=st.baseA }
        // fall through and play the drive normally
      } else if(stage==="fourth"){
        let res;
        if(choice==="go"){
          const tg=P.res.togo||3;
          if(rng.r()<goOdds(tg,offE,defE)){
            // converted: the drive carries on from there
            const r2=rollDrive(rng,offE,defE,Math.min(90,P.res.stall+Math.max(2,tg)),"urgent");
            res=r2;
            res.converted=true;
            res.note = r2.pts>0 ? `converted on fourth and ${tg}, then scored`
                                : `converted on fourth and ${tg}, drive stalled later`;
          } else {
            res={pts:0,kind:"DOWNS",stall:P.res.stall,
                 converted:false,
                 note:`went for it on fourth and ${tg} and came up short`};
          }
        } else if(choice==="kick"){
          res = rng.r()<fgOdds(P.res.stall)
            ? {pts:3,kind:"FG",stall:P.res.stall,note:fgDistance(P.res.stall)+"-yd kick is good"}
            : {pts:0,kind:"MISS",stall:P.res.stall,note:fgDistance(P.res.stall)+"-yd kick is no good"};
        } else res={pts:0,kind:"PUNT",stall:P.res.stall,note:"punted it away"};
        return {drive:push(home,P.q,P.start,res,P.aggr),h:st.h,a:st.a};
      } else if(stage==="two"){
        let res;
        if(choice==="two"){
          res = rng.r()<0.47 ? {pts:8,kind:"TD",stall:100,note:"two-point conversion good"}
                             : {pts:6,kind:"TD",stall:100,note:"two-point try failed"};
        } else {
          res = rng.r()<0.97 ? {pts:7,kind:"TD",stall:100}
                             : {pts:6,kind:"TD",stall:100,note:"extra point missed"};
        }
        return {drive:push(home,P.q,P.start,res,P.aggr),h:st.h,a:st.a};
      }
    }

    const start=nextStart(rng,st.prev);

    // ---- strategic call before the snap ----
    if(isUser&&calls()<MAX_CALLS&&!st.stage){
      const ctx={q:q,idx:i,total:st.total,startYd:start,used:used,rng:rng,
                 mine:mine,theirs:theirs};
      const dp=decisionPoint(ctx,true);
      if(dp){
        used[dp.k]=true; called();
        st.stage="strategy"; st.pend={q:q,start:start,k:dp.k};
        return {ask:dp,mine:mine,theirs:theirs,q:q,side:side};
      }
    }

    const aggr=isUser?(home?st.aggrH:st.aggrA)
                     :situational(home?st.aggrH:st.aggrA,i,st.total,mine,theirs);
    const res=rollDrive(rng,offE,defE,start,aggr);

    // ---- a call the situation creates ----
    if(isUser&&calls()<MAX_CALLS){
      if((res.kind==="PUNT"||res.kind==="DOWNS"||res.kind==="MISS")&&(used.fourth||0)<2){
        const dp=fourthDownCall(res.stall,res.togo||3,offE,defE);
        if(dp){
          used.fourth=(used.fourth||0)+1; called();
          st.stage="fourth"; st.pend={q:q,start:start,res:res,aggr:aggr};
          return {ask:dp,mine:mine,theirs:theirs,q:q,side:side};
        }
      }
      if(res.kind==="TD"&&!used.two){
        const dp=twoPointCall(mine,theirs,q,late);
        if(dp){
          used.two=true; called();
          st.stage="two"; st.pend={q:q,start:start,res:res,aggr:aggr};
          return {ask:dp,mine:mine,theirs:theirs,q:q,side:side};
        }
      }
    }
    return {drive:push(home,q,start,res,aggr),h:st.h,a:st.a};
  };
  st.reply=function(v){ st.answer=v; };
  return st;
}

/* Is this a moment worth stopping the game for? */
function decisionPoint(state, isUser){
  if (!isUser) return null;
  const q=state.q, idx=state.idx, total=state.total, mine=state.mine,
        theirs=state.theirs, startYd=state.startYd, used=state.used;
  const late = idx >= Math.floor(total * 0.78);
  const veryLate = idx >= total - 7;
  const diff = mine - theirs;

  // asked on your last possession, when what you need is known: a field
  // goal to win or tie, or nothing less than a touchdown
  const lastBall = idx >= total - 2;
  if (lastBall && diff < 0 && diff >= -8 && !used.chase) {
    return {
      k:"chase",
      h:`Down ${-diff}, last possession`,
      b: -diff<=3 ? `A field goal ${-diff===3?"ties it":"wins it"}. Take what they give you, or go for the touchdown?`
                  : `Only a touchdown will do. Force it downfield, or work it and trust the clock?`,
      opts:[["push","Open it up"],["normal","Stay patient"]]
    };
  }
  if (veryLate && diff > 0 && diff <= 14 && !used.protect) {
    return {
      k:"protect",
      h:`Up ${diff} late`,
      b:`Sit on it and shorten the game, or keep the throttle down.`,
      opts:[["sit","Bleed the clock"],["keep","Keep attacking"]]
    };
  }
  if (q === 3 && idx === Math.floor(total/2) && Math.abs(diff) >= 17 && !used.half) {
    return {
      k:"half",
      h: diff < 0 ? `Down ${-diff} at the break` : `Up ${diff} at the break`,
      b: diff < 0 ? `You need something different in the second half.`
                  : `You can put your foot down or start managing this.`,
      opts: diff < 0 ? [["push","Take more risks"],["normal","Stick with it"]]
                     : [["sit","Manage it"],["normal","Keep going"]]
    };
  }
  return null;
}
