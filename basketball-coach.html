<style>

/* Where saves live. Inside Claude's artifact viewer that is window.storage;
   anywhere else (the published site, a file opened locally) it is the
   browser's localStorage. The shared league table needs window.storage and
   is simply unavailable elsewhere. Every call resolves; failures resolve to
   null rather than throwing. */
const store=(function(){
  const claude=()=>{try{return (window.storage&&typeof window.storage.get==="function")?window.storage:null}catch(e){return null}};
  const local=()=>{try{const L=window.localStorage||localStorage, t="__fc_probe";
    L.setItem(t,"1"); L.removeItem(t); return L}catch(e){return null}};
  return {
    kind(){ return claude()?"claude":local()?"browser":"none" },
    async get(k,shared){
      const W=claude(); if(W){try{return await W.get(k,shared)}catch(e){return null}}
      const L=!shared&&local(); if(!L)return null;
      const v=L.getItem(k); return v===null?null:{key:k,value:v};
    },
    async set(k,v,shared){
      const W=claude(); if(W){try{return await W.set(k,v,shared)}catch(e){return null}}
      const L=!shared&&local(); if(!L)return null;
      try{L.setItem(k,v); return {key:k,value:v}}catch(e){return null}      // full, or blocked
    },
    async delete(k,shared){
      const W=claude(); if(W){try{return await W.delete(k,shared)}catch(e){return null}}
      const L=!shared&&local(); if(!L)return null;
      L.removeItem(k); return {key:k,deleted:true};
    },
    async list(prefix,shared){
      const W=claude(); if(W){try{return await W.list(prefix,shared)}catch(e){return null}}
      const L=!shared&&local(); if(!L)return null;
      const keys=[]; for(let i=0;i<L.length;i++){const k=L.key(i); if(!prefix||k.indexOf(prefix)===0)keys.push(k)}
      return {keys:keys,prefix:prefix};
    }
  };
})();

/* Saves are compressed with LZW: the JSON is turned into UTF-8 bytes, the
   byte string is LZW-coded (codes 0-255 bytes, 256 end of data, dictionary
   from 257, up to 15 bits), and the bits are packed 15 to a UTF-16 character
   (offset past the control range, never a surrogate), a string any store
   accepts. Old saves, plain JSON, still load. */
const SAVE_TAG="LZW1:";
/* codes are looked up by number (previous code * 256 + next byte) and written
   whole, 15 bits to a character; same output as the plain bit-by-bit version */
function lzwPack(str){
  const bytes=unescape(encodeURIComponent(str));
  const END=256, dict=new Map(); let next=257, bits=9, w=-1, acc=0, nacc=0; const out=[];
  // append a whole code at once; flush 15 bits at a time (acc never exceeds 30 bits)
  const emit=code=>{ acc=(acc<<bits)|code; nacc+=bits;
    while(nacc>=15){ nacc-=15; out.push(String.fromCharCode(((acc>>>nacc)&0x7fff)+32)); acc&=(1<<nacc)-1 } };
  for(let i=0;i<bytes.length;i++){
    const c=bytes.charCodeAt(i);
    if(w<0){w=c;continue}
    const key=w*256+c, hit=dict.get(key);
    if(hit!==undefined){w=hit;continue}
    emit(w);
    if(next<32767){dict.set(key,next++); if(next>(1<<bits)&&bits<15)bits++}
    w=c;
  }
  if(w>=0)emit(w);
  emit(END);
  if(nacc>0)out.push(String.fromCharCode(((acc<<(15-nacc))&0x7fff)+32));
  return SAVE_TAG+out.join("");
}
function lzwUnpack(s){
  if(s.indexOf(SAVE_TAG)!==0)return s;                 // an old, uncompressed save
  s=s.slice(SAVE_TAG.length);
  const END=256, dict=[]; let next=257, bits=9, pos=0, cur=0, ncur=0; const out=[];
  const read=()=>{let v=0;for(let b=0;b<bits;b++){ if(ncur===0){ if(pos>=s.length)return -1; cur=s.charCodeAt(pos++)-32; ncur=15 }
      v=(v<<1)|((cur>>(--ncur))&1)} return v};
  let prev=null;
  while(true){
    const c=read(); if(c<0||c===END)break;
    let e;
    if(c<256) e=String.fromCharCode(c);
    else if(dict[c]!==undefined) e=dict[c];
    else if(c===next&&prev!==null) e=prev+prev[0];
    else throw new Error("save data is damaged");
    out.push(e);
    if(prev!==null&&next<32767){dict[next++]=prev+e[0]; if(next>=(1<<bits)&&bits<15)bits++}
    prev=e;
  }
  return decodeURIComponent(escape(out.join("")));
}
/* ============ RNG ============ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
class RNG{
  constructor(seed){this.f=mulberry32(seed);this.sp=null}
  r(){return this.f()}
  int(n){return Math.floor(this.f()*n)}
  range(a,b){return a+this.f()*(b-a)}
  pick(a){return a[this.int(a.length)]}
  gauss(m,s){
    if(this.sp!==null){const v=this.sp;this.sp=null;return m+s*v}
    let u=0,v=0;while(u===0)u=this.f();while(v===0)v=this.f();
    const R=Math.sqrt(-2*Math.log(u));this.sp=R*Math.sin(2*Math.PI*v);
    return m+s*R*Math.cos(2*Math.PI*v)}
  shuffle(a){for(let i=a.length-1;i>0;i--){const j=this.int(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
}

/* ============ home fields ============ */
/* Not every stadium is the same place. A handful are genuinely miserable to
   visit; most are ordinary; some are half empty in November. */

function homeField(u,t){
  if(LEAGUE.homeField)return LEAGUE.homeField(u,t);
  const prog=(u&&u.program&&u.program[t])!==undefined?u.program[t]:1500;
  const base=39+Math.max(0,Math.min(1,(prog-1150)/900))*30;
  return Math.round(base+(LEAGUE.venues[t]||8));

function venueLabel(v){

  if(v>=76)return "a genuinely hostile road trip";

/* ============ team identity ============ */
function _hx(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function _lum(c){const [r,g,b]=c.map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*r+.7152*g+.0722*b}
function _mix(c,t,p){return c.map((v,i)=>Math.round(v+(t[i]-v)*p))}

const K=32;                  // Elo update factor

function divisionOf(u,t){
  const c=(u&&u.conf&&u.conf[t])||CONF[t];
  const D=LEAGUE.conf.divisions[c]; if(!D)return null;
  for(const k in D)if(D[k].indexOf(t)>=0)return k;

  const sizes=Object.keys(D).map(k=>[k,D[k].length]).sort((a,b)=>a[1]-b[1]);
  D[sizes[0][0]].push(t);

/* ============ Elo ============ */
/* Games are played by the sport layer's drive engine (playGame). */
function eloUpdate(eW,eL,mAbs,winHome,neutral){
  const hfa=neutral?0:LEAGUE.tuning.hfa;
  const diff=winHome?(eW+hfa-eL):(eW-eL-hfa);
  const exp=1/(1+Math.pow(10,-diff/400));
  const mov=Math.log(mAbs+1)*(2.2/(0.001*diff+2.2));
  return K*mov*(1-exp);
}

/* ============ talent ============ */
const INJ_HAZARD=0.085,QB_SHARE=0.18,DEV_SD=4.2,AR_SD=5,AR_DECAY=0.8,
      COLLAPSE_P=0.018,BREAKOUT_P=0.018;

function iscale(r){return 0.70+0.45*Math.max(0,Math.min(1,(r-1150)/900))}
/* The per-step rates below (drift, injuries, sudden swings) were set for a
   season of a dozen or so steps. A league with many more (the NBA plays 90
   game dates) sets tuning.talentSteps: rates are scaled so a whole season
   varies as much as one of that many steps, and injuries last as many games.
   Unset, nothing changes. */
function talentScale(){const T=LEAGUE.tuning&&LEAGUE.tuning.talentSteps; return T?T/LEAGUE.weeks:1}

class Talent{
  constructor(rng,base,roster){
    this.rng=rng;this.base=Object.assign({},base);
    this.roster=roster||null;
    this.slope={};this.ar={};this.inj={};this.log={};
    const K=talentScale();
    NAMES.forEach(t=>{this.slope[t]=rng.gauss(0,DEV_SD)*K;this.ar[t]=0;
      this.inj[t]=[];this.log[t]=[]});
  }
  eff(t,w){
    let s=0; this.inj[t].forEach(e=>{if(e.w>0)s+=e.m});
    return this.base[t]+this.slope[t]*w+this.ar[t]+s;
  }
  active(t){return this.inj[t].filter(e=>e.w>0)}
  advance(w){
    const r=this.rng, K=talentScale();
    NAMES.forEach(t=>{
      this.inj[t].forEach(e=>e.w--);
      this.inj[t].filter(e=>e.w<=0).forEach(e=>
        this.log[t].push({wk:w,kind:"back",what:e.k,mag:0}));
      this.inj[t]=this.inj[t].filter(e=>e.w>0);
      const sc=iscale(this.base[t]);
      if(r.r()<INJ_HAZARD*K){
        if(this.roster){
          // pick a starter, weighted toward the positions that take hits
          const idx=pickInjuredPos(r);
          const pl=this.roster[t][idx];
          if(!this.inj[t].some(e=>e.idx===idx)){
            const sev=r.r();
            const wk=Math.max(1,Math.round((sev<0.12?14:r.pick([1,2,2,3,4,5,6]))/K));
            const m=injuryCost(this.roster[t],idx)*r.range(1.05,2.1);
            this.inj[t].push({m:m,w:wk,k:pl.p,idx:idx,who:pl.n,rating:pl.r});
            this.log[t].push({wk:w,kind:"injury",what:pl.p,who:pl.n,
                              mag:Math.round(m),weeks:wk});
          }
        }else{
          let m,wk,k;
          if(r.r()<QB_SHARE){m=-r.range(85,190)*sc;wk=r.pick([2,3,4,5,6,14]);k="QB1"}
          else{m=-r.range(20,75)*sc;wk=r.pick([1,2,2,3,4,6]);k=r.pick(BODY)}
          this.inj[t].push({m:m,w:wk,k:k});
          this.log[t].push({wk:w,kind:"injury",what:k,mag:Math.round(m),weeks:wk});
        }
      }
      if(r.r()<COLLAPSE_P*K){const d=-r.range(40,110)*sc;this.base[t]+=d;
        this.log[t].push({wk:w,kind:"collapse",what:"locker room",mag:Math.round(d)})}
      else if(r.r()<BREAKOUT_P*K){const d=r.range(35,95)*sc;this.base[t]+=d;
        this.log[t].push({wk:w,kind:"breakout",what:"scheme unlock",mag:Math.round(d)})}
      this.ar[t]=this.ar[t]*AR_DECAY+r.gauss(0,AR_SD);
    });
  }
}

let COACH_ID=1;
function newCoach(rng,prestige){
  // better programs attract better coaches
  const tier=Math.max(0,Math.min(1,(prestige-1150)/900));
  const q=rng.gauss(-24+tier*52, 26);
  return {id:COACH_ID++, n:rng.pick(FIRST)+" "+rng.pick(LAST),
          q:Math.round(Math.max(-58,Math.min(68,q))), t:0, hired:true,
          w:0,l:0,titles:0,confs:0,fired:0,stops:[]};
}

/* Roll a season's results into every coach's career. */
function recordCoaches(u,rec,champion,confChamps,year){
  u.coachLog=u.coachLog||{};
  NAMES.forEach(t=>{
    const c=u.coach[t]; if(!c)return;
    if(c.w===undefined){c.w=0;c.l=0;c.titles=0;c.confs=0;c.fired=0;c.stops=[]}
    if(!c.stops.length||c.stops[c.stops.length-1].team!==t)
      c.stops.push({team:t,from:year,to:year,w:0,l:0,titles:0});
    const st=c.stops[c.stops.length-1];
    c.w+=rec[t][0]; c.l+=rec[t][1];
    st.w+=rec[t][0]; st.l+=rec[t][1]; st.to=year;
    if(champion===t){c.titles++; st.titles++}
    if(confChamps&&Object.values(confChamps).indexOf(t)>=0)c.confs++;
  });
}

/* Snapshot of everyone currently employed, for browsing. */
function coachTable(u){
  const out=[];
  NAMES.forEach(t=>{
    const c=u.coach[t]; if(!c)return;
    out.push({team:t,n:c.n,q:c.q,t:c.t,you:!!c.you,
      w:c.w||0,l:c.l||0,titles:c.titles||0,confs:c.confs||0,
      stops:(c.stops||[]).slice()});
  });
  return out;
}

function coachGrade(q){
  if(q>=38)return "elite";
  if(q>=18)return "strong";
  if(q>=-5)return "solid";
  if(q>=-25)return "shaky";
  return "overmatched";
}

/* ============ decisions ============ */
const ARCHETYPES=[
 {k:"proven", l:"Proven winner",  bump:16, sd:16,
  d:"Has won at this level before. Expensive, and the expectations arrive with him."},
 {k:"riser",  l:SPORT.riser.l, bump:2, sd:36, d:SPORT.riser.d},
 {k:"builder",l:"Program builder", bump:-4, sd:19, rec:9,
  d:"Wins on the recruiting trail before he wins on Saturdays. Slow burn, high floor."},
 {k:"retread",l:"Veteran retread", bump:-7, sd:11,
  d:"Been fired twice. Knows exactly what he is, and so does everyone else."}
];

function coachCandidates(rng,prestige){
  const tier=Math.max(0,Math.min(1,(prestige-1150)/900));
  const pool=rng.shuffle(ARCHETYPES.slice()).slice(0,3);
  return pool.map(A=>{
    const q=Math.round(Math.max(-58,Math.min(68,
      rng.gauss(-24+tier*52+A.bump, A.sd))));
    // scouting is imperfect: you see a noisy read, not the number
    const seen=q+rng.gauss(0,13);
    return {n:rng.pick(FIRST)+" "+rng.pick(LAST), q:q, arch:A.k, al:A.l, d:A.d,
            rec:A.rec||0, grade:coachGrade(seen)};
  });
}

const PHILOSOPHY={
  win_now: {l:"Win now",  d:"Veterans get every rep. Better this year, thinner next.",
            elo:44, dev:-3.0},
  balanced:{l:"Balanced", d:"Play the best guy at every spot.", elo:0, dev:0},
  build:   {l:"Build",    d:"Young players play through mistakes. Costs you this year.",
            elo:-38, dev:3.2}
};

/* ============ your coaching career ============ */
/* You are the head coach, not the athletic director. You get hired, you get
   fired, and your record follows you to the next job. */
function repGrade(r){
  if(r>=46)return "a national name";
  if(r>=26)return "a hot commodity";
  if(r>=8)return "well regarded";
  if(r>=-10)return "unproven";
  if(r>=-28)return "a hard sell";
  return "radioactive";
}

/* Which jobs would take you, given what you've done. */
function jobMarket(u,rng,rep,openings,current){
  const ceiling=1300+Math.max(0,rep+40)*10;      // reputation opens bigger doors
  const floor=Math.max(1120,ceiling-620);
  const opts=openings.filter(t=>t!==current)
    .filter(t=>u.program[t]<=ceiling&&u.program[t]>=floor)
    .sort((a,b)=>u.program[b]-u.program[a]);
  const picked=[];
  if(opts.length)picked.push(opts[0]);
  if(opts.length>2)picked.push(opts[Math.floor(opts.length/2)]);
  if(opts.length>1)picked.push(opts[opts.length-1]);
  return [...new Set(picked)].slice(0,3);
}

/* Bigger programs come calling when you overperform at a small one. */
function poachOffers(u,rng,rep,openings,current){
  if(rep<18)return [];
  const mine=u.program[current];
  return openings.filter(t=>t!==current&&u.program[t]>mine+150
    &&u.program[t]<=1240+Math.max(0,rep+30)*12)
    .sort((a,b)=>u.program[b]-u.program[a]).slice(0,2);
}

function repDelta(wins,losses,expWins,program,titles){
  const wp=wins/Math.max(1,wins+losses);
  let d=(wins-expWins)*1.7;
  if(titles.natl)d+=22;
  else if(titles.playoff)d+=8;
  else if(titles.conf)d+=6;
  if(wp<0.34&&wins<expWins)d-=6;   // only if you also missed the mark
  // winning at a small program counts for more
  d*= program<1500?1.25 : program>1850?0.82 : 1.0;
  return d;
}

/* ============ program continuity ============ */
const COACH_ONFIELD=0.55,  // how much coach quality shows up on the field
      COACH_BUILD=0.34,    // how much it compounds into the program each year
      ROOKIE_DIP=-22;
const ROSTER_NOISE=48;
const CARRY=0.45,CHURN_SD=95,RECRUIT=0.16,PROG_NOISE=22,
      // program strength's range: a league may set its own (basketball's is wider)
      P_FLOOR=(LEAGUE.tuning&&LEAGUE.tuning.pFloor)||1120,P_CEIL=(LEAGUE.tuning&&LEAGUE.tuning.pCeil)||2010,HOT_SEAT=0.42,COACH_SD=62,COACH_DIP=-18,PERCEPT_N=34;

function newUniverse(seed){
  const rng=new RNG(seed);
  const u={seed:seed,year:2026,program:{},perceived:{},trueBase:{},
           tenure:{},bad:{},history:[],rng:seed};
  u.coach={}; u.roster={}; u.oc={}; u.dc={}; u.conf={};
  u.nextRealign=2026+4+rng.int(4);
  LEAGUE.teams.forEach(t=>u.conf[t[0]]=t[2]);
  LEAGUE.teams.forEach(([n,e])=>{
    u.program[n]=e; u.perceived[n]=e;
    u.roster[n]=LEAGUE.offseason.newRoster(rng,e);
    u.oc[n]=newCoordinator(rng,e,"oc"); u.dc[n]=newCoordinator(rng,e,"dc");
    u.trueBase[n]=rosterElo(u.roster[n])+rng.gauss(0,26);
    u.tenure[n]=1+rng.int(6); u.bad[n]=0;
    const c=newCoach(rng,e); c.t=u.tenure[n]; c.hired=false;
    u.coach[n]=c;
  });
  u._rngState=seed*7919+13;
  return u;
}

function seatHeat(u,rec,elo,t){
  // expectation is the program's own baseline; heat is falling short of it repeatedly
  const w=rec[t][0], l=rec[t][1], wp=w/Math.max(1,w+l);
    const shortfall=(u.program[t]-elo[t])/45;
  let heat=u.bad[t]*1.4 + Math.max(0,shortfall) + (wp<HOT_SEAT?1.2:0);
  if(u.coach[t]&&u.coach[t].t<=1)heat-=1.6;         // rookies get a grace year
  if(u.coach[t]&&u.coach[t].q>=30)heat-=0.6;
  return heat;
}

/* Offseason runs in two acts so the player can decide in between.
   Act 1: the coaching carousel. Act 2: rosters, recruiting, development. */
/* The coaching carousel, once per offseason for the whole league.
   users: {team: fired} for every team a person coaches, fired meaning they
   have missed expectations two years running (decided from their grades,
   see openOffseason). A person's job is theirs to lose that way, never the
   carousel's. Each person's part comes back in the ...By maps; the plain
   userOpen/staffOpen/candidates are the first user's, for one-coach games. */
function offseasonCoaching(u,rng,rec,elo,users){
  users=users||{};
  const isUser=t=>Object.prototype.hasOwnProperty.call(users,t);
  const userTeam=Object.keys(users)[0];
  const fired=[],hires=[],poached=[];
  if(!u.coach){u.coach={};NAMES.forEach(t=>{u.coach[t]=newCoach(rng,u.program[t]);u.coach[t].hired=false})}

  NAMES.forEach(t=>{
    const wp=rec[t][0]/Math.max(1,rec[t][0]+rec[t][1]);
    u.bad[t]= wp<HOT_SEAT ? u.bad[t]+1 : 0;
    if(u.coach[t]&&u.coach[t].you){
      if(isUser(t)&&users[t]){fired.push(t);u.bad[t]=0}
      return;
    }
    const heat=seatHeat(u,rec,elo,t);
    const change=(heat>=4.6)||(wp<0.25&&u.coach[t].t>=2);
    if(change&&rng.r()<0.82){fired.push(t);u.bad[t]=0}
  });

  const openings=fired.slice().sort((a,b)=>u.program[b]-u.program[a]);
  openings.forEach(job=>{
    if(isUser(job))return;                        // a person's job: they're told, then it's filled
    if(rng.r()>0.42)return;
    const cands=NAMES.filter(t=>fired.indexOf(t)<0 && !u.coach[t].you && u.coach[t].q>=22
      && u.program[t] < u.program[job]-140 && u.coach[t].t>=2
      && rec[t][0]>=rec[t][1]);
    if(!cands.length)return;
    cands.sort((a,b)=>u.coach[b].q-u.coach[a].q);
    const from=cands[0], c=u.coach[from];
    poached.push({to:job,from:from,name:c.n,q:c.q});
    u.coach[job]=Object.assign({},c,{t:0,hired:true});   // his record travels with him
    u.coach[from]=newCoach(rng,u.program[from]);
    hires.push({team:from,name:u.coach[from].n,q:u.coach[from].q,reason:"replacing "+c.n});
    fired.splice(fired.indexOf(job),1);
    if(fired.indexOf(from)<0)fired.push(from);
  });

  // a hot coordinator can be the man a program hires
  const coordMoves=[];
  fired.slice().forEach(job=>{
    if(isUser(job))return;
    if(rng.r()>0.30)return;
    const pool=NAMES.filter(t=>fired.indexOf(t)<0 && u.oc[t] && u.oc[t].q>=26
      && u.program[t] < u.program[job]+90);
    if(!pool.length)return;
    const from=rng.pick(pool);
    const side=(u.dc[from]&&u.dc[from].q>u.oc[from].q)?"dc":"oc";
    const co=side==="oc"?u.oc[from]:u.dc[from];
    if(!co||co.q<26)return;
    coordMoves.push({name:co.n,from:from,to:job,side:side});
    u.coach[job]={id:COACH_ID++,n:co.n,q:Math.round(co.q*0.85),t:0,hired:true,
                  w:0,l:0,titles:0,confs:0,fired:0,stops:[]};
    const fresh=newCoordinator(rng,u.program[from],side);
    if(side==="oc")u.oc[from]=fresh; else u.dc[from]=fresh;
    fired.splice(fired.indexOf(job),1);
  });

  const userOpenBy={}, candidatesBy={}, staffOpenBy={};
  Object.keys(users).forEach(t=>{userOpenBy[t]=fired.indexOf(t)>=0; staffOpenBy[t]={oc:false,dc:false}});
  const openJobs=fired.slice();
  Object.keys(users).forEach(t=>{candidatesBy[t]=userOpenBy[t]?coachCandidates(rng,u.program[t]):null});

  fired.forEach(t=>{
    if(isUser(t))return;                          // a person's job, not an AI hire
    if(u.coach[t].hired&&u.coach[t].t===0)return;
    const old=u.coach[t].n;
    u.coach[t]=newCoach(rng,u.program[t]);
    hires.push({team:t,name:u.coach[t].n,q:u.coach[t].q,reason:"replacing "+old});
  });

  // ordinary staff churn everywhere else
  NAMES.forEach(t=>{
    ["oc","dc"].forEach(side=>{
      const st=side==="oc"?u.oc:u.dc;
      if(!st[t]){st[t]=newCoordinator(rng,u.program[t],side);return}
      st[t].t=(st[t].t||0)+1;
      const leaves = st[t].q>=34 ? rng.r()<0.20 : (st[t].q<=-26 ? rng.r()<0.30 : rng.r()<0.09);
      if(leaves){
        if(isUser(t)){staffOpenBy[t][side]=true;}
        else st[t]=newCoordinator(rng,u.program[t],side);
      }
    });
  });

  return {fired:fired,hires:hires,poached:poached,openJobs:openJobs,coordMoves:coordMoves,
          userOpenBy:userOpenBy,staffOpenBy:staffOpenBy,candidatesBy:candidatesBy,
          userOpen:!!userOpenBy[userTeam],candidates:candidatesBy[userTeam]||null,
          staffOpen:staffOpenBy[userTeam]||{oc:false,dc:false}};
}

/* ============ assistants: basketball ============ */
/* Two lead assistants per program, one for each end of the floor. They shift
   the team on the court and shape how their players develop, and the good
   ones get hired away. (The core calls them coordinators.) */
const OFF_SHARE=0.50, DEF_SHARE=0.50;      // both ends count the same
const STAFF_ELO=0.62;                      // Elo per point of assistant quality
const OC_STYLE=["Motion offense","Pick-and-roll heavy","Five-out","Dribble drive","Post-up inside-out"];
const DC_STYLE=["Pack line","Man-to-man pressure","2-3 zone","Full-court press","Switch everything"];
function newCoordinator(rng,prestige,side,repBonus){
  const tier=Math.max(0,Math.min(1,(prestige-1150)/900));
  const q=rng.gauss(-20+tier*44+(repBonus||0), 24);
  return {n:rng.pick(FIRST)+" "+rng.pick(LAST),
          q:Math.round(Math.max(-52,Math.min(62,q))), t:0,
          s:rng.pick(side==="oc"?OC_STYLE:DC_STYLE)};
}
function staffElo(u,t){
  if(!u.oc||!u.dc||!u.oc[t]||!u.dc[t])return 0;
  return (u.oc[t].q*OFF_SHARE + u.dc[t].q*DEF_SHARE)*STAFF_ELO;
}
function coordGrade(q){
  if(q>=40)return "one of the best in the country";
  if(q>=20)return "highly regarded";
  if(q>=2)return "solid";
  if(q>=-20)return "unproven";
  return "in over his head";
}
function coordCandidates(rng,prestige,side,rep){
  return [0,1,2].map(()=>{
    const c=newCoordinator(rng,prestige,side,(rep||0)*0.22);
    c.grade=coordGrade(c.q+rng.gauss(0,11));
    return c;
  });
}
/* ============ poll: college basketball ============ */
/* The league's ranking. The core asks any ranking for order(), rankMap() and
   update(results, elo); college football's is a voters' poll. */
/* Basketball voters weigh losses less than football's: the best teams lose
   five to eight times over thirty games. Each game date moves the poll less. */
const INERTIA=0.82,ELO_PULL=0.10,L_UNR=-30,L_RNK=-12,L_T10=-5,
      W_T10=28,W_RNK=15,W_UNR=2,BLOWOUT=6,IDLE=0;
const LOSS_TIER=22;
class Poll{
  constructor(pre){this.s=Object.assign({},pre);this.L={};NAMES.forEach(t=>this.L[t]=0)}
  eff(t){return this.s[t]-(this.L[t]||0)*LOSS_TIER}
  /* 365 teams: the order is sorted once and kept until the poll changes */
  order(){
    if(!this._ord){const e={}; NAMES.forEach(t=>e[t]=this.eff(t)); this._ord=NAMES.slice().sort((a,b)=>e[b]-e[a])}
    return this._ord.slice();
  }
  rankMap(){
    if(!this._rm){const m={}; this.order().forEach((t,i)=>m[t]=i+1); this._rm=m}
    return Object.assign({},this._rm);
  }
  _dirty(){this._ord=null;this._rm=null}
  update(res,elo){
    const prev=this.rankMap(), played=new Set(), d={};
    NAMES.forEach(t=>d[t]=0);
    res.forEach(r=>{
      const w=r.winner,l=r.loser,m=r.margin;
      this.L[l]=(this.L[l]||0)+1;
      played.add(w);played.add(l);
      const lr=prev[l]||999, wr=prev[w]||999;
      if(wr<=25||lr<=25){
        d[w]+= lr<=10?W_T10 : lr<=25?W_RNK : W_UNR;
        if(m>=21&&lr<=25)d[w]+=BLOWOUT;
      } else d[w]+=W_UNR;
      d[l]+= wr<=10?L_T10 : wr<=25?L_RNK : L_UNR;
      if(m>=21)d[l]-=8;
    });
    NAMES.forEach(t=>{
      this.s[t]=this.s[t]*INERTIA+(1-INERTIA)*this.s[t]
                +ELO_PULL*(elo[t]-this.s[t])+d[t]+(played.has(t)?0:IDLE);
    });
    this._dirty();
    // a ranked team that won doesn't drop: it keeps at least its old spot
    const winners=new Set(res.map(r=>r.winner));
    const nr=this.rankMap(), o=this.order();
    winners.forEach(t=>{
      if((prev[t]||999)<=25 && (nr[t]||999)>prev[t]){
        const ref=o[prev[t]-1];
        if(ref&&ref!==t)this.s[t]=this.eff(ref)+(this.L[t]||0)*LOSS_TIER+0.5;
      }
    });
    this._dirty();
    return this.rankMap();
  }
}
LEAGUE.Ranking=Poll;
/* ============ schedule: college basketball ============ */
/* Eleven non-conference dates, then nineteen of conference play. Conference
   play is a double round robin (the circle method, the second half mirrored
   so home and away even out); the big conferences play only the first 19
   rounds of it, so they meet some opponents twice and others once, as the
   real ones do. Non-conference: everyone paired with a school from another
   conference each date, no repeats; the stronger side usually hosts (the
   buy game), and some games are at early-season tournaments. */
const EARLY_EVENTS=["Maui Invitational","Battle 4 Atlantis","Players Era Festival","Empire Classic",
  "Jimmy V Classic","Champions Classic","CBS Sports Classic","Legends Classic","Charleston Classic",
  "Arizona Tip-Off","Emerald Coast Classic","Diamond Head Classic"];
function rrRoundsBB(teams){
  const t=teams.slice(); if(t.length%2)t.push(null);
  const n=t.length, rounds=[];
  for(let k=0;k<n-1;k++){
    const r=[];
    for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i]; if(a&&b)r.push(k%2===0?[a,b]:[b,a])}
    rounds.push(r); t.splice(1,0,t.pop());
  }
  return rounds.concat(rounds.map(r=>r.map(([a,b])=>[b,a])));   // the second time round, home and away swap
}
function buildScheduleBB(rng,R,year){
  const sched=[], met={}, key=(a,b)=>a<b?a+"|"+b:b+"|"+a;
  const NC=LEAGUE.schedule.nonConf, CW=LEAGUE.schedule.confWeeks;
  // conference play
  const byConf={}; NAMES.forEach(t=>{(byConf[CONF[t]]=byConf[CONF[t]]||[]).push(t)});
  Object.keys(byConf).forEach(c=>{
    const rounds=rrRoundsBB(rng.shuffle(byConf[c].slice())).slice(0,CW);
    // fewer rounds than dates: spread the byes out
    const slots=Array.from({length:CW},(_,i)=>i);
    const pick=rounds.length>=CW?slots:slots.filter((_,i)=>Math.floor(i*rounds.length/CW)!==Math.floor((i+1)*rounds.length/CW)||i===CW-1).slice(0,rounds.length);
    rounds.forEach((r,i)=>r.forEach(([h,a])=>{sched.push({week:NC+pick[i],home:h,away:a,conf:true,neutral:false}); met[key(h,a)]=(met[key(h,a)]||0)+1}));
  });
  // non-conference: pair everyone each date with someone from another conference
  // non-conference rivalries are pinned: same date every year, home alternating by year
  const pinned={};
  (typeof RIVALS!=="undefined"?RIVALS:[]).forEach(([a,b,n,w])=>{
    if(w===undefined||CONF[a]===CONF[b])return;
    (pinned[w]=pinned[w]||[]).push(year%2?[a,b]:[b,a]);
  });
  for(let w=0;w<NC;w++){
    const fixed=(pinned[w]||[]).filter(([a,b])=>!met[key(a,b)]);
    fixed.forEach(([h,a])=>{met[key(h,a)]=1; sched.push({week:w,home:h,away:a,conf:false,neutral:false,rivalry:true})});
    const busy=new Set([].concat(...fixed));
    let best=null;
    for(let attempt=0;attempt<40&&!best;attempt++){
      const pool=rng.shuffle(NAMES.filter(t=>!busy.has(t))), pairs=[]; let ok=true;
      while(pool.length>=2){
        const a=pool.shift();
        const j=pool.findIndex(b=>CONF[b]!==CONF[a]&&!met[key(a,b)]);
        if(j<0){ if(pool.length>1){ok=false;break} pool.shift(); continue }   // an odd one out sits
        pairs.push([a,pool.splice(j,1)[0]]);
      }
      if(ok)best=pairs;
    }
    (best||[]).forEach(([a,b])=>{
      met[key(a,b)]=1;
      const strong=(R[a]||0)>=(R[b]||0)?a:b, weak=strong===a?b:a;
      const x=rng.r();
      if(x<0.12){ sched.push({week:w,home:strong,away:weak,conf:false,neutral:true,site:rng.pick(EARLY_EVENTS)}) }
      else if(x<0.84){ sched.push({week:w,home:strong,away:weak,conf:false,neutral:false}) }   // the buy game
      else sched.push({week:w,home:weak,away:strong,conf:false,neutral:false});             // a return trip
    });
  }
  return sched;
}
LEAGUE.buildSchedule=buildScheduleBB;
/* ============ offseason: college basketball ============ */
/* Players arrive as freshmen, develop for up to four years, and leave by
   graduating or declaring for the NBA draft, the best of them after a single
   season (the one-and-done). Programs sign a class every year, spend a
   budget and drift in prestige. Conferences stay as they are. */

function makePlayer(rng,target,cls,posIdx){
  // upperclassmen are closer to their ceiling; freshmen start lower with room to grow
  const clsAdj=[-7,-2,2,4][cls];   // centred so a normal class mix averages the target
  const r=Math.round(Math.max(30,Math.min(99,rng.gauss(target+clsAdj,5.5))));
  const pot=Math.round(Math.max(r,Math.min(99,r+rng.gauss(10-cls*2.5,5))));
  return {n:playerName(rng),p:POS[posIdx].p,i:posIdx,c:cls,r:r,pot:pot,
          hz:0,prod:0,st:0};
}

function makeRoster(rng,programElo){
  const target=eloToRating(programElo);
  const bag=[]; [3,3,2,2].forEach((n,k)=>{for(let i=0;i<n;i++)bag.push(3-k)});
  rng.shuffle(bag);
  const r=POS.map((_,i)=>makePlayer(rng,target,bag[i],i));
  // backups are younger and a clear step down, but the gap varies a lot
  const bbag=[]; [1,2,3,4].forEach((n,k)=>{for(let i=0;i<n;i++)bbag.push(3-k)});
  rng.shuffle(bbag);
  POS.forEach((_,i)=>{
    const b=makePlayer(rng,target-rng.range(6,17),bbag[i],i);
    b.r=Math.min(b.r,r[i].r);            // never better than the starter on day one
    r.push(b);
  });
  return r;
}

const ANCHOR=0.10;
const ANCHOR_OF=Object.fromEntries(NCAAB_TEAMS.map(t=>[t.n,NCAAB_ELO(t)]));

/* ---- offseason roster churn ---- */
function developRoster(u,t,rng,focus,devMod,bud,featured,staff){
  focus=focus||{pos:null,r:0,pot:0}; devMod=devMod||0; bud=bud||null;
  const cls=(u.classAvg&&u.classAvg[t]!==undefined)?u.classAvg[t]:null;
  const coach=u.coach[t];
  const base=eloToRating(u.program[t]);
  const target=(u.classAvg&&u.classAvg[t]!==undefined)
    ? base*0.68+u.classAvg[t]*0.32     // recent classes feed the pipeline
    : base;
  const leaving=[], arriving=[];
  const roster=u.roster[t];
  if(roster.length<POS.length*2){          // older save: give it a two-deep
    POS.forEach((_,i)=>{
      if(!roster[BK(i)]){
        const b=makePlayer(rng,target-rng.range(6,17),rng.int(3),i);
        b.r=Math.min(b.r,roster[i].r); roster[BK(i)]=b;
      }
    });
  }
  const newcomer=(i)=>{
    const cls=rng.r()<0.62?0:1;
    // a focus concentrates the class: better where you aim, thinner elsewhere
    const bonus=(!focus.pos||focus.pos.indexOf(POS[i%POS.length].p)>=0)?focus.r:(focus.off||0);
    // ten-man rosters: a class has to replace what leaves, so recruits arrive
    // closer to the program's level than in football
    const np=makePlayer(rng,target-rng.range(1,8)+(coach.q*0.045)+bonus
      +(coach.rec||0)*0.5+(bud?bud.recruitBonus:0),cls,i%POS.length);
    if(focus.pot)np.pot=Math.min(99,np.pot+focus.pot);
    if(focus.dev)np.up=focus.dev;
    if(cls===0)np.rec=true;
    // a five-star: ready to play now, with a ceiling the NBA will come for.
    // The stronger the program, the likelier it lands one.
    if(cls===0&&rng.r()<Math.max(0.01,Math.min(0.45,(base-66)/40))){
      np.r=Math.round(Math.max(np.r,base+rng.gauss(0,3))); np.pot=Math.min(99,Math.round(np.r+16+rng.gauss(0,4)));
      np.star5=true;
    }
    return np;
  };
  for(let i=0;i<roster.length;i++){
    const pl=roster[i];
    if(!pl)continue;
    if(pl.c>=3){                                   // senior graduates
      leaving.push({n:pl.n,p:pl.p,r:pl.r,c:pl.c,pot:pl.pot,starter:i<POS.length,
                    car:pl.car||null, from:pl.from||null, peak:pl.peak||pl.r,
                    idx:i%POS.length});
      if(i<POS.length){
        // the backup steps up, and a new man arrives behind him
        roster[i]=roster[BK(i)];
        roster[BK(i)]=newcomer(i);
        arriving.push(roster[BK(i)]);
      }else{
        roster[i]=newcomer(i); arriving.push(roster[i]);
      }
    }else{
      // development: biggest jumps early, capped by potential, nudged by coaching
      const base=[6.2,4.0,2.2][pl.c];
      const feat=(featured!==undefined&&featured!==null&&featured===i)?3.8:0;
      // everyone plays both ends: both assistants shape a player's development
      const side=staff?((staff.oc||0)+(staff.dc||0))/2:0;
      let g=rng.gauss(base+coach.q*0.035+devMod+(pl.up||0)+feat+(side||0),3.0);
      pl.r=Math.round(Math.max(30,Math.min(pl.pot,pl.r+g)));
      pl.peak=Math.max(pl.peak||0,pl.r);
      pl.c++;
      // the best leave early for the NBA, the very best after one season
      let keepOdds=bud?Math.max(0,1-bud.retention):1;
      if(featured!==undefined&&featured!==null&&featured===i)keepOdds*=0.34;
      // NBA teams draft ceilings: what he is, and more what he could be
      const ready=0.45*pl.r+0.55*Math.max(pl.r,pl.pot);
      if(ready>=77 && rng.r() < Math.min(0.95,((ready-75)/8)*(pl.c===1?1.4:1))*keepOdds){
        const wasFeatured=(featured!==undefined&&featured!==null&&featured===i);
        leaving.push({n:pl.n,p:pl.p,r:pl.r,c:pl.c-1,pot:pl.pot,early:true,featured:wasFeatured,
                      starter:i<POS.length, car:pl.car||null, from:pl.from||null,
                      peak:pl.peak||pl.r, idx:i%POS.length});
        if(wasFeatured)u.pipeline=(u.pipeline||0)+1;
        if(i<POS.length){
          roster[i]=roster[BK(i)];
          roster[BK(i)]=newcomer(i);
          arriving.push(roster[BK(i)]);
        }else{ roster[i]=newcomer(i); arriving.push(roster[i]) }
      }
    }
  }
  POS.forEach((_,i)=>{
    const s=roster[i], b=roster[BK(i)];
    if(s&&b&&b.r>s.r+2){roster[i]=b;roster[BK(i)]=s}   // clear upgrade wins the job
  });
  return {leaving:leaving,arriving:arriving};
}

function classLabel(rank,total){
  const pct=rank/total;
  if(rank<=10)return "Top-10 class";
  if(pct<=0.20)return "Top-25 class";
  if(pct<=0.45)return "Above average";
  if(pct<=0.75)return "Middling";
  return "Thin class";
}

/* ---- realignment ---- */
/* Money moves programs. Every few years the strongest independents-in-waiting
   get poached upward and the weakest P4 members get left behind. */
function realign(u,rng,year){
  if(!u.conf)syncConf(u);
  const size=c=>NAMES.filter(t=>u.conf[t]===c).length;
  const moves=[];
  const P4L=LEAGUE.playoff.autoBids;
  const G6L=LEAGUE.conf.autoBidPool;
  const n=1+rng.int(3);
  for(let k=0;k<n;k++){
    // a strong Group of 6 program gets the call up
    const cands=NAMES.filter(t=>G6L.indexOf(u.conf[t])>=0 && u.program[t]>=1600)
      .sort((a,b)=>u.program[b]-u.program[a]).slice(0,8);
    if(!cands.length)break;
    const mover=rng.pick(cands);
    const dest=P4L.filter(c=>size(c)<20).sort((a,b)=>{
      const pa=NAMES.filter(t=>u.conf[t]===a).reduce((s,t)=>s+u.program[t],0)/Math.max(1,size(a));
      const pb=NAMES.filter(t=>u.conf[t]===b).reduce((s,t)=>s+u.program[t],0)/Math.max(1,size(b));
      return pa-pb;
    })[0];
    if(!dest||size(u.conf[mover])<=8)continue;
    moves.push({team:mover,from:u.conf[mover],to:dest});
    u.conf[mover]=dest;
  }
  syncConf(u);
  if(moves.length){u.realignLog=u.realignLog||[];u.realignLog.push({year:year,moves:moves})}
  return moves;
}

/* Each focus is a trade (measured over 8 careers: within noise of "Best
   available" at 3 and 5 years; "Chase upside" behind in year 1, ahead by
   year 5). r: recruits at the focus positions, off: everywhere else. */
const RECRUIT_FOCUS={
  balanced:{l:"Best available", d:"Take the best player on the board at every spot.",
            pos:null, r:0, pot:0},
  trenches:{l:"Bigs",            d:"Size and rebounding at forward and centre, at the cost of the guards.",
            pos:["PF","C"], r:8, off:-5, pot:0},
  skill:   {l:"Guards",          d:"Ball handlers and shooters, at the cost of size inside.",
            pos:["PG","SG","SF"], r:6, off:-5, pot:0},
  upside:  {l:"Chase upside",    d:"Raw prospects with ceilings. Weaker next year, dangerous in three or four.",
            pos:null, r:-7, pot:14, dev:3.4}
};

/* ============ program budget ============ */
/* A fixed pool each offseason. Everything you fund is something you didn't. */
const BUCKETS=[
 {k:"recruit",  l:"Recruiting",   d:"Better players sign. Pays off in two or three years."},
 {k:"develop",  l:"Development",  d:"Strength staff and position coaches. Your current roster grows faster."},
 {k:"facility", l:"Facilities",   d:"Permanent. Compounds quietly for as long as you're here."},
 {k:"retention",l:"Retention/NIL",d:"Keep your stars from leaving early for the draft."}
];

function budgetPool(u,t,wins){
  const base=6+Math.round((u.program[t]-1150)/150);
  const success=wins>=11?3:wins>=9?2:wins>=7?1:0;
  const fac=Math.floor((u.facility&&u.facility[t]?u.facility[t]:0)/22);
  return Math.max(6,Math.min(20,base+success+fac));
}

function applyBudgetRead(alloc){
  return {recruitBonus:(alloc.recruit||0)*0.30,
          devBonus:(alloc.develop||0)*0.46,
          retention:Math.min(0.62,(alloc.retention||0)*0.055)};
}

function applyBudget(u,t,alloc){
  u.facility=u.facility||{};
  u.facility[t]=(u.facility[t]||0)+(alloc.facility||0)*2.4;
  return {
    recruitBonus:(alloc.recruit||0)*0.30,
    devBonus:(alloc.develop||0)*0.46,
    retention:Math.min(0.62,(alloc.retention||0)*0.055),
    facility:Math.min(520,u.facility[t])
  };
}

/* ---- the transfer portal ----
   Who enters is known when the season ends (so the offseason screen can show
   them): backups stuck behind a clearly better starter, who want minutes, and
   about one in twelve of the stars at small programs, moving up (more drained
   the mid-majors and made first-round upsets rarer than history: bb-march). Seniors
   graduate instead. Keys identify a player across the offseason. */
const portalKey=(t,p)=>t+"|"+p.n+"|"+p.p;
const portalHash=x=>{let h=7;for(let i=0;i<x.length;i++)h=(h*31+x.charCodeAt(i))|0;return (Math.abs(h)%1000)/1000};
function portalEntrants(u){
  const out=[];
  NAMES.forEach(t=>{const R=u.roster[t];
    POS.forEach((P,i)=>{const st=R[i], bk=R[BK(i)];
      if(bk&&st&&bk.c<=2&&bk.r>=55&&st.r>=bk.r+4)
        out.push({key:portalKey(t,bk),from:t,n:bk.n,p:bk.p,r:bk.r,pot:bk.pot,c:bk.c,why:"wants more minutes"});
      if(st&&st.c<=2&&st.r>=72&&(u.program[t]||1500)<1600&&portalHash(t+st.n+u.year)<0.08)
        out.push({key:portalKey(t,st),from:t,n:st.n,p:st.p,r:st.r,pot:st.pot,c:st.c,why:"moving up"});
    })});
  return out.sort((a,b)=>b.r-a.r);
}
/* a transfer takes a spot at his position if he's better than who is there;
   whoever he pushes off the end leaves the program */
function portalPlace(R,pl){
  const i=POS.findIndex(P=>P.p===pl.p); if(i<0)return {ok:false};
  if(!R[i]||pl.r>R[i].r){const out=R[BK(i)]; R[BK(i)]=R[i]; R[i]=pl; return {ok:true,out:out,start:true}}
  if(!R[BK(i)]||pl.r>R[BK(i)].r){const out=R[BK(i)]; R[BK(i)]=pl; return {ok:true,out:out,start:false}}
  return {ok:false};
}
function runPortal(u,rng,entrants,U_CH,report){
  const moved=[], touched=new Set();
  const P={in:{},out:{},targets:{}}; const push=(o,t,x)=>{(o[t]=o[t]||[]).push(x)};
  // they leave: each program signs a freshman in the spot
  entrants.forEach(e=>{
    const R=u.roster[e.from], i=R.findIndex(p=>p&&portalKey(e.from,p)===e.key);
    if(i<0)return;                                   // graduated or gone to the NBA
    const pl=R[i]; R[i]=makePlayer(rng,eloToRating(u.program[e.from])-rng.range(4,10),0,i%POS.length);
    pl.yrsHere=0; moved.push({e:e,pl:pl}); touched.add(e.from);
    push(P.out,e.from,{n:pl.n,p:pl.p,r:pl.r,why:e.why});
  });
  const taken=new Set(), count={};
  const sign=(t,m)=>{const res=portalPlace(u.roster[t],m.pl); if(!res.ok)return res;
    taken.add(m.e.key); count[t]=(count[t]||0)+1; touched.add(t);
    push(P.in,t,{n:m.pl.n,p:m.pl.p,r:m.pl.r,from:m.e.from,start:res.start});
    if(res.out)push(P.out,t,{n:res.out.n,p:res.out.p,r:res.out.r,why:"lost his spot to a transfer"});
    return res};
  // people's targets first, in their order
  Object.keys(U_CH).forEach(t=>{const ch=U_CH[t]; if(!ch||!ch.portal||!ch.portal.length)return;
    P.targets[t]=ch.portal.map(k=>{
      const m=moved.find(x=>x.e.key===k&&!taken.has(k)), nm=k.split("|")[1];
      if(!m)return {n:nm,got:false,why:"didn't enter the portal after all (or went elsewhere first)"};
      if(m.e.from===t)return {n:nm,got:false,why:"he's leaving you"};
      const res=sign(t,m);
      return res.ok?{n:nm,got:true,start:res.start}:{n:nm,got:false,why:`no room at ${m.pl.p}: your players there are better`};
    })});
  // then the computer's programs, strongest first, two transfers at most each
  const people=new Set(Object.keys(U_CH));
  const order=NAMES.filter(t=>!people.has(t)).sort((a,b)=>u.program[b]-u.program[a]);
  moved.filter(m=>!taken.has(m.e.key)).forEach(m=>{
    const from=u.program[m.e.from]||1500;
    // many suitors: he picks among the programs that want him (not always
    // the strongest, which would hand the same programs the best every year)
    const suitors=[];
    for(const t of order){
      if(t===m.e.from||(count[t]||0)>=2||u.program[t]<from-60)continue;
      const R=u.roster[t], i=POS.findIndex(x=>x.p===m.pl.p);
      // a player leaving for minutes goes where he'll start; a star moving up
      // can also take a clear bench upgrade at a bigger program
      const starts=i>=0&&m.pl.r>(R[i]?R[i].r:0);
      const bench=i>=0&&m.e.why==="moving up"&&m.pl.r>(R[BK(i)]?R[BK(i)].r:0)+3;
      if(!starts&&!bench)continue;
      suitors.push(t); if(suitors.length>=12)break;
    }
    if(suitors.length)sign(suitors[rng.int(suitors.length)],m);
  });
  moved.filter(m=>!taken.has(m.e.key)).forEach(m=>push(P.out,m.e.from,{n:m.pl.n,p:m.pl.p,r:m.pl.r,why:m.e.why,unsigned:true}));
  report.portal=P;
  if(typeof S!=="undefined"&&S)S.lastPortalIn=P.in;          // for tests: every program's transfers in
  return touched;
}

function offseasonRosters(u,rng,healthy,elo,rec,choices){
  /* One human or several: each coached program gets its own choices. */
  const U_CH = choices.users || (choices.userTeam?{[choices.userTeam]:choices}:{});
  const chFor = t=>U_CH[t]||null;
  const leavers={};
  choices=choices||{};
  const entrants=portalEntrants(u);                 // decided as the season ended
  const risers=[],fallers=[],churn={};
  const ut=choices.userTeam;

  if(ut&&choices.coach){
    const c=choices.coach;
    u.coach[ut]={n:c.n,q:c.q,t:0,hired:true,arch:c.arch,rec:c.rec||0};
  }

  NAMES.forEach(t=>{
    const before=u.program[t];
    const c=u.coach[t];
    u.program[t]+=RECRUIT*(elo[t]-u.program[t])
                 +c.q*COACH_BUILD
                 +rng.gauss(0,PROG_NOISE*iscale(u.program[t]));
    // resources anchor a program: conference money, arena, recruiting reach.
    // A mid-major can rise, and a blue blood can fall, but both drift back
    // toward their structural level unless results keep them there.
    u.program[t]+=ANCHOR*(ANCHOR_OF[t]-u.program[t]);
    u.program[t]=Math.max(P_FLOOR,Math.min(P_CEIL,u.program[t]));
    c.t++;
    const ch=chFor(t);
    const focus=(ch&&ch.recruit)?ch.recruit:"balanced";
    let devMod=(ch&&ch.phil&&PHILOSOPHY[ch.phil])?PHILOSOPHY[ch.phil].dev:0;
    let bud=null;
    if(ch&&ch.budget){
      bud=applyBudget(u,t,ch.budget);
      devMod+=bud.devBonus;
      u.program[t]+=bud.facility*0.20;      // facilities lift the program itself
    }
    const ocq=(u.oc&&u.oc[t])?u.oc[t].q:0, dcq=(u.dc&&u.dc[t])?u.dc[t].q:0;
    churn[t]=developRoster(u,t,rng,RECRUIT_FOCUS[focus],devMod,bud,
                           ch?ch.featured:null,
                           {oc:ocq*0.030, dc:dcq*0.030});
    leavers[t]=churn[t].leaving;
    u.trueBase[t]=rosterElo(u.roster[t])
                 +(c.t<=1?ROOKIE_DIP:0)
                 +rng.gauss(0,ROSTER_NOISE);
    u.perceived[t]=0.58*elo[t]+0.42*u.program[t]+rng.gauss(0,PERCEPT_N);
    const d=u.program[t]-before;
    if(d>35)risers.push([t,Math.round(d)]);
    if(d<-35)fallers.push([t,Math.round(d)]);
  });

  /* The transfer portal: players move between programs. */
  const portalReport={}, preElo={};
  NAMES.forEach(t=>preElo[t]=rosterElo(u.roster[t]));
  const touched=runPortal(u,rng,entrants,U_CH,portalReport);
  // strength moves by exactly what the portal changed (the rest, noise included, stays)
  touched.forEach(t=>{u.trueBase[t]+=rosterElo(u.roster[t])-preElo[t]});

  /* Draft night: everyone who left the college game gets sorted out. */
  const draftResult=runDraft(u,rng,u.year,leavers);
  recordAlumni(u,u.year,draftResult.pool);

  /* Every program signs a class each year, whether or not a freshman starts.
     Quality tracks program pull, the coach's recruiting, and your stated focus. */
  u.classAvg=u.classAvg||{};
  const incoming=[];
  NAMES.forEach(t=>{
    const c=u.coach[t];
    const ch2=chFor(t);
    const focus=(ch2&&ch2.recruit)?RECRUIT_FOCUS[ch2.recruit]:RECRUIT_FOCUS.balanced;
    const q=eloToRating(u.program[t])
           +c.q*0.055 +(c.rec||0)*0.55
           +(focus.r||0)*0.45 +(focus.pot||0)*0.12
           +((ch2&&ch2.budget)?applyBudgetRead(ch2.budget).recruitBonus*0.6:0)
           +((ch2&&u.pipeline)?Math.min(4.5,u.pipeline*1.5):0)
           +rng.gauss(0,2.6);
    const signed=6+Math.round(rng.range(0,3));
    incoming.push([t,q,signed]);
    // classes compound: what you sign now shapes who is available later
    const prev=u.classAvg[t]!==undefined?u.classAvg[t]:q;
    u.classAvg[t]=prev*0.62+q*0.38;
  });
  incoming.sort((a,b)=>b[1]-a[1]);
  const classes={};
  incoming.forEach(([t,av,n],i)=>{
    classes[t]={avg:Math.round(av),n:n,rank:i+1,of:incoming.length,
                l:classLabel(i+1,incoming.length)};
  });
  const early={};
  NAMES.forEach(t=>{const x=churn[t].leaving.filter(y=>y.early); if(x.length)early[t]=x});

  if(ut&&choices.phil)u.phil=choices.phil;
  u.year++;
  const realigned=[];                          // conferences stay as they are
  risers.sort((a,b)=>b[1]-a[1]); fallers.sort((a,b)=>a[1]-b[1]);
  return {risers:risers.slice(0,5),fallers:fallers.slice(0,5),
          churn:churn,classes:classes,early:early,realigned:realigned,
          draft:draftResult, portal:portalReport.portal};
}

LEAGUE.offseason={
  newRoster:makeRoster,         // (rng, programElo) -> roster
  run:offseasonRosters,         // (u, rng, healthy, elo, rec, choices) -> report
  recruitFocus:RECRUIT_FOCUS,   // the choices offered on the offseason screen
  budget:{buckets:BUCKETS, pool:budgetPool},
  /* the league's offseason choices, as the offseason screen starts them */
  open(u,t,wins){
    const pool=budgetPool(u,t,wins);
    return {pool:pool, picks:{recruit:"balanced", portal:[],
      budget:{recruit:Math.ceil(pool/4),develop:Math.floor(pool/4),
              facility:Math.floor(pool/4),retention:pool-Math.ceil(pool/4)-2*Math.floor(pool/4)}}};
  },
  /* ...and as run() reads them */
  choices(P){ return {recruit:P.recruit, budget:P.budget, portal:P.portal||[]} },
  portalPreview:portalEntrants                  // who is likely to enter, for the screen
};

/* What a season is judged against, and how it is graded. The grade reads the
   result line from seasonResult. */
LEAGUE.goals={
  /* what the job demands, by program strength: wins over a 30-game season,
     and par for March (how far into the NCAA tournament the job expects) */
  expectations(p){
    if(p>=1950)return {w:24,par:1.2,l:"A deep March run. The Sweet 16 is the floor.",t:"SECOND WEEKEND"};
    if(p>=1800)return {w:21,par:0.6,l:"Make the NCAA tournament and win a game when you get there.",t:"WIN IN MARCH"};
    if(p>=1650)return {w:18,par:0.2,l:"Get into the field. Selection Sunday should be a good day.",t:"DANCE"};
    if(p>=1480)return {w:15,par:0,l:"A winning season and a real run at the conference title.",t:"CONTEND"};
    return {w:11,par:0,l:"Show progress. A winning conference record would be real movement.",t:"BUILD SOMETHING"};
  },
  isTitle(result){ return /NATIONAL/i.test(result) },
  firstTitle:"First national title of your tenure.",
  grade(wins,losses,result,exp){
    // no result yet (a season in progress, as the seat badge asks): March at par
    const march=!result?(exp.par||0):/NATIONAL/i.test(result)?5:/national championship/i.test(result)?3.6:/Final Four/.test(result)?3:
      /Elite Eight/.test(result)?2.3:/Sweet 16/.test(result)?1.6:/Second Round/.test(result)?0.9:
      /First Round/.test(result)?0.4:/Opening Round/.test(result)?0.2:/Made the NCAA/.test(result)?0.3:
      /^Won the/.test(result)?0.8:-(exp.par>=0.2?1.0:0);
    let s=(wins-exp.w)*0.32+march-(exp.par||0);
    if(wins<losses)s-=(exp.w>=15?1.0:0.2);
    const g=s>=4?"A+":s>=2.6?"A":s>=1.6?"A-":s>=0.9?"B+":s>=0.2?"B":s>=-0.6?"B-":
            s>=-1.4?"C+":s>=-2.2?"C":s>=-3.2?"C-":s>=-4.4?"D":"F";
    const l=s>=2.6?"Far beyond what anyone expected.":

            "A bad year, and everyone knows it.";
    return {g:g,l:l,miss:s<-0.6};                 // "Short of the mark" or worse

};

/* ============ the game: basketball ============ */
/* Played possession by possession: a turnover, or a shot (two or three),
   with fouls to the line and offensive rebounds for a second chance. The
   rating gap tilts each side's make rates and turnovers; home court is a
   small edge for the home side. A gameplan sets the pace (possessions) and
   the share of threes. Twos and threes are worth the same on average, so a
   plan changes how swingy a game is, not how many points it's worth: more
   possessions and fewer threes let the better team's talent show; fewer
   possessions and more threes make it a game of chances.
   Possessions are grouped into eight five-minute segments, which the live
   view shows one at a time (the sport's "drives"). */
const DRIVES_PER_TEAM = 4;                    // segments per half; 8 in a game
const SEGS = 8;
const BB_COLLEGE = {
  pace: 69,             // possessions per team per game, both teams balanced
  paceSd: 3.0,
  gapPerPoss: 0.0004,   // rating gap (Elo) -> make-rate edge (calibrated: test/bb-calibrate.js)
  toBase: 0.17, toGap: 0.9,
  two: 0.52, three: 0.352,   // with fouls and and-ones, a two and a three are each worth ~1.05
  foul2: 0.085, foul3: 0.015, ft: 0.715, and1: 0.07,   // threes are rarely fouled
  oreb: 0.22,
  pressTO: 0.08,        // a press forces this many extra turnovers...
  pressEasy: 0.05,      // ...and gives up this much easier baskets when broken
  pressPace: 1.1,      // and speeds the game up
  garbage: 13,          // a lead this big after 25 minutes: the benches come in
  benchPull: 0.05       // the bench's make-rate cost to the side that's ahead
};
/* a league can set its own game (LEAGUE.tuning.bb): the pros play 48
   minutes in quarters, faster, with better shooting */
const BB = Object.assign({}, BB_COLLEGE,
  (typeof LEAGUE!=="undefined"&&LEAGUE.tuning&&LEAGUE.tuning.bb)||{});
/* Calibrated on its own (test/bb-engine.js: 20,000 games, league spread sd
   160 Elo, home court 105 Elo): 72.8 points and 69 possessions a team, mean
   margin 11.9, game noise 12.7, home teams 59.2% (2.7 points) between equal
   sides, threes 35.2%, turnovers 0.173 a possession, overtime 6.9%.
   Real Division I: ~72, ~69, 11-12, ~11, 60-65% (~3), ~34%, ~0.18, ~6%.
   Calls (test/bb-calls.js): the press is usually right when behind late (as
   in real coaching); halftime and milking-the-clock calls are close; down 2
   on the last possession, the three is usually the better shot. */
const AGGR = {
  safe:      {tempo:1.36, three:0.18},        // work it inside: ~81 possessions against a balanced side
  balanced:  {tempo:1.00, three:0.38},
  aggressive:{tempo:0.66, three:0.64},        // shorten the game: ~57, and lots of threes
  // not gameplans: the engine's own late-game modes
  urgent:    {tempo:1.10, three:0.55},        // behind late: quick shots, threes
  sit:       {tempo:0.80, three:0.25},        // ahead late: bleed the clock
  chase:     {tempo:1.10, three:0.55},
  push:      {tempo:1.12, three:0.55}        // a coach's call: speed it up, let it fly
};
/* one possession: points scored, and a line for the box score */
function possession(rng, edge, mode, st, pressed){
  const A=AGGR[mode]||AGGR.balanced;
  if(pressed){ if(rng.r()<BB.pressTO){st.to++; return 0} edge+=BB.pressEasy }   // against the press
  if(rng.r() < BB.toBase - edge*BB.toGap*0.1){ st.to++; return 0 }
  for(let tries=0;tries<3;tries++){
    const three = rng.r() < A.three;
    // talent is worth the same per shot either way (2/3 of the edge on a
    // three), so taking more threes adds variance, not an edge
    const pMake = (three?BB.three+edge*2/3:BB.two+edge);
    if(rng.r() < (three?BB.foul3:BB.foul2)){          // fouled in the act
      const n=three?3:2; let pts=0; st.fta+=n;
      for(let i=0;i<n;i++) if(rng.r()<BB.ft){pts++; st.ftm++}
      return pts;
    }
    if(three)st.tpa++; else st.fga2++;
    if(rng.r() < pMake){
      if(three)st.tpm++; else st.fgm2++;
      let pts=three?3:2;
      if(!three&&rng.r()<BB.and1){st.fta++; if(rng.r()<BB.ft){pts++;st.ftm++}}
      return pts;
    }
    if(rng.r() >= BB.oreb) return 0;                  // defense rebounds
    st.oreb++;
  }
  return 0;
}
/* How the game is managed from here, given the segment and the home lead:
   the edge (home side's) and each side's mode. */
function gameState(seg,lead,eH,planH,planA){
  const left=SEGS-seg, big=Math.abs(lead);
  let e=eH, mH=planH, mA=planA;
  if(seg>=5&&big>=BB.garbage){                    // decided: benches on both sides
    e=eH*0.4-Math.sign(lead)*BB.benchPull; mH="balanced"; mA="balanced";
  }else if(left<=2&&big>=4&&big<BB.garbage){      // late and close enough to matter
    if(lead>0){mH="sit";mA="chase"} else {mH="chase";mA="sit"}
  }
  return {eH:e,mH:mH,mA:mA};
}
const blankTeamLine=()=>({to:0,fta:0,ftm:0,tpa:0,tpm:0,fga2:0,fgm2:0,oreb:0});
/* Late, the team behind fouls: the leader goes to the line (two shots) and
   the trailer gets the ball back and hunts threes. */
function foulTrip(rng,st){let p=0; st.fta+=2; for(let i=0;i<2;i++)if(rng.r()<BB.ft){p++;st.ftm++} return p}

/* The calls a coach can make. dp: {k, h (headline), b (the situation),
   opts: [[key, label], ...]}. */
function halfCall(lead){
  return lead<0
    ? {k:"half",h:`Down ${-lead} at the half`,b:"Speed it up and let it fly, or stay the course?",
       opts:[["push","Speed it up, more threes"],["normal","Stay the course"]]}
    : {k:"half",h:lead>0?`Up ${lead} at the half`:"Tied at the half",b:"Slow it down and protect it, or keep going?",
       opts:[["sit","Slow it down"],["normal","Keep going"]]};
}
function lateCall(lead){
  return lead<0
    ? {k:"chase",h:`Down ${-lead}, ${BB.lateLeft||"four"} minutes left`,b:"Throw on the full-court press, or play it straight? The press forces turnovers and gives up easy baskets.",
       opts:[["press","Full-court press"],["normal","Play it straight"]]}
    : {k:"protect",h:`Up ${lead}, ${BB.lateLeft||"four"} minutes left`,b:"Milk the clock, or keep attacking?",
       opts:[["sit","Milk the clock"],["keep","Keep attacking"]]};
}
function lastCall(){
  return {k:"last",h:"Down 2, last possession",b:"A three wins it. A two sends it to overtime.",
    opts:[["three","Go for the win: three"],["two","Tie it: two, and overtime"]]};
}

/* The live game. humans: {home, away} (a bare boolean is the one-coach
   form: true = the user is home). next() plays a segment, or returns a call
   for a person to make; reply(v) answers it. */
function makeLiveGame(rng, eloH, eloA, planH, planA, humans){
  if(typeof humans!=="object"||humans===null)humans={home:!!humans, away:!humans};
  const tempo=((AGGR[planH]||AGGR.balanced).tempo+(AGGR[planA]||AGGR.balanced).tempo)/2;
  const poss=Math.max(50,Math.round(rng.gauss(BB.pace*tempo,BB.paceSd)));
  const gap=(eloH-eloA)*(typeof GAP_SCALE!=="undefined"?GAP_SCALE:1);
  const eH=gap*BB.gapPerPoss/2;
  const st={h:0,a:0,drives:[],seg:0,poss:poss,humans:humans,lines:{h:blankTeamLine(),a:blankTeamLine()},
    mode:{home:planH,away:planA}, late:{home:null,away:null}, asked:{}, queue:[], ask:null, answer:null,
    ot:0, done:false, last:null};
  const lead=side=>side==="home"?st.h-st.a:st.a-st.h;
  // calls due before a segment: queue one per human side that has one
  const queueCalls=(when)=>{
    ["home","away"].forEach(side=>{
      if(!humans[side]||st.asked[when+side])return;
      const L=lead(side); let dp=null;
      if(when==="half")dp=halfCall(L);
      else if(when==="late"&&L!==0&&Math.abs(L)<=9)dp=lateCall(L);
      else if(when==="last"&&L===-2)dp=lastCall();
      if(dp){st.asked[when+side]=true; st.queue.push({side:side,dp:dp})}
    });
  };
  const playSeg=(s)=>{
    const n=s<SEGS?Math.floor(poss/SEGS)+(s<poss%SEGS?1:0):Math.round(poss/SEGS);
    const g=gameState(Math.min(s,SEGS-1),st.h-st.a,eH,planH,planA);
    let mH=g.mH, mA=g.mA;
    // a person's calls override the computer's game management for their side
    // (a press is about the other side's possessions, not this side's mode)
    const lm=x=>x&&x!=="press"?x:null;
    if(humans.home)mH=lm(st.late.home)||st.mode.home; if(humans.away)mA=lm(st.late.away)||st.mode.away;
    if(s>=SEGS){mH="urgent";mA="urgent"}
    let dh=0,da=0, nH=n, nA=n;
    // a press: the side pressing makes the other side's possessions riskier
    // (more turnovers, but easier baskets when it's broken) and faster
    const pressH=st.late.home==="press", pressA=st.late.away==="press";
    const nn=(pressH||pressA)?Math.round(n*BB.pressPace):n;
    for(let i=0;i<Math.max(nn,nA);i++){
      dh+=possession(rng,g.eH,mH,st.lines.h,pressA); da+=possession(rng,-g.eH,mA,st.lines.a,pressH);
    }
    // the last minute of regulation: whoever is behind by one to eight fouls
    // to stop the clock, sending the leader to the line and getting the ball
    // back, up to four times (extra possessions: the game lasts longer)
    const lastSeg=s===SEGS-1, trail=st.h+dh-(st.a+da);
    const foulH=lastSeg&&trail<0&&trail>=-8, foulA=lastSeg&&trail>0&&trail<=8;
    if(foulH||foulA){
      for(let k=0;k<4;k++){
        const behindH=foulH&&st.h+dh<st.a+da, behindA=foulA&&st.a+da<st.h+dh;
        if(!behindH&&!behindA)break;
        if(behindA){ dh+=foulTrip(rng,st.lines.h); da+=possession(rng,-g.eH,"push",st.lines.a) }
        else { da+=foulTrip(rng,st.lines.a); dh+=possession(rng,g.eH,"push",st.lines.h) }
      }
    }
    st.h+=dh; st.a+=da;
    const d={seg:s,h:dh,a:da,sh:st.h,sa:st.a,ot:s>=SEGS?s-SEGS+1:0}; st.drives.push(d); return d;
  };
  // the last possession, when a side trails by two: a three to win or a two to tie
  const lastShot=(side,choice)=>{
    const L=st.lines[side==="home"?"h":"a"], e=side==="home"?eH:-eH;
    const three=choice==="three";
    if(three)L.tpa++; else L.fga2++;
    const made=rng.r()<(three?BB.three+e*2/3:BB.two+e);
    if(made){ if(three)L.tpm++; else L.fgm2++;
      if(side==="home")st.h+=three?3:2; else st.a+=three?3:2 }
    st.last={side:side,choice:choice,made:made};
    st.drives.push({seg:"last",side:side,choice:choice,made:made,sh:st.h,sa:st.a});
  };
  st.next=function(){
    if(st.done)return {done:true,h:st.h,a:st.a,drives:st.drives};
    if(st.ask)return st.ask;
    if(st.pendingSide){                               // an answer has come in
      const P=st.pendingSide, v=st.answer; st.pendingSide=null; st.answer=null;
      if(P.dp.k==="half")st.mode[P.side]=v==="push"?"push":v==="sit"?"sit":st.mode[P.side];
      else if(P.dp.k==="chase")st.late[P.side]=v==="press"?"press":null;
      else if(P.dp.k==="protect")st.late[P.side]=v==="sit"?"sit":null;
      else if(P.dp.k==="last"){lastShot(P.side,v); st.lastDone=true}
    }
    if(st.queue.length){const Q=st.queue.shift(); st.pendingSide=Q;
      st.ask={ask:Q.dp,mine:lead(Q.side)>=0?(Q.side==="home"?st.h:st.a):(Q.side==="home"?st.h:st.a),
              theirs:Q.side==="home"?st.a:st.h,q:st.seg<4?1:st.seg<SEGS?2:3,side:Q.side};
      const r=st.ask; st.ask=null; st.waiting=r; return r}
    if(st.seg===4&&!st.halfDone){st.halfDone=true; queueCalls("half"); if(st.queue.length)return st.next()}
    if(st.seg===SEGS-1&&!st.lateDone){st.lateDone=true; queueCalls("late"); if(st.queue.length)return st.next()}
    if(st.seg===SEGS&&!st.lastDone){
      st.lastDone=true;
      // someone trails by two with the last possession: a coin flip says who has the ball
      const trailer=st.h-st.a===-2?"home":st.a-st.h===-2?"away":null;
      if(trailer&&rng.r()<0.5){
        if(humans[trailer]){queueCalls("last"); if(st.queue.length)return st.next()}
        else lastShot(trailer,"two");                 // the computer ties it
      }
    }
    if(st.seg>=SEGS&&st.h!==st.a){st.done=true; return {done:true,h:st.h,a:st.a,drives:st.drives}}
    if(st.seg>=SEGS+6){ if(rng.r()<0.5)st.h++; else st.a++; st.done=true; return {done:true,h:st.h,a:st.a,drives:st.drives} }
    const d=playSeg(st.seg); st.seg++;
    return {drive:d,h:st.h,a:st.a};
  };
  st.reply=function(v){ st.answer=v; st.waiting=null };
  return st;
}

/* A whole game at once (every game but the ones you watch): the same game,
   with the computer's calls, or opts.decide for a person who isn't watching. */
function playGame(rng, eloH, eloA, planH, planA, opts){
  opts=opts||{};
  const humans=opts.decide?{home:!!opts.userIsHome,away:!opts.userIsHome}:{home:false,away:false};
  const e=makeLiveGame(rng,eloH,eloA,planH,planA,humans);
  let guard=0;
  while(guard++<200){
    const r=e.next();
    if(r.done)return {h:r.h,a:r.a,drives:r.drives,poss:e.poss,ot:Math.max(0,e.seg-SEGS),lines:e.lines,last:e.last};
    if(r.ask){ const v=opts.decide(r.ask,{mine:r.mine,theirs:r.theirs,q:r.q});
      e.reply(v||r.ask.opts[r.ask.opts.length-1][0]) }
  }
  return {h:e.h,a:e.a,drives:e.drives,poss:e.poss,ot:0,lines:e.lines};
}

/* Which option each of them would take, and what they'd say about it. */
/* The Bears do not reason. They react. */
const BEAR_YELL={
  half:  [`Say something inspiring. We've forgotten how.`,
          `New plan: score more baskets than them. You're welcome.`,
          `LOUDER. Whatever we're doing, LOUDER.`,
          `We want a dunk. We don't care who does it.`,
          `We have notes. None of them are useful.`],
  chase: [`PRESS. Press them into the SEA.`,
          `Full court. Full effort. Full bears.`,
          `We refuse to lose quietly. Absolutely refuse.`,
          `Trap everything. Trap the referees if you have to.`,
          `This is a personal insult to us specifically.`],
  protect:[`MORE. We want MORE points.`,
          `Dunk on them. Then dunk on them again.`,
          `Holding the ball is for cowards and accountants.`,
          `Sitting on a lead is how you get a lead taken.`,
          `Keep scoring until someone makes us stop. Nobody can.`],
  last:  [`THREE. Obviously three. Why is this even a question.`,
          `Win it or lose it. Overtime is for the undecided.`,
          `We were BORN to take this shot.`,
          `Three points or nothing. Preferably three points.`],
  distracted:[`CHOCOLATE CAKE!`,
          `What did we do?`,
          `COOKIES AND CREAM!`,
          `Is there chocolate cake after? There should be chocolate cake after.`,
          `What did we do? Did we do something? Was it us?`,
          `We would like cookies and cream. Now. During the game.`,
          `CHOCOLATE CAKE. That's our note. That's the whole note.`,
          `Wait, what did we do?`,
          `Cookies and cream and then whatever you decided. In that order.`]
};
/* Pearl is a dog roughly one time in six. Unlike the Bears, her advice
   survives it — the dog bit wraps the read rather than replacing it, so you
   never lose the balanced opinion just because a squirrel went past. */
const PEARL_BEFORE=[`Woof! `,`SQUIRREL. `,`Ooh, ooh, ooh! `,
  `Was that the treat bag? ... Anyway. `,`Someone's at the door! ... No. False alarm. `];
const PEARL_AFTER=[` Woof!`,` (Tail going. Very hard.)`,` Can we go outside after?`,
  ` Also, is it dinner? It smells like dinner.`,` I'm going to spin in a circle about this.`,
  ` Ball. BALL. Sorry \u2014 the actual ball. Carry on.`];
function pearlSay(line, seed){
  const n=Math.abs(seed|0);
  if(n%6!==1)return line;
  return (n%12===1)
    ? PEARL_BEFORE[Math.floor(n/6)%PEARL_BEFORE.length]+line
    : line+PEARL_AFTER[Math.floor(n/6)%PEARL_AFTER.length];
}

function bearYell(kind, seed){
  const n=Math.abs(seed|0);
  // roughly one call in four, they lose the thread entirely
  if(n%4===2){
    const d=BEAR_YELL.distracted;
    return d[Math.floor(n/4)%d.length];
  }
  const pool=BEAR_YELL[kind]||BEAR_YELL.half;
  return pool[n%pool.length];
}

function staffTake(dp, ctx){
  const diff = (ctx.mine||0)-(ctx.theirs||0);
  const seed = (ctx.mine||0)*7+(ctx.theirs||0)*3+(ctx.q||0);
  const R=[];
  if(dp.k==="half"){
    const down=diff<0;
    R.push({who:"bears", pick: down?"push":"normal", line:bearYell("half",seed)});
    R.push({who:"pearl", pick:"normal", line:pearlSay(down
      ? `They're not playing badly! Let's just play a bit better.`
      : `This is going great. Exactly as we are, please.`,seed)});
    R.push({who:"capy", pick: down?"normal":"sit", line: down
      ? `If I may \u2014 hurrying rarely mends a scoreline. It tends to lengthen it.`
      : `We have, I think, got what we came for. I'd rather slow things down.`});
  }
  else if(dp.k==="chase"){
    R.push({who:"bears", pick:"press", line:bearYell("chase",seed)});
    R.push({who:"pearl", pick: diff<=-4 ? "press":"normal", line:pearlSay(diff<=-4
      ? `More than a couple of baskets \u2014 let's go and get the ball back!`
      : `It's one basket! We've got time. No need to panic.`,seed)});
    R.push({who:"capy", pick:"normal", line:`A press, one rather suspects, is mostly a way of giving up layups quickly.`});
  }
  else if(dp.k==="protect"){
    R.push({who:"bears", pick:"keep", line:bearYell("protect",seed)});
    R.push({who:"pearl", pick: diff>=7?"sit":"keep", line:pearlSay(diff>=7
      ? `We're way ahead! Let's just use up the clock and go home happy.`
      : `Whatever we did to get here \u2014 more of that, please.`,seed)});
    R.push({who:"capy", pick:"sit", line:`I would gently suggest fewer possessions. Fewer possessions, fewer catastrophes.`});
  }
  else if(dp.k==="last"){
    R.push({who:"bears", pick:"three", line:bearYell("last",seed)});
    R.push({who:"pearl", pick:"three", line:pearlSay(`A three wins it! Overtime is a whole other game, and they're tired too.`,seed)});
    R.push({who:"capy", pick:"two", line:`It seems to me a two is the likelier shot. Overtime is, at least, not losing.`});
  }
  return R;
}

/* A line for the moments outside a game. */
function staffAside(kind, data){
  const L={
    depth:[["bears",`Play the kid. Chaos is a ladder.`],
           ["pearl",`He's waited so patiently for this. Let him play!`],
           ["capy",`It seems to me changing the point guard mid-season rarely goes as people imagine.`]],
    staff:[["bears",`FIRE HIM. At center court. During a timeout.`],
           ["pearl",`Everyone has bad seasons. Maybe he just needs a bit of help.`],
           ["capy",`I do believe I'd want to be very sure before we start pulling things apart.`]],
    win:  [["bears",`WE ARE UNSTOPPABLE. Say it back to us.`],
           ["pearl",`I'm SO proud of them. Every single one.`],
           ["capy",`Lovely. Though I am, I confess, already a little worried about next week.`]],
    loss: [["bears",`Rigged. Absolutely rigged. We're appealing.`],
           ["pearl",`It's alright! There's another one next week.`],
           ["capy",`I did rather have a feeling. I didn't want to say.`]],
    title:[["bears",`RINGS. RINGS FOR THE BEARS. We did most of it.`],
           ["pearl",`Look at them all crying. It's the loveliest thing.`],
           ["capy",`Champions. I have, I should say, prepared some remarks. They are quite long.`]]
  };
  const set=L[kind]; if(!set)return null;
  const i=Math.abs((data|0))%set.length;
  return {who:set[i][0], line:set[i][1]};
}

function isBigGame(g,team,seaRankMap,rivalName){
  if(!g)return false;
  if(rivalName)return true;
  if(g.title||g.site)return true;
  const opp=g.home===team?g.away:g.home;
  if((seaRankMap[opp]||999)<=25)return true;
  if(g.margin<=5)return true;
  return false;
}
/* where the clock stands after segment s: "1st 15:00" ... "2nd 0:00", or OT */
function segClock(s){
  if(s==="last")return "0:02";
  if(s>=8)return "OT"+(s-7>1?(s-7):"");
  if(BB.quarters)return "Q"+(Math.floor(s/2)+1)+" "+(s%2?"0:00":"6:00");   // the pros: four 12-minute quarters
  const half=s<4?"1st":"2nd", left=20-5*((s%4)+1);
  return half+" "+left+":00";
}
/* a game without a recorded log (the computer's games): segments that add up
   to the final score */
function gameScript(g,rosterHome,rosterAway,seed){
  const rng=new RNG(seed), n=8, out=[];
  const split=(tot)=>{const w=Array.from({length:n},()=>0.6+rng.r()); const W=w.reduce((a,b)=>a+b,0);
    const v=w.map(x=>Math.floor(tot*x/W)); let r=tot-v.reduce((a,b)=>a+b,0); while(r-->0)v[rng.int(n)]++; return v};
  const hs=split(g.hp), as=split(g.ap); let sh=0,sa=0;
  for(let s=0;s<n;s++){sh+=hs[s]; sa+=as[s]; out.push({seg:s,h:hs[s],a:as[s],sh:sh,sa:sa})}
  return driveScript(g,out);
}

/* The scoreboard, the run of play in five-minute segments, the call screen
   with the staff's advice, and the replay view. */
function segLabel(d){ return d.seg==="last"?"Last shot":segClock(d.seg) }
function driveWord(d){
  if(d.seg==="last")return d.made?(d.choice==="three"?"the three is GOOD":"the two is good, overtime"):"the shot won't go";
  if(d.h===d.a)return "an even stretch, "+d.h+" apiece";
  return (d.h>d.a?"home":"away")+" run, "+Math.max(d.h,d.a)+"-"+Math.min(d.h,d.a);
}
/* a segment in words, with names from the rosters */
function driveScript(g,drives){
  const rng=new RNG(watchSeed(g));
  const RH=SEA.roster?SEA.roster[g.home]:null, RA=SEA.roster?SEA.roster[g.away]:null;
  const nm=(R,i)=>R&&R[i]?R[i].n:"a guard";
  return drives.map(d=>{
    if(d.seg==="last"){
      const tm=d.side==="home"?g.home:g.away, R=d.side==="home"?RH:RA;
      return {seg:d.seg,clock:"0:02",team:tm,pts:d.made?(d.choice==="three"?3:2):0,outcome:d.made?"GOOD":"MISS",
        text:`${nm(R,rng.int(3))} ${d.choice==="three"?"pulls up from three":"drives for two"}: ${d.made?"good!":"no good."}`,h:d.sh,a:d.sa};
    }
    const homeRun=d.h>=d.a, tm=homeRun?g.home:g.away, R=homeRun?RH:RA, big=Math.max(d.h,d.a), small=Math.min(d.h,d.a);
    const who=nm(R,rng.int(5)), pts=Math.max(2,Math.round(big*rng.range(0.3,0.6)));
    const text=big-small>=8?`${tm} goes on a ${big}-${small} run, ${who} with ${pts}`
      :big===small?`back and forth, ${big} apiece`
      :rng.r()<0.5?`${tm} edges the stretch ${big}-${small}`:`${who} keeps ${tm} going, ${big}-${small} over five minutes`;
    return {seg:d.seg,clock:segClock(d.seg),team:tm,pts:big,outcome:big-small>=8?"RUN":"",text:text,h:d.sh,a:d.sa};
  });
}
