      // an s-curve: odd lines left to right, even lines back again
      const regs=(line%2?REGIONS:REGIONS.slice().reverse()).slice(0,n);
      regs.forEach(r=>{const t=direct[di++]; bracket[r][line]=t; this.seeds[t]=line; this.region[t]=r});
    });
    // Opening Round pairings: best v worst within each group, into the open slots
    const pairUp=(grp)=>{const g=grp.slice(), out=[]; while(g.length>=2)out.push([g.shift(),g.pop()]); return out};
    const openSlots=[];
    REGIONS.forEach(r=>{ if(!bracket[r][11])openSlots.push({region:r,line:11,group:"al"}) });
    REGIONS.forEach(r=>openSlots.push({region:r,line:12,group:"al"}));
    REGIONS.forEach(r=>{ if(!bracket[r][15])openSlots.push({region:r,line:15,group:"aq"}) });
    REGIONS.forEach(r=>openSlots.push({region:r,line:16,group:"aq"}));
    const alPairs=pairUp(lowAL), aqPairs=pairUp(lowAQ);
    this.openGames=[];
    openSlots.forEach(sl=>{
      const pr=(sl.group==="al"?alPairs:aqPairs).shift(); if(!pr)return;
      pr.forEach(t=>{this.seeds[t]=sl.line; this.region[t]=sl.region});
      this.openGames.push({region:sl.region,line:sl.line,a:pr[0],b:pr[1]});
    });
    this.bracket=bracket;
    NAMES.forEach(t=>this.selRec[t]=this.rec[t][0]+"-"+this.rec[t][1]);
    this.cfpRank={}; field.forEach((t,i)=>this.cfpRank[t]=i+1);
  },
  _open(){
    const games=this.openGames.map(o=>{
      const g=this._resolve(o.a,o.b,true,{site:o.line<=12?"Dayton":"Opening Round",title:"Opening Round"});
      g.hseed=o.line; g.aseed=o.line; g.region=o.region;
      this.bracket[o.region][o.line]=g.winner; return g});
    this.rounds.open=games;
    this.poll.update(games,this.elo);
  },
  /* the games of an NCAA round, as pairs [home, away] with their region */
  _ncaaPairs(round){
    const out=[];
    if(round==="r64"){
      REGIONS.forEach(r=>R64_PAIRS.forEach(([x,y])=>out.push({h:this.bracket[r][x],a:this.bracket[r][y],region:r})));
    } else if(round==="f4"){
      const champ=r=>(this.rounds.e8.find(g=>g.region===r)||{}).winner;
      out.push({h:champ("East"),a:champ("South"),region:"Final Four"});
      out.push({h:champ("Midwest"),a:champ("West"),region:"Final Four"});
    } else if(round==="final"){
      const w=this.rounds.f4.map(g=>g.winner); out.push({h:w[0],a:w[1],region:"Final"});
    } else {
      const prev={r32:"r64",s16:"r32",e8:"s16"}[round];
      REGIONS.forEach(r=>{
        const ws=this.rounds[prev].filter(g=>g.region===r).map(g=>g.winner);   // in bracket order
        for(let i=0;i<ws.length;i+=2)out.push({h:ws[i],a:ws[i+1],region:r});
      });
    }
    // the better seed is listed first ("home"); every game is at a neutral site
    return out.map(p=>(this.seeds[p.a]<this.seeds[p.h]||(this.seeds[p.a]===this.seeds[p.h]&&this.resume(p.a)>this.resume(p.h)))?{h:p.a,a:p.h,region:p.region}:p);
  },
  _ncaa(){
    const round=this.phase;
    const site={f4:"Ford Field, Detroit",final:"Ford Field, Detroit"}[round]||null;
    const games=this._ncaaPairs(round).map(p=>{
      const g=this._resolve(p.h,p.a,true,{site:site,title:(p.region&&REGIONS.indexOf(p.region)>=0?p.region+" \u00b7 ":"")+ROUND_NAME[round]});
      g.hseed=this.seeds[p.h]; g.aseed=this.seeds[p.a]; g.region=p.region; return g});
    this.rounds[round]=games;
    if(round==="final")this.champion=games[0].winner;
    this.poll.update(games,this.elo);
  },
  /* what a team faces next in the postseason, and the exact live pairing */
  _nextFor(team){
    const p=this.phase;
    if(CT_ROUNDS.indexOf(p)>=0){
      const c=CONF[team];
      const T=this.ct[c]||{seeds:this.confRank(c).slice(0,(LEAGUE.playoff.ctCap||{})[c]||16),res:{}};
      const save=this.ct[c]; this.ct[c]=T;
      const pr=this._ctPairs(c,p).find(x=>x[0]&&x[1]&&(x[0]===team||x[1]===team));
      this.ct[c]=save;
      return pr?{home:pr[0],away:pr[1],neutral:true,label:c+" Tournament "+ROUND_NAME[p]}:null;
    }
    if(p==="open"){const o=(this.openGames||[]).find(o=>o.a===team||o.b===team);
      return o?{home:o.a,away:o.b,neutral:true,label:"Opening Round"}:null}
    if(NCAA_ROUNDS.indexOf(p)>0&&this.bracket){
      const pr=this._ncaaPairs(p).find(x=>x.h===team||x.a===team);
      return pr?{home:pr.h,away:pr.a,neutral:true,label:(REGIONS.indexOf(pr.region)>=0?pr.region+" \u00b7 ":"")+ROUND_NAME[p]}:null;
    }
    return null;
  },
  postMatchup(team){return this._nextFor(team)},
  postNext(team){const m=this._nextFor(team); if(!m)return null;
    return {label:m.label,opp:m.home===team?m.away:m.home,neutral:true}},
  titleField(c){return this.confRank(c)},
  myBowl(){return null},
  seasonResult(my){
    if(this.champion===my)return "NATIONAL CHAMPIONS";
    if(this.field.indexOf(my)<0){
      return this.champs[CONF[my]]===my?"Won the "+CONF[my]+" Tournament":"Missed the NCAA tournament";
    }
    for(const r of NCAA_ROUNDS.slice().reverse()){
      const g=(this.rounds[r]||[]).find(g=>g.loser===my);
      if(g)return r==="final"?"Lost the national championship":r==="open"?"Lost in the Opening Round":"Lost in the "+ROUND_NAME[r];
    }
    return "Made the NCAA tournament";
  },
  postRecord(){
    const confChamps=Object.assign({},this.champs), post={}, pnote={}, cfpOf={};
    const bump=(t,won)=>{post[t]=post[t]||[0,0]; post[t][won?0:1]++};
    NCAA_ROUNDS.forEach(r=>(this.rounds[r]||[]).forEach(g=>{bump(g.winner,true); bump(g.loser,false);
      pnote[g.loser]="NCAA tournament \u2014 lost in the "+(r==="final"?"national championship":ROUND_NAME[r])}));
    if(this.champion)pnote[this.champion]="National champions";
    this.field.forEach(t=>cfpOf[t]=this.seeds[t]);
    return {confChamps,bowlOf:{},post,pnote,cfpOf};
  },
  postPools(){
    const ct=[]; Object.keys(this.ctGames||{}).forEach(c=>ct.push(...this.ctGames[c]));
    return NCAA_ROUNDS.slice().reverse().map(r=>this.rounds[r]||[]).concat([ct]);
  },
  postGamesFor(team){
    const out=[];
    (this.ctGames[CONF[team]]||[]).forEach(g=>{if(g.home===team||g.away===team)out.push([g,g.title])});
    NCAA_ROUNDS.forEach(r=>(this.rounds[r]||[]).forEach(g=>{if(g.home===team||g.away===team)out.push([g,"NCAA "+ROUND_NAME[r]])}));
    return out;
  },
  honours(team){return {natl:this.champion===team,playoff:this.field.indexOf(team)>=0,
    conf:Object.keys(this.champs).some(c=>this.champs[c]===team)}},
  confChampions(){return this.champs}
});
/* ============ awards: college basketball ============ */
/* National Player of the Year (the award race), the All-America teams (the
   country's best, positions aside) and the all-conference teams. The core
   calls _award after every game date; mvpRace(n) is the award race. */
extendSeason({
  allConfAll(){
    const out={};
    LEAGUE.conf.order.forEach(c=>{out[c]=this.allConference(c)});
    return out;
  },
  _award(w,games){
    if(!this.roster)return;
    const won={};
    games.forEach(g=>{won[g.winner]=1;won[g.loser]=0});
    NAMES.forEach(t=>{
      if(won[t]===undefined)return;                    // bye week
      const wp=this.rec[t][0]/Math.max(1,this.rec[t][0]+this.rec[t][1]);
      this.roster[t].forEach((pl,i)=>{
        if(!pl||!pl.st2||!pl.st2.g)return;
        const P=POS[i%POS.length];
        pl.st=pl.st2.g;
        // voters reward production, and reward it more on a winning team
        pl.prod=statProd(P.p,pl.st2)*LEAGUE.awards.weights[P.p]*(0.72+wp*0.52);
      });
    });
  },
  mvpRace(n){
    if(!this.roster)return [];
    const all=[];
    NAMES.forEach(t=>this.roster[t].forEach((pl,i)=>{
      if(pl&&(pl.st||0)>=6)all.push({t:t,n:pl.n,p:pl.p,r:pl.r,c:pl.c,
        prod:pl.prod||0,line:statLine(pl.p,pl.st2),
        rec:this.rec[t][0]+"-"+this.rec[t][1]});
    }));
    // measured against the position: a player's production over the typical
    // production of his position's top 20, so a dominant centre and a dominant
    // point guard compete on how dominant they are, not on whose numbers run bigger
    const scale={};
    POS.forEach(P=>{const top=all.filter(x=>x.p===P.p).map(x=>x.prod).sort((a,b)=>b-a).slice(0,20);
      scale[P.p]=top.length?top.reduce((a,b)=>a+b,0)/top.length:1});
    all.forEach(x=>x.score=x.prod/Math.max(1e-9,scale[x.p]));
    all.sort((a,b)=>b.score-a.score);
    return all.slice(0,n||10);
  },
  /* All-America: first and second teams, five each, the best in the country */
  allAmerica(){
    const r=this.mvpRace(10);
    return {first:r.slice(0,5), second:r.slice(5,10)};
  },
  allConference(conf){
    if(!this.roster)return [];
    const out=[];
    POS.forEach((P,i)=>{
      const best=NAMES.filter(t=>CONF[t]===conf)
        .map(t=>({t:t,pl:this.roster[t][i]}))
        .sort((a,b)=>(b.pl.prod||0)-(a.pl.prod||0))[0];
      if(best)out.push({pos:P.p,team:best.t,n:best.pl.n,r:best.pl.r,c:best.pl.c});
    });
    return out;
  },
  /* the award team a team's history entry records: its conference's */
  awardTeam(my){
    const o=this.allConfAll(),k=CONF[my];
    return {group:k,list:(o[k]||[]).map(x=>({pos:x.pos,team:x.team,n:x.n,r:x.r,c:x.c}))};
  }
});
LEAGUE.awards.teamLabel=g=>"All-"+(LEAGUE.conf.names[g]||g);
/* ============ draft night and the record book ============ */
/* Four years of development should end somewhere. Players who leave get a
   permanent entry in the program's record book, and the good ones get drafted
   in front of everybody. */


const DRAFT_ROUNDS=2, PICKS_PER_ROUND=30;     // the NBA draft

/* How good a prospect looks: what he is, plus what he did. */
function prospectScore(d, rng){
  const prod = d.car ? statProd(d.p, d.car) : 0;
  const yrs  = (d.car && d.car.yrs) ? d.car.yrs : 1;
  const perYr = prod / Math.max(1, yrs);
  const early = d.early ? 6 : 0;              // leaving early signals confidence
  const start = d.starter ? 4 : 0;
  // the NBA drafts ceilings and youth: a freshman's upside beats a senior's résumé
  const upside=0.45*(d.peak||d.r)+0.55*Math.max(d.r,d.pot||d.r);
  const youth=[7,4,1.5,0][d.c===undefined?3:Math.max(0,Math.min(3,d.c))];
  return upside + youth + perYr*0.08 + early*0.5 + start*0.5 + rng.gauss(0,6);
}

/* Run the draft across every departing player in the country. */
function runDraft(u, rng, year, leavers){
  const pool=[];
  Object.keys(leavers).forEach(team=>{
    leavers[team].forEach(d=>pool.push(Object.assign({team:team},d)));
  });
  pool.forEach(d=>{d.score=prospectScore(d,rng)});
  pool.sort((a,b)=>b.score-a.score);

  const order=rng.shuffle(LEAGUE.draftTeams.slice());
  const picks=[];
  const total=DRAFT_ROUNDS*PICKS_PER_ROUND;
  for(let i=0;i<Math.min(total,pool.length);i++){
    const d=pool[i];
    const round=Math.floor(i/PICKS_PER_ROUND)+1;
    const inRound=(i%PICKS_PER_ROUND)+1;
    d.draft={round:round, pick:inRound, overall:i+1,
             nfl:order[(i+round)%order.length], year:year};
    picks.push(d);
  }
  pool.slice(total).forEach(d=>{d.draft=null});
  return {picks:picks, pool:pool};
}

/* Everyone who left, drafted or not, goes into the record book for good. */
function recordAlumni(u, year, pool){
  u.alumni=u.alumni||{};
  pool.forEach(d=>{
    const t=d.team;
    if(!t)return;
    const rec={
      n:d.n, p:d.p, from:d.from!==null&&d.from!==undefined?d.from:(year-((d.car&&d.car.yrs)||1)),
      to:year, peak:d.peak||d.r, yrs:(d.car&&d.car.yrs)||1,
      early:!!d.early, featured:!!d.featured, draft:d.draft||null
    };
    // keep the finished sentence rather than the whole stat object: a record
    // book of 132 programs over 40 seasons has to stay small enough to save
    rec.line=alumniLine({p:d.p,car:d.car,yrs:rec.yrs});
    // career totals for the program leaders (six numbers)
    if(d.car)rec.car={pts:d.car.pts||0,reb:d.car.reb||0,ast:d.car.ast||0,tpm:d.car.tpm||0,blk:d.car.blk||0,stl:d.car.stl||0};
    u.alumni[t]=u.alumni[t]||[];
    // over decades the name generator repeats itself; a program that produces
    // two Brock Guillorys gets a second-generation one rather than a duplicate
    let suffix=0;
    while(u.alumni[t].some(x=>x.n===rec.n)){
      suffix++;
      rec.n = d.n + (suffix===1?" II":suffix===2?" III":" "+(suffix+1));
    }
    u.alumni[t].push(rec);
    const cap=u.alumni[t];
    if(cap.length>25){                       // 365 programs: 25 each (the record book shows 12)
      cap.sort((a,b)=>{
        const ad=a.draft?a.draft.overall:9999, bd=b.draft?b.draft.overall:9999;
        return ad-bd || b.peak-a.peak;
      });
      cap.length=25;                         // the 25 most notable stay for good
    }
  });
}

/* A one-line career summary from the accumulated stat line. */
function alumniLine(a){
  if(a.line)return a.line;
  const c=a.car, yrs=`${a.yrs} season${a.yrs===1?"":"s"}`;
  if(!c||!c.pts)return yrs;
  const n=x=>(x||0).toLocaleString();
  const second=(a.p==="PG")?`${n(c.ast)} assists`:(a.p==="PF"||a.p==="C")?`${n(c.reb)} rebounds`:`${n(c.tpm)} threes`;
  return `${n(c.pts)} points, ${second} in ${yrs}`;
}

function draftLabel(d){
  if(!d)return "Undrafted";
  if(d.overall===1)return `No. 1 overall, ${d.nfl}`;
  return `Round ${d.round}, pick ${d.pick} \u2014 ${d.nfl}`;
}

/* Career leaders in the categories people actually argue about. */
/* program leaders: career totals, every position */
const ALL_POS=["PG","SG","SF","PF","C"];
const LEADER_CATS=[
  {k:"pts", label:"Points",       pos:ALL_POS},
  {k:"reb", label:"Rebounds",     pos:ALL_POS},
  {k:"ast", label:"Assists",      pos:ALL_POS},
  {k:"tpm", label:"Three-pointers",pos:ALL_POS},
  {k:"blk", label:"Blocks",       pos:ALL_POS},
  {k:"stl", label:"Steals",       pos:ALL_POS}
];

/* Alumni only keep a finished sentence, so the numbers are parsed back out of
   it. Cheap, and it keeps the save small. */
function leaderValue(a, cat){
  return a.car&&a.car[cat.k]?a.car[cat.k]:0;     // career totals, as recorded
}

function programLeaders(u, team){
  const list=(u.alumni&&u.alumni[team])?u.alumni[team]:[];
  const out=[];
  LEADER_CATS.forEach(cat=>{
    const pool=list.filter(a=>cat.pos.indexOf(a.p)>=0)
      .map(a=>({a:a, v:leaderValue(a,cat)}))
      .filter(x=>x.v>0)
      .sort((x,y)=>y.v-x.v);
    if(pool.length)out.push({label:cat.label, top:pool.slice(0,3)});
  });
  return out;
}

/* The best players a program has ever produced. */
function recordBook(u, team){
  const list=(u.alumni&&u.alumni[team])?u.alumni[team].slice():[];
  list.sort((a,b)=>{
    const ad=a.draft?a.draft.overall:9999, bd=b.draft?b.draft.overall:9999;
    return ad-bd || b.peak-a.peak;
  });
  return list;
}

/* The program record book, as the core's team pages read it. */
LEAGUE.records={book:recordBook, leaders:programLeaders, alumniLine:alumniLine};
/* ============ the history book ============ */
/* One entry per coach per season. Version 2 is league-neutral: everything the
   core reads has a name that means the same thing in any league, and what
   only one league understands lives under entry.league, written and read by
   that league alone.

   {v:2, year, team, rec:"w-l", rank, result, grade, gradeLine,
    champion,                          league champion that year
    honours:{title, group, seed},      won it all / won your group / playoff seed
    group:{key, name, rec},            conference or division, and record in it
    bestWin:{opp, rank, score}|null,
    coach:{name, titles, seasons},
    -- written at the end of the season, absent from a hot-seat coach's
       early entry (written before the world moves on):
    miles, exp, program,
    teams:{team:[w,l,rank]}, top10, groupChamps:{group:team},
    seeds:{team:seed}, post:{team:[w,l]}, pnote:{team:line},
    awards:{mvp:[{n,p,t,r,c,line}], team:{group, list:[{pos,team,n,r,c}]}},
    coaching:{fired, firedList, nFired, hires, poached, coordMoves, coachNow},
    league:{id, ...}}                  e.g. cfb: bowls, draft, classes, early, realigned
*/
const HISTORY_V=2;

/* The part of an entry every coach gets, whenever it is written. */
function seasonEntry(my){
  const rk=SEA.poll.rankMap();
  const result=SEA.seasonResult(my);
  const exp=S.expNow||expectations();
  const gr=seasonGrade(SEA.rec[my][0],SEA.rec[my][1],result,exp);
  const myGames=[].concat(...SEA.weeks.map(w=>w.games)).filter(g=>g.home===my||g.away===my);
  const bestWin=myGames.filter(g=>g.winner===my)
    .sort((x,y)=>(x.home===my?(x.arank||999):(x.hrank||999))-(y.home===my?(y.arank||999):(y.hrank||999)))[0];
  const bwOpp=bestWin?(bestWin.home===my?bestWin.away:bestWin.home):null;
  const bwRank=bestWin?(bestWin.home===my?bestWin.arank:bestWin.hrank):null;
  const hon=SEA.honours(my), seeds=SEA.postRecord().cfpOf;
  return {v:HISTORY_V, year:SEA.year, team:my,
    rec:SEA.rec[my][0]+"-"+SEA.rec[my][1], rank:rk[my],
    result:result, grade:gr.g, gradeLine:gr.l, miss:!!gr.miss,
    champion:SEA.champion,
    honours:{title:SEA.champion===my, group:hon.conf, seed:seeds[my]||null},
    group:{key:CONF[my], name:LEAGUE.conf.names[CONF[my]]||"",
           rec:SEA.confrec[my][0]+"-"+SEA.confrec[my][1]},
    bestWin: bwOpp?{opp:bwOpp,rank:bwRank||null,
      score:(bestWin.home===my?bestWin.hp+"-"+bestWin.ap:bestWin.ap+"-"+bestWin.hp)}:null,
    coach:{name:S.career.name, titles:S.career.titles, seasons:S.history.length+1}};
}

/* ---- old saves ---- */
/* Version 1 entries (no v) are migrated when a save is loaded. They didn't
   record the team for the end-of-season entry, so it comes from the coach's
   career stops. */
function teamInYear(career,year,fallback){
  const st=(career&&career.stops||[]).find(s=>s.from<=year&&(s.to===undefined||s.to>=year));
  return st?st.team:fallback;
}
function migrateEntry(h,career,fallback){
  if(!h||h.v>=2)return h;
  const c=h.card||{}, team=h.team||teamInYear(career,h.year,fallback);
  const keyOf=name=>Object.keys(LEAGUE.conf.names).find(k=>LEAGUE.conf.names[k]===name)||null;
  const out={v:2, year:h.year, team:team, rec:h.rec, rank:h.rank, result:h.result,
    grade:h.grade, gradeLine:h.gradeLine, champion:h.champion,
    miss:/Short of the mark|A bad year/.test(h.gradeLine||""),
    honours:{title:h.champion===team, group:!!h.confChamp, seed:(h.cfp&&h.cfp[team])||null},
    group:{key:(h.allconf&&h.allconf.conf)||keyOf(c.conf), name:c.conf||"", rec:c.confRec||""},
    bestWin:c.bestWin||null,
    coach:{name:c.coach, titles:c.titles, seasons:c.seasons}};
  if(h.miles)out.miles=h.miles;
  if(h.exp!==undefined)out.exp=h.exp;
  if(h.program!==undefined)out.program=h.program;
  if(h.teams){
    out.teams=h.teams; out.top10=h.top10||[];
    out.groupChamps=h.confChamps||{}; out.seeds=h.cfp||{};
    // the oldest saves have bowls but no postseason tally or notes
    let post=h.post, pnote=h.pnote;
    if(!post&&h.bowls){post={};Object.keys(h.bowls).forEach(t=>{post[t]=h.bowls[t][0]==="W"?[1,0]:[0,1]})}
    if(!pnote&&h.bowls){pnote={};Object.keys(h.bowls).forEach(t=>{
      pnote[t]=(h.bowls[t][0]==="W"?"Won the ":"Lost the ")+h.bowls[t][1]})}
    out.post=post||{}; out.pnote=pnote||{};
    out.awards={mvp:h.heis||[],
      team:h.allconf?{group:h.allconf.conf,list:h.allconf.list||[]}:null};
    out.coaching={fired:!!h.fired, firedList:h.firedList||[], nFired:h.nFired||0,
      hires:h.hires||[], poached:h.poached||[], coordMoves:h.coordMoves||[],
      coachNow:h.coachNow||null};
    out.league=LEAGUE.migrateHistory?LEAGUE.migrateHistory(h):{id:LEAGUE.id};
  }
  return out;
}
function migrateSave(d){
  if(!d)return d;
  if(d.history)d.history=d.history.map(h=>migrateEntry(h,d.career,d.myTeam));
  (d.coaches||[]).forEach(c=>{
    if(c.history)c.history=c.history.map(h=>migrateEntry(h,c.career,c.myTeam))});
  return d;
}
/* ============ the season card ============ */
/* A single square image you can actually send to someone. Drawn as plain SVG
   so it rasterises to PNG without any library, and with fonts that exist
   everywhere rather than the webfont, which wouldn't survive the export. */

const CARD_W = 1080, CARD_H = 1080;

function cardFit(text, max, size){
  const est = String(text).length * size * 0.52;
  return est > max ? Math.floor(size * max / est) : size;
}

/* The same season as a line of text, for anywhere an image won't go. */
function seasonCardText(h, team){
  const c={conf:h.group.name, confRec:h.group.rec, bestWin:h.bestWin, coach:h.coach.name};
  const bits=[`${team} ${h.rec} (${c.confRec} ${c.conf})`];
  if(h.champion===team)bits.push(LEAGUE.text.champions.toUpperCase());
  else if(h.honours.group)bits.push(`${c.conf} champions`);
  else if(h.rank)bits.push(`finished No. ${h.rank}`);
  if(c.bestWin)bits.push(`beat ${c.bestWin.rank?"No. "+c.bestWin.rank+" ":""}${c.bestWin.opp} ${c.bestWin.score}`);
  return `${c.coach}, ${h.year}. ${bits.join(" \u2014 ")}. ${LEAGUE.text.site}`;
}

/* Rasterise the SVG to a PNG blob so it can be shared or saved as a real image. */
function cardBlob(svg){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
    img.onload=()=>{
      try{
        const cv=document.createElement("canvas");
        cv.width=CARD_W; cv.height=CARD_H;
        const cx=cv.getContext("2d");
        cx.fillStyle="#10131C"; cx.fillRect(0,0,CARD_W,CARD_H);
        cx.drawImage(img,0,0,CARD_W,CARD_H);
        cv.toBlob(b=>b?resolve(b):reject(new Error("no blob")),"image/png");
      }catch(e){reject(e)}
    };
    img.onerror=()=>reject(new Error("svg load failed"));
    img.src=url;
  });
}

async function shareCard(h, team){
  const svg=seasonCardSVG(h,team);
  const txt=seasonCardText(h,team);
  const name=`${team.replace(/[^A-Za-z]/g,"")}-${h.year}.png`;
  try{
    const blob=await cardBlob(svg);
    const file=new File([blob],name,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],text:txt});
      return "shared";
    }
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    return "saved";
  }catch(e){
    try{ await navigator.clipboard.writeText(txt); return "copied" }
    catch(_){ return "failed" }
  }
}

/* who'd be in if it ended today: conference leaders take the automatic bids,
   the best 44 résumés the rest */
function projectedField(){
  const inel=LEAGUE.playoff.ineligible, ok=t=>inel.indexOf(t)<0;
  const aq=LEAGUE.conf.order.map(c=>SEA.confRank(c).find(ok)).filter(Boolean);
  const byRes=NAMES.filter(ok).sort((a,b)=>SEA.resume(b)-SEA.resume(a));
  const al=byRes.filter(t=>aq.indexOf(t)<0);
  const field=aq.concat(al.slice(0,LEAGUE.playoff.atLarge)).sort((a,b)=>SEA.resume(b)-SEA.resume(a));
  return {field:field,aq:aq,lastIn:al.slice(LEAGUE.playoff.atLarge-4,LEAGUE.playoff.atLarge),
          firstOut:al.slice(LEAGUE.playoff.atLarge,LEAGUE.playoff.atLarge+4)};
}
/* seed line from a place in the 1-76 order (the Opening Round teams sit on 11, 12, 15, 16) */
function seedLineOf(i,n){ if(i<40)return Math.floor(i/4)+1; if(i<52)return 11+Math.floor((i-40)/6); return Math.min(16,13+Math.floor((i-52)/6)) }
function bracketology(){
  const P=projectedField(), my=S.myTeam, pos=P.field.indexOf(my);
  const row=(t,i,tag)=>`<div class="prow ${t===my?'mine':''}" style="--tc:${teamInk(t)}"><span class="cbar"></span>
    <div class="pnum">${tag}</div><div class="pmain"><div class="pname">${TL(t)}</div>
    <div class="psub">${SEA.rec[t][0]}-${SEA.rec[t][1]} &middot; ${esc(CONF[t])}${P.aq.indexOf(t)>=0?" &middot; leads the conference":""}</div></div></div>`;
  let h=`<div class="note">If the season ended today. Conference leaders take the automatic bids; the committee picks the other 44 on résumé.</div>`;
  h+=`<div class="grouphead">You</div>`+(pos>=0?row(my,pos,seedLineOf(pos))+
     `<div class="note">Projected ${seedLineOf(pos)} seed${seedLineOf(pos)>=11&&P.aq.indexOf(my)<0?", on the bubble":""}.</div>`
     :`<div class="note">Projected out${P.firstOut.indexOf(my)>=0?" \u2014 among the first four out":""}. Win your conference tournament and you're in regardless.</div>`);
  h+=`<div class="grouphead">Top four seed lines</div>`+P.field.slice(0,16).map((t,i)=>row(t,i,seedLineOf(i))).join("");
  h+=`<div class="grouphead">Last four in</div>`+P.lastIn.map(t=>row(t,P.field.indexOf(t),seedLineOf(P.field.indexOf(t)))).join("");
  h+=`<div class="grouphead">First four out</div>`+P.firstOut.map(t=>row(t,0,"&ndash;")).join("");
  return h;
}
/* what's riding on your next game: a list of {p: priority, tag, l: line} */
function bbStakes(x){
  const {my,wk,left,cp}=x, out=[];
  if(SEA.phase!=="week")return out;
  if(cp&&wk>=LEAGUE.schedule.nonConf+6&&cp.pos<=2)
    out.push({p:84,tag:"CONFERENCE RACE",l:`${cp.pos===1?"First":"Second"} in the ${esc(cp.conf)} with ${left} to play. The top seed in the conference tournament matters.`});
  if(wk>=8){
    const P=projectedField(), pos=P.field.indexOf(my);
    if(pos>=0&&pos<16)out.push({p:76,tag:"SEEDING",l:`Projected a ${seedLineOf(pos)} seed. A protected seed means an easier road in March.`});
    else if(P.lastIn.indexOf(my)>=0)out.push({p:86,tag:"BUBBLE",l:`Among the last four in. Every game is a résumé game now.`});
    else if(P.firstOut.indexOf(my)>=0)out.push({p:86,tag:"BUBBLE",l:`First four out. One good win changes that.`});
    else if(pos>=0)out.push({p:60,tag:"IN THE FIELD",l:`Projected a ${seedLineOf(pos)} seed${P.aq.indexOf(my)>=0?", as the conference leader":""}.`});
  }
  return out;
}

        h+=`<div class="brow ${t===S.myTeam||(og&&(og.a===S.myTeam||og.b===S.myTeam))?'mine':''}"><span class="seed">${line}</span> ${label}</div>`;

/* ---- a conference tournament, drawn ---- */
let ctConf=null;
function ctBracketHTML(c){
  const T=SEA.ct&&SEA.ct[c];
  // before it starts: the seeds as they stand
  const seeds=T?T.seeds:SEA.confRank(c).slice(0,(LEAGUE.playoff.ctCap||{})[c]||16), n=seeds.length, sd=t=>seeds.indexOf(t)+1;
  const R=(T&&T.res)||{};
  const win=(r,i)=>{const g=(R[r]||[])[i]; return g===undefined?null:(g&&g.winner!==undefined?g.winner:g)};
  const box=(g,a,b)=>g&&g.home?bgame(g):bgame(null,a?{t:a,s:sd(a)}:null,b?{t:b,s:sd(b)}:null);
  // first round: a game, or a seed with a bye
  const r1=CT_SLOTS.map(([x,y],i)=>{
    const a=x<=n?seeds[x-1]:null, b=y<=n?seeds[y-1]:null, g=(R.ct1||[])[i];
    if(a&&b)return box(g,a,b);
    const t=a||b; return t?bgame(null,{t:t,s:sd(t)},{t:"bye",s:""}):"";
  });
  const cols=[];
  if(CT_SLOTS.some(([x,y])=>x<=n&&y<=n))cols.push(["First round",r1]);
  cols.push(["Quarterfinals",[0,1,2,3].map(i=>box((R.ct2||[])[i],win("ct1",2*i)||(n<=8?pre1(2*i):null),win("ct1",2*i+1)||(n<=8?pre1(2*i+1):null)))]);
  cols.push(["Semifinals",[0,1].map(i=>box((R.ct3||[])[i],win("ct2",2*i),win("ct2",2*i+1)))]);
  cols.push(["Championship",[box((R.ct4||[])[0],win("ct3",0),win("ct3",1))]]);
  // with eight or fewer, everyone has a first-round bye: the quarterfinals are the seeds
  function pre1(i){const [x,y]=CT_SLOTS[i]; return x<=n&&y>n?seeds[x-1]:null}
  const column=(title,items)=>`<div class="bcol"><div class="bhead">${title}</div><div class="bgames">${items.join("")}</div></div>`;
  const champ=SEA.champs[c];
  return `<div class="note">${n} teams${(LEAGUE.playoff.ctCap||{})[c]?" (the "+esc(c)+" takes its top "+n+")":""}.</div>`+
    (champ?`<div class="note"><b>${esc(champ)}</b> won the ${esc(c)} Tournament and the automatic bid.</div>`:"")+

let bracketRegion="East";
/* a game box: two lines, seed and team and score; the winner in bold */
function bslot(t,seed,pts,win,rec){
  const my=t&&t===S.myTeam;
  return `<div class="bslot ${win?'bwin':''} ${my?'bmine':''}" style="--tc:${t&&NAMES.indexOf(t)>=0?teamInk(t):'transparent'}">
    <span class="bseed">${seed||""}</span><span class="bteam">${t?esc(t)+(rec?` <span class="brec">(${esc(rec)})</span>`:""):'<span class="btbd">to be decided</span>'}</span>
    <span class="bpts">${pts!==undefined&&pts!==null?pts:""}</span></div>`;
}
/* a game box; recs=true adds each team's record at Selection Sunday, as a
   printed bracket does in its first round */
function bgame(g,top,bot,recs){
  const rc=t=>recs&&t&&SEA.selRec?SEA.selRec[t]:null;
  if(g)return `<div class="bgame">${bslot(g.home,g.hseed,g.hp,g.winner===g.home,rc(g.home))}${bslot(g.away,g.aseed,g.ap,g.winner===g.away,rc(g.away))}</div>`;
  return `<div class="bgame">${bslot(top&&top.t,top&&top.s,null,false,top&&top.rec||rc(top&&top.t))}${bslot(bot&&bot.t,bot&&bot.s,null,false,bot&&bot.rec||rc(bot&&bot.t))}</div>`;
}
/* who fills a first-round slot before it's played: the team, or both Opening Round teams */
function slotTeam(r,line){
  const t=SEA.bracket&&SEA.bracket[r]?SEA.bracket[r][line]:null;
  const og=(SEA.openGames||[]).find(o=>o.region===r&&o.line===line);
  if(og&&!(SEA.rounds.open||[]).length)return {t:`${og.a} (${SEA.selRec[og.a]}) / ${og.b}`,s:line,rec:SEA.selRec[og.b]};
  return t?{t:t,s:line}:null;
}
function regionHTML(r){
  const played=k=>(SEA.rounds[k]||[]).filter(g=>g.region===r);
  const col=(k,n,pre)=>{const gs=played(k); const out=[];
    for(let i=0;i<n;i++)out.push(gs[i]?bgame(gs[i],null,null,k==="r64"):pre?pre(i):bgame(null)); return out};
  const r64=col("r64",8,i=>bgame(null,slotTeam(r,R64_PAIRS[i][0]),slotTeam(r,R64_PAIRS[i][1]),true));
  const winnersOf=(k,i)=>{const g=played(k)[i]; return g?{t:g.winner,s:SEA.seeds[g.winner]}:null};
  const r32=col("r32",4,i=>bgame(null,winnersOf("r64",2*i),winnersOf("r64",2*i+1)));
  const s16=col("s16",2,i=>bgame(null,winnersOf("r32",2*i),winnersOf("r32",2*i+1)));
  const e8=col("e8",1,i=>bgame(null,winnersOf("s16",0),winnersOf("s16",1)));
  const column=(title,items)=>`<div class="bcol"><div class="bhead">${title}</div><div class="bgames">${items.join("")}</div></div>`;
  return `<div class="bracket">${column("First round",r64)}${column("Second round",r32)}${column("Sweet 16",s16)}${column("Elite Eight",e8)}</div>`;
}
function finalFourHTML(){
  const champ=r=>{const g=(SEA.rounds.e8||[]).find(x=>x.region===r); return g?{t:g.winner,s:SEA.seeds[g.winner]}:null};
  const f4=SEA.rounds.f4||[], fin=(SEA.rounds.final||[])[0];
  const semis=[f4[0]?bgame(f4[0]):bgame(null,champ("East"),champ("South")), f4[1]?bgame(f4[1]):bgame(null,champ("Midwest"),champ("West"))];
  const w=i=>f4[i]?{t:f4[i].winner,s:SEA.seeds[f4[i].winner]}:null;
  const column=(title,items)=>`<div class="bcol"><div class="bhead">${title}</div><div class="bgames">${items.join("")}</div></div>`;
  return `<div class="note">Ford Field, Detroit. East plays South; Midwest plays West.</div>
    <div class="bracket">${column("Final Four",semis)}${column("National Championship",[fin?bgame(fin):bgame(null,w(0),w(1))])}</div>`;
}

/* The transfer portal: who you're likely to lose, the best of who is likely

function portalHTML(num){

/* ============ state ============ */
/* Each game keeps its own save slots. All three games live on one website,
   so they share the browser's storage: the slots used to be shared too, and a
   game could list (and overwrite) another game's saves. College football
   keeps the original keys, so its saves are untouched. */
const SAVE_KEYS={cfb:"fbcoach-v2", nfl:"fbcoach-pro-v2", ncaab:"bbcoach-v1", nba:"bbcoach-pro-v1"};
const LEGACY_KEY="fbcoach-v2";
const KEYBASE=SAVE_KEYS[LEAGUE.id]||LEGACY_KEY;
const NSLOTS=3;
let slot=1;
const KEYFOR=n=>KEYBASE+"-slot"+n;
let S={myTeam:null,uStart:null,seasonSeed:0,steps:0,history:[],seed:0,plans:{}};
let plan="balanced", reveal=null, revealTimer=null;
/* ---- hot seat ----
   Several people can share one save, each coaching their own program in the
   same world. Only one is "active" at a time: their state is swapped onto S so
   the rest of the game needs no changes at all. */
const COACH_FIELDS=["myTeam","career","plans","calls","promos","fires","featured",
                    "history","expNow"];

function coachCount(){ return (S.coaches&&S.coaches.length)||1 }
function isHotSeat(){ return coachCount()>1 }
function activeCoach(){ return (S.coaches&&S.coaches[S.turn||0])||null }

function stashCoach(){
  if(!S.coaches)return;
  const c=S.coaches[S.turn||0]; if(!c)return;
  COACH_FIELDS.forEach(k=>{c[k]=S[k]});
}
function loadCoach(i){
  if(!S.coaches||!S.coaches[i])return;
  S.turn=i;
  COACH_FIELDS.forEach(k=>{S[k]=S.coaches[i][k]});
  if(!S.history)S.history=[];
}
/* Old single-coach saves become a one-man hot seat. */
function ensureCoaches(){
  if(S.coaches&&S.coaches.length)return;
  S.coaches=[{}]; S.turn=0;
  COACH_FIELDS.forEach(k=>{S.coaches[0][k]=S[k]});
}

let live=null;          // a game being played out right now
let handoffNotes={};    // hot seat: team -> the coach who deferred a game against it
let handoff=false;      // showing the "pass the device" screen
let owlTaps=0;

/* ---- head to head ----
   When two coaches in a hot seat meet, the game is played once, on the later
   coach's turn, and each coach calls their own side. The earlier coach picks
   a plan and hands over without playing. */
function coachIndexOf(team){
  if(!S.coaches)return -1;
  if(team===S.myTeam)return S.turn||0;
  return S.coaches.findIndex((c,i)=>i!==(S.turn||0)&&c.myTeam===team);
}
function opponentOf(g){ return g?(g.home===S.myTeam?g.away:g.home):null }
/* Both coaches' plans and featured players, applied to one game. */
function h2hElo(g,step,oj){
  const keepU=SEA.userTeam, keepF=SEA.featured, oc=S.coaches[oj];
  SEA.userTeam=null; SEA.featured=null;
  const e0=SEA.matchupElo(g,"balanced");
  SEA.userTeam=S.myTeam; SEA.featured=(S.featured===undefined?null:S.featured);
  const e1=SEA.matchupElo(g,plan);
  SEA.userTeam=oc.myTeam; SEA.featured=(oc.featured===undefined?null:oc.featured);
  const e2=SEA.matchupElo(g,(oc.plans&&oc.plans[step])||"balanced");
  SEA.userTeam=keepU; SEA.featured=keepF;
  return {h:e1.h+e2.h-e0.h, a:e1.a+e2.a-e0.a};
}

/* Answers belong to a season as well as a week. Keyed by step alone, season
   three replays season one's decisions and silently answers everything. */
function callKey(step,year){ return (year||SEA.year)+":"+step; }

function liveSeed(step){
  return ((S.seasonSeed^0x9E37)+step*7919)>>>0;
}

function startLive(g,step){
  const oj=isHotSeat()?coachIndexOf(opponentOf(g)):-1;
  const h2h=oj>=0&&oj<(S.turn||0);                 // an earlier coach waited for this one
  const e=h2h?h2hElo(g,step,oj):SEA.matchupElo(g,plan);
  const rng=new RNG(liveSeed(step));
  const userIsHome=(g.home===S.myTeam);
  const oppPlan=h2h?((S.coaches[oj].plans&&S.coaches[oj].plans[step])||"balanced"):"balanced";
  live={g:g, step:step,
        eng:makeLiveGame(rng,e.h,e.a,
              userIsHome?plan:oppPlan, userIsHome?oppPlan:plan,
              h2h?{home:true,away:true}:userIsHome),
        drives:[], ask:null, done:false,
        paused:(S.watchStep===true), userIsHome:userIsHome,
        h2h:h2h?{coach:oj,team:opponentOf(g)}:null};
  // replay any answers already recorded for this week
  live.replay=((S.calls&&S.calls[callKey(step)])||[]).slice();
  live.ri=0;
  reveal=null; watch=null;
  liveTick();
}

function liveTick(){
  if(!live)return;
  if(live.timer){clearTimeout(live.timer);live.timer=null}
  if(!live.kicked){                       // a beat on the empty field first
    live.kicked=true;
    render();
    if(!live.paused){live.timer=setTimeout(liveTick,650);return}
    return;
  }
  let guard=0;
  while(guard++<200){
    const r=live.eng.next();
    if(r.done){ live.done=true; finishLive(); return }
    if(r.ask){
      if(live.ri<live.replay.length){          // answered before, keep going
        live.eng.reply(live.replay[live.ri++]);
        continue;
      }
      live.ask={dp:r.ask, mine:r.mine, theirs:r.theirs,
                team:r.side?(r.side==="home"?live.g.home:live.g.away):S.myTeam};
      render();
      return;
    }
    live.drives.push(r.drive);
    break;
  }
  render();
  if(!live.paused&&!live.done&&!live.ask){
    live.timer=setTimeout(liveTick, liveGap());
  }
}
function liveGap(){
  const n=DRIVES_PER_TEAM*2;
  return Math.max(120,Math.min(2600,Math.round(7200/n/speedMult())));
}
function answerLive(v){
  S.calls=S.calls||{};
  const k=callKey(live.step);
  S.calls[k]=(S.calls[k]||[]).concat([v]);
  live.replay.push(v); live.ri=live.replay.length;
  live.eng.reply(v);
  live.ask=null;
  save(); liveTick();
}
function finishLive(){
  const g=live.g;
  const meHome=(g.home===S.myTeam);
  const played={team:S.myTeam, other:(meHome?g.away:g.home),
              mine:(meHome?live.eng.h:live.eng.a),
              theirs:(meHome?live.eng.a:live.eng.h),
              drives:live.drives};
  SEA.forcedList=SEA.forcedList||[];
  SEA.forcedList.push(played);
  // keep it in the save: a reload must replay this result, not re-simulate
  S.played=S.played||{};
  const pk=callKey(live.step);
  S.played[pk]=(S.played[pk]||[]).concat([JSON.parse(JSON.stringify(played))]);
  const step=live.step;
  live.result={hp:live.eng.h,ap:live.eng.a,
               mine:(g.home===S.myTeam?live.eng.h:live.eng.a)};
  // in a hot seat, hand over before the week is resolved
  if(isHotSeat() && (S.turn||0) < coachCount()-1){
    stashCoach();
    live=null; plan="balanced";
    loadCoach((S.turn||0)+1);
    handoff=true; save(); render(); return;
  }
  resolveWeek(step);
}

/* Everyone has had their turn: play out the rest of the league. */
function resolveWeek(step){
  handoffNotes={};
  SEA.userTeam=S.myTeam;
  SEA.advance();
  SEA.forcedList=[]; SEA.forced=null;
  S.steps++;
  plan="balanced";
  flash={type:"week",step:step};
  if(isHotSeat()){ stashCoach(); loadCoach(0) }
  save(); render();
}

function endLive(){
  if(live&&live.timer)clearTimeout(live.timer);
  if(live&&!live.done){                        // skip: run the rest instantly
    let guard=0;
    while(guard++<400){
      const r=live.eng.next();
      if(r.done)break;
      // a skipped game's remaining calls take the neutral option (the last:
      // stay the course, play it straight), not the aggressive first one
      if(r.ask){ const v=r.ask.opts[r.ask.opts.length-1][0]; live.eng.reply(v);
        S.calls=S.calls||{};const k=callKey(live.step);
        S.calls[k]=(S.calls[k]||[]).concat([v]); continue }
      live.drives.push(r.drive);
    }
    finishLive();
  }
  live=null; render();
}
let wide=false;

function swapDepth(sea,i){

}

function rebuild(){

    if(S.fires&&S.fires[i])S.fires[i].forEach(sd=>SEA.fireCoordinator(S.myTeam,sd));
    const ans=(S.calls&&S.calls[callKey(i,SEA.year)])||[]; let ai=0;
    SEA.decideHook=ans.length?(()=>ans[ai++]||"normal"):null;

let saveOK=null;                     // did the last save land? null = not tried yet
/* Saves are coalesced: calls made in the same burst share one save, of the
   state as it stands when it runs (compressing a long career takes a
   moment). In a browser it runs after the screen has drawn. */
let savePending=null;
function save(){
  if(savePending)return savePending;
  savePending=(async()=>{
    if(typeof requestAnimationFrame==="function")
      await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
    else await Promise.resolve();
    savePending=null;
    S.league=LEAGUE.id;                                   // every save says which game it's from
  try{saveOK=!!(await store.set(KEYFOR(slot),lzwPack(saveText(S))))}catch(e){saveOK=false}
    return saveOK;
  })();
  return savePending;
}
/* The active coach's stash in S.coaches holds a copy of S.history (and it
   is S.history that's current): saved as a marker, not a second copy, and
   restored on load. A 30-season basketball save was 9.2 MB, a third of it
   this duplicate. */
function saveText(S){
  if(!S.coaches||!S.coaches.length)return JSON.stringify(S);
  const t=S.turn||0, cs=S.coaches.map((c,i)=>i===t&&c&&c.history?Object.assign({},c,{history:"@S.history"}):c);
  return JSON.stringify(Object.assign({},S,{coaches:cs}));
}
function unsaveDup(d){
  (d.coaches||[]).forEach(c=>{ if(c&&c.history==="@S.history")c.history=d.history });
  return d;
}
/* which game a save belongs to: new saves say; older ones are told apart by
   their players (pro players have contracts; basketball players play PG-C) */
function saveLeague(d){
  if(!d)return null;
  if(d.league)return d.league;
  const R=d.uStart&&d.uStart.roster; if(!R)return "cfb";
  for(const t in R){const p=(R[t]||[]).find(x=>x); if(!p)continue;
    const hoops=["PG","SG","SF","PF","C"].indexOf(p.p)>=0;      // basketball positions first:
    if(hoops)return p.k?"nba":"ncaab";                            // pro basketball has contracts too
    return p.k?"nfl":"cfb"}
  return "cfb";
}
/* Move other games' saves out of the old shared slots into their own game's
   slots (first free one), once, whichever game is opened first. A save is
   removed from the old slot only after its copy has been written. */
let slotsMoved=false;
async function moveForeignSaves(){
  if(slotsMoved)return; slotsMoved=true;
  for(let n=1;n<=NSLOTS;n++){
    try{
      const r=await store.get(LEGACY_KEY+"-slot"+n); if(!r)continue;
      const lg=saveLeague(JSON.parse(lzwUnpack(r.value)));
      if(!lg||lg==="cfb"||!SAVE_KEYS[lg])continue;
      let dest=null;
      for(const m of [n].concat([1,2,3].filter(x=>x!==n))){
        if(!(await store.get(SAVE_KEYS[lg]+"-slot"+m))){dest=m;break}
      }
      if(!dest)continue;                              // nowhere to put it: leave it where it is
      const ok=await store.set(SAVE_KEYS[lg]+"-slot"+dest,r.value);
      const back=ok&&await store.get(SAVE_KEYS[lg]+"-slot"+dest);
      if(back&&back.value===r.value)await store.delete(LEGACY_KEY+"-slot"+n);
    }catch(e){}
  }
}
async function loadSlot(n){
  await moveForeignSaves();
  try{const r=await store.get(KEYFOR(n)); if(!r)return null;
    const d=unsaveDup(JSON.parse(lzwUnpack(r.value)));
    if(saveLeague(d)!==LEAGUE.id)return null;        // never open another game's save
    return migrateSave(d)}catch(e){return null}
}
async function allSlots(){
  const out=[];
  for(let n=1;n<=NSLOTS;n++){
    const d=await loadSlot(n);
    out.push(d&&d.myTeam?{n:n,team:d.myTeam,year:(d.uStart&&d.uStart.year)||2026,
      coach:(d.career&&d.career.name)||"",seasons:(d.history||[]).length,
      rec:d.career?d.career.w+"-"+d.career.l:"",titles:d.career?d.career.titles:0}:{n:n,empty:true});
  }
  return out;
}

const COACH_FIRST=["Ray","Mack","Dabo","Kirby","Lane","Deion","Marcus","Hugh","Bronco",
"Kalani","Sonny","Jimbo","Willie","Herm","Brent","Curt","Vic","Sherrone","Fran","Bo"];
function newDynasty(team,seed,coachName,roster){
  const rng0=new RNG(seed^0x5f3a);
  const people = (roster&&roster.length) ? roster
    : [{team:team, name:coachName||(rng0.pick(COACH_FIRST)+" "+rng0.pick(LAST))}];
  const mk=(p)=>({
    myTeam:p.team,
    career:{name:p.name||(rng0.pick(COACH_FIRST)+" "+rng0.pick(LAST)),
            rep:0,w:0,l:0,titles:0,confs:0,fired:0,
            stops:[{team:p.team,from:2026,w:0,l:0,titles:0}]},
    plans:{}, calls:{}, promos:{}, fires:{}, featured:null, history:[], expNow:null
  });
  S={seed:seed,uStart:null,seasonSeed:0,steps:0,origProgram:null,
     coaches:people.map(mk), turn:0};
  COACH_FIELDS.forEach(k=>{S[k]=S.coaches[0][k]});
  const u=newUniverse(seed); syncConf(u);
  S.coaches.forEach(c=>{
    u.coach[c.myTeam]={id:0,n:c.career.name,q:0,t:0,hired:true,you:true,
                       w:0,l:0,titles:0,confs:0,fired:0,stops:[]};
  });
  S.uStart=snap(u); S.origProgram=snap(u.program);
  S.seasonSeed=(seed*2654435761)>>>0 % 2147483647;
  rebuild(); S.expNow=expectations(); save(); view="team"; render();
}

/* ============ advance ============ */
/* "Sim game": play this one game without watching it, whatever the setting.
   Shown beside the main button, in the bottom bar and in the desktop side
   panel (on a laptop the side panel is where the buttons are). */
function simGameButton(id){
  if(!SEA||SEA.phase==="done"||(S.watchMode||"all")==="never"||prefersReduced()||(live&&!live.done))return "";
  const ug=SEA.phase==="week"?SEA.nextGame(S.myTeam):SEA.postMatchup(S.myTeam);
  return ug?`<button class="skip" id="${id}">Sim game</button>`:"";
}
let simOnce=false;
function simAdvance(){ simOnce=true; try{ doAdvance() }finally{ simOnce=false } }
function doAdvance(){
  if(SEA.phase==="done"){ openOffseason(); return; }
  const before=SEA.step;
  const ph=SEA.phase;
  S.plans=S.plans||{}; S.plans[before]=plan;
  if(live&&live.done)live=null;               // last game is over; don't block the next
  ensureCoaches();
  SEA.userTeam=S.myTeam;
  SEA.featured=(S.featured===undefined?null:S.featured);
  SEA.plan=plan;
  const ug=(SEA.phase==="week")?SEA.nextGame(S.myTeam)
          :(SEA.phase!=="done"?SEA.postMatchup(S.myTeam):null);
  const wantLive = ug && SEA.roster && !prefersReduced() && (S.watchMode||"all")!=="never" && !simOnce;
  // meeting a coach who comes later this turn: they play it, with both of you calling
  const laterRival = isHotSeat() && ug && coachIndexOf(opponentOf(ug)) > (S.turn||0);
  if(wantLive && !live && laterRival){ handoffNotes[opponentOf(ug)]={vs:S.myTeam, coach:S.career.name}; }
  else if(wantLive && !live){
    startLive(ug, before);
    return;                                    // the game is played in the viewer
  }
  // no live game to play (a bye, or watching turned off): still hand over
  if(isHotSeat() && (S.turn||0) < coachCount()-1){
    S.plans[before]=plan;
    stashCoach(); live=null; plan="balanced";
    loadCoach((S.turn||0)+1);
    handoff=true; save(); render(); return;
  }
  SEA.userTeam=S.myTeam;
  SEA.advance();
  SEA.forcedList=[]; SEA.forced=null;
  S.steps++;
  plan="balanced";
  if(isHotSeat()){ stashCoach(); loadCoach(0) }
  LEAGUE.ui.afterAdvance(ph);
  flash={type:SEA.phase==="week"||before<LEAGUE.weeks?"week":"post",step:before};
  const g=heroGame();
  const rk=SEA.poll.rankMap();
  if(g&&!prefersReduced()&&(S.watchMode||"all")==="never"){
    reveal="half";
    if(revealTimer)clearTimeout(revealTimer);
    revealTimer=setTimeout(()=>{reveal="final";render()},1500);
  }else reveal=null;
  save(); render();
}

function openOffseason(){
  if(SEA.phase!=="done")return;
  const rng=new RNG((S.seasonSeed^(U.year*7919))>>>0);
  if(S.off&&S.off.year===SEA.year)return;      // already booked this coach
  const my=S.myTeam, C=S.career;
  const exp=S.expNow||expectations();
  let A;
  if(isHotSeat()){
    // once per offseason for the whole league; each coach reads their part
    if(!S.carousel||S.carousel.year!==SEA.year){
      recordCoaches(U,SEA.rec,SEA.champion,SEA.confChampions(),SEA.year);
      const users={};
      S.coaches.forEach((c,i)=>{
        const cur=i===(S.turn||0);
        const t=cur?S.myTeam:c.myTeam, H=(cur?S.history:c.history)||[];
        const e=(cur?S.expNow:c.expNow)||LEAGUE.goals.expectations(U.program[t]);
        users[t]=missedTwiceFor(t,H,e);
      });
      S.carousel={year:SEA.year,act:offseasonCoaching(U,rng,SEA.rec,SEA.elo,users)};
    }
    const X=S.carousel.act;
    A=Object.assign({},X,{userOpen:!!X.userOpenBy[my],candidates:X.candidatesBy[my]||null,
      staffOpen:X.staffOpenBy[my]||{oc:false,dc:false}});
  }else{
    recordCoaches(U,SEA.rec,SEA.champion,SEA.confChampions(),SEA.year);
    A=offseasonCoaching(U,rng,SEA.rec,SEA.elo,{[my]:missedTwice(my,exp)});
  }
  const titles=SEA.honours(my);
  C.rep=C.rep*0.94;                       // reputations fade, good and bad
  C.rep+=repDelta(SEA.rec[my][0],SEA.rec[my][1],exp.w,U.program[my],titles);
  C.rep=Math.max(-48,Math.min(80,C.rep));
  C.w+=SEA.rec[my][0]; C.l+=SEA.rec[my][1];
  if(titles.natl)C.titles++; if(titles.conf)C.confs++;
  const st=C.stops[C.stops.length-1];
  st.w+=SEA.rec[my][0]; st.l+=SEA.rec[my][1];
  if(titles.natl)st.titles++;
  st.to=SEA.year;
  const staffCands={};
  if(A.staffOpen&&A.staffOpen.oc)staffCands.oc=coordCandidates(rng,U.program[my],"oc",C.rep);
  if(A.staffOpen&&A.staffOpen.dc)staffCands.dc=coordCandidates(rng,U.program[my],"dc",C.rep);
  const jobs=A.userOpen?jobMarket(U,rng,C.rep,A.openJobs,my):[];
  const poach=A.userOpen?[]:poachOffers(U,rng,C.rep,A.openJobs,my);
  const LO=LEAGUE.offseason.open(U,my,SEA.rec[my][0]);   // the league's own choices
  S.off={year:SEA.year,act:A,jobs:jobs,poach:poach,move:null,pool:LO.pool,staff:staffCands,
    picks:Object.assign({phil:(U.phil||"balanced"),oc:null,dc:null},LO.picks),
    rngA:[rng.a,rng.sp]};
  flash=null; save(); render();
}

function commitOffseason(){
  const P=S.off.picks, A=S.off.act, C=S.career;
  if(A.userOpen&&S.off.move===null)return;
  if(LEAGUE.ui.offseasonBlock()!==null)return;
  const rng=new RNG(0); rng.a=S.off.rngA[0]; rng.sp=S.off.rngA[1];
  const oldTeam=S.myTeam;
  let dest=S.off.move;
  if(dest==="retire"){S.retired=true;save();render();return}
  if(dest&&dest!==oldTeam){
    // the program you leave hires someone else; you take the new job
    U.coach[oldTeam]=newCoach(rng,U.program[oldTeam]);
    C.fired+=(A.userOpen?1:0);
    C.stops.push({team:dest,from:SEA.year+1,w:0,l:0,titles:0});
    S.myTeam=dest; U.userTeam=dest; U.phil="balanced";
    U.coach[dest]=Object.assign({},U.coach[oldTeam]||{},
      {id:0,n:C.name,q:0,t:0,hired:true,you:true});
  }
  ["oc","dc"].forEach(side=>{
    const cands=S.off.staff&&S.off.staff[side];
    if(cands){
      const pick=cands[P[side]!==null&&P[side]!==undefined?P[side]:0];
      if(side==="oc")U.oc[S.myTeam]=pick; else U.dc[S.myTeam]=pick;
    }
  });
  S.pending=S.pending||{};
  S.pending[S.myTeam]=Object.assign(LEAGUE.offseason.choices(P),{phil:P.phil,
                       featured:(S.featured===undefined?null:S.featured)});
  if(isHotSeat() && (S.turn||0) < coachCount()-1){
    writeSeasonHistory(oldTeam);                // this coach's year, in their book
    stashCoach(); loadCoach((S.turn||0)+1);
    S.off=null; handoff=true; openOffseason(); save(); render(); return;
  }
  const users=S.pending; S.pending=null;
  endSeason(rng,Object.assign({userTeam:S.myTeam,users:users,coach:null},
    LEAGUE.offseason.choices(P),{phil:P.phil,
    featured:(S.featured!==undefined?S.featured:null)}), A, oldTeam);
  S.featured=null;
}

/* seasonTeam: the team coached this season. If the coach has just changed

function endSeason(rng,choices,act,seasonTeam){
  if(SEA.phase!=="done"||!rng||!act)return;
  const my=seasonTeam||S.myTeam, rk=SEA.poll.rankMap();
  const result=SEA.seasonResult(my);
  const teamRows={};

  const {confChamps,post,pnote,cfpOf}=SEA.postRecord();
  LEAGUE.rivals.record(U,SEA);
  SEA.bankCareers(U);
  if(S.calls){ const keep={}, pre=SEA.year+":";
    Object.keys(S.calls).forEach(k=>{if(k.indexOf(pre)===0)keep[k]=S.calls[k]});
    S.calls=keep; }
  if(U.coach[S.myTeam])U.coach[S.myTeam].q=Math.round(Math.max(-40,Math.min(60,S.career.rep*0.62)));
  const B=LEAGUE.offseason.run(U,rng,SEA.healthy(),SEA.elo,SEA.rec,choices);
  const off=Object.assign({},act,B);
  const exp=S.expNow||expectations();
  const miles=milestones(SEA.rec[my][0],SEA.rec[my][1],result,rk[my],my);
  const entry=seasonEntry(my);
  S.history.push(Object.assign(entry,{
    miles:miles, exp:exp.t, program:Math.round(U.program[my]),
    teams:teamRows, top10:SEA.poll.order().slice(0,10),
    groupChamps:confChamps, seeds:cfpOf, post:post, pnote:pnote,
    awards:{mvp:(SEA.mvpRace(3)||[]).map(x=>({n:x.n,p:x.p,t:x.t,r:x.r,c:x.c,line:x.line})),
      team:SEA.awardTeam(my)},
    coaching:{fired:off.fired.indexOf(my)>=0, firedList:off.fired, nFired:off.fired.length,
      hires:(off.hires||[]).slice(0,60), poached:(off.poached||[]).slice(0,12),
      coordMoves:(off.coordMoves||[]).slice(0,6),
      coachNow:(U.coach&&U.coach[my])?{n:U.coach[my].n,q:U.coach[my].q,t:U.coach[my].t}:null},
    league:LEAGUE.historyExtras(SEA,off,my)}));
  // hot seat: the other coaches' entries for this season were written at the
  // hand-over, before the league had finished its year. Complete them now.
  (S.coaches||[]).forEach((c,i)=>{
    if(i===(S.turn||0)||!c.history)return;
    const e=c.history.find(x=>x.year===SEA.year&&!x.teams); if(!e)return;
    const t=e.team, before=c.history.filter(x=>x!==e);
    Object.assign(e,{program:Math.round(U.program[t]),
      exp:(c.expNow||LEAGUE.goals.expectations(U.program[t])).t,
      miles:milestones(SEA.rec[t][0],SEA.rec[t][1],e.result,rk[t],t,before),
      teams:teamRows, top10:SEA.poll.order().slice(0,10),
      groupChamps:confChamps, seeds:cfpOf, post:post, pnote:pnote,
      awards:{mvp:(SEA.mvpRace(3)||[]).map(x=>({n:x.n,p:x.p,t:x.t,r:x.r,c:x.c,line:x.line})),
        team:SEA.awardTeam(t)},
      coaching:{fired:off.fired.indexOf(t)>=0, firedList:off.fired, nFired:off.fired.length,
        hires:(off.hires||[]).slice(0,60), poached:(off.poached||[]).slice(0,12),
        coordMoves:(off.coordMoves||[]).slice(0,6),
        coachNow:(U.coach&&U.coach[t])?{n:U.coach[t].n,q:U.coach[t].q,t:U.coach[t].t}:null},
      league:LEAGUE.historyExtras(SEA,off,t)});
  });
  S.uStart=snap(U); S.off=null; S.plans={}; S.played={}; S.carousel=null;
  S.seasonSeed=(S.seasonSeed*1103515245+12345)>>>0;
  S.steps=0; rebuild(); S.expNow=expectations();
  if(isHotSeat()){
    // a new season: every coach's expectations for the team they now coach,
    // no plans carried over from last year, and coach 1 goes first
    stashCoach();
    S.coaches.forEach(c=>{c.expNow=LEAGUE.goals.expectations(U.program[c.myTeam]); c.plans={}});
    loadCoach(0);
  }
  flash={type:"offseason"}; view="team"; save(); render();
}

/* ============ rendering ============ */
function rkTag(r){return r&&r<=25?`<span class="rk">${r}</span>`:""}

function gameLine(g,mine){
  const hw=g.winner===g.home;
  const best=Math.min(g.hrank||999,g.arank||999);
  const ups=g.hrank&&g.arank?(hw?g.hrank>g.arank:g.arank>g.hrank):false;
  const cls="game"+(best<=25?" marquee":"")+(ups&&best<=25?" upset":"")+(mine?" mine":"");
  const side=(t,s,r,w,seed,rec)=>`<div class="side ${w?'w':''}">${
    seed?`<span class="sdchip">${seed}</span>`:rkTag(r)}
    <span class="nm">${TL(t)}</span>${rec?`<span class="grec">${rec}</span>`:""}
    <span class="sc">${s}</span></div>`;
  const chips=[];
  if(g.title)chips.push(`<span class="chip ttl">${esc(g.title)}</span>`);
  if(g.site)chips.push(`<span class="chip ttl">${esc(g.site)}</span>`);
  if(ups&&best<=25)chips.push(`<span class="chip up">Upset</span>`);
  if(g.neutral&&!g.site&&!g.title)chips.push(`<span class="chip">Neutral</span>`);
  if(g.margin<=3)chips.push(`<span class="chip">One score</span>`);
  const rv=LEAGUE.rivals.name(g.home,g.away);
  if(rv)chips.push(`<span class="chip riv">${esc(rv)}</span>`);
  return `<article class="${cls}"><div class="edge" style="${mine?`background:${teamInk(g.winner)}`:""}"></div><div class="gbody">
    ${side(g.away,g.ap,g.arank,!hw,g.aseed,g.arec)}${side(g.home,g.hp,g.hrank,hw,g.hseed,g.hrec)}
    ${chips.length?`<div class="meta">${chips.join("")}</div>`:""}</div></article>`;
}

/* ---- watching a game ---- */
let watch=null;   // {g, script, i, timer}

function watchSeed(g){
  return (g.hp*7919 + g.ap*104729 + (g.week||0)*131 + (g.home.length*17) + g.away.length)>>>0;
}

function speedMult(){
  const k=S.watchSpeed||"normal";
  const f=SPEEDS.find(s=>s[0]===k);
  return f?f[1]:1;
}
function watchGap(){
  const n=Math.max(1,watch.script.length);
  return Math.max(120,Math.min(2600,Math.round(7200/n/speedMult())));
}
/* playback speeds for watching a game (live or a replay) */
const SPEEDS=[["slow",0.34,"Slow"],["normal",0.52,"Normal"],["fast",1.0,"Fast"],["rapid",2.1,"Very fast"]];

function tickWatch(){
  if(!watch)return;
  if(watch.timer){clearTimeout(watch.timer);watch.timer=null}
  render();
  if(!watch.paused && watch.i<watch.script.length){
    watch.timer=setTimeout(()=>{watch.i++;tickWatch()},watch.i<0?650:watchGap());
  }
}
function stepWatch(){
  if(!watch)return;
  if(watch.i<watch.script.length){watch.i++;}
  tickWatch();
}
function togglePause(){
  if(!watch)return;
  watch.paused=!watch.paused;
  S.watchStep=watch.paused; save();
  tickWatch();
}
function stopWatch(finish){
  if(watch&&watch.timer)clearTimeout(watch.timer);
  if(finish&&watch){watch.i=watch.script.length;watch.timer=null;render();return}
  watch=null; render();
}

function prefersReduced(){
  try{return window.matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}
}

function liveRec(team){
  const w=SEA.rec[team][0], l=SEA.rec[team][1];
  if(reveal!=="half")return [w,l];
  const g=heroGame();
  if(!g||(g.home!==team&&g.away!==team))return [w,l];
  return g.winner===team?[w-1,l]:[w,l-1];
}

function liveConf(team){
  const w=SEA.confrec[team][0], l=SEA.confrec[team][1];
  if(reveal!=="half")return [w,l];
  const g=heroGame();
  if(!g||!g.conf||(g.home!==team&&g.away!==team))return [w,l];
  return g.winner===team?[w-1,l]:[w,l-1];
}

function heroGame(){
  const my=S.myTeam;
  if(flash&&flash.type==="week"){
    const W=SEA.weeks[flash.step];
    if(W)return W.games.find(x=>x.home===my||x.away===my)||null;
  }else if(flash&&flash.type==="post"){
    const pools=SEA.postPools();
    for(const p of pools){const f=p.find(x=>x.home===my||x.away===my);if(f)return f}
  }
  return null;
}

function heroResult(){
  const my=S.myTeam;
  let g=null,label="";
  if(flash&&flash.type==="week"){
    const W=SEA.weeks[flash.step];
    if(W){g=W.games.find(x=>x.home===my||x.away===my);label=W.label}
  }else if(flash&&flash.type==="post"){
    const pools=SEA.postPools();
    for(const p of pools){const f=p.find(x=>x.home===my||x.away===my);if(f){g=f;break}}
  }
  if(!g)return "";
  const won=g.winner===my;
  const opp=g.home===my?g.away:g.home;
  const half=(reveal==="half"&&g.hh!==undefined);
  const ms=half?(g.home===my?g.hh:g.ah):(g.home===my?g.hp:g.ap);
  const os=half?(g.home===my?g.ah:g.hh):(g.home===my?g.ap:g.hp);
  const cur=SEA.poll.rankMap(), pv=SEA.prevRank;
  let move="";
  if(pv&&pv[my]){
    const d=pv[my]-cur[my];
    if(cur[my]<=25&&pv[my]>25)move=`<div class="hmove up">${LEAGUE.text.entered}${cur[my]}</div>`;
    else if(cur[my]>25&&pv[my]<=25)move=`<div class="hmove dn">Dropped out of the poll</div>`;
    else if(cur[my]<=25&&d>0)move=`<div class="hmove up">&#9650; Up ${d} to #${cur[my]}</div>`;
    else if(cur[my]<=25&&d<0)move=`<div class="hmove dn">&#9660; Down ${-d} to #${cur[my]}</div>`;
    else if(cur[my]<=25)move=`<div class="hmove flat">Holding at #${cur[my]}</div>`;
  }
  if(half)return `<div class="hero half">
    <div class="hlabel"><span class="live"></span>HALFTIME${label?" &middot; "+esc(label):""}</div>
    <div class="hscore">${ms}<span>&ndash;</span>${os}</div>
    <div class="hopp">${g.home===my?"vs":"at"} ${esc(opp)}</div>
    <div class="hfoot">Second half under way&hellip;</div></div>`;
  return `<div class="hero ${won?'win':'loss'}" style="--tc:${teamInk(my)}">
    <div class="hlabel">FINAL &middot; ${won?"WIN":"LOSS"}${label?" &middot; "+esc(label):""}</div>
    <div class="hscore">${ms}<span>&ndash;</span>${os}</div>
    <div class="hopp">${g.home===my?"vs":"at"} ${esc(opp)}</div>${move}
    ${SEA.roster?`<button class="rewatch" data-rewatch="1">Rewatch</button>`:""}</div>`;
}


/* ============ what's at stake ============ */
function winProb(me,opp,atHome,neutral){
  const v=t=>(SEA.hfa&&SEA.hfa[t])||LEAGUE.tuning.hfa;
  const hfa=neutral?0:(atHome?v(me):-v(opp));
  return 1/(1+Math.pow(10,-((SEA.elo[me]+hfa-SEA.elo[opp])/400)));
}

function confPosition(t){
  const c=CONF[t];
  if(c==="IND")return null;
  const mem=NAMES.filter(x=>CONF[x]===c).sort((x,y)=>{
    const px=SEA.confrec[x][0]/Math.max(1,SEA.confrec[x][0]+SEA.confrec[x][1]);
    const py=SEA.confrec[y][0]/Math.max(1,SEA.confrec[y][0]+SEA.confrec[y][1]);
    return py-px||SEA.confrec[y][0]-SEA.confrec[x][0]||SEA.elo[y]-SEA.elo[x];
  });
  return {pos:mem.indexOf(t)+1,of:mem.length,conf:LEAGUE.conf.names[c]};
}

function streakOf(t){
  let n=0,won=null;
  for(let i=SEA.weeks.length-1;i>=0;i--){
    const g=SEA.weeks[i].games.find(x=>x.home===t||x.away===t);
    if(!g)continue;
    const w=g.winner===t;
    if(won===null)won=w;
    if(w!==won)break;
    n++;
  }
  return {n:n,won:won};
}

/* Returns the single most interesting thing riding on this game. */
function stakesFor(ng){
  const my=S.myTeam, opp=ng.home===my?ng.away:ng.home;
  const rk=SEA.poll.rankMap();
  const wk=SEA.step, left=LEAGUE.weeks-wk;
  const rec=SEA.rec[my], w=rec[0], l=rec[1];
  const cp=confPosition(my);
  const riv=LEAGUE.rivals.name(my,opp);
  const out=[];

  if(riv){
    const ser=LEAGUE.rivals.series(U,my,opp);
    let extra="";
    if(ser&&ser.streak&&ser.streak.n>=2)
      extra=ser.streak.team===my?` You've won ${ser.streak.n} in a row.`
                             :` They've won ${ser.streak.n} in a row.`;
    out.push({p:100,tag:"RIVALRY",
      l:`${riv[0].toUpperCase()+riv.slice(1)} is on the line.${extra}`});
  }

  if(l===0&&w>=4)out.push({p:90,tag:"UNBEATEN",
    l:`${w}-0 and counting. A perfect season is still live.`});

  out.push(...LEAGUE.ui.stakes({my:my,opp:opp,rk:rk,wk:wk,left:left,w:w,l:l,cp:cp}));
  const st=streakOf(my);
  if(!st.won&&st.n>=3)out.push({p:74,tag:"SLIDE",
    l:`${st.n} straight losses. The seat under your coach is getting warm.`});
  else if(st.won&&st.n>=5)out.push({p:58,tag:"STREAK",
    l:`${st.n} in a row. Nobody wants to be the one who ends it.`});

  if(l>=6)out.push({p:40,tag:"SPOILER",
    l:`Nothing left but pride and a chance to wreck somebody's season.`});

  if(!out.length)out.push({p:0,tag:"WEEK "+(wk+1),
    l:`${ng.home===my?"Home":"On the road"} against ${opp}. Take care of business.`});

  out.sort((x,y)=>y.p-x.p);
  return out.slice(0,2);
}

/* A season misses expectations when its grade says so: "Short of the mark"
   or worse. Two in a row at the same job and you're fired. */
function seasonMissed(h){return h.miss!==undefined?!!h.miss:/Short of the mark|A bad year/.test(h.gradeLine||"")}
function missedTwiceFor(team,history,exp){
  const now=seasonGrade(SEA.rec[team][0],SEA.rec[team][1],SEA.seasonResult(team),exp);
  const prev=(history||[]).find(h=>h.year===SEA.year-1&&h.team===team);
  return !!(now.miss&&prev&&seasonMissed(prev));
}
function missedTwice(my,exp){return missedTwiceFor(my,S.history,exp)}
/* where you stand against that rule: missed last year here, you're on the
   hot seat all season; on pace to miss this year, you're under pressure */
function seatBadge(){
  const my=S.myTeam;
  if(!U||!U.coach)return "";
  const w=SEA.rec[my][0], l=SEA.rec[my][1];
  const prev=(S.history||[]).find(h=>h.year===SEA.year-1&&h.team===my);
  if(prev&&seasonMissed(prev))return `<span class="seat hot">HOT SEAT</span>`;
  if(w+l<4)return `<span class="seat cool">Settled</span>`;
  const exp=S.expNow||expectations(), games=LEAGUE.schedule.games;
  const paceW=Math.round(w/(w+l)*games), g=seasonGrade(paceW,games-paceW,"",exp);
  if(g.miss)return `<span class="seat warm">Under pressure</span>`;
  return `<span class="seat cool">Secure</span>`;
}

      const w=SEA.rec[my][0],l=SEA.rec[my][1];
      // games left: your remaining regular-season games (was 12 minus games
      // played, a college football season), plus what a postseason run can add
      const left=SEA.sched.filter(g=>g.week>=SEA.step&&(g.home===my||g.away===my)).length;
      const postMax=LEAGUE.post.phases.filter(p=>p!=="selection").length;
      const need=Math.max(0,e.w-w);
      return `<div class="expbar"><span class="etag">${esc(e.t)}</span>
        <span class="eline">${w+l===0?esc(e.l)
          :need===0?`Target of ${e.w} wins already met.`
          :need>left+postMax?`${e.w} wins is out of reach now.`
          :need>left?`${need} more win${need===1?"":"s"} from the ${e.w} expected: it will take a postseason run.`
          :`${need} more win${need===1?"":"s"} from the ${e.w} expected.`}</span></div>`})()}
    </div>`;
  return h;
}

function scheduleHTML(team,compact){

      <span class="steam">Bye week</span><span class="sconf byelbl">${label}</span></div>`);continue}
    const opp=g.home===team?g.away:g.home;

      const ms=g.home===team?g.hp:g.ap, os=g.home===team?g.ap:g.hp;
      rows.push(`<div class="srow"><span class="spos ${won?'wl-w':'wl-l'}">${won?"W":"L"}</span>
        <span class="steam">${g.home===team?"vs":"at"} ${rkTag(g.home===team?g.arank:g.hrank)}${TL(opp)}${
          riv?` <em class="rivmark">${esc(riv)}</em>`:""}</span>
        <span class="sconf">${ms}-${os}</span></div>`);
    }else{
      rows.push(`<div class="srow up"><span class="spos">${label.replace("Wk ","")}</span>
        <span class="steam">${g.home===team?"vs":"at"} ${rkTag(rk)}${TL(opp)}${
          riv?` <em class="rivmark">${esc(riv)}</em>`:""}</span>
        <span class="sall">${esc(LEAGUE.dates[w]||"")}</span></div>`);
    }

  // postseason
  const post=SEA.postGamesFor(team);

      <span class="steam">${esc(opp)} <em class="rivmark sod">${esc(n)}</em></span>

function seasonGrade(wins,losses,result,exp){ return LEAGUE.goals.grade(wins,losses,result,exp) }

function milestones(wins,losses,result,rank,team,history){
  const my=team||S.myTeam, out=[], H=history||S.history;
  const mine=H.map(h=>h.teams&&h.teams[my]?h.teams[my]:null).filter(Boolean);
  if(!mine.length){
    if(wins>=11)out.push(`${wins} wins in your first season in charge.`);
    return out;
  }
  const bestW=Math.max(...mine.map(r=>r[0]));
  const bestR=Math.min(...mine.map(r=>r[2]));
  if(wins>bestW)out.push(`Best season of your tenure &mdash; ${wins} wins, past the old high of ${bestW}.`);
  if(rank<bestR&&rank<=25)out.push(`Highest finish yet at No. ${rank}.`);
  if(LEAGUE.goals.isTitle(result)&&!H.some(h=>h.champion===my))
    out.push(LEAGUE.goals.firstTitle);
  let streak=0;
  for(let i=mine.length-1;i>=0;i--){if(mine[i][0]>mine[i][1])streak++;else break}
  if(wins>losses&&streak+1>=5)out.push(`${streak+1} straight winning seasons.`);
  if(losses>=9&&wins<=3)out.push(`Worst season in ${mine.length+1} years. That will be remembered.`);
  return out;
}

/* ============ weekly news desk ============ */
function loserRank(g){return g.winner===g.home?g.arank:g.hrank}
function winnerRank(g){return g.winner===g.home?g.hrank:g.arank}
function scoreOf(g,t){return g.home===t?g.hp:g.ap}
function oppOf(g,t){return g.home===t?g.away:g.home}

/* One of several ways to say a thing, chosen by season, week and a key, so
   the same moment always reads the same (a reloaded save shows the same
   words) but the season doesn't repeat itself. */
function vary(list,key){
  let h=(2166136261^((SEA?SEA.year:0)*131+(SEA?SEA.step:0)))>>>0;   // FNV-1a, then mixed
  for(let i=0;i<key.length;i++)h=Math.imul(h^key.charCodeAt(i),16777619)>>>0;
  h=(h^(h>>>13))>>>0; h=Math.imul(h,2246822507)>>>0; h=(h^(h>>>16))>>>0;   // keep it unsigned
  return list[h%list.length];
}
function weekNews(W){
  const my=S.myTeam, items=[];
  const gs=W.games;
  const rankTxt=r=>r&&r<=25?"No. "+r+" ":"";

  // headline: the best ranked team to go down
  const ups=gs.filter(g=>loserRank(g)<=25&&winnerRank(g)>loserRank(g))
              .sort((a,b)=>loserRank(a)-loserRank(b));
  if(ups.length){
    const g=ups[0], L=g.loser, Wn=g.winner;
    const lr=loserRank(g), wr=winnerRank(g);
    const verb=g.margin>=21?vary(["routed","ran over","blew out"],"uv"+Wn)
              :g.margin<=3?vary(["edged","held off","slipped past"],"uv"+Wn):vary(["beat","knocked off","took down"],"uv"+Wn);
    items.push({p:90,k:"upset",tone:"flag",
      h:`${rankTxt(wr)}${Wn} ${verb} ${rankTxt(lr)}${L}, ${Math.max(g.hp,g.ap)}-${Math.min(g.hp,g.ap)}`,
      b: lr<=5 ? vary([`A top-five team is down. ${L} won't drop out, but the margin for error is gone.`,
                       `${L} was supposed to be one of the best. Not this week.`,
                       `The top five just lost a member for a week. ${L} has work to do.`],"ub"+L)
        : wr>25 ? vary([`${Wn} came in unranked. ${L} will pay for this one in ${LEAGUE.text.ranking}.`,
                        `Nobody had ${Wn} on this one. ${L} will feel it in ${LEAGUE.text.ranking}.`],"ub"+L)
        : vary([`${Wn} moves up; ${L} slides.`,`${Wn} climbs. ${L} has some explaining to do.`,
                `A swap in ${LEAGUE.text.ranking} coming: ${Wn} up, ${L} down.`],"ub"+L)});
  }
  // other ranked casualties
  const more=ups.slice(1,3);
  if(more.length)items.push({p:40,k:"also",tone:"muted",
    h:vary([`Also down: `,`Also losing: `,`More losses near the top: `],"ah")+more.map(g=>rankTxt(loserRank(g))+g.loser).join(", "),
    b:vary([`${more.length===1?"That's":"Those are"} more cracks in ${LEAGUE.text.top}.`,
            `It was that kind of week.`,`Nobody is safe this year.`,`Expect some reshuffling.`],"ab")});

  // your team, framed
  const mg=gs.find(g=>g.home===my||g.away===my);
  if(mg){
    const won=mg.winner===my, opp=oppOf(mg,my);
    const ms=scoreOf(mg,my), os=scoreOf(mg,opp);
    const oppR=mg.home===my?mg.arank:mg.hrank;
    const v=(list)=>vary(list,"you"+opp);
    let b;
    if(won&&oppR<=25)b=v(LEAGUE.text.rankedWin);
    else if(won&&mg.margin>=28)b=v([`Never in doubt.`,`Over by halftime.`,`A statement, if anyone was listening.`]);
    else if(won&&mg.margin<=3)b=v([`Survived. They won't all look like that.`,`Ugly, but it counts.`,`Closer than anyone wanted.`]);
    else if(won)b=v([`Business handled.`,`A solid day's work.`,`No drama. Next.`]);
    else if(oppR<=10)b=v([`No shame in it, but the résumé takes a hit.`,`Beaten by one of the best. It still counts as one.`]);
    else if(oppR>25)b=v(LEAGUE.text.badLoss);
    else b=v([`A setback.`,`Not good enough, and they know it.`,`One to learn from, and quickly.`]);
    const verb=won?(mg.margin>=28?v(["routed","ran away from","buried"]):mg.margin<=3?v(["edged","held off","survived"]):v(["beat","handled","got past"]))
                  :(mg.margin>=28?v(["was run over by","was blown out by"]):mg.margin<=3?v(["fell just short against","lost a heartbreaker to","came up short against"]):v(["lost to","fell to","was beaten by"]));
    items.push({p:100,k:"you",tone:"gold",
      h:`${my} ${verb} ${rankTxt(oppR)}${opp}, ${ms}-${os}`,b:b});
  }else{
    items.push({p:100,k:"you",tone:"muted",h:`${my} was idle`,
      b:`An open date. Everyone else kept playing.`});
  }

  // who's left unbeaten
  const unb=NAMES.filter(t=>SEA.rec[t][1]===0&&SEA.rec[t][0]>0);
  if(unb.length&&SEA.step>=4){
    unb.sort((x,y)=>SEA.poll.rankMap()[x]-SEA.poll.rankMap()[y]);
    items.push({p:50,k:"unbeaten",tone:"muted",
      h:unb.length===1?`${unb[0]} stands alone at ${SEA.rec[unb[0]][0]}-0`
        :vary([`${unb.length} teams still unbeaten`,`${unb.length} without a loss`,`Still perfect: ${unb.length} teams`],"un"),
      b:unb.slice(0,6).join(", ")+(unb.length>6?" and others":"")+"."});
  }

  // rivalry, with the series behind it
  const rivG=gs.filter(g=>LEAGUE.rivals.name(g.home,g.away))
    .sort((x,y)=>Math.min(x.hrank||999,x.arank||999)-Math.min(y.hrank||999,y.arank||999))[0];
  if(rivG){
    const nm=LEAGUE.rivals.name(rivG.home,rivG.away);
    const ser=LEAGUE.rivals.series(U,rivG.winner,rivG.loser);
    let b=`${rivG.winner} keeps ${nm}.`;
    if(ser&&ser.streak&&ser.streak.n>=2)
      b=`${ser.streak.team} has now won ${ser.streak.n} straight in ${nm}.`;
    else if(ser)b=`${ser.w}-${ser.l} in the series.`;
    items.push({p:85,k:"riv",tone:"flag",
      h:`${rivG.winner} takes ${nm}, ${Math.max(rivG.hp,rivG.ap)}-${Math.min(rivG.hp,rivG.ap)}`,b:b});
  }

  // performance of the week
  if(SEA.roster){
    let best=null;
    NAMES.forEach(t=>{
      SEA.roster[t].forEach((pl,i)=>{
        if(!pl||!pl.last||pl.last.week!==SEA.step-1)return;
        const P=pl.last.pos, st=SPORT.starLine(P,pl.last.line);   // the sport says what stands out
        if(st&&(!best||st.v>best.v))best={v:st.v,n:pl.n,t:pl.last.team,p:P,txt:st.txt};
      });
    });
    if(best)items.push({p:best.t===my?88:62,k:"star",tone:best.t===my?"gold":"muted",
      h:`${best.n} goes for ${best.txt}`,
      b:best.t===my?vary([`The ${best.p} carried ${best.t} \u2014 your guy.`,`Your ${best.p}, and the day belonged to him.`,
                          `Put that one on the tape. Your ${best.p}.`],"st"+best.n)
                   :vary([`The ${best.p} carried ${best.t}.`,`${best.t}'s ${best.p} was the story.`,`A day to remember for ${best.t}'s ${best.p}.`],"st"+best.n)});
  }

  // a team on a run
  const st=streakOf(my);
  if(st.n>=4)items.push({p:80,k:"run",tone:st.won?"gold":"flag",
    h:st.won?`${my} has won ${st.n} in a row`:`${my} has lost ${st.n} straight`,
    b:st.won?`Nobody wants to see you right now.`:`Something has to change.`});

  // biggest beating
  const blow=gs.slice().sort((a,b)=>b.margin-a.margin)[0];
  if(blow&&blow.margin>=38)items.push({p:30,k:"blowout",tone:"muted",
    h:`${blow.winner} ${Math.max(blow.hp,blow.ap)}, ${blow.loser} ${Math.min(blow.hp,blow.ap)}`,
    b:`The week's worst mismatch.`});

  // injury desk
  if(SEA.roster){
    const hurt=[];
    NAMES.forEach(t=>{
      const rk=SEA.poll.rankMap()[t];
      if(rk>30)return;
      SEA.talent.log[t].forEach(x=>{
        if(x.kind==="injury"&&x.wk===SEA.step&&x.who)
          hurt.push({t:t,rk:rk,who:x.who,p:x.what,w:x.weeks});
      });
    });
    hurt.sort((a,b)=>a.rk-b.rk);
    if(hurt.length){const x=hurt[0];
      items.push({p:70,k:"inj",tone:"flag",
        h:`${rankTxt(x.rk)}${x.t} loses ${x.who} (${x.p})`,
        b:`Out ${x.w>=14?"for the season":"about "+x.w+" week"+(x.w===1?"":"s")}.`+
          (hurt.length>1?` ${hurt.length-1} other ranked team${hurt.length>2?"s":""} took a hit too.`:"")});
    }
  }

  // heisman watch
  if(SEA.step>=6&&SEA.roster){
    const hz=SEA.mvpRace(2);
    if(hz.length)items.push({p:55,k:"heis",tone:"muted",
      h:`${LEAGUE.awards.mvp} watch: ${hz[0].n}, ${classTag(hz[0].c)} ${hz[0].p}, ${hz[0].t}`,
      b:`${hz[0].line||""}${hz[1]?" \u00b7 "+hz[1].n+" ("+hz[1].t+") is closest.":""}`});
  }
  items.sort((x,y)=>(y.p||0)-(x.p||0));
  return items;
}

function newsBlock(){
  const W=SEA.weeks[SEA.weeks.length-1];
  if(!W||!W.games.length)return "";
  const items=weekNews(W).slice(0,6);

  return `<div class="grouphead">The week that was</div>`+
    items.map(x=>`<div class="news ${x.tone}">
      <div class="nh">${esc(x.h)}</div>${x.b?`<div class="nb">${esc(x.b)}</div>`:""}
    </div>`).join("");
}

function sanitizeKey(s){return String(s).replace(/[^A-Za-z0-9_-]/g,"").slice(0,24)||"coach"}

async function postSeason(){
  const C=S.career, last=S.history[S.history.length-1];
  if(!last){leagueMsg="Finish a season first.";render();return}
  const key="lg-"+S.seed+"-"+sanitizeKey(C.name);
  const row={coach:C.name,team:S.myTeam,seed:S.seed,year:last.year,rec:last.rec,
    rank:last.rank,result:last.result,grade:last.grade,
    titles:C.titles,cw:C.w,cl:C.l,rep:Math.round(C.rep),at:Date.now()};
  if(store.kind()!=="claude"){leagueMsg="The shared table only works when the game runs inside Claude.";render();return}
  try{
    if(!(await store.set(key,JSON.stringify(row),true)))throw new Error("not stored");
    leagueMsg="Posted "+last.year+".";
    await loadLeague();
  }catch(e){leagueMsg="Couldn't post right now.";render()}
}

async function loadLeague(){
  if(store.kind()!=="claude"){league=[];leagueMsg="The shared table only works when the game runs inside Claude.";render();return}
  try{
    const r=await store.list("lg-",true);
    const keys=(r&&r.keys)?r.keys:[];
    const rows=[];
    for(const k of keys.slice(0,80)){
      try{const v=await store.get(k,true); if(v&&v.value)rows.push(JSON.parse(v.value))}
      catch(e){}
    }
    league=rows;
  }catch(e){league=[]; leagueMsg="Shared table unavailable here."}
  render();
}

function allTime(t){
  let w=0,l=0,best=999,titles=0,confs=0,cfp=0,pw=0,pl=0,coach=0;
  S.history.forEach(h=>{
    const r=h.teams&&h.teams[t]; if(!r)return;
    w+=r[0]; l+=r[1]; if(r[2]<best)best=r[2];
    if(h.champion===t)titles++;
    if(h.groupChamps&&Object.values(h.groupChamps).indexOf(t)>=0)confs++;
    if(h.seeds&&h.seeds[t])cfp++;
    if(h.post&&h.post[t]){pw+=h.post[t][0]; pl+=h.post[t][1]}
    if(h.coaching&&h.coaching.firedList.indexOf(t)>=0)coach++;
  });
  const rk=SEA?SEA.poll.rankMap()[t]:999;
  return {w:w,l:l,best:best===999?null:best,titles:titles,confs:confs,cfp:cfp,
          post:pw+"-"+pl,postGames:pw+pl,coach:coach,now:rk,
          pct:(w+l)?(w/(w+l)):null,seasons:S.history.length};
}

function seasonRowsFor(t){
  return S.history.map(h=>{
    const r=(h.teams&&h.teams[t])||[0,0,999];
    const seed=h.seeds?h.seeds[t]:null;
    const res=LEAGUE.seasonLine(h,t,r,seed);
    const cc=h.groupChamps?Object.keys(h.groupChamps).find(c=>h.groupChamps[c]===t):null;
    return {year:h.year,rec:r[0]+"-"+r[1],rank:r[2],res:res,grade:(t===S.myTeam?h.grade:null),
            champ:h.champion===t,conf:cc?LEAGUE.conf.names[cc]:null,
            coach:!!(h.coaching&&h.coaching.firedList.indexOf(t)>=0)};
  }).reverse();
}

  h+=S.history.slice().reverse().map(x=>{
    const r=x.teams&&x.teams[x.champion];
    return `<div class="yrow ${x.champion===my?'gold':''}"
      style="border-left:3px solid ${teamInk(x.champion)}">
