<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Football Coach — build a program, win it all</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#10131C;--panel:#191E2C;--panel2:#141928;--line:#2A3145;--bone:#E9E5DA;
 --muted:#7F89A0;--sodium:#F4A63A;--flag:#E45B4E;--turf:#46B583;--vote:#8B9FE8;
 --cond:'Barlow Condensed',Impact,sans-serif;--body:'Barlow',system-ui,sans-serif;
 --mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--bone);font-family:var(--body);
 -webkit-font-smoothing:antialiased;padding-bottom:176px}
#app{max-width:760px;margin:0 auto}
.mast{padding:26px 16px 16px;border-bottom:1px solid var(--line)}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;

 margin-top:8px;text-transform:uppercase}
.mast p{color:var(--muted);font-size:13px;margin-top:10px;line-height:1.5}
.stick{position:sticky;top:0;z-index:20;background:rgba(16,19,28,.97);
 backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:11px 16px 9px}
.tb-yr{font-family:var(--mono);font-size:11px;color:var(--sodium);letter-spacing:.14em}
.tb-team{font-family:var(--cond);font-size:21px;font-weight:700;text-transform:uppercase;
 margin-left:9px;letter-spacing:.01em}
.tb-right{font-family:var(--mono);font-size:13px;color:var(--muted)}
.tb-rk{color:var(--sodium);margin-left:6px}
.tabs{display:flex;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;background:none;border:none;border-bottom:2px solid transparent;
 color:var(--muted);font-family:var(--cond);font-weight:600;font-size:13.5px;
 letter-spacing:.045em;text-transform:uppercase;padding:11px 9px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--bone);border-bottom-color:var(--sodium)}
.tab:focus-visible,.pick:focus-visible,.advance:focus-visible{outline:2px solid var(--sodium);
 outline-offset:2px}

 background:linear-gradient(180deg,transparent,rgba(16,19,28,.95) 32%)}
.advance{display:block;width:100%;max-width:728px;margin:0 auto;background:var(--sodium);

 letter-spacing:.08em;text-transform:uppercase;padding:15px;cursor:pointer;border-radius:2px}
.advance:active{transform:translateY(1px)}
.skip{display:block;width:100%;max-width:728px;margin:0 auto 7px;background:none;
 border:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:10.5px;
 letter-spacing:.08em;text-transform:uppercase;padding:9px;cursor:pointer;border-radius:2px}
.skip:hover{border-color:var(--sodium);color:var(--sodium)}
.digest{margin:12px 0 4px}

.dwk{font-family:var(--mono);font-size:10px;color:var(--muted);flex:0 0 58px}
.dres{font-family:var(--mono);font-size:12px;flex:0 0 66px}
.dres.w{color:var(--turf)}.dres.l{color:var(--flag)}.dres.bye{color:var(--muted)}
.dopp{font-family:var(--cond);font-size:15px;flex:1;white-space:nowrap;overflow:hidden;

.dateline h2{font-family:var(--cond);font-size:25px;font-weight:700;text-transform:uppercase}
.dateline span{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.1em}
.grouphead{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
 color:var(--muted);padding:18px 16px 7px;border-top:1px solid var(--line);margin-top:8px}
.note{color:var(--muted);font-size:12.5px;padding:18px 16px;line-height:1.5}

 text-transform:uppercase;color:var(--flag);margin-left:5px}

.byelbl{font-size:11px;color:var(--muted);white-space:nowrap}

.idcard{padding-left:14px}

.stats>div{flex:1;text-align:center;border:1px solid var(--line);padding:9px 4px}

.side.w .sdchip{background:var(--sodium);color:#10131C;font-weight:600}

.mv{font-family:var(--mono);font-size:10px;width:34px;text-align:right;flex:0 0 34px}
.mv.up{color:var(--turf)}.mv.dn{color:var(--flag)}.mv.flat{color:var(--muted)}
.prow{border-left:3px solid var(--tc);padding-left:13px}
.cbar{display:none}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;display:inline-block}
.findbox{font-family:var(--body);font-size:15px;letter-spacing:0}
.pick{display:flex;align-items:center;gap:8px}
.pick .pn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .pr{font-family:var(--mono);font-size:10px;color:var(--muted)}
.meta{display:flex;gap:7px;margin-top:5px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
 padding:2px 5px;border:1px solid var(--line);color:var(--muted)}
.chip.up{border-color:var(--flag);color:var(--flag)}
.chip.ttl{border-color:var(--sodium);color:var(--sodium)}
.prow{display:flex;align-items:center;gap:10px;padding:9px 16px;
 border-bottom:1px solid rgba(42,49,69,.55)}
.prow.mine,.srow.mine,.frow.mine{background:rgba(244,166,58,.1)}
.pnum{font-family:var(--mono);font-size:13px;color:var(--sodium);width:22px;text-align:right;
 flex:0 0 22px}
.pmain{flex:1;min-width:0}
.pname{font-family:var(--cond);font-size:18px;font-weight:600;line-height:1.1}
.psub{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:1px}
.cbox{border-top:1px solid var(--line);margin-top:10px}
.chead{font-family:var(--cond);font-size:17px;font-weight:700;letter-spacing:.05em;
 text-transform:uppercase;padding:12px 16px 5px}
.srow{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:13px}
.srow:nth-child(odd){background:rgba(25,30,44,.5)}

 text-align:right}

.wl-w{color:var(--turf)!important;font-weight:600}.wl-l{color:var(--flag)!important;font-weight:600}
.steam{flex:1;font-family:var(--cond);font-size:16px;font-weight:500;white-space:nowrap;

.sconf.up{color:var(--turf)}.sconf.dn{color:var(--flag)}
.sall{font-family:var(--mono);font-size:13px;color:#B4BCCB;width:46px;text-align:right;
 flex:0 0 46px}

.shead .steam,.shead .sconf,.shead .sall{font-family:var(--mono);font-size:9px;
 letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:400}

 border-bottom:1px solid rgba(42,49,69,.55)}
.sd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);
 padding:1px 5px;min-width:22px;text-align:center;flex:0 0 auto}
.fmain{flex:1;min-width:0}
.fname{font-family:var(--cond);font-size:18px;font-weight:600}
.fnote{font-family:var(--mono);font-size:9.5px;color:var(--muted);text-transform:uppercase;
 letter-spacing:.05em;margin-top:1px}

 text-transform:uppercase;margin:8px 0 2px}

/* ---------- desktop ---------- */
@media(min-width:1024px){
  body{padding-bottom:0}
  body.offseason{padding-bottom:120px}
  body.offseason .cols{grid-template-columns:minmax(0,1fr)}
  body.offseason #view{max-width:820px;margin:0 auto}
  #app{max-width:1340px}
  .cols{display:grid;grid-template-columns:390px minmax(0,1fr);align-items:start}
  #side{border-right:1px solid var(--line);
    position:sticky;top:92px;max-height:calc(100vh - 92px);overflow-y:auto;
    display:flex;flex-direction:column;
    scrollbar-width:thin;padding-bottom:14px}
  #side::-webkit-scrollbar{width:7px}
  #side::-webkit-scrollbar-thumb{background:var(--line)}
  .actionbar.hideWide{display:none}
  .sidebtn{padding:12px 16px 14px;position:sticky;bottom:0;
    background:linear-gradient(180deg,transparent,var(--ink) 26%);margin-top:6px}
  .sidebtn .advance{font-size:17px;padding:13px}
  .sidebtn .skip{margin-top:8px}
  #view{min-height:calc(100vh - 96px)}
  .mast{padding:44px 32px 26px}
  .mast h1{font-size:60px}
  .mast p{font-size:15px;max-width:640px}
  .topbar{padding:14px 24px 11px}
  .tb-team{font-size:25px}
  .tabs{padding-left:8px}
  .tab{flex:0 0 auto;font-size:15px;padding:12px 20px}
  .dateline{padding:20px 24px 10px}
  .dateline h2{font-size:29px}
  .grouphead{padding:20px 24px 8px}
  .news,.prow,.frow,.srow,.prow2,.injrow,.trow,.yrow,.game .gbody,.rnd,.note,.legend,
  .key,.sortbar,.subtabs,.seedrow,.chead,.crow,.digest{padding-left:24px;padding-right:24px}
  .cbar,.prow{border-left-width:3px}
  .idcard,.hero,.nextcard,.title-card,.banner,.cand,.opt{margin-left:16px;margin-right:16px}
  #side .idcard,#side .hero,#side .nextcard{margin-left:14px;margin-right:14px}
  #side .grouphead,#side .injrow{padding-left:18px;padding-right:18px}
  /* two-up game and standings grids */
  .gamegrid{display:grid;grid-template-columns:1fr 1fr;gap:0 1px;background:var(--line)}
  .gamegrid .game{background:var(--panel2)}
  .standgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
  .pickgrid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));padding:6px 24px 16px}
  .cand,.opt{cursor:pointer}
  .cand:hover,.opt:hover,.tpick:hover{background:rgba(244,166,58,.07)}
  .hint{display:block}
}

/* position, share of team strength, backup dropoff, award weight */
/* hz = share of injuries that land on this spot */
const POS=[
  {p:"QB",  w:0.27, drop:21, aw:1.58, hz:0.14},
  {p:"RB",  w:0.07, drop:10, aw:1.46, hz:0.13},
  {p:"WR",  w:0.09, drop:11, aw:1.36, hz:0.11},
  {p:"WR2", w:0.06, drop:9,  aw:0.7, hz:0.09},
  {p:"OT",  w:0.12, drop:12, aw:0.47, hz:0.13},
  {p:"EDGE",w:0.11, drop:13, aw:1.0, hz:0.10},
  {p:"DT",  w:0.08, drop:10, aw:0.62, hz:0.09},
  {p:"LB",  w:0.08, drop:10, aw:0.85, hz:0.08},
  {p:"CB",  w:0.07, drop:11, aw:0.78, hz:0.08},
  {p:"S",   w:0.05, drop:9,  aw:0.5, hz:0.05},
];
function pickInjuredPos(rng){
  let x=rng.r(), acc=0;
  for(let i=0;i<POS.length;i++){acc+=POS[i].hz; if(x<acc)return i}
  return POS.length-1;
}
const CLASSES=["Fr","So","Jr","Sr"];

/* rating <-> Elo: teamRating 45 -> 1150, 82 -> 2050 */
const R_SLOPE=24.3, R_INT=56;
const ratingToElo=r=>R_INT+R_SLOPE*r;
const eloToRating=e=>(e-R_INT)/R_SLOPE;

function playerName(rng){return rng.pick(PNAMES_F)+" "+rng.pick(PNAMES_L)}

function makePlayer(rng,target,cls,posIdx){
  // upperclassmen are closer to their ceiling; freshmen start lower with room to grow
  const clsAdj=[-7,-2,2,4][cls];   // centred so a normal class mix averages the target
  const r=Math.round(Math.max(30,Math.min(99,rng.gauss(target+clsAdj,5.5))));
  const pot=Math.round(Math.max(r,Math.min(99,r+rng.gauss(10-cls*2.5,5))));
  return {n:playerName(rng),p:POS[posIdx].p,i:posIdx,c:cls,r:r,pot:pot,
          hz:0,prod:0,st:0};
}

function makeRoster(rng,programElo){
  const target=eloToRating(programElo);
  const classPlan=[3,3,2,2];               // Sr, Jr, So, Fr among ten starters
  const bag=[];
  classPlan.forEach((n,k)=>{for(let i=0;i<n;i++)bag.push(3-k)});
  rng.shuffle(bag);
  return POS.map((_,i)=>makePlayer(rng,target,bag[i],i));
}

function teamRating(roster){
  let s=0; POS.forEach((P,i)=>{s+=P.w*roster[i].r});
  return s;
}
function rosterElo(roster){return ratingToElo(teamRating(roster))}

/* Elo cost of losing a given starter for a game */
function injuryCost(roster,idx){
  const P=POS[idx];
  return -P.w*P.drop*R_SLOPE;
}

/* ---- offseason roster churn ---- */
function developRoster(u,t,rng,focus,devMod,bud,featured){
  focus=focus||{pos:null,r:0,pot:0}; devMod=devMod||0; bud=bud||null;
  const cls=(u.classAvg&&u.classAvg[t]!==undefined)?u.classAvg[t]:null;
  const coach=u.coach[t];
  const base=eloToRating(u.program[t]);
  const target=(u.classAvg&&u.classAvg[t]!==undefined)
    ? base*0.68+u.classAvg[t]*0.32     // recent classes feed the pipeline
    : base;
  const leaving=[], arriving=[];
  const roster=u.roster[t];
  for(let i=0;i<roster.length;i++){
    const pl=roster[i];
    if(pl.c>=3){                                   // senior graduates
      leaving.push({n:pl.n,p:pl.p,r:pl.r});
      // next man up: a developed backup, or a true freshman
      const roll=rng.r();
      const cls=roll<0.34?0:roll<0.70?1:2;
      const bonus=(!focus.pos||focus.pos.indexOf(POS[i].p)>=0)?focus.r:0;
      const np=makePlayer(rng,target+(coach.q*0.045)+bonus+(coach.rec||0)*0.5
        +(bud?bud.recruitBonus:0),cls,i);
      if(focus.pot)np.pot=Math.min(99,np.pot+focus.pot);
      if(focus.dev)np.up=focus.dev;
      if(cls===0)np.rec=true;
      roster[i]=np; arriving.push(np);
    }else{
      // development: biggest jumps early, capped by potential, nudged by coaching
      const base=[6.2,4.0,2.2][pl.c];
      const feat=(featured!==undefined&&featured!==null&&featured===i)?3.8:0;
      let g=rng.gauss(base+coach.q*0.035+devMod+(pl.up||0)+feat,3.0);
      pl.r=Math.round(Math.max(30,Math.min(pl.pot,pl.r+g)));
      pl.c++;
      // stars leave early for the draft
      let keepOdds=bud?Math.max(0,1-bud.retention):1;
      if(featured!==undefined&&featured!==null&&featured===i)keepOdds*=0.34;
      if(pl.c>=2 && pl.r>=76 && rng.r() < ((pl.r-74)/34)*keepOdds){
        const wasFeatured=(featured!==undefined&&featured!==null&&featured===i);
        leaving.push({n:pl.n,p:pl.p,r:pl.r,early:true,featured:wasFeatured});
        if(wasFeatured)u.pipeline=(u.pipeline||0)+1;
        const roll=rng.r();
        const cls=roll<0.40?0:roll<0.74?1:2;
        const bonus=(!focus.pos||focus.pos.indexOf(POS[i].p)>=0)?focus.r:0;
        const np=makePlayer(rng,target+(coach.q*0.045)+bonus,cls,i);
        if(focus.pot)np.pot=Math.min(99,np.pot+focus.pot);
        if(focus.dev)np.up=focus.dev;
        if(cls===0)np.rec=true;
        roster[i]=np; arriving.push(np);
      }
    }
  }
  return {leaving:leaving,arriving:arriving};
}

function classLabel(rank,total){
  const pct=rank/total;
  if(rank<=10)return "Top-10 class";
  if(pct<=0.20)return "Top-25 class";
  if(pct<=0.45)return "Above average";
  if(pct<=0.75)return "Middling";
  return "Thin class";
}

/* ============ RNG ============ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
class RNG{
  constructor(seed){this.f=mulberry32(seed);this.sp=null}
  r(){return this.f()}
  int(n){return Math.floor(this.f()*n)}
  range(a,b){return a+this.f()*(b-a)}
  pick(a){return a[this.int(a.length)]}
  gauss(m,s){
    if(this.sp!==null){const v=this.sp;this.sp=null;return m+s*v}
    let u=0,v=0;while(u===0)u=this.f();while(v===0)v=this.f();
    const R=Math.sqrt(-2*Math.log(u));this.sp=R*Math.sin(2*Math.PI*v);
    return m+s*R*Math.cos(2*Math.PI*v)}
  shuffle(a){for(let i=a.length-1;i>0;i--){const j=this.int(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
}

/* ============ team identity ============ */
function _hx(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function _lum(c){const [r,g,b]=c.map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*r+.7152*g+.0722*b}
function _mix(c,t,p){return c.map((v,i)=>Math.round(v+(t[i]-v)*p))}
const _READ={};
function teamColor(t){                    // raw brand color
  return COLORS[t]||"#F4A63A";
}
function teamInk(t){                      // brand color, lightened until legible on dark
  if(_READ[t])return _READ[t];
  let c=_hx(COLORS[t]||"#F4A63A"), p=0;
  while(_lum(c)<0.30&&p<0.85){p+=0.08;c=_mix(_hx(COLORS[t]||"#F4A63A"),[255,255,255],p)}
  const out="#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");
  _READ[t]=out; return out;
}

const CONF_NAMES={SEC:"SEC",B1G:"Big Ten",B12:"Big 12",ACC:"ACC",P12:"Pac-12",
  AAC:"American",MW:"Mountain West",SBC:"Sun Belt",MAC:"MAC",CUSA:"Conference USA",IND:"Independent"};

const G6=["AAC","CUSA","MAC","MW","P12","SBC"];

  "Oct 31","Nov 7","Nov 14","Nov 21","Nov 28","Dec 5"];

/* ============ schedule ============ */
/* d-regular circulant: every team gets EXACTLY d conference games.
   Valid whenever d <= n-1 and (n*d) is even. */
function confGraph(members,d,rng){
  const idx=rng.shuffle(members.slice()), n=idx.length, out=[];
  d=Math.min(d,n-1);
  if((n*d)%2!==0)d-=1;
  const half=Math.floor(d/2);
  for(let o=1;o<=half;o++)
    for(let i=0;i<n;i++)out.push([idx[i],idx[(i+o)%n]]);
  if(d%2===1)for(let i=0;i<n/2;i++)out.push([idx[i],idx[i+n/2]]);
  return out;
}

function rrRounds(list){
  const t=list.slice(); if(t.length%2)t.push(null);
  const n=t.length, out=[];
  for(let k=0;k<n-1;k++){
    const p=[];
    for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a&&b)p.push([a,b])}
    out.push(p); t.splice(1,0,t.pop());
  }
  return out;
}

function buildSchedule(rng,R){
  const byConf={};
  NAMES.forEach(t=>{(byConf[CONF[t]]=byConf[CONF[t]]||[]).push(t)});
  const games=[], nGames={B1G:9,B12:9};
  for(const c in byConf){
    if(c==="IND")continue;
    confGraph(byConf[c], nGames[c]||8, rng).forEach(([a,b])=>{
      if(rng.r()<0.5)games.push([b,a,true,false]); else games.push([a,b,true,false]);
    });
  }
  const played={}; NAMES.forEach(t=>played[t]=0);
  games.forEach(g=>{played[g[0]]++;played[g[1]]++});
  const RR=Object.assign({},R);
  NAMES.forEach(t=>{if(CONF[t]==="IND")RR[t]=RR[t]+130});
  const seen=new Set(games.map(g=>[g[0],g[1]].sort().join("|")));
  let pool=[];
  NAMES.forEach(t=>{for(let i=0;i<Math.max(0,12-played[t]);i++)pool.push(t)});
  rng.shuffle(pool);
  let tries=0;
  while(pool.length>=2 && tries<80000){
    tries++;
    const i=rng.int(pool.length), a=pool[i];
    const target=RR[a]+(rng.r()<0.24?rng.gauss(0,120):-rng.range(300,750));
    let bj=null,best=null;
    for(let s=0;s<8;s++){
      const k=rng.int(pool.length); if(k===i)continue;
      const d=Math.abs(RR[pool[k]]-target);
      if(best===null||d<best){best=d;bj=k}
    }
    if(bj===null)continue;
    const b=pool[bj];
    if(a===b||CONF[a]===CONF[b])continue;
    const key=[a,b].sort().join("|"); if(seen.has(key))continue;
    seen.add(key);
    let home;
    if(Math.abs(RR[a]-RR[b])>200) home=RR[a]>RR[b]?a:b;
    else home=rng.r()<0.5?a:b;
    games.push([home===a?b:a, home, false, false]);
    const idx=[i,bj].sort((x,y)=>y-x);
    idx.forEach(x=>pool.splice(x,1));
  }
  // pairing repair: pair leftovers directly, or steal an opponent from an
  // existing non-conference game and push the displaced team back into the pool.
  const kOf=(x,y)=>[x,y].sort().join("|");
  let guard=0;
  while(pool.length>0 && guard++<20000){
    const a=pool[0];
    let partner=-1;
    for(let k=1;k<pool.length;k++){
      const b=pool[k];
      if(a===b||CONF[a]===CONF[b])continue;
      if(seen.has(kOf(a,b)))continue;
      partner=k;break;
    }
    if(partner>=0){
      const b=pool[partner];
      seen.add(kOf(a,b));
      const home=rng.r()<0.5?a:b;
      games.push([home===a?b:a,home,false,false]);
      pool.splice(partner,1);pool.splice(0,1);
      continue;
    }
    // steal: replace non-conf game (p,q) with (a,p); q re-enters the pool
    let stole=false;
    const order=rng.shuffle(games.map((g,i)=>i).filter(i=>!games[i][2]));
    for(const gi of order){
      const g=games[gi], x=g[0], y=g[1];
      for(const [p,q] of [[x,y],[y,x]]){
        if(p===a||CONF[a]===CONF[p])continue;
        if(seen.has(kOf(a,p)))continue;
        seen.delete(kOf(x,y));
        seen.add(kOf(a,p));
        games.splice(gi,1);
        const home=rng.r()<0.5?a:p;
        games.push([home===a?p:a,home,false,false]);
        pool.splice(0,1);
        pool.push(q);
        stole=true;break;
      }
      if(stole)break;
    }
    if(!stole){pool.splice(0,1)}
  }

  enforceRivalries(games,rng);

  /* Balance home and away. A coin flip per game leaves teams with ten road
     trips; real slates are close to six and six. */
  (function balanceHome(){
    const homeCt={}; NAMES.forEach(t=>homeCt[t]=0);
    games.forEach(g=>homeCt[g[1]]++);
    const tgt={}; NAMES.forEach(t=>tgt[t]=0);
    games.forEach(g=>{tgt[g[0]]+=0.5;tgt[g[1]]+=0.5});
    const dev=t=>homeCt[t]-tgt[t];
    const idx=games.map((g,i)=>i);
    for(let pass=0;pass<400;pass++){
      let moved=false;
      rng.shuffle(idx);
      for(const i of idx){
        const g=games[i]; if(g[3])continue;      // leave neutral sites alone
        const away=g[0], home=g[1];
        if(dev(home)-dev(away)>=1){              // strictly reduces the spread
          g[0]=home; g[1]=away;
          homeCt[home]--; homeCt[away]++;
          moved=true;
        }
      }
      if(!moved)break;
    }
  })();

  // week assignment — retried until every team has a full slate
  let bestSched=null, bestShort=1e9;
  for(let attempt=0; attempt<6; attempt++){
  rng.shuffle(games); games.sort((x,y)=>(x[2]?1:0)-(y[2]?1:0));
  const busy={}; NAMES.forEach(t=>busy[t]=new Set());
  const sched=[], unplaced=[];
  games.forEach(([a,h,isC,neu])=>{
    const order=isC?[...Array(NW).keys()].slice(3).concat([0,1,2])
                   :[...Array(NW).keys()];
    let ok=false;
    for(const w of order){
      if(!busy[a].has(w)&&!busy[h].has(w)){
        busy[a].add(w);busy[h].add(w);
        sched.push({week:w,away:a,home:h,conf:isC,neutral:neu});ok=true;break}
    }
    if(!ok)unplaced.push([a,h,isC,neu]);
  });
  const place=(a,h,isC,neu)=>{
    for(let w=0;w<NW;w++){
      if(!busy[a].has(w)&&!busy[h].has(w)){
        busy[a].add(w);busy[h].add(w);
        sched.push({week:w,away:a,home:h,conf:isC,neutral:neu});return true}
    }
    return false;
  };
  const move=(g,depth)=>{               // try to relocate game g to a free week
    const A=g.home,B=g.away,cur=g.week;
    for(let w=0;w<NW;w++){
      if(w===cur)continue;
      if(!busy[A].has(w)&&!busy[B].has(w)){
        busy[A].delete(cur);busy[B].delete(cur);
        busy[A].add(w);busy[B].add(w);g.week=w;return true}
    }
    if(depth<=0)return false;
    for(let w=0;w<NW;w++){
      if(w===cur)continue;
      const block=sched.filter(x=>x!==g&&x.week===w&&
        (x.home===A||x.away===A||x.home===B||x.away===B));
      if(block.length!==1)continue;
      if(move(block[0],depth-1)){
        if(!busy[A].has(w)&&!busy[B].has(w)){
          busy[A].delete(cur);busy[B].delete(cur);
          busy[A].add(w);busy[B].add(w);g.week=w;return true}
      }
    }
    return false;
  };
  const stillOut=[];
  unplaced.forEach(([a,h,isC,neu])=>{
    if(place(a,h,isC,neu))return;
    let ok=false;
    for(let w=0;w<NW&&!ok;w++){
      const block=sched.filter(x=>x.week===w&&
        (x.home===a||x.away===a||x.home===h||x.away===h));
      if(block.length!==1)continue;
      if(move(block[0],2)&&!busy[a].has(w)&&!busy[h].has(w)){
        busy[a].add(w);busy[h].add(w);
        sched.push({week:w,away:a,home:h,conf:isC,neutral:neu});ok=true}
    }
    if(!ok)stillOut.push([a,h,isC,neu]);
  });
  stillOut.forEach(([a,h,isC,neu])=>{ place(a,h,isC,neu) });
  lateenRivalries(sched,busy);
  fillEarlyByes(sched,busy);
  const tally={}; NAMES.forEach(t=>tally[t]=0);
  sched.forEach(g=>{tally[g.home]++;tally[g.away]++});
  const shortfall=games.length-sched.length;
  if(shortfall<bestShort){bestShort=shortfall;bestSched=sched}
  if(shortfall===0)return sched;
  }
  return bestSched;
}

/* ============ game sim ============ */
function simGame(rng,tH,tA,neutral,sdMult,edgeAdj){
  const edge=tH-tA+(neutral?0:HFA)+(edgeAdj||0);
  let m=Math.round(rng.gauss(edge/ELO_PT,GAME_SD*(sdMult||1)));
  if(m===0)m=rng.r()<0.5?-3:3;
  let total=rng.gauss(52,9.5)+Math.abs(m)*0.18;
  total=Math.max(20,Math.min(95,total));
  let lo=Math.max(0,Math.round((total-Math.abs(m))/2));
  let hi=lo+Math.abs(m);
  // 1 is not a reachable football score
  if(lo===1)lo=(rng.r()<0.5?0:2);
  if(hi===1)hi=2;
  if(hi<=lo)hi=lo+1;
  if(hi===1)hi=2;
  m=(m>0?1:-1)*(hi-lo);
  return m>0?[hi,lo,m]:[lo,hi,m];
}
function eloUpdate(eW,eL,mAbs,winHome,neutral){
  const hfa=neutral?0:HFA;
  const diff=winHome?(eW+hfa-eL):(eW-eL-hfa);
  const exp=1/(1+Math.pow(10,-diff/400));
  const mov=Math.log(mAbs+1)*(2.2/(0.001*diff+2.2));
  return K*mov*(1-exp);
}

/* ============ talent ============ */
const INJ_HAZARD=0.085,QB_SHARE=0.18,DEV_SD=4.2,AR_SD=5,AR_DECAY=0.8,
      COLLAPSE_P=0.018,BREAKOUT_P=0.018;
const BODY=["OL","WR1","RB1","EDGE","CB1","LB","TE","S"];
function iscale(r){return 0.70+0.45*Math.max(0,Math.min(1,(r-1150)/900))}

class Talent{
  constructor(rng,base,roster){
    this.rng=rng;this.base=Object.assign({},base);
    this.roster=roster||null;
    this.slope={};this.ar={};this.inj={};this.log={};
    NAMES.forEach(t=>{this.slope[t]=rng.gauss(0,DEV_SD);this.ar[t]=0;
      this.inj[t]=[];this.log[t]=[]});
  }
  eff(t,w){
    let s=0; this.inj[t].forEach(e=>{if(e.w>0)s+=e.m});
    return this.base[t]+this.slope[t]*w+this.ar[t]+s;
  }
  active(t){return this.inj[t].filter(e=>e.w>0)}
  advance(w){
    const r=this.rng;
    NAMES.forEach(t=>{
      this.inj[t].forEach(e=>e.w--);
      this.inj[t].filter(e=>e.w<=0).forEach(e=>
        this.log[t].push({wk:w,kind:"back",what:e.k,mag:0}));
      this.inj[t]=this.inj[t].filter(e=>e.w>0);
      const sc=iscale(this.base[t]);
      if(r.r()<INJ_HAZARD){
        if(this.roster){
          // pick a starter, weighted toward the positions that take hits
          const idx=pickInjuredPos(r);
          const pl=this.roster[t][idx];
          if(!this.inj[t].some(e=>e.idx===idx)){
            const sev=r.r();
            const wk=sev<0.12?14:r.pick([1,2,2,3,4,5,6]);
            const m=injuryCost(this.roster[t],idx)*r.range(1.05,2.1);
            this.inj[t].push({m:m,w:wk,k:pl.p,idx:idx,who:pl.n,rating:pl.r});
            this.log[t].push({wk:w,kind:"injury",what:pl.p,who:pl.n,
                              mag:Math.round(m),weeks:wk});
          }
        }else{
          let m,wk,k;
          if(r.r()<QB_SHARE){m=-r.range(85,190)*sc;wk=r.pick([2,3,4,5,6,14]);k="QB1"}
          else{m=-r.range(20,75)*sc;wk=r.pick([1,2,2,3,4,6]);k=r.pick(BODY)}
          this.inj[t].push({m:m,w:wk,k:k});
          this.log[t].push({wk:w,kind:"injury",what:k,mag:Math.round(m),weeks:wk});
        }
      }
      if(r.r()<COLLAPSE_P){const d=-r.range(40,110)*sc;this.base[t]+=d;
        this.log[t].push({wk:w,kind:"collapse",what:"locker room",mag:Math.round(d)})}
      else if(r.r()<BREAKOUT_P){const d=r.range(35,95)*sc;this.base[t]+=d;
        this.log[t].push({wk:w,kind:"breakout",what:"scheme unlock",mag:Math.round(d)})}
      this.ar[t]=this.ar[t]*AR_DECAY+r.gauss(0,AR_SD);
    });
  }
}

/* ============ poll ============ */
const INERTIA=0.82,ELO_PULL=0.18,L_UNR=-52,L_RNK=-22,L_T10=-9,
      W_T10=48,W_RNK=26,W_UNR=4,BLOWOUT=10,IDLE=-3;
/* Losses are the first thing voters sort on. A two-loss team has to be a great
   deal better regarded to stay ahead of an unbeaten one. */
const LOSS_TIER=100;
class Poll{
  constructor(pre){this.s=Object.assign({},pre);this.L={};NAMES.forEach(t=>this.L[t]=0)}
  eff(t){return this.s[t]-(this.L[t]||0)*LOSS_TIER}
  order(){return NAMES.slice().sort((a,b)=>this.eff(b)-this.eff(a))}
  rankMap(){const o=this.order(),m={};o.forEach((t,i)=>m[t]=i+1);return m}
  update(res,elo){
    const prev=this.rankMap(), played=new Set(), d={};
    NAMES.forEach(t=>d[t]=0);
    res.forEach(r=>{
      const w=r.winner,l=r.loser,m=r.margin;
      this.L[l]=(this.L[l]||0)+1;
      played.add(w);played.add(l);
      const lr=prev[l]||999, wr=prev[w]||999;
      if(wr<=25||lr<=25){
        d[w]+= lr<=10?W_T10 : lr<=25?W_RNK : W_UNR;
        if(m>=21&&lr<=25)d[w]+=BLOWOUT;
      } else d[w]+=W_UNR;
      d[l]+= wr<=10?L_T10 : wr<=25?L_RNK : L_UNR;
      if(m>=21)d[l]-=8;
    });
    NAMES.forEach(t=>{
      this.s[t]=this.s[t]*INERTIA+(1-INERTIA)*this.s[t]
                +ELO_PULL*(elo[t]-this.s[t])+d[t]+(played.has(t)?0:IDLE);
    });
    const winners=new Set(res.map(r=>r.winner));
    const nr=this.rankMap();
    winners.forEach(t=>{
      if((prev[t]||999)<=25 && (nr[t]||999)>prev[t]){
        const o=this.order(), ref=o[prev[t]-1];
        if(ref&&ref!==t)this.s[t]=this.eff(ref)+(this.L[t]||0)*LOSS_TIER+0.5;
      }
    });
    return this.rankMap();
  }
}

  // better programs attract better coaches
  const tier=Math.max(0,Math.min(1,(prestige-1150)/900));
  const q=rng.gauss(-24+tier*52, 26);
  return {n:rng.pick(FIRST)+" "+rng.pick(LAST), q:Math.round(Math.max(-58,Math.min(68,q))), t:0, hired:true};

function coachCandidates(rng,prestige){
  const tier=Math.max(0,Math.min(1,(prestige-1150)/900));
  const pool=rng.shuffle(ARCHETYPES.slice()).slice(0,3);
  return pool.map(A=>{
    const q=Math.round(Math.max(-58,Math.min(68,
      rng.gauss(-24+tier*52+A.bump, A.sd))));
    // scouting is imperfect: you see a noisy read, not the number
    const seen=q+rng.gauss(0,13);
    return {n:rng.pick(FIRST)+" "+rng.pick(LAST), q:q, arch:A.k, al:A.l, d:A.d,
            rec:A.rec||0, grade:coachGrade(seen)};

function budgetPool(u,t,wins){
  const base=6+Math.round((u.program[t]-1150)/150);
  const success=wins>=11?3:wins>=9?2:wins>=7?1:0;
  const fac=Math.floor((u.facility&&u.facility[t]?u.facility[t]:0)/22);
  return Math.max(6,Math.min(20,base+success+fac));
}

function applyBudgetRead(alloc){
  return {recruitBonus:(alloc.recruit||0)*0.30,
          devBonus:(alloc.develop||0)*0.46,
          retention:Math.min(0.62,(alloc.retention||0)*0.055)};
}

function applyBudget(u,t,alloc){
  u.facility=u.facility||{};
  u.facility[t]=(u.facility[t]||0)+(alloc.facility||0)*2.4;
  return {
    recruitBonus:(alloc.recruit||0)*0.30,
    devBonus:(alloc.develop||0)*0.46,
    retention:Math.min(0.62,(alloc.retention||0)*0.055),
    facility:Math.min(520,u.facility[t])
  };
}

/* You are the head coach, not the athletic director. You get hired, you get
   fired, and your record follows you to the next job. */
function repGrade(r){
  if(r>=46)return "a national name";
  if(r>=26)return "a hot commodity";
  if(r>=8)return "well regarded";
  if(r>=-10)return "unproven";
  if(r>=-28)return "a hard sell";
  return "radioactive";
}

/* Which jobs would take you, given what you've done. */
function jobMarket(u,rng,rep,openings,current){
  const ceiling=1300+Math.max(0,rep+40)*10;      // reputation opens bigger doors
  const floor=Math.max(1120,ceiling-620);
  const opts=openings.filter(t=>t!==current)
    .filter(t=>u.program[t]<=ceiling&&u.program[t]>=floor)
    .sort((a,b)=>u.program[b]-u.program[a]);
  const picked=[];
  if(opts.length)picked.push(opts[0]);
  if(opts.length>2)picked.push(opts[Math.floor(opts.length/2)]);
  if(opts.length>1)picked.push(opts[opts.length-1]);
  return [...new Set(picked)].slice(0,3);
}

/* Bigger programs come calling when you overperform at a small one. */
function poachOffers(u,rng,rep,openings,current){
  if(rep<18)return [];
  const mine=u.program[current];
  return openings.filter(t=>t!==current&&u.program[t]>mine+150
    &&u.program[t]<=1240+Math.max(0,rep+30)*12)
    .sort((a,b)=>u.program[b]-u.program[a]).slice(0,2);
}

function repDelta(wins,losses,expWins,program,titles){
  const wp=wins/Math.max(1,wins+losses);
  let d=(wins-expWins)*1.7;
  if(titles.natl)d+=22;
  else if(titles.playoff)d+=8;
  else if(titles.conf)d+=6;
  if(wp<0.34&&wins<expWins)d-=6;   // only if you also missed the mark
  // winning at a small program counts for more
  d*= program<1500?1.25 : program>1850?0.82 : 1.0;
  return d;
}

/* ============ program continuity ============ */
const COACH_ONFIELD=0.55,  // how much coach quality shows up on the field
      COACH_BUILD=0.34,    // how much it compounds into the program each year
      ROOKIE_DIP=-22;
const ROSTER_NOISE=48;
const CARRY=0.45,CHURN_SD=95,RECRUIT=0.16,PROG_NOISE=22,
      P_FLOOR=1120,P_CEIL=2010,HOT_SEAT=0.42,COACH_SD=62,COACH_DIP=-18,PERCEPT_N=34;

function newUniverse(seed){
  const rng=new RNG(seed);
  const u={seed:seed,year:2026,program:{},perceived:{},trueBase:{},
           tenure:{},bad:{},history:[],rng:seed};
  u.coach={}; u.roster={};
  TEAMS.forEach(([n,e])=>{
    u.program[n]=e; u.perceived[n]=e;
    u.roster[n]=makeRoster(rng,e);
    u.trueBase[n]=rosterElo(u.roster[n])+rng.gauss(0,26);
    u.tenure[n]=1+rng.int(6); u.bad[n]=0;
    const c=newCoach(rng,e); c.t=u.tenure[n]; c.hired=false;
    u.coach[n]=c;
  });
  u._rngState=seed*7919+13;
  return u;
}

function seatHeat(u,rec,elo,t){
  // expectation is the program's own baseline; heat is falling short of it repeatedly
  const w=rec[t][0], l=rec[t][1], wp=w/Math.max(1,w+l);
    const shortfall=(u.program[t]-elo[t])/45;
  let heat=u.bad[t]*1.4 + Math.max(0,shortfall) + (wp<HOT_SEAT?1.2:0);
  if(u.coach[t]&&u.coach[t].t<=1)heat-=1.6;         // rookies get a grace year
  if(u.coach[t]&&u.coach[t].q>=30)heat-=0.6;
  return heat;
}

/* Offseason runs in two acts so the player can decide in between.
   Act 1: the coaching carousel. Act 2: rosters, recruiting, development. */
function offseasonCoaching(u,rng,rec,elo,userTeam){
  const fired=[],hires=[],poached=[];
  if(!u.coach){u.coach={};NAMES.forEach(t=>{u.coach[t]=newCoach(rng,u.program[t]);u.coach[t].hired=false})}

  NAMES.forEach(t=>{
    const wp=rec[t][0]/Math.max(1,rec[t][0]+rec[t][1]);
    u.bad[t]= wp<HOT_SEAT ? u.bad[t]+1 : 0;
    const heat=seatHeat(u,rec,elo,t);
    const change=(heat>=4.6)||(wp<0.25&&u.coach[t].t>=2);
    if(change&&rng.r()<0.82){fired.push(t);u.bad[t]=0}
  });

  const openings=fired.slice().sort((a,b)=>u.program[b]-u.program[a]);
  openings.forEach(job=>{
    if(rng.r()>0.42)return;
    const cands=NAMES.filter(t=>fired.indexOf(t)<0 && u.coach[t].q>=22
      && u.program[t] < u.program[job]-140 && u.coach[t].t>=2
      && rec[t][0]>=rec[t][1]);
    if(!cands.length)return;
    cands.sort((a,b)=>u.coach[b].q-u.coach[a].q);
    const from=cands[0], c=u.coach[from];
    poached.push({to:job,from:from,name:c.n,q:c.q});
    u.coach[job]={n:c.n,q:c.q,t:0,hired:true,arch:c.arch,rec:c.rec||0};
    u.coach[from]=newCoach(rng,u.program[from]);
    hires.push({team:from,name:u.coach[from].n,q:u.coach[from].q,reason:"replacing "+c.n});
    fired.splice(fired.indexOf(job),1);
    if(fired.indexOf(from)<0)fired.push(from);
  });

  const userOpen=fired.indexOf(userTeam)>=0;
  const openJobs=fired.slice();
  const candidates=userOpen?coachCandidates(rng,u.program[userTeam]):null;

  fired.forEach(t=>{
    if(t===userTeam)return;                       // that's your job, not an AI hire
    if(u.coach[t].hired&&u.coach[t].t===0)return;
    const old=u.coach[t].n;
    u.coach[t]=newCoach(rng,u.program[t]);
    hires.push({team:t,name:u.coach[t].n,q:u.coach[t].q,reason:"replacing "+old});
  });

  return {fired:fired,hires:hires,poached:poached,userOpen:userOpen,
          candidates:candidates,openJobs:openJobs};
}

function offseasonRosters(u,rng,healthy,elo,rec,choices){
  choices=choices||{};
  const risers=[],fallers=[],churn={};
  const ut=choices.userTeam;

  if(ut&&choices.coach){
    const c=choices.coach;
    u.coach[ut]={n:c.n,q:c.q,t:0,hired:true,arch:c.arch,rec:c.rec||0};
  }

  NAMES.forEach(t=>{
    const before=u.program[t];
    const c=u.coach[t];
    u.program[t]+=RECRUIT*(elo[t]-u.program[t])
                 +c.q*COACH_BUILD
                 +rng.gauss(0,PROG_NOISE*iscale(u.program[t]));
    u.program[t]=Math.max(P_FLOOR,Math.min(P_CEIL,u.program[t]));
    c.t++;
    const focus=(t===ut&&choices.recruit)?choices.recruit:"balanced";
    let devMod=(t===ut&&u.phil&&PHILOSOPHY[u.phil])?PHILOSOPHY[u.phil].dev:0;
    let bud=null;
    if(t===ut&&choices.budget){
      bud=applyBudget(u,t,choices.budget);
      devMod+=bud.devBonus;
      u.program[t]+=bud.facility*0.20;      // facilities lift the program itself
    }
    churn[t]=developRoster(u,t,rng,RECRUIT_FOCUS[focus],devMod,bud,choices.featured);
    u.trueBase[t]=rosterElo(u.roster[t])
                 +(c.t<=1?ROOKIE_DIP:0)
                 +rng.gauss(0,ROSTER_NOISE);
    u.perceived[t]=0.58*elo[t]+0.42*u.program[t]+rng.gauss(0,PERCEPT_N);
    const d=u.program[t]-before;
    if(d>35)risers.push([t,Math.round(d)]);
    if(d<-35)fallers.push([t,Math.round(d)]);
  });

  /* Every program signs a class each year, whether or not a freshman starts.
     Quality tracks program pull, the coach's recruiting, and your stated focus. */
  u.classAvg=u.classAvg||{};
  const incoming=[];
  NAMES.forEach(t=>{
    const c=u.coach[t];
    const focus=(t===ut&&choices.recruit)?RECRUIT_FOCUS[choices.recruit]:RECRUIT_FOCUS.balanced;
    const q=eloToRating(u.program[t])
           +c.q*0.055 +(c.rec||0)*0.55
           +(focus.r||0)*0.45 +(focus.pot||0)*0.12
           +((t===ut&&choices.budget)?applyBudgetRead(choices.budget).recruitBonus*0.6:0)
           +((t===ut&&u.pipeline)?Math.min(4.5,u.pipeline*1.5):0)
           +rng.gauss(0,2.6);
    const signed=6+Math.round(rng.range(0,3));
    incoming.push([t,q,signed]);
    // classes compound: what you sign now shapes who is available later
    const prev=u.classAvg[t]!==undefined?u.classAvg[t]:q;
    u.classAvg[t]=prev*0.62+q*0.38;
  });
  incoming.sort((a,b)=>b[1]-a[1]);
  const classes={};
  incoming.forEach(([t,av,n],i)=>{
    classes[t]={avg:Math.round(av),n:n,rank:i+1,of:incoming.length,
                l:classLabel(i+1,incoming.length)};
  });
  const early={};
  NAMES.forEach(t=>{const x=churn[t].leaving.filter(y=>y.early); if(x.length)early[t]=x});

  if(ut&&choices.phil)u.phil=choices.phil;
  u.year++;
  risers.sort((a,b)=>b[1]-a[1]); fallers.sort((a,b)=>a[1]-b[1]);
  return {risers:risers.slice(0,5),fallers:fallers.slice(0,5),
          churn:churn,classes:classes,early:early};
}

/* Force every rivalry onto the schedule by swapping opponents, then drag those
   games as late in the season as both teams are free. */
function enforceRivalries(games,rng){
  const key=(x,y)=>[x,y].sort().join("|");
  const has=new Set(games.map(g=>key(g[0],g[1])));
  RIVALS.forEach(([a,b])=>{
    if(!NAMES.includes(a)||!NAMES.includes(b))return;
    if(has.has(key(a,b)))return;
    const sameConf=CONF[a]===CONF[b];
    // find one game for each that can be re-paired
    const ga=games.map((g,i)=>i).filter(i=>
      (games[i][0]===a||games[i][1]===a) && games[i][2]===sameConf);
    const gb=games.map((g,i)=>i).filter(i=>
      (games[i][0]===b||games[i][1]===b) && games[i][2]===sameConf);
    rng.shuffle(ga); rng.shuffle(gb);
    for(const ia of ga){
      const pa=games[ia][0]===a?games[ia][1]:games[ia][0];
      if(pa===b)break;
      let done=false;
      for(const ib of gb){
        if(ib===ia)continue;
        const pb=games[ib][0]===b?games[ib][1]:games[ib][0];
        if(pb===a||pb===pa)continue;
        // leftovers must be a legal pairing too
        const legal=sameConf?(CONF[pa]===CONF[pb]):(CONF[pa]!==CONF[pb]);
        if(!legal)continue;
        if(has.has(key(pa,pb)))continue;
        has.delete(key(a,pa)); has.delete(key(b,pb));
        has.add(key(a,b)); has.add(key(pa,pb));
        const keep=[ia,ib].sort((x,y)=>y-x);
        keep.forEach(i=>games.splice(i,1));
        games.push([rng.r()<0.5?a:b, rng.r()<0.5?b:a, sameConf, false]);
        const last=games[games.length-1];
        if(last[0]===last[1]){last[0]=a;last[1]=b}
        games.push([pa,pb,sameConf,false]);
        done=true;break;
      }
      if(done)break;
    }
  });
  return games;
}

/* Nobody opens the year with two byes. Pull a later game forward to fill them. */
function fillEarlyByes(sched,busy){
  for(let w=0;w<3;w++){
    NAMES.forEach(t=>{
      if(busy[t].has(w))return;
      const cand=sched.filter(g=>(g.home===t||g.away===t)&&g.week>w+2
        &&!rivalryName(g.home,g.away));
      for(const g of cand){
        const other=g.home===t?g.away:g.home;
        if(busy[other].has(w))continue;
        const from=g.week;
        busy[t].delete(from); busy[other].delete(from);
        busy[t].add(w); busy[other].add(w);
        g.week=w; return;
      }
    });
  }
  return sched;
}

function lateenRivalries(sched,busy){
  // drag rivalry games toward the end of the year, displacing ordinary games if needed
  const late=[13,12,11,10,9];
  const riv=sched.filter(g=>rivalryName(g.home,g.away)).sort((a,b)=>{
    const ma=MARQUEE.has(rivalryName(a.home,a.away))?0:1;
    const mb=MARQUEE.has(rivalryName(b.home,b.away))?0:1;
    return ma-mb || a.week-b.week;
  });
  riv.forEach(g=>{
    for(const w of late){
      if(w<=g.week)break;
      const A=g.home,B=g.away,from=g.week;
      if(!busy[A].has(w)&&!busy[B].has(w)){
        busy[A].delete(from);busy[B].delete(from);
        busy[A].add(w);busy[B].add(w);g.week=w;return;
      }
      // try to bump the ordinary games sitting in that week
      const block=sched.filter(x=>x!==g&&x.week===w&&
        (x.home===A||x.away===A||x.home===B||x.away===B));
      if(block.length>2||block.some(x=>rivalryName(x.home,x.away)))continue;
      const ok=block.every(x=>!busy[x.home].has(from)&&!busy[x.away].has(from)
        ||x.home===A||x.away===A||x.home===B||x.away===B);
      if(!ok)continue;
      let moved=true;
      block.forEach(x=>{
        const others=[x.home,x.away].filter(t=>t!==A&&t!==B);
        if(others.some(t=>busy[t].has(from))){moved=false;return}
      });
      if(!moved)continue;
      busy[A].delete(from);busy[B].delete(from);
      block.forEach(x=>{
        [x.home,x.away].forEach(t=>{busy[t].delete(w);busy[t].add(from)});
        x.week=from;
      });
      busy[A].add(w);busy[B].add(w);g.week=w;return;
    }
  });
  return sched;
}

/* Gameplan. Variance is the real lever: an underdog wants chaos, a favourite
   wants the game to be boring. Aggression buys variance at a small cost in
   expected margin; playing safe does the reverse. */
const FEATURE_EDGE=16;   // Elo, roughly 0.75 of a point of spread

const PLANS={
  safe:      {sd:0.76, edge:-14, l:"Play it safe",  d:"Shorten the game. Fewer swings either way."},
  balanced:  {sd:1.00, edge:0,   l:"Balanced",      d:"Play your game."},
  aggressive:{sd:1.38, edge:-8,  l:"Take risks",    d:"Open it up. Higher ceiling, lower floor."}
};

const BOWLS=["Citrus Bowl","ReliaQuest Bowl","Alamo Bowl","Gator Bowl","Holiday Bowl",
"Duke's Mayo Bowl","Las Vegas Bowl","Pinstripe Bowl","Music City Bowl","Texas Bowl",
"Liberty Bowl","Sun Bowl","Pop-Tarts Bowl","Rate Bowl","Military Bowl","Independence Bowl",
"Birmingham Bowl","Armed Forces Bowl","Gasparilla Bowl","First Responder Bowl","Fenway Bowl",
"LA Bowl","New Mexico Bowl","Boca Raton Bowl","Cure Bowl","Camellia Bowl","New Orleans Bowl",
"Myrtle Beach Bowl","Frisco Bowl","Idaho Potato Bowl","Hawaii Bowl","Bahamas Bowl",
"Salute to Veterans Bowl","68 Ventures Bowl","Arizona Bowl"];

/* ============ Season state machine ============ */
class Season{
  constructor(u,seed){
    this.rng=new RNG(seed);
    this.year=u.year;
    this.elo=Object.assign({},u.perceived);
    this.preseason=Object.assign({},u.perceived);
    this.roster=u.roster?JSON.parse(JSON.stringify(u.roster)):null;
    const ph=(u.phil&&PHILOSOPHY[u.phil])?PHILOSOPHY[u.phil].elo:0;
    const tb=Object.assign({},u.trueBase);
    if(u.userTeam&&ph)tb[u.userTeam]=(tb[u.userTeam]||0)+ph;
    this.featCost=0;
    this.talent=new Talent(this.rng,tb,this.roster);
    this.poll=new Poll(Object.assign({},u.perceived));
    this.sched=buildSchedule(this.rng,u.perceived);
    this.rec={};this.confrec={};
    NAMES.forEach(t=>{this.rec[t]=[0,0];this.confrec[t]=[0,0]});
    this.step=0; this.weeks=[]; this.champs={}; this.titles=[];
    this.field=[]; this.seeds={}; this.selRec={}; this.notes={};
    this.rounds={r1:[],qf:[],sf:[],fin:[]}; this.champion=null; this.firstOut=[];
    this.bowls=[]; this.bowlPairs=null; this.userTeam=null; this.featured=null; this.plan="balanced"; this.planLog={};
  }
  get phase(){
    if(this.step<NW)return "week";
    if(this.step===NW)return "titles";
    if(this.step===NW+1)return "selection";
    if(this.step===NW+2)return "bowls";
    if(this.step===NW+3)return "r1";
    if(this.step===NW+4)return "qf";
    if(this.step===NW+5)return "sf";
    if(this.step===NW+6)return "final";
    return "done";
  }
  buttonLabel(){
    switch(this.phase){
      case "week":return `Play Week ${this.step+1}`;
      case "titles":return "Play Conference Championships";
      case "selection":return "Selection Show";
      case "bowls":return "Play Bowl Season";
      case "r1":return "Play First Round";
      case "qf":return "Play Quarterfinals";
      case "sf":return "Play Semifinals";
      case "final":return "Play National Championship";
      default:return "Enter the offseason";
    }
  }
  rankMap(){return this.poll.rankMap()}
  _resolve(a,b,neutral,extra){
    let sd=1, edge=0;
    if(this.userTeam===a||this.userTeam===b){
      const P=PLANS[this.plan]||PLANS.balanced;
      sd=P.sd;
      edge=(this.userTeam===a?1:-1)*P.edge;
      this.planLog[this.step]=this.plan;
      // a featured player gets the ball more, and it shows on Saturdays
      if(this.featured!==null&&this.featured!==undefined&&this.roster){
        const pl=this.roster[this.userTeam][this.featured];
        const hurt=this.talent.active(this.userTeam).some(x=>x.idx===this.featured);
        if(pl&&!hurt)edge+=(this.userTeam===a?1:-1)*FEATURE_EDGE;
      }
    }
    const [hp,ap,m]=simGame(this.rng,this.talent.eff(a,Math.min(this.step,NW)),
                            this.talent.eff(b,Math.min(this.step,NW)),neutral,sd,edge);
    const win=m>0?a:b, lose=m>0?b:a;
    const sh=eloUpdate(this.elo[win],this.elo[lose],Math.abs(m),(win===a)&&!neutral,neutral);
    this.elo[win]+=sh;this.elo[lose]-=sh;
    this.rec[win][0]++;this.rec[lose][1]++;
    const hf=(x,o)=>Math.max(0,Math.min(x,Math.round(x*(0.38+((x*7+o*3+hp+ap)%11)/34))));
    return Object.assign({home:a,away:b,hp:hp,ap:ap,
      hh:hf(hp,ap),ah:hf(ap,hp),neutral:neutral,
      winner:win,loser:lose,margin:Math.abs(m),shift:Math.round(sh)},extra||{});
  }
  advance(){
    this.prevRank=this.rankMap();
    const p=this.phase;
    if(p==="week")this._week();
    else if(p==="titles")this._titles();
    else if(p==="selection")this._select();
    else if(p==="bowls")this._bowls();
    else if(p==="r1")this._r1();
    else if(p==="qf")this._qf();
    else if(p==="sf")this._sf();
    else if(p==="final")this._final();
    this.step++;
  }
  _week(){
    const w=this.step, prev=this.rankMap(), out=[];
    this.sched.filter(g=>g.week===w).forEach(g=>{
      const r=this._resolve(g.home,g.away,g.neutral,{conf:g.conf});
      if(g.conf){this.confrec[r.winner][0]++;this.confrec[r.loser][1]++}
      r.hrank=prev[g.home];r.arank=prev[g.away];
      r.hrec=this.rec[g.home][0]+"-"+this.rec[g.home][1];
      r.arec=this.rec[g.away][0]+"-"+this.rec[g.away][1];
      out.push(r);
    });
    this.poll.update(out,this.elo);
    this._award(w,out);
    this.talent.advance(w+1);
    out.sort((a,b)=>Math.min(a.hrank,a.arank)-Math.min(b.hrank,b.arank));
    this.weeks.push({label:`Week ${w+1}`,date:DATES[w],games:out,
      poll:this.top25(prev),standings:this.standings(prev)});
  }
  _titles(){
    const prev=this.rankMap();
    CONF_ORDER.forEach(c=>{
      const mem=NAMES.filter(t=>CONF[t]===c).sort((x,y)=>{
        const px=this.confrec[x][0]/Math.max(1,this.confrec[x][0]+this.confrec[x][1]);
        const py=this.confrec[y][0]/Math.max(1,this.confrec[y][0]+this.confrec[y][1]);
        return py-px || this.confrec[y][0]-this.confrec[x][0] || this.elo[y]-this.elo[x];
      });
      const r=this._resolve(mem[0],mem[1],true,{conf:true,title:CONF_NAMES[c]+" Championship"});
      r.hrank=prev[mem[0]];r.arank=prev[mem[1]];
      r.hrec=this.rec[mem[0]][0]+"-"+this.rec[mem[0]][1];
      r.arec=this.rec[mem[1]][0]+"-"+this.rec[mem[1]][1];
      this.champs[c]=r.winner; this.titles.push(r);
    });
    this.poll.update(this.titles,this.elo);
    this.weeks.push({label:"Championship Week",date:"Dec 5",games:this.titles,
      poll:this.top25(prev),standings:this.weeks[this.weeks.length-1].standings});
  }
  _select(){
    const order=this.poll.order(), rk={};order.forEach((t,i)=>rk[t]=i+1);
    const f=[];
    ["SEC","B1G","B12","ACC"].forEach(c=>{f.push(this.champs[c]);
      this.notes[this.champs[c]]=CONF_NAMES[c]+" champion"});
    const g6=G6.map(c=>this.champs[c]).sort((a,b)=>rk[a]-rk[b])[0];
    f.push(g6); this.notes[g6]=CONF_NAMES[CONF[g6]]+" champion";
    if(rk["Notre Dame"]<=12&&f.indexOf("Notre Dame")<0){
      f.push("Notre Dame");this.notes["Notre Dame"]="Independent, top-12 bid"}
    for(const t of order){if(f.length>=12)break;
      if(f.indexOf(t)<0){f.push(t);if(!this.notes[t])this.notes[t]="At-large"}}
    f.sort((a,b)=>rk[a]-rk[b]);
    this.field=f; f.forEach((t,i)=>this.seeds[t]=i+1);
    this.cfpRank=rk;
    NAMES.forEach(t=>this.selRec[t]=this.rec[t][0]+"-"+this.rec[t][1]);
    this.firstOut=order.filter(t=>f.indexOf(t)<0).slice(0,4);
    this.pairBowls();
  }
  _award(w,games){
    if(!this.roster)return;
    const won={};
    games.forEach(g=>{won[g.winner]=1;won[g.loser]=0});
    NAMES.forEach(t=>{
      if(won[t]===undefined)return;                    // bye week
      const hurt=new Set(this.talent.active(t).map(e=>e.idx));
      this.roster[t].forEach((pl,i)=>{
        if(hurt.has(i)){pl.st=(pl.st||0);return}
        pl.st=(pl.st||0)+1;
        const teamBoost=won[t]?1.16:0.90;
        pl.prod=(pl.prod||0)+POS[i].aw*Math.pow(Math.max(0,pl.r-52)/10,1.30)
                *teamBoost*this.rng.range(0.72,1.28);
      });
    });
  }
  heisman(n){
    if(!this.roster)return [];
    const all=[];
    NAMES.forEach(t=>this.roster[t].forEach((pl,i)=>{
      if((pl.st||0)>=6)all.push({t:t,n:pl.n,p:pl.p,r:pl.r,c:pl.c,
        prod:pl.prod||0,rec:this.rec[t][0]+"-"+this.rec[t][1]});
    }));
    all.sort((a,b)=>b.prod-a.prod);
    return all.slice(0,n||10);
  }
  allConference(conf){
    if(!this.roster)return [];
    const out=[];
    POS.forEach((P,i)=>{
      const best=NAMES.filter(t=>CONF[t]===conf)
        .map(t=>({t:t,pl:this.roster[t][i]}))
        .sort((a,b)=>(b.pl.prod||0)-(a.pl.prod||0))[0];
      if(best)out.push({pos:P.p,team:best.t,n:best.pl.n,r:best.pl.r,c:best.pl.c});
    });
    return out;
  }
  /* Matchups are announced on Selection Day; the games come later. */
  pairBowls(){
    const rk=this.poll.rankMap();
    const pool=NAMES.filter(t=>this.rec[t][0]>=6 && this.field.indexOf(t)<0)
                    .sort((a,b)=>rk[a]-rk[b]);
    const pairs=[]; let bi=0;
    while(pool.length>=2 && bi<BOWLS.length){
      const a=pool.shift();
      let j=0;
      for(let k=0;k<Math.min(6,pool.length);k++){
        if(CONF[pool[k]]!==CONF[a]){j=k;break}
      }
      const b=pool.splice(j,1)[0];
      pairs.push({name:BOWLS[bi++],a:a,b:b,
                  ra:this.rec[a][0]+"-"+this.rec[a][1],
                  rb:this.rec[b][0]+"-"+this.rec[b][1],
                  rka:rk[a],rkb:rk[b]});
    }
    this.bowlPairs=pairs;
    this.snubbed=pool.slice();
  }

  _bowls(){
    (this.bowlPairs||[]).forEach(p=>{
      const g=this._resolve(p.a,p.b,true,{title:p.name,bowl:true});
      g.hrank=p.rka;g.arank=p.rkb;g.hrec=p.ra;g.arec=p.rb;
      this.bowls.push(g);
    });
    this.poll.update(this.bowls,this.elo);
  }

  myBowl(team){return this.bowls.find(g=>g.home===team||g.away===team)||null}
  _br(a,b,neutral,site){
    const r=this._resolve(a,b,neutral,{site:site});
    r.hseed=this.seeds[a];r.aseed=this.seeds[b];
    r.hrec=this.rec[a][0]+"-"+this.rec[a][1];
    r.arec=this.rec[b][0]+"-"+this.rec[b][1];
    return r;
  }
  _r1(){
    [[5,12],[6,11],[7,10],[8,9]].forEach(([h,l])=>
      this.rounds.r1.push(this._br(this.field[h-1],this.field[l-1],false,
        "at "+this.field[h-1])));
    this.poll.update(this.rounds.r1,this.elo);
  }
  _qf(){
    const w={};this.rounds.r1.forEach(g=>{w[Math.min(g.hseed,g.aseed)]=g.winner});
    [["Rose Bowl",1,8],["Sugar Bowl",2,7],["Fiesta Bowl",3,6],["Peach Bowl",4,5]]
      .forEach(([bowl,top,key])=>{
        this.rounds.qf.push(this._br(this.field[top-1],w[key],true,bowl))});
    this.poll.update(this.rounds.qf,this.elo);
  }
  _sf(){
    const q=this.rounds.qf.map(g=>g.winner);
    const s=q.slice().sort((a,b)=>this.seeds[a]-this.seeds[b]);
    this.rounds.sf.push(this._br(s[0],s[3],true,"Cotton Bowl"));
    this.rounds.sf.push(this._br(s[1],s[2],true,"Orange Bowl"));
    this.poll.update(this.rounds.sf,this.elo);
  }
  _final(){
    const f=this.rounds.sf.map(g=>g.winner)
      .sort((a,b)=>this.seeds[a]-this.seeds[b]);
    const g=this._br(f[0],f[1],true,"Allegiant Stadium, Las Vegas");
    this.rounds.fin.push(g); this.champion=g.winner;
    this.poll.update([g],this.elo);
  }
  top25(prev){
    return this.poll.order().slice(0,25).map((t,i)=>({
      rank:i+1,team:t,conf:CONF[t],rec:this.rec[t][0]+"-"+this.rec[t][1],
      prev:prev?prev[t]:0,delta:prev&&prev[t]?prev[t]-(i+1):null}));
  }
  standings(prev){
    const out={};
    CONF_ORDER.forEach(c=>{
      out[c]=NAMES.filter(t=>CONF[t]===c).sort((x,y)=>{
        const px=this.confrec[x][0]/Math.max(1,this.confrec[x][0]+this.confrec[x][1]);
        const py=this.confrec[y][0]/Math.max(1,this.confrec[y][0]+this.confrec[y][1]);
        return py-px||this.confrec[y][0]-this.confrec[x][0]||this.elo[y]-this.elo[x];
      }).map(t=>({team:t,cr:this.confrec[t][0]+"-"+this.confrec[t][1],
                  rec:this.rec[t][0]+"-"+this.rec[t][1],rank:prev?prev[t]:0}));
    });
    return out;
  }
  healthy(){const h={};NAMES.forEach(t=>h[t]=this.talent.base[t]+this.talent.slope[t]*NW);return h}
  myGame(team,wk){
    const W=this.weeks[wk]; if(!W)return null;
    return W.games.find(g=>g.home===team||g.away===team)||null;
  }
  nextGame(team){
    const g=this.sched.find(g=>g.week===this.step&&(g.home===team||g.away===team));
    return g||null;
  }
  /* What the user's team faces next once the regular season is over.
     Every one of these is determined the moment the previous round ends. */
  postNext(team){
    const p=this.phase;
    if(p==="titles"){
      const c=CONF[team]; if(c==="IND")return null;
      const mem=NAMES.filter(x=>CONF[x]===c).sort((x,y)=>{
        const px=this.confrec[x][0]/Math.max(1,this.confrec[x][0]+this.confrec[x][1]);
        const py=this.confrec[y][0]/Math.max(1,this.confrec[y][0]+this.confrec[y][1]);
        return py-px||this.confrec[y][0]-this.confrec[x][0]||this.elo[y]-this.elo[x];
      });
      if(mem[0]===team||mem[1]===team)
        return {label:CONF_NAMES[c]+" Championship",
                opp:mem[0]===team?mem[1]:mem[0],neutral:true};
      return null;
    }
    if(p==="bowls"){
      const pr=(this.bowlPairs||[]).find(x=>x.a===team||x.b===team);
      if(!pr)return null;
      return {label:pr.name,opp:pr.a===team?pr.b:pr.a,neutral:true};
    }
    const sd=this.seeds[team];
    if(!sd)return null;
    if(p==="r1"){
      if(sd<=4)return null;
      const opp={5:12,12:5,6:11,11:6,7:10,10:7,8:9,9:8}[sd];
      return {label:"First Round",opp:this.field[opp-1],
              neutral:false,home:sd<opp};
    }
    if(p==="qf"){
      const w={}; this.rounds.r1.forEach(g=>w[Math.min(g.hseed,g.aseed)]=g.winner);
      const map=[[1,8,"Rose Bowl"],[2,7,"Sugar Bowl"],[3,6,"Fiesta Bowl"],[4,5,"Peach Bowl"]];
      for(const m of map){
        const a=this.field[m[0]-1], b=w[m[1]];
        if(a===team&&b)return {label:m[2],opp:b,neutral:true};
        if(b===team)return {label:m[2],opp:a,neutral:true};
      }
      return null;
    }
    if(p==="sf"){
      const q=this.rounds.qf.map(g=>g.winner);
      if(q.indexOf(team)<0)return null;
      const o=q.slice().sort((a,b)=>this.seeds[a]-this.seeds[b]);
      if(team===o[0])return {label:"Cotton Bowl",opp:o[3],neutral:true};
      if(team===o[3])return {label:"Cotton Bowl",opp:o[0],neutral:true};
      if(team===o[1])return {label:"Orange Bowl",opp:o[2],neutral:true};
      if(team===o[2])return {label:"Orange Bowl",opp:o[1],neutral:true};
      return null;
    }
    if(p==="final"){
      const f=this.rounds.sf.map(g=>g.winner);
      if(f.indexOf(team)<0)return null;
      return {label:"National Championship",opp:f.find(x=>x!==team),neutral:true};
    }
    return null;
  }
  _br(a,b,neutral,site){
    const r=this._resolve(a,b,neutral,{site:site});
    r.hseed=this.seeds[a];r.aseed=this.seeds[b];
    r.hrec=this.rec[a][0]+"-"+this.rec[a][1];
    r.arec=this.rec[b][0]+"-"+this.rec[b][1];
    return r;
  }
  _r1(){
    [[5,12],[6,11],[7,10],[8,9]].forEach(([h,l])=>
      this.rounds.r1.push(this._br(this.field[h-1],this.field[l-1],false,
        "at "+this.field[h-1])));
    this.poll.update(this.rounds.r1,this.elo);
  }
  _qf(){
    const w={};this.rounds.r1.forEach(g=>{w[Math.min(g.hseed,g.aseed)]=g.winner});
    [["Rose Bowl",1,8],["Sugar Bowl",2,7],["Fiesta Bowl",3,6],["Peach Bowl",4,5]]
      .forEach(([bowl,top,key])=>{
        this.rounds.qf.push(this._br(this.field[top-1],w[key],true,bowl))});
    this.poll.update(this.rounds.qf,this.elo);
  }
  _sf(){
    const q=this.rounds.qf.map(g=>g.winner);
    const s=q.slice().sort((a,b)=>this.seeds[a]-this.seeds[b]);
    this.rounds.sf.push(this._br(s[0],s[3],true,"Cotton Bowl"));
    this.rounds.sf.push(this._br(s[1],s[2],true,"Orange Bowl"));
    this.poll.update(this.rounds.sf,this.elo);
  }
  _final(){
    const f=this.rounds.sf.map(g=>g.winner)
      .sort((a,b)=>this.seeds[a]-this.seeds[b]);
    const g=this._br(f[0],f[1],true,"Allegiant Stadium, Las Vegas");
    this.rounds.fin.push(g); this.champion=g.winner;
    this.poll.update([g],this.elo);
  }
  top25(prev){
    return this.poll.order().slice(0,25).map((t,i)=>({
      rank:i+1,team:t,conf:CONF[t],rec:this.rec[t][0]+"-"+this.rec[t][1],
      prev:prev?prev[t]:0,delta:prev&&prev[t]?prev[t]-(i+1):null}));
  }
  standings(prev){
    const out={};
    CONF_ORDER.forEach(c=>{
      out[c]=NAMES.filter(t=>CONF[t]===c).sort((x,y)=>{
        const px=this.confrec[x][0]/Math.max(1,this.confrec[x][0]+this.confrec[x][1]);
        const py=this.confrec[y][0]/Math.max(1,this.confrec[y][0]+this.confrec[y][1]);
        return py-px||this.confrec[y][0]-this.confrec[x][0]||this.elo[y]-this.elo[x];
      }).map(t=>({team:t,cr:this.confrec[t][0]+"-"+this.confrec[t][1],
                  rec:this.rec[t][0]+"-"+this.rec[t][1],rank:prev?prev[t]:0}));
    });
    return out;
  }
  healthy(){const h={};NAMES.forEach(t=>h[t]=this.talent.base[t]+this.talent.slope[t]*NW);return h}
  myGame(team,wk){
    const W=this.weeks[wk]; if(!W)return null;
    return W.games.find(g=>g.home===team||g.away===team)||null;
  }
  nextGame(team){
    const g=this.sched.find(g=>g.week===this.step&&(g.home===team||g.away===team));
    return g||null;
  }
  /* What the user's team faces next once the regular season is over. */
}

const KEY="cfb-dynasty-v1";
let S={myTeam:null,uStart:null,seasonSeed:0,steps:0,history:[],seed:0,plans:{}};
let plan="balanced", reveal=null, revealTimer=null;
let wide=false;
function isWide(){try{return window.innerWidth>=1024}catch(e){return false}}
let U=null, SEA=null, view="team", flash=null;

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const el=id=>document.getElementById(id);

function snap(u){return JSON.parse(JSON.stringify(u))}

function rebuild(){
  U=snap(S.uStart);
  U.userTeam=S.myTeam;
  SEA=new Season(U,S.seasonSeed);
  SEA.userTeam=S.myTeam;
  SEA.featured=(S.featured===undefined?null:S.featured);
  for(let i=0;i<S.steps;i++){
    SEA.plan=(S.plans&&S.plans[i])||"balanced";
    SEA.advance();
  }
  SEA.plan=plan;
}

async function save(){
  try{await window.storage.set(KEY,JSON.stringify(S))}catch(e){}
}
async function load(){

}

const COACH_FIRST=["Ray","Mack","Dabo","Kirby","Lane","Deion","Marcus","Hugh","Bronco",
"Kalani","Sonny","Jimbo","Willie","Herm","Brent","Curt","Vic","Sherrone","Fran","Bo"];
function newDynasty(team,seed,coachName){
  const rng0=new RNG(seed^0x5f3a);
  S={myTeam:team,seed:seed,uStart:null,seasonSeed:0,steps:0,history:[],origProgram:null,
     career:{name:coachName||(rng0.pick(COACH_FIRST)+" "+rng0.pick(LAST)),
             rep:0,w:0,l:0,titles:0,confs:0,fired:0,
             stops:[{team:team,from:2026,w:0,l:0,titles:0}]}};
  const u=newUniverse(seed);
  u.coach[team]={n:S.career.name,q:0,t:0,hired:true,you:true};
  S.uStart=snap(u); S.origProgram=snap(u.program);
  S.seasonSeed=(seed*2654435761)>>>0 % 2147483647;
  rebuild(); S.expNow=expectations(); save(); view="team"; render();
}

/* ============ advance ============ */
function doAdvance(){
  if(SEA.phase==="done"){ openOffseason(); return; }
  const before=SEA.step;
  const ph=SEA.phase;
  S.plans=S.plans||{}; S.plans[before]=plan;
  SEA.plan=plan;
  SEA.advance(); S.steps++;
  plan="balanced";
  if(ph==="selection")postTab="field";
  else if(ph==="bowls")postTab="bowls";
  else if(ph==="r1"||ph==="qf"||ph==="sf"||ph==="final")postTab="bracket";
  flash={type:SEA.phase==="week"||before<NW?"week":"post",step:before};
  const g=heroGame();
  if(g&&!prefersReduced()){
    reveal="half";
    if(revealTimer)clearTimeout(revealTimer);
    revealTimer=setTimeout(()=>{reveal="final";render()},1500);
  }else reveal=null;
  save(); render();
}

function openOffseason(){
  if(SEA.phase!=="done")return;
  const rng=new RNG((S.seasonSeed^(U.year*7919))>>>0);
  const A=offseasonCoaching(U,rng,SEA.rec,SEA.elo,S.myTeam);
  const my=S.myTeam, C=S.career;
  const exp=S.expNow||expectations();
  const titles={natl:SEA.champion===my,playoff:SEA.field.indexOf(my)>=0,
                conf:Object.keys(SEA.champs).some(c=>SEA.champs[c]===my)};
  C.rep=C.rep*0.94;                       // reputations fade, good and bad
  C.rep+=repDelta(SEA.rec[my][0],SEA.rec[my][1],exp.w,U.program[my],titles);
  C.rep=Math.max(-48,Math.min(80,C.rep));
  C.w+=SEA.rec[my][0]; C.l+=SEA.rec[my][1];
  if(titles.natl)C.titles++; if(titles.conf)C.confs++;
  const st=C.stops[C.stops.length-1];
  st.w+=SEA.rec[my][0]; st.l+=SEA.rec[my][1];
  if(titles.natl)st.titles++;
  st.to=SEA.year;
  const jobs=A.userOpen?jobMarket(U,rng,C.rep,A.openJobs,my):[];
  const poach=A.userOpen?[]:poachOffers(U,rng,C.rep,A.openJobs,my);
  const pool=budgetPool(U,my,SEA.rec[my][0]);
  S.off={act:A,jobs:jobs,poach:poach,move:null,pool:pool,
    picks:{recruit:"balanced",phil:(U.phil||"balanced"),
      budget:{recruit:Math.ceil(pool/4),develop:Math.floor(pool/4),
              facility:Math.floor(pool/4),retention:pool-Math.ceil(pool/4)-2*Math.floor(pool/4)}},
    rngA:[rng.a,rng.sp]};
  flash=null; save(); render();
}

function budgetLeft(){
  if(!S.off)return 0;
  const B=S.off.picks.budget;
  return S.off.pool-BUCKETS.reduce((s,b)=>s+(B[b.k]||0),0);
}

function commitOffseason(){
  const P=S.off.picks, A=S.off.act, C=S.career;
  if(A.userOpen&&S.off.move===null)return;
  if(budgetLeft()!==0)return;
  const rng=new RNG(0); rng.a=S.off.rngA[0]; rng.sp=S.off.rngA[1];
  const oldTeam=S.myTeam;
  let dest=S.off.move;
  if(dest==="retire"){S.retired=true;save();render();return}
  if(dest&&dest!==oldTeam){
    // the program you leave hires someone else; you take the new job
    U.coach[oldTeam]=newCoach(rng,U.program[oldTeam]);
    C.fired+=(A.userOpen?1:0);
    C.stops.push({team:dest,from:SEA.year+1,w:0,l:0,titles:0});
    S.myTeam=dest; U.userTeam=dest; U.phil="balanced";
    U.coach[dest]={n:C.name,q:0,t:0,hired:true,you:true};
  }
  endSeason(rng,{userTeam:S.myTeam,coach:null,
    recruit:P.recruit, phil:P.phil, budget:P.budget,
    featured:(S.featured!==undefined?S.featured:null)}, A);
  S.featured=null;
}

function endSeason(rng,choices,act){
  if(SEA.phase!=="done"||!rng||!act)return;
  const my=S.myTeam, rk=SEA.poll.rankMap();
  const made=SEA.field.indexOf(my)>=0;
  let result="Missed the playoff";
  const bowl=SEA.myBowl(my);
  if(bowl)result=(bowl.winner===my?"Won the ":"Lost the ")+bowl.title;
  else if(SEA.field.indexOf(my)<0)result=SEA.rec[my][0]>=6?"Bowl snub":"No bowl game";
  if(SEA.champion===my)result="NATIONAL CHAMPIONS";
  else if(made){
    const lost=[].concat(SEA.rounds.fin,SEA.rounds.sf,SEA.rounds.qf,SEA.rounds.r1)
      .find(g=>g.loser===my);
    const R={"National Championship":"Lost the national title game"};
    result=lost?("Eliminated in the "+(SEA.rounds.fin.indexOf(lost)>=0?"national title game":
      SEA.rounds.sf.indexOf(lost)>=0?"semifinals":
      SEA.rounds.qf.indexOf(lost)>=0?"quarterfinals":"first round")):"Made the playoff";
  }
  const teamRows={};
  NAMES.forEach(t=>{teamRows[t]=[SEA.rec[t][0],SEA.rec[t][1],rk[t]]});
  const confChamps={}; Object.keys(SEA.champs).forEach(c=>confChamps[c]=SEA.champs[c]);
  const bowlOf={}; SEA.bowls.forEach(g=>{
    bowlOf[g.winner]=["W",g.title]; bowlOf[g.loser]=["L",g.title]});
  const post={}, pnote={};
  const bump=(t,won)=>{post[t]=post[t]||[0,0]; post[t][won?0:1]++};
  SEA.bowls.forEach(g=>{
    bump(g.winner,true); bump(g.loser,false);
    pnote[g.winner]="Won the "+g.title; pnote[g.loser]="Lost the "+g.title;});
  [["first round",SEA.rounds.r1],["quarterfinals",SEA.rounds.qf],
   ["semifinals",SEA.rounds.sf],["national title game",SEA.rounds.fin]]
   .forEach(([nm,gs])=>gs.forEach(g=>{
     bump(g.winner,true); bump(g.loser,false);
     pnote[g.loser]="Playoff \u2014 lost in the "+nm;}));
  if(SEA.champion)pnote[SEA.champion]="National champions";
  const cfpOf={}; SEA.field.forEach(t=>cfpOf[t]=SEA.seeds[t]);
  if(U.coach[S.myTeam])U.coach[S.myTeam].q=Math.round(Math.max(-40,Math.min(60,S.career.rep*0.62)));
  const B=offseasonRosters(U,rng,SEA.healthy(),SEA.elo,SEA.rec,choices);
  const off=Object.assign({},act,B);
  const exp=S.expNow||expectations();
  const gr=seasonGrade(SEA.rec[my][0],SEA.rec[my][1],result,exp);
  const miles=milestones(SEA.rec[my][0],SEA.rec[my][1],result,rk[my]);
  S.history.push({grade:gr.g,gradeLine:gr.l,miles:miles,exp:exp.t,
    year:SEA.year,rec:SEA.rec[my][0]+"-"+SEA.rec[my][1],
    rank:rk[my],champion:SEA.champion,result:result,
    program:Math.round(U.program[my]),
    fired:off.fired.indexOf(my)>=0, firedList:off.fired,
    confChamp:Object.keys(SEA.champs).some(c=>SEA.champs[c]===my),
    nFired:off.fired.length,
    teams:teamRows, confChamps:confChamps, bowls:bowlOf, cfp:cfpOf,
    post:post, pnote:pnote,
    heis:(SEA.heisman(3)||[]).map(x=>({n:x.n,p:x.p,t:x.t,r:x.r,c:x.c})),
    classes:off.classes||{}, early:off.early||{},
    coachNow:(U.coach&&U.coach[my])?{n:U.coach[my].n,q:U.coach[my].q,t:U.coach[my].t}:null,
    hires:(off.hires||[]).slice(0,60), poached:(off.poached||[]).slice(0,12),
    top10:SEA.poll.order().slice(0,10)});
  S.uStart=snap(U); S.off=null; S.plans={};
  S.seasonSeed=(S.seasonSeed*1103515245+12345)>>>0;
  S.steps=0; rebuild(); S.expNow=expectations();
  flash={type:"offseason"}; view="team"; save(); render();
}

/* ============ rendering ============ */
function rkTag(r){return r&&r<=25?`<span class="rk">${r}</span>`:""}

function gameLine(g,mine){
  const hw=g.winner===g.home;
  const best=Math.min(g.hrank||999,g.arank||999);
  const ups=g.hrank&&g.arank?(hw?g.hrank>g.arank:g.arank>g.hrank):false;
  const cls="game"+(best<=25?" marquee":"")+(ups&&best<=25?" upset":"")+(mine?" mine":"");
  const side=(t,s,r,w,seed,rec)=>`<div class="side ${w?'w':''}">${
    seed?`<span class="sdchip">${seed}</span>`:rkTag(r)}
    <span class="nm">${TL(t)}</span>${rec?`<span class="grec">${rec}</span>`:""}
    <span class="sc">${s}</span></div>`;
  const chips=[];
  if(g.title)chips.push(`<span class="chip ttl">${esc(g.title)}</span>`);
  if(g.site)chips.push(`<span class="chip ttl">${esc(g.site)}</span>`);
  if(ups&&best<=25)chips.push(`<span class="chip up">Upset</span>`);
  if(g.neutral&&!g.site&&!g.title)chips.push(`<span class="chip">Neutral</span>`);
  if(g.margin<=3)chips.push(`<span class="chip">One score</span>`);
  const rv=rivalryName(g.home,g.away);
  if(rv)chips.push(`<span class="chip riv">${esc(rv)}</span>`);
  return `<article class="${cls}"><div class="edge" style="${mine?`background:${teamInk(g.winner)}`:""}"></div><div class="gbody">
    ${side(g.away,g.ap,g.arank,!hw,g.aseed,g.arec)}${side(g.home,g.hp,g.hrank,hw,g.hseed,g.hrec)}
    ${chips.length?`<div class="meta">${chips.join("")}</div>`:""}</div></article>`;
}

function prefersReduced(){
  try{return window.matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}
}

function liveRec(team){
  const w=SEA.rec[team][0], l=SEA.rec[team][1];
  if(reveal!=="half")return [w,l];
  const g=heroGame();
  if(!g||(g.home!==team&&g.away!==team))return [w,l];
  return g.winner===team?[w-1,l]:[w,l-1];
}

function liveConf(team){
  const w=SEA.confrec[team][0], l=SEA.confrec[team][1];
  if(reveal!=="half")return [w,l];
  const g=heroGame();
  if(!g||!g.conf||(g.home!==team&&g.away!==team))return [w,l];
  return g.winner===team?[w-1,l]:[w,l-1];
}

function heroGame(){
  const my=S.myTeam;
  if(flash&&flash.type==="week"){
    const W=SEA.weeks[flash.step];
    if(W)return W.games.find(x=>x.home===my||x.away===my)||null;
  }else if(flash&&flash.type==="post"){
    const pools=[SEA.rounds.fin,SEA.rounds.sf,SEA.rounds.qf,SEA.rounds.r1,SEA.bowls,SEA.titles];
    for(const p of pools){const f=p.find(x=>x.home===my||x.away===my);if(f)return f}
  }
  return null;
}

function heroResult(){
  const my=S.myTeam;
  let g=null,label="";
  if(flash&&flash.type==="week"){
    const W=SEA.weeks[flash.step];
    if(W){g=W.games.find(x=>x.home===my||x.away===my);label=W.label}
  }else if(flash&&flash.type==="post"){
    const pools=[SEA.rounds.fin,SEA.rounds.sf,SEA.rounds.qf,SEA.rounds.r1,SEA.bowls,SEA.titles];
    for(const p of pools){const f=p.find(x=>x.home===my||x.away===my);if(f){g=f;break}}
  }
  if(!g)return "";
  const won=g.winner===my;
  const opp=g.home===my?g.away:g.home;
  const half=(reveal==="half"&&g.hh!==undefined);
  const ms=half?(g.home===my?g.hh:g.ah):(g.home===my?g.hp:g.ap);
  const os=half?(g.home===my?g.ah:g.hh):(g.home===my?g.ap:g.hp);
  const cur=SEA.poll.rankMap(), pv=SEA.prevRank;
  let move="";
  if(pv&&pv[my]){
    const d=pv[my]-cur[my];
    if(cur[my]<=25&&pv[my]>25)move=`<div class="hmove up">Entered the poll at #${cur[my]}</div>`;
    else if(cur[my]>25&&pv[my]<=25)move=`<div class="hmove dn">Dropped out of the poll</div>`;
    else if(cur[my]<=25&&d>0)move=`<div class="hmove up">&#9650; Up ${d} to #${cur[my]}</div>`;
    else if(cur[my]<=25&&d<0)move=`<div class="hmove dn">&#9660; Down ${-d} to #${cur[my]}</div>`;
    else if(cur[my]<=25)move=`<div class="hmove flat">Holding at #${cur[my]}</div>`;
  }
  if(half)return `<div class="hero half">
    <div class="hlabel"><span class="live"></span>HALFTIME${label?" &middot; "+esc(label):""}</div>
    <div class="hscore">${ms}<span>&ndash;</span>${os}</div>
    <div class="hopp">${g.home===my?"vs":"at"} ${esc(opp)}</div>
    <div class="hfoot">Second half under way&hellip;</div></div>`;
  return `<div class="hero ${won?'win':'loss'}" style="--tc:${teamInk(my)}">
    <div class="hlabel">FINAL &middot; ${won?"WIN":"LOSS"}${label?" &middot; "+esc(label):""}</div>
    <div class="hscore">${ms}<span>&ndash;</span>${os}</div>
    <div class="hopp">${g.home===my?"vs":"at"} ${esc(opp)}</div>${move}</div>`;
}


/* ============ what's at stake ============ */
function winProb(me,opp,atHome,neutral){
  const hfa=neutral?0:(atHome?HFA:-HFA);
  return 1/(1+Math.pow(10,-((SEA.elo[me]+hfa-SEA.elo[opp])/400)));
}

function confPosition(t){
  const c=CONF[t];
  if(c==="IND")return null;
  const mem=NAMES.filter(x=>CONF[x]===c).sort((x,y)=>{
    const px=SEA.confrec[x][0]/Math.max(1,SEA.confrec[x][0]+SEA.confrec[x][1]);
    const py=SEA.confrec[y][0]/Math.max(1,SEA.confrec[y][0]+SEA.confrec[y][1]);
    return py-px||SEA.confrec[y][0]-SEA.confrec[x][0]||SEA.elo[y]-SEA.elo[x];
  });
  return {pos:mem.indexOf(t)+1,of:mem.length,conf:CONF_NAMES[c]};
}

function projectedField(){
  const rk=SEA.poll.rankMap(), order=SEA.poll.order(), leaders={};
  CONF_ORDER.forEach(c=>{
    const mem=NAMES.filter(t=>CONF[t]===c).sort((x,y)=>{
      const px=SEA.confrec[x][0]/Math.max(1,SEA.confrec[x][0]+SEA.confrec[x][1]);
      const py=SEA.confrec[y][0]/Math.max(1,SEA.confrec[y][0]+SEA.confrec[y][1]);
      return py-px||SEA.elo[y]-SEA.elo[x];
    });
    leaders[c]=mem[0];
  });
  const f=["SEC","B1G","B12","ACC"].map(c=>leaders[c]);
  f.push(G6.map(c=>leaders[c]).sort((x,y)=>rk[x]-rk[y])[0]);
  if(rk["Notre Dame"]<=12&&f.indexOf("Notre Dame")<0)f.push("Notre Dame");
  for(const t of order){if(f.length>=12)break; if(f.indexOf(t)<0)f.push(t)}
  return f.sort((x,y)=>rk[x]-rk[y]);
}

function streakOf(t){
  let n=0,won=null;
  for(let i=SEA.weeks.length-1;i>=0;i--){
    const g=SEA.weeks[i].games.find(x=>x.home===t||x.away===t);
    if(!g)continue;
    const w=g.winner===t;
    if(won===null)won=w;
    if(w!==won)break;
    n++;
  }
  return {n:n,won:won};
}

/* Returns the single most interesting thing riding on this game. */
function stakesFor(ng){
  const my=S.myTeam, opp=ng.home===my?ng.away:ng.home;
  const rk=SEA.poll.rankMap();
  const wk=SEA.step, left=NW-wk;
  const rec=SEA.rec[my], w=rec[0], l=rec[1];
  const cp=confPosition(my);
  const riv=rivalryName(my,opp);
  const out=[];

  if(riv)out.push({p:100,tag:"RIVALRY",
    l:`${riv[0].toUpperCase()+riv.slice(1)} is on the line.`});

  if(l===0&&w>=4)out.push({p:90,tag:"UNBEATEN",
    l:`${w}-0 and counting. A perfect season is still live.`});

  if(wk>=8&&cp){
    if(cp.pos<=2&&left<=4)out.push({p:88,tag:"TITLE RACE",
      l:`You sit ${cp.pos===1?"first":"second"} in the ${cp.conf} with ${left} to play &mdash; the championship game is right there.`});
    else if(cp.pos===3&&left<=4)out.push({p:80,tag:"TITLE RACE",
      l:`Third in the ${cp.conf}, one spot out of the championship game.`});
  }

  if(wk>=7){
    const f=projectedField();
    const idx=f.indexOf(my);
    if(idx>=0)out.push({p:85,tag:"PLAYOFF",
      l:`You'd be the No. ${idx+1} seed if the season ended today.${idx<4?" That's a first-round bye.":""}`});
    else{
      const order=SEA.poll.order();
      const outs=order.filter(t=>f.indexOf(t)<0);
      const spot=outs.indexOf(my);
      if(spot>=0&&spot<6)out.push({p:86,tag:"BUBBLE",
        l:`${spot===0?"First team out":"Number "+(spot+1)+" out"} of the projected field. You need this one.`});
    }
  }

  if(rk[opp]<=10)out.push({p:78,tag:"MARQUEE",
    l:`A win over No. ${rk[opp]} ${opp} is the kind of result that decides seeding.`});
  else if(rk[opp]<=25)out.push({p:62,tag:"RANKED",
    l:`No. ${rk[opp]} ${opp} is a résumé game either way.`});

  const st=streakOf(my);
  if(!st.won&&st.n>=3)out.push({p:74,tag:"SLIDE",
    l:`${st.n} straight losses. The seat under your coach is getting warm.`});
  else if(st.won&&st.n>=5)out.push({p:58,tag:"STREAK",
    l:`${st.n} in a row. Nobody wants to be the one who ends it.`});

  if(w===5&&left<=5)out.push({p:70,tag:"BOWL",
    l:`Win and you're bowl eligible.`});
  if(l>=6)out.push({p:40,tag:"SPOILER",
    l:`Nothing left but pride and a chance to wreck somebody's season.`});

  if(!out.length)out.push({p:0,tag:"WEEK "+(wk+1),
    l:`${ng.home===my?"Home":"On the road"} against ${opp}. Take care of business.`});

  out.sort((x,y)=>y.p-x.p);
  return out.slice(0,2);
}

function seatBadge(){
  const my=S.myTeam;
  if(!U||!U.coach)return "";
  const w=SEA.rec[my][0], l=SEA.rec[my][1];
  if(w+l<4)return `<span class="seat cool">Settled</span>`;
  const wp=w/(w+l);
  const short=(U.program[my]-SEA.elo[my])/45;
  let heat=(U.bad[my]||0)*1.4+Math.max(0,short)+(wp<0.42?1.2:0);
  if(U.coach[my].t<=1)heat-=1.6;
  if(U.coach[my].q>=30)heat-=0.6;
  if(heat>=3.6)return `<span class="seat hot">HOT SEAT</span>`;
  if(heat>=2.2)return `<span class="seat warm">Under pressure</span>`;
  return `<span class="seat cool">Secure</span>`;
}

let teamTab="overview";

function starBar(r){
  const pct=Math.max(0,Math.min(100,(r-38)/(99-38)*100));
  return `<span class="rbar"><i style="width:${pct}%"></i></span>`;

   ["Semifinal",SEA.rounds.sf],["National Championship",SEA.rounds.fin]]
   .forEach(([n,gs])=>gs.forEach(g=>{if(g.home===team||g.away===team)post.push([g,n])}));
