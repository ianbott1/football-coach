<style>
:root{--ink:#10131C;--panel:#191E2C;--panel2:#141928;--line:#2A3145;--bone:#E9E5DA;
 --muted:#7F89A0;--sodium:#F4A63A;--flag:#E45B4E;--turf:#46B583;--vote:#8B9FE8;
 --cond:'Barlow Condensed',Impact,sans-serif;--body:'Barlow',system-ui,sans-serif;
 --mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--bone);font-family:var(--body);
 -webkit-font-smoothing:antialiased;padding-bottom:176px}
#app{max-width:760px;margin:0 auto}
.mast{padding:26px 16px 16px;border-bottom:1px solid var(--line)}

.topbar{display:flex;justify-content:space-between;align-items:center;padding:11px 16px 9px}

.tb-rk{color:var(--sodium);margin-left:6px}
.tabs{display:flex;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}

.tab[aria-selected="true"]{color:var(--bone);border-bottom-color:var(--sodium)}

 outline-offset:2px}

  {p:"QB",  w:0.27, drop:21, hz:0.14},
  {p:"RB",  w:0.07, drop:10, hz:0.13},
  {p:"WR",  w:0.09, drop:11, hz:0.11},
  {p:"WR2", w:0.06, drop:9,  hz:0.09},
  {p:"OT",  w:0.12, drop:12, hz:0.13},
  {p:"EDGE",w:0.11, drop:13, hz:0.10},
  {p:"DT",  w:0.08, drop:10, hz:0.09},
  {p:"LB",  w:0.08, drop:10, hz:0.08},
  {p:"CB",  w:0.07, drop:11, hz:0.08},
  {p:"S",   w:0.05, drop:9,  hz:0.05},
];
function pickInjuredPos(rng){
  let x=rng.r(), acc=0;
  for(let i=0;i<POS.length;i++){acc+=POS[i].hz; if(x<acc)return i}
  return POS.length-1;
}

/* rating <-> Elo: teamRating 45 -> 1150, 82 -> 2050 */
const R_SLOPE=24.3, R_INT=56;
const ratingToElo=r=>R_INT+R_SLOPE*r;
const eloToRating=e=>(e-R_INT)/R_SLOPE;

function playerName(rng){return rng.pick(PNAMES_F)+" "+rng.pick(PNAMES_L)}

/* Twenty players: indices 0-9 start, 10-19 are the backup at the same spot. */
const BK=i=>i+POS.length;

function teamRating(roster){
  let s=0; POS.forEach((P,i)=>{s+=P.w*roster[i].r});
  return s;                                 // starters only
}
function rosterElo(roster){return ratingToElo(teamRating(roster))}

/* Elo cost of losing a starter: the actual drop-off to his backup. */
function injuryCost(roster,idx){
  const P=POS[idx];
  if(!roster||!roster[BK(idx)])return -P.w*P.drop*R_SLOPE;
  const gap=Math.max(3,roster[idx].r-roster[BK(idx)].r);
  return -P.w*gap*R_SLOPE;
}

/* ============ box scores ============ */
/* Stat lines are derived from rating, game flow and scoring, so the numbers a
   player puts up are consistent with how good he is and how the game went. */

const STAT_KEYS={
  QB  :["cmp","att","pyd","ptd","int"],
  RB  :["car","ryd","rtd"],
  WR  :["rec","cyd","ctd"],
  WR2 :["rec","cyd","ctd"],
  OT  :["pan","ska"],
  EDGE:["tkl","sck","tfl"],
  DT  :["tkl","sck","tfl"],
  LB  :["tkl","tfl","pd"],
  CB  :["tkl","pd","ints"],
  S   :["tkl","pd","ints"]
};

function blankStats(pos){
  const o={g:0};
  (STAT_KEYS[pos]||[]).forEach(k=>o[k]=0);
  return o;
}

/* One game's production for one starter. */
function gameStats(rng,pl,posIdx,forPts,oppPts,won){
  const pos=POS[posIdx].p;
  const q=(pl.r-58)/22;                 // roughly -1.3 (poor) .. +1.8 (elite)
  const s={};
  const R=(a,b)=>a+rng.r()*(b-a);
  const pass=forPts*0.60, run=forPts*0.40;

  if(pos==="QB"){
    s.att=Math.max(8,Math.round(R(24,38)+(won?-2:4)));
    const pct=Math.max(0.38,Math.min(0.78,0.545+q*0.055+rng.gauss(0,0.05)));
    s.cmp=Math.round(s.att*pct);
    s.pyd=Math.max(0,Math.round(s.cmp*(10.4+q*1.5+rng.gauss(0,1.4))));
    s.ptd=Math.max(0,Math.round(pass/7*R(0.55,1.0)+ (q>1?rng.r():0)));
    s.int=Math.max(0,Math.round(R(0,1.9)-q*0.55+(won?-0.2:0.35)));
  } else if(pos==="RB"){
    s.car=Math.max(4,Math.round(R(13,23)+(won?4:-3)));
    s.ryd=Math.max(-5,Math.round(s.car*(3.9+q*0.85+rng.gauss(0,0.9))));
    s.rtd=Math.max(0,Math.round(run/7*R(0.45,0.95)));
  } else if(pos==="WR"||pos==="WR2"){
    const share=pos==="WR"?R(0.26,0.38):R(0.15,0.24);
    s.rec=Math.max(0,Math.round(R(3,9)*(0.8+q*0.22)));
    s.cyd=Math.max(0,Math.round(s.rec*(12.8+q*2.4+rng.gauss(0,2))));
    s.ctd=Math.max(0,Math.round(pass/7*share*R(0.8,1.6)));
  } else if(pos==="OT"){
    s.pan=Math.max(0,Math.round(R(2,7)+q*2));
    s.ska=Math.max(0,Math.round(R(0,2.2)-q*0.6));
  } else if(pos==="EDGE"){
    s.tkl=Math.max(0,Math.round(R(2,5.5)+q*0.7));
    s.sck=(rng.r()<0.34+q*0.15?1:0)+(rng.r()<0.09+q*0.06?1:0);
    s.tfl=s.sck+(rng.r()<0.30+q*0.12?1:0);
  } else if(pos==="DT"){
    s.tkl=Math.max(0,Math.round(R(2,5)+q*0.6));
    s.sck=(rng.r()<0.20+q*0.09?1:0);
    s.tfl=s.sck+(rng.r()<0.24+q*0.10?1:0);
  } else if(pos==="LB"){
    s.tkl=Math.max(1,Math.round(R(5,11)+q*1.3));
    s.tfl=(rng.r()<0.42+q*0.15?1:0)+(rng.r()<0.10+q*0.05?1:0);
    s.pd=(rng.r()<0.28+q*0.09?1:0);
  } else {                                   // CB, S
    s.tkl=Math.max(0,Math.round(R(2,6)+q*0.6));
    s.pd=(rng.r()<0.42+q*0.14?1:0)+(rng.r()<0.14+q*0.07?1:0);
    s.ints=(rng.r()<0.155+q*0.055?1:0);
  }
  return s;
}

function addStats(dst,src){
  dst.g=(dst.g||0)+1;
  Object.keys(src).forEach(k=>dst[k]=(dst[k]||0)+src[k]);
}

/* Human-readable season line. */
function statLine(pos,s){
  if(!s||!s.g)return "";
  const n=x=>x.toLocaleString();
  if(pos==="QB")return `${n(s.pyd)} yds, ${s.ptd} TD, ${s.int} INT (${s.cmp}/${s.att})`;
  if(pos==="RB")return `${n(s.ryd)} yds, ${s.rtd} TD (${s.car} car)`;
  if(pos==="WR"||pos==="WR2")return `${s.rec} rec, ${n(s.cyd)} yds, ${s.ctd} TD`;
  if(pos==="OT")return `${s.pan} pancakes, ${s.ska} sacks allowed`;
  if(pos==="EDGE"||pos==="DT")return `${s.tkl} tkl, ${s.sck} sacks, ${s.tfl} TFL`;
  if(pos==="LB")return `${s.tkl} tkl, ${s.tfl} TFL, ${s.pd} PD`;
  return `${s.tkl} tkl, ${s.ints} INT, ${s.pd} PD`;
}

/* Award production, built from what a player actually did. */
function statProd(pos,s){
  if(!s||!s.g)return 0;
  if(pos==="QB")  return s.pyd*0.042 + s.ptd*4.4 - s.int*3.0;
  if(pos==="RB")  return s.ryd*0.062 + s.rtd*4.6;
  if(pos==="WR")  return s.cyd*0.060 + s.ctd*4.6 + s.rec*0.32;
  if(pos==="WR2") return s.cyd*0.046 + s.ctd*3.4;
  if(pos==="OT")  return s.pan*0.55 - s.ska*0.9;
  if(pos==="EDGE")return s.sck*5.2 + s.tfl*1.9 + s.tkl*0.30;
  if(pos==="DT")  return s.sck*4.6 + s.tfl*1.7 + s.tkl*0.28;
  if(pos==="LB")  return s.tkl*0.55 + s.tfl*2.1 + s.pd*1.1;
  return s.ints*7.2 + s.pd*1.7 + s.tkl*0.38;
}

/* ============ RNG ============ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
class RNG{
  constructor(seed){this.f=mulberry32(seed);this.sp=null}
  r(){return this.f()}
  int(n){return Math.floor(this.f()*n)}
  range(a,b){return a+this.f()*(b-a)}
  pick(a){return a[this.int(a.length)]}
  gauss(m,s){
    if(this.sp!==null){const v=this.sp;this.sp=null;return m+s*v}
    let u=0,v=0;while(u===0)u=this.f();while(v===0)v=this.f();
    const R=Math.sqrt(-2*Math.log(u));this.sp=R*Math.sin(2*Math.PI*v);
    return m+s*R*Math.cos(2*Math.PI*v)}
  shuffle(a){for(let i=a.length-1;i>0;i--){const j=this.int(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
}

/* ============ home fields ============ */
/* Not every stadium is the same place. A handful are genuinely miserable to
   visit; most are ordinary; some are half empty in November. */

function homeField(u,t){
  const prog=(u&&u.program&&u.program[t])!==undefined?u.program[t]:1500;
  const base=39+Math.max(0,Math.min(1,(prog-1150)/900))*30;
  return Math.round(base+(LEAGUE.venues[t]||8));
}

function venueLabel(v){
  if(v>=88)return "one of the hardest places to play in the country";
  if(v>=76)return "a genuinely hostile road trip";
  if(v>=64)return "a real home-field edge";
  if(v>=52)return "a normal road game";
  return "not a difficult place to visit";
}

/* ============ team identity ============ */
function _hx(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function _lum(c){const [r,g,b]=c.map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*r+.7152*g+.0722*b}
function _mix(c,t,p){return c.map((v,i)=>Math.round(v+(t[i]-v)*p))}
const _READ={};
function teamColor(t){                    // raw brand color
  return LEAGUE.colors[t]||"#F4A63A";
}
function teamInk(t){                      // brand color, lightened until legible on dark
  if(_READ[t])return _READ[t];
  let c=_hx(LEAGUE.colors[t]||"#F4A63A"), p=0;
  while(_lum(c)<0.30&&p<0.85){p+=0.08;c=_mix(_hx(LEAGUE.colors[t]||"#F4A63A"),[255,255,255],p)}
  const out="#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");
  _READ[t]=out; return out;
}

/* ============ constants ============ */
const ELO_PT=21, GAME_SD=14, K=32;

function divisionOf(u,t){
  const c=(u&&u.conf&&u.conf[t])||CONF[t];
  const D=LEAGUE.conf.divisions[c]; if(!D)return null;
  for(const k in D)if(D[k].indexOf(t)>=0)return k;
  // a newcomer joins whichever side is thinner
  const sizes=Object.keys(D).map(k=>[k,D[k].length]).sort((a,b)=>a[1]-b[1]);
  D[sizes[0][0]].push(t);
  return sizes[0][0];
}
function hasDivisions(c){return !!LEAGUE.conf.divisions[c]}
function divisionNames(c){return LEAGUE.conf.divisions[c]?Object.keys(LEAGUE.conf.divisions[c]).sort():[]}
const NAMES=LEAGUE.teams.map(t=>t[0]);
let CONF=Object.fromEntries(LEAGUE.teams.map(t=>[t[0],t[2]]));
function syncConf(u){
  if(u&&u.conf)NAMES.forEach(t=>{if(u.conf[t])CONF[t]=u.conf[t]});
  else if(u){u.conf={};NAMES.forEach(t=>u.conf[t]=CONF[t])}
}

/* ============ game sim ============ */
function simGame(rng,tH,tA,neutral,sdMult,edgeAdj){
  const edge=tH-tA+(neutral?0:LEAGUE.tuning.hfa)+(edgeAdj||0);
  let m=Math.round(rng.gauss(edge/ELO_PT,GAME_SD*(sdMult||1)));
  if(m===0)m=rng.r()<0.5?-3:3;
  let total=rng.gauss(52,9.5)+Math.abs(m)*0.18;
  total=Math.max(20,Math.min(95,total));
  let lo=Math.max(0,Math.round((total-Math.abs(m))/2));
  let hi=lo+Math.abs(m);
  // 1 is not a reachable football score
  if(lo===1)lo=(rng.r()<0.5?0:2);
  if(hi===1)hi=2;
  if(hi<=lo)hi=lo+1;
  if(hi===1)hi=2;
  m=(m>0?1:-1)*(hi-lo);
  return m>0?[hi,lo,m]:[lo,hi,m];
}
function eloUpdate(eW,eL,mAbs,winHome,neutral){
  const hfa=neutral?0:LEAGUE.tuning.hfa;
  const diff=winHome?(eW+hfa-eL):(eW-eL-hfa);
  const exp=1/(1+Math.pow(10,-diff/400));
  const mov=Math.log(mAbs+1)*(2.2/(0.001*diff+2.2));
  return K*mov*(1-exp);
}

/* ============ talent ============ */
const INJ_HAZARD=0.085,QB_SHARE=0.18,DEV_SD=4.2,AR_SD=5,AR_DECAY=0.8,
      COLLAPSE_P=0.018,BREAKOUT_P=0.018;
const BODY=["OL","WR1","RB1","EDGE","CB1","LB","TE","S"];
function iscale(r){return 0.70+0.45*Math.max(0,Math.min(1,(r-1150)/900))}

class Talent{
  constructor(rng,base,roster){
    this.rng=rng;this.base=Object.assign({},base);
    this.roster=roster||null;
    this.slope={};this.ar={};this.inj={};this.log={};
    NAMES.forEach(t=>{this.slope[t]=rng.gauss(0,DEV_SD);this.ar[t]=0;
      this.inj[t]=[];this.log[t]=[]});
  }
  eff(t,w){
    let s=0; this.inj[t].forEach(e=>{if(e.w>0)s+=e.m});
    return this.base[t]+this.slope[t]*w+this.ar[t]+s;
  }
  active(t){return this.inj[t].filter(e=>e.w>0)}
  advance(w){
    const r=this.rng;
    NAMES.forEach(t=>{
      this.inj[t].forEach(e=>e.w--);
      this.inj[t].filter(e=>e.w<=0).forEach(e=>
        this.log[t].push({wk:w,kind:"back",what:e.k,mag:0}));
      this.inj[t]=this.inj[t].filter(e=>e.w>0);
      const sc=iscale(this.base[t]);
      if(r.r()<INJ_HAZARD){
        if(this.roster){
          // pick a starter, weighted toward the positions that take hits
          const idx=pickInjuredPos(r);
          const pl=this.roster[t][idx];
          if(!this.inj[t].some(e=>e.idx===idx)){
            const sev=r.r();
            const wk=sev<0.12?14:r.pick([1,2,2,3,4,5,6]);
            const m=injuryCost(this.roster[t],idx)*r.range(1.05,2.1);
            this.inj[t].push({m:m,w:wk,k:pl.p,idx:idx,who:pl.n,rating:pl.r});
            this.log[t].push({wk:w,kind:"injury",what:pl.p,who:pl.n,
                              mag:Math.round(m),weeks:wk});
          }
        }else{
          let m,wk,k;
          if(r.r()<QB_SHARE){m=-r.range(85,190)*sc;wk=r.pick([2,3,4,5,6,14]);k="QB1"}
          else{m=-r.range(20,75)*sc;wk=r.pick([1,2,2,3,4,6]);k=r.pick(BODY)}
          this.inj[t].push({m:m,w:wk,k:k});
          this.log[t].push({wk:w,kind:"injury",what:k,mag:Math.round(m),weeks:wk});
        }
      }
      if(r.r()<COLLAPSE_P){const d=-r.range(40,110)*sc;this.base[t]+=d;
        this.log[t].push({wk:w,kind:"collapse",what:"locker room",mag:Math.round(d)})}
      else if(r.r()<BREAKOUT_P){const d=r.range(35,95)*sc;this.base[t]+=d;
        this.log[t].push({wk:w,kind:"breakout",what:"scheme unlock",mag:Math.round(d)})}
      this.ar[t]=this.ar[t]*AR_DECAY+r.gauss(0,AR_SD);
    });
  }
}

let COACH_ID=1;
function newCoach(rng,prestige){
  // better programs attract better coaches
  const tier=Math.max(0,Math.min(1,(prestige-1150)/900));
  const q=rng.gauss(-24+tier*52, 26);
  return {id:COACH_ID++, n:rng.pick(FIRST)+" "+rng.pick(LAST),
          q:Math.round(Math.max(-58,Math.min(68,q))), t:0, hired:true,
          w:0,l:0,titles:0,confs:0,fired:0,stops:[]};
}

/* Roll a season's results into every coach's career. */
function recordCoaches(u,rec,champion,confChamps,year){
  u.coachLog=u.coachLog||{};
  NAMES.forEach(t=>{
    const c=u.coach[t]; if(!c)return;
    if(c.w===undefined){c.w=0;c.l=0;c.titles=0;c.confs=0;c.fired=0;c.stops=[]}
    if(!c.stops.length||c.stops[c.stops.length-1].team!==t)
      c.stops.push({team:t,from:year,to:year,w:0,l:0,titles:0});
    const st=c.stops[c.stops.length-1];
    c.w+=rec[t][0]; c.l+=rec[t][1];
    st.w+=rec[t][0]; st.l+=rec[t][1]; st.to=year;
    if(champion===t){c.titles++; st.titles++}
    if(confChamps&&Object.values(confChamps).indexOf(t)>=0)c.confs++;
  });
}

/* Snapshot of everyone currently employed, for browsing. */
function coachTable(u){
  const out=[];
  NAMES.forEach(t=>{
    const c=u.coach[t]; if(!c)return;
    out.push({team:t,n:c.n,q:c.q,t:c.t,you:!!c.you,
      w:c.w||0,l:c.l||0,titles:c.titles||0,confs:c.confs||0,
      stops:(c.stops||[]).slice()});
  });
  return out;
}

function coachGrade(q){
  if(q>=38)return "elite";
  if(q>=18)return "strong";
  if(q>=-5)return "solid";
  if(q>=-25)return "shaky";

}

const ARCHETYPES=[
 {k:"proven", l:"Proven winner",  bump:16, sd:16,
  d:"Has won at this level before. Expensive, and the expectations arrive with him."},
 {k:"riser",  l:"Rising coordinator", bump:2, sd:36,
  d:"Hottest name on the market. Could be the next great one, could be a coordinator forever."},
 {k:"builder",l:"Program builder", bump:-4, sd:19, rec:9,
  d:"Wins on the recruiting trail before he wins on Saturdays. Slow burn, high floor."},
 {k:"retread",l:"Veteran retread", bump:-7, sd:11,
  d:"Been fired twice. Knows exactly what he is, and so does everyone else."}
];

function coachCandidates(rng,prestige){
  const tier=Math.max(0,Math.min(1,(prestige-1150)/900));
  const pool=rng.shuffle(ARCHETYPES.slice()).slice(0,3);
  return pool.map(A=>{
    const q=Math.round(Math.max(-58,Math.min(68,
      rng.gauss(-24+tier*52+A.bump, A.sd))));
    // scouting is imperfect: you see a noisy read, not the number
    const seen=q+rng.gauss(0,13);
    return {n:rng.pick(FIRST)+" "+rng.pick(LAST), q:q, arch:A.k, al:A.l, d:A.d,
            rec:A.rec||0, grade:coachGrade(seen)};
  });
}

/* ============ your coaching career ============ */
/* You are the head coach, not the athletic director. You get hired, you get
   fired, and your record follows you to the next job. */
function repGrade(r){
  if(r>=46)return "a national name";
  if(r>=26)return "a hot commodity";
  if(r>=8)return "well regarded";
  if(r>=-10)return "unproven";
  if(r>=-28)return "a hard sell";
  return "radioactive";
}

/* Which jobs would take you, given what you've done. */
function jobMarket(u,rng,rep,openings,current){
  const ceiling=1300+Math.max(0,rep+40)*10;      // reputation opens bigger doors
  const floor=Math.max(1120,ceiling-620);
  const opts=openings.filter(t=>t!==current)
    .filter(t=>u.program[t]<=ceiling&&u.program[t]>=floor)
    .sort((a,b)=>u.program[b]-u.program[a]);
  const picked=[];
  if(opts.length)picked.push(opts[0]);
  if(opts.length>2)picked.push(opts[Math.floor(opts.length/2)]);
  if(opts.length>1)picked.push(opts[opts.length-1]);
  return [...new Set(picked)].slice(0,3);
}

/* Bigger programs come calling when you overperform at a small one. */
function poachOffers(u,rng,rep,openings,current){
  if(rep<18)return [];
  const mine=u.program[current];
  return openings.filter(t=>t!==current&&u.program[t]>mine+150
    &&u.program[t]<=1240+Math.max(0,rep+30)*12)
    .sort((a,b)=>u.program[b]-u.program[a]).slice(0,2);
}

function repDelta(wins,losses,expWins,program,titles){
  const wp=wins/Math.max(1,wins+losses);
  let d=(wins-expWins)*1.7;
  if(titles.natl)d+=22;
  else if(titles.playoff)d+=8;
  else if(titles.conf)d+=6;
  if(wp<0.34&&wins<expWins)d-=6;   // only if you also missed the mark
  // winning at a small program counts for more
  d*= program<1500?1.25 : program>1850?0.82 : 1.0;
  return d;
}

/* ============ program continuity ============ */
const COACH_ONFIELD=0.55,  // how much coach quality shows up on the field
      COACH_BUILD=0.34,    // how much it compounds into the program each year
      ROOKIE_DIP=-22;
const ROSTER_NOISE=48;
const CARRY=0.45,CHURN_SD=95,RECRUIT=0.16,PROG_NOISE=22,
      P_FLOOR=1120,P_CEIL=2010,HOT_SEAT=0.42,COACH_SD=62,COACH_DIP=-18,PERCEPT_N=34;

function newUniverse(seed){
  const rng=new RNG(seed);
  const u={seed:seed,year:2026,program:{},perceived:{},trueBase:{},
           tenure:{},bad:{},history:[],rng:seed};
  u.coach={}; u.roster={}; u.oc={}; u.dc={}; u.conf={};
  u.nextRealign=2026+4+rng.int(4);
  LEAGUE.teams.forEach(t=>u.conf[t[0]]=t[2]);
  LEAGUE.teams.forEach(([n,e])=>{
    u.program[n]=e; u.perceived[n]=e;
    u.roster[n]=LEAGUE.offseason.newRoster(rng,e);
    u.oc[n]=newCoordinator(rng,e,"oc"); u.dc[n]=newCoordinator(rng,e,"dc");
    u.trueBase[n]=rosterElo(u.roster[n])+rng.gauss(0,26);
    u.tenure[n]=1+rng.int(6); u.bad[n]=0;
    const c=newCoach(rng,e); c.t=u.tenure[n]; c.hired=false;
    u.coach[n]=c;
  });
  u._rngState=seed*7919+13;
  return u;
}

function seatHeat(u,rec,elo,t){
  // expectation is the program's own baseline; heat is falling short of it repeatedly
  const w=rec[t][0], l=rec[t][1], wp=w/Math.max(1,w+l);
    const shortfall=(u.program[t]-elo[t])/45;
  let heat=u.bad[t]*1.4 + Math.max(0,shortfall) + (wp<HOT_SEAT?1.2:0);
  if(u.coach[t]&&u.coach[t].t<=1)heat-=1.6;         // rookies get a grace year
  if(u.coach[t]&&u.coach[t].q>=30)heat-=0.6;
  return heat;
}

/* Offseason runs in two acts so the player can decide in between.
   Act 1: the coaching carousel. Act 2: rosters, recruiting, development. */
function offseasonCoaching(u,rng,rec,elo,userTeam){
  const fired=[],hires=[],poached=[];
  if(!u.coach){u.coach={};NAMES.forEach(t=>{u.coach[t]=newCoach(rng,u.program[t]);u.coach[t].hired=false})}

  NAMES.forEach(t=>{
    const wp=rec[t][0]/Math.max(1,rec[t][0]+rec[t][1]);
    u.bad[t]= wp<HOT_SEAT ? u.bad[t]+1 : 0;
    const heat=seatHeat(u,rec,elo,t);
    const change=(heat>=4.6)||(wp<0.25&&u.coach[t].t>=2);
    if(change&&rng.r()<0.82){fired.push(t);u.bad[t]=0}
  });

  const openings=fired.slice().sort((a,b)=>u.program[b]-u.program[a]);
  openings.forEach(job=>{
    if(rng.r()>0.42)return;
    const cands=NAMES.filter(t=>fired.indexOf(t)<0 && u.coach[t].q>=22
      && u.program[t] < u.program[job]-140 && u.coach[t].t>=2
      && rec[t][0]>=rec[t][1]);
    if(!cands.length)return;
    cands.sort((a,b)=>u.coach[b].q-u.coach[a].q);
    const from=cands[0], c=u.coach[from];
    poached.push({to:job,from:from,name:c.n,q:c.q});
    u.coach[job]=Object.assign({},c,{t:0,hired:true});   // his record travels with him
    u.coach[from]=newCoach(rng,u.program[from]);
    hires.push({team:from,name:u.coach[from].n,q:u.coach[from].q,reason:"replacing "+c.n});
    fired.splice(fired.indexOf(job),1);
    if(fired.indexOf(from)<0)fired.push(from);
  });

  // a hot coordinator can be the man a program hires
  const coordMoves=[];
  fired.slice().forEach(job=>{
    if(job===userTeam)return;
    if(rng.r()>0.30)return;
    const pool=NAMES.filter(t=>fired.indexOf(t)<0 && u.oc[t] && u.oc[t].q>=26
      && u.program[t] < u.program[job]+90);
    if(!pool.length)return;
    const from=rng.pick(pool);
    const side=(u.dc[from]&&u.dc[from].q>u.oc[from].q)?"dc":"oc";
    const co=side==="oc"?u.oc[from]:u.dc[from];
    if(!co||co.q<26)return;
    coordMoves.push({name:co.n,from:from,to:job,side:side});
    u.coach[job]={id:COACH_ID++,n:co.n,q:Math.round(co.q*0.85),t:0,hired:true,
                  w:0,l:0,titles:0,confs:0,fired:0,stops:[]};
    const fresh=newCoordinator(rng,u.program[from],side);
    if(side==="oc")u.oc[from]=fresh; else u.dc[from]=fresh;
    fired.splice(fired.indexOf(job),1);
  });

  const userOpen=fired.indexOf(userTeam)>=0;
  const openJobs=fired.slice();
  const candidates=userOpen?coachCandidates(rng,u.program[userTeam]):null;

  fired.forEach(t=>{
    if(t===userTeam)return;                       // that's your job, not an AI hire
    if(u.coach[t].hired&&u.coach[t].t===0)return;
    const old=u.coach[t].n;
    u.coach[t]=newCoach(rng,u.program[t]);
    hires.push({team:t,name:u.coach[t].n,q:u.coach[t].q,reason:"replacing "+old});
  });

  // ordinary staff churn everywhere else
  const staffOpen={oc:false,dc:false};
  NAMES.forEach(t=>{
    ["oc","dc"].forEach(side=>{
      const st=side==="oc"?u.oc:u.dc;
      if(!st[t]){st[t]=newCoordinator(rng,u.program[t],side);return}
      st[t].t=(st[t].t||0)+1;
      const leaves = st[t].q>=34 ? rng.r()<0.20 : (st[t].q<=-26 ? rng.r()<0.30 : rng.r()<0.09);
      if(leaves){
        if(t===userTeam){staffOpen[side]=true;}
        else st[t]=newCoordinator(rng,u.program[t],side);
      }
    });
  });

  return {fired:fired,hires:hires,poached:poached,userOpen:userOpen,
          candidates:candidates,openJobs:openJobs,
          coordMoves:coordMoves,staffOpen:staffOpen};
}

/* ============ coordinators ============ */
/* Two assistants per program. They shift the team on the field and shape how
   their side of the ball develops — and the good ones get poached. */
const OFF_SHARE=0.61, DEF_SHARE=0.39;      // matches the positional weights
const STAFF_ELO=0.62;                      // Elo per point of coordinator quality

const OC_STYLE=["Air raid","Pro-style","Spread option","Run-heavy","RPO"];
const DC_STYLE=["3-4 attacking","4-2-5 nickel","Bend-don't-break","Blitz-heavy","Cover 3"];

function newCoordinator(rng,prestige,side,repBonus){
  const tier=Math.max(0,Math.min(1,(prestige-1150)/900));
  const q=rng.gauss(-20+tier*44+(repBonus||0), 24);
  return {n:rng.pick(FIRST)+" "+rng.pick(LAST),
          q:Math.round(Math.max(-52,Math.min(62,q))), t:0,
          s:rng.pick(side==="oc"?OC_STYLE:DC_STYLE)};
}

function staffElo(u,t){
  if(!u.oc||!u.dc||!u.oc[t]||!u.dc[t])return 0;
  return (u.oc[t].q*OFF_SHARE + u.dc[t].q*DEF_SHARE)*STAFF_ELO;
}

function coordGrade(q){
  if(q>=40)return "one of the best in the country";
  if(q>=20)return "highly regarded";
  if(q>=2)return "solid";
  if(q>=-20)return "unproven";
  return "in over his head";
}

function coordCandidates(rng,prestige,side,rep){
  return [0,1,2].map(()=>{
    const c=newCoordinator(rng,prestige,side,(rep||0)*0.22);
    c.grade=coordGrade(c.q+rng.gauss(0,11));    // scouting is imperfect here too
    return c;
  });
}
/* ============ poll: college football ============ */
/* The league's ranking. The core asks any ranking for order(), rankMap() and
   update(results, elo); college football's is a voters' poll. */
const INERTIA=0.82,ELO_PULL=0.18,L_UNR=-52,L_RNK=-22,L_T10=-9,
      W_T10=48,W_RNK=26,W_UNR=4,BLOWOUT=10,IDLE=-3;
/* Losses are the first thing voters sort on. A two-loss team has to be a great
   deal better regarded to stay ahead of an unbeaten one. */
const LOSS_TIER=100;
class Poll{
  constructor(pre){this.s=Object.assign({},pre);this.L={};NAMES.forEach(t=>this.L[t]=0)}
  eff(t){return this.s[t]-(this.L[t]||0)*LOSS_TIER}
  order(){return NAMES.slice().sort((a,b)=>this.eff(b)-this.eff(a))}
  rankMap(){const o=this.order(),m={};o.forEach((t,i)=>m[t]=i+1);return m}
  update(res,elo){
    const prev=this.rankMap(), played=new Set(), d={};
    NAMES.forEach(t=>d[t]=0);
    res.forEach(r=>{
      const w=r.winner,l=r.loser,m=r.margin;
      this.L[l]=(this.L[l]||0)+1;
      played.add(w);played.add(l);
      const lr=prev[l]||999, wr=prev[w]||999;
      if(wr<=25||lr<=25){
        d[w]+= lr<=10?W_T10 : lr<=25?W_RNK : W_UNR;
        if(m>=21&&lr<=25)d[w]+=BLOWOUT;
      } else d[w]+=W_UNR;
      d[l]+= wr<=10?L_T10 : wr<=25?L_RNK : L_UNR;
      if(m>=21)d[l]-=8;
    });
    NAMES.forEach(t=>{
      this.s[t]=this.s[t]*INERTIA+(1-INERTIA)*this.s[t]
                +ELO_PULL*(elo[t]-this.s[t])+d[t]+(played.has(t)?0:IDLE);
    });
    const winners=new Set(res.map(r=>r.winner));
    const nr=this.rankMap();
    winners.forEach(t=>{
      if((prev[t]||999)<=25 && (nr[t]||999)>prev[t]){
        const o=this.order(), ref=o[prev[t]-1];
        if(ref&&ref!==t)this.s[t]=this.eff(ref)+(this.L[t]||0)*LOSS_TIER+0.5;
      }
    });
    return this.rankMap();
  }
}
LEAGUE.Ranking=Poll;
/* ============ schedule: college football ============ */
/* Conference slates, non-conference pairing by strength, protected
   rivalries, and the real 2026 games laid down first. The core asks
   LEAGUE.buildSchedule(rng, ratings, year) for [{week, home, away, conf,
   neutral, real, site}]. */
/* d-regular circulant: every team gets EXACTLY d conference games.
   Valid whenever d <= n-1 and (n*d) is even. */
function confGraph(members,d,rng){
  const idx=rng.shuffle(members.slice()), n=idx.length, out=[];
  d=Math.min(d,n-1);
  if((n*d)%2!==0)d-=1;
  const half=Math.floor(d/2);
  for(let o=1;o<=half;o++)
    for(let i=0;i<n;i++)out.push([idx[i],idx[(i+o)%n]]);
  if(d%2===1)for(let i=0;i<n/2;i++)out.push([idx[i],idx[i+n/2]]);
  return out;
}

function rrRounds(list){
  const t=list.slice(); if(t.length%2)t.push(null);
  const n=t.length, out=[];
  for(let k=0;k<n-1;k++){
    const p=[];
    for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a&&b)p.push([a,b])}
    out.push(p); t.splice(1,0,t.pop());
  }
  return out;
}

/* Finish a conference to `need` games each, keeping any edges already placed. */
function completeConf(teams,need,rng,games,fixedKey,confCount){
  const K=(a,b)=>[a,b].sort().join("|");
  for(let pass=0;pass<400;pass++){
    const short=teams.filter(t=>confCount[t]<need);
    if(!short.length)return;
    short.sort((a,b)=>(need-confCount[b])-(need-confCount[a]));
    const a=short[0];
    const opts=rng.shuffle(teams.filter(t=>t!==a&&confCount[t]<need&&!fixedKey.has(K(a,t))));
    if(!opts.length){
      // nobody left who needs a game: swap into an existing pair
      const cand=games.filter(g=>g[2]&&!g[4]&&teams.indexOf(g[0])>=0&&teams.indexOf(g[1])>=0
        &&g[0]!==a&&g[1]!==a&&!fixedKey.has(K(a,g[0])));
      if(!cand.length)return;
      const g=cand[rng.int(cand.length)];
      const drop=g[1];
      fixedKey.delete(K(g[0],g[1]));
      confCount[drop]--;
      g[1]=a; confCount[a]++;
      fixedKey.add(K(g[0],g[1]));
      continue;
    }
    const b=opts[0];
    fixedKey.add(K(a,b));
    confCount[a]++; confCount[b]++;
    if(rng.r()<0.5)games.push([b,a,true,false]); else games.push([a,b,true,false]);
  }
}

function buildSchedule(rng,R,year){
  const byConf={};
  NAMES.forEach(t=>{(byConf[CONF[t]]=byConf[CONF[t]]||[]).push(t)});
  const games=[], nGames=LEAGUE.schedule.confGames;
  // The ACC has 17 teams in 2026: most play nine, a few play eight. The real
  // games push those teams to nine; the filler tops everyone up to eight.

  /* Real games are laid down first and never moved; the generator fills in
     around them so a released schedule survives intact. */
  const fixedKey=new Set();
  const confCount={}; NAMES.forEach(t=>confCount[t]=0);
  if(year===2026&&typeof REAL2026!=="undefined"){
    REAL2026.forEach(g=>{
      if(NAMES.indexOf(g.h)<0||NAMES.indexOf(g.a)<0)return;
      const k=[g.a,g.h].sort().join("|");
      if(fixedKey.has(k))return;
      const isC=CONF[g.a]===CONF[g.h];
      if(isC&&(confCount[g.a]>=(nGames[CONF[g.a]]||LEAGUE.schedule.confGamesDefault)||confCount[g.h]>=(nGames[CONF[g.h]]||LEAGUE.schedule.confGamesDefault)))return;
      fixedKey.add(k);
      if(isC){confCount[g.a]++;confCount[g.h]++}
      games.push([g.a,g.h,isC,!!g.neutral,true,g.w,g.site||null]);
    });
  }

  for(const c in byConf){
    if(c==="IND")continue;
    const need=nGames[c]||LEAGUE.schedule.confGamesDefault;
    completeConf(byConf[c],need,rng,games,fixedKey,confCount);
  }
  const played={}; NAMES.forEach(t=>played[t]=0);
  games.forEach(g=>{played[g[0]]++;played[g[1]]++});
  const RR=Object.assign({},R);
  NAMES.forEach(t=>{if(CONF[t]==="IND")RR[t]=RR[t]+130});
  const seen=new Set(games.map(g=>[g[0],g[1]].sort().join("|")));
  let pool=[];
  NAMES.forEach(t=>{for(let i=0;i<Math.max(0,LEAGUE.schedule.games-played[t]);i++)pool.push(t)});
  rng.shuffle(pool);
  let tries=0;
  while(pool.length>=2 && tries<80000){
    tries++;
    const i=rng.int(pool.length), a=pool[i];
    const target=RR[a]+(rng.r()<0.24?rng.gauss(0,120):-rng.range(300,750));
    let bj=null,best=null;
    for(let s=0;s<8;s++){
      const k=rng.int(pool.length); if(k===i)continue;
      const d=Math.abs(RR[pool[k]]-target);
      if(best===null||d<best){best=d;bj=k}
    }
    if(bj===null)continue;
    const b=pool[bj];
    if(a===b||CONF[a]===CONF[b])continue;
    const key=[a,b].sort().join("|"); if(seen.has(key))continue;
    seen.add(key);
    let home;
    if(Math.abs(RR[a]-RR[b])>200) home=RR[a]>RR[b]?a:b;
    else home=rng.r()<0.5?a:b;
    games.push([home===a?b:a, home, false, false]);
    const idx=[i,bj].sort((x,y)=>y-x);
    idx.forEach(x=>pool.splice(x,1));
  }
  // pairing repair: pair leftovers directly, or steal an opponent from an
  // existing non-conference game and push the displaced team back into the pool.
  const kOf=(x,y)=>[x,y].sort().join("|");
  let guard=0;
  while(pool.length>0 && guard++<20000){
    const a=pool[0];
    let partner=-1;
    for(let k=1;k<pool.length;k++){
      const b=pool[k];
      if(a===b||CONF[a]===CONF[b])continue;
      if(seen.has(kOf(a,b)))continue;
      partner=k;break;
    }
    if(partner>=0){
      const b=pool[partner];
      seen.add(kOf(a,b));
      const home=rng.r()<0.5?a:b;
      games.push([home===a?b:a,home,false,false]);
      pool.splice(partner,1);pool.splice(0,1);
      continue;
    }
    // steal: replace non-conf game (p,q) with (a,p); q re-enters the pool
    let stole=false;
    const order=rng.shuffle(games.map((g,i)=>i).filter(i=>!games[i][2]));
    for(const gi of order){
      const g=games[gi], x=g[0], y=g[1];
      for(const [p,q] of [[x,y],[y,x]]){
        if(p===a||CONF[a]===CONF[p])continue;
        if(seen.has(kOf(a,p)))continue;
        seen.delete(kOf(x,y));
        seen.add(kOf(a,p));
        games.splice(gi,1);
        const home=rng.r()<0.5?a:p;
        games.push([home===a?p:a,home,false,false]);
        pool.splice(0,1);
        pool.push(q);
        stole=true;break;
      }
      if(stole)break;
    }
    if(!stole){pool.splice(0,1)}
  }

  enforceRivalries(games,rng,year===2026);

  /* Balance home and away. A coin flip per game leaves teams with ten road
     trips; real slates are close to six and six. */
  (function balanceHome(){
    const homeCt={}; NAMES.forEach(t=>homeCt[t]=0);
    games.forEach(g=>homeCt[g[1]]++);
    const tgt={}; NAMES.forEach(t=>tgt[t]=0);
    games.forEach(g=>{tgt[g[0]]+=0.5;tgt[g[1]]+=0.5});
    const dev=t=>homeCt[t]-tgt[t];
    const idx=games.map((g,i)=>i);
    for(let pass=0;pass<400;pass++){
      let moved=false;
      rng.shuffle(idx);
      for(const i of idx){
        const g=games[i]; if(g[3]||g[4])continue; // neutral sites and real games stay put
        const away=g[0], home=g[1];
        if(dev(home)-dev(away)>=1){              // strictly reduces the spread
          g[0]=home; g[1]=away;
          homeCt[home]--; homeCt[away]++;
          moved=true;
        }
      }
      if(!moved)break;
    }
  })();

  // week assignment — retried until every team has a full slate
  let bestSched=null, bestShort=1e9;
  for(let attempt=0; attempt<6; attempt++){
  rng.shuffle(games);
  games.sort((x,y)=>{
    const ra=x[4]?0:1, rb=y[4]?0:1;              // real games get first claim
    if(ra!==rb)return ra-rb;
    return (x[2]?1:0)-(y[2]?1:0);
  });
  const busy={}; NAMES.forEach(t=>busy[t]=new Set());
  const sched=[], unplaced=[];
  games.forEach(([a,h,isC,neu,rl,pw,site])=>{
    let order=isC?[...Array(LEAGUE.weeks).keys()].slice(3).concat([0,1,2])
                 :[...Array(LEAGUE.weeks).keys()];
    if(rl&&pw!==undefined)order=[pw].concat(order.filter(w=>w!==pw));
    let ok=false;
    for(const w of order){
      if(!busy[a].has(w)&&!busy[h].has(w)){
        busy[a].add(w);busy[h].add(w);
        sched.push({week:w,away:a,home:h,conf:isC,neutral:neu,real:!!rl,site:site||null});
        ok=true;break}
    }
    if(!ok)unplaced.push([a,h,isC,neu]);
  });
  const place=(a,h,isC,neu)=>{
    for(let w=0;w<LEAGUE.weeks;w++){
      if(!busy[a].has(w)&&!busy[h].has(w)){
        busy[a].add(w);busy[h].add(w);
        sched.push({week:w,away:a,home:h,conf:isC,neutral:neu});return true}
    }
    return false;
  };
  const move=(g,depth)=>{               // try to relocate game g to a free week
    const A=g.home,B=g.away,cur=g.week;
    for(let w=0;w<LEAGUE.weeks;w++){
      if(w===cur)continue;
      if(!busy[A].has(w)&&!busy[B].has(w)){
        busy[A].delete(cur);busy[B].delete(cur);
        busy[A].add(w);busy[B].add(w);g.week=w;return true}
    }
    if(depth<=0)return false;
    for(let w=0;w<LEAGUE.weeks;w++){
      if(w===cur)continue;
      const block=sched.filter(x=>x!==g&&x.week===w&&
        (x.home===A||x.away===A||x.home===B||x.away===B));
      if(block.length!==1)continue;
      if(move(block[0],depth-1)){
        if(!busy[A].has(w)&&!busy[B].has(w)){
          busy[A].delete(cur);busy[B].delete(cur);
          busy[A].add(w);busy[B].add(w);g.week=w;return true}
      }
    }
    return false;
  };
  const stillOut=[];
  unplaced.forEach(([a,h,isC,neu])=>{
    if(place(a,h,isC,neu))return;
    let ok=false;
    for(let w=0;w<LEAGUE.weeks&&!ok;w++){
      const block=sched.filter(x=>x.week===w&&
        (x.home===a||x.away===a||x.home===h||x.away===h));
      if(block.length!==1)continue;
      if(move(block[0],2)&&!busy[a].has(w)&&!busy[h].has(w)){
        busy[a].add(w);busy[h].add(w);
        sched.push({week:w,away:a,home:h,conf:isC,neutral:neu});ok=true}
    }
    if(!ok)stillOut.push([a,h,isC,neu]);
  });
  stillOut.forEach(([a,h,isC,neu])=>{ place(a,h,isC,neu) });
  lateenRivalries(sched,busy);
  if(year===2026)pinRealWeeks(sched,busy,LEAGUE.weeks);
  fillEarlyByes(sched,busy);
  const tally={}; NAMES.forEach(t=>tally[t]=0);
  sched.forEach(g=>{tally[g.home]++;tally[g.away]++});
  const shortfall=games.length-sched.length;
  if(shortfall<bestShort){bestShort=shortfall;bestSched=sched}
  if(shortfall===0)return sched;
  }
  return bestSched;
}

/* ============ offseason: college football ============ */
/* Players arrive as freshmen, develop for up to four years, and leave by
   graduating or declaring early. Programs sign a class every year, spend a
   budget, drift in prestige, and now and then change conferences. The core
   asks the league for a starting roster and for one offseason at a time. */

function makePlayer(rng,target,cls,posIdx){
  // upperclassmen are closer to their ceiling; freshmen start lower with room to grow
  const clsAdj=[-7,-2,2,4][cls];   // centred so a normal class mix averages the target
  const r=Math.round(Math.max(30,Math.min(99,rng.gauss(target+clsAdj,5.5))));
  const pot=Math.round(Math.max(r,Math.min(99,r+rng.gauss(10-cls*2.5,5))));
  return {n:playerName(rng),p:POS[posIdx].p,i:posIdx,c:cls,r:r,pot:pot,
          hz:0,prod:0,st:0};
}

function makeRoster(rng,programElo){
  const target=eloToRating(programElo);
  const bag=[]; [3,3,2,2].forEach((n,k)=>{for(let i=0;i<n;i++)bag.push(3-k)});
  rng.shuffle(bag);
  const r=POS.map((_,i)=>makePlayer(rng,target,bag[i],i));
  // backups are younger and a clear step down, but the gap varies a lot
  const bbag=[]; [1,2,3,4].forEach((n,k)=>{for(let i=0;i<n;i++)bbag.push(3-k)});
  rng.shuffle(bbag);
  POS.forEach((_,i)=>{
    const b=makePlayer(rng,target-rng.range(6,17),bbag[i],i);
    b.r=Math.min(b.r,r[i].r);            // never better than the starter on day one
    r.push(b);
  });
  return r;
}

/* ---- offseason roster churn ---- */
function developRoster(u,t,rng,focus,devMod,bud,featured,staff){
  focus=focus||{pos:null,r:0,pot:0}; devMod=devMod||0; bud=bud||null;
  const cls=(u.classAvg&&u.classAvg[t]!==undefined)?u.classAvg[t]:null;
  const coach=u.coach[t];
  const base=eloToRating(u.program[t]);
  const target=(u.classAvg&&u.classAvg[t]!==undefined)
    ? base*0.68+u.classAvg[t]*0.32     // recent classes feed the pipeline
    : base;
  const leaving=[], arriving=[];
  const roster=u.roster[t];
  if(roster.length<POS.length*2){          // older save: give it a two-deep
    POS.forEach((_,i)=>{
      if(!roster[BK(i)]){
        const b=makePlayer(rng,target-rng.range(6,17),rng.int(3),i);
        b.r=Math.min(b.r,roster[i].r); roster[BK(i)]=b;
      }
    });
  }
  const newcomer=(i)=>{
    const cls=rng.r()<0.62?0:1;
    const bonus=(!focus.pos||focus.pos.indexOf(POS[i%POS.length].p)>=0)?focus.r:0;
    const np=makePlayer(rng,target-rng.range(4,14)+(coach.q*0.045)+bonus
      +(coach.rec||0)*0.5+(bud?bud.recruitBonus:0),cls,i%POS.length);
    if(focus.pot)np.pot=Math.min(99,np.pot+focus.pot);
    if(focus.dev)np.up=focus.dev;
    if(cls===0)np.rec=true;
    return np;
  };
  for(let i=0;i<roster.length;i++){
    const pl=roster[i];
    if(!pl)continue;
    if(pl.c>=3){                                   // senior graduates
      leaving.push({n:pl.n,p:pl.p,r:pl.r,starter:i<POS.length,
                    car:pl.car||null, from:pl.from||null, peak:pl.peak||pl.r,
                    idx:i%POS.length});
      if(i<POS.length){
        // the backup steps up, and a new man arrives behind him
        roster[i]=roster[BK(i)];
        roster[BK(i)]=newcomer(i);
        arriving.push(roster[BK(i)]);
      }else{
        roster[i]=newcomer(i); arriving.push(roster[i]);
      }
    }else{
      // development: biggest jumps early, capped by potential, nudged by coaching
      const base=[6.2,4.0,2.2][pl.c];
      const feat=(featured!==undefined&&featured!==null&&featured===i)?3.8:0;
      const side=(i%POS.length)<5 ? (staff?staff.oc:0) : (staff?staff.dc:0);
      let g=rng.gauss(base+coach.q*0.035+devMod+(pl.up||0)+feat+(side||0),3.0);
      pl.r=Math.round(Math.max(30,Math.min(pl.pot,pl.r+g)));
      pl.peak=Math.max(pl.peak||0,pl.r);
      pl.c++;
      // stars leave early for the draft
      let keepOdds=bud?Math.max(0,1-bud.retention):1;
      if(featured!==undefined&&featured!==null&&featured===i)keepOdds*=0.34;
      if(pl.c>=2 && pl.r>=76 && rng.r() < ((pl.r-74)/34)*keepOdds){
        const wasFeatured=(featured!==undefined&&featured!==null&&featured===i);
        leaving.push({n:pl.n,p:pl.p,r:pl.r,early:true,featured:wasFeatured,
                      starter:i<POS.length, car:pl.car||null, from:pl.from||null,
                      peak:pl.peak||pl.r, idx:i%POS.length});
        if(wasFeatured)u.pipeline=(u.pipeline||0)+1;
        if(i<POS.length){
          roster[i]=roster[BK(i)];
          roster[BK(i)]=newcomer(i);
          arriving.push(roster[BK(i)]);
        }else{ roster[i]=newcomer(i); arriving.push(roster[i]) }
      }
    }
  }
  POS.forEach((_,i)=>{
    const s=roster[i], b=roster[BK(i)];
    if(s&&b&&b.r>s.r+2){roster[i]=b;roster[BK(i)]=s}   // clear upgrade wins the job
  });
  return {leaving:leaving,arriving:arriving};
}

function classLabel(rank,total){
  const pct=rank/total;
  if(rank<=10)return "Top-10 class";
  if(pct<=0.20)return "Top-25 class";
  if(pct<=0.45)return "Above average";
  if(pct<=0.75)return "Middling";
  return "Thin class";
}

/* ---- realignment ---- */
/* Money moves programs. Every few years the strongest independents-in-waiting
   get poached upward and the weakest P4 members get left behind. */
function realign(u,rng,year){
  if(!u.conf)syncConf(u);
  const size=c=>NAMES.filter(t=>u.conf[t]===c).length;
  const moves=[];
  const P4L=LEAGUE.playoff.autoBids;
  const G6L=LEAGUE.conf.autoBidPool;
  const n=1+rng.int(3);
  for(let k=0;k<n;k++){
    // a strong Group of 6 program gets the call up
    const cands=NAMES.filter(t=>G6L.indexOf(u.conf[t])>=0 && u.program[t]>=1600)
      .sort((a,b)=>u.program[b]-u.program[a]).slice(0,8);
    if(!cands.length)break;
    const mover=rng.pick(cands);
    const dest=P4L.filter(c=>size(c)<20).sort((a,b)=>{
      const pa=NAMES.filter(t=>u.conf[t]===a).reduce((s,t)=>s+u.program[t],0)/Math.max(1,size(a));
      const pb=NAMES.filter(t=>u.conf[t]===b).reduce((s,t)=>s+u.program[t],0)/Math.max(1,size(b));
      return pa-pb;
    })[0];
    if(!dest||size(u.conf[mover])<=8)continue;
    moves.push({team:mover,from:u.conf[mover],to:dest});
    u.conf[mover]=dest;
  }
  syncConf(u);
  if(moves.length){u.realignLog=u.realignLog||[];u.realignLog.push({year:year,moves:moves})}
  return moves;
}

const RECRUIT_FOCUS={
  balanced:{l:"Best available", d:"Take the best player on the board at every spot.",
            pos:null, r:0, pot:0},
  trenches:{l:"Win the trenches", d:"Load up on the lines. Slower payoff, sturdier teams.",
            pos:["OT","EDGE","DT"], r:8, pot:0},
  skill:   {l:"Skill players",   d:"Quarterbacks and playmakers. Explosive, and streakier.",
            pos:["QB","RB","WR","WR2"], r:5, pot:0},
  upside:  {l:"Chase upside",    d:"Raw prospects with ceilings. Rough now, dangerous in two years.",
            pos:null, r:-5, pot:14, dev:3.4}
};

/* ============ program budget ============ */
/* A fixed pool each offseason. Everything you fund is something you didn't. */
const BUCKETS=[
 {k:"recruit",  l:"Recruiting",   d:"Better players sign. Pays off in two or three years."},
 {k:"develop",  l:"Development",  d:"Strength staff and position coaches. Your current roster grows faster."},
 {k:"facility", l:"Facilities",   d:"Permanent. Compounds quietly for as long as you're here."},
 {k:"retention",l:"Retention/NIL",d:"Keep your stars from leaving early for the draft."}
];

function budgetPool(u,t,wins){
  const base=6+Math.round((u.program[t]-1150)/150);
  const success=wins>=11?3:wins>=9?2:wins>=7?1:0;
  const fac=Math.floor((u.facility&&u.facility[t]?u.facility[t]:0)/22);
  return Math.max(6,Math.min(20,base+success+fac));
}

function applyBudgetRead(alloc){
  return {recruitBonus:(alloc.recruit||0)*0.30,
          devBonus:(alloc.develop||0)*0.46,
          retention:Math.min(0.62,(alloc.retention||0)*0.055)};
}

function applyBudget(u,t,alloc){
  u.facility=u.facility||{};
  u.facility[t]=(u.facility[t]||0)+(alloc.facility||0)*2.4;
  return {
    recruitBonus:(alloc.recruit||0)*0.30,
    devBonus:(alloc.develop||0)*0.46,
    retention:Math.min(0.62,(alloc.retention||0)*0.055),
    facility:Math.min(520,u.facility[t])
  };
}

function offseasonRosters(u,rng,healthy,elo,rec,choices){
  /* One human or several: each coached program gets its own choices. */
  const U_CH = choices.users || (choices.userTeam?{[choices.userTeam]:choices}:{});
  const chFor = t=>U_CH[t]||null;
  const leavers={};
  choices=choices||{};
  const risers=[],fallers=[],churn={};
  const ut=choices.userTeam;

  if(ut&&choices.coach){
    const c=choices.coach;
    u.coach[ut]={n:c.n,q:c.q,t:0,hired:true,arch:c.arch,rec:c.rec||0};
  }

  NAMES.forEach(t=>{
    const before=u.program[t];
    const c=u.coach[t];
    u.program[t]+=RECRUIT*(elo[t]-u.program[t])
                 +c.q*COACH_BUILD
                 +rng.gauss(0,PROG_NOISE*iscale(u.program[t]));
    u.program[t]=Math.max(P_FLOOR,Math.min(P_CEIL,u.program[t]));
    c.t++;
    const ch=chFor(t);
    const focus=(ch&&ch.recruit)?ch.recruit:"balanced";
    let devMod=(ch&&ch.phil&&PHILOSOPHY[ch.phil])?PHILOSOPHY[ch.phil].dev:0;
    let bud=null;
    if(ch&&ch.budget){
      bud=applyBudget(u,t,ch.budget);
      devMod+=bud.devBonus;
      u.program[t]+=bud.facility*0.20;      // facilities lift the program itself
    }
    const ocq=(u.oc&&u.oc[t])?u.oc[t].q:0, dcq=(u.dc&&u.dc[t])?u.dc[t].q:0;
    churn[t]=developRoster(u,t,rng,RECRUIT_FOCUS[focus],devMod,bud,
                           ch?ch.featured:null,
                           {oc:ocq*0.030, dc:dcq*0.030});
    leavers[t]=churn[t].leaving;
    u.trueBase[t]=rosterElo(u.roster[t])
                 +(c.t<=1?ROOKIE_DIP:0)
                 +rng.gauss(0,ROSTER_NOISE);
    u.perceived[t]=0.58*elo[t]+0.42*u.program[t]+rng.gauss(0,PERCEPT_N);
    const d=u.program[t]-before;
    if(d>35)risers.push([t,Math.round(d)]);
    if(d<-35)fallers.push([t,Math.round(d)]);
  });

  /* Draft night: everyone who left the college game gets sorted out. */
  const draftResult=runDraft(u,rng,u.year,leavers);
  recordAlumni(u,u.year,draftResult.pool);

  /* Every program signs a class each year, whether or not a freshman starts.
     Quality tracks program pull, the coach's recruiting, and your stated focus. */
  u.classAvg=u.classAvg||{};
  const incoming=[];
  NAMES.forEach(t=>{
    const c=u.coach[t];
    const ch2=chFor(t);
    const focus=(ch2&&ch2.recruit)?RECRUIT_FOCUS[ch2.recruit]:RECRUIT_FOCUS.balanced;
    const q=eloToRating(u.program[t])
           +c.q*0.055 +(c.rec||0)*0.55
           +(focus.r||0)*0.45 +(focus.pot||0)*0.12
           +((ch2&&ch2.budget)?applyBudgetRead(ch2.budget).recruitBonus*0.6:0)
           +((ch2&&u.pipeline)?Math.min(4.5,u.pipeline*1.5):0)
           +rng.gauss(0,2.6);
    const signed=6+Math.round(rng.range(0,3));
    incoming.push([t,q,signed]);
    // classes compound: what you sign now shapes who is available later
    const prev=u.classAvg[t]!==undefined?u.classAvg[t]:q;
    u.classAvg[t]=prev*0.62+q*0.38;
  });
  incoming.sort((a,b)=>b[1]-a[1]);
  const classes={};
  incoming.forEach(([t,av,n],i)=>{
    classes[t]={avg:Math.round(av),n:n,rank:i+1,of:incoming.length,
                l:classLabel(i+1,incoming.length)};
  });
  const early={};
  NAMES.forEach(t=>{const x=churn[t].leaving.filter(y=>y.early); if(x.length)early[t]=x});

  if(ut&&choices.phil)u.phil=choices.phil;
  u.year++;
  let realigned=[];
  if(u.nextRealign&&u.year>=u.nextRealign){
    realigned=realign(u,rng,u.year);
    u.nextRealign=u.year+4+rng.int(4);
  }
  risers.sort((a,b)=>b[1]-a[1]); fallers.sort((a,b)=>a[1]-b[1]);
  return {risers:risers.slice(0,5),fallers:fallers.slice(0,5),
          churn:churn,classes:classes,early:early,realigned:realigned,
          draft:draftResult};
}

LEAGUE.offseason={
  newRoster:makeRoster,         // (rng, programElo) -> roster
  run:offseasonRosters,         // (u, rng, healthy, elo, rec, choices) -> report
  recruitFocus:RECRUIT_FOCUS,   // the choices offered on the offseason screen
  budget:{buckets:BUCKETS, pool:budgetPool},
  /* the league's offseason choices, as the offseason screen starts them */
  open(u,t,wins){
    const pool=budgetPool(u,t,wins);
    return {pool:pool, picks:{recruit:"balanced",
      budget:{recruit:Math.ceil(pool/4),develop:Math.floor(pool/4),
              facility:Math.floor(pool/4),retention:pool-Math.ceil(pool/4)-2*Math.floor(pool/4)}}};
  },
  /* ...and as run() reads them */
  choices(P){ return {recruit:P.recruit, budget:P.budget} }
};

/* What a season is judged against, and how it is graded. The grade reads the
   result line (seasonResult or screenResult). */
LEAGUE.goals={
  /* what the job demands, by program strength */
  expectations(p){
    if(p>=1860)return {w:11,l:"A playoff berth. Anything less is a disappointment.",t:"PLAYOFF OR BUST"};
    if(p>=1700)return {w:9,l:"Nine wins and a New Year's bowl. Contend in the conference.",t:"CONTEND"};
    if(p>=1540)return {w:8,l:"Eight wins and a decent bowl. Beat someone you shouldn't.",t:"PUSH FORWARD"};
    if(p>=1400)return {w:6,l:"Get to a bowl game. Six wins keeps everyone happy.",t:"BOWL ELIGIBLE"};
    return {w:4,l:"Show progress. Four wins would be real movement here.",t:"BUILD SOMETHING"};
  },
  isTitle(result){ return /NATIONAL/i.test(result) },
  firstTitle:"First national title of your tenure.",
  grade(wins,losses,result,exp){
    let s=(wins-exp.w)*1.0;
    if(/NATIONAL/i.test(result))s+=5;
    else if(/title game/i.test(result))s+=3;
    else if(/semifinal/i.test(result))s+=2.4;
    else if(/quarterfinal/i.test(result))s+=1.8;
    else if(/first round|Playoff/i.test(result))s+=1.4;
    else if(/^Won the/.test(result))s+=0.8;
    else if(/^Lost the/.test(result))s+=0.2;
    else if(/No bowl|Losing season/.test(result))s-=(exp.w>=6?1.0:0.2);
    const g=s>=4?"A+":s>=2.6?"A":s>=1.6?"A-":s>=0.9?"B+":s>=0.2?"B":s>=-0.6?"B-":
            s>=-1.4?"C+":s>=-2.2?"C":s>=-3.2?"C-":s>=-4.4?"D":"F";
    const l=s>=2.6?"Far beyond what anyone expected.":
            s>=0.9?"Ahead of schedule.":
            s>=-0.6?"About what was expected.":
            s>=-2.2?"Short of the mark.":
            "A bad year, and everyone knows it.";
    return {g:g,l:l};
  }
};

function rivalryName(a,b){

/* ---- series history, kept across seasons ---- */
function seriesKey(a,b){return [a,b].sort().join("~")}

function recordRivalries(u,season){
  u.series=u.series||{};
  const all=[].concat(...season.weeks.map(w=>w.games),season.titles||[],

                      season.rounds.r1,season.rounds.qf,season.rounds.sf,season.rounds.fin):[]);
  all.forEach(g=>{
    const nm=rivalryName(g.home,g.away); if(!nm)return;
    const k=seriesKey(g.home,g.away);
    const s=u.series[k]||(u.series[k]={n:nm,w:{},streak:null,games:[]});
    s.w[g.winner]=(s.w[g.winner]||0)+1;
    if(s.streak&&s.streak.t===g.winner)s.streak.n++;
    else s.streak={t:g.winner,n:1};
    s.games.push({y:season.year,w:g.winner,l:g.loser,
                  s:Math.max(g.hp,g.ap)+"-"+Math.min(g.hp,g.ap)});
    if(s.games.length>25)s.games.shift();
  });
}

/* What the series looks like from one side. */
function seriesFor(u,a,b){
  if(!u||!u.series)return null;
  const s=u.series[seriesKey(a,b)];
  if(!s)return null;
  const mine=s.w[a]||0, theirs=s.w[b]||0;
  return {name:s.n,w:mine,l:theirs,
          streak:s.streak?{team:s.streak.t,n:s.streak.n}:null,
          games:s.games.slice().reverse()};
}

/* Everything we know to be real, from both the transcribed conference slates
   and the confirmed marquee non-conference games. */
const REAL2026=(function(){

  // A team can only play so many non-conference games. Where a real schedule
  // disagrees with this game's alignment (Louisiana Tech is the 2026 example,
  // caught between two conferences), pin only as many as actually fit.
  const nonCount={}; NAMES.forEach(t=>nonCount[t]=0);
  const nonCap=t=>12-((CONF[t]==="SEC"||CONF[t]==="B1G"||CONF[t]==="B12")?9:
                      (CONF[t]==="IND"?0:8));

    if(seen.has(key(h,a)))return;
    if(CONF[h]!==CONF[a]){
      if(CONF[h]!=="IND"&&nonCount[h]>=nonCap(h))return;
      if(CONF[a]!=="IND"&&nonCount[a]>=nonCap(a))return;
      nonCount[h]++; nonCount[a]++;
    }
    seen.add(key(h,a));
    out.push({a:a,h:h,w:g.w,neutral:!!g.neutral,site:g.site||null});
  });

      if(CONF[g.a]!=="IND"&&nonCount[g.a]>=nonCap(g.a))return;
      nonCount[g.h]++; nonCount[g.a]++;
    }
    seen.add(key(g.h,g.a));
    out.push(g);

})();

/* Swap the generated slate around so the confirmed games actually happen. */
function enforceReal(games,rng){
  const key=(x,y)=>[x,y].sort().join("|");
  const has=new Set(games.map(g=>key(g[0],g[1])));
  REAL2026.forEach(R=>{
    if(!NAMES.includes(R.a)||!NAMES.includes(R.h))return;
    if(has.has(key(R.a,R.h))){
      const ex=games.find(g=>key(g[0],g[1])===key(R.a,R.h));
      if(ex){ex[0]=R.a;ex[1]=R.h;ex[3]=!!R.neutral;ex[4]=true;ex[5]=R.w;ex[6]=R.site||null}
      return;
    }
    const sameConf=CONF[R.a]===CONF[R.h];
    const ga=games.map((g,i)=>i).filter(i=>
      (games[i][0]===R.a||games[i][1]===R.a)&&games[i][2]===sameConf);
    const gb=games.map((g,i)=>i).filter(i=>
      (games[i][0]===R.h||games[i][1]===R.h)&&games[i][2]===sameConf);
    rng.shuffle(ga); rng.shuffle(gb);
    let done=false;
    for(const ia of ga){
      if(done)break;
      const pa=games[ia][0]===R.a?games[ia][1]:games[ia][0];
      if(pa===R.h)break;
      for(const ib of gb){
        if(ib===ia)continue;
        const pb=games[ib][0]===R.h?games[ib][1]:games[ib][0];
        if(pb===R.a||pb===pa)continue;
        const legal=sameConf?(CONF[pa]===CONF[pb]):(CONF[pa]!==CONF[pb]);
        if(!legal||has.has(key(pa,pb)))continue;
        has.delete(key(R.a,pa)); has.delete(key(R.h,pb));
        has.add(key(R.a,R.h)); has.add(key(pa,pb));
        [ia,ib].sort((x,y)=>y-x).forEach(i=>games.splice(i,1));
        games.push([R.a,R.h,sameConf,!!R.neutral,true,R.w,R.site||null]);
        games.push([pa,pb,sameConf,false]);
        done=true; break;
      }
    }
  });
  return games;
}

/* Put those games in the week they are actually played, and the right way round. */
function pinRealWeeks(sched,busy,NW_){
  // busy[] must always agree with sched; rebuild it for the teams we touch
  // rather than patching it by hand
  const rebusy=ts=>ts.forEach(t=>{busy[t]=new Set(
    sched.filter(x=>x.home===t||x.away===t).map(x=>x.week))});
  REAL2026.forEach(R=>{
    const g=sched.find(x=>(x.home===R.h&&x.away===R.a)||(x.home===R.a&&x.away===R.h));
    if(!g)return;
    g.neutral=!!R.neutral; g.site=R.site||null; g.real=true;
    if(g.home!==R.h){g.home=R.h; g.away=R.a}          // correct the venue
    if(g.week===R.w)return;
    const A=R.h, B=R.a, from=g.week, to=R.w;
    // anything already occupying that week for either side has to move
    const block=sched.filter(x=>x!==g&&x.week===to&&
      (x.home===A||x.away===A||x.home===B||x.away===B));
    if(block.some(x=>x.real))return;                  // never displace another real game
    // Plan every move against the schedule as it would be, and only commit
    // if all of them fit. Moving some and then giving up left a displaced
    // game sitting on top of this one.
    const occ={};
    const weeksOf=t=>occ[t]||(occ[t]=new Set(sched.filter(x=>x!==g&&block.indexOf(x)<0&&
      (x.home===t||x.away===t)).map(x=>x.week)));
    weeksOf(A).add(to); weeksOf(B).add(to);
    const plan=[];
    for(const x of block){
      const teams=[x.home,x.away];
      let target=-1;
      for(let w=0;w<NW_;w++){
        if(w===to)continue;
        if(teams.every(t=>!weeksOf(t).has(w))){target=w;break}
      }
      if(target<0)return;                             // can't pin this one; leave it
      teams.forEach(t=>weeksOf(t).add(target));
      plan.push([x,target]);
    }
    plan.forEach(([x,w])=>{x.week=w});
    g.week=to;
    rebusy([A,B].concat(...block.map(x=>[x.home,x.away])));
  });
  return sched;
}
function enforceRivalries(games,rng,protectReal){
  const key=(x,y)=>[x,y].sort().join("|");
  const has=new Set(games.map(g=>key(g[0],g[1])));
  RIVALS.forEach(([a,b])=>{
    if(!NAMES.includes(a)||!NAMES.includes(b))return;
    if(has.has(key(a,b)))return;
    const sameConf=CONF[a]===CONF[b];
    // find one game for each that can be re-paired
    const ga=games.map((g,i)=>i).filter(i=>
      (games[i][0]===a||games[i][1]===a) && games[i][2]===sameConf);
    const gb=games.map((g,i)=>i).filter(i=>
      (games[i][0]===b||games[i][1]===b) && games[i][2]===sameConf);
    rng.shuffle(ga); rng.shuffle(gb);
    for(const ia of ga){
      const pa=games[ia][0]===a?games[ia][1]:games[ia][0];
      if(pa===b)break;
      let done=false;
      for(const ib of gb){
        if(ib===ia)continue;
        const pb=games[ib][0]===b?games[ib][1]:games[ib][0];
        if(pb===a||pb===pa)continue;
        // leftovers must be a legal pairing too
        const legal=sameConf?(CONF[pa]===CONF[pb]):(CONF[pa]!==CONF[pb]);
        if(!legal)continue;
        if(has.has(key(pa,pb)))continue;
        has.delete(key(a,pa)); has.delete(key(b,pb));
        has.add(key(a,b)); has.add(key(pa,pb));
        const keep=[ia,ib].sort((x,y)=>y-x);
        keep.forEach(i=>games.splice(i,1));
        games.push([rng.r()<0.5?a:b, rng.r()<0.5?b:a, sameConf, false]);
        const last=games[games.length-1];
        if(last[0]===last[1]){last[0]=a;last[1]=b}
        games.push([pa,pb,sameConf,false]);
        done=true;break;
      }
      if(done)break;
    }
  });
  return games;
}

/* Nobody opens the year with two byes. Pull a later game forward to fill them. */
function fillEarlyByes(sched,busy){
  for(let w=0;w<3;w++){
    NAMES.forEach(t=>{
      if(busy[t].has(w))return;
      const cand=sched.filter(g=>(g.home===t||g.away===t)&&g.week>w+2
        &&!rivalryName(g.home,g.away)&&!g.real);
      for(const g of cand){
        const other=g.home===t?g.away:g.home;
        if(busy[other].has(w))continue;
        const from=g.week;
        busy[t].delete(from); busy[other].delete(from);
        busy[t].add(w); busy[other].add(w);
        g.week=w; return;
      }
    });
  }
  return sched;
}

function lateenRivalries(sched,busy){
  // drag rivalry games toward the end of the year, displacing ordinary games if needed
  const late=[13,12,11,10,9];
  const riv=sched.filter(g=>rivalryName(g.home,g.away)).sort((a,b)=>{
    const ma=MARQUEE.has(rivalryName(a.home,a.away))?0:1;
    const mb=MARQUEE.has(rivalryName(b.home,b.away))?0:1;
    return ma-mb || a.week-b.week;
  });
  riv.forEach(g=>{
    for(const w of late){
      if(w<=g.week)break;
      const A=g.home,B=g.away,from=g.week;
      if(!busy[A].has(w)&&!busy[B].has(w)){
        busy[A].delete(from);busy[B].delete(from);
        busy[A].add(w);busy[B].add(w);g.week=w;return;
      }
      // try to bump the ordinary games sitting in that week
      const block=sched.filter(x=>x!==g&&x.week===w&&
        (x.home===A||x.away===A||x.home===B||x.away===B));
      if(block.length>2||block.some(x=>rivalryName(x.home,x.away)||x.real))continue;
      const ok=block.every(x=>!busy[x.home].has(from)&&!busy[x.away].has(from)
        ||x.home===A||x.away===A||x.home===B||x.away===B);
      if(!ok)continue;
      let moved=true;
      block.forEach(x=>{
        const others=[x.home,x.away].filter(t=>t!==A&&t!==B);
        if(others.some(t=>busy[t].has(from))){moved=false;return}
      });
      if(!moved)continue;
      busy[A].delete(from);busy[B].delete(from);
      block.forEach(x=>{
        [x.home,x.away].forEach(t=>{busy[t].delete(w);busy[t].add(from)});
        x.week=from;
      });
      busy[A].add(w);busy[B].add(w);g.week=w;return;
    }
  });
  return sched;
}

/* What the core may ask about rivalries. */
LEAGUE.rivals={
  name:rivalryName,             // (a, b) -> "the Iron Bowl" or null
  series:seriesFor,             // (u, a, b) -> all-time series record
  record:recordRivalries,       // (u, season) -> bank this season's games
  of:RIVAL_OF                   // team -> [{o: opponent, ...}]
};
/* ============ live game engine ============ */
/* Games are played out drive by drive and the score emerges from them, so a
   decision made in the fourth quarter genuinely changes the ending. */

const DRIVES_PER_TEAM = 12;
const MAX_CALLS = 3;          // how many decisions a single game will ask of you

/* Aggression presets, used both as a pre-game plan and as an in-game choice. */
const AGGR = {
  safe:      {td:-0.050, fg:+0.058, to:-0.070},
  balanced:  {td: 0,     fg: 0,     to: 0},
  aggressive:{td:+0.082, fg:-0.060, to:+0.086}
};

/* Chance of each outcome on one drive, given the gap between the two teams. */
function driveOdds(offElo, defElo, startYd, aggr){
  const x = (offElo - defElo) / 470;
  const field = (startYd - 27) / 100;              // better starting spot helps
  const A = AGGR[aggr] || AGGR.balanced;
  let td = 0.238 + x * 0.115 + field * 0.24 + A.td;
  let fg = 0.170 + x * 0.0227 + field * 0.10 + A.fg;
  let to = 0.135 - x * 0.0339 + A.to;
  td = Math.max(0.02, Math.min(0.62, td));
  fg = Math.max(0.03, Math.min(0.30, fg));
  to = Math.max(0.03, Math.min(0.30, to));
  return {td:td, fg:fg, to:to};
}

function rollDrive(rng, offElo, defElo, startYd, aggr){
  const o = driveOdds(offElo, defElo, startYd, aggr);
  const r = rng.r();
  if (r < o.td) return {pts:7, kind:"TD", stall:100};
  if (r < o.td + o.fg) return {pts:3, kind:"FG", stall:Math.min(92,startYd+Math.round(rng.range(12,40)))};
  if (r < o.td + o.fg + o.to) {
    return {pts:0, kind: rng.r()<0.55 ? "INT" : "FUM",
            stall:Math.min(96,startYd+Math.round(rng.range(0,42)))};
  }
  // the drive stalled: where it died, and how far short, decide the options
  const gain = Math.round(rng.gauss(22,17));
  const stall = Math.max(startYd-6, Math.min(96, startYd+gain));
  const u = rng.r();
  const togo = u<0.24?1 : u<0.42?2 : u<0.56?3 : u<0.68?4 : u<0.78?5 :
               u<0.86?7 : u<0.93?9 : Math.round(rng.range(11,17));
  const s = rng.r();
  let kind = s<0.70 ? "PUNT" : (s<0.86 ? "DOWNS" : "MISS");
  if (stall>=72 && kind==="PUNT") kind="MISS";       // you don't punt from there
  return {pts:0, kind:kind, stall:stall, togo:togo};
}

/* Field-goal success by distance (stall yard -> attempt length). */
function fgOdds(stall){
  const dist = (100-stall) + 17;
  if (dist<=25) return 0.96;
  if (dist<=32) return 0.90;
  if (dist<=40) return 0.80;
  if (dist<=47) return 0.66;
  if (dist<=54) return 0.48;
  return 0.30;
}
function fgDistance(stall){ return (100-stall)+17; }

/* Fourth-down conversion: distance is what matters, quality adjusts it. */
function goOdds(togo, offElo, defElo){
  const base = 0.68 / (1 + 0.165*(Math.max(1,togo)-1));
  const adj = (offElo-defElo)/3400;
  return Math.max(0.12, Math.min(0.82, base + adj));
}

/* Where a drive starts, given how the previous one ended. */
function nextStart(rng, prevKind){
  if (prevKind === "TD" || prevKind === "FG") return Math.round(rng.gauss(26, 6));
  if (prevKind === "PUNT") return Math.round(Math.max(4, Math.min(60, rng.gauss(24, 10))));
  if (prevKind === "INT" || prevKind === "FUM") return Math.round(Math.max(4, Math.min(75, rng.gauss(42, 16))));
  if (prevKind === "DOWNS") return Math.round(Math.max(10, Math.min(80, rng.gauss(48, 12))));
  if (prevKind === "MISS") return Math.round(Math.max(15, Math.min(60, rng.gauss(32, 8))));
  return Math.round(rng.gauss(26, 6));
}

/* Play a whole game out, drive by drive. If a decision hook is supplied it may
   pause; otherwise the game runs start to finish. */
function playGame(rng, eloH, eloA, planH, planA, opts){
  opts=opts||{};
  const st={
    h:0, a:0, drives:[], prev:"TD", idx:0,
    total:DRIVES_PER_TEAM*2,
    aggrH:planH||"balanced", aggrA:planA||"balanced",
    baseH:planH||"balanced", baseA:planA||"balanced",
    used:{}, rng:rng
  };
  for(let i=0;i<st.total;i++){
    if(st.endAfter!==undefined&&i>st.endAfter)break;   // clock ran out
    const home=i%2===0;
    const start=nextStart(rng,st.prev);
    const q=Math.min(4,Math.floor(i/(st.total/4))+1);
    let aggr=home?st.aggrH:st.aggrA;
    let forced=null;
    if(opts.decide){
      const isUser = home ? opts.userIsHome : !opts.userIsHome;
      if(isUser){
        const ctx={q:q, idx:i, total:st.total, startYd:start, used:st.used, rng:rng,
                   mine: opts.userIsHome?st.h:st.a, theirs: opts.userIsHome?st.a:st.h};
        const dp=decisionPoint(ctx,true);
        if(dp){
          const choice=opts.decide(dp,ctx);
          st.used[dp.k]=true;
          if(dp.k==="fourth")forced=choice;
          else if(choice==="push")aggr="aggressive";
          else if(choice==="sit"){
            aggr="safe";
            // running clock takes possessions off the board for both teams
            st.endAfter=Math.min(st.total-1, i+2);   // running clock really does end games
          }
          else aggr=home?st.baseH:st.baseA;
          if(home)st.aggrH=aggr; else st.aggrA=aggr;
        }
      }
    }
    let res;
    if(forced==="kick"){
      res = rng.r()< (0.62 + (start-55)*0.006) ? {pts:3,kind:"FG"} : {pts:0,kind:"MISS"};
    }else if(forced==="punt"){
      res = {pts:0,kind:"PUNT"};
    }else if(forced==="go"){
      const conv = rng.r() < 0.52;
      res = conv ? rollDrive(rng, home?eloH:eloA, home?eloA:eloH, Math.min(88,start+6), "aggressive")
                 : {pts:0,kind:"DOWNS"};
      if(conv&&res.pts===0)res={pts:0,kind:res.kind};
    }else{
      res = rollDrive(rng, home?eloH:eloA, home?eloA:eloH, start, aggr);
    }
    if(home)st.h+=res.pts; else st.a+=res.pts;
    st.drives.push({home:home,q:q,start:start,pts:res.pts,kind:res.kind,
                    h:st.h,a:st.a,n:i+1,aggr:aggr});
    st.prev=res.kind;
  }
  // overtime rather than an arbitrary tiebreak
  let ot=0;
  while(st.h===st.a&&ot<24){
    ot++;
    const home=(ot%2===1);
    const r=rollDrive(rng,home?eloH:eloA,home?eloA:eloH,75,"aggressive");
    if(home)st.h+=r.pts; else st.a+=r.pts;
    st.drives.push({home:home,q:5,start:75,pts:r.pts,kind:r.kind,
                    h:st.h,a:st.a,n:st.total+ot,aggr:"aggressive",note:"overtime",ot:true});
  }
  return st;
}

/* A game you step through one drive at a time. next() returns either a drive,
   a decision that needs an answer, or done. */

/* A decision offered when a drive dies in makeable territory. */
function fourthDownCall(stall, togo, offElo, defElo){
  const dist = fgDistance(stall);
  const yard = Math.max(1, 100 - stall);
  const gp = Math.round(goOdds(togo, offElo, defElo)*100);
  const fp = Math.round(fgOdds(stall)*100);
  const where = stall>=50 ? `their ${yard}` : `your own ${stall}`;
  if (stall >= 62) {
    return {k:"fourth", h:`Fourth and ${togo} at ${where}`,
      b:`A ${dist}-yard attempt from here, or keep the drive alive.`,
      opts:[["go",`Go for it \u00b7 ${gp}%`],
            ["kick",`Kick it \u00b7 ${dist} yds \u00b7 ${fp}%`],
            stall<78?["punt","Pin them deep"]:null].filter(Boolean)};
  }
  if (stall >= 44) {
    return {k:"fourth", h:`Fourth and ${togo} at ${where}`,
      b:`${dist} yards is a long way for the kicker. Go for it, or flip the field.`,
      opts:[["go",`Go for it \u00b7 ${gp}%`],["punt","Punt it away"]]};
  }
  return null;
}

/* After a touchdown, when the arithmetic makes two points interesting. */
function twoPointCall(mine, theirs, q, late){
  const d = (mine + 7) - theirs;
  if (q < 3) return null;
  if ([-5,-2,-1,1,2,4,5].indexOf(d) >= 0) {
    return {k:"two", h:`Kick it, or go for two`,
      b:`A conversion puts you at ${d + 1}; the kick leaves it at ${d}.`,
      opts:[["kick","Kick the extra point"],["two","Go for two"]]};
  }
  return null;
}

function makeLiveGame(rng, eloH, eloA, planH, planA, userIsHome){
  const st={h:0,a:0,drives:[],prev:"TD",i:0,total:DRIVES_PER_TEAM*2,
            aggrH:planH||"balanced",aggrA:planA||"balanced",
            baseH:planH||"balanced",baseA:planA||"balanced",
            used:{},calls:0,rng:rng,endAfter:undefined,
            ask:null,stage:null,pend:null,answer:null};

  function push(home,q,start,res,aggr){
    if(home)st.h+=res.pts; else st.a+=res.pts;
    const drive={home:home,q:q,start:start,pts:res.pts,kind:res.kind,
                 h:st.h,a:st.a,n:st.i+1,aggr:aggr,note:res.note||null,
                 converted:(res.converted===undefined?null:res.converted),
                 togo:res.togo||null};
    st.drives.push(drive);
    st.prev=res.kind; st.i++; st.pend=null; st.stage=null;
    return drive;
  }

  st.next=function(){
    const regOver = st.i>=st.total||(st.endAfter!==undefined&&st.i>st.endAfter);
    if(regOver){
      if(st.h!==st.a||st.otGuard>24)
        return {done:true,h:st.h,a:st.a,drives:st.drives};
      // overtime, both teams from the opponent's 25
      st.otGuard=(st.otGuard||0)+1;
      const home=(st.otGuard%2===1);
      const r=rollDrive(rng,home?eloH:eloA,home?eloA:eloH,75,"aggressive");
      if(home)st.h+=r.pts; else st.a+=r.pts;
      st.drives.push({home:home,q:5,start:75,pts:r.pts,kind:r.kind,
                      h:st.h,a:st.a,n:st.total+st.otGuard,aggr:"aggressive",
                      note:"overtime",ot:true,converted:null,togo:null});
      return {drive:st.drives[st.drives.length-1],h:st.h,a:st.a};
    }

    const i=st.i, home=i%2===0;
    const isUser = home ? userIsHome : !userIsHome;
    const q=Math.min(4,Math.floor(i/(st.total/4))+1);
    const mine=userIsHome?st.h:st.a, theirs=userIsHome?st.a:st.h;
    const late = i>=st.total-7;
    const offE=home?eloH:eloA, defE=home?eloA:eloH;

    // ---- resume from a decision ----
    if(st.stage){
      const choice=st.answer; st.answer=null;
      const P=st.pend, stage=st.stage;
      if(stage==="strategy"){
        st.stage=null;
        if(choice==="push"){ if(home)st.aggrH="aggressive"; else st.aggrA="aggressive" }
        else if(choice==="sit"){
          if(home)st.aggrH="safe"; else st.aggrA="safe";
          st.endAfter=Math.min(st.total-1,i+3);
        } else { if(home)st.aggrH=st.baseH; else st.aggrA=st.baseA }
        // fall through and play the drive normally
      } else if(stage==="fourth"){
        let res;
        if(choice==="go"){
          const tg=P.res.togo||3;
          if(rng.r()<goOdds(tg,offE,defE)){
            // converted: the drive carries on from there
            const r2=rollDrive(rng,offE,defE,Math.min(90,P.res.stall+Math.max(2,tg)),"aggressive");
            res=r2;
            res.converted=true;
            res.note = r2.pts>0 ? `converted on fourth and ${tg}, then scored`
                                : `converted on fourth and ${tg}, drive stalled later`;
          } else {
            res={pts:0,kind:"DOWNS",stall:P.res.stall,
                 converted:false,
                 note:`went for it on fourth and ${tg} and came up short`};
          }
        } else if(choice==="kick"){
          res = rng.r()<fgOdds(P.res.stall)
            ? {pts:3,kind:"FG",stall:P.res.stall,note:fgDistance(P.res.stall)+"-yd kick is good"}
            : {pts:0,kind:"MISS",stall:P.res.stall,note:fgDistance(P.res.stall)+"-yd kick is no good"};
        } else res={pts:0,kind:"PUNT",stall:P.res.stall,note:"punted it away"};
        return {drive:push(home,P.q,P.start,res,P.aggr),h:st.h,a:st.a};
      } else if(stage==="two"){
        let res;
        if(choice==="two"){
          res = rng.r()<0.47 ? {pts:8,kind:"TD",stall:100,note:"two-point conversion good"}
                             : {pts:6,kind:"TD",stall:100,note:"two-point try failed"};
        } else {
          res = rng.r()<0.97 ? {pts:7,kind:"TD",stall:100}
                             : {pts:6,kind:"TD",stall:100,note:"extra point missed"};
        }
        return {drive:push(home,P.q,P.start,res,P.aggr),h:st.h,a:st.a};
      }
    }

    const start=nextStart(rng,st.prev);

    // ---- strategic call before the snap ----
    if(isUser&&st.calls<MAX_CALLS&&!st.stage){
      const ctx={q:q,idx:i,total:st.total,startYd:start,used:st.used,rng:rng,
                 mine:mine,theirs:theirs};
      const dp=decisionPoint(ctx,true);
      if(dp){
        st.used[dp.k]=true; st.calls++;
        st.stage="strategy"; st.pend={q:q,start:start};
        return {ask:dp,mine:mine,theirs:theirs,q:q};
      }
    }

    const aggr=home?st.aggrH:st.aggrA;
    const res=rollDrive(rng,offE,defE,start,aggr);

    // ---- a call the situation creates ----
    if(isUser&&st.calls<MAX_CALLS){
      if((res.kind==="PUNT"||res.kind==="DOWNS"||res.kind==="MISS")&&(st.used.fourth||0)<2){
        const dp=fourthDownCall(res.stall,res.togo||3,offE,defE);
        if(dp){
          st.used.fourth=(st.used.fourth||0)+1; st.calls++;
          st.stage="fourth"; st.pend={q:q,start:start,res:res,aggr:aggr};
          return {ask:dp,mine:mine,theirs:theirs,q:q};
        }
      }
      if(res.kind==="TD"&&!st.used.two){
        const dp=twoPointCall(mine,theirs,q,late);
        if(dp){
          st.used.two=true; st.calls++;
          st.stage="two"; st.pend={q:q,start:start,res:res,aggr:aggr};
          return {ask:dp,mine:mine,theirs:theirs,q:q};
        }
      }
    }
    return {drive:push(home,q,start,res,aggr),h:st.h,a:st.a};
  };
  st.reply=function(v){ st.answer=v; };
  return st;
}

/* Is this a moment worth stopping the game for? */
function decisionPoint(state, isUser){
  if (!isUser) return null;
  const q=state.q, idx=state.idx, total=state.total, mine=state.mine,
        theirs=state.theirs, startYd=state.startYd, used=state.used;
  const late = idx >= Math.floor(total * 0.78);
  const veryLate = idx >= total - 7;
  const diff = mine - theirs;

  if (veryLate && diff < 0 && diff >= -16 && !used.chase) {
    return {
      k:"chase",
      h:`Down ${-diff} with the clock going`,
      b:`Time to force it, or keep playing your game and hope for a stop.`,
      opts:[["push","Open it up"],["normal","Stay patient"]]
    };
  }
  if (veryLate && diff > 0 && diff <= 14 && !used.protect) {
    return {
      k:"protect",
      h:`Up ${diff} late`,
      b:`Sit on it and shorten the game, or keep the throttle down.`,
      opts:[["sit","Bleed the clock"],["keep","Keep attacking"]]
    };
  }
  if (q === 3 && idx === Math.floor(total/2) && Math.abs(diff) >= 17 && !used.half) {
    return {
      k:"half",
      h: diff < 0 ? `Down ${-diff} at the break` : `Up ${diff} at the break`,
      b: diff < 0 ? `You need something different in the second half.`
                  : `You can put your foot down or start managing this.`,
      opts: diff < 0 ? [["push","Take more risks"],["normal","Stick with it"]]
                     : [["sit","Manage it"],["normal","Keep going"]]
    };
  }
  return null;
}

/* Apply a decision to the rest of the game. */
function applyChoice(state, key, choice){
  state.used[key] = true;
  if (key === "fourth") {
    state.pendingFourth = choice;
  } else if (choice === "push") {
    state.aggr = "aggressive";
  } else if (choice === "sit") {
    state.aggr = "safe";
  } else if (choice === "keep" || choice === "normal") {
    state.aggr = state.basePlan;
  }
}
