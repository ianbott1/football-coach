/* Pearl is a dog roughly one time in six. Unlike the Bears, her advice
   survives it — the dog bit wraps the read rather than replacing it, so you
   never lose the balanced opinion just because a squirrel went past. */
const PEARL_BEFORE=[`Woof! `,`SQUIRREL. `,`Ooh, ooh, ooh! `,
  `Was that the treat bag? ... Anyway. `,`Someone's at the door! ... No. False alarm. `];
const PEARL_AFTER=[` Woof!`,` (Tail going. Very hard.)`,` Can we go outside after?`,
  ` Also, is it dinner? It smells like dinner.`,` I'm going to spin in a circle about this.`,
  ` Ball. BALL. Sorry \u2014 the actual ball. Carry on.`];
function pearlSay(line, seed){
  const n=Math.abs(seed|0);
  if(n%6!==1)return line;
  return (n%12===1)
    ? PEARL_BEFORE[Math.floor(n/6)%PEARL_BEFORE.length]+line
    : line+PEARL_AFTER[Math.floor(n/6)%PEARL_AFTER.length];
}

function bearYell(kind, seed){
  const n=Math.abs(seed|0);
  // roughly one call in four, they lose the thread entirely
  if(n%4===2){
    const d=BEAR_YELL.distracted;
    return d[Math.floor(n/4)%d.length];
  }
  const pool=BEAR_YELL[kind]||BEAR_YELL.fourth;
  return pool[n%pool.length];
}

function staffTake(dp, ctx){
  const opts = dp.opts.map(o=>o[0]);
  const has = k=>opts.indexOf(k)>=0;
  const pct = k=>{
    const o=dp.opts.find(x=>x[0]===k); if(!o)return null;
    const m=o[1].match(/(\d+)%/); return m?+m[1]:null;
  };
  const diff = (ctx.mine||0)-(ctx.theirs||0);
  const seed = (ctx.mine||0)*7+(ctx.theirs||0)*3+(ctx.q||0);
  const R=[];

  if(dp.k==="fourth"){
    const go=pct("go")||0, kick=pct("kick");
    // Anacondish: the points are worth it only if the kick is actually makeable
    const mid = (kick!==null && kick>=52) ? "kick"
              : (go>=48 ? "go" : (has("punt")?"punt":"kick"));
    // L: a long kick is a risk too. She wants the safest available outcome.
    const safe = (kick!==null && kick>=58) ? "kick"
               : (has("punt") ? "punt" : (kick!==null ? "kick" : "go"));
    R.push({who:"bears", pick:"go",
      line:bearYell(kick!==null?"fourthKick":"fourthPunt", seed)});
    R.push({who:"pearl", pick:mid, line:pearlSay(mid==="kick" ? `${kick}% for three points! I'll take three points.`
      : mid==="go"  ? `They've been brilliant all day. Let them finish it!`
      :               `Nothing lovely on offer here. Give it back and go get it again.`,seed)});
    R.push({who:"capy", pick:safe, line:
      safe==="punt" ? (kick!==null
          ? `It seems to me ${kick}% is rather more of a wish than a plan. I'd punt.`
          : `That is, I do believe, simply too far. Give it back and defend.`)
      : safe==="kick" ? `I do believe ${kick}% is about as comfortable as we're likely to get.`
      :                 `I'm not enthusiastic, but nothing safer appears to be on offer.`});
  }
  else if(dp.k==="two"){
    R.push({who:"bears", pick:"two", line:bearYell("two",seed)});
    R.push({who:"pearl", pick: (diff+7)===1||(diff+7)===-1 ? "two":"kick", line:pearlSay((diff+7)===1||(diff+7)===-1 ? `One point either way is agony! Let's just settle it.`
                                  : `The kick keeps it simple, and simple is lovely.`,seed)});
    R.push({who:"capy", pick:"kick", line:`A missed conversion would be, I fear, one more thing to worry about.`});
  }
  else if(dp.k==="chase"){
    R.push({who:"bears", pick:"push", line:bearYell("chase",seed)});
    R.push({who:"pearl", pick: diff<=-4 ? "push":"normal", line:pearlSay(diff<=-4
      ? `More than a field goal down \u2014 come on, let's go and get it!`
      : `It's one score! We've got time. No need to panic.`,seed)});
    R.push({who:"capy", pick:"normal", line:`One rather suspects each additional risk compounds against us. Stay measured.`});
  }
  else if(dp.k==="protect"){
    R.push({who:"bears", pick:"keep", line:bearYell("protect",seed)});
    R.push({who:"pearl", pick:"keep", line:pearlSay(diff>=13
      ? `We're playing so well! Let's just keep playing.`
      : `Whatever we did to get here \u2014 more of that, please.`,seed)});
    R.push({who:"capy", pick:"sit", line:`I would gently suggest fewer possessions. Fewer possessions, fewer catastrophes.`});
  }
  else if(dp.k==="half"){
    const down = diff<0;
    R.push({who:"bears", pick: down?"push":"normal", line:bearYell("half",seed)});
    R.push({who:"pearl", pick:"normal", line:pearlSay(down
      ? `They're not playing badly! Let's just play a bit better.`
      : `This is going great. Exactly as we are, please.`,seed)});
    R.push({who:"capy", pick: down?"normal":"sit", line: down
      ? `If I may \u2014 panicking at this juncture tends to worsen the scoreline, not mend it.`
      : `We have, I think, got what we came for. I'd rather not risk anybody now.`});
  }
  return R;
}

/* A line for the moments outside a game. */
function staffAside(kind, data){
  const L={
    depth:[["bears",`Play the kid. Chaos is a ladder.`],
           ["pearl",`He's waited so patiently for this. Let him play!`],
           ["capy",`It seems to me changing the quarterback mid-season rarely goes as people imagine.`]],
    staff:[["bears",`SACK HIM. On the field. In front of everyone.`],
           ["pearl",`Everyone has bad seasons. Maybe he just needs a bit of help.`],
           ["capy",`I do believe I'd want to be very sure before we start pulling things apart.`]],
    win:  [["bears",`WE ARE UNSTOPPABLE. Say it back to us.`],
           ["pearl",`I'm SO proud of them. Every single one.`],
           ["capy",`Lovely. Though I am, I confess, already a little worried about next week.`]],
    loss: [["bears",`Rigged. Absolutely rigged. We're appealing.`],
           ["pearl",`It's alright! There's another one next week.`],
           ["capy",`I did rather have a feeling. I didn't want to say.`]],
    title:[["bears",`RINGS. RINGS FOR THE BEARS. We did most of it.`],
           ["pearl",`Look at them all crying. It's the loveliest thing.`],
           ["capy",`Champions. I have, I should say, prepared some remarks. They are quite long.`]]
  };
  const set=L[kind]; if(!set)return null;
  const i=Math.abs((data|0))%set.length;
  return {who:set[i][0], line:set[i][1]};
}

/* ============ watching a game ============ */
/* Reconstructs a full drive chart that adds up to the real final score, using
   the actual players on both rosters. Seeded from the game itself, so it never
   touches the season's RNG. */

/* Break a final score into plausible scoring plays. Safeties are only used when
   the number genuinely can't be reached any other way (2, 4 and 5 points). */
const BAD_REMAINDER=new Set([1,2,4,5]);

function scoreParts(P,rng){
  if(P===0)return [];
  if(P===2)return [2];
  if(P===4)return [2,2];
  if(P===5)return [2,3];
  const out=[]; let left=P, guard=0;
  while(left>0&&guard++<40){
    const opts=[];
    if(left>=7){opts.push(7,7,7,7,7,7)}                // touchdowns carry the load
    if(left>=6&&rng.r()<0.12){opts.push(6)}            // missed extra point
    if(left>=3){opts.push(3,3,3)}
    if(left>=8&&rng.r()<0.055){opts.push(8)}           // a two-point try by choice
    let ok=opts.filter(v=>{const r=left-v; return r===0||!BAD_REMAINDER.has(r)});
    if(!ok.length&&left>=8)ok=[8];                     // 8 is the only way out of 8
    if(!ok.length){                                    // forced into a safety
      if(left===1&&out.length){out[out.length-1]+=1;break}
      out.push(left>=2?2:left); left-=2; continue;
    }
    const v=ok[rng.int(ok.length)];
    out.push(v); left-=v;
  }
  return out;
}

const PUNT_LINES=["three and out","forced to punt","stalls out, punt",
  "goes backwards, punt","can't move it, punt"];

function scoreText(rng,off,def,pts){
  const nm=i=>off&&off[i]?off[i].n:"the offense";
  const dn=i=>def&&def[i]?def[i].n:"the defense";
  if(pts===3)return `${Math.round(rng.range(19,52))}-yd field goal`;
  if(pts===2)return rng.r()<0.5?`tackled in the end zone \u2014 safety`
    :`snap sails out of the end zone \u2014 safety`;
  if(pts===6&&rng.r()<0.5)return `${dn(8)} ${Math.round(rng.range(18,88))}-yd pick six`;
  const yds=Math.round(rng.range(2,64));
  const two=pts===8?", two-point conversion good":"";
  if(rng.r()<0.56)return `${nm(0)} ${yds}-yd TD pass to ${nm(rng.r()<0.62?2:3)}${two}`;
  if(rng.r()<0.82)return `${nm(1)} ${yds}-yd TD run${two}`;
  return `${nm(0)} ${Math.round(rng.range(1,14))}-yd TD run${two}`;
}

/* Every drive, scoring or not. start/end are yards from the offense's own goal. */
function gameScript(g,rosterHome,rosterAway,seed){
  const rng=new RNG((seed>>>0)||1);
  const hsc=scoreParts(g.hp,rng), asc=scoreParts(g.ap,rng);
  // both teams get the same number of possessions, so the game trades properly
  const target=Math.max(hsc.length,asc.length,Math.round(rng.range(10,13)));
  const items=[];
  hsc.forEach(p=>items.push({side:"home",pts:p}));
  asc.forEach(p=>items.push({side:"away",pts:p}));
  for(let i=hsc.length;i<target;i++)items.push({side:"home",pts:0});
  for(let i=asc.length;i<target;i++)items.push({side:"away",pts:0});

  // teams trade possession; scoring drives fall wherever they fall
  const hq=rng.shuffle(items.filter(d=>d.side==="home"));
  const aq=rng.shuffle(items.filter(d=>d.side==="away"));
  const seq=[]; let turn=rng.r()<0.5?"home":"away";
  while(hq.length||aq.length){
    const q=turn==="home"?hq:aq;
    if(q.length)seq.push(q.shift());
    else seq.push((turn==="home"?aq:hq).shift());
    turn = turn==="home"?"away":"home";
  }
  // lay them across four quarters with a clock that runs down
  const per=Math.ceil(seq.length/4);
  seq.forEach((d,i)=>{
    d.q=Math.min(4,Math.floor(i/per)+1);
    const within=i-(d.q-1)*per;
    d.sec=Math.max(8,Math.round(895-(within+1)*(880/(per+1))-rng.range(0,40)));
  });

  // "runs out the clock" only belongs on the last drive of a half
  const lastOfQ={};
  seq.forEach((d,i)=>{lastOfQ[d.q]=i});

  let H=0,A=0;
  return seq.map((d,idx)=>{
    const endsHalf = (idx===lastOfQ[2]) || (idx===lastOfQ[4]);
    const off=d.side==="home"?rosterHome:rosterAway;
    const def=d.side==="home"?rosterAway:rosterHome;
    const start=Math.round(Math.max(3,Math.min(78,rng.gauss(27,13))));
    let end,outcome,text;
    let possSide=d.side;
    if(d.pts>0){
      if(d.side==="home")H+=d.pts; else A+=d.pts;
      outcome = d.pts===2?"SAF" : d.pts===3?"FG" : "TD";
      if(d.pts===2){
        possSide = d.side==="home"?"away":"home";     // the trapped offence
        end = 0;                                      // its own goal line
      }else end = 100;
      text = scoreText(rng,off,def,d.pts);
    }else{
      const roll=rng.r();
      if(roll<0.52){outcome="PUNT"; end=Math.min(92,start+Math.round(rng.range(-2,34)));
        text=rng.pick(PUNT_LINES);}
      else if(roll<0.64){outcome="DOWNS"; end=Math.min(95,start+Math.round(rng.range(8,48)));
        text="turned over on downs";}
      else if(roll<0.75){outcome="MISS"; end=Math.min(88,start+Math.round(rng.range(20,55)));
        text=`${Math.round(rng.range(38,56))}-yd attempt is no good`;}
      else if(roll<0.87){outcome="INT"; end=Math.min(96,start+Math.round(rng.range(0,45)));
        text=`intercepted by ${def&&def[8]?def[8].n:"the defense"}`;}
      else if(roll<0.95){outcome="FUM"; end=Math.min(96,start+Math.round(rng.range(0,42)));
        text=`fumble, recovered by ${def&&def[7]?def[7].n:"the defense"}`;}
      else if(endsHalf){outcome=d.q===2?"HALF":"END";
        end=Math.min(90,start+Math.round(rng.range(0,38)));
        text=d.q===2?"runs out the half":"runs out the clock";}
      else {outcome="PUNT"; end=Math.min(92,start+Math.round(rng.range(-2,34)));
        text=rng.pick(PUNT_LINES);}
    }
    const mm=Math.floor(d.sec/60), ss=d.sec%60;
    return {
      n:idx+1, q:d.q, clock:mm+":"+(ss<10?"0":"")+ss, sec:d.sec,
      team:possSide==="home"?g.home:g.away, side:possSide,
      scoredBy:d.pts===2?(d.side==="home"?g.home:g.away):null,
      pts:d.pts, outcome:outcome, text:text, start:start, end:end,
      yards:Math.max(0,end-start),
      ball: possSide==="home" ? 100-end : end, // 0 = away end zone, 100 = home end zone
      h:H, a:A
    };
  });
}

/* End zones carry the full team name, sized to fit rather than chopped. */
function endzoneName(t){
  const s=String(t).replace(/[^A-Za-z& ]/g,"").trim().toUpperCase();
  const n=s.length;
  const size = n<=6?8.2 : n<=9?6.8 : n<=12?5.6 : n<=15?4.7 : 4.0;
  return {t:s,size:size};
}
function venueLabelSize(v){
  const n=String(v).length;
  return n<=8?16 : n<=12?13 : n<=16?10.5 : 8.6;
}

function fieldSVG(g,drive,homeColor,awayColor,venue){
  const x=v=>17+(v/100)*166;
  const ball=drive?Math.max(0,Math.min(100,drive.ball)):50;

  for(let y=10;y<=90;y+=10)marks.push(`<line x1="${x(y)}" y1="9" x2="${x(y)}" y2="95"
    stroke="rgba(233,229,218,.26)" stroke-width="0.7"/>`);

    stroke="rgba(233,229,218,.30)" stroke-width="0.6"/>`);
  const nums=[];
  [10,20,30,40,60,70,80,90].forEach(y=>{
    nums.push(`<text x="${x(y)}" y="26" fill="rgba(233,229,218,.24)" font-size="6.5"
      font-family="monospace" text-anchor="middle">${Math.min(y,100-y)}</text>`);
    nums.push(`<text x="${x(y)}" y="90" fill="rgba(233,229,218,.24)" font-size="6.5"
      font-family="monospace" text-anchor="middle">${Math.min(y,100-y)}</text>`);
  });
  return `<svg class="field" viewBox="0 0 200 104" xmlns="http://www.w3.org/2000/svg"
      role="img" aria-label="field position">
    <rect x="17" y="9" width="166" height="86" fill="rgba(70,181,131,.10)"/>
    <rect x="1" y="9" width="16" height="86" fill="${awayColor}" opacity="0.85"/>
    <rect x="183" y="9" width="16" height="86" fill="${homeColor}" opacity="0.85"/>
    ${(()=>{const A=endzoneName(g.away),H=endzoneName(g.home);return `
    <text x="9" y="52" fill="#F2EFE7" font-size="${A.size}" font-family="'Barlow Condensed',sans-serif"
      font-weight="700" letter-spacing="0.6" text-anchor="middle"
      transform="rotate(-90 9 52)">${A.t}</text>
    <text x="191" y="52" fill="#F2EFE7" font-size="${H.size}" font-family="'Barlow Condensed',sans-serif"
      font-weight="700" letter-spacing="0.6" text-anchor="middle"
      transform="rotate(90 191 52)">${H.t}</text>`})()}
    ${marks.join("")}${nums.join("")}
    <text x="100" y="60" fill="rgba(233,229,218,.26)" font-size="${venueLabelSize(venue)}"
      font-family="'Barlow Condensed',Impact,sans-serif" font-weight="700"
      text-anchor="middle" letter-spacing="1.5">${String(venue).toUpperCase()}</text>
    <rect x="17" y="9" width="166" height="86" fill="none"
      stroke="rgba(233,229,218,.38)" stroke-width="1"/>
    ${drive?`<line x1="${x(ball)}" y1="9" x2="${x(ball)}" y2="95"
        stroke="var(--sodium)" stroke-width="1.5" opacity=".9"/>
      <ellipse cx="${x(ball)}" cy="52" rx="5" ry="3.2" fill="var(--sodium)"/>`:""}
  </svg>`;
}

function isBigGame(g,team,seaRankMap,rivalName){
  if(!g)return false;
  if(rivalName)return true;
  if(g.title||g.site)return true;
  const opp=g.home===team?g.away:g.home;
  if((seaRankMap[opp]||999)<=25)return true;
  if(g.margin<=7)return true;
  return false;
}

/* Gameplan. Variance is the real lever: an underdog wants chaos, a favourite
   wants the game to be boring. Aggression buys variance at a small cost in
   expected margin; playing safe does the reverse. */
const INTERIM_Q=-18;     // replacement-level coordinator
const FEATURE_EDGE=16;   // Elo, roughly 0.75 of a point of spread

const PLANS={
  safe:      {sd:0.76, edge:-14, l:"Play it safe",  d:"Shorten the game. Fewer swings either way."},
  balanced:  {sd:1.00, edge:0,   l:"Balanced",      d:"Play your game."},
  aggressive:{sd:1.38, edge:-8,  l:"Take risks",    d:"Open it up. Higher ceiling, lower floor."}
};


/* ============ Season state machine ============ */
class Season{
  constructor(u,seed){
    this.rng=new RNG(seed);
    this.year=u.year;
    this.elo=Object.assign({},u.perceived);
    this.preseason=Object.assign({},u.perceived);
    this.roster=u.roster?JSON.parse(JSON.stringify(u.roster)):null;
    const ph=(u.phil&&PHILOSOPHY[u.phil])?PHILOSOPHY[u.phil].elo:0;
    const tb=Object.assign({},u.trueBase);
    NAMES.forEach(t=>{tb[t]=(tb[t]||0)});   // staff already folded in at the offseason
    if(u.userTeam&&ph)tb[u.userTeam]=(tb[u.userTeam]||0)+ph;
    this.featCost=0;
    this.talent=new Talent(this.rng,tb,this.roster);
    this.poll=new LEAGUE.Ranking(Object.assign({},u.perceived));
    this.sched=LEAGUE.buildSchedule(this.rng,u.perceived,u.year);
    this.rec={};this.confrec={};
    NAMES.forEach(t=>{this.rec[t]=[0,0];this.confrec[t]=[0,0]});
    this.step=0; this.weeks=[]; this.champion=null;
    LEAGUE.post.init(this);                // the league's postseason state
    this.userTeam=null; this.featured=null;
    this.hfa={}; NAMES.forEach(t=>this.hfa[t]=homeField(u,t));
    // staff apply during the season, so a mid-year change actually does something
    this.staffAdj={}; NAMES.forEach(t=>this.staffAdj[t]=staffElo(u,t));
    this.oc=u.oc?JSON.parse(JSON.stringify(u.oc)):null;
    this.dc=u.dc?JSON.parse(JSON.stringify(u.dc)):null;
    this.midFired={}; this._u=u; this.plan="balanced"; this.planLog={};
  }
  /* The regular season is the core's; everything after it is the league's,
     one phase per step, in the order LEAGUE.post.phases gives. */
  get phase(){
    if(this.step<LEAGUE.weeks)return "week";
    return LEAGUE.post.phases[this.step-LEAGUE.weeks]||"done";
  }
  rankMap(){return this.poll.rankMap()}
  /* The two effective ratings for a scheduled game, so it can be played live. */
  matchupElo(g,plan){
    const a=g.home,b=g.away,neutral=g.neutral;
    const w=Math.min(this.step,LEAGUE.weeks);
    const P=PLANS[plan]||PLANS.balanced;
    let edge=0;
    if(this.userTeam===a||this.userTeam===b)
      edge=(this.userTeam===a?1:-1)*P.edge;
    if(this.featured!==null&&this.featured!==undefined&&this.roster){
      const pl=this.roster[this.userTeam]&&this.roster[this.userTeam][this.featured];
      const hurt=this.talent.active(this.userTeam).some(x=>x.idx===this.featured);
      if(pl&&!hurt)edge+=(this.userTeam===a?1:-1)*FEATURE_EDGE;
    }
    const venue=neutral?0:((this.hfa&&this.hfa[a])||LEAGUE.tuning.hfa)-LEAGUE.tuning.hfa;
    return {
      h:this.talent.eff(a,w)+(this.staffAdj[a]||0)+(neutral?0:LEAGUE.tuning.hfa)+venue+edge,
      a:this.talent.eff(b,w)+(this.staffAdj[b]||0)
    };
  }
  /* Make a change now: the interim is worse, and you hire properly in the offseason. */
  fireCoordinator(team,side){
    const st=side==="oc"?this.oc:this.dc;
    if(!st||!st[team]||this.midFired[side])return false;
    const old=st[team];
    // an interim is replacement level: a step down from anyone decent,
    // a genuine upgrade on someone who is drowning
    st[team]={n:"Interim staff", q:INTERIM_Q, t:0, s:old.s, interim:true, was:old.n};
    this.staffAdj[team]=(this.oc&&this.dc&&this.oc[team]&&this.dc[team])
      ? (this.oc[team].q*OFF_SHARE+this.dc[team].q*DEF_SHARE)*STAFF_ELO
      : this.staffAdj[team];
    this.midFired[side]=true;
    return true;
  }
  _resolve(a,b,neutral,extra){
    let sd=1, edge=0;
    if(this.userTeam===a||this.userTeam===b){
      const P=PLANS[this.plan]||PLANS.balanced;
      sd=P.sd;
      edge=(this.userTeam===a?1:-1)*P.edge;
      this.planLog[this.step]=this.plan;
      // a featured player gets the ball more, and it shows on Saturdays
      if(this.featured!==null&&this.featured!==undefined&&this.roster){
        const pl=this.roster[this.userTeam][this.featured];
        const hurt=this.talent.active(this.userTeam).some(x=>x.idx===this.featured);
        if(pl&&!hurt)edge+=(this.userTeam===a?1:-1)*FEATURE_EDGE;
      }
    }
    const venue=neutral?0:((this.hfa&&this.hfa[a])||LEAGUE.tuning.hfa)-LEAGUE.tuning.hfa;
    const w=Math.min(this.step,LEAGUE.weeks);
    const eloH=this.talent.eff(a,w)+(this.staffAdj[a]||0)+(neutral?0:LEAGUE.tuning.hfa)+venue+edge;
    const eloA=this.talent.eff(b,w)+(this.staffAdj[b]||0);
    const isUser=(this.userTeam===a||this.userTeam===b);
    const plan=PLANS[this.plan]?this.plan:"balanced";
    // a game already played out live: match on the user's team so the ordering
    // a round happens to use can never lose the result
    const list=this.forcedList||(this.forced?[this.forced]:[]);
    const fi=list.findIndex(F=>(a===F.team||b===F.team)&&(a===F.other||b===F.other));
    if(fi>=0){
      const F=list[fi];
      list.splice(fi,1);
      this.forcedList=list; this.forced=null;
      const userScore = F.mine, oppScore = F.theirs;
      let fh = (a===F.team)?userScore:oppScore;
      let fa = (a===F.team)?oppScore:userScore;
      let fm = fh-fa;
      if(fm===0){ if(this.rng.r()<0.5)fh+=3; else fa+=3; fm=fh-fa; }  // should never fire
      const win=fm>0?a:b, lose=fm>0?b:a;
      const sh=eloUpdate(this.elo[win],this.elo[lose],Math.abs(fm),(win===a)&&!neutral,neutral);
      this.elo[win]+=sh; this.elo[lose]-=sh;
      this.rec[win][0]++; this.rec[lose][1]++;
      if(this.roster){
        [[a,fh,fa],[b,fa,fh]].forEach(pair=>{
          const tm=pair[0],pf=pair[1],pa2=pair[2];
          const hurt=new Set(this.talent.active(tm).map(x=>x.idx));
          POS.forEach((P,i)=>{
            const pl=hurt.has(i)?this.roster[tm][BK(i)]:this.roster[tm][i];
            if(!pl)return;
            if(!pl.st2)pl.st2=blankStats(P.p);
            const line=gameStats(this.rng,pl,i,pf,pa2,pf>pa2);
            addStats(pl.st2,line);
            pl.last={line:line,pos:P.p,week:this.step,team:tm};
          });
        });
      }
      const hf=(x,o)=>Math.max(0,Math.min(x,Math.round(x*(0.38+((x*7+o*3+fh+fa)%11)/34))));
      return Object.assign({home:a,away:b,hp:fh,ap:fa,hh:hf(fh,fa),ah:hf(fa,fh),
        neutral:neutral,winner:win,loser:lose,margin:Math.abs(fm),
        shift:Math.round(sh),drives:F.drives},extra||{});
    }
    const gs=playGame(this.rng,eloH,eloA,
      this.userTeam===a?plan:"balanced",
      this.userTeam===b?plan:"balanced",
      isUser&&this.decideHook?{decide:this.decideHook,userIsHome:this.userTeam===a}:null);
    let hp=gs.h, ap=gs.a, m=hp-ap;
    if(m===0){ if(this.rng.r()<0.5)hp+=3; else ap+=3; m=hp-ap; }   // safety net only
    this.lastDrives=gs.drives;
    if(isUser)this._userDrives=gs.drives;
    const win=m>0?a:b, lose=m>0?b:a;
    const sh=eloUpdate(this.elo[win],this.elo[lose],Math.abs(m),(win===a)&&!neutral,neutral);
    this.elo[win]+=sh;this.elo[lose]-=sh;
    this.rec[win][0]++;this.rec[lose][1]++;
    if(this.roster){
      [[a,hp,ap],[b,ap,hp]].forEach(pair=>{
        const tm=pair[0], pf=pair[1], pa=pair[2];
        const hurt=new Set(this.talent.active(tm).map(x=>x.idx));
        POS.forEach((P,i)=>{
          // an injured starter's snaps go to his backup
          const pl=hurt.has(i)?this.roster[tm][BK(i)]:this.roster[tm][i];
          if(!pl)return;
          if(!pl.st2)pl.st2=blankStats(P.p);
          const line=gameStats(this.rng,pl,i,pf,pa,pf>pa);
          addStats(pl.st2,line);
          pl.last={line:line,pos:P.p,week:this.step,team:tm};
        });
      });
    }
    const hf=(x,o)=>Math.max(0,Math.min(x,Math.round(x*(0.38+((x*7+o*3+hp+ap)%11)/34))));
    return Object.assign({home:a,away:b,hp:hp,ap:ap,
      hh:hf(hp,ap),ah:hf(ap,hp),neutral:neutral,
      winner:win,loser:lose,margin:Math.abs(m),shift:Math.round(sh)},extra||{});
  }
  advance(){
    this.prevRank=this.rankMap();
    const p=this.phase;
    if(p==="week")this._week();
    else if(p!=="done")this[LEAGUE.post.run[p]]();
    this.step++;
  }
  _week(){
    const w=this.step, prev=this.rankMap(), out=[];
    this.sched.filter(g=>g.week===w).forEach(g=>{
      const r=this._resolve(g.home,g.away,g.neutral,{conf:g.conf});
      if(g.conf){this.confrec[r.winner][0]++;this.confrec[r.loser][1]++}
      r.hrank=prev[g.home];r.arank=prev[g.away];
      r.hrec=this.rec[g.home][0]+"-"+this.rec[g.home][1];
      r.arec=this.rec[g.away][0]+"-"+this.rec[g.away][1];
      if(this.userTeam===g.home||this.userTeam===g.away)r.drives=this._userDrives;
      out.push(r);
    });
    this.poll.update(out,this.elo);
    this._award(w,out);                   // the league's awards
    this.talent.advance(w+1);
    out.sort((a,b)=>Math.min(a.hrank,a.arank)-Math.min(b.hrank,b.arank));
    this.weeks.push({label:`Week ${w+1}`,date:LEAGUE.dates[w],games:out,
      poll:this.top25(prev),standings:this.standings(prev)});
  }
  top25(prev){
    return this.poll.order().slice(0,25).map((t,i)=>({
      rank:i+1,team:t,conf:CONF[t],rec:this.rec[t][0]+"-"+this.rec[t][1],
      prev:prev?prev[t]:0,delta:prev&&prev[t]?prev[t]-(i+1):null}));
  }
  standings(prev){
    const out={};
    LEAGUE.conf.order.forEach(c=>{
      out[c]=NAMES.filter(t=>CONF[t]===c).sort((x,y)=>{
        const px=this.confrec[x][0]/Math.max(1,this.confrec[x][0]+this.confrec[x][1]);
        const py=this.confrec[y][0]/Math.max(1,this.confrec[y][0]+this.confrec[y][1]);
        return py-px||this.confrec[y][0]-this.confrec[x][0]||this.elo[y]-this.elo[x];
      }).map(t=>({team:t,cr:this.confrec[t][0]+"-"+this.confrec[t][1],
                  rec:this.rec[t][0]+"-"+this.rec[t][1],rank:prev?prev[t]:0}));
    });
    return out;
  }
  /* Fold this season's numbers into every player's career line. */
  bankCareers(u){
    // the season's box scores live on this Season's roster copy; the careers
    // they feed belong to the universe's roster, so read one and write the other
    if(!u.roster||!this.roster)return;
    NAMES.forEach(t=>{
      const live=this.roster[t]||[], keep=u.roster[t]||[];
      keep.forEach((pl,i)=>{
        if(!pl)return;
        if(pl.from===undefined||pl.from===null)pl.from=this.year-(pl.c||0);
        pl.peak=Math.max(pl.peak||0,pl.r||0);
        const src=live[i];
        if(!src||!src.st2||src.n!==pl.n)return;      // same man, same slot
        if(!pl.car){pl.car=blankStats(POS[i%POS.length].p); pl.car.yrs=0}
        addStats(pl.car,src.st2);
        pl.car.yrs=(pl.car.yrs||0)+1;
      });
    });
  }
  healthy(){const h={};NAMES.forEach(t=>h[t]=this.talent.base[t]+this.talent.slope[t]*LEAGUE.weeks);return h}
  myGame(team,wk){
    const W=this.weeks[wk]; if(!W)return null;
    return W.games.find(g=>g.home===team||g.away===team)||null;
  }
  nextGame(team){
    const g=this.sched.find(g=>g.week===this.step&&(g.home===team||g.away===team));
    return g||null;
  }
}

/* A league adds its postseason (and anything else it needs) to Season here.
   Non-enumerable, like the methods the class defines itself. */
function extendSeason(methods){
  Object.getOwnPropertyNames(methods).forEach(k=>Object.defineProperty(
    Season.prototype,k,{value:methods[k],writable:true,configurable:true,enumerable:false}));
}
/* ============ postseason: college football ============ */
/* Conference championship week, the selection show, bowl season and a
   twelve-team playoff. The core Season plays the regular season and hands
   every later step to the phase named here. */
LEAGUE.post={
  phases:["titles","selection","bowls","r1","qf","sf","final"],
  run:{titles:"_titles",selection:"_select",bowls:"_bowls",
       r1:"_r1",qf:"_qf",sf:"_sf",final:"_final"},
  init(sea){
    sea.champs={}; sea.titles=[];
    sea.field=[]; sea.seeds={}; sea.selRec={}; sea.notes={};
    sea.rounds={r1:[],qf:[],sf:[],fin:[]}; sea.firstOut=[];
    sea.bowls=[]; sea.bowlPairs=null;
  }
};

extendSeason({
  buttonLabel(){
    switch(this.phase){
      case "week":return `Play Week ${this.step+1}`;
      case "titles":return "Play Conference Championships";
      case "selection":return "Selection Show";
      case "bowls":return "Play Bowl Season";
      case "r1":return "Play First Round";
      case "qf":return "Play Quarterfinals";
      case "sf":return "Play Semifinals";
      case "final":return "Play National Championship";
      default:return "Enter the offseason";
    }
  },
  /* The exact home/away pairing for the user's next postseason game, matching
     how each round actually resolves, so it can be played out live. */
  postMatchup(team){
    const p=this.phase;
    if(p==="titles"){
      const c=CONF[team]; if(c==="IND")return null;
      const rank=(x,y)=>{
        const px=this.confrec[x][0]/Math.max(1,this.confrec[x][0]+this.confrec[x][1]);
        const py=this.confrec[y][0]/Math.max(1,this.confrec[y][0]+this.confrec[y][1]);
        return py-px||this.confrec[y][0]-this.confrec[x][0]||this.elo[y]-this.elo[x];
      };
      const mem=this.titleField(c,rank);
      if(mem[0]!==team&&mem[1]!==team)return null;
      return {home:mem[0],away:mem[1],neutral:true,label:LEAGUE.conf.names[c]+" Championship"};
    }
    if(p==="bowls"){
      const pr=(this.bowlPairs||[]).find(x=>x.a===team||x.b===team);
      if(!pr)return null;
      return {home:pr.a,away:pr.b,neutral:true,label:pr.name};
    }
    if(p==="r1"){
      const sd=this.seeds[team]; if(!sd||sd<=4)return null;
      const pair=[[5,12],[6,11],[7,10],[8,9]].find(x=>x[0]===sd||x[1]===sd);
      if(!pair)return null;
      return {home:this.field[pair[0]-1],away:this.field[pair[1]-1],neutral:false,
              label:"First Round"};
    }
    if(p==="qf"){
      const w={}; this.rounds.r1.forEach(g=>{w[Math.min(g.hseed,g.aseed)]=g.winner});
      const map=[["Rose Bowl",1,8],["Sugar Bowl",2,7],["Fiesta Bowl",3,6],["Peach Bowl",4,5]];
      for(const m of map){
        const h=this.field[m[1]-1], a=w[m[2]];
        if(h===team||a===team)return {home:h,away:a,neutral:true,label:m[0]};
      }
      return null;
    }
    if(p==="sf"){
      const q=this.rounds.qf.map(g=>g.winner);
      if(q.indexOf(team)<0)return null;
      const o=q.slice().sort((a,b)=>this.seeds[a]-this.seeds[b]);
      if(team===o[0]||team===o[3])return {home:o[0],away:o[3],neutral:true,label:"Cotton Bowl"};
      return {home:o[1],away:o[2],neutral:true,label:"Orange Bowl"};
    }
    if(p==="final"){
      const f=this.rounds.sf.map(g=>g.winner).sort((a,b)=>this.seeds[a]-this.seeds[b]);
      if(f.indexOf(team)<0)return null;
      return {home:f[0],away:f[1],neutral:true,label:"National Championship"};
    }
    return null;
  },
  /* Who plays for a conference title: division winners where divisions exist,
     otherwise the top two in the table. */
  titleField(c,rank){
    const all=NAMES.filter(t=>CONF[t]===c);
    if(hasDivisions(c)){
      const names=divisionNames(c);
      const winners=names.map(dn=>
        all.filter(t=>divisionOf(this._u||null,t)===dn).sort(rank)[0]).filter(Boolean);
      if(winners.length>=2)return winners.slice(0,2);
    }
    return all.slice().sort(rank);
  },
  _titles(){
    const prev=this.rankMap();
    LEAGUE.conf.order.forEach(c=>{
      const rank=(x,y)=>{
        const px=this.confrec[x][0]/Math.max(1,this.confrec[x][0]+this.confrec[x][1]);
        const py=this.confrec[y][0]/Math.max(1,this.confrec[y][0]+this.confrec[y][1]);
        return py-px || this.confrec[y][0]-this.confrec[x][0] || this.elo[y]-this.elo[x];
      };
      const mem=this.titleField(c,rank);
      const r=this._resolve(mem[0],mem[1],true,{conf:true,title:LEAGUE.conf.names[c]+" Championship"});
      r.hrank=prev[mem[0]];r.arank=prev[mem[1]];
      r.hrec=this.rec[mem[0]][0]+"-"+this.rec[mem[0]][1];
      r.arec=this.rec[mem[1]][0]+"-"+this.rec[mem[1]][1];
      this.champs[c]=r.winner; this.titles.push(r);
    });
    this.poll.update(this.titles,this.elo);
    this.weeks.push({label:"Championship Week",date:"Dec 5",games:this.titles,
      poll:this.top25(prev),standings:this.weeks[this.weeks.length-1].standings});
  },
  _select(){
    const order=this.poll.order(), rk={};order.forEach((t,i)=>rk[t]=i+1);
    const f=[];
    LEAGUE.playoff.autoBids.forEach(c=>{f.push(this.champs[c]);
      this.notes[this.champs[c]]=LEAGUE.conf.names[c]+" champion"});
    const g6=LEAGUE.conf.autoBidPool.map(c=>this.champs[c]).sort((a,b)=>rk[a]-rk[b])[0];
    f.push(g6); this.notes[g6]=LEAGUE.conf.names[CONF[g6]]+" champion";
    const ind=LEAGUE.playoff.independent;
    if(rk[ind.team]<=ind.withinRank&&f.indexOf(ind.team)<0){
      f.push(ind.team);this.notes[ind.team]=ind.note}
    for(const t of order){if(f.length>=LEAGUE.playoff.size)break;
      if(f.indexOf(t)<0){f.push(t);if(!this.notes[t])this.notes[t]="At-large"}}
    f.sort((a,b)=>rk[a]-rk[b]);
    this.field=f; f.forEach((t,i)=>this.seeds[t]=i+1);
    this.cfpRank=rk;
    NAMES.forEach(t=>this.selRec[t]=this.rec[t][0]+"-"+this.rec[t][1]);
    this.firstOut=order.filter(t=>f.indexOf(t)<0).slice(0,4);
    this.pairBowls();
  },
  /* Matchups are announced on Selection Day; the games come later. */
  pairBowls(){
    const rk=this.poll.rankMap();
    const pool=NAMES.filter(t=>this.rec[t][0]>=6 && this.field.indexOf(t)<0)
                    .sort((a,b)=>rk[a]-rk[b]);
    const pairs=[]; let bi=0;
    while(pool.length>=2 && bi<LEAGUE.bowls.length){
      const a=pool.shift();
      let j=0;
      for(let k=0;k<Math.min(6,pool.length);k++){
        if(CONF[pool[k]]!==CONF[a]){j=k;break}
      }
      const b=pool.splice(j,1)[0];
      pairs.push({name:LEAGUE.bowls[bi++],a:a,b:b,
                  ra:this.rec[a][0]+"-"+this.rec[a][1],
                  rb:this.rec[b][0]+"-"+this.rec[b][1],
                  rka:rk[a],rkb:rk[b]});
    }
    this.bowlPairs=pairs;
    this.snubbed=pool.slice();
  },
  _bowls(){
    (this.bowlPairs||[]).forEach(p=>{
      const g=this._resolve(p.a,p.b,true,{title:p.name,bowl:true});
      g.hrank=p.rka;g.arank=p.rkb;g.hrec=p.ra;g.arec=p.rb;
      this.bowls.push(g);
    });
    this.poll.update(this.bowls,this.elo);
  },
  myBowl(team){return this.bowls.find(g=>g.home===team||g.away===team)||null},
  /* What the user's team faces next once the regular season is over.
     Every one of these is determined the moment the previous round ends. */
  postNext(team){
    const p=this.phase;
    if(p==="titles"){
      const c=CONF[team]; if(c==="IND")return null;
      const rk2=(x,y)=>{
        const px=this.confrec[x][0]/Math.max(1,this.confrec[x][0]+this.confrec[x][1]);
        const py=this.confrec[y][0]/Math.max(1,this.confrec[y][0]+this.confrec[y][1]);
        return py-px||this.confrec[y][0]-this.confrec[x][0]||this.elo[y]-this.elo[x];
      };
      const mem=this.titleField(c,rk2);
      if(mem[0]===team||mem[1]===team)
        return {label:LEAGUE.conf.names[c]+" Championship",
                opp:mem[0]===team?mem[1]:mem[0],neutral:true};
      return null;
    }
    if(p==="bowls"){
      const pr=(this.bowlPairs||[]).find(x=>x.a===team||x.b===team);
      if(!pr)return null;
      return {label:pr.name,opp:pr.a===team?pr.b:pr.a,neutral:true};
    }
    const sd=this.seeds[team];
    if(!sd)return null;
    if(p==="r1"){
      if(sd<=4)return null;
      const opp={5:12,12:5,6:11,11:6,7:10,10:7,8:9,9:8}[sd];
      return {label:"First Round",opp:this.field[opp-1],
              neutral:false,home:sd<opp};
    }
    if(p==="qf"){
      const w={}; this.rounds.r1.forEach(g=>w[Math.min(g.hseed,g.aseed)]=g.winner);
      const map=[[1,8,"Rose Bowl"],[2,7,"Sugar Bowl"],[3,6,"Fiesta Bowl"],[4,5,"Peach Bowl"]];
      for(const m of map){
        const a=this.field[m[0]-1], b=w[m[1]];
        if(a===team&&b)return {label:m[2],opp:b,neutral:true};
        if(b===team)return {label:m[2],opp:a,neutral:true};
      }
      return null;
    }
    if(p==="sf"){
      const q=this.rounds.qf.map(g=>g.winner);
      if(q.indexOf(team)<0)return null;
      const o=q.slice().sort((a,b)=>this.seeds[a]-this.seeds[b]);
      if(team===o[0])return {label:"Cotton Bowl",opp:o[3],neutral:true};
      if(team===o[3])return {label:"Cotton Bowl",opp:o[0],neutral:true};
      if(team===o[1])return {label:"Orange Bowl",opp:o[2],neutral:true};
      if(team===o[2])return {label:"Orange Bowl",opp:o[1],neutral:true};
      return null;
    }
    if(p==="final"){
      const f=this.rounds.sf.map(g=>g.winner);
      if(f.indexOf(team)<0)return null;
      return {label:"National Championship",opp:f.find(x=>x!==team),neutral:true};
    }
    return null;
  },
  _br(a,b,neutral,site){
    const r=this._resolve(a,b,neutral,{site:site});
    r.hseed=this.seeds[a];r.aseed=this.seeds[b];
    r.hrec=this.rec[a][0]+"-"+this.rec[a][1];
    r.arec=this.rec[b][0]+"-"+this.rec[b][1];
    return r;
  },
  _r1(){
    [[5,12],[6,11],[7,10],[8,9]].forEach(([h,l])=>
      this.rounds.r1.push(this._br(this.field[h-1],this.field[l-1],false,
        "at "+this.field[h-1])));
    this.poll.update(this.rounds.r1,this.elo);
  },
  _qf(){
    const w={};this.rounds.r1.forEach(g=>{w[Math.min(g.hseed,g.aseed)]=g.winner});
    [["Rose Bowl",1,8],["Sugar Bowl",2,7],["Fiesta Bowl",3,6],["Peach Bowl",4,5]]
      .forEach(([bowl,top,key])=>{
        this.rounds.qf.push(this._br(this.field[top-1],w[key],true,bowl))});
    this.poll.update(this.rounds.qf,this.elo);
  },
  _sf(){
    const q=this.rounds.qf.map(g=>g.winner);
    const s=q.slice().sort((a,b)=>this.seeds[a]-this.seeds[b]);
    this.rounds.sf.push(this._br(s[0],s[3],true,"Cotton Bowl"));
    this.rounds.sf.push(this._br(s[1],s[2],true,"Orange Bowl"));
    this.poll.update(this.rounds.sf,this.elo);
  },
  _final(){
    const f=this.rounds.sf.map(g=>g.winner)
      .sort((a,b)=>this.seeds[a]-this.seeds[b]);
    const g=this._br(f[0],f[1],true,"Allegiant Stadium, Las Vegas");
    this.rounds.fin.push(g); this.champion=g.winner;
    this.poll.update([g],this.elo);
  },
  /* How the season ended for one team, in a line. */
  seasonResult(my){
    const made=this.field.indexOf(my)>=0;
    let result="Missed the playoff";
    const bowl=this.myBowl(my);
    if(bowl)result=(bowl.winner===my?"Won the ":"Lost the ")+bowl.title;
    else if(this.field.indexOf(my)<0)result=this.rec[my][0]>=6?"Bowl snub":"No bowl game";
    if(this.champion===my)result="NATIONAL CHAMPIONS";
    else if(made){
      const lost=[].concat(this.rounds.fin,this.rounds.sf,this.rounds.qf,this.rounds.r1)
        .find(g=>g.loser===my);
      result=lost?("Eliminated in the "+(this.rounds.fin.indexOf(lost)>=0?"national title game":
        this.rounds.sf.indexOf(lost)>=0?"semifinals":
        this.rounds.qf.indexOf(lost)>=0?"quarterfinals":"first round")):"Made the playoff";
    }
    return result;
  },
  /* The postseason, flattened for the history book. */
  postRecord(){
    const confChamps={}; Object.keys(this.champs).forEach(c=>confChamps[c]=this.champs[c]);
    const bowlOf={}; this.bowls.forEach(g=>{
      bowlOf[g.winner]=["W",g.title]; bowlOf[g.loser]=["L",g.title]});
    const post={}, pnote={};
    const bump=(t,won)=>{post[t]=post[t]||[0,0]; post[t][won?0:1]++};
    this.bowls.forEach(g=>{
      bump(g.winner,true); bump(g.loser,false);
      pnote[g.winner]="Won the "+g.title; pnote[g.loser]="Lost the "+g.title;});
    [["first round",this.rounds.r1],["quarterfinals",this.rounds.qf],
     ["semifinals",this.rounds.sf],["national title game",this.rounds.fin]]
     .forEach(([nm,gs])=>gs.forEach(g=>{
       bump(g.winner,true); bump(g.loser,false);
       pnote[g.loser]="Playoff \u2014 lost in the "+nm;}));
    if(this.champion)pnote[this.champion]="National champions";
    const cfpOf={}; this.field.forEach(t=>cfpOf[t]=this.seeds[t]);
    return {confChamps,bowlOf,post,pnote,cfpOf};
  },
  /* ---- what the core UI asks about a finished or running postseason ---- */
  /* postseason games, most important round first */
  postPools(){
    return [this.rounds.fin,this.rounds.sf,this.rounds.qf,this.rounds.r1,this.bowls,this.titles];
  },
  /* one team's postseason games in the order played, with a label each */
  postGamesFor(team){
    const post=[];
    this.titles.forEach(g=>{if(g.home===team||g.away===team)post.push([g,g.title])});
    this.bowls.forEach(g=>{if(g.home===team||g.away===team)post.push([g,g.title])});
    [["First Round",this.rounds.r1],["Quarterfinal",this.rounds.qf],
     ["Semifinal",this.rounds.sf],["National Championship",this.rounds.fin]]
     .forEach(([n,gs])=>gs.forEach(g=>{if(g.home===team||g.away===team)post.push([g,n])}));
    return post;
  },
  /* national title, playoff berth, conference title */
  honours(team){
    return {natl:this.champion===team,playoff:this.field.indexOf(team)>=0,
            conf:Object.keys(this.champs).some(c=>this.champs[c]===team)};
  },
  confChampions(){return this.champs},
  /* The result line the offseason screen grades on. KNOWN BUG, kept so the
     split changes nothing: it differs from seasonResult (every playoff team is
     just "Playoff"), so the grade shown here can differ from the grade the
     history book records. */
  screenResult(my){
    return this.champion===my?"NATIONAL":(this.field.indexOf(my)>=0?"Playoff":
      (this.myBowl(my)?(this.myBowl(my).winner===my?"Won the ":"Lost the ")+this.myBowl(my).title
       :this.rec[my][0]>=6?"No bowl":"Losing season"));
  }
});
/* ============ awards: college football ============ */
/* The Heisman race and the all-conference teams. The core calls _award after
   every week's games; mvpRace(n) is the award race, best first. */
extendSeason({
  allConfAll(){
    const out={};
    LEAGUE.conf.order.forEach(c=>{out[c]=this.allConference(c)});
    return out;
  },
  _award(w,games){
    if(!this.roster)return;
    const won={};
    games.forEach(g=>{won[g.winner]=1;won[g.loser]=0});
    NAMES.forEach(t=>{
      if(won[t]===undefined)return;                    // bye week
      const wp=this.rec[t][0]/Math.max(1,this.rec[t][0]+this.rec[t][1]);
      this.roster[t].forEach((pl,i)=>{
        if(!pl||!pl.st2||!pl.st2.g)return;
        const P=POS[i%POS.length];
        pl.st=pl.st2.g;
        // voters reward production, and reward it more on a winning team
        pl.prod=statProd(P.p,pl.st2)*LEAGUE.awards.weights[P.p]*(0.72+wp*0.52);
      });
    });
  },
  mvpRace(n){
    if(!this.roster)return [];
    const all=[];
    NAMES.forEach(t=>this.roster[t].forEach((pl,i)=>{
      if(pl&&(pl.st||0)>=6)all.push({t:t,n:pl.n,p:pl.p,r:pl.r,c:pl.c,
        prod:pl.prod||0,line:statLine(pl.p,pl.st2),
        rec:this.rec[t][0]+"-"+this.rec[t][1]});
    }));
    all.sort((a,b)=>b.prod-a.prod);
    return all.slice(0,n||10);
  },
  allConference(conf){
    if(!this.roster)return [];
    const out=[];
    POS.forEach((P,i)=>{
      const best=NAMES.filter(t=>CONF[t]===conf)
        .map(t=>({t:t,pl:this.roster[t][i]}))
        .sort((a,b)=>(b.pl.prod||0)-(a.pl.prod||0))[0];
      if(best)out.push({pos:P.p,team:best.t,n:best.pl.n,r:best.pl.r,c:best.pl.c});
    });
    return out;
  }
});
/* ============ draft night and the record book ============ */
/* Four years of development should end somewhere. Players who leave get a
   permanent entry in the program's record book, and the good ones get drafted
   in front of everybody. */


const DRAFT_ROUNDS=7, PICKS_PER_ROUND=32;

/* How good a prospect looks: what he is, plus what he did. */
function prospectScore(d, rng){
  const prod = d.car ? statProd(d.p, d.car) : 0;
  const yrs  = (d.car && d.car.yrs) ? d.car.yrs : 1;
  const perYr = prod / Math.max(1, yrs);
  const early = d.early ? 6 : 0;              // leaving early signals confidence
  const start = d.starter ? 4 : 0;
  return (d.peak||d.r)*0.82 + perYr*0.16 + early + start + rng.gauss(0,9.5);
}

/* Run the draft across every departing player in the country. */
function runDraft(u, rng, year, leavers){
  const pool=[];
  Object.keys(leavers).forEach(team=>{
    leavers[team].forEach(d=>pool.push(Object.assign({team:team},d)));
  });
  pool.forEach(d=>{d.score=prospectScore(d,rng)});
  pool.sort((a,b)=>b.score-a.score);

  const order=rng.shuffle(LEAGUE.draftTeams.slice());
  const picks=[];
  const total=DRAFT_ROUNDS*PICKS_PER_ROUND;
  for(let i=0;i<Math.min(total,pool.length);i++){
    const d=pool[i];
    const round=Math.floor(i/PICKS_PER_ROUND)+1;
    const inRound=(i%PICKS_PER_ROUND)+1;
    d.draft={round:round, pick:inRound, overall:i+1,
             nfl:order[(i+round)%order.length], year:year};
    picks.push(d);
  }
  pool.slice(total).forEach(d=>{d.draft=null});
  return {picks:picks, pool:pool};
}

/* Everyone who left, drafted or not, goes into the record book for good. */
function recordAlumni(u, year, pool){
  u.alumni=u.alumni||{};
  pool.forEach(d=>{
    const t=d.team;
    if(!t)return;
    const rec={
      n:d.n, p:d.p, from:d.from!==null&&d.from!==undefined?d.from:(year-((d.car&&d.car.yrs)||1)),
      to:year, peak:d.peak||d.r, yrs:(d.car&&d.car.yrs)||1,
      early:!!d.early, featured:!!d.featured, draft:d.draft||null
    };
    // keep the finished sentence rather than the whole stat object: a record
    // book of 132 programs over 40 seasons has to stay small enough to save
    rec.line=alumniLine({p:d.p,car:d.car,yrs:rec.yrs});
    u.alumni[t]=u.alumni[t]||[];
    // over decades the name generator repeats itself; a program that produces
    // two Brock Guillorys gets a second-generation one rather than a duplicate
    let suffix=0;
    while(u.alumni[t].some(x=>x.n===rec.n)){
      suffix++;
      rec.n = d.n + (suffix===1?" II":suffix===2?" III":" "+(suffix+1));
    }
    u.alumni[t].push(rec);
    const cap=u.alumni[t];
    if(cap.length>40){
      cap.sort((a,b)=>{
        const ad=a.draft?a.draft.overall:9999, bd=b.draft?b.draft.overall:9999;
        return ad-bd || b.peak-a.peak;
      });
      cap.length=40;                         // the 40 most notable stay for good
    }
  });
}

/* A one-line career summary from the accumulated stat line. */
function alumniLine(a){
  if(a.line)return a.line;
  const c=a.car; if(!c)return `${a.yrs} season${a.yrs===1?"":"s"}`;
  const P=a.p, n=x=>(x||0).toLocaleString();
  if(P==="QB")   return `${n(c.pyd)} yds, ${c.ptd||0} TD, ${c.int||0} INT`;
  if(P==="RB")   return `${n(c.ryd)} rush yds, ${c.rtd||0} TD`;
  if(P==="WR"||P==="WR2") return `${c.rec||0} catches, ${n(c.cyd)} yds, ${c.ctd||0} TD`;
  if(P==="EDGE"||P==="DT") return `${c.sck||0} sacks, ${c.tkl||0} tackles`;
  if(P==="LB")   return `${c.tkl||0} tackles, ${c.tfl||0} for loss`;
  if(P==="CB"||P==="S") return `${c.ints||0} INT, ${c.pd||0} passes defended`;
  if(P==="OT")   return `${c.ska||0} sacks allowed in ${a.yrs} season${a.yrs===1?"":"s"}`;
  return `${a.yrs} season${a.yrs===1?"":"s"}`;
}

function draftLabel(d){
  if(!d)return "Undrafted";
  if(d.overall===1)return `No. 1 overall, ${d.nfl}`;
  return `Round ${d.round}, pick ${d.pick} \u2014 ${d.nfl}`;
}

/* Career leaders in the categories people actually argue about. */
const LEADER_CATS=[
  {k:"pyd", label:"Passing yards",   pos:["QB"]},
  {k:"ptd", label:"Passing TD",      pos:["QB"]},
  {k:"ryd", label:"Rushing yards",   pos:["RB"]},
  {k:"rtd", label:"Rushing TD",      pos:["RB"]},
  {k:"cyd", label:"Receiving yards", pos:["WR","WR2"]},
  {k:"rec", label:"Receptions",      pos:["WR","WR2"]},
  {k:"tkl", label:"Tackles",         pos:["EDGE","DT","LB","CB","S"]},
  {k:"sck", label:"Sacks",           pos:["EDGE","DT"]},
  {k:"ints",label:"Interceptions",   pos:["CB","S"]}
];

/* Alumni only keep a finished sentence, so the numbers are parsed back out of
   it. Cheap, and it keeps the save small. */
function leaderValue(a, cat){
  if(!a.line)return 0;
  const L=a.line;
  const grab=re=>{const m=L.match(re); return m?+m[1].replace(/,/g,""):0};
  switch(cat.k){
    case "pyd": return grab(/([\d,]+) yds,/);
    case "ptd": return grab(/([\d,]+) TD/);
    case "ryd": return grab(/([\d,]+) rush yds/);
    case "rtd": return grab(/rush yds, ([\d,]+) TD/);
    case "cyd": return grab(/catches, ([\d,]+) yds/);
    case "rec": return grab(/([\d,]+) catches/);
    case "tkl": return grab(/([\d,]+) tackles/);
    case "sck": return grab(/([\d,]+) sacks/);
    case "ints":return grab(/([\d,]+) INT/);
  }
  return 0;
}

function programLeaders(u, team){
  const list=(u.alumni&&u.alumni[team])?u.alumni[team]:[];
  const out=[];
  LEADER_CATS.forEach(cat=>{
    const pool=list.filter(a=>cat.pos.indexOf(a.p)>=0)
      .map(a=>({a:a, v:leaderValue(a,cat)}))
      .filter(x=>x.v>0)
      .sort((x,y)=>y.v-x.v);
    if(pool.length)out.push({label:cat.label, top:pool.slice(0,3)});
  });
  return out;
}

/* The best players a program has ever produced. */
function recordBook(u, team){
  const list=(u.alumni&&u.alumni[team])?u.alumni[team].slice():[];
  list.sort((a,b)=>{
    const ad=a.draft?a.draft.overall:9999, bd=b.draft?b.draft.overall:9999;
    return ad-bd || b.peak-a.peak;
  });
  return list;
}

/* The program record book, as the core's team pages read it. */

const CARD_W = 1080, CARD_H = 1080;

}

    ${stat(210,"CONFERENCE",c.confRec||"—")}

/* The same season as a line of text, for anywhere an image won't go. */
function seasonCardText(h, team){
  const c=h.card||{};
  const bits=[`${team} ${h.rec} (${c.confRec} ${c.conf})`];
  if(h.champion===team)bits.push("NATIONAL CHAMPIONS");
  else if(h.confChamp)bits.push(`${c.conf} champions`);
  else if(h.rank)bits.push(`finished No. ${h.rank}`);
  if(c.bestWin)bits.push(`beat ${c.bestWin.rank?"No. "+c.bestWin.rank+" ":""}${c.bestWin.opp} ${c.bestWin.score}`);
  return `${c.coach}, ${h.year}. ${bits.join(" \u2014 ")}. Football Coach: ianbott1.github.io/football-coach`;
}

/* Rasterise the SVG to a PNG blob so it can be shared or saved as a real image. */
function cardBlob(svg){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
    img.onload=()=>{
      try{
        const cv=document.createElement("canvas");
        cv.width=CARD_W; cv.height=CARD_H;
        const cx=cv.getContext("2d");
        cx.fillStyle="#10131C"; cx.fillRect(0,0,CARD_W,CARD_H);
        cx.drawImage(img,0,0,CARD_W,CARD_H);
        cv.toBlob(b=>b?resolve(b):reject(new Error("no blob")),"image/png");
      }catch(e){reject(e)}
    };
    img.onerror=()=>reject(new Error("svg load failed"));
    img.src=url;
  });
}

async function shareCard(h, team){
  const svg=seasonCardSVG(h,team);
  const txt=seasonCardText(h,team);
  const name=`${team.replace(/[^A-Za-z]/g,"")}-${h.year}.png`;
  try{
    const blob=await cardBlob(svg);
    const file=new File([blob],name,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],text:txt});
      return "shared";
    }
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    return "saved";
  }catch(e){
    try{ await navigator.clipboard.writeText(txt); return "copied" }
    catch(_){ return "failed" }
  }
}

function projectedField(){
  const rk=SEA.poll.rankMap(), order=SEA.poll.order(), leaders={};
  LEAGUE.conf.order.forEach(c=>{
    const mem=NAMES.filter(t=>CONF[t]===c).sort((x,y)=>{
      const px=SEA.confrec[x][0]/Math.max(1,SEA.confrec[x][0]+SEA.confrec[x][1]);
      const py=SEA.confrec[y][0]/Math.max(1,SEA.confrec[y][0]+SEA.confrec[y][1]);
      return py-px||SEA.elo[y]-SEA.elo[x];
    });
    leaders[c]=mem[0];
  });
  const f=LEAGUE.playoff.autoBids.map(c=>leaders[c]);
  f.push(LEAGUE.conf.autoBidPool.map(c=>leaders[c]).sort((x,y)=>rk[x]-rk[y])[0]);
  const ind=LEAGUE.playoff.independent;
  if(rk[ind.team]<=ind.withinRank&&f.indexOf(ind.team)<0)f.push(ind.team);
  for(const t of order){if(f.length>=LEAGUE.playoff.size)break; if(f.indexOf(t)<0)f.push(t)}
  return f.sort((x,y)=>rk[x]-rk[y]);
}

function playoffPicture(){
  const rk=SEA.poll.rankMap(), order=SEA.poll.order();
  const leaders={};
  LEAGUE.conf.order.forEach(c=>{
    const mem=NAMES.filter(t=>CONF[t]===c).sort((x,y)=>{
      const px=SEA.confrec[x][0]/Math.max(1,SEA.confrec[x][0]+SEA.confrec[x][1]);
      const py=SEA.confrec[y][0]/Math.max(1,SEA.confrec[y][0]+SEA.confrec[y][1]);
      return py-px||SEA.confrec[y][0]-SEA.confrec[x][0]||SEA.elo[y]-SEA.elo[x];
    });
    leaders[c]=mem[0];
  });
  const field=[], note={};
  LEAGUE.playoff.autoBids.forEach(c=>{field.push(leaders[c]);
    note[leaders[c]]=LEAGUE.conf.names[c]+" leader"});
  const g6=LEAGUE.conf.autoBidPool.map(c=>leaders[c]).sort((a,b)=>rk[a]-rk[b])[0];
  field.push(g6); note[g6]=LEAGUE.conf.names[CONF[g6]]+" leader";
  const ind=LEAGUE.playoff.independent;
  if(rk[ind.team]<=ind.withinRank&&field.indexOf(ind.team)<0){
    field.push(ind.team);note[ind.team]="Independent"}
  for(const t of order){if(field.length>=LEAGUE.playoff.size)break;
    if(field.indexOf(t)<0){field.push(t);note[t]="At-large"}}
  field.sort((a,b)=>rk[a]-rk[b]);
  const out=order.filter(t=>field.indexOf(t)<0).slice(0,4);
  const my=S.myTeam;
  let h=`<div class="grouphead">If the season ended today</div>`;
  h+=field.map((t,i)=>`<div class="frow ${t===my?'mine':''}">
    <span class="sd">${i+1}</span>
    <span class="dot" style="background:${teamColor(t)}"></span>
    <div class="fmain"><div class="fname">${esc(t)}</div>
    <div class="fnote">${esc(note[t])}</div></div>
    <span class="fcfp">${SEA.rec[t][0]}-${SEA.rec[t][1]}</span>
    ${i<4?'<span class="byebadge">Bye</span>':''}</div>`).join("");
  h+=`<div class="grouphead">First four out</div>`;
  h+=out.map(t=>`<div class="frow ${t===my?'mine':''}"><span class="sd">&mdash;</span>
    <span class="dot" style="background:${teamColor(t)}"></span>
    <div class="fmain"><div class="fname">${esc(t)}</div></div>
    <span class="fcfp">${SEA.rec[t][0]}-${SEA.rec[t][1]}</span></div>`).join("");
  if(field.indexOf(my)<0)h+=`<div class="note">${esc(my)} is currently outside the field
    at ${rk[my]<=25?"No. "+rk[my]:rk[my]+"th"}.</div>`;
  return h;
}

  if(postTab==="field"){

    h+=SEA.field.map(t=>`<div class="frow ${t===my?'mine':''}">

      <div class="fmain"><div class="fname">${esc(t)}</div>

    h+=`<div class="grouphead">First four out</div>`;

  // bracket: only the most recent round expanded, earlier rounds collapsed
  const R=[["First Round","Dec 18-19 &middot; campus sites",SEA.rounds.r1],

let pollTab="poll";

function pollView(){
  const prev=SEA.prevRank, cur=SEA.poll.rankMap();
  if(SEA.step>=6&&SEA.phase==="week"){
    const bar=`<div class="dateline"><h2>Rankings</h2><span>${SEA.year}</span></div>
      <div class="subtabs">${[["poll","Top 25"],["cfp","Playoff picture"]].map(([k,l])=>
      `<button class="subtab" data-k="${k}" aria-pressed="${pollTab===k}">${l}</button>`).join("")}</div>`;
    if(pollTab==="cfp")return bar+playoffPicture();
    return bar+pollRows(prev,cur);
  }
  return `<div class="dateline"><h2>Top 25</h2><span>${SEA.year}</span></div>`+pollRows(prev,cur);
}

function pollRows(prev,cur){
  const rows=SEA.top25(null);
  let h="";
  const mv=t=>{
    if(!prev||!prev[t])return `<span class="mv flat">&ndash;</span>`;
    const d=prev[t]-cur[t];
    if(prev[t]>25&&cur[t]<=25)return `<span class="mv up">NEW</span>`;
    if(d>0)return `<span class="mv up">&#9650;${d}</span>`;
    if(d<0)return `<span class="mv dn">&#9660;${-d}</span>`;
    return `<span class="mv flat">&ndash;</span>`;
  };
  h+=rows.map(p=>`<div class="prow ${p.team===S.myTeam?'mine':''}"
      style="--tc:${teamInk(p.team)}">
      <span class="cbar"></span>
      <div class="pnum">${p.rank}</div>
      <div class="pmain"><div class="pname">${TL(p.team)}</div>
      <div class="psub">${p.rec} &middot; ${esc(LEAGUE.conf.names[p.conf])}</div></div>
      ${mv(p.team)}</div>`).join("");
  if(cur[S.myTeam]>25){
    h+=`<div class="grouphead">Your program</div>
      <div class="prow mine" style="--tc:${teamInk(S.myTeam)}"><span class="cbar"></span>
      <div class="pnum">${cur[S.myTeam]}</div>
      <div class="pmain"><div class="pname">${esc(S.myTeam)}</div>
      <div class="psub">${SEA.rec[S.myTeam][0]}-${SEA.rec[S.myTeam][1]} &middot; outside the top 25</div>
      </div>${mv(S.myTeam)}</div>`;
  }
  return h;
}

LEAGUE.ui={
  rankingTab:"Poll",                    // label of the ranking tab
  rankingView:pollView,
  projectedField:projectedField,        // who'd be in if it ended today
  /* what Scores shows once the regular season is over, or null */
  postseasonView(){
    if(SEA.phase!=="week"&&(SEA.field.length||SEA.rounds.r1.length))return bracketView();
    return null;
  },
  /* after a step is played, open the sub-tab that step filled in */
  afterAdvance(ph){
    if(ph==="selection")postTab="field";
    else if(ph==="bowls")postTab="bowls";
    else if(ph==="r1"||ph==="qf"||ph==="sf"||ph==="final")postTab="bracket";
  },
  /* a sub-tab button belonging to one of these views */
  subtab(b){
    if(b.dataset.p){postTab=b.dataset.p;return true}
    if(b.dataset.k){pollTab=b.dataset.k;return true}
    return false;
  }
};

/* The offseason screen (job offers, staff, recruiting focus, philosophy,
   budget) and the banner that closes a season (coaching news, recruiting,
   realignment, awards, draft night). The core shows them through LEAGUE.ui
   and asks offseasonBlock() whether the user may move on yet. */

function budgetLeft(){
  if(!S.off)return 0;
  const B=S.off.picks.budget;
  return S.off.pool-LEAGUE.offseason.budget.buckets.reduce((s,b)=>s+(B[b.k]||0),0);
}

  if(myPoach)news=`<div class="bnews flag"><b>${esc(myPoach.name)} left for
    ${esc(myPoach.to)}.</b> ${myHire?esc(myHire.name)+" takes over.":""}</div>`;
  else if(last.fired&&myHire)news=`<div class="bnews flag"><b>Coaching change.</b>
    ${esc(myHire.name)} is your new head coach.</div>`;
  else if(myHire)news=`<div class="bnews"><b>${esc(myHire.name)}</b> hired as head coach.</div>`;
  const cls=last.classes?last.classes[my]:null;

      const mine=(last.draft||[]).filter(d=>d.team===my);
