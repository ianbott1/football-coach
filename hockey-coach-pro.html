<style>
:root{--ink:#10131C;--panel:#191E2C;--panel2:#141928;--line:#2A3145;--bone:#E9E5DA;
 --muted:#7F89A0;--sodium:#F4A63A;--flag:#E45B4E;--turf:#46B583;--vote:#8B9FE8;
 --cond:'Barlow Condensed',Impact,sans-serif;--body:'Barlow',system-ui,sans-serif;
 --mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--bone);font-family:var(--body);
 -webkit-font-smoothing:antialiased;padding-bottom:176px}
#app{max-width:760px;margin:0 auto}
.mast{padding:26px 16px 16px;border-bottom:1px solid var(--line)}

.tb-rk{color:var(--sodium);margin-left:6px}

/* ============ players: hockey ============ */
/* Twelve players: a first unit (centre, two wings, two defencemen and the

const BENCH=0.28;                        // an average, for anything that needs one number
function pickInjuredPos(rng){
  let x=rng.r(), acc=0;
  for(let i=0;i<POS.length;i++){acc+=POS[i].hz; if(x<acc)return i}

const R_SLOPE=24.3, R_INT=56;
const ratingToElo=r=>R_INT+R_SLOPE*r;
const eloToRating=e=>(e-R_INT)/R_SLOPE;

function teamRating(roster){

  POS.forEach((P,i)=>{const st=roster[i], bk=roster[BK(i)]||st;
    s+=P.w*((1-P.bench)*st.r+P.bench*bk.r)});

function injuryCost(roster,idx){

/* each unit's share of the first unit's goals, assists and shots (depth
   players account for the rest) */
const ROLE={C:{goals:0.27,ast:0.26,sog:0.24},LW:{goals:0.25,ast:0.21,sog:0.22},RW:{goals:0.25,ast:0.21,sog:0.22},

/* one game's line for one first-unit player, consistent with his rating and the score */
function gameStats(rng,pl,posIdx,forPts,oppPts,won){
  const P=POS[posIdx].p;
  if(P==="G"){ const sa=Math.max(oppPts,Math.round(rng.gauss(29,4.5)));
    return {sv:sa-oppPts, ga:oppPts, so:oppPts===0?1:0} }
  const R=ROLE[P], q=(pl.r-60)/20, star=Math.max(0.5,1+q*0.45+rng.gauss(0,0.2)), first=1-POS[posIdx].bench;
  const pick=(n,p)=>{let k=0;for(let i=0;i<n;i++)if(rng.r()<p)k++;return k};
  const goals=pick(forPts,Math.min(0.9,R.goals*first*star));
  const ast=pick(Math.round(forPts*1.7),Math.min(0.9,R.ast*first*star*0.55));
  const sog=Math.max(goals,Math.round(rng.gauss(29*R.sog*first*star,1.2)));
  return {goals:goals, ast:ast, pts:goals+ast, sog:sog};
}
function addStats(dst,src){dst.g=(dst.g||0)+1; Object.keys(src).forEach(k=>dst[k]=(dst[k]||0)+src[k])}
/* a season line: hockey counts totals */
function statLine(pos,s){
  if(!s||!s.g)return "";
  if(pos==="G"){ const sa=(s.sv||0)+(s.ga||0), sv=sa?(s.sv/sa):0;
    return `${sv.toFixed(3).replace(/^0/,"")} save %, ${((s.ga||0)/s.g).toFixed(2)} GAA${s.so?", "+s.so+" shutout"+(s.so===1?"":"s"):""}` }

/* award production, from what a player actually did */
function statProd(pos,s){

}
/* ============ storage ============ */
/* Where saves live. Inside Claude's artifact viewer that is window.storage;
   anywhere else (the published site, a file opened locally) it is the
   browser's localStorage. The shared league table needs window.storage and
   is simply unavailable elsewhere. Every call resolves; failures resolve to
   null rather than throwing. */
const store=(function(){
  const claude=()=>{try{return (window.storage&&typeof window.storage.get==="function")?window.storage:null}catch(e){return null}};
  const local=()=>{try{const L=window.localStorage||localStorage, t="__fc_probe";
    L.setItem(t,"1"); L.removeItem(t); return L}catch(e){return null}};
  return {
    kind(){ return claude()?"claude":local()?"browser":"none" },
    async get(k,shared){
      const W=claude(); if(W){try{return await W.get(k,shared)}catch(e){return null}}
      const L=!shared&&local(); if(!L)return null;
      const v=L.getItem(k); return v===null?null:{key:k,value:v};
    },
    async set(k,v,shared){
      const W=claude(); if(W){try{return await W.set(k,v,shared)}catch(e){return null}}
      const L=!shared&&local(); if(!L)return null;
      try{L.setItem(k,v); return {key:k,value:v}}catch(e){return null}      // full, or blocked
    },
    async delete(k,shared){
      const W=claude(); if(W){try{return await W.delete(k,shared)}catch(e){return null}}
      const L=!shared&&local(); if(!L)return null;
      L.removeItem(k); return {key:k,deleted:true};
    },
    async list(prefix,shared){
      const W=claude(); if(W){try{return await W.list(prefix,shared)}catch(e){return null}}
      const L=!shared&&local(); if(!L)return null;
      const keys=[]; for(let i=0;i<L.length;i++){const k=L.key(i); if(!prefix||k.indexOf(prefix)===0)keys.push(k)}
      return {keys:keys,prefix:prefix};
    }
  };
})();

/* Saves are compressed with LZW: the JSON is turned into UTF-8 bytes, the
   byte string is LZW-coded (codes 0-255 bytes, 256 end of data, dictionary
   from 257, up to 15 bits), and the bits are packed 15 to a UTF-16 character
   (offset past the control range, never a surrogate), a string any store
   accepts. Old saves, plain JSON, still load. */
const SAVE_TAG="LZW1:";
/* codes are looked up by number (previous code * 256 + next byte) and written
   whole, 15 bits to a character; same output as the plain bit-by-bit version */
function lzwPack(str){
  const bytes=unescape(encodeURIComponent(str));
  const END=256, dict=new Map(); let next=257, bits=9, w=-1, acc=0, nacc=0; const out=[];
  // append a whole code at once; flush 15 bits at a time (acc never exceeds 30 bits)
  const emit=code=>{ acc=(acc<<bits)|code; nacc+=bits;
    while(nacc>=15){ nacc-=15; out.push(String.fromCharCode(((acc>>>nacc)&0x7fff)+32)); acc&=(1<<nacc)-1 } };
  for(let i=0;i<bytes.length;i++){
    const c=bytes.charCodeAt(i);
    if(w<0){w=c;continue}
    const key=w*256+c, hit=dict.get(key);
    if(hit!==undefined){w=hit;continue}
    emit(w);
    if(next<32767){dict.set(key,next++); if(next>(1<<bits)&&bits<15)bits++}
    w=c;
  }
  if(w>=0)emit(w);
  emit(END);
  if(nacc>0)out.push(String.fromCharCode(((acc<<(15-nacc))&0x7fff)+32));
  return SAVE_TAG+out.join("");
}
function lzwUnpack(s){
  if(s.indexOf(SAVE_TAG)!==0)return s;                 // an old, uncompressed save
  s=s.slice(SAVE_TAG.length);
  const END=256, dict=[]; let next=257, bits=9, pos=0, cur=0, ncur=0; const out=[];
  const read=()=>{let v=0;for(let b=0;b<bits;b++){ if(ncur===0){ if(pos>=s.length)return -1; cur=s.charCodeAt(pos++)-32; ncur=15 }
      v=(v<<1)|((cur>>(--ncur))&1)} return v};
  let prev=null;
  while(true){
    const c=read(); if(c<0||c===END)break;
    let e;
    if(c<256) e=String.fromCharCode(c);
    else if(dict[c]!==undefined) e=dict[c];
    else if(c===next&&prev!==null) e=prev+prev[0];
    else throw new Error("save data is damaged");
    out.push(e);
    if(prev!==null&&next<32767){dict[next++]=prev+e[0]; if(next>=(1<<bits)&&bits<15)bits++}
    prev=e;
  }
  return decodeURIComponent(escape(out.join("")));
}
/* ============ RNG ============ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
class RNG{
  constructor(seed){this.f=mulberry32(seed);this.sp=null}
  r(){return this.f()}
  int(n){return Math.floor(this.f()*n)}
  range(a,b){return a+this.f()*(b-a)}
  pick(a){return a[this.int(a.length)]}
  gauss(m,s){
    if(this.sp!==null){const v=this.sp;this.sp=null;return m+s*v}
    let u=0,v=0;while(u===0)u=this.f();while(v===0)v=this.f();
    const R=Math.sqrt(-2*Math.log(u));this.sp=R*Math.sin(2*Math.PI*v);
    return m+s*R*Math.cos(2*Math.PI*v)}
  shuffle(a){for(let i=a.length-1;i>0;i--){const j=this.int(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
}

/* ============ home fields ============ */
/* Not every stadium is the same place. A handful are genuinely miserable to
   visit; most are ordinary; some are half empty in November. */

function homeField(u,t){
  if(LEAGUE.homeField)return LEAGUE.homeField(u,t);
  const prog=(u&&u.program&&u.program[t])!==undefined?u.program[t]:1500;
  const base=39+Math.max(0,Math.min(1,(prog-1150)/900))*30;
  return Math.round(base+(LEAGUE.venues[t]||8));
}

function venueLabel(v){
  if(v>=88)return "one of the hardest places to play in the country";
  if(v>=76)return "a genuinely hostile road trip";
  if(v>=64)return "a real home-field edge";
  if(v>=52)return "a normal road game";
  return "not a difficult place to visit";
}

/* ============ team identity ============ */
function _hx(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function _lum(c){const [r,g,b]=c.map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*r+.7152*g+.0722*b}
function _mix(c,t,p){return c.map((v,i)=>Math.round(v+(t[i]-v)*p))}
const _READ={};
function teamColor(t){                    // raw brand color
  return LEAGUE.colors[t]||"#F4A63A";
}
function teamInk(t){                      // brand color, lightened until legible on dark
  if(_READ[t])return _READ[t];
  let c=_hx(LEAGUE.colors[t]||"#F4A63A"), p=0;
  while(_lum(c)<0.30&&p<0.85){p+=0.08;c=_mix(_hx(LEAGUE.colors[t]||"#F4A63A"),[255,255,255],p)}
  const out="#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");
  _READ[t]=out; return out;
}

/* ============ constants ============ */
const K=32;                  // Elo update factor

function divisionOf(u,t){
  const c=(u&&u.conf&&u.conf[t])||CONF[t];
  const D=LEAGUE.conf.divisions[c]; if(!D)return null;
  for(const k in D)if(D[k].indexOf(t)>=0)return k;
  // a newcomer joins whichever side is thinner
  const sizes=Object.keys(D).map(k=>[k,D[k].length]).sort((a,b)=>a[1]-b[1]);
  D[sizes[0][0]].push(t);
  return sizes[0][0];
}
function hasDivisions(c){return !!LEAGUE.conf.divisions[c]}
function divisionNames(c){return LEAGUE.conf.divisions[c]?Object.keys(LEAGUE.conf.divisions[c]).sort():[]}
const NAMES=LEAGUE.teams.map(t=>t[0]);
let CONF=Object.fromEntries(LEAGUE.teams.map(t=>[t[0],t[2]]));
function syncConf(u){
  if(u&&u.conf)NAMES.forEach(t=>{if(u.conf[t])CONF[t]=u.conf[t]});
  else if(u){u.conf={};NAMES.forEach(t=>u.conf[t]=CONF[t])}
}

/* ============ Elo ============ */
/* Games are played by the sport layer's drive engine (playGame). */
function eloUpdate(eW,eL,mAbs,winHome,neutral){
  const hfa=neutral?0:LEAGUE.tuning.hfa;
  const diff=winHome?(eW+hfa-eL):(eW-eL-hfa);
  const exp=1/(1+Math.pow(10,-diff/400));
  const mov=Math.log(mAbs+1)*(2.2/(0.001*diff+2.2));
  return K*mov*(1-exp);
}

/* ============ talent ============ */
const INJ_HAZARD=0.085,QB_SHARE=0.18,DEV_SD=4.2,AR_SD=5,AR_DECAY=0.8,
      COLLAPSE_P=0.018,BREAKOUT_P=0.018;
const BODY=["OL","WR1","RB1","EDGE","CB1","LB","TE","S"];
function iscale(r){return 0.70+0.45*Math.max(0,Math.min(1,(r-1150)/900))}
/* The per-step rates below (drift, injuries, sudden swings) were set for a
   season of a dozen or so steps. A league with many more (the NBA plays 90
   game dates) sets tuning.talentSteps: rates are scaled so a whole season
   varies as much as one of that many steps, and injuries last as many games.
   Unset, nothing changes. */
function talentScale(){const T=LEAGUE.tuning&&LEAGUE.tuning.talentSteps; return T?T/LEAGUE.weeks:1}

class Talent{
  constructor(rng,base,roster){
    this.rng=rng;this.base=Object.assign({},base);
    this.roster=roster||null;
    this.slope={};this.ar={};this.inj={};this.log={};
    const K=talentScale();
    NAMES.forEach(t=>{this.slope[t]=rng.gauss(0,DEV_SD)*K;this.ar[t]=0;
      this.inj[t]=[];this.log[t]=[]});
  }
  eff(t,w){
    let s=0; this.inj[t].forEach(e=>{if(e.w>0)s+=e.m});
    return this.base[t]+this.slope[t]*w+this.ar[t]+s;
  }
  active(t){return this.inj[t].filter(e=>e.w>0)}
  advance(w){
    const r=this.rng, K=talentScale();
    NAMES.forEach(t=>{
      this.inj[t].forEach(e=>e.w--);
      this.inj[t].filter(e=>e.w<=0).forEach(e=>
        this.log[t].push({wk:w,kind:"back",what:e.k,mag:0}));
      this.inj[t]=this.inj[t].filter(e=>e.w>0);
      const sc=iscale(this.base[t]);
      if(r.r()<INJ_HAZARD*K){
        if(this.roster){
          // pick a starter, weighted toward the positions that take hits
          const idx=pickInjuredPos(r);
          const pl=this.roster[t][idx];
          if(!this.inj[t].some(e=>e.idx===idx)){
            const sev=r.r();
            const wk=Math.max(1,Math.round((sev<0.12?14:r.pick([1,2,2,3,4,5,6]))/K));
            const m=injuryCost(this.roster[t],idx)*r.range(1.05,2.1);
            this.inj[t].push({m:m,w:wk,k:pl.p,idx:idx,who:pl.n,rating:pl.r});
            this.log[t].push({wk:w,kind:"injury",what:pl.p,who:pl.n,
                              mag:Math.round(m),weeks:wk});
          }
        }else{
          let m,wk,k;
          if(r.r()<QB_SHARE){m=-r.range(85,190)*sc;wk=r.pick([2,3,4,5,6,14]);k="QB1"}
          else{m=-r.range(20,75)*sc;wk=r.pick([1,2,2,3,4,6]);k=r.pick(BODY)}
          this.inj[t].push({m:m,w:wk,k:k});
          this.log[t].push({wk:w,kind:"injury",what:k,mag:Math.round(m),weeks:wk});
        }
      }
      if(r.r()<COLLAPSE_P*K){const d=-r.range(40,110)*sc;this.base[t]+=d;
        this.log[t].push({wk:w,kind:"collapse",what:"locker room",mag:Math.round(d)})}
      else if(r.r()<BREAKOUT_P*K){const d=r.range(35,95)*sc;this.base[t]+=d;
        this.log[t].push({wk:w,kind:"breakout",what:"scheme unlock",mag:Math.round(d)})}
      this.ar[t]=this.ar[t]*AR_DECAY+r.gauss(0,AR_SD);
    });
  }
}

  const q=rng.gauss(-24+tier*52, 26);

/* Roll a season's results into every coach's career. */
function recordCoaches(u,rec,champion,confChamps,year){
  u.coachLog=u.coachLog||{};
  NAMES.forEach(t=>{
    const c=u.coach[t]; if(!c)return;
    if(c.w===undefined){c.w=0;c.l=0;c.titles=0;c.confs=0;c.fired=0;c.stops=[]}
    if(!c.stops.length||c.stops[c.stops.length-1].team!==t)
      c.stops.push({team:t,from:year,to:year,w:0,l:0,titles:0});
    const st=c.stops[c.stops.length-1];
    c.w+=rec[t][0]; c.l+=rec[t][1];
    st.w+=rec[t][0]; st.l+=rec[t][1]; st.to=year;
    if(champion===t){c.titles++; st.titles++}
    if(confChamps&&Object.values(confChamps).indexOf(t)>=0)c.confs++;
  });
}

/* Snapshot of everyone currently employed, for browsing. */
function coachTable(u){
  const out=[];
  NAMES.forEach(t=>{
    const c=u.coach[t]; if(!c)return;
    out.push({team:t,n:c.n,q:c.q,t:c.t,you:!!c.you,
      w:c.w||0,l:c.l||0,titles:c.titles||0,confs:c.confs||0,
      stops:(c.stops||[]).slice()});

  return out;

function coachGrade(q){
  if(q>=38)return "elite";
  if(q>=18)return "strong";

function coachCandidates(rng,prestige){
  const tier=Math.max(0,Math.min(1,(prestige-1150)/900));
  const pool=rng.shuffle(ARCHETYPES.slice()).slice(0,3);
  return pool.map(A=>{
    const q=Math.round(Math.max(-58,Math.min(68,
      rng.gauss(-24+tier*52+A.bump, A.sd))));
    // scouting is imperfect: you see a noisy read, not the number
    const seen=q+rng.gauss(0,13);
    return {n:rng.pick(FIRST)+" "+rng.pick(LAST), q:q, arch:A.k, al:A.l, d:A.d,
            rec:A.rec||0, grade:coachGrade(seen)};
  });
}

const PHILOSOPHY={
  win_now: {l:"Win now",  d:"Veterans get every rep. Better this year, thinner next.",
            elo:44, dev:-3.0},
  balanced:{l:"Balanced", d:"Play the best guy at every spot.", elo:0, dev:0},
  build:   {l:"Build",    d:"Young players play through mistakes. Costs you this year.",
            elo:-38, dev:3.2}
};

/* ============ your coaching career ============ */
/* You are the head coach, not the athletic director. You get hired, you get
   fired, and your record follows you to the next job. */
function repGrade(r){
  if(r>=46)return "a national name";
  if(r>=26)return "a hot commodity";
  if(r>=8)return "well regarded";
  if(r>=-10)return "unproven";
  if(r>=-28)return "a hard sell";
  return "radioactive";
}

/* Which jobs would take you, given what you've done. */
function jobMarket(u,rng,rep,openings,current){
  const ceiling=1300+Math.max(0,rep+40)*10;      // reputation opens bigger doors
  const floor=Math.max(1120,ceiling-620);
  const opts=openings.filter(t=>t!==current)
    .filter(t=>u.program[t]<=ceiling&&u.program[t]>=floor)
    .sort((a,b)=>u.program[b]-u.program[a]);
  const picked=[];
  if(opts.length)picked.push(opts[0]);
  if(opts.length>2)picked.push(opts[Math.floor(opts.length/2)]);
  if(opts.length>1)picked.push(opts[opts.length-1]);
  return [...new Set(picked)].slice(0,3);
}

/* Bigger programs come calling when you overperform at a small one. */
function poachOffers(u,rng,rep,openings,current){
  if(rep<18)return [];
  const mine=u.program[current];
  return openings.filter(t=>t!==current&&u.program[t]>mine+150
    &&u.program[t]<=1240+Math.max(0,rep+30)*12)
    .sort((a,b)=>u.program[b]-u.program[a]).slice(0,2);
}

function repDelta(wins,losses,expWins,program,titles){
  const wp=wins/Math.max(1,wins+losses);
  let d=(wins-expWins)*1.7;
  if(titles.natl)d+=22;
  else if(titles.playoff)d+=8;
  else if(titles.conf)d+=6;
  if(wp<0.34&&wins<expWins)d-=6;   // only if you also missed the mark
  // winning at a small program counts for more
  d*= program<1500?1.25 : program>1850?0.82 : 1.0;
  return d;
}

/* ============ program continuity ============ */
const COACH_ONFIELD=0.55,  // how much coach quality shows up on the field
      COACH_BUILD=0.34,    // how much it compounds into the program each year
      ROOKIE_DIP=-22;
const ROSTER_NOISE=48;
const CARRY=0.45,CHURN_SD=95,RECRUIT=0.16,PROG_NOISE=22,
      // program strength's range: a league may set its own (basketball's is wider)
      P_FLOOR=(LEAGUE.tuning&&LEAGUE.tuning.pFloor)||1120,P_CEIL=(LEAGUE.tuning&&LEAGUE.tuning.pCeil)||2010,HOT_SEAT=0.42,COACH_SD=62,COACH_DIP=-18,PERCEPT_N=34;

function newUniverse(seed){
  const rng=new RNG(seed);
  const u={seed:seed,year:2026,program:{},perceived:{},trueBase:{},
           tenure:{},bad:{},history:[],rng:seed};
  u.coach={}; u.roster={}; u.oc={}; u.dc={}; u.conf={};
  u.nextRealign=2026+4+rng.int(4);
  LEAGUE.teams.forEach(t=>u.conf[t[0]]=t[2]);
  LEAGUE.teams.forEach(([n,e])=>{
    u.program[n]=e; u.perceived[n]=e;
    u.roster[n]=LEAGUE.offseason.newRoster(rng,e);
    u.oc[n]=newCoordinator(rng,e,"oc"); u.dc[n]=newCoordinator(rng,e,"dc");
    u.trueBase[n]=rosterElo(u.roster[n])+rng.gauss(0,26);
    u.tenure[n]=1+rng.int(6); u.bad[n]=0;
    const c=newCoach(rng,e); c.t=u.tenure[n]; c.hired=false;
    u.coach[n]=c;
  });
  u._rngState=seed*7919+13;
  return u;
}

function seatHeat(u,rec,elo,t){
  // expectation is the program's own baseline; heat is falling short of it repeatedly
  const w=rec[t][0], l=rec[t][1], wp=w/Math.max(1,w+l);
    const shortfall=(u.program[t]-elo[t])/45;
  let heat=u.bad[t]*1.4 + Math.max(0,shortfall) + (wp<HOT_SEAT?1.2:0);
  if(u.coach[t]&&u.coach[t].t<=1)heat-=1.6;         // rookies get a grace year
  if(u.coach[t]&&u.coach[t].q>=30)heat-=0.6;
  return heat;
}

/* Offseason runs in two acts so the player can decide in between.
   Act 1: the coaching carousel. Act 2: rosters, recruiting, development. */
/* The coaching carousel, once per offseason for the whole league.
   users: {team: fired} for every team a person coaches, fired meaning they
   have missed expectations two years running (decided from their grades,
   see openOffseason). A person's job is theirs to lose that way, never the
   carousel's. Each person's part comes back in the ...By maps; the plain
   userOpen/staffOpen/candidates are the first user's, for one-coach games. */
function offseasonCoaching(u,rng,rec,elo,users){
  users=users||{};
  const isUser=t=>Object.prototype.hasOwnProperty.call(users,t);
  const userTeam=Object.keys(users)[0];
  const fired=[],hires=[],poached=[];
  if(!u.coach){u.coach={};NAMES.forEach(t=>{u.coach[t]=newCoach(rng,u.program[t]);u.coach[t].hired=false})}

  NAMES.forEach(t=>{
    const wp=rec[t][0]/Math.max(1,rec[t][0]+rec[t][1]);
    u.bad[t]= wp<HOT_SEAT ? u.bad[t]+1 : 0;
    if(u.coach[t]&&u.coach[t].you){
      if(isUser(t)&&users[t]){fired.push(t);u.bad[t]=0}
      return;
    }
    const heat=seatHeat(u,rec,elo,t);
    const change=(heat>=4.6)||(wp<0.25&&u.coach[t].t>=2);
    if(change&&rng.r()<0.82){fired.push(t);u.bad[t]=0}
  });

  const openings=fired.slice().sort((a,b)=>u.program[b]-u.program[a]);
  openings.forEach(job=>{
    if(isUser(job))return;                        // a person's job: they're told, then it's filled
    if(rng.r()>0.42)return;
    const cands=NAMES.filter(t=>fired.indexOf(t)<0 && !u.coach[t].you && u.coach[t].q>=22
      && u.program[t] < u.program[job]-140 && u.coach[t].t>=2
      && rec[t][0]>=rec[t][1]);
    if(!cands.length)return;
    cands.sort((a,b)=>u.coach[b].q-u.coach[a].q);
    const from=cands[0], c=u.coach[from];
    poached.push({to:job,from:from,name:c.n,q:c.q});
    u.coach[job]=Object.assign({},c,{t:0,hired:true});   // his record travels with him
    u.coach[from]=newCoach(rng,u.program[from]);
    hires.push({team:from,name:u.coach[from].n,q:u.coach[from].q,reason:"replacing "+c.n});
    fired.splice(fired.indexOf(job),1);
    if(fired.indexOf(from)<0)fired.push(from);
  });

  // a hot coordinator can be the man a program hires
  const coordMoves=[];
  fired.slice().forEach(job=>{
    if(isUser(job))return;
    if(rng.r()>0.30)return;
    const pool=NAMES.filter(t=>fired.indexOf(t)<0 && u.oc[t] && u.oc[t].q>=26
      && u.program[t] < u.program[job]+90);
    if(!pool.length)return;
    const from=rng.pick(pool);
    const side=(u.dc[from]&&u.dc[from].q>u.oc[from].q)?"dc":"oc";
    const co=side==="oc"?u.oc[from]:u.dc[from];
    if(!co||co.q<26)return;
    coordMoves.push({name:co.n,from:from,to:job,side:side});
    u.coach[job]={id:COACH_ID++,n:co.n,q:Math.round(co.q*0.85),t:0,hired:true,
                  w:0,l:0,titles:0,confs:0,fired:0,stops:[]};
    const fresh=newCoordinator(rng,u.program[from],side);
    if(side==="oc")u.oc[from]=fresh; else u.dc[from]=fresh;
    fired.splice(fired.indexOf(job),1);
  });

  const userOpenBy={}, candidatesBy={}, staffOpenBy={};
  Object.keys(users).forEach(t=>{userOpenBy[t]=fired.indexOf(t)>=0; staffOpenBy[t]={oc:false,dc:false}});
  const openJobs=fired.slice();
  Object.keys(users).forEach(t=>{candidatesBy[t]=userOpenBy[t]?coachCandidates(rng,u.program[t]):null});

  fired.forEach(t=>{
    if(isUser(t))return;                          // a person's job, not an AI hire
    if(u.coach[t].hired&&u.coach[t].t===0)return;
    const old=u.coach[t].n;
    u.coach[t]=newCoach(rng,u.program[t]);
    hires.push({team:t,name:u.coach[t].n,q:u.coach[t].q,reason:"replacing "+old});
  });

  // ordinary staff churn everywhere else
  NAMES.forEach(t=>{
    ["oc","dc"].forEach(side=>{
      const st=side==="oc"?u.oc:u.dc;
      if(!st[t]){st[t]=newCoordinator(rng,u.program[t],side);return}
      st[t].t=(st[t].t||0)+1;
      const leaves = st[t].q>=34 ? rng.r()<0.20 : (st[t].q<=-26 ? rng.r()<0.30 : rng.r()<0.09);
      if(leaves){
        if(isUser(t)){staffOpenBy[t][side]=true;}
        else st[t]=newCoordinator(rng,u.program[t],side);
      }
    });
  });

  return {fired:fired,hires:hires,poached:poached,openJobs:openJobs,coordMoves:coordMoves,
          userOpenBy:userOpenBy,staffOpenBy:staffOpenBy,candidatesBy:candidatesBy,
          userOpen:!!userOpenBy[userTeam],candidates:candidatesBy[userTeam]||null,
          staffOpen:staffOpenBy[userTeam]||{oc:false,dc:false}};
}

/* ============ assistants: hockey ============ */
/* Two lead assistants per program, one for each end of the floor. They shift
   the team on the court and shape how their players develop, and the good
   ones get hired away. (The core calls them coordinators.) */
const OFF_SHARE=0.50, DEF_SHARE=0.50;      // both ends count the same
const STAFF_ELO=0.62;                      // Elo per point of assistant quality
const OC_STYLE=["Puck possession","Heavy forecheck","Stretch passes","Cycle and grind","Net-front traffic"];
const DC_STYLE=["Neutral-zone trap","Man-on-man","Collapsing box","Aggressive gap control","Shot blocking"];
function newCoordinator(rng,prestige,side,repBonus){
  const tier=Math.max(0,Math.min(1,(prestige-1150)/900));
  const q=rng.gauss(-20+tier*44+(repBonus||0), 24);
  return {n:rng.pick(FIRST)+" "+rng.pick(LAST),
          q:Math.round(Math.max(-52,Math.min(62,q))), t:0,
          s:rng.pick(side==="oc"?OC_STYLE:DC_STYLE)};
}
function staffElo(u,t){
  if(!u.oc||!u.dc||!u.oc[t]||!u.dc[t])return 0;
  return (u.oc[t].q*OFF_SHARE + u.dc[t].q*DEF_SHARE)*STAFF_ELO;
}
function coordGrade(q){
  if(q>=40)return "one of the best in the country";
  if(q>=20)return "highly regarded";
  if(q>=2)return "solid";
  if(q>=-20)return "unproven";
  return "in over his head";
}
function coordCandidates(rng,prestige,side,rep){
  return [0,1,2].map(()=>{
    const c=newCoordinator(rng,prestige,side,(rep||0)*0.22);
    c.grade=coordGrade(c.q+rng.gauss(0,11));
    return c;
  });
}
/* ============ power ranking: pro football ============ */
/* No poll. Teams are ranked the way people actually rank them in the pros:
   record first, then how good they look. The core asks any ranking for
   order(), rankMap() and update(results, elo). */
class PowerRank{
  constructor(pre){
    this.elo=Object.assign({},pre); this.w={}; this.l={};
    NAMES.forEach(t=>{this.w[t]=0;this.l[t]=0});
  }
  pct(t){const g=this.w[t]+this.l[t]; return g?this.w[t]/g:0.5}
  order(){
    return NAMES.slice().sort((a,b)=>{
      const ga=this.w[a]+this.l[a], gb=this.w[b]+this.l[b];
      // early on, how good a team is outweighs a 1-0 start
      const k=Math.min(1,Math.max(ga,gb)/6);
      const sa=k*this.pct(a)*400+this.elo[a], sb=k*this.pct(b)*400+this.elo[b];
      return sb-sa;
    });
  }
  rankMap(){const o=this.order(),m={};o.forEach((t,i)=>m[t]=i+1);return m}
  update(res,elo){
    res.forEach(r=>{this.w[r.winner]++; this.l[r.loser]++});
    NAMES.forEach(t=>{this.elo[t]=elo[t]});
    return this.rankMap();
  }
}
LEAGUE.Ranking=PowerRank;
/* ============ schedule: pro hockey ============ */
/* The real formula, 82 games: division rivals 26 (four games against five of
   them, three against the other two, rotating by season), the conference's
   other division 24 (three each), the other conference 32 (two each).
   Fitted into 90 game dates, no team twice on a date. */
function nbaSchedule(rng,R,year){
  const bySide={}, byDiv={};
  NAMES.forEach(t=>{const d=CONF[t]; (byDiv[d]=byDiv[d]||[]).push(t)});
  Object.keys(LEAGUE.conf.sides).forEach(sd=>bySide[sd]=[].concat(...LEAGUE.conf.sides[sd].map(d=>byDiv[d])));
  const sideOf=t=>Object.keys(bySide).find(sd=>bySide[sd].indexOf(t)>=0);
  const series={}, key=(a,b)=>a<b?a+"|"+b:b+"|"+a;
  // three-game division rivals: two each, around a shuffled ring of the division
  const three=new Set();
  Object.keys(byDiv).forEach(d=>{const ring=rng.shuffle(byDiv[d].slice());
    ring.forEach((t,i)=>three.add(key(t,ring[(i+1)%ring.length])))});
  NAMES.forEach(a=>NAMES.forEach(b=>{ if(a>=b)return;
    series[key(a,b)]= CONF[a]===CONF[b]?(three.has(key(a,b))?3:4) : sideOf(a)===sideOf(b)?3 : 2 }));
  // the games, home and away split evenly (the odd game of three goes either way)
  const games=[];
  Object.keys(series).forEach(k=>{const [a,b]=k.split("|"), n=series[k], ha=rng.r()<0.5;
    for(let i=0;i<n;i++){const h=(i%2===0)===ha?a:b; games.push({home:h,away:h===a?b:a})}});
  // fit into dates: each date a matching, teams with the most games left first
  const DAYS=LEAGUE.weeks;
  for(let attempt=0;attempt<30;attempt++){
    const left={}; NAMES.forEach(t=>left[t]=0); games.forEach(g=>{left[g.home]++;left[g.away]++});
    const pool=rng.shuffle(games.slice()), out=[];
    let ok=true;
    for(let d=0;d<DAYS;d++){
      const busy=new Set(); const daysLeft=DAYS-d;
      pool.sort((x,y)=>(left[y.home]+left[y.away])-(left[x.home]+left[x.away])+rng.gauss(0,0.8));
      for(let i=0;i<pool.length;i++){const g=pool[i];
        if(busy.has(g.home)||busy.has(g.away))continue;
        busy.add(g.home); busy.add(g.away); left[g.home]--; left[g.away]--;
        out.push({week:d,home:g.home,away:g.away,conf:CONF[g.home]===CONF[g.away],neutral:false});
        pool.splice(i,1); i--;
      }
      if(NAMES.some(t=>left[t]>daysLeft-1)){ok=false;break}
    }
    if(ok&&!pool.length)return out;
  }
  throw new Error("could not fit the NHL schedule");
}
LEAGUE.buildSchedule=nbaSchedule;
/* ============ offseason: pro football ============ */
/* Players have ages and contracts. Each offseason, in order:
     1. expiring contracts are re-signed or let go (you choose for your team)
     2. everyone ages: better until about 27, flat, then decline after 30
        (quarterbacks three years later, running backs two years sooner)
     3. some retire
     4. the draft, worst record first, playoff teams by how far they went
     5. free agency, under a hard salary cap
     6. empty spots are filled with replacement-level players
   Salaries are in millions and cover the twenty players the sim tracks. */
const NFL_CAP=104;                          // the NHL's 2026-27 cap, $104M: a true hard cap
/* no exceptions in hockey: re-signing your own players fits under the cap too */
const TAX_LINE=NFL_CAP;
/* How well run a franchise is, from its slow-moving strength: good
   organisations develop players better, scout better, and free agents take
   a little less to join them. Without it the draft and free agency flatten
   the league within a few years. */
// centred on this league's own average franchise (pro football's was 1690)
const orgEdge=(u,t)=>Math.max(-1.5,Math.min(1.5,(u.program[t]-1500)/(+((typeof process!=="undefined"&&process.env&&process.env.NBA_OE)||100))));
const AGE_SHIFT={};                           // every position ages alike
const POS_PAY={};                             // and is paid alike
const MAX_DEAL=Math.round(NFL_CAP*0.20*10)/10; // a max contract: 20% of the cap ($20.8M)

function nflAsk(r,pos,age){
  const x=Math.max(0,(r-55)/35);
  // scaled to this league's ratings: a typical starter (~64) about $15M, a
  // star (77+) the max, so payrolls sit near the cap and it binds
  let s=Math.min(MAX_DEAL,(0.85+40*Math.pow(x,1.5))*(POS_PAY[pos]||1));   // $850K up to the max; payrolls between the floor and the cap
  const a=age-(AGE_SHIFT[pos]||0);
  if(a>=31)s*=0.78; else if(a>=29)s*=0.9;
  return Math.round(Math.max(0.85,s)*100)/100;
}
function nflYears(age,pos){const a=age-(AGE_SHIFT[pos]||0); return a<=26?4:a<=29?3:a<=31?2:1}
function payroll(roster){return roster.reduce((s,p)=>s+(p&&p.k?p.k.sal:0),0)}
const ROOKIE_ROOM=2;                        // what re-signing leaves free for the draft class
/* Which expiring players a team keeps: the best first, while they fit. Worth
   keeping means a starter rated 66+, or a cheap useful backup, not past 32. */
function nflResignPlan(R){
  const exp=[], keep={}; let pay=0;
  R.forEach((p,i)=>{if(!p)return;
    if(p.k.yrs<=1)exp.push(i); else pay+=p.k.sal});
  exp.sort((a,b)=>R[b].r-R[a].r).forEach(i=>{
    const p=R[i], ask=nflAsk(p.r,p.p,p.age+1);
    // teams keep their useful players (the pros' bar was 66 for a starter)
    const worth=(i<POS.length?p.r>=62:p.r>=60&&ask<=12)&&p.age<=33;
    keep[i]=worth&&pay+ask<=TAX_LINE-ROOKIE_ROOM;      // your own players: up to the tax line
    if(keep[i])pay+=ask;
  });
  return keep;
}

function nflPlayer(rng,target,age,posIdx){
  const P=POS[posIdx].p, a=age-(AGE_SHIFT[P]||0);
  // young players sit below the level they'll reach; veterans at or past it
  const ageAdj=a<=23?-5:a<=25?-2:a<=29?1:a<=31?0:-3;
  const r=Math.round(Math.max(40,Math.min(97,rng.gauss(target+ageAdj,5))));
  const room=a<=23?rng.gauss(9,4):a<=25?rng.gauss(5,3):a<=27?rng.gauss(2,1.5):0;
  const pot=Math.round(Math.max(r,Math.min(99,r+room)));
  return {n:playerName(rng),p:P,i:posIdx,c:age,age:age,r:r,pot:pot,hz:0,prod:0,st:0,
          k:{sal:nflAsk(r,P,age),yrs:1+rng.int(nflYears(age,P))}};
}

function nflRoster(rng,programElo){
  const target=eloToRating(programElo);
  const ageBag=[23,24,25,26,26,27,27,28,29,30,31,32];
  const r=POS.map((_,i)=>nflPlayer(rng,target,rng.pick(ageBag),i));
  POS.forEach((_,i)=>{
    const b=nflPlayer(rng,target-rng.range(5,13),rng.pick([22,23,24,25,28,31,33]),i);
    b.r=Math.min(b.r,r[i].r); b.k.sal=nflAsk(b.r,b.p,b.age);
    r.push(b);
  });
  // nobody starts over the cap
  const pay=payroll(r);
  if(pay>NFL_CAP*0.94){const f=NFL_CAP*0.94/pay; r.forEach(p=>p.k.sal=Math.round(p.k.sal*f*10)/10)}
  return r;
}

/* the draft: worst regular season first; playoff teams after, by the round
   they went out in; the champion picks last */
/* The draft order: the sixteen teams that missed the playoffs draw for the
   top two picks (weighted to the worst records; no team moves up more than
   ten places), the rest of them follow worst first, then the playoff teams,
   worst record first. */
const LOTTERY_ODDS=[185,135,115,95,85,75,65,60,50,35,30,25,20,15,5,5];      // per thousand
function nflDraftOrder(rec,elo,rng){
  const S2=(typeof SEA!=="undefined"&&SEA&&SEA.field)?SEA:null;
  const pts=t=>S2&&S2.pts?S2.pts(t):rec[t][0]*2;
  const worstFirst=(a,b)=>pts(a)-pts(b)||elo[a]-elo[b];
  const inPO=t=>S2&&S2.field.indexOf(t)>=0;
  const lot=NAMES.filter(t=>!inPO(t)).sort(worstFirst), po=NAMES.filter(inPO).sort(worstFirst);
  if(!rng||lot.length!==16)return lot.concat(po);
  const order=lot.slice();
  for(let k=0;k<2;k++){
    const w=LOTTERY_ODDS.slice(0,order.length).map((x,i)=>i>=k?x:0);
    let x=rng.r()*w.reduce((a,b)=>a+b,0), i=0; while(x>w[i]){x-=w[i];i++}
    const to=Math.max(k,i-10);                         // at most ten places up
    const t=order.splice(i,1)[0]; order.splice(to,0,t);
  }
  return order.concat(po);
}

function nflProspects(rng,n){
  const out=[];
  for(let i=0;i<n;i++){
    const q=i/n;
    const posIdx=rng.int(POS.length);
    const age=18+rng.int(2);                    // drafted at 18 or 19
    // draftees: well below NHL level at 18, with ceilings
    const r=Math.round(Math.max(42,Math.min(78,rng.gauss(52-11*Math.pow(q,0.7),3.5))));
    const pot=Math.round(Math.min(99,r+Math.max(3,rng.gauss(15-6*q,5))));
    out.push({n:playerName(rng),p:POS[posIdx].p,i:posIdx,c:age,age:age,r:r,pot:pot,
              hz:0,prod:0,st:0,from:rng.pick(LEAGUE.draftTeams)});
  }
  return out;
}
/* The coming draft class, made when the offseason opens so a coach can see
   it and build a board. Seeded by the year, so reopening the screen or
   reloading a save shows the same class. sr/spot are a scout's estimates:
   how far off depends on how well run the franchise is (as for the
   computer's own picks). */
function nflDraftClass(u,team){
  if(!u.draftClass||u.draftClass.year!==u.year){
    const rng=new RNG((((u.seed||0)*2654435761)^(u.year*7919)^0x5bd1e995)>>>0);

/* Who will be a free agent: the players other teams' re-signing rules won't

const faKey=(team,p)=>team+"|"+p.n+"|"+p.p;
function nflFreeAgentPreview(u,myTeam,users){
  const out=[];

    if(t===myTeam)return;
    const R=u.roster[t], plan=(users&&users[t]&&users[t].resign)||nflResignPlan(R);
    R.forEach((p,i)=>{ if(!p||p.k.yrs>1||plan[i])return;

/* ---- trades ----

   is young, less once he is past 29, and less the more he is paid. */
function tradeValue(p){

const tradeKey=(t,p)=>t+"|"+p.n+"|"+p.p;
/* Offers for one of your players under contract past this season: up to
   three teams each offer a player (also under contract) at one of your
   weakest spots, worth about the same, who helps them at the position they
   get, and leaves both of you under the cap. Deterministic, so the screen
   shows the same offers until something changes. */
function nflTradeOffers(u,myTeam,idx,humans){
  const R=u.roster[myTeam], give=R[idx]; if(!give||give.k.yrs<2)return [];
  const gv=tradeValue(give), myPay=payroll(R);
  // my weakest starting spots, by how far below the league's typical starter they are
  const need=POS.map((P,i)=>({i:i,gap:R[i]?R[i].r:0})).sort((a,b)=>a.gap-b.gap).slice(0,4).map(x=>x.i);
  const offers=[];
  NAMES.forEach(t=>{
    if(t===myTeam||(humans&&humans.indexOf(t)>=0))return;
    const T=u.roster[t], theirPay=payroll(T);
    // do they want him? he has to beat their starter or their backup at his spot
    const gi=POS.findIndex(P=>P.p===give.p);
    if(!(T[gi]&&give.r>T[BK(gi)].r+1))return;
    let best=null;
    T.forEach((q,j)=>{
      if(!q||q.k.yrs<2||need.indexOf(j%POS.length)<0)return;
      if(j<POS.length&&(!T[BK(j)]||T[BK(j)].r<q.r-8))return;   // they won't gut a spot
      const qv=tradeValue(q); if(qv<gv*0.88||qv>gv*1.08)return;

      n:best.q.n,p:best.q.p,r:best.q.r,pot:best.q.pot,age:best.q.age,sal:best.q.k.sal,yrs:best.q.k.yrs,fit:best.fit});

/* carry out an agreed trade: find both players now (after aging), swap them */
function nflApplyTrade(u,myTeam,T,rep,leave,pool){
  const [tt]=T.get.split("|"), mine=u.roster[myTeam], theirs=u.roster[tt];
  const gi=mine.findIndex(p=>p&&tradeKey(myTeam,p)===T.give), qi=theirs?theirs.findIndex(p=>p&&tradeKey(tt,p)===T.get):-1;
  const [,gn,gp]=T.give.split("|"), [,qn,qp]=T.get.split("|");
  if(gi<0||qi<0){rep.trade[myTeam]={done:false,gave:gn,gp:gp,got:qn,qp:qp,with:tt,
      why:gi<0?gn+" retired before it could go through":qn+" retired before it could go through"};return}
  const give=mine[gi], get=theirs[qi];
  mine[gi]=null; theirs[qi]=null;

  [[mine,get,myTeam],[theirs,give,tt]].forEach(([R,p,t])=>{
    p.yrsHere=0; p.joined=u.year+1; p.keep=true;
    const i=POS.findIndex(P=>P.p===p.p);
    if(!R[i]){R[i]=p} else if(!R[BK(i)]){ if(p.r>R[i].r){R[BK(i)]=R[i];R[i]=p}else R[BK(i)]=p }

const rookieSal=o=>0.95;                     // entry-level deals, ~$950K

/* what a player adds at his spot: over the backup, or over the starter */
function nflGain(roster,p){
  const s=roster[p.i], b=roster[BK(p.i)], w=POS[p.i].w;
  const val=x=>x?x.r+(x.pot-x.r)*0.25:0;
  if(!s)return val(p)*w*3;
  if(val(p)>val(s))return (val(p)-val(s))*w*2+ (val(s)-val(b))*w;
  return Math.max(0,val(p)-val(b))*w;
}
/* put a player in: he starts or backs up by rating; whoever drops off is returned */
function nflPlace(roster,p){
  p.i=POS.findIndex(P=>P.p===p.p);
  const s=roster[p.i], b=roster[BK(p.i)];
  let out=null;
  if(!s){roster[p.i]=p}
  else if(p.r>s.r){out=b;roster[BK(p.i)]=s;roster[p.i]=p}
  else {out=b;roster[BK(p.i)]=p}

  NAMES.forEach(t=>{rep.resigned[t]=[];rep.released[t]=[];rep.retired[t]=[];
    rep.drafted[t]=[];rep.signed[t]=[];rep.filled[t]=[]});

  const risers=[],fallers=[];

      line:LEAGUE.records.alumniLine({p:p.p,car:p.car,yrs:p.yrsHere||1}),why:why,

      car:p.car?{goals:p.car.goals||0,ast:p.car.ast||0,pts:p.car.pts||0,sog:p.car.sog||0,sv:p.car.sv||0,so:p.car.so||0}:null});

    draft:{picks:picks}, contracts:rep,
    cap:Object.fromEntries(NAMES.map(t=>[t,Math.round(payroll(u.roster[t])*10)/10]))};

LEAGUE.offseason={

/* ============ the game engine: hockey ============ */
/* Three 20-minute periods, played as six 10-minute segments. Each side takes
   shots at a rate shaped by its edge, and each shot scores at a rate shaped
   by it too (the goalie is part of a team's strength); penalties give the
   other side a power play. The side behind pushes in the third and the side
   ahead sits back (score effects). Trailing late, the goalie comes out for
   an extra attacker: goals both ways. Regular season: five minutes of
   three-on-three, then a shootout. Playoffs: sudden-death periods.
   Calls: at the second intermission (push, or lock it down) and, trailing by
   one or two late, when to pull the goalie. */
const DRIVES_PER_TEAM = 3;                    // segments per team half: six in a game
const SEGS = 6;
const HK_BASE = {
  shots:24,          // even-strength shots on goal per team per game (power plays add ~5)
  shotSd:1.0,        // spread of a segment's shots (x sqrt of the rate)
  sh:0.086,          // a shot's chance of scoring at even strength
  pens:3.1,          // power plays per team per game
  ppShots:1.55,      // shots on a power play
  ppSh:0.135,        // their chance of scoring
  shotEdge:0.0012,   // per Elo of edge: more shots...
  finishEdge:0.0011, // ...and a better chance each
  scoreFx:0.13,      // third period: the side behind shoots this much more
  pullMin:{normal:1.6, early:3.2},   // minutes the goalie is out
  pullFor:0.15,      // the trailer's goals a minute with the extra attacker
  pullAgainst:0.20,  // empty-net goals a minute against
  otGoal:0.68,       // chance three-on-three produces a goal (else a shootout)
  soEdge:0.25        // how much edge counts in a shootout (of the overtime's)

const HK = Object.assign({}, HK_BASE, (typeof LEAGUE!=="undefined"&&LEAGUE.tuning&&LEAGUE.tuning.hk)||{});
/* gameplans and in-game modes: how many events a side creates, and allows */
const AGGR = {
  safe:      {own:1.12, opp:1.10},   // skate with them: more hockey, both ways
  balanced:  {own:1.00, opp:1.00},
  aggressive:{own:0.86, opp:0.84},   // clog it up: fewer chances, more luck
  push:      {own:1.20, opp:1.12},
  sit:       {own:0.84, opp:0.90},
  urgent:    {own:1.00, opp:1.00}
};
function shotsIn(rng,lam){ return Math.max(0,Math.round(rng.gauss(lam,Math.sqrt(Math.max(lam,0.01))*HK.shotSd))) }
function goalsFrom(rng,n,p){ let g=0; for(let i=0;i<n;i++)if(rng.r()<p)g++; return g }
function intCall(lead){
  return lead<0
    ? {k:"push",h:`Down ${-lead} after two`,q:"Twenty minutes left. Open it up?",
       opts:[["push","Push: pinch the D, more shots"],["normal","Stay the course"]]}
    : {k:"lock",h:`Up ${lead} after two`,q:"Twenty minutes left. Sit on it?",
       opts:[["sit","Lock it down: trap, block shots"],["normal","Keep playing our game"]]};
}
function pullCall(lead){
  return {k:"pull",h:`Down ${-lead}, late in the third`,q:"When does the goalie come out?",
    opts:[["early","Early: over three minutes left"],["normal","The usual: under two minutes"]]};
}
function makeLiveGame(rng, eloH, eloA, planH, planA, humans, playoff){
  if(typeof humans!=="object"||humans===null)humans={home:!!humans, away:!humans};

  const st={h:0,a:0,drives:[],seg:0,humans:humans,lines:{h:blankTeamLine(),a:blankTeamLine()},
    mode:{home:planH,away:planA}, late:{home:null,away:null}, asked:{}, queue:[], ask:null,
    ot:0, so:false, done:false, playoff:!!playoff};
  const lead=side=>side==="home"?st.h-st.a:st.a-st.h;
  const queueCalls=(when)=>{
    ["home","away"].forEach(side=>{
      if(!humans[side]||st.asked[when+side])return;
      const L=lead(side); let dp=null;
      if(when==="int"&&L!==0)dp=intCall(L);
      else if(when==="pull"&&(L===-1||L===-2))dp=pullCall(L);
      if(dp){st.asked[when+side]=true; st.queue.push({side:side,dp:dp})}
    });
  };
  // the computer: push when behind in the third, sit on a lead of two or more
  const cpuMode=(side,s)=>{ const L=lead(side);
    if(s>=4&&L<0)return "push"; if(s>=4&&L>=2)return "sit"; return st.mode[side] };
  const segment=(s)=>{
    const mH=humans.home&&st.late.home?st.late.home:(humans.home?st.mode.home:cpuMode("home",s));
    const mA=humans.away&&st.late.away?st.late.away:(humans.away?st.mode.away:cpuMode("away",s));
    const AH=AGGR[mH]||AGGR.balanced, AA=AGGR[mA]||AGGR.balanced;
    const e=gap;                                          // home's edge in Elo
    let lamH=HK.shots/SEGS*(1+e*HK.shotEdge)*AH.own*AA.opp;

    let gH=goalsFrom(rng,sH,pH), gA=goalsFrom(rng,sA,pA);

    const Lh=st.lines.h, La=st.lines.a; let ppH=0,ppA=0;

    if(rng.r()<HK.pens/SEGS){ ppA=shotsIn(rng,HK.ppShots); const g=goalsFrom(rng,ppA,HK.ppSh*(1-e*HK.finishEdge)); gA+=g; La.ppg+=g; La.pp++; Lh.pim+=2 }

      else { st.so=true; if(rng.r()<0.5+(pH-0.5)*HK.soEdge)st.h++; else st.a++ }
    }

  };
  st.next=function(){
    const fin=()=>({done:true,h:st.h,a:st.a,drives:st.drives});
    if(st.done)return fin();
    if(st.pendingSide){
      const P=st.pendingSide, v=st.answer; st.pendingSide=null; st.answer=null;
      if(P.dp.k==="push"||P.dp.k==="lock")st.late[P.side]=v==="push"?"push":v==="sit"?"sit":null;

    if(st.seg===5&&!st.pullDone){st.pullDone=true; queueCalls("pull"); if(st.queue.length)return st.next()}

  };

function playGame(rng, eloH, eloA, planH, planA, opts){

/* Which option each of them would take, and what they'd say about it. */
/* The Bears do not reason. They react. */
const BEAR_YELL={
  push:  [`SEND EVERYONE. The goalie too, if he wants.`,
          `Pinch! Pinch the D! Pinch everything!`,
          `Shoot it from anywhere. The ice is ours.`,
          `Twenty minutes is loads. We need about four of them.`],
  lock:  [`Lock it down? We didn't come here to be locked.`,
          `MORE GOALS. Goals are the whole point.`,
          `Keep attacking. Bears don't trap.`],
  pull:  [`Pull him NOW. Pull him yesterday.`,
          `Six attackers. Seven if we can sneak one on.`,
          `Empty net? Great. We'll be in their end anyway.`],
  distracted:[`Is the Zamboni available for hire? Asking for a bear.`,
          `We've been watching the organist. The organist is excellent.`,
          `Did you know you can buy a whole goal? We may have bought a goal.`]
};
/* Pearl is a dog roughly one time in six. Unlike the Bears, her advice
   survives it — the dog bit wraps the read rather than replacing it, so you
   never lose the balanced opinion just because a squirrel went past. */
const PEARL_BEFORE=[`Woof! `,`SQUIRREL. `,`Ooh, ooh, ooh! `,
  `Was that the treat bag? ... Anyway. `,`Someone's at the door! ... No. False alarm. `];
const PEARL_AFTER=[` Woof!`,` (Tail going. Very hard.)`,` Can we go outside after?`,
  ` Also, is it dinner? It smells like dinner.`,` I'm going to spin in a circle about this.`,
  ` Ball. BALL. Sorry \u2014 the actual ball. Carry on.`];
function pearlSay(line, seed){
  const n=Math.abs(seed|0);
  if(n%6!==1)return line;
  return (n%12===1)
    ? PEARL_BEFORE[Math.floor(n/6)%PEARL_BEFORE.length]+line
    : line+PEARL_AFTER[Math.floor(n/6)%PEARL_AFTER.length];
}

function bearYell(kind, seed){
  const n=Math.abs(seed|0);
  // roughly one call in four, they lose the thread entirely
  if(n%4===2){
    const d=BEAR_YELL.distracted;
    return d[Math.floor(n/4)%d.length];
  }
  const pool=BEAR_YELL[kind]||BEAR_YELL.half;
  return pool[n%pool.length];
}

function staffTake(dp, ctx){
  const diff = (ctx.mine||0)-(ctx.theirs||0);
  const seed = (ctx.mine||0)*7+(ctx.theirs||0)*3+(ctx.q||0);
  const R=[];
  if(dp.k==="push"){
    R.push({who:"bears", pick:"push", line:bearYell("push",seed)});
    R.push({who:"pearl", pick: diff<=-2?"push":"normal", line:pearlSay(diff<=-2
      ? `Two goals is a lot to find! Let's open it up a bit.`
      : `It's one goal! Plenty of time. Keep playing our way.`,seed)});
    R.push({who:"capy", pick:"normal", line:`Chasing, one finds, mostly produces goals at the other end.`});
  }
  else if(dp.k==="lock"){
    R.push({who:"bears", pick:"normal", line:bearYell("lock",seed)});
    R.push({who:"pearl", pick: diff>=2?"sit":"normal", line:pearlSay(diff>=2
      ? `We're two up! Let's make it boring and go home happy.`
      : `One goal isn't enough to sit on. Keep going!`,seed)});
    R.push({who:"capy", pick:"sit", line:`I would suggest fewer chances, both ways. Fewer chances, fewer disasters.`});
  }
  else if(dp.k==="pull"){
    R.push({who:"bears", pick:"early", line:bearYell("pull",seed)});
    R.push({who:"pearl", pick: diff<=-2?"early":"normal", line:pearlSay(diff<=-2
      ? `Two goals needs time! Get him out early.`
      : `One goal, the usual time. We've done this before.`,seed)});
    R.push({who:"capy", pick:"normal", line:`An empty net, I'm afraid, rather invites them to score into it.`});
  }
  return R;
}

/* A line for the moments outside a game. */
function staffAside(kind, data){
  const L={
    depth:[["bears",`Play the kid. Chaos is a ladder.`],
           ["pearl",`He's waited so patiently for this. Let him play!`],
           ["capy",`It seems to me changing the goalie mid-season rarely goes as people imagine.`]],
    staff:[["bears",`FIRE HIM. At centre ice. During the anthem.`],
           ["pearl",`Everyone has bad seasons. Maybe he just needs a bit of help.`],
           ["capy",`I do believe I'd want to be very sure before we start pulling things apart.`]],
    win:  [["bears",`WE ARE UNSTOPPABLE. Say it back to us.`],
           ["pearl",`I'm SO proud of them. Every single one.`],
           ["capy",`Lovely. Though I am, I confess, already a little worried about next week.`]],
    loss: [["bears",`Rigged. The goal was offside. We're appealing.`],
           ["pearl",`It's alright! There's another one next week.`],
           ["capy",`I did rather have a feeling. I didn't want to say.`]],
    title:[["bears",`THE CUP. We are drinking from THE CUP.`],
           ["pearl",`Look at them all crying. It's the loveliest thing.`],
           ["capy",`Champions. I have, I should say, prepared some remarks. They are quite long.`]]

  const set=L[kind]; if(!set)return null;
  const i=Math.abs((data|0))%set.length;
  return {who:set[i][0], line:set[i][1]};
}

/* where the clock stands after segment s: "1st 10:00" ... "3rd 0:00", OT, SO */
function segClock(s){
  if(s===SEGS)return "OT";
  if(s>SEGS)return "SO";
  const per=["1st","2nd","3rd"][Math.floor(s/2)];
  return per+" "+(s%2?"0:00":"10:00");
}
/* a game without a recorded log (the computer's games): segments that add up
   to the final score */
function gameScript(g,rosterHome,rosterAway,seed){
  const rng=new RNG(seed), n=SEGS, out=[];
  const split=(tot)=>{const v=Array.from({length:n},()=>0); for(let i=0;i<tot;i++)v[rng.int(n)]++; return v};
  // overtime games: regulation ends level, the winner's extra goal comes after
  const reg=g.ot?Math.min(g.hp,g.ap):null;
  const hs=split(reg!==null?reg:g.hp), as=split(reg!==null?reg:g.ap); let sh=0,sa=0;
  for(let s=0;s<n;s++){sh+=hs[s]; sa+=as[s]; out.push({seg:s,h:hs[s],a:as[s],sh:sh,sa:sa,shots:[0,0],pp:[false,false]})}
  if(reg!==null)out.push({seg:SEGS,sh:g.hp,sa:g.ap,ot:1,so:!!g.so,h:g.hp-reg,a:g.ap-reg,shots:[0,0],pp:[false,false]});
  return driveScript(g,out);
}

function segLabel(d){ return d.seg>=SEGS?(d.so?"Shootout":"Overtime"):segClock(d.seg) }
function driveWord(d){
  if(d.seg>=SEGS)return d.so?"decided in a shootout":"overtime winner";
  if(!d.h&&!d.a)return "no goals";
  return d.h===d.a?d.h+" goal"+(d.h>1?"s":"")+" apiece":(d.h>d.a?"home":"away")+" "+Math.max(d.h,d.a)+"-"+Math.min(d.h,d.a);

/* a segment in words, with names from the rosters */
function driveScript(g,drives){
  const rng=new RNG(watchSeed(g));
  const RH=SEA.roster?SEA.roster[g.home]:null, RA=SEA.roster?SEA.roster[g.away]:null;
  const skater=R=>{ if(!R)return "a forward"; const pool=[0,1,2,0,1,2,3,4,6,7,8]; const p=R[pool[rng.int(pool.length)]]; return p?p.n:"a forward" };
  return drives.map(d=>{
    if(d.seg>=SEGS){ const hw=d.sh>d.sa, tm=hw?g.home:g.away, R=hw?RH:RA;
      return {seg:d.seg,clock:d.so?"SO":"OT",team:tm,pts:1,outcome:d.so?"SHOOTOUT":"OT GOAL",
        text:d.so?`${tm} win it in the shootout, ${skater(R)} with the decider`:`${skater(R)} ends it in overtime for ${tm}`,h:d.sh,a:d.sa} }
    const parts=[];
    const say=(n,R,tm,side)=>{ for(let k=0;k<n;k++){ const pp=d.pp&&d.pp[side]&&k===0&&rng.r()<0.5;
      parts.push(`${skater(R)} scores for ${tm}${pp?" on the power play":""}`) } };
    say(d.h,RH,g.home,0); say(d.a,RA,g.away,1);
    if(d.en)parts.push(d.en.kind==="empty"?`into the empty net for ${d.en.side==="home"?g.home:g.away}`:`the extra attacker pays off for ${d.en.side==="home"?g.home:g.away}`);
    const sh=d.shots||[0,0];
    const text=parts.length?parts.slice(0,3).join("; ")+(parts.length>3?`, and ${parts.length-3} more`:"")
      :`no goals${sh[0]+sh[1]?`, shots ${sh[1]}-${sh[0]}`:""}`;
    const big=Math.max(d.h,d.a), tm=d.h>=d.a?g.home:g.away;
    return {seg:d.seg,clock:segClock(d.seg),team:tm,pts:big,outcome:d.en?(d.en.kind==="empty"?"EMPTY NET":"EXTRA ATTACKER"):(d.h+d.a?"GOAL":""),text:text,h:d.sh,a:d.sa};
  });
}

/* ============ Season state machine ============ */
class Season{
  constructor(u,seed){
    this.rng=new RNG(seed);
    this.year=u.year;
    this.elo=Object.assign({},u.perceived);
    this.preseason=Object.assign({},u.perceived);
    this.roster=u.roster?JSON.parse(JSON.stringify(u.roster)):null;
    const ph=(u.phil&&PHILOSOPHY[u.phil])?PHILOSOPHY[u.phil].elo:0;
    const tb=Object.assign({},u.trueBase);
    NAMES.forEach(t=>{tb[t]=(tb[t]||0)});   // staff already folded in at the offseason
    if(u.userTeam&&ph)tb[u.userTeam]=(tb[u.userTeam]||0)+ph;
    this.featCost=0;
    this.talent=new Talent(this.rng,tb,this.roster);
    this.poll=new LEAGUE.Ranking(Object.assign({},u.perceived));
    this.sched=LEAGUE.buildSchedule(this.rng,u.perceived,u.year);
    this.rec={};this.confrec={};
    NAMES.forEach(t=>{this.rec[t]=[0,0];this.confrec[t]=[0,0]});
    this.step=0; this.weeks=[]; this.champion=null;
    LEAGUE.post.init(this);                // the league's postseason state
    this.userTeam=null; this.featured=null;
    this.hfa={}; NAMES.forEach(t=>this.hfa[t]=homeField(u,t));
    // staff apply during the season, so a mid-year change actually does something
    this.staffAdj={}; NAMES.forEach(t=>this.staffAdj[t]=staffElo(u,t));
    this.oc=u.oc?JSON.parse(JSON.stringify(u.oc)):null;
    this.dc=u.dc?JSON.parse(JSON.stringify(u.dc)):null;
    this.midFired={}; this._u=u; this.plan="balanced"; this.planLog={};
  }
  /* The regular season is the core's; everything after it is the league's,
     one phase per step, in the order LEAGUE.post.phases gives. */
  get phase(){
    if(this.step<LEAGUE.weeks)return "week";
    return LEAGUE.post.phases[this.step-LEAGUE.weeks]||"done";
  }
  rankMap(){return this.poll.rankMap()}
  /* The two effective ratings for a scheduled game, so it can be played live. */
  matchupElo(g,plan){
    const a=g.home,b=g.away,neutral=g.neutral;
    const w=Math.min(this.step,LEAGUE.weeks);
    const P=PLANS[plan]||PLANS.balanced;
    let edge=0;
    if(this.userTeam===a||this.userTeam===b)
      edge=(this.userTeam===a?1:-1)*P.edge;
    if(this.featured!==null&&this.featured!==undefined&&this.roster){
      const pl=this.roster[this.userTeam]&&this.roster[this.userTeam][this.featured];
      const hurt=this.talent.active(this.userTeam).some(x=>x.idx===this.featured);
      if(pl&&!hurt)edge+=(this.userTeam===a?1:-1)*FEATURE_EDGE;
    }
    const venue=neutral?0:((this.hfa&&this.hfa[a])||LEAGUE.tuning.hfa)-LEAGUE.tuning.hfa;
    return {
      h:this.talent.eff(a,w)+(this.staffAdj[a]||0)+(neutral?0:LEAGUE.tuning.hfa)+venue+edge,
      a:this.talent.eff(b,w)+(this.staffAdj[b]||0)
    };
  }
  /* Make a change now: the interim is worse, and you hire properly in the offseason. */
  fireCoordinator(team,side){
    const st=side==="oc"?this.oc:this.dc;
    if(!st||!st[team]||this.midFired[side])return false;
    const old=st[team];
    // an interim is replacement level: a step down from anyone decent,
    // a genuine upgrade on someone who is drowning

  }

    // nine years in ten.
    const scale={}, P=LEAGUE.awards.premium||{};
    [...new Set(all.map(x=>x.p))].forEach(p=>{const top=all.filter(x=>x.p===p).map(x=>x.prod).sort((a,b)=>b-a).slice(0,8);
      scale[p]=top.length?top.reduce((a,b)=>a+b,0)/top.length:1});
    all.forEach(x=>x.score=x.prod/Math.max(1e-9,scale[x.p])*(P[x.p]||1));
    all.sort((a,b)=>b.score-a.score);
    return all.slice(0,n||10);
  },
  allConference(){
    if(!this.roster)return [];
    return POS.map((P,i)=>{
      const best=NAMES.map(t=>({t:t,pl:this.roster[t][i]}))
        .sort((a,b)=>(b.pl.prod||0)-(a.pl.prod||0))[0];
      return {pos:P.p,team:best.t,n:best.pl.n,r:best.pl.r,c:best.pl.c};
    });
  },
  allConfAll(){return {ALL:this.allConference()}},
  awardTeam(my){return {group:"ALL",list:this.allConference()}}
});
LEAGUE.awards.teamLabel=()=>"All-Pro";
/* ============ the history book ============ */
/* One entry per coach per season. Version 2 is league-neutral: everything the
   core reads has a name that means the same thing in any league, and what
   only one league understands lives under entry.league, written and read by
   that league alone.

   {v:2, year, team, rec:"w-l", rank, result, grade, gradeLine,
    champion,                          league champion that year
    honours:{title, group, seed},      won it all / won your group / playoff seed
    group:{key, name, rec},            conference or division, and record in it
    bestWin:{opp, rank, score}|null,
    coach:{name, titles, seasons},
    -- written at the end of the season, absent from a hot-seat coach's
       early entry (written before the world moves on):
    miles, exp, program,
    teams:{team:[w,l,rank]}, top10, groupChamps:{group:team},
    seeds:{team:seed}, post:{team:[w,l]}, pnote:{team:line},
    awards:{mvp:[{n,p,t,r,c,line}], team:{group, list:[{pos,team,n,r,c}]}},
    coaching:{fired, firedList, nFired, hires, poached, coordMoves, coachNow},
    league:{id, ...}}                  e.g. cfb: bowls, draft, classes, early, realigned
*/
const HISTORY_V=2;

/* The part of an entry every coach gets, whenever it is written. */
function seasonEntry(my){
  const rk=SEA.poll.rankMap();
  const result=SEA.seasonResult(my);
  const exp=S.expNow||expectations();
  const gr=seasonGrade(SEA.rec[my][0],SEA.rec[my][1],result,exp);
  const myGames=[].concat(...SEA.weeks.map(w=>w.games)).filter(g=>g.home===my||g.away===my);
  const bestWin=myGames.filter(g=>g.winner===my)
    .sort((x,y)=>(x.home===my?(x.arank||999):(x.hrank||999))-(y.home===my?(y.arank||999):(y.hrank||999)))[0];
  const bwOpp=bestWin?(bestWin.home===my?bestWin.away:bestWin.home):null;
  const bwRank=bestWin?(bestWin.home===my?bestWin.arank:bestWin.hrank):null;
  const hon=SEA.honours(my), seeds=SEA.postRecord().cfpOf;
  return {v:HISTORY_V, year:SEA.year, team:my,
    rec:SEA.rec[my][0]+"-"+SEA.rec[my][1], rank:rk[my],
    result:result, grade:gr.g, gradeLine:gr.l, miss:!!gr.miss,
    champion:SEA.champion,
    honours:{title:SEA.champion===my, group:hon.conf, seed:seeds[my]||null},
    group:{key:CONF[my], name:LEAGUE.conf.names[CONF[my]]||"",
           rec:SEA.confrec[my][0]+"-"+SEA.confrec[my][1]},
    bestWin: bwOpp?{opp:bwOpp,rank:bwRank||null,
      score:(bestWin.home===my?bestWin.hp+"-"+bestWin.ap:bestWin.ap+"-"+bestWin.hp)}:null,
    coach:{name:S.career.name, titles:S.career.titles, seasons:S.history.length+1}};
}

/* ---- old saves ---- */
/* Version 1 entries (no v) are migrated when a save is loaded. They didn't
   record the team for the end-of-season entry, so it comes from the coach's
   career stops. */
function teamInYear(career,year,fallback){
  const st=(career&&career.stops||[]).find(s=>s.from<=year&&(s.to===undefined||s.to>=year));
  return st?st.team:fallback;
}
function migrateEntry(h,career,fallback){
  if(!h||h.v>=2)return h;
  const c=h.card||{}, team=h.team||teamInYear(career,h.year,fallback);
  const keyOf=name=>Object.keys(LEAGUE.conf.names).find(k=>LEAGUE.conf.names[k]===name)||null;
  const out={v:2, year:h.year, team:team, rec:h.rec, rank:h.rank, result:h.result,
    grade:h.grade, gradeLine:h.gradeLine, champion:h.champion,
    miss:/Short of the mark|A bad year/.test(h.gradeLine||""),
    honours:{title:h.champion===team, group:!!h.confChamp, seed:(h.cfp&&h.cfp[team])||null},
    group:{key:(h.allconf&&h.allconf.conf)||keyOf(c.conf), name:c.conf||"", rec:c.confRec||""},
    bestWin:c.bestWin||null,
    coach:{name:c.coach, titles:c.titles, seasons:c.seasons}};
  if(h.miles)out.miles=h.miles;
  if(h.exp!==undefined)out.exp=h.exp;
  if(h.program!==undefined)out.program=h.program;
  if(h.teams){
    out.teams=h.teams; out.top10=h.top10||[];
    out.groupChamps=h.confChamps||{}; out.seeds=h.cfp||{};
    // the oldest saves have bowls but no postseason tally or notes
    let post=h.post, pnote=h.pnote;
    if(!post&&h.bowls){post={};Object.keys(h.bowls).forEach(t=>{post[t]=h.bowls[t][0]==="W"?[1,0]:[0,1]})}
    if(!pnote&&h.bowls){pnote={};Object.keys(h.bowls).forEach(t=>{
      pnote[t]=(h.bowls[t][0]==="W"?"Won the ":"Lost the ")+h.bowls[t][1]})}
    out.post=post||{}; out.pnote=pnote||{};
    out.awards={mvp:h.heis||[],
      team:h.allconf?{group:h.allconf.conf,list:h.allconf.list||[]}:null};
    out.coaching={fired:!!h.fired, firedList:h.firedList||[], nFired:h.nFired||0,
      hires:h.hires||[], poached:h.poached||[], coordMoves:h.coordMoves||[],
      coachNow:h.coachNow||null};
    out.league=LEAGUE.migrateHistory?LEAGUE.migrateHistory(h):{id:LEAGUE.id};
  }
  return out;
}
function migrateSave(d){
  if(!d)return d;
  if(d.history)d.history=d.history.map(h=>migrateEntry(h,d.career,d.myTeam));
  (d.coaches||[]).forEach(c=>{
    if(c.history)c.history=c.history.map(h=>migrateEntry(h,c.career,c.myTeam))});
  return d;
}
/* ============ the franchise record book: pro hockey ============ */
/* Everyone who leaves a franchise, by retirement, release or free agency,
   is written into its book. Greats are ranked by peak rating; the leaders
   by career totals with the franchise. */
function nflCareerLine(a){
  if(a.line)return a.line;
  const c=a.car, yrs=`${a.yrs} season${a.yrs===1?"":"s"}`;
  if(!c)return yrs;
  const n=x=>(x||0).toLocaleString();
  if(a.p==="G")return c.sv?`${n(c.sv)} saves, ${n(c.so)} shutouts in ${yrs}`:yrs;
  return c.pts?`${n(c.goals)} goals, ${n(c.ast)} assists, ${n(c.pts)} points in ${yrs}`:yrs;
}
const NFL_LEADERS=[
  {k:"pts",label:"Points"},{k:"goals",label:"Goals"},{k:"ast",label:"Assists"},
  {k:"sog",label:"Shots"},{k:"sv",label:"Saves"},{k:"so",label:"Shutouts"}
];
function nflLeaders(u,team){
  const list=(u.alumni&&u.alumni[team])||[], out=[];
  NFL_LEADERS.forEach(cat=>{
    const pool=list.filter(a=>a.car&&a.car[cat.k]>0).map(a=>({a:a,v:a.car[cat.k]})).sort((x,y)=>y.v-x.v);
    if(pool.length)out.push({label:cat.label,top:pool.slice(0,3)});
  });
  return out;
}
function nflBook(u,team){
  return ((u.alumni&&u.alumni[team])||[]).slice().sort((a,b)=>b.peak-a.peak);
}
LEAGUE.records={book:nflBook, leaders:nflLeaders, alumniLine:nflCareerLine};

/* The same season as a line of text, for anywhere an image won't go. */
function seasonCardText(h, team){
  const c={conf:h.group.name, confRec:h.group.rec, bestWin:h.bestWin, coach:h.coach.name};
  const bits=[`${team} ${h.rec} (${c.confRec} ${c.conf})`];
  if(h.champion===team)bits.push(LEAGUE.text.champions.toUpperCase());
  else if(h.honours.group)bits.push(`${c.conf} champions`);
  else if(h.rank)bits.push(`finished No. ${h.rank}`);
  if(c.bestWin)bits.push(`beat ${c.bestWin.rank?"No. "+c.bestWin.rank+" ":""}${c.bestWin.opp} ${c.bestWin.score}`);
  return `${c.coach}, ${h.year}. ${bits.join(" \u2014 ")}. ${LEAGUE.text.site}`;
}

/* Rasterise the SVG to a PNG blob so it can be shared or saved as a real image. */
function cardBlob(svg){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
    img.onload=()=>{
      try{
        const cv=document.createElement("canvas");
        cv.width=CARD_W; cv.height=CARD_H;
        const cx=cv.getContext("2d");
        cx.fillStyle="#10131C"; cx.fillRect(0,0,CARD_W,CARD_H);
        cx.drawImage(img,0,0,CARD_W,CARD_H);
        cv.toBlob(b=>b?resolve(b):reject(new Error("no blob")),"image/png");
      }catch(e){reject(e)}
    };
    img.onerror=()=>reject(new Error("svg load failed"));
    img.src=url;
  });
}

async function shareCard(h, team){
  const svg=seasonCardSVG(h,team);
  const txt=seasonCardText(h,team);
  const name=`${team.replace(/[^A-Za-z]/g,"")}-${h.year}.png`;
  try{
    const blob=await cardBlob(svg);
    const file=new File([blob],name,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],text:txt});
      return "shared";
    }
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    return "saved";
  }catch(e){
    try{ await navigator.clipboard.writeText(txt); return "copied" }
    catch(_){ return "failed" }
  }
}

let nflRankTab="power";

const CLINCH_TITLE={z:"Clinched the conference",y:"Clinched the division",x:"Clinched a playoff place",e:"Eliminated"};

function nflStakes(x){
  const {my,opp,wk,left}=x, out=[];
  const ck=SEA.clinch()[my];
  if(ck==="z")out.push({p:95,tag:"CONFERENCE CLINCHED",l:`The most points in the conference. Home ice through three rounds.`});
  else if(ck==="y")out.push({p:94,tag:"DIVISION CLINCHED",l:`The ${esc(LEAGUE.conf.names[CONF[my]])} is yours. Now it's about home ice.`});
  else if(ck==="x")out.push({p:93,tag:"PLAYOFFS CLINCHED",l:`You're in. What's left is who you play.`});
  else if(ck==="e")out.push({p:92,tag:"ELIMINATED",l:`Out of the race. Play the kids and think about the lottery.`});
  if(wk>=40&&!ck){
    const sd=SEA.sideOf(my), q=SEA.seedsNow()[sd], inTop=new Set();
    LEAGUE.conf.sides[sd].forEach(d=>NAMES.filter(t=>CONF[t]===d).sort((a,b)=>SEA._tb(a,b)).slice(0,3).forEach(t=>inTop.add(t)));
    const rest=q.filter(t=>!inTop.has(t)), wi=rest.indexOf(my);
    if(inTop.has(my))out.push({p:86,tag:"PLAYOFF PLACE",l:`Top three in the ${esc(LEAGUE.conf.names[CONF[my]])} with ${left} to play. Stay there.`});
    else if(wi>=0&&wi<2)out.push({p:88,tag:"WILD CARD",l:`Holding wild card ${wi+1}. ${esc(rest[2]||"")} is ${SEA.pts(rest[wi])-SEA.pts(rest[2]||rest[wi])} points back.`});
    else if(wi>=2&&wi<5)out.push({p:86,tag:"BUBBLE",l:`${SEA.pts(rest[1])-SEA.pts(my)} points out of the last wild card. You need these two.`});
    if(SEA.sideOf(opp)===sd&&Math.abs(SEA.pts(opp)-SEA.pts(my))<=4)out.push({p:82,tag:"FOUR-POINT GAME",l:`${esc(opp)} is right beside you in the standings. Two points for you, none for them.`});
  }
  return out;
}

function nflBracket(){

  if(live&&!isHotSeat())h+=`<div class="note">${esc(ROUND_NAME[mine.round])}: ${esc(mine.hi)} ${mine.w[mine.hi]}, ${esc(mine.lo)} ${mine.w[mine.lo]}.

  if(nbaPostTab==="Final"){
    h+=`<div class="bracket"><div class="bcol"><div class="bhead">Stanley Cup Final</div><div class="bgames">${seriesBox((SEA.series.r4||[])[0])}</div></div></div>`;
  } else h+=confBracket(nbaPostTab);
  return h;
}
/* play out your series without watching, until it's decided (or it needs you) */
function simSeries(){
  let guard=0; const my=S.myTeam;
  while(guard++<10&&SEA.phase!=="done"){
    const x=SEA.mySeries(my); if(!x||x.winner)break;
    const r=SEA.phase.slice(0,2); simAdvance(); if(live)break;
    if(!SEA.phase.startsWith(r))break;
  }
}

/* ============ offseason screens: pro football ============ */
/* The offseason screen (job offers, staff, contracts, free agency, the
   draft, philosophy) and the banner that closes a season. */

/* next year's payroll before free agency: everyone under contract, plus the
   expiring players you've chosen to re-sign at their asking price */
function nflPlannedPay(){
  const R=U.roster[S.myTeam], P=S.off.picks;
  let pay=R.reduce((s,p,i)=>{if(!p)return s;
    if(P.asks&&P.asks[i])return s+(P.resign[i]?P.asks[i].sal:0);
    return s+p.k.sal},0);
  if(P.trade)pay+=P.trade.sal-P.trade.giveSal;          // an agreed trade counts now
  return pay;
}
/* Trade block: put one player under contract on it and see what teams offer. */
function nflHumans(){return (S.coaches||[]).map((c,i)=>i===(S.turn||0)?S.myTeam:c.myTeam)}
function nflTradeHTML(P){
  const R=U.roster[S.myTeam];
  let h=`<div class="grouphead">Trade block</div>`;
  if(P.trade){
    const T=P.trade;
    return h+`<div class="cand on"><div class="candtop"><div><div class="fname">${esc(T.giveName)} for ${esc(T.n)} <span class="dpos">${esc(T.p)}</span></div>
      <div class="fnote">With ${esc(T.team)} &middot; he's rated ${T.r}, age ${T.age}, $${T.sal.toFixed(1)}M for ${T.yrs} more year${T.yrs===1?"":"s"}</div></div>
      <span class="cgrade">agreed</span></div>
      <div class="cdesc">Goes through when the offseason runs.</div>
      <button class="skip small" data-tcancel="1">Call it off</button></div>`;
  }
  if(P.block!==null&&P.block!==undefined&&R[P.block]){
    const g=R[P.block], offers=nflTradeOffers(U,S.myTeam,P.block,nflHumans());
    h+=`<div class="note">${esc(g.n)} (${esc(g.p)}, rated ${g.r}, age ${g.age}, $${g.k.sal.toFixed(1)}M) is on the block.
      <button class="skip small" data-tunblock="1">Take him off</button></div>`;
    h+=offers.length?offers.map((o,k)=>`<div class="drow">
        <div class="fmain"><div class="fname">${esc(o.team)} offer ${esc(o.n)} <span class="dpos">${esc(o.p)}</span></div>
        <div class="fnote">Rated ${o.r}, ceiling ${o.pot}, age ${o.age} &middot; $${o.sal.toFixed(1)}M for ${o.yrs} more year${o.yrs===1?"":"s"}</div></div>
        <button class="skip small" data-taccept="${k}">Accept</button></div>`).join("")
      :`<div class="note">Nobody is offering anything you need for him.</div>`;
    return h;
  }
  const can=R.map((p,i)=>({p:p,i:i})).filter(x=>x.p&&x.p.k.yrs>=2);
  h+=`<div class="note">Put one player under contract on the block and see what teams offer: a player at one of your weakest spots, worth about the same.</div>`;
  h+=can.map(x=>`<div class="drow"><div class="fmain"><div class="fname">${esc(x.p.n)} <span class="dpos">${esc(x.p.p)}</span></div>
      <div class="fnote">${x.i<POS.length?"Starter":"Backup"} &middot; rated ${x.p.r} &middot; age ${x.p.age} &middot; $${x.p.k.sal.toFixed(1)}M</div></div>
      <button class="skip small" data-tblock="${x.i}">Shop him</button></div>`).join("");
  return h;
}
/* Your draft board: players you want, in order. At each of your picks you
   take the highest one still there; if none are left, your style picks. */
function nflBoardHTML(P){
  const C=nflDraftClass(U,S.myTeam), byId={}; C.list.forEach(p=>byId[p.pid]=p);
  const board=(P.board||[]).filter(id=>byId[id]);
  const val=p=>p.sr+(p.spot-p.sr)*0.45;
  const row=(p,i,on)=>`<div class="drow">
      <span class="dpick">${on?(i+1)+".":""}</span>
      <div class="fmain"><div class="fname">${esc(p.n)} <span class="dpos">${esc(p.p)}</span></div>
        <div class="fnote">${esc(p.from)} &middot; age ${p.age} &middot; scouts say ~${p.sr}, ceiling ~${p.spot}</div></div>
      <button class="skip small" ${on?`data-bdrm="${p.pid}"`:`data-bdadd="${p.pid}"`}>${on?"Remove":"Add"}</button></div>`;
  let h=`<div class="grouphead">Your draft board</div>`;
  h+=board.length?board.map((id,i)=>row(byId[id],i,true)).join("")
     :`<div class="note">Empty: your draft style will choose. Add players below and you'll take the highest one still there at each of your picks.</div>`;
  const pool=C.list.filter(p=>board.indexOf(p.pid)<0).sort((a,b)=>val(b)-val(a)).slice(0,30);
  h+=`<div class="grouphead">The class &mdash; best 30 by your scouts</div>`+pool.map(p=>row(p,0,false)).join("");
  return h;
}
/* Free agents you want, in order. They get your first look when free agency
   opens, at the asking price plus about 10%, if they fit; then your style
   fills whatever is left. */
function nflTargetsHTML(P,room){
  const pre=nflFreeAgentPreview(U,S.myTeam), byKey={}; pre.forEach(x=>byKey[x.key]=x);
  const mine=(P.targets||[]).filter(k=>byKey[k]);
  let left=room-8;                                  // leave room for the draft class
  const seenPos={};
  const row=(x,on,i)=>{ let fit="";
      if(on){left-=x.ask; fit=left>=0?"fits":"won't fit as things stand";
        if(seenPos[x.p])fit="you already want a "+x.p+": only one can be signed"; seenPos[x.p]=1}
      return `<div class="drow">
      <span class="dpick">${on?(i+1)+".":""}</span>
      <div class="fmain"><div class="fname">${esc(x.n)} <span class="dpos">${esc(x.p)}</span></div>
        <div class="fnote">${esc(x.team)} &middot; age ${x.age} &middot; rated ${x.r} &middot; about $${x.ask.toFixed(1)}M${on?" &middot; "+fit:""}</div></div>
      <button class="skip small" ${on?`data-fatrm="${esc(x.key)}"`:`data-fatadd="${esc(x.key)}"`}>${on?"Remove":"Add"}</button></div>`};
  let h=`<div class="grouphead">Free agents you want</div>`;
  h+=mine.length?mine.map((k,i)=>row(byKey[k],true,i)).join("")
    :`<div class="note">None yet: your free-agency style will decide. Players you add get your first look, in your order, if you have the room.</div>`;
  const pool=pre.filter(x=>mine.indexOf(x.key)<0).slice(0,25);
  h+=`<div class="grouphead">Likely free agents &mdash; the best 25</div>`+
    (pool.length?pool.map(x=>row(x,false)).join(""):`<div class="note">Nobody worth chasing this year.</div>`);
  return h;
}
function nflPickSlot(){
  const o=nflDraftOrder(SEA.rec,SEA.elo).indexOf(S.myTeam)+1;
  return o+(o===1?"st":o===2?"nd":o===3?"rd":"th");
}

function stashCoach(){

function loadCoach(i){

function startLive(g,step){

  const e=h2h?h2hElo(g,step,oj):SEA.matchupElo(g,plan);
  const rng=new RNG(liveSeed(step));

  const oppPlan=h2h?((S.coaches[oj].plans&&S.coaches[oj].plans[step])||"balanced"):"balanced";
  live={g:g, step:step,

              h2h?{home:true,away:true}:userIsHome),
        drives:[], ask:null, done:false,

function liveTick(){
  if(!live)return;
  if(live.timer){clearTimeout(live.timer);live.timer=null}
  if(!live.kicked){                       // a beat on the empty field first
    live.kicked=true;
    render();
    if(!live.paused){live.timer=setTimeout(liveTick,650);return}
    return;
  }
  let guard=0;
  while(guard++<200){
    const r=live.eng.next();
    if(r.done){ live.done=true; finishLive(); return }
    if(r.ask){
      if(live.ri<live.replay.length){          // answered before, keep going
        live.eng.reply(live.replay[live.ri++]);

      }
      live.ask={dp:r.ask, mine:r.mine, theirs:r.theirs,
                team:r.side?(r.side==="home"?live.g.home:live.g.away):S.myTeam};
      render();
      return;
    }
    live.drives.push(r.drive);
    break;
  }
  render();
  if(!live.paused&&!live.done&&!live.ask){
    live.timer=setTimeout(liveTick, liveGap());
  }
}
function liveGap(){

function answerLive(v){

function finishLive(){

              mine:(meHome?live.eng.h:live.eng.a),
              theirs:(meHome?live.eng.a:live.eng.h),
              drives:live.drives};
  if(LEAGUE.tracksOT){played.ot=live.eng.ot||0; played.so=!!live.eng.so}
  SEA.forcedList=SEA.forcedList||[];
  SEA.forcedList.push(played);
  // keep it in the save: a reload must replay this result, not re-simulate
  S.played=S.played||{};
  const pk=callKey(live.step);
  S.played[pk]=(S.played[pk]||[]).concat([JSON.parse(JSON.stringify(played))]);
  const step=live.step;
  live.result={hp:live.eng.h,ap:live.eng.a,
               mine:(g.home===S.myTeam?live.eng.h:live.eng.a)};

  if(isHotSeat() && (S.turn||0) < coachCount()-1){
    stashCoach();

    loadCoach((S.turn||0)+1);

/* Everyone has had their turn: play out the rest of the league. */
function resolveWeek(step){

function endLive(){
  if(live&&live.timer)clearTimeout(live.timer);
  if(live&&!live.done){                        // skip: run the rest instantly
    let guard=0;
    while(guard++<400){
      const r=live.eng.next();
      if(r.done)break;
      // a skipped game's remaining calls take the neutral option (the last:
      // stay the course, play it straight), not the aggressive first one
      if(r.ask){ const v=r.ask.opts[r.ask.opts.length-1][0]; live.eng.reply(v);
        S.calls=S.calls||{};const k=callKey(live.step);
        S.calls[k]=(S.calls[k]||[]).concat([v]); continue }
      live.drives.push(r.drive);
    }

  }

let saveOK=null;                     // did the last save land? null = not tried yet
/* Saves are coalesced: calls made in the same burst share one save, of the
   state as it stands when it runs (compressing a long career takes a
   moment). In a browser it runs after the screen has drawn. */
let savePending=null;
function save(){
  if(savePending)return savePending;
  savePending=(async()=>{
    if(typeof requestAnimationFrame==="function")
      await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
    else await Promise.resolve();
    savePending=null;
    S.league=LEAGUE.id;                                   // every save says which game it's from
  try{saveOK=!!(await store.set(KEYFOR(slot),lzwPack(saveText(S))))}catch(e){saveOK=false}
    return saveOK;
  })();
  return savePending;
}
/* The active coach's stash in S.coaches holds a copy of S.history (and it
   is S.history that's current): saved as a marker, not a second copy, and
   restored on load. A 30-season basketball save was 9.2 MB, a third of it
   this duplicate. */
function saveText(S){
  if(!S.coaches||!S.coaches.length)return JSON.stringify(S);
  const t=S.turn||0, cs=S.coaches.map((c,i)=>i===t&&c&&c.history?Object.assign({},c,{history:"@S.history"}):c);
  return JSON.stringify(Object.assign({},S,{coaches:cs}));
}
function unsaveDup(d){
  (d.coaches||[]).forEach(c=>{ if(c&&c.history==="@S.history")c.history=d.history });

}
/* which game a save belongs to: new saves say; older ones are told apart by
   their players (pro players have contracts; basketball players play PG-C) */
function saveLeague(d){
  if(!d)return null;
  if(d.league)return d.league;
  const R=d.uStart&&d.uStart.roster; if(!R)return "cfb";
  for(const t in R){const ps=(R[t]||[]).filter(x=>x).map(x=>x.p), p=(R[t]||[]).find(x=>x); if(!p)continue;
    if(ps.indexOf("G")>=0||ps.indexOf("LW")>=0)return "nhl";      // hockey: wingers and goalies (it has a C too)
    const hoops=["PG","SG","SF","PF","C"].indexOf(p.p)>=0;      // basketball positions first:
    if(hoops)return p.k?"nba":"ncaab";                            // pro basketball has contracts too
    return p.k?"nfl":"cfb"}
  return "cfb";
}
/* Move other games' saves out of the old shared slots into their own game's
   slots (first free one), once, whichever game is opened first. A save is
   removed from the old slot only after its copy has been written. */
let slotsMoved=false;
async function moveForeignSaves(){
  if(slotsMoved)return; slotsMoved=true;
  for(let n=1;n<=NSLOTS;n++){
    try{
      const r=await store.get(LEGACY_KEY+"-slot"+n); if(!r)continue;
      const lg=saveLeague(JSON.parse(lzwUnpack(r.value)));
      if(!lg||lg==="cfb"||!SAVE_KEYS[lg])continue;
      let dest=null;
      for(const m of [n].concat([1,2,3].filter(x=>x!==n))){
        if(!(await store.get(SAVE_KEYS[lg]+"-slot"+m))){dest=m;break}
      }
      if(!dest)continue;                              // nowhere to put it: leave it where it is
      const ok=await store.set(SAVE_KEYS[lg]+"-slot"+dest,r.value);
      const back=ok&&await store.get(SAVE_KEYS[lg]+"-slot"+dest);
      if(back&&back.value===r.value)await store.delete(LEGACY_KEY+"-slot"+n);
    }catch(e){}
  }
}
async function loadSlot(n){
  await moveForeignSaves();
  try{const r=await store.get(KEYFOR(n)); if(!r)return null;
    const d=unsaveDup(JSON.parse(lzwUnpack(r.value)));
    if(saveLeague(d)!==LEAGUE.id)return null;        // never open another game's save
    return migrateSave(d)}catch(e){return null}
}
async function allSlots(){
  const out=[];
  for(let n=1;n<=NSLOTS;n++){
    const d=await loadSlot(n);
    out.push(d&&d.myTeam?{n:n,team:d.myTeam,year:(d.uStart&&d.uStart.year)||2026,
      coach:(d.career&&d.career.name)||"",seasons:(d.history||[]).length,
      rec:d.career?d.career.w+"-"+d.career.l:"",titles:d.career?d.career.titles:0}:{n:n,empty:true});
  }
  return out;
}

function newDynasty(team,seed,coachName,roster){

  S={seed:seed,uStart:null,seasonSeed:0,steps:0,origProgram:null,
